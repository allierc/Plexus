  movie_neuron:
    description: The video shows a static distribution of blue particles against a black background. There
      is no movement or evolution of the particles over the sequence of frames. The spatial arrangement
      of the points remains constant throughout the entire duration. The simulation appears to be a still
      image repeated multiple times.
    objects: The scene contains a large number of small, blue, point-like particles. These particles are
      organized into two distinct, elongated clusters that are oriented diagonally. The clusters are separated
      by a narrow gap in the center of the frame. Each individual particle is uniform in size and color,
      creating a dense, speckled texture.
