# ctrnn_assemblies -- a continuous-time recurrent circuit as a Plexus composition.
#
# THE MODEL (Allier et al., "Graph neural networks uncover structure and function underlying the
# activity of neural assemblies", eqn. simulation):
#
#     dx_i/dt = -x_i/tau_i + s_i tanh(x_i) + g_i Omega_i(t) SUM_j W_ij psi_ij(x_j)
#
# expressed as TWO operators whose deltas the engine sums -- `neuron_update` (the local update
# phi) and `neuron_signal` (the pairwise signalling psi through W) -- plus `neuron_field_input`,
# which samples the external field Omega onto each neuron before psi reads it.
#
# THE HIERARCHY IS ORDINARY CONTAINMENT, and that is the point of running this model here at all:
#
#     brain -> assembly -> neuron        the same `parent` map that relates particles to a cell
#     synapse                            an EDGE-SET whose elements are connections (pre/post)
#
# An assembly is not a new primitive; it is a set at another scale. The connectivity matrix is not
# a dense tensor inside an operator; it is the `w` state of the synapse set.
#
# UNITS: none declared -- this run is dimensionless. tau, g and dt are numbers, and no result from
# it may be quoted with a unit. Stated here rather than left to be inferred from a plot axis.
#
# GENERATED connectivity: 3 assemblies of 8, p_within=0.45 / p_cross=0.10, weights ~ N(0, 1/sqrt(N))
# with within-assembly coupling boosted 1.8x, seed 7. Inline because the language has no
# `edges_file:` yet -- which is what caps this demo at 24 neurons.
general:
  name: ctrnn_assemblies
  seed: 0
  n_frames: 600
  dt: 0.1
  dim: 2
  world: 1.0
  boundary: wall

sets:
  brain:
    n: 1

  # one scale up from the neuron: a group, with a position and a readout of its own
  assembly:
    parent: brain
    per_parent: 3
    radius: 0.30

  # the neuron's state layout is NOT written here -- it comes from the registered `neuron`
  # entity (models/entities.py): pos (fixed geometry), voltage (the integrated coordinate),
  # omega (the external modulation channel).
  neuron:
    parent: assembly
    per_parent: 8
    radius: 0.10
    # FOUR NEURON TYPES, differing in the parameters of the update equation.
    #   p = [a, b, g, s, w, h]
    #       a decay (1/tau) | b offset | g gain | s self-coupling | w psi width | h psi threshold
    types:
      slow_quiet:  {fraction: 0.25, p: [0.5, 0.0, 4.0, 0.5, 1.00, 0.0]}
      slow_bursty: {fraction: 0.25, p: [0.5, 0.0, 4.0, 2.0, 0.50, 0.0]}
      fast_quiet:  {fraction: 0.25, p: [2.0, 0.0, 4.0, 0.5, 2.00, 0.0]}
      fast_bursty: {fraction: 0.25, p: [2.0, 0.0, 4.0, 2.0, 0.25, 0.0]}

  # the connectivity matrix, in the language: one element per connection, joined to the neuron
  # set by the `pre`/`post` incidence maps, carrying W_e in its `w` block.
  synapse:
    parent: brain
    edge_set: true
    pre: neuron
    post: neuron
    edges:
    - [0, 1]
    - [0, 2]
    - [0, 4]
    - [0, 5]
    - [0, 6]
    - [0, 7]
    - [0, 16]
