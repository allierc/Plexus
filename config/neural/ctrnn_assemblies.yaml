fields:
  # Omega(x, y, t): a travelling activation that scales what a neuron hears from the network.
  # A plain grid field driven by an operator the library already has.
  omega:
    frame: grid
    res: 64
    components: 1

operators:
  - op: activation_pulse
    at: omega
    period: 120
    duration: 60
    radius: 0.35
    center: [0.3, 0.5]

  - op: neuron_field_input        # Omega -> the neuron's `omega` block. MUST precede neuron_signal.
    at: neuron
    from: omega
    offset: 1.0                   # baseline 1 = unmodulated, the reference's own convention

  - op: neuron_update             # phi: -a x + b + s tanh(x)
    at: neuron
    model: leaky_tanh
    noise: 0.02

  - op: neuron_signal             # psi: g * Omega * SUM_e W_e psi(x_pre)
    at: neuron
    model: type_pairwise          # the receiver's width, the sender's threshold and linear term
    edge_set: synapse
    activation: tanh
    field: omega

  # the cross-scale readout: each assembly's `activity` is the mean voltage of its neurons,
  # reduced along the SAME `parent` containment map that gives a cell its centroid.
  - op: aggregate
    at: assembly
    child: neuron
    block: voltage
    into: activity

schedule:
  - activation_pulse
  - neuron_field_input
  - neuron_update
  - neuron_signal
  - aggregate

plotting:
  renderer: mpl2d
  background: black
  point_size: 6.0
