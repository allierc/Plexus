# zf_Hindbrain_8192 -- 8147 larval-zebrafish neurons of the Hindbrain, the largest of the
# scale series (1000 / 4096 / 8192). `p` is 20/N = 0.00245, holding MEAN
# IN-DEGREE at ~20 so scale does not confound connectivity.
general:
  name: zf_Hindbrain_8192
  seed: 0
  n_frames: 2000
  dt: 0.05
  dim: 3
  world: [1.0, 1.0, 1.0]
  boundary: wall
  record_cap: 2001
  field_record_cap: 250
  units:
    length_um: 104.412109375
    time_s: 1.0
sets:
  brain: {n: 1}
  assembly: {parent: brain, per_parent: 1}
  neuron:
    parent: assembly
    per_parent: 8147
    types:
      slow_quiet:  {fraction: 0.25, p: [1.0, 0.0, 1.2, 0.5, 1.00, 0.0]}
      slow_bursty: {fraction: 0.25, p: [1.0, 0.0, 1.2, 1.6, 0.50, 0.0]}
      fast_quiet:  {fraction: 0.25, p: [2.5, 0.0, 1.2, 0.5, 2.00, 0.0]}
      fast_bursty: {fraction: 0.25, p: [2.5, 0.0, 1.2, 1.6, 0.25, 0.0]}
  synapse:
    parent: brain
    edge_set: true
    pre: neuron
    post: neuron
    edges_file: neural_regions/zf_Hindbrain_8192/connectome.npz
fields:
  neural_activity: {frame: grid, res: 128, components: 1, couples_to: assembly}
seed:
  - {op: neural_seed, at: neuron, region: zf_Hindbrain_8192, v0_mean: 0.0, v0_sd: 0.5}
operators:
  - {op: neuron_update, at: neuron, model: leaky_tanh, noise: 0.01}
  - {op: neuron_signal, at: neuron, model: type_pairwise, edge_set: synapse, activation: tanh}
  - {op: aggregate, at: assembly, child: neuron, block: voltage, into: activity}
  - {op: voxelize, at: neuron, to: neural_activity, block: voltage, kernel: gaussian,
      sigma: 6.0, normalize: none}
schedule: [neuron_update, neuron_signal, aggregate, voxelize]
plotting: {renderer: vtk_points, background: black, point_size: 4.0}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_assembly:
    description: A single blue point remains stationary in the center of a black field throughout the
      entire sequence. There is no movement, expansion, or change in the position of the object over time.
      The scene is static, showing a constant state without any evolution or interaction. The video represents
      a fixed point in space with no dynamic progression.
    objects: The scene contains a single, small point located at the center of the frame. This object
      is a bright blue color, contrasting sharply against the background. It is a singular, isolated point
      with no connections to other objects. The size of the point is very small relative to the large,
      black surrounding area.
  movie_brain:
    description: A single blue point remains stationary in the center of a black field throughout the
      entire sequence. There is no movement, expansion, or change in the position of the object over time.
      The scene is static, showing a constant state without any evolution or interaction. The video represents
      a fixed point in space with no dynamic progression.
    objects: The scene contains a single, small point located at the center of the frame. This object
      is a bright blue color, providing a sharp contrast against the background. It is a singular, isolated
      point with no connections to other objects or structures. The size of the point is very small relative
      to the large, black rectangular field.
  movie_neural_activity:
    description: The simulation shows a cluster of white particles that gradually becomes more defined
      and structured over time. Initially, the particles appear as a blurry, amorphous cloud with indistinct
      boundaries. As the sequence progresses, the individual components begin to separate and align into
      a more organized, crystalline-like formation. By the final frame, the cluster has reached a high
      level of clarity, revealing a complex, interlocking geometric arrangement.
    objects: The scene contains a collection of white, irregularly shaped particles clustered together
      in a central mass. These particles are arranged in a dense, interconnected topology that resembles
      a porous mineral or a snowflake. Each individual particle varies in size, ranging from small specks
      to larger, more prominent chunks. The overall structure is set against a solid black background,
      which emphasizes the bright, high-contrast appearance of the white objects.
  movie_neuron:
    description: The simulation shows a dense collection of blue particles arranged in two distinct, overlapping
      rectangular blocks. Over the course of the video, the particles remain in a relatively static position
      with very subtle fluctuations in their distribution. There is no significant movement, expansion,
      or transformation of the overall structure. The scene maintains a consistent appearance throughout
      the entire time sequence.
    objects: The scene contains two large, rectangular clusters of small blue particles. These clusters
      are positioned diagonally and overlap in the center of the frame. Each individual particle is tiny
      and appears as a single blue dot against the black background. The overall topology consists of
      two dense, semi-transparent volumes of points.
