fields:
  omega:
    frame: grid
    res: 64
    components: 1
operators:
- op: activation_pulse
  at: omega
  period: 120
  duration: 60
  radius: 0.35
  center:
  - 0.3
  - 0.5
- op: neuron_field_input
  at: neuron
  from: omega
  offset: 1.0
- op: neuron_update
  at: neuron
  model: leaky_tanh
  noise: 0.02
- op: neuron_signal
  at: neuron
  model: type_pairwise
  edge_set: synapse
  activation: tanh
  field: omega
schedule:
- activation_pulse
- neuron_field_input
- neuron_update
- neuron_signal
plotting:
  renderer: vtk_points
  background: black
  subject: neuron
  color_field: voltage
  field_cmap: coolwarm
  color_range:
  - -2.0
  - 2.0
  point_size: 14.0
  dot_size: 14.0
  graph_overlay:
    sets:
    - synapse
    always: true
    opacity: 0.3
    line_width: 1.0
  colors:
    synapse:
    - 0.6
    - 0.6
    - 0.7
  max_frames: 300
  stills: 10
  keep_stills: true
  box_frame: false
