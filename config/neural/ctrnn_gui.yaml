fields:
  omega:
    frame: grid
    res: 64
    components: 1
operators:
- op: pacemaker
  at: omega
  period: 120
  duration: 60
- op: activation_pulse
  at: omega
  period: 120
  duration: 60
  radius: 0.35
  center:
  - 0.3
  - 0.5
- op: neuron_field_input
  at: neuron
  from: omega
  offset: 1.0
- op: neuron_drive
  at: neuron[type=E_aff]
  from: omega
  gain: 1.0
- op: neuron_update
  at: neuron
  model: leaky_tanh
  noise: 0.02
- op: neuron_signal
  at: neuron
  model: type_pairwise
  edge_set: synapse
  activation: tanh
  field: omega
schedule:
- pacemaker
- activation_pulse
- neuron_field_input
- neuron_drive
- neuron_update
- neuron_signal
plotting:
  renderer: neural_panel
  background: black
  panel:
    input:
    - E_aff
    output:
    - E_aff
    - E
    - I
    kino_frames: 300
  max_frames: 300
  stills: 10
  keep_stills: true
