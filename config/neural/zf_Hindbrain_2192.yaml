# zf_Hindbrain_2192 -- 2197 larval-zebrafish neurons of the Hindbrain, the intermediate scale
# between the 1000- and 4096-neuron sets. DERIVED WITHOUT A FETCH: the parent
# zf_Hindbrain_4096 cube was shrunk about its own centre from 77.10 um
# to 62.04 um until 2197 somas remained, so this is a genuine cube of tissue at the
# SAME DENSITY as its parent rather than a thinned subsample of it. `p` is 20/N =
# 0.00910, holding MEAN IN-DEGREE at ~20 as at 1000 (p=0.02) and 4096 (p=0.005).
general:
  name: zf_Hindbrain_2192
  seed: 0
  n_frames: 2000
  dt: 0.05
  dim: 3
  world: [1.0, 1.0, 1.0]
  boundary: wall
  record_cap: 2001
  field_record_cap: 250
  units:
    length_um: 62.03794860839844
    time_s: 1.0
sets:
  brain: {n: 1}
  assembly: {parent: brain, per_parent: 1}
  neuron:
    parent: assembly
    per_parent: 2197
    types:
      slow_quiet:  {fraction: 0.25, p: [1.0, 0.0, 1.2, 0.5, 1.00, 0.0]}
      slow_bursty: {fraction: 0.25, p: [1.0, 0.0, 1.2, 1.6, 0.50, 0.0]}
      fast_quiet:  {fraction: 0.25, p: [2.5, 0.0, 1.2, 0.5, 2.00, 0.0]}
      fast_bursty: {fraction: 0.25, p: [2.5, 0.0, 1.2, 1.6, 0.25, 0.0]}
  synapse:
    parent: brain
    edge_set: true
    pre: neuron
    post: neuron
    edges_file: neural_regions/zf_Hindbrain_2192/connectome.npz
fields:
  neural_activity: {frame: grid, res: 128, components: 1, couples_to: assembly}
seed:
  - {op: neural_seed, at: neuron, region: zf_Hindbrain_2192, v0_mean: 0.0, v0_sd: 0.5}
operators:
  - {op: neuron_update, at: neuron, model: leaky_tanh, noise: 0.01}
  - {op: neuron_signal, at: neuron, model: type_pairwise, edge_set: synapse, activation: tanh}
  - {op: voxelize, at: neuron, to: neural_activity, block: voltage, kernel: gaussian,
      sigma: 6.0, normalize: none}
schedule: [neuron_update, neuron_signal, voxelize]
plotting: {renderer: vtk_points, background: black, point_size: 4.0}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_assembly:
    description: A single blue point remains stationary in the center of a black field throughout the
      entire sequence. There is no movement, expansion, or change in the position of the object over time.
      The scene is static, showing a constant state without any evolution or interaction. The video represents
      a fixed point in space with no dynamic progression.
    objects: The scene contains a single, small point located at the center of the frame. This object
      is a bright blue color, contrasting sharply against the background. It is a singular, isolated point
      with no connections to other objects. The size of the point is very small relative to the large,
      black surrounding area.
  movie_brain:
    description: A single blue point remains stationary in the center of a black field throughout the
      entire sequence. There is no movement, expansion, or change in the position of the object over time.
      The scene is static, showing a constant state without any evolution or interaction. The video represents
      a fixed point in space with no dynamic progression.
    objects: The scene contains a single, small point located at the center of the frame. This object
      is a bright blue color, providing a sharp contrast against the background. It is a singular, isolated
      point with no connections to other objects or structures. The size of the point is very small relative
      to the large, black rectangular field.
  movie_neural_activity:
    description: The simulation shows a cluster of white particles that gradually shifts and rotates in
      a dark space. As time progresses, the internal structure of the cluster becomes more defined and
      compact. The overall shape maintains a roughly diamond-like orientation while the individual components
      move relative to one another. By the final frame, the cluster appears more consolidated and slightly
      more elongated.
    objects: The scene contains a collection of white, irregularly shaped particles clustered together.
      These particles are arranged in a dense, interconnected group that forms a larger, roughly diamond-shaped
      mass. Each individual particle is small and varies in size, creating a textured and porous appearance.
      The white color of the objects provides a high contrast against the solid black background.
  movie_neuron:
    description: The video shows a static distribution of blue particles against a black background. There
      is no visible movement or evolution of the particles across the keyframes. The spatial arrangement
      of the points remains constant throughout the sequence. The simulation appears to be a steady-state
      representation of a point cloud.
    objects: The scene contains a large number of small, individual blue dots. These particles are arranged
      in a roughly diamond-shaped cluster. The dots are uniformly distributed with no apparent connections
      or physical links between them. Each point is of a consistent size and brightness relative to the
      black void.
