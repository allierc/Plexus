  movie_neuron:
    description: The simulation shows a dense cloud of blue particles arranged in a diamond-shaped formation.
      Over time, the particles appear to undergo a subtle internal reorganization or shift in density.
      The overall structure remains stable, maintaining its primary geometric boundaries throughout the
      sequence. There is no significant expansion or contraction of the global cluster during the observed
      period.
    objects: The scene contains a large collection of small, individual blue points. These points are
      clustered together to form a large, roughly diamond-shaped volume. The particles are distributed
      with varying density, creating a textured, granular appearance. Each individual point is uniform
