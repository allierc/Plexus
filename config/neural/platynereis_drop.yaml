descriptions:
  movie:
    description: A complex, irregular white structure is positioned in the center
      of a large black cubic domain. Over the course of the simulation, the structure
      undergoes a subtle deformation and slight rotation. The overall shape remains
      relatively stable, maintaining its core integrity while shifting its orientation.
      The simulation concludes with the object in a slightly different pose than its
      initial state.
    objects: The primary object is a white, porous, and highly irregular cluster of
      particles. It is located in the center of a large, black, wireframe cube. The
      cube serves as a bounding box with a scale bar indicating a dimension of 100
      mm. The white structure appears to be a complex porous medium or a cluster of
      aggregated particles.
