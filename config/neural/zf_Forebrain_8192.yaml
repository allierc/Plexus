# zf_Forebrain_8192 -- 8038 larval-zebrafish neurons of the Forebrain, the largest of the
# scale series (1000 / 4096 / 8192). `p` is 20/N = 0.00249, holding MEAN
# IN-DEGREE at ~20 so scale does not confound connectivity.
general:
  name: zf_Forebrain_8192
  seed: 0
  n_frames: 2000
  dt: 0.05
  dim: 3
  world: [1.0, 1.0, 1.0]
  boundary: wall
  record_cap: 2001
  field_record_cap: 250
  units:
    length_um: 106.36328125
    time_s: 1.0
sets:
  brain: {n: 1}
  assembly: {parent: brain, per_parent: 1}
  neuron:
    parent: assembly
    per_parent: 8038
    types:
      slow_quiet:  {fraction: 0.25, p: [1.0, 0.0, 1.2, 0.5, 1.00, 0.0]}
      slow_bursty: {fraction: 0.25, p: [1.0, 0.0, 1.2, 1.6, 0.50, 0.0]}
      fast_quiet:  {fraction: 0.25, p: [2.5, 0.0, 1.2, 0.5, 2.00, 0.0]}
      fast_bursty: {fraction: 0.25, p: [2.5, 0.0, 1.2, 1.6, 0.25, 0.0]}
  synapse:
    parent: brain
    edge_set: true
    pre: neuron
    post: neuron
    edges_file: neural_regions/zf_Forebrain_8192/connectome.npz
fields:
  neural_activity: {frame: grid, res: 128, components: 1, couples_to: assembly}
seed:
  - {op: neural_seed, at: neuron, region: zf_Forebrain_8192, v0_mean: 0.0, v0_sd: 0.5}
operators:
  - {op: neuron_update, at: neuron, model: leaky_tanh, noise: 0.01}
  - {op: neuron_signal, at: neuron, model: type_pairwise, edge_set: synapse, activation: tanh}
  - {op: voxelize, at: neuron, to: neural_activity, block: voltage, kernel: gaussian,
      sigma: 6.0, normalize: none}
schedule: [neuron_update, neuron_signal, voxelize]
plotting: {renderer: vtk_points, background: black, point_size: 4.0}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_assembly:
    description: A single blue point remains stationary in the center of a black field throughout the
      entire sequence. There is no movement, expansion, or change in the position of the object over time.
      The scene is static, showing a constant state without any evolution or interaction. The video represents
      a fixed point in space with no dynamic progression.
    objects: The scene contains a single, small point located at the center of the frame. This object
      is a bright blue color, contrasting sharply against the background. It is a singular, isolated point
      with no connections to other objects. The size of the point is very small relative to the large,
      black surrounding area.
  movie_brain:
    description: A single blue point remains stationary in the center of a black field throughout the
      entire sequence. There is no movement, expansion, or change in the position of the object over time.
      The scene is static, showing a constant state without any evolution or interaction. The video represents
      a fixed point in space with no dynamic progression.
    objects: The scene contains a single, small point located at the center of the frame. This object
      is a bright blue color, providing a sharp contrast against the background. It is a singular, isolated
      point with no connections to other objects or structures. The size of the point is very small relative
      to the large, black rectangular field.
  movie_neural_activity:
    description: The simulation shows a complex, turbulent field of white and grey matter evolving against
      a black background. Over time, the internal structures shift and reorganize, exhibiting fluid-like
      motion and swirling patterns. The overall shape of the cluster remains relatively stable while the
      internal density and orientation of the sub-structures fluctuate. By the final frame, the field
      appears more defined and structured compared to the initial blurred state.
    objects: The scene contains a single, large, irregular cluster of interconnected white and grey masses.
      These masses are arranged in a dense, chaotic topology that resembles turbulent smoke or a cloud
      of particles. The objects vary in size, with some large, bright cores surrounded by smaller, dimmer
      wisps. The color palette is strictly monochromatic, featuring shades of white and grey against a
      solid black void.
  movie_neuron:
    description: The simulation shows a dense cloud of blue particles that remains largely static in its
      overall structure. There is no significant movement or evolution of the particle distribution across
      the timeframes. The spatial arrangement of the points stays consistent throughout the sequence.
      The scene represents a steady-state configuration of a point cloud.
    objects: The scene contains a large collection of small, individual blue points. These points are
      arranged into two primary, elongated clusters that are oriented diagonally. The clusters are separated
      by a narrow, dark gap in the center of the frame. Each point is uniform in size and color, creating
      a textured, grainy appearance.
