    objects: A central complex structure is composed of interconnected orange and blue lobes nested within
      a larger, translucent grey spherical shell. Numerous small green and purple dots are scattered throughout
      the 3D space, representing individual particles or agents. The grey shell acts as a boundary, containing
      the primary biological components while allowing the smaller particles to move freely. The three
      graphs on the right provide quantitative data, showing the evolution of charge, dipole, and membrane
      tension over the time axis.
