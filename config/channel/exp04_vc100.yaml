general:
  name: exp04_vc100
  seed: 0
  n_frames: 5998
  dt: 1.528192087632647e-07
  boundary: wall
  dim: 3
  world: [1.0, 1.0, 1.0]
  save_data: true
  record_cap: 301
  field_record_cap: 2
  units: {length_um: 0.022, time_s: 6.659259172280847e-07, force_nN: 0.0001868181818181818}
sets:
  cell:
    n: 1
    start:
    - [0.5, 0.5, 0.5]
    state:
      pos: {width: 3, role: coordinate, integration: none, boundary: world, title: position}
      psi: {width: 1, integration: first_order, unit: voltage, title: membrane potential}
      j_channel: {width: 1, integration: none, unit: current, title: channel current}
      g_channel: {width: 1, integration: none, unit: '1', title: channel conductance}
      tension: {width: 1, integration: none, unit: tension, title: membrane tension}
      tension_applied: {width: 1, integration: none, unit: tension, title: applied tension}
      strain: {width: 1, integration: none, unit: '1', title: membrane strain}
      pore_r: {width: 1, integration: none, unit: length, title: pore radius}
    title: the cell's interior (the voltage-clamped compartment)
  SelfTest_1:
    n: 60
    start:
    - [0.5, 0.5, 0.5]
    state:
      pos: {width: 3, role: coordinate, integration: first_order, boundary: world, title: position}
      domain: {width: 1, integration: none, unit: '1', title: protein domain}
    title: test protein, chain 1
  SelfTest_2:
    n: 60
    start:
    - [0.5, 0.5, 0.5]
    state:
      pos: {width: 3, role: coordinate, integration: first_order, boundary: world, title: position}
      domain: {width: 1, integration: none, unit: '1', title: protein domain}
    title: test protein, chain 2
  SelfTest_3:
    n: 60
    start:
    - [0.5, 0.5, 0.5]
    state:
      pos: {width: 3, role: coordinate, integration: first_order, boundary: world, title: position}
      domain: {width: 1, integration: none, unit: '1', title: protein domain}
    title: test protein, chain 3
  SelfTest_4:
    n: 60
    start:
    - [0.5, 0.5, 0.5]
    state:
      pos: {width: 3, role: coordinate, integration: first_order, boundary: world, title: position}
      domain: {width: 1, integration: none, unit: '1', title: protein domain}
    title: test protein, chain 4
  SelfTest_5:
    n: 60
    start:
    - [0.5, 0.5, 0.5]
    state:
      pos: {width: 3, role: coordinate, integration: first_order, boundary: world, title: position}
      domain: {width: 1, integration: none, unit: '1', title: protein domain}
    title: test protein, chain 5
  lipid:
    n: 529
    start:
    - [0.5, 0.5, 0.5]
    state:
      pos: {width: 3, role: coordinate, integration: first_order, boundary: world, title: position}
    title: membrane lipids
  frame:
    n: 264
    start:
    - [0.5, 0.5, 0.5]
    state:
      pos: {width: 3, role: coordinate, integration: none, boundary: world, title: position}
      force: {width: 3, integration: none, unit: force, title: force from the ions}
    title: frozen lipids at the patch's rim (they hold the tension)
fields:
  elec: {frame: grid, res: 64, components: 1, title: electric potential in the electrolyte}
seed:
- op: cloud_seed
  at: SelfTest_1
  cloud: exp04_selftest/c0
  origin: [0.5, 0.5, 0.5]
  scale: 45454545.45454545
- op: cloud_seed
  at: SelfTest_2
  cloud: exp04_selftest/c1
  origin: [0.5, 0.5, 0.5]
  scale: 45454545.45454545
- op: cloud_seed
  at: SelfTest_3
  cloud: exp04_selftest/c2
  origin: [0.5, 0.5, 0.5]
  scale: 45454545.45454545
- op: cloud_seed
  at: SelfTest_4
  cloud: exp04_selftest/c3
  origin: [0.5, 0.5, 0.5]
  scale: 45454545.45454545
- op: cloud_seed
  at: SelfTest_5
  cloud: exp04_selftest/c4
  origin: [0.5, 0.5, 0.5]
  scale: 45454545.45454545
- op: seed_state_from_file
  at: SelfTest_1
  file: shapes/exp04_selftest/blocks.npz
  blocks: {domain: c0_domain}
- op: seed_state_from_file
  at: SelfTest_2
  file: shapes/exp04_selftest/blocks.npz
  blocks: {domain: c1_domain}
- op: seed_state_from_file
  at: SelfTest_3
  file: shapes/exp04_selftest/blocks.npz
  blocks: {domain: c2_domain}
- op: seed_state_from_file
  at: SelfTest_4
  file: shapes/exp04_selftest/blocks.npz
  blocks: {domain: c3_domain}
- op: seed_state_from_file
  at: SelfTest_5
  file: shapes/exp04_selftest/blocks.npz
  blocks: {domain: c4_domain}
- op: cloud_seed
  at: lipid
  cloud: exp04_selftest/lipid
  origin: [0.5, 0.5, 0.5]
  scale: 45454545.45454545
- op: cloud_seed
  at: frame
  cloud: exp04_selftest/frame
  origin: [0.5, 0.5, 0.5]
  scale: 45454545.45454545
operators:
- op: shape_match
  at: SelfTest_1
  sets: [SelfTest_1, SelfTest_2, SelfTest_3, SelfTest_4, SelfTest_5]
  domain_block: domain
  alpha: 1.0
- op: membrane_potential
  at: cell
  capacitance: 9606.657000853655
  pump_max: 0.0
  pump_rev: 1.0
  leak: 0.0
  psi0: -3.8982399854014593
  h0: [0.0, 0.0]
  flux: j_channel
- op: elastic_network
  at: SelfTest_1
  sets: [SelfTest_1, SelfTest_2, SelfTest_3, SelfTest_4, SelfTest_5]
  cutoff: 0.045454545454545456
  k: 81796.0
  local_max_sep: 4
  go_epsilon: 1.5
  go_cutoff: 0.03636363636363637
  mobility: 1.0
  f_max: 5948.8
  domain_block: domain
- op: pair_potential
  at: SelfTest_1
  sets: [SelfTest_1, SelfTest_2, SelfTest_3, SelfTest_4, SelfTest_5]
  law: wca
  sigma: 0.020454545454545454
  epsilon: 1.0
  exclude_same_set: true
  mobility: 1.0
  f_max: 5948.8
- {op: pair_potential, at: lipid, law: cooke, tail: 0.06300698006496724, sigma: 0.03937936254060453, epsilon: 1.5,
  mobility: 1.0, f_max: 5948.8}
- op: pair_potential
  at: lipid
  with_sets: [SelfTest_1, SelfTest_2, SelfTest_3, SelfTest_4, SelfTest_5]
  law: lj
  sigma: 0.03409090909090909
  epsilon: 1.0
  mobility: 1.0
  mobility_with: 1.0
  react: true
  f_max: 5948.8
- {op: pair_potential, at: lipid, with: frame, law: cooke, tail: 0.06300698006496724, sigma: 0.03937936254060453,
  epsilon: 3.0, mobility: 1.0, react: false, f_max: 5948.8}
- op: tether
  at: lipid
  k: 48400.0
  axes: [2]
  mobility: 1.0
- {op: brownian, at: lipid, kT: 1.0, mobility: 1.0, seed: 1}
- {op: brownian, at: SelfTest_1, kT: 1.0, mobility: 1.0, seed: 10}
- {op: brownian, at: SelfTest_2, kT: 1.0, mobility: 1.0, seed: 11}
- {op: brownian, at: SelfTest_3, kT: 1.0, mobility: 1.0, seed: 12}
- {op: brownian, at: SelfTest_4, kT: 1.0, mobility: 1.0, seed: 13}
- {op: brownian, at: SelfTest_5, kT: 1.0, mobility: 1.0, seed: 14}
- op: radial_drive
  at: frame
  protocol:
  - [0, 0.0]
  - [5998, 0.0]
  mode: strain
  mobility_R: 0.002052499542396979
  cell: cell
  axis: 2
  centre: [0.5, 0.5, 0.5]
  max_step: 0.0003937936254060453
  avg_frames: 200.0
- op: pore_probe
  at: SelfTest_1
  sets: [SelfTest_1, SelfTest_2, SelfTest_3, SelfTest_4, SelfTest_5]
  bead_radius: 0.022727272727272728
  z: [0.38636363636363635, 0.6136363636363636]
  h: 0.013636363636363636
  slices: 21
  cell: cell
- op: electrolyte_conduction
  at: cell
  field: elec
  insulators:
  - {set: SelfTest_1, radius: 0.022727272727272728}
  - {set: SelfTest_2, radius: 0.022727272727272728}
  - {set: SelfTest_3, radius: 0.022727272727272728}
  - {set: SelfTest_4, radius: 0.022727272727272728}
  - {set: SelfTest_5, radius: 0.022727272727272728}
  - {set: lipid, radius: 0.025}
  sigma: 2.5
  volt_per_sim: 0.02565260229603374
  dx_m: 3.4375000000000003e-10
  sim_current_per_A: 4156382655297.6978
  slab: [0.40909090909090906, 0.5909090909090909]
  seal: frame
  seal_margin: 0.019689681270302264
  cell: cell
  lining: {block: domain, value: 0}
  axis_sets: [SelfTest_1, SelfTest_2, SelfTest_3, SelfTest_4, SelfTest_5]
  every: 3000
  iters: 80
  iters_first: 4000
  omega: 1.9
schedule: [shape_match, membrane_potential, elastic_network, pair_potential, pair_potential, pair_potential, pair_potential,
  tether, brownian, brownian, brownian, brownian, brownian, brownian, radial_drive, pore_probe, electrolyte_conduction]
plotting:
  renderer: vtk_points
  up_axis: 2
  box_frame: true
  background: black
  ssao: true
  ssao_radius_frac: 0.03
  legend: false
  silhouette: {color: black, width: 1.5}
  surface_specular: 0.0
  surface_ambient: 0.32
  surface_diffuse: 0.72
  light: studio
  render_3d: compartments
  compartment_sets: [SelfTest_1, SelfTest_2, SelfTest_3, SelfTest_4, SelfTest_5, lipid]
  hide_sets: [frame, cell]
  surface:
    SelfTest_1: {render: surface, spacing: 0.013636, blur: 1.5, iso_frac: 0.3, smooth: 20, specular: 0.0, ambient: 0.32,
      diffuse: 0.72}
    SelfTest_2: {render: surface, spacing: 0.013636, blur: 1.5, iso_frac: 0.3, smooth: 20, specular: 0.0, ambient: 0.32,
      diffuse: 0.72}
    SelfTest_3: {render: surface, spacing: 0.013636, blur: 1.5, iso_frac: 0.3, smooth: 20, specular: 0.0, ambient: 0.32,
      diffuse: 0.72}
    SelfTest_4: {render: surface, spacing: 0.013636, blur: 1.5, iso_frac: 0.3, smooth: 20, specular: 0.0, ambient: 0.32,
      diffuse: 0.72}
    SelfTest_5: {render: surface, spacing: 0.013636, blur: 1.5, iso_frac: 0.3, smooth: 20, specular: 0.0, ambient: 0.32,
      diffuse: 0.72}
    lipid: {render: surface, spacing: 0.018182, blur: 2.0, iso_frac: 0.3, smooth: 30, specular: 0.0, ambient: 0.32,
      diffuse: 0.72, recontour: true}
  surface_min_points: 30
  opacity: {SelfTest_1: 1.0, SelfTest_2: 1.0, SelfTest_3: 1.0, SelfTest_4: 1.0, SelfTest_5: 1.0, lipid: 0.5}
  colors:
    SelfTest_1: [0.36, 0.58, 0.8]
    SelfTest_2: [0.9, 0.62, 0.36]
    SelfTest_3: [0.47, 0.72, 0.52]
    SelfTest_4: [0.84, 0.47, 0.47]
    SelfTest_5: [0.66, 0.56, 0.79]
    lipid: [0.82, 0.82, 0.84]
  field_iso:
    field: elec
    channel: 0
    levels: [8.20426, 27.347532]
    colors: ['#ff7b1c', '#ffe27a']
    opacity: [0.28, 0.75]
    smooth: 15
  camera: {elev: 40.0, azim: 30.0}
  zoom: 1.0
  curve:
  - {quantity: 'block:cell:j_channel', unit: current_pA, smooth: 20.0, ymin: -257.74441932359525, ymax: 0.0, ylabel: current
      at -100 mV, font_size: 21, tick_font_size: 16}
  - {quantity: 'block:cell:pore_r', unit: length_nm, factor: 2.0, ymin: 0.0, ymax: 3.2, ylabel: pore diameter, font_size: 21,
    tick_font_size: 16}
  - {quantity: 'block:cell:tension', unit: tension_mN_m, smooth: 50.0, ymin: -5.0, ymax: 13.0, ylabel: membrane
      tension, font_size: 21, tick_font_size: 16}
  subject: SelfTest_1
  keep_stills: true
  stills: 8
  max_frames: 300
  real_time: false
  duration_s: 10.0
  replay_curves: false
