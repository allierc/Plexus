descriptions:
  movie: {description: 'The simulation shows a cluster of multi-colored organic-shaped structures situated within
      a larger, grey, spherical volume. Over time, a thin, dark filament or crack begins to emerge and propagate
      along the surface of the grey sphere. The graphs on the right indicate that while the current and percentage
      of the largest assembly remain constant, the "nonvoid lumen diameter" begins to fluctuate and increase slightly
      toward the end of the sequence. The visual change suggests a structural failure or the opening of a channel
      within the material.', objects: "The central cluster consists of several interconnected, blob-like structures\
      \ in various colors including green, red, purple, blue, pink, and brown. These colorful objects are clustered\
      \ together in the upper center of a larger, translucent grey sphere that serves as the primary container.\
      \ The grey sphere is roughly spherical but shows surface irregularities and a developing fissure on its right\
      \ side. A scale bar at the bottom indicates a physical dimension of 0.005 \u03BCm, suggesting these are microscopic\
      \ or molecular-scale structures."}
