descriptions:
  movie: {description: 'The simulation begins with a flat current line and zero activity in the filter and records.
      As time progresses, the current rises sharply, and the "Kk in filter" and "Kk records" graphs show increasing
      activity and values. The current eventually fluctuates and stabilizes at a higher level while the records
      continue to climb steadily. By the final frame, the current shows a distinct double-peak pattern while the
      records reach their maximum value.', objects: 'A large, grey, roughly spherical translucent shell contains
      several smaller, solid-colored organic shapes. These internal shapes include blue, red, green, orange, and
      pink volumes that are clustered together in the center. The shapes vary in size and are connected or overlapping
      to form a complex, multi-lobed internal structure. Numerous small, purple dots are scattered throughout the
      surrounding black space, representing individual particles or data points.'}
