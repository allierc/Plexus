      blue, green, orange, and purple. These lobes are arranged in a compact, roughly spherical assembly
      at the center of the frame. A large, grey, semi-transparent volume encloses the central cluster,
      defining the simulation's spatial boundary. Numerous tiny, multi-colored dots representing ions
      are scattered throughout the black background and within the grey volume.
