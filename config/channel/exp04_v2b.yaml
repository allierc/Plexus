descriptions:
  movie: {description: 'The simulation begins with a protein complex embedded in a lipid bilayer, showing a steady
      current and stable membrane tension. As time progresses, the current remains relatively constant while the
      membrane tension fluctuates significantly, peaking and then gradually declining. The pore diameter remains
      stable throughout the sequence, showing only minor oscillations around a mean value. By the final frames,
      the membrane tension has dropped sharply toward zero, while the current shows a slight increase in magnitude.',
    objects: 'A multi-colored protein complex is situated at the center of the scene, composed of several distinct
      subunits. These subunits are arranged in a circular, bundled topology, with colors including orange, blue,
      green, pink, and purple. The protein is surrounded by a large, translucent grey sphere representing the surrounding
      lipid environment. The entire system is contained within a 3D bounding box, with the protein occupying a small
      fraction of the total volume.'}
