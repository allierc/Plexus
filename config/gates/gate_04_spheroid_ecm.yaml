# GATE 04 -- the spheroid pushing the matrix, through the interface gate 03 licenses.
#
# WHAT THIS COMBINES, and each piece is the one it is:
#   * the TISSUE is `gate_04_tissue` -- two-pool myosin with a cytokinetic ring at ring = 1 -- and it
#     is REPLAYED, not solved. Pass 1 is finished before pass 2 begins.
#   * the MATRIX is gate 02's, at 20 particles per strand rather than 60, eight substeps rather than
#     sixteen, `drag: 8` so it does not ring, and `store_stress` + `measure: vonmises` so the readout
#     is the stress and not the volume change.
#   * the INTERFACE is `mesh_contact`: a particle-to-surface penalty with regularised Coulomb
#     friction, INSIDE the substep block.
#
# THE REPLAY, AND WHY IT IS STILL A REPLAY. "Do not use replay, always regenerate data" is the rule,
# and it cannot mean solving both subsystems in one schedule: the tissue's clock is 600 s a frame and
# the matrix's is 3.2 ms, a ratio of about 10^5, so a live coupling would need on the order of 100,000
# matrix frames per tissue frame. The one-way kinematic prescription is a modelling decision the
# prototype made deliberately.
#
# WHAT THE RULE DOES REACH IS THE INPUT, and there it changed everything. This used to read
# `log/okuda_ECM/_tissue/cellfix_B_new_f401_x4_c4a5698982.npz` -- 32.7 MB, built in August,
# uncommitted, and unrebuildable, because `tissue.CELL_SPEC` now resolves to a different model
# (`rate: 0.03` against the 0.003457 that made it). It now reads a file this repository regenerates:
# `config/gates/gate_04_tissue.yaml` is run as a gate and `tools/export_tissue.py` writes its
# recorded surface out. The regeneration is exact -- 200 -> 6,380 cells, median radius
# 4.6622 -> 17.5848, every per-mesh key present including `myo_med` -- which is how we know the
# declared spec is the one that built the cache.
#
# `scale` IS DERIVED FROM THAT ARCHIVE, not copied: 0.15 / r_apical[-1] = 0.15 / 17.5848 =
# 0.00853007254279858, so the tissue ends at 0.15 of the box whatever the pass-1 run does. Copying
# the number would silently decouple it from the tissue the moment pass 1 changed.
#
# `mesh_contact` IS INSIDE THE SUBSTEP BLOCK, and that is a stability statement rather than a
# preference: the penalty is integrated at the substep, so it is stable while dt_sub*sqrt(k) < 1.
# At the frame level the ceiling would be (dt/dt_sub)^2 = 64x lower.

general:
  name: gate_04_spheroid_ecm
  seed: 0
  n_frames: 199
  dt: 0.0032
  record_cap: 201
  boundary: wall
  dim: 3
  world: [1.0, 1.0, 1.0]
  # BOTH BASE SCALES, because this gate quotes a STRESS and a stress is force/length^2 -- it cannot
  # be quoted from `length_um` alone. From `log/okuda_ECM/0u_units/units.json`'s box calibration.
  #
  # `time_s` IS DELIBERATELY ABSENT, and its absence is load-bearing. The tissue clock is 600 s a
  # frame; this run's frame is 3.2 ms. Declaring the tissue's number here would make every duration
  # quoted off this gate wrong by a factor of ~312 -- and it would be quoted, because the run looks
  # like the tissue's. With no `time_s`, a time row raises instead.
  units:
    length_um: 1172.3329425556858
    force_nN: 9162.430188008488

plotting:
  renderer: vtk_points
  background: black
  box_frame: true

sets:
  cell:
    n: 1
    start: [[0.5, 0.5, 0.5]]
    # `youngs: 15` IS 100 Pa at this calibration (15 x 6.667 Pa per stress unit) -- a 1-3 mg/ml
    # collagen I gel. The eight types are a palette for `ecm_stress`'s band, not eight materials.
    types: &eight
      s0: {fraction: 0.125, youngs: 15.0}
      s1: {fraction: 0.125, youngs: 15.0}
      s2: {fraction: 0.125, youngs: 15.0}
      s3: {fraction: 0.125, youngs: 15.0}
      s4: {fraction: 0.125, youngs: 15.0}
      s5: {fraction: 0.125, youngs: 15.0}
      s6: {fraction: 0.125, youngs: 15.0}
      s7: {fraction: 0.125, youngs: 15.0}
  mpm_particle:
    parent: cell
    per_parent: 200000
    radius: 0.48
    density: 1.0
    types: *eight

fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}

operators:
  - {op: aggregate, at: cell}
  # A SHELL, NOT A BLOCK: `shell_r: 0.4` fills only out to 0.4 of the box, and the cavity at 0.045 is
  # where the spheroid goes. The cavity MUST be empty from frame 0 -- matrix seeded where the ball
  # will be is in contact before the clock starts.
  - {op: ecm_seed, at: mpm_particle, centre: [0.5, 0.5, 0.5],
     cavity_r: 0.045, cavity_h: 0.045, cavity_sphere: true, axis: 1, shell_r: 0.4, margin: 0.02,
     n_fibres: 10000, fibre_len: 0.12, align: 0.0, align_dir: [1.0, 0.0, 0.0], seed: 0}
  - {op: mesh_contact, at: mpm_particle,
     tissue: log/gates/_tissue/gate_04_tissue.npz,
     centre: [0.5, 0.5, 0.5], scale: 0.00853007254279858,
     k_frac: 0.15, mu: 0.4, dt: 0.0032, n_grid: 64, a_max: 30000.0, mesh_stride: 1,
     verbose: false}
  - {op: mpm_strain, at: mpm_particle}
  - {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 8.0, a_max: 100000.0,
     store_stress: true}
  - {op: mpm_grid_update, at: mpm_grid, wall_damp: 0.7}
  - {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04,
     vmax: 1.0e9}
  # FRAME LEVEL, AFTER THE BLOCK: reads the Cauchy stress the last substep cached. `store_stress` on
  # `mpm_scatter` is what makes `measure: vonmises` mean anything -- without it the operator prints a
  # warning and silently falls back to |J-1|, a DIFFERENT quantity.
  - {op: ecm_stress, at: mpm_particle, scale: 2.0, bands: 8, measure: vonmises}
  - {op: mesh_inside, at: mpm_particle, n_grid: 64}

schedule:
  - aggregate
  - ecm_seed
  - {substep_dt: 0.0004, steps: [mesh_contact, mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]}
  - ecm_stress
  - mesh_inside

_gate:
  id: "04_spheroid_ecm"
  question: >
    With the tissue prescribed and the matrix solved, does the growing spheroid push the matrix out
    of its own volume rather than through it, and does the matrix carry a stress a collagen gel could?
  operators_exercised: [aggregate, ecm_seed, mesh_contact, mesh_inside, ecm_stress, mpm_strain,
                        mpm_scatter, mpm_grid_update, mpm_gather]
  inputs:
    tissue: log/gates/_tissue/gate_04_tissue.npz
    produced_by: config/gates/gate_04_tissue.yaml
    note: >
      REGENERATED, not archived. `tools/export_tissue.py --gate gate_04_tissue` writes it from a run
      of the pass-1 gate, and the result reproduces the August cache exactly (200 -> 6,380 cells,
      median radius 4.6622 -> 17.5848). Nothing here depends on a file this repository cannot rebuild.

  measures:

    # ------------- bookkeeping ------------------------------------------------------
    - name: particle_count
      tier: bookkeeping
      basis: identity
      fn: particle_count
      reduce: all
      assert: {eq: 200000}
      unit: "material points"
      why: "No operator here creates or destroys a particle; the count is constant by construction."

    - name: no_particle_outside_the_domain
      tier: bookkeeping
      basis: identity
      fn: out_of_box
      reduce: max
      assert: {eq: 0}
      unit: "material points outside the clamp, worst frame"
      why: >
        `mpm_gather` clamps to [2dx, 1-2dx]. A particle outside it means the clamp did not run --
        and a contact this stiff is exactly what would launch one past it.

    - name: no_nan
      tier: bookkeeping
      basis: identity
      fn: nonfinite_count
      reduce: max
      assert: {eq: 0}
      unit: "non-finite coordinates"
      why: >
        A penalty contact at k = (0.15/4e-4)^2 = 140,625 is 2.25% of the explicit ceiling; past it
        the run produces NaN rather than an exception, and every row below would be reading them.

    # ------------- closed form: what a prescribed surface makes true ------------------
    - name: cavity_is_clear_at_seeding
      tier: closed_form
      basis: analytic
      fn: min_radius_from_centre
      reduce: first
      assert: {ge: 0.045}
      unit: "box units from the domain centre to the nearest material point, at frame 0"
      why: >
        `ecm_seed` declares `cavity_r: 0.045` and evicts whole strands that reach into it, so the
        analytic value at frame 0 is that radius. It matters because the tissue starts at
        0.00853 x 4.6622 = 0.0398 -- INSIDE the cavity -- so matrix seeded there would be in contact
        before the clock starts and the "moment of first contact" the gate observes could not happen.

    - name: matrix_is_pushed_out_not_through
      tier: closed_form
      basis: analytic
      fn: min_radius_from_centre
      reduce: last
      assert: {ge: 0.10}
      unit: "box units from the centre to the nearest material point, at the last frame"
      why: >
        THE COARSE VERSION OF THE GATE'S QUESTION: did the matrix stay outside the epithelium at
        all? The tissue's surface is PRESCRIBED and ends at 0.00853 x 17.5848 = 0.150 of the box,
        and the cavity it grew out of was 0.045, so a value near 0.045 means the matrix went
        straight through. 0.10 is where "outside, indented" stops and "through" begins. HOW FAR
        inside it actually sits is the row below, and that is where the interesting number is.

    - name: contact_penetration_um
      tier: measurement
      basis: literature
      fn: contact_penetration_um
      args: {surface_radius: 0.15}
      reduce: last
      status: known_red
      assert: {le: 10.0}
      unit: "um, deepest indentation of the matrix into the prescribed epithelium"
      why: >
        RED ON ARRIVAL, AND DECLARED RED RATHER THAN QUIETLY WIDENED. Measured 17.1 um against an
        epithelial cell diameter of 8.6 um: the matrix indents the tissue by two cell bodies.

        THE THRESHOLD IS A CELL DIAMETER because that is the scale at which a penetration stops
        being a discretisation detail and becomes the model saying something false. A matrix
        overlapping an epithelium by two cells is not in contact with it, it is inside it.

        THIS IS WHY THE MEASUREMENT TIER NEEDS UNITS. As a fraction of a unit box the same number
        is 0.0146 and reads as a rounding error; the paper's own worked example is this quantity
        reported as "0.82 grid cells", sounding small, and being described as an improvement. The
        `units:` block is what turns it into 17 um and into an argument.

        WHAT WOULD FIX IT IS NOT A TIGHTER THRESHOLD. `mesh_contact` is a PENALTY -- a force
        proportional to depth -- so a steady load always produces a steady overlap, and the only
        knob is `k_frac`, already at 0.15 of the explicit stability ceiling and so not raisable far.
        A barrier formulation (an energy that diverges at contact) removes the overlap by
        construction instead of trading it against stability. That is a change to the operator, not
        to the gate, and it belongs in its own commit with its own twin run.

    # ------------- reference ----------------------------------------------------------
    - name: matrix_is_pushed_not_flicked
      tier: measurement
      basis: reference
      fn: median_displacement
      reduce: last
      assert: {interval: [0.01, 0.30]}
      unit: "box units, median displacement of a material point over the run"
      why: >
        A MEDIAN, because a handful of points flicked out of the contact zone carry a mean on their
        own. This is the row that caught k = 4000 in the prototype: the median collapsed from 0.085
        to 0.0005 while the peak grew, because a huge acceleration on the contact layer accelerates
        that layer out of the zone before it can transmit anything to the material behind it. A
        piston pushes bulk; an impulse does not. Below 0.01 the matrix is being flicked or is not
        being touched at all.

    # ------------- literature ----------------------------------------------------------
    - name: matrix_stress_Pa
      tier: measurement
      basis: literature
      fn: final_stress_p99_Pa
      args: {band_scale: 2.0, bands: 8, pct: 99}
      reduce: last
      assert: {interval: [10.0, 1000.0]}
      unit: "Pa, p99 von Mises stress in the matrix at the last frame"
      why: >
        A reconstituted collagen I gel at 1-3 mg/ml has a shear modulus of tens to hundreds of
        pascals, and this matrix is given E = 15 stress units = 100 Pa. A spheroid pushing it should
        load it to the same order -- not to kilopascals, which would be cartilage, and not to
        single pascals, which would be water. ONLY SAYABLE because the spec declares BOTH base
        scales: a stress is force/length^2 and `length_um` alone cannot produce it.

        THE READOUT IS QUANTISED and that is stated rather than hidden: what reaches disk is
        `ecm_stress`'s 8-level colour band, so the stress is recovered in steps of
        2.0/7 = 0.286 units = 1.9 Pa. Enough to tell 100 Pa from 1000; not enough to resolve 10%.
