general:
  name: gate_01b_myosin_pools
  seed: 0
  n_frames: 401
  dt: 1.0
  record_cap: 403
  boundary: free
  dim: 3
  world: [50.0, 50.0, 50.0]
  units:
    length_um: 10.0
    time_s: 600.0
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  mesh_color: '#cfd8e3'
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 46.0
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
sets:
  vertex:
    n: 25584
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12800
    state:
      area: {width: 1}
      cen:  {width: 3}
      chem: {width: 2, integration: first_order}
fields: {}
operators:
  - {op: mesh_seed, at: vertex, before_frame: 1, cell_set: cell,
     n_cells: 200, radius: 5.0, jitter: 0.18, p0: 3.5, seed: 0, vseed_cv: 0.15}
  - {op: cell_geometry, at: cell}
  - {op: cell_grow, at: vertex, cell_set: cell, rate: 0.003457, rho: 1.0,
     a_sw: 50.0, hill: 4.0, vth_frac: 2.5}
  - {op: medioapical_myosin, at: cell, mesh_at: vertex,
     k_on: 0.05, tau_med: 20.0, k_ex: 0.05, beta_T: 0.0, rho0: 1.0, dt: 1.0,
     lam: 0.0, k_perim: 1.0, gam: 0.0}
  - {op: junction_myosin, model: two_pool, at: vertex,
     activity: 1.0, tau_jun: 20.0, myo_new: 1.0, myo_new_rel: true, inherit: true, dt: 1.0}
  - {op: cell_mechanics, at: vertex, K_A: 1.0, K_P: 1.0, K_V: 2.0, K_R: 0.4,
     Lambda: 3.0, Gamma: 0.4, p0: 3.5, mu: 1.0, dt: 1.0,
     relax_iters: 30, eta: 0.08, cap_frac: 0.12}
  - {op: edge_flip, at: vertex, every: 4, engine_clock: true, l_th_frac: 0.35, max_flips: 30}
  - {op: cell_divide, at: vertex, cell_set: cell, every: 4, engine_clock: true,
     factor: 2.0, cycle_cv: 0.15, min_cycle: 4, max_cycle: 1000000000, p0: 3.5,
     reset_noise: 0.12}
  - {op: junction_sync, at: vertex, myo_new: 1.0, inherit: true}
  - {op: topo_record, at: vertex, every: 1}

schedule: [mesh_seed, cell_geometry, cell_grow, medioapical_myosin, junction_myosin,
           cell_mechanics, edge_flip, cell_divide, junction_sync, topo_record]
