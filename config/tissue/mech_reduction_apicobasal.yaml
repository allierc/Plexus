general:
  name: mech_reduction_apicobasal
  seed: 0
  n_frames: 20
  dt: 1.0
  record_cap: 24
  boundary: free
  dim: 3
  world:
  - 12.0
  - 12.0
  - 12.0
plotting:
  renderer: vtk_points
  background: black
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  surface_opacity: 1.0
  surface_color: '#cfd8e3'
  fps: 30
  zoom: 1.6
sets:
  vertex:
    n: 1024
    mesh: half_edge
    cell_set: cell
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
      sep:
        width: 3
        integration: first_order
  cell:
    n: 256
    state:
      area:
        width: 1
      cen:
        width: 3
fields: {}
seed:
- op: seed_mesh
  model: apicobasal
  at: vertex
  cell_set: cell
  shape: disc
  n_cells: 60
  radius: 5.0
  centre:
  - 0.0
  - 0.0
  - 1.0
  jitter: 0.15
  p0: 3.5
  seed: 0
  h0: 0.4
operators:
- op: cell_geometry
  at: cell
- op: cell_mechanics
  model: apicobasal
  at: vertex
  k_v: 4.0
  kappa_s: 0.2
  gamma: 0.0
  Lambda: 0.0
  K_R: 0.0
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  mono_k: 1.2
  plane_axis: 2
  rest_calibration: volume_only
  sep_mu: 0.0
- op: topo_record
  at: vertex
  every: 1
schedule:
- cell_geometry
- cell_mechanics
- topo_record
