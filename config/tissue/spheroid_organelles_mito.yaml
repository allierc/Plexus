general:
  name: spheroid_organelles_mito
  seed: 0
  n_frames: 801
  dt: 1.0
  record_cap: 803
  boundary: free
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  cell:
    n: 2048
    state:
      area:
        width: 1
      centroid:
        width: 3
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      apop_flag:
        width: 1
      inhib_frac:
        width: 1
      n_organelle:
        width: 2
  vertex:
    n: 25584
    mesh: half_edge
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
      sep:
        width: 3
        integration: first_order
  half_edge:
    n: 102400
    maps:
      srce: vertex
      trgt: vertex
      face: cell
  organelle:
    entity: organelle
    parent: cell
    parent_pos: centroid
    per_parent: 31
    state:
      pos:
        width: 3
      vel:
        width: 3
      age:
        width: 1
    types:
      nucleus:
        count: 1
        radius: 0.3
        region: basal_side
        on_divide: duplicate
      mitochondria:
        count: 30
        radius: 0.06
        region: interior
        on_divide: halve
fields: {}
operators:
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  rate: 0.000578
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: cell_mechanics
  model: apicobasal
  at: vertex
  k_v: 4.0
  kappa_s: 0.05
  gamma: 0.0
  Lambda: 0.0
  K_R: 0.4
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  sep_mu: 1.0
  surface: basal
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.0
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.0
  model: adder
  delta: 1.0
- op: topo_record
  at: vertex
  every: 1
- op: organelle_project
  at: organelle
  tissue: vertex
  seed: 0
schedule:
- cell_geometry
- cell_grow
- cell_mechanics
- edge_flip
- cell_divide
- topo_record
- organelle_project
seed:
- op: seed_mesh
  at: vertex
  n_cells: 200
  radius: 5.0
  jitter: 0.02
  p0: 3.5
  seed: 0
  vseed_cv: 0.0
  model: apicobasal
  h0: 1.2
  apical: in
  cell_set: cell
- op: organelle_seed
  at: organelle
  tissue: vertex
  seed: 0
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 0.9
  fps: 30
  mesh_color: '#cfd8e3'
  mesh_style: surface
  mesh_edges: true
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 34.0
    walls: 64
    loc:
    - 0.015
    - 0.035
    wall_color: '#e8e8e8'
    mid: false
    points: false
  cross_section_height: 0.24
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
    ymin: 0
    ymax: 1000
  - quantity: count:organelle:nucleus
    xlabel: frame
    ylabel: nucleus
    ticks: 4
    ymin: 0
    ymax: 1000
  - quantity: count:organelle:mitochondria
    xlabel: frame
    ylabel: mitochondria
    ticks: 4
    ymin: 0
    ymax: 30000
  scale_bar_corner: right
  scale_bar_lift: -0.07
  colors:
    nucleus:
    - 0.55
    - 0.75
    - 1.0
    mitochondria:
    - 0.95
    - 0.35
    - 0.2
  mesh_opacity: 0.3
  mesh_surface: basal
  dot_radius:
    nucleus: 0.3
    mitochondria: 0.06

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a spherical cluster of particles that gradually expands in size
      over time. As the cluster grows, the number of cells and nuclei within the structure increases significantly.
      The mitochondrial count remains relatively stable throughout the observed sequence. The overall
      volume of the spheroid increases as it occupies more space within the 600 $\mu$m cube.
    objects: The primary object is a spherical cluster composed of numerous small, blue and red particles.
      These particles are densely packed together to form a cohesive, rounded mass in the center of the
      frame. A smaller, inset view shows a cross-section of the spheroid, revealing a hollow-like interior
      with a ring of particles. The entire scene is set within a large, black cubic bounding box with
      white wireframe edges.
