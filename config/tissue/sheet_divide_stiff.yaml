general:
  name: sheet_divide_stiff
  seed: 0
  n_frames: 400
  dt: 1.0
  record_cap: 402
  boundary: free
  dim: 3
  world:
  - 18.0
  - 18.0
  - 18.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  vertex:
    n: 4000
    mesh: half_edge
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
  cell:
    n: 2000
    state:
      area:
        width: 1
      centroid:
        width: 3
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      apop_flag:
        width: 1
      inhib_frac:
        width: 1
      chem:
        width: 2
        integration: first_order
  half_edge:
    n: 16000
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
seed:
- op: seed_mesh
  at: vertex
  shape: disc
  n_cells: 400
  radius: 5.0
  jitter: 0.15
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
operators:
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  rate: 0.002
  a_sw: 0.0
  hill: 4.0
  rho: 1.0
  vth_frac: 2.5
  conserve_amount: false
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 20.0
  K_R: 0.0
  Lambda: 0.5
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  K_bend: 0.05
  K_lumen: 0.0
- op: cell_divide
  at: vertex
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  p0: 3.5
  every: 4
  engine_clock: true
  reset_noise: 0.12
  max_cycle: 1000000000
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- cell_geometry
- cell_grow
- cell_mechanics
- cell_divide
- edge_flip
- topo_record
plotting:
  renderer: vtk_mesh
  background: black
  mesh_mark_division: true
  mesh_apop_color: '#e8c33a'
  camera:
    elev: 90.0
    azim: 0.0
descriptions:
  movie:
    description: The simulation begins with a single, large, greyish-white cell-like
      structure in the center of a black field. This initial structure rapidly undergoes
      a division process, proliferating into a dense cluster of smaller blue cells.
      As the simulation progresses, the cluster expands outward while maintaining
      a roughly elliptical shape. By the final frame, the cluster has reached its
      maximum size, consisting of a large number of interconnected blue cells with
      a few white cells at the periphery.
    objects: The primary objects are individual cells that are arranged in a dense,
      packed, and interconnected sheet-like topology. The cells transition from a
      single large greyish-white object to a multitude of smaller blue units. The
      blue cells are uniform in size and shape, forming a cohesive, expanding cluster.
      A few white cells appear at the outer edges of the cluster, contrasting with
      the predominantly blue interior.
  movie_kburns:
    description: The simulation shows a 2D sheet of cells undergoing a refinement
      process. Over time, the cells in the center of the sheet become increasingly
      smaller and more densely packed. The outer regions of the sheet maintain a larger,
      more regular polygonal structure. The overall shape of the sheet remains constant
      while the internal mesh density increases towards the center.
    objects: The scene contains a single sheet composed of numerous polygonal cells.
      The cells are light gray with dark gray outlines, creating a mosaic-like appearance.
      The cells are arranged in a Voronoi-like pattern, with varying sizes across
      the surface. The size of the cells decreases significantly from the periphery
      toward the central focal point.
