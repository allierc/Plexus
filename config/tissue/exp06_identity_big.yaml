fields: {}
seed:
- op: seed_mesh
  at: vertex
  shape: plane
  n_cells: 50000
  radius: 79.0
  width: 2.0
  jitter: 0.15
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: seed_cell_chem
  at: cell
  model: noise
  A: 0.3
  B: 0.06
  noise: 0.04
  seed: 0
operators:
- op: cell_geometry
  at: cell
  before_frame: 2
- op: cell_neighbours
  at: cell
  before_frame: 2
- op: cell_chem_react
  at: cell
  model: aliev_panfilov
  k: 8.0
  a: 0.15
  eps0: 0.002
  mu1: 0.2
  mu2: 0.3
schedule:
- cell_geometry
- cell_neighbours
- cell_chem_react
plotting:
  duration_s: 10
  renderer: vtk_mesh
  background: black
  mesh_mark_division: false
  camera:
    elev: 90.0
    azim: 0.0
