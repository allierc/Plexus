general:
  name: sheet_divide
  seed: 0
  n_frames: 400
  dt: 1.0
  record_cap: 402
  boundary: free
  dim: 3
  world:
  - 18.0
  - 18.0
  - 18.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  vertex:
    n: 4000
    mesh: half_edge
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
  cell:
    n: 2000
    state:
      area:
        width: 1
      centroid:
        width: 3
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      apop_flag:
        width: 1
      inhib_frac:
        width: 1
      chem:
        width: 2
        integration: first_order
  half_edge:
    n: 16000
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
seed:
- op: seed_mesh
  at: vertex
  shape: disc
  n_cells: 400
  radius: 5.0
  jitter: 0.15
  p0: 3.5
  seed: 0
  vseed_cv: 0.5
  age_seed: 60.0
operators:
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  rate: 0.002
  a_sw: 0.0
  hill: 4.0
  rho: 1.0
  vth_frac: 2.5
  conserve_amount: false
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 20.0
  K_R: 0.0
  Lambda: 0.5
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  K_bend: 0.0
  K_lumen: 0.0
- op: cell_divide
  at: vertex
  cycle_cv: 0.4
  min_cycle: 4
  p0: 3.5
  every: 4
  engine_clock: true
  reset_noise: 0.12
  max_cycle: 1000000000
  model: timer
  cycle: 60.0
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- cell_geometry
- cell_grow
- cell_mechanics
- cell_divide
- edge_flip
- topo_record
plotting:
  renderer: vtk_mesh
  background: black
  mesh_mark_division: true
  mesh_apop_color: '#e8c33a'
  camera:
    elev: 90.0
    azim: 0.0

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a cellular mesh expanding and subdividing over time. Initially,
      the mesh consists of large, irregular polygons that gradually refine into smaller, more uniform
      hexagonal cells. Red and blue markers appear at specific vertices, indicating points of active division
      or structural change. As the frame count increases, the total cell count grows significantly while
      the overall circular shape remains relatively stable.
    objects: The primary objects are white polygonal cells arranged in a dense, packed tessellation. These
      cells vary in size, starting large and becoming progressively smaller as the mesh subdivides. Red
      and blue markers are located at the junctions where multiple cells meet, highlighting specific interaction
      points. The entire collection of cells forms a roughly circular cluster against a solid black background.
  movie_kburns:
    description: The simulation shows a 2D Voronoi-like mesh undergoing a continuous refinement process.
      Over time, the individual cells within the sheet divide into smaller, more numerous polygons. This
      subdivision occurs uniformly across the entire surface, increasing the density of the mesh. The
      final frames show a highly complex, fine-grained network of small cells compared to the initial
      coarse state.
    objects: The scene contains a single large, elliptical sheet composed of numerous polygonal cells.
      These cells are arranged in a contiguous, non-overlapping tiling pattern that covers the entire
      surface. The objects are light gray or off-white in color with thin black outlines defining their
      boundaries. The size of the individual cells decreases significantly as the simulation progresses
      from the first to the last frame.
