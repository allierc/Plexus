general:
  name: spheroid_organelles_nucleus
  seed: 0
  n_frames: 801
  dt: 1.0
  record_cap: 803
  boundary: free
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  cell:
    n: 2048
    state:
      area:
        width: 1
      centroid:
        width: 3
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      apop_flag:
        width: 1
      inhib_frac:
        width: 1
      n_organelle:
        width: 1
  vertex:
    n: 25584
    mesh: half_edge
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
      sep:
        width: 3
        integration: first_order
  half_edge:
    n: 102400
    maps:
      srce: vertex
      trgt: vertex
      face: cell
  organelle:
    entity: organelle
    parent: cell
    parent_pos: centroid
    per_parent: 1
    state:
      pos:
        width: 3
      vel:
        width: 3
      age:
        width: 1
    types:
      nucleus:
        count: 1
        radius: 0.3
        region: basal_side
        on_divide: duplicate
fields: {}
operators:
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  rate: 0.000578
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: cell_mechanics
  model: apicobasal
  at: vertex
  k_v: 4.0
  kappa_s: 0.05
  gamma: 0.0
  Lambda: 0.0
  K_R: 0.4
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  sep_mu: 1.0
  surface: basal
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.0
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.0
  model: adder
  delta: 1.0
- op: topo_record
  at: vertex
  every: 1
- op: organelle_project
  at: organelle
  tissue: vertex
  seed: 0
schedule:
- cell_geometry
- cell_grow
- cell_mechanics
- edge_flip
- cell_divide
- topo_record
- organelle_project
seed:
- op: seed_mesh
  at: vertex
  n_cells: 200
  radius: 5.0
  jitter: 0.02
  p0: 3.5
  seed: 0
  vseed_cv: 0.0
  model: apicobasal
  h0: 1.2
  apical: in
  cell_set: cell
- op: organelle_seed
  at: organelle
  tissue: vertex
  seed: 0
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 0.9
  fps: 30
  mesh_color: '#cfd8e3'
  mesh_style: surface
  mesh_edges: true
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 18.0
    walls: 64
    loc:
    - 0.015
    - 0.035
    wall_color: '#e8e8e8'
    mid: false
    points: false
    spheres: true
  cross_section_height: 0.34
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
    ymin: 0
    ymax: 1000
  - quantity: count:organelle:nucleus
    xlabel: frame
    ylabel: nucleus
    ticks: 4
    ymin: 0
    ymax: 1000
  scale_bar_corner: right
  scale_bar_lift: -0.07
  colors:
    nucleus:
    - 0.55
    - 0.75
    - 1.0
  mesh_opacity: 0.3
  mesh_surface: basal
  dot_radius:
    nucleus: 0.3
descriptions:
  movie:
    description: The simulation shows a spherical cluster of blue particles that gradually
      expands in size over time. The number of particles within the cluster increases
      as the simulation progresses from frame 3 to frame 702. Simultaneously, the
      graphs on the right indicate a steady rise in the count of "cells" and "nucleus"
      components. The expansion of the central sphere is the primary visual change
      throughout the sequence.
    objects: A large, central spherical cluster is composed of numerous small, light-blue
      particles. This cluster is situated within a large, black 3D bounding box with
      white wireframe edges. In the bottom-left corner, a smaller inset shows a cross-sectional
      view of a ring-like structure with red and blue segments. Two line graphs on
      the right side track the numerical growth of "cells" and "nucleus" over the
      course of the frames.
