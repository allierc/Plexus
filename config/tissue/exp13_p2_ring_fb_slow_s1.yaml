general:
  name: exp13_p2_ring_fb_slow_s1
  seed: 1
  n_frames: 1200
  dt: 1.0
  record_cap: 1202
  boundary: free
  dim: 3
  world: [18.0, 18.0, 18.0]
  units: {length_um: 20.0, time_s: 540.0}
  title: 'exp 13 Phase 2: the flat pouch inside a hinge ring (plate_confine[sphere], in-plane)'
sets:
  cell:
    n: 8000
    state:
      area: {width: 1}
      centroid: {width: 3}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      apop_flag: {width: 1}
      inhib_frac: {width: 1}
      chem: {width: 2, integration: first_order}
      cell_id: {width: 1}
      parent_id: {width: 1}
      stretch: {width: 1}
  vertex:
    n: 18000
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
  half_edge:
    n: 64000
    maps: {srce: vertex, trgt: vertex, face: cell}
fields: {}
seed:
- {op: seed_mesh, at: vertex, shape: disc, n_cells: 400, radius: 5.0, jitter: 0.15, p0: 3.5, seed: 1,
  vseed_cv: 0.3, age_seed: 60.0, ref_frame: 60}
operators:
- {op: cell_geometry, at: cell}
- {op: cell_neighbours, at: cell}
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d: [0.5]
  chi: 1.0
  chan: 0
- op: cell_chem_react
  at: cell
  model: stripe_decay
  production: 0.363
  decay: 0.0175
  source: {axis: 0, frac: 0.08}
  chan: 0
- {op: cell_grow, at: vertex, model: stretch, rate: 0.002, rho: 0.2, a_sw: 0.3, a_sw_rel: true, a_live: 0.01,
  hill: 2.0, chan: 0, vth_frac: 2.5, conserve_amount: false, gain: 12.0, readout: stress, stretch_ref: settle,
  ref_frame: 60, smooth: 1}
- {op: cell_mechanics, at: vertex, K_A: 1.0, K_P: 1.0, K_V: 20.0, K_R: 0.0, Lambda: 0.5, Gamma: 0.4, p0: 3.5,
  mu: 1.0, relax_iters: 60, eta: 0.08, cap_frac: 0.12, K_bend: 0.0, K_lumen: 0.0, plane_axis: 2}
- {op: plate_confine, model: sphere, at: vertex, radius: 5.0, stiff: 0.6}
- {op: cell_divide, at: vertex, implementation: adder_sheet, delta: 1.0, factor: 2.0, plane_axis: 2, phase_spread: 0.0,
  every: 4, engine_clock: true, cycle_cv: 0.0, min_cycle: 4, max_cycle: 1000000000, p0: 3.5, reset_noise: 0.0}
- {op: edge_flip, at: vertex, l_th_frac: 0.28, every: 1, max_flips: 300}
- {op: topo_record, at: vertex, every: 1}
schedule: [cell_geometry, cell_neighbours, cell_chem_diffuse, cell_chem_react, cell_grow, cell_mechanics,
  plate_confine, cell_divide, edge_flip, topo_record]
plotting:
  duration_s: 10
  renderer: vtk_mesh
  background: black
  mesh_mark_division: false
  show_division: false
  species: ['#2e9e4f', null]
  blend: subtractive
  camera: {elev: 90.0, azim: 0.0}
