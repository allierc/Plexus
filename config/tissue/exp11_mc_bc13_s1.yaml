general:
  name: exp11_mc_bc13_s1
  seed: 1
  n_frames: 320
  dt: 1.0
  record_cap: 162
  boundary: free
  dim: 3
  world: [200.0, 200.0, 200.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 12800
    state:
      area: {width: 1}
      centroid: {width: 3}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      inhib_frac: {width: 1}
      cell_id: {width: 1}
      parent_id: {width: 1}
      phase: {width: 1}
      cycle_progress: {width: 1}
      cyc_rate: {width: 1, record: false}
      phase_t: {width: 1, record: false}
      cyc_inhib: {width: 1, record: false}
      cyc_vprev: {width: 1, record: false}
      chem: {width: 2}
  vertex:
    n: 25584
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
      sep: {width: 3, integration: first_order}
  half_edge:
    n: 102400
    maps: {srce: vertex, trgt: vertex, face: cell}
  bm_node:
    entity: basement_membrane_node
    n: 60000
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
  icell:
    n: 340
    types:
      interior: {fraction: 1.0, shape: ball, youngs: 2.0, material: elastic, density: 1.0}
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
  ipt:
    entity: mpm_particle
    parent: icell
    per_parent: 64
    particle_mass: 0.013
    density: 1.0
    radius: 0.55
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
      cellc: {width: 1}
      pid: {width: 1}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 10, per_parent: icell, cell_box: 4.7}
operators:
- {op: cell_geometry, at: cell}
- {op: cell_grow, at: vertex, rate: 0.0048, rho: 1.0, a_sw: 50.0, hill: 4.0, vth_frac: 2.5, chan: 0, rate_decay_T: 140.0,
  body_cap: 1.3}
- {op: bm_bond, at: bm_node, graph_mode: true, k: 0.1, cutoff: 0.5, max_neighbours: 6, overdamped_gamma: 1.0, guard_dt: spec,
  emit: velocity, snapshot_every: 50}
- {op: bm_remodel, at: bm_node, tau: 5.0, cap: 0.2}
- {op: bm_contact, implementation: live, at: bm_node, surface: vertex, k: 0.5, offset: 0.05, band: 0.3}
- {op: bm_contact, implementation: live, at: ipt, surface: vertex, side: apical, k: 10.0, offset: 0.3, overdamped_gamma: 10.0,
  emit: mpm_acceleration}
- {op: bm_secrete, implementation: live, at: bm_node, surface: vertex, rate: 0.02, offset: 0.05, seed: 0}
- {op: cell_mechanics, implementation: apicobasal_contact, at: vertex, k_v: 4.0, kappa_s: 0.2, kappa_h: 20.0, gamma: 0.0,
  Lambda: 0.0, K_R: 0.0, mu: 1.0, relax_iters: 30, eta: 0.08, cap_frac: 0.12, sep_mu: 1.0, e_cm: 0.15, k_height: 30.0, height_implicit: true,
  kappa_h_implicit: true, k_bend: 100.0, k_bend_cg: 60, apical_sep: along}
- {op: edge_flip, at: vertex, every: 4, engine_clock: true, l_th_frac: 0.35, max_flips: 30}
- {op: cell_cycle, at: vertex, t_g1: 58.0, t_s: 0.0, t_g2: 0.0, t_m: 0.0, phase_cv: 0.15, seed: 0, g1_size: 2.0}
- {op: cell_divide, model: cycle, at: vertex, every: 4, engine_clock: true, min_cycle: 4, max_cycle: 1000000000, p0: 3.5,
  orient_iface: true, orient_asw: 0.5}
- {op: topo_record, at: vertex, every: 1}
- {op: active_force, model: persistent_walk, at: ipt, cell_set: icell, f: 0.4, Dr: 0.26, seed: 1, speed_cv: 0.17, speed_noise: 0.3,
  speed_tau: 3.0, front_bias: 1.5, front_width: 0.5, cil_surface: vertex}
- {op: pair_potential, at: ipt, law: harmonic, sigma: 0.22, epsilon: 0.3, mobility: 100.0, exclude: pid, emit: mpm_acceleration}
- {op: mpm_strain, at: ipt, implementation: default}
- {op: mpm_scatter, at: ipt, to: mpm_grid, drag: 2.0, polar: higham, implementation: default}
- {op: mpm_grid_update, at: mpm_grid, implementation: default}
- {op: mpm_gather, at: ipt, from: mpm_grid, implementation: default}
- {op: aggregate_centroid, at: icell, child: ipt}
schedule:
- cell_geometry
- cell_grow
- bm_bond
- bm_remodel
- bm_contact
- bm_contact
- bm_secrete
- cell_mechanics
- edge_flip
- cell_cycle
- cell_divide
- topo_record
- active_force
- steps: [pair_potential, mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]
  substep_dt: 0.05
  capture: false
- aggregate_centroid
seed:
- {op: seed_mesh, model: apicobasal, at: vertex, n_cells: 200, radius: 5.0, jitter: 0.02, p0: 3.5, seed: 0, vseed_cv: 0.02,
  h0: 0.88, ref_frame: 60, apical: in}
- {op: seed_cycle, at: vertex, t_g1: 58.0, t_s: 0.0, t_g2: 0.0, t_m: 0.0, seed: 0}
- {op: bm_seed, implementation: live, at: bm_node, tissue: vertex, offset: 0.05, seed: 0, reserve: 9.0}
- {op: seed_positions, model: packed_ball, at: icell, spacing: 0.94, jitter: 0.2, centre: vertex, seed: 1}
- {op: seed_positions, model: voronoi_parent, at: ipt, reach: 1.3, clip_radius: 4.1, centre: vertex, seed: 1, label: cellc,
  parent_id: pid}
plotting:
  zoom: 6.0
  subject: vertex
  mesh_opacity: 1.0
  mesh_mark_division: false
  mesh_line_width: 5.0
  also_sets: [bm_node]
  also_colors: {bm_node: '#ff9f1c', ipt: '#4cc9f0'}
  also_dot_size: 4
  also_mesh: [bm_node]
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 30
  mesh_color: '#ffffff'
  mesh_style: surface
  mesh_edges: true
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 25.0
    walls: 64
    loc: [0.015, 0.03]
    wall_color: '#e8e8e8'
    mid: false
    points: false
    also_sets: [ipt]
    also_size: 7
    also_halfwidth: 0.25
  cross_section_height: 0.45
  curve:
  - quantity: cells
    with: count:icell
    colors: ['#e63946', '#4cc9f0']
    xlabel: frame
    ylabel: surface (red), interior (blue) cells
    ticks: 4
  - {quantity: volume, xlabel: frame, ylabel: cell volume, ticks: 4}
  - {quantity: 'count:bm_node', xlabel: frame, ylabel: membrane nodes, ticks: 4}
  scale_bar_corner: right_face
  scale_bar_lift: -0.07
