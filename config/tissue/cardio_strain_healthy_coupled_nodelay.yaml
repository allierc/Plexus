general: {name: cardio_strain_healthy_coupled_nodelay, seed: 0, n_frames: 54, dt: 0.002, record_cap: 200, boundary: wall,
  dim: 2, field_record_cap: 1}
sets:
  tissue:
    n: 1
    start:
    - [0.5, 0.5]
    types:
      sheet:
        block: [0.15, 0.15, 0.85, 0.85]
        fraction: 1.0
        youngs: 80.0
  cell:
    parent: tissue
    per_parent: 472
    radius: 0.02
    grow_reserve: 0
    types:
      myocyte: {fraction: 1.0, youngs: 80.0}
    state:
      pos: {width: 2, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 2, role: rate, integration: second_order_rate, boundary: free}
      phi: {width: 1, integration: none, boundary: free, record: false}
      g: {width: 1, integration: none, boundary: free, record: false}
      g2: {width: 1, integration: none, boundary: free, record: false}
      logE: {width: 1, integration: none, boundary: free, record: false}
      delay: {width: 1, integration: none, boundary: free, record: false}
      logtau: {width: 1, integration: none, boundary: free, record: false}
      logtr: {width: 1, integration: none, boundary: free, record: false}
      logdur: {width: 1, integration: none, boundary: free, record: false}
      amode: {width: 2, integration: none, boundary: free, record: false}
      gam_prev: {width: 1, integration: none, boundary: free}
      logkappa: {width: 1, integration: none, boundary: free, record: false}
  mpm_particle: {density: 1.0, parent: cell, per_parent: 120, grow_reserve: 0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 128}
  cells: {frame: label_image, source: cardio/cells_2560.tif}
operators:
- {op: cell_neighbours, at: cell, model: label_image, from: cells, before_frame: 2}
- {op: seed_from_segmentation, at: mpm_particle, from: cells, youngs_min: 80.0, youngs_max: 80.0}
- {op: material_from_cell, at: mpm_particle, parent: cell, nu: 0.3}
- {op: active_strain, at: mpm_particle, parent: cell, fit: cardio/healthy_allbeats_nodelay.npz, model: coupled,
  hidden: 8, seed: 0}
- {op: drag, at: mpm_particle, k: 150.0, emit: mpm_acceleration}
- {op: mpm_anchor, model: per_cell, at: mpm_particle, parent: cell, k: 10000.0}
- {op: mpm_strain, at: mpm_particle}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 200.0}
- {op: mpm_grid_update, at: mpm_grid, wall_contact: 0.06, wall_damp: 0.5}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_contact: 0.06, wall_damp: 0.5}
schedule:
- seed_from_segmentation
- drag
- mpm_anchor
- substep_dt: 0.0002
  compile: true
  steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]
- material_from_cell
- cell_neighbours
- active_strain
seed:
- {op: seed_state_from_file, at: cell, file: cardio/healthy_allbeats_nodelay.npz}
