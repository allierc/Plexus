_basis:
  why: apop_one with 200 deaths instead of 1, and SCATTERED rather than a patch. The stride of 10 runs
    along the Fibonacci-sphere index order, which is a spiral, so the marked cells are spread over the
    whole surface and no two are neighbours -- the `keep` permutation handed to `Hierarchy.renumber_set`
    is interleaved rather than a contiguous block, which is the case a renumber written as a truncation
    passes and a renumber written as a gather has to get right. `apop_one` moves one row; the three geometric
    death specs move a contiguous patch; this one moves 200 rows out of order.
  deaths: 200
  mode: list, stride 10
  parent: apop_one
