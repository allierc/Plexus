general:
  name: exp11_se_matrix_low_s1
  seed: 1
  n_frames: 160
  dt: 1.0
  record_cap: 162
  boundary: free
  dim: 3
  world: [50.0, 50.0, 50.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 60000
    state:
      area: {width: 1}
      centroid: {width: 3}
      chem: {width: 2, integration: first_order}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      inhib_frac: {width: 1}
  vertex: {n: 120000, mesh: half_edge}
  half_edge:
    n: 480000
    maps: {srce: vertex, trgt: vertex, face: cell}
  bm_node:
    entity: basement_membrane_node
    n: 6000
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
fields: {}
operators:
- {op: cell_geometry, at: cell}
- {op: cell_neighbours, at: cell}
- {op: cell_grow, at: vertex, rate: 0.0055, rho: 0.05, a_sw: 0.25, hill: 4.0, chan: 0, vth_frac: 2.5,
  conserve_amount: false}
- {op: bm_bond, at: bm_node, graph_mode: true, k: 5.0, cutoff: 0.5, max_neighbours: 6, overdamped_gamma: 50.0,
  emit: velocity, snapshot_every: 50}
- {op: bm_remodel, at: bm_node, tau: 2000.0, cap: 0.02}
- {op: bm_contact, implementation: live, at: bm_node, surface: vertex, k: 0.5, offset: 0.05, band: 0.3}
- {op: bm_sense, implementation: live, at: vertex, cell_set: cell, p_ref: 0.25, sharp: 1.0, chan: 0, receptor: 0.1}
- {op: cell_mechanics, at: vertex, K_A: 1.0, K_P: 1.0, K_V: 80.0, K_R: 0.0, Lambda: 0.5, Gamma: 0.4, p0: 3.5,
  mu: 1.0, relax_iters: 30, eta: 0.08, cap_frac: 0.12, K_bend: 0.02, K_lumen: 0.5, implementation: shape_contact}
- {op: interface_tension, at: vertex, K_purse: 1.0, a_sw: 0.6}
- {op: cell_divide, at: vertex, factor: 2.0, cycle_cv: 0.15, min_cycle: 4, max_cycle: 1000000000, p0: 3.5,
  every: 4, engine_clock: true, orient_iface: true, orient_asw: 0.5}
- {op: edge_flip, at: vertex, l_th_frac: 0.28, every: 1, max_flips: 300}
- {op: topo_record, at: vertex, every: 1}
schedule: [cell_geometry, cell_neighbours, cell_grow, bm_bond, bm_remodel, bm_contact, bm_sense, cell_mechanics,
  interface_tension, cell_divide, edge_flip, topo_record]
seed:
- {op: seed_mesh, at: vertex, n_cells: 200, seed: 1, vseed_cv: 0.15, radius: 5.0, jitter: 0.15, p0: 3.5}
- op: bm_seed
  implementation: live
  at: bm_node
  tissue: vertex
  offset: 0.05
  seed: 1
  hole:
    axis: [0, 0, 1]
    half_angle_deg: 30
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 30
  mesh_color: '#cfd8e3'
  mesh_style: surface
  mesh_edges: true
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 34.0
    walls: 64
    loc: [0.015, 0.035]
    wall_color: '#e8e8e8'
    mid: true
    points: false
  cross_section_height: 0.24
  curve:
  - {quantity: cells, xlabel: frame, ylabel: cells, ticks: 4}
  scale_bar_corner: right_face
  scale_bar_lift: -0.07
