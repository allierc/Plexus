general:
  name: exp14_p2_hazard2_s2
  title: 'A stratified epithelium of 1,000 basal cells: progenitors and committed cells, a suprabasal
    compartment, clones labelled'
  seed: 2
  n_frames: 15000
  dt: 1.0
  record_cap: 1500
  boundary: free
  dim: 3
  world: [80.0, 80.0, 80.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 4000
    state:
      area: {width: 1}
      centroid: {width: 3}
      chem: {width: 2, integration: first_order}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      inhib_frac: {width: 1}
      apop_flag: {width: 1}
      cell_id: {width: 1}
      parent_id: {width: 1}
      clone: {width: 1}
      mutant: {width: 1}
      fate: {width: 1}
  vertex:
    n: 10000
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
  half_edge:
    n: 30000
    maps: {srce: vertex, trgt: vertex, face: cell}
  supra:
    n: 0
    buffer: 4000
    state:
      pos: {width: 3, role: coordinate}
      dir: {width: 3, record: false}
      age: {width: 1}
      clone: {width: 1}
      mutant: {width: 1}
      cell_id: {width: 1}
fields: {}
seed:
- {op: seed_mesh, at: vertex, implementation: lineage, n_cells: 1000, radius: 11.07, jitter: 0.18, p0: 3.5,
  seed: 2, vseed_cv: 0.15, age_seed: 60.0, mutant_frac: 0.0, progenitor_frac: 0.22}
operators:
- {op: cell_geometry, at: cell}
- {op: cell_grow, at: vertex, model: timer_planar, cycle_frames: 120.0, rho: 1.0, a_sw: 50.0, hill: 4.0,
  vth_frac: 2.5, hold_block: fate}
- {op: cell_mechanics, at: vertex, K_A: 1.0, K_P: 1.0, K_V: 2.0, K_R: 0.4, Lambda: 3.0, Gamma: 0.4, p0: 3.5,
  mu: 1.0, relax_iters: 30, eta: 0.08, cap_frac: 0.12}
- {op: edge_flip, at: vertex, every: 4, engine_clock: true, l_th_frac: 0.15, max_flips: 300}
- {op: cell_divide, at: vertex, model: fate, waiting: exponential, every: 4, engine_clock: true, cycle: 60.0,
  cycle_cv: 0.4, min_cycle: 10, max_cycle: 1000000000, p0: 3.5, reset_noise: 0.12, advantage: 0.0, r_sym: 0.08,
  seed: 2}
- {op: cell_die, at: vertex, implementation: t2, rule: fate, hazard: 0.004697, select: global, every: 4,
  engine_clock: true, min_age: 4, capacity: 0, max_mark_frac: 0.5, shrink_rate: 0.3, critical_frac: 0.15,
  p0: 3.5, seed: 2, to_set: supra, shed: 0.007576, sink: 0.003, depth0: 0.05, max_depth: 0.8}
- {op: topo_record, at: vertex, every: 1}
schedule: [cell_geometry, cell_grow, cell_mechanics, edge_flip, cell_divide, cell_die, topo_record]
plotting:
  renderer: vtk_points
  background: black
  mesh_style: surface
  mesh_edges: true
  mesh_color_by: clone
  mesh_mark_division: false
  zoom: 3.0
  duration_s: 10
  slow_motion: 1
  curve:
  - {quantity: 'clones:clone', top: 12, xlabel: frame, ylabel: '% of cells', ymin: 0, ymax: 100, fixed_range: true,
    ticks: 4}
  - {quantity: cells, xlabel: frame, ylabel: cells, ticks: 4}
