fields:
  cells: {frame: label_image, source: cardio/cells_2560_hcm.tif}
  mpm_grid: {frame: mpm_grid, n_grid: 128}
general: {boundary: wall, dim: 2, dt: 0.002, field_record_cap: 1, n_frames: 54, name: cardio_strain_hcm_fit, record_cap: 200,
  seed: 0}
operators:
- {at: mpm_particle, from: cells, op: seed_from_segmentation, youngs_max: 80.0, youngs_min: 80.0}
- {at: mpm_particle, nu: 0.3, op: material_from_cell, parent: cell}
- {at: mpm_particle, fit: cardio/hcm_allbeats.npz, op: active_strain, parent: cell}
- {at: mpm_particle, emit: mpm_acceleration, k: 150.0, op: drag}
- {at: mpm_particle, k: 10000.0, model: per_cell, op: mpm_anchor, parent: cell}
- {at: mpm_particle, op: mpm_strain}
- {a_max: 200.0, at: mpm_particle, drag: 0.0, op: mpm_scatter, to: mpm_grid}
- {at: mpm_grid, op: mpm_grid_update, wall_contact: 0.06, wall_damp: 0.5}
- {at: mpm_particle, from: mpm_grid, op: mpm_gather, wall_contact: 0.06, wall_damp: 0.5}
schedule:
- seed_from_segmentation
- drag
- mpm_anchor
- compile: false
  steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]
  substep_dt: 0.0002
- material_from_cell
- active_strain
seed:
- {at: cell, file: cardio/hcm_allbeats.npz, op: seed_state_from_file}
sets:
  cell:
    grow_reserve: 0
    parent: tissue
    per_parent: 434
    radius: 0.02
    state:
      amode: {boundary: free, integration: none, record: false, width: 2}
      delay: {boundary: free, integration: none, record: false, width: 1}
      g: {boundary: free, integration: none, record: false, width: 1}
      g2: {boundary: free, integration: none, record: false, width: 1}
      gam_prev: {boundary: free, integration: none, width: 1}
      logE: {boundary: free, integration: none, record: false, width: 1}
      logdur: {boundary: free, integration: none, record: false, width: 1}
      logkappa: {boundary: free, integration: none, record: false, width: 1}
      logtau: {boundary: free, integration: none, record: false, width: 1}
      logtr: {boundary: free, integration: none, record: false, width: 1}
      phi: {boundary: free, integration: none, record: false, width: 1}
      pos: {boundary: world, integration: second_order_coordinate, role: coordinate, width: 2}
      vel: {boundary: free, integration: second_order_rate, role: rate, width: 2}
    types:
      myocyte: {fraction: 1.0, youngs: 80.0}
  mpm_particle: {density: 1.0, grow_reserve: 0, parent: cell, per_parent: 120}
  tissue:
    n: 1
    start:
    - [0.5, 0.5]
    types:
      sheet:
        block: [0.15, 0.15, 0.85, 0.85]
        fraction: 1.0
        youngs: 80.0
