general:
  name: exp10_v12a
  seed: 0
  n_frames: 900
  dt: 1.0
  record_cap: 302
  boundary: free
  dim: 3
  world:
  - 16.0
  - 16.0
  - 16.0
sets:
  cell:
    n: 4096
    state:
      area:
        width: 1
      centroid:
        width: 3
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      chem:
        width: 2
  vertex:
    n: 16384
    mesh: half_edge
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
      sep:
        width: 3
        integration: first_order
  half_edge:
    n: 32768
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
seed:
- op: seed_mesh
  model: apicobasal
  at: vertex
  n_cells: 1280
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  h0: 0.8
  apical: in
  lattice_rotation: true
operators:
- op: cell_geometry
  at: cell
- op: seed_cell_chem
  at: cell
  model: cones
  n_spots: 1
  seed_dir:
  - 0.0
  - 0.0
  - 1.0
  cone_deg: 53.13
  seed: 0
- op: cell_mechanics
  implementation: apicobasal_region
  at: vertex
  k_v: 16.0
  kappa_s: 0.05
  gamma: 0.01
  Lambda: 0.0
  K_R: 0.0
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  sep_mu: 1.0
  sigma_a:
  - 0.15
  - 0.35
  sigma_ramp: 150
  fate_block: chem
  fate_col: 0
  sigma_b:
  - 0.27
  - 0.15
  v_swell:
  - 1.56
  - 1.0
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- cell_geometry
- seed_cell_chem
- cell_mechanics
- edge_flip
- topo_record
plotting:
  duration_s: 10
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 30
  mesh_color: '#cfd8e3'
  mesh_style: surface
  mesh_edges: true
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 15.0
    walls: 64
    loc:
    - 0.015
    - 0.035
    wall_color: '#e8e8e8'
    mid: false
    points: false
  cross_section_height: 0.24
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
descriptions:
  movie:
    description: The simulation shows a spherical cluster of white cells that gradually
      deforms and expands downward over time. A distinct red cap of cells remains
      at the top of the structure while the white base elongates into a bulbous shape.
      As the frames progress, the white cells become more irregular and elongated,
      causing the overall structure to lose its perfect symmetry. The bottom of the
      cluster develops a wider, more complex protrusion while the top remains relatively
      stable.
    objects: The primary object is a large, multi-cellular cluster composed of hundreds
      of individual white polygonal cells. A smaller group of red cells forms a cap
      on the top surface of the white cluster. The white cells are arranged in a packed,
      Voronoi-like tessellation that maintains a cohesive spherical-to-bulbous topology.
      The entire structure is contained within a large, transparent 3D bounding box
      with a smaller circular cross-section view in the bottom left corner.

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation begins with a spherical cluster of white cells that has a small red cap
      at the top. As the frames progress, the red cap expands slightly while the overall white cluster
      begins to deform and elongate downwards. By the middle of the sequence, the cluster takes on a distinct
      pear-like shape with a bulging bottom. In the final frames, the shape stabilizes into a steady,
      elongated form with a consistent red cap and a rounded base.
    objects: The primary object is a large, multi-cellular cluster composed of many small, white polygonal
      cells. A smaller subset of these cells at the top is colored bright red, forming a distinct cap.
      The entire cluster is contained within a large, transparent 3D bounding box. A small circular inset
      in the bottom left shows a cross-sectional view of the cluster's internal structure.
