general:
  name: spheroid_ecm_ab
  seed: 0
  n_frames: 801
  dt: 1.0
  record_cap: 803
  boundary: wall
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  vertex:
    n: 25584
    mesh: half_edge
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
      sep:
        width: 3
        integration: first_order
  cell:
    n: 12800
    state:
      area:
        width: 1
      centroid:
        width: 3
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      apop_flag:
        width: 1
      inhib_frac:
        width: 1
  half_edge:
    n: 102400
    maps:
      srce: vertex
      trgt: vertex
      face: cell
  mpm_particle:
    n: 200000
    types:
      s0:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 50.0
        - 50.0
        - 50.0
      s1:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 50.0
        - 50.0
        - 50.0
      s2:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 50.0
        - 50.0
        - 50.0
      s3:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 50.0
        - 50.0
        - 50.0
      s4:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 50.0
        - 50.0
        - 50.0
      s5:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 50.0
        - 50.0
        - 50.0
      s6:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 50.0
        - 50.0
        - 50.0
      s7:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 50.0
        - 50.0
        - 50.0
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  rate: 0.000578
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: cell_mechanics
  model: apicobasal
  at: vertex
  k_v: 4.0
  kappa_s: 0.05
  gamma: 0.0
  Lambda: 0.0
  K_R: 0.4
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  sep_mu: 1.0
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.0
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.0
  model: adder
  delta: 1.0
- op: topo_record
  at: vertex
  every: 1
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  k_frac: 0.9
  mu: 0.4
  dt: 1.0
  n_grid: 64
  a_max: 100000.0
  centre: centroid
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 8.0
  a_max: 100000.0
  store_stress: true
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 2.0
  vmax: 1000000000.0
  implementation: warp
- op: ecm_stress
  at: mpm_particle
  scale: 2.0
  bands: 8
  measure: vonmises
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
schedule:
- cell_geometry
- cell_grow
- cell_mechanics
- edge_flip
- cell_divide
- topo_record
- substep_dt: 0.05
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- ecm_stress
- mesh_inside
seed:
- op: seed_mesh
  at: vertex
  n_cells: 200
  radius: 5.0
  jitter: 0.02
  p0: 3.5
  seed: 0
  vseed_cv: 0.0
  model: apicobasal
  h0: 0.88
  centre:
  - 25.0
  - 25.0
  - 25.0
- op: seed_ecm
  at: mpm_particle
  centre:
  - 25.0
  - 25.0
  - 25.0
  cavity_r: 5.0
  cavity_h: 5.0
  cavity_sphere: true
  axis: 2
  shell_r: 20.0
  margin: 1.0
  n_fibres: 10000
  fibre_len: 6.0
  align: 0.0
  align_dir:
  - 1.0
  - 0.0
  - 0.0
  seed: 0
  jitter: 0.1
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 0.6
  fps: 30
  mesh_color: '#cfd8e3'
  mesh_style: surface
  mesh_edges: true
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 44.0
    walls: 64
    loc:
    - 0.015
    - 0.035
    wall_color: '#e8e8e8'
    mid: false
    points: true
  cross_section_height: 0.24
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: volume
    xlabel: frame
    ylabel: cell volume
    ticks: 4
  scale_bar_corner: right
  scale_bar_lift: -0.07
  color_field: strain
  color_range:
  - 0.0
  - 0.5
