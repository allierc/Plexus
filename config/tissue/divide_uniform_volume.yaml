general:
  name: divide_uniform_volume
  seed: 0
  n_frames: 480
  dt: 1.0
  record_cap: 483
  boundary: free
  dim: 3
  world:
  - 16.0
  - 16.0
  - 16.0
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 30
  mesh_color: '#cfd8e3'
  mesh_style: surface
  mesh_edges: true
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 26.0
    walls: 64
    loc:
    - 0.015
    - 0.035
    wall_color: '#e8e8e8'
    mid: false
    points: false
  cross_section_height: 0.24
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: volume
    xlabel: frame
    ylabel: cell volume
    ticks: 4
sets:
  vertex:
    n: 25584
    mesh: half_edge
    cell_set: cell
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
      sep:
        width: 3
        integration: first_order
  cell:
    n: 12800
    state:
      area:
        width: 1
      cen:
        width: 3
fields: {}
seed:
- op: seed_mesh
  model: apicobasal
  at: vertex
  cell_set: cell
  n_cells: 1280
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  h0: 1.8
  vseed_cv: 0.0
  age_seed: 60.0
operators:
- op: cell_geometry
  at: cell
- op: cell_grow
  model: timer
  at: vertex
  cell_set: cell
  cycle_frames: 120.0
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: cell_mechanics
  model: apicobasal
  at: vertex
  k_v: 4.0
  kappa_s: 0.2
  gamma: 0.0
  Lambda: 0.0
  K_R: 0.0
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  sep_mu: 1.0
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  model: timer
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  cycle: 60.0
  cycle_cv: 0.0
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
- op: topo_record
  at: vertex
  every: 1
schedule:
- cell_geometry
- cell_grow
- cell_mechanics
- edge_flip
- cell_divide
- topo_record
