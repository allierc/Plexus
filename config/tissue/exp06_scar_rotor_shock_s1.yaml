general:
  name: exp06_scar_rotor_shock_s1
  seed: 1
  n_frames: 40000
  dt: 5.0e-06
  record_cap: 801
  boundary: wall
  dim: 2
  field_record_cap: 1
  units: {time_s: 20.833333}
sets:
  tissue:
    n: 1
    start:
    - [0.5, 0.5]
    types:
      sheet:
        block: [0.15, 0.15, 0.85, 0.85]
        fraction: 1.0
        youngs: 80.0
  cell:
    parent: tissue
    per_parent: 472
    radius: 0.02
    grow_reserve: 0
    types:
      myocyte: {fraction: 1.0, youngs: 80.0}
    state:
      pos: {width: 2, role: coordinate, integration: none, boundary: free}
      phi: {width: 1, integration: none, boundary: free, record: false}
      g: {width: 1, integration: none, boundary: free, record: false}
      g2: {width: 1, integration: none, boundary: free, record: false}
      logE: {width: 1, integration: none, boundary: free, record: false}
      delay: {width: 1, integration: none, boundary: free, record: false}
      logtau: {width: 1, integration: none, boundary: free, record: false}
      logtr: {width: 1, integration: none, boundary: free, record: false}
      logdur: {width: 1, integration: none, boundary: free, record: false}
      amode: {width: 2, integration: none, boundary: free, record: false}
      gam_prev: {width: 1, integration: none, boundary: free}
      chem: {width: 2, integration: first_order}
  mpm_particle: {density: 1.0, parent: cell, per_parent: 120, grow_reserve: 0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 128}
  cells: {frame: label_image, source: cardio/cells_2560.tif}
operators:
- {op: seed_from_segmentation, at: mpm_particle, from: cells, youngs_min: 80.0, youngs_max: 80.0}
- {op: material_from_cell, at: mpm_particle, parent: cell, nu: 0.3}
- {op: active_strain, at: mpm_particle, parent: cell, model: excitation, fit: cardio/healthy_allbeats.npz,
  t_ref: 2.0, thr: 0.5, frames_per_clock_frame: 400}
- {op: drag, at: mpm_particle, k: 150.0, emit: mpm_acceleration}
- {op: mpm_strain, at: mpm_particle, implementation: differentiable}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 200.0, implementation: differentiable}
- {op: mpm_grid_update, at: mpm_grid, wall_contact: 0.06, wall_damp: 0.5, implementation: differentiable}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_contact: 0.06, wall_damp: 0.5, implementation: differentiable}
- {op: cell_neighbours, at: cell, model: label_image, from: cells, before_frame: 2}
- op: cell_chem_diffuse
  at: cell
  implementation: closed_junctions
  d: [1614.9871, 0.0]
  chi: 1.0
  closed:
    point: [0.5, 0.5]
    normal: [1.0, 0.0]
    half_length: 0.2
- op: cell_chem_react
  at: cell
  model: aliev_panfilov
  k: 8.0
  a: 0.15
  eps0: 0.002
  mu1: 0.2
  mu2: 0.3
  rate: 1614.9871
  stim:
  - times: [0.004]
    duration: 0.0003096
    amp: 5.0
    below: {axis: 0, value: 0.215}
  - times: [0.031864]
    duration: 0.0003096
    amp: 5.0
    box:
    - [0.15, 0.15]
    - [0.35, 0.5]
  - times: [0.12784]
    duration: 0.0003096
    amp: 5.0
    box:
    - [0.0, 0.0]
    - [1.0, 1.0]
schedule:
- seed_from_segmentation
- drag
- substep_dt: 5.0e-06
  compile: false
  steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]
- material_from_cell
- cell_neighbours
- cell_chem_diffuse
- cell_chem_react
- active_strain
plotting: {renderer: mpl2d, color_field: speed, max_frames: 51, fps: 12}
seed:
- {op: seed_state_from_file, at: cell, file: cardio/healthy_allbeats.npz}
