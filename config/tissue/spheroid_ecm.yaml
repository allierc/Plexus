general:
  name: spheroid_ecm
  seed: 0
  n_frames: 400
  dt: 0.0032
  record_cap: 102
  record_every: 4
  boundary: wall
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1000.0
    force_nN: 6666.666666666667
sets:
  vertex:
    n: 4096
    mesh: half_edge
  sphere_face:
    n: 512
    state:
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
  half_edge:
    n: 4096
    maps:
      srce: vertex
      trgt: vertex
      face: sphere_face
  mpm_particle:
    n: 200000
    types:
      s0:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        - 1.0
        - 1.0
      s1:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        - 1.0
        - 1.0
      s2:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        - 1.0
        - 1.0
      s3:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        - 1.0
        - 1.0
      s4:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        - 1.0
        - 1.0
      s5:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        - 1.0
        - 1.0
      s6:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        - 1.0
        - 1.0
      s7:
        fraction: 0.125
        youngs: 15.0
        density: 1.0
        block:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        - 1.0
        - 1.0
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
seed:
- op: mesh_seed
  at: vertex
  n_cells: 400
  radius: 0.045
  centre:
  - 0.5
  - 0.5
  - 0.5
  jitter: 0.18
  p0: 3.5
  seed: 0
- op: seed_ecm
  at: mpm_particle
  centre:
  - 0.5
  - 0.5
  - 0.5
  cavity_r: 0.045
  cavity_h: 0.045
  cavity_sphere: true
  axis: 1
  shell_r: 0.4
  margin: 0.02
  n_fibres: 10000
  fibre_len: 0.12
  align: 0.0
  align_dir:
  - 1.0
  - 0.0
  - 0.0
  seed: 0
operators:
- op: surface_drive
  at: vertex
  grow: 3.0
  over: 320
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  k_frac: 0.15
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 30000.0
  centre: centroid
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 8.0
  a_max: 100000.0
  store_stress: true
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1.0e9
  implementation: warp
- op: ecm_stress
  at: mpm_particle
  scale: 2.0
  bands: 8
  measure: vonmises
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
schedule:
- surface_drive
- substep_dt: 0.0004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- ecm_stress
- mesh_inside
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  render_3d: dots
  dot_size: 1.4
  fps: 60
  slow_motion: 4
  cross_section:
    axis: z
    at: 0.5
    thickness: 6
    max_points: 6000
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
  mesh_color: '#cfd8e3'
  color_field: strain
  color_range:
  - 0.0
  - 0.5
