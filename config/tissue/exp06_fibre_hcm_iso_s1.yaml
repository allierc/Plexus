general:
  name: exp06_fibre_hcm_iso_s1
  seed: 1
  n_frames: 1750
  dt: 0.02
  record_cap: 1751
  boundary: wall
  dim: 2
  units: {time_s: 0.0129}
sets:
  tissue:
    n: 1
    start:
    - [0.5, 0.5]
    types:
      sheet:
        block: [0.15, 0.15, 0.85, 0.85]
        fraction: 1.0
        youngs: 80.0
  cell:
    parent: tissue
    per_parent: 434
    radius: 0.02
    grow_reserve: 0
    types:
      myocyte: {fraction: 1.0, youngs: 80.0}
    state:
      pos: {width: 2, role: coordinate, integration: none, boundary: free}
      chem: {width: 2, integration: first_order}
      phi: {width: 1, integration: none, boundary: free}
  mpm_particle: {density: 1.0, parent: cell, per_parent: 2, grow_reserve: 0}
fields:
  cells: {frame: label_image, source: cardio/cells_2560_hcm.tif}
operators:
- {op: seed_from_segmentation, at: mpm_particle, from: cells, youngs_min: 80.0, youngs_max: 80.0}
- {op: cell_neighbours, at: cell, model: label_image, from: cells, before_frame: 2}
- op: cell_chem_diffuse
  at: cell
  d: [10.0, 0.0]
  chi: 1.0
- op: cell_chem_react
  at: cell
  model: aliev_panfilov
  k: 8.0
  a: 0.15
  eps0: 0.002
  mu1: 0.2
  mu2: 0.3
  stim:
    times: [0.0]
    duration: 0.05
    amp: 20.0
    below: {axis: 0, value: 0.215}
schedule: [seed_from_segmentation, cell_neighbours, cell_chem_diffuse, cell_chem_react]
plotting: {renderer: mpl2d, duration_s: 10, background: black}
seed:
- {op: seed_state_from_file, at: cell, file: cardio/hcm_allbeats.npz}
