general:
  name: apop_rings
  seed: 0
  n_frames: 600
  dt: 1.0
  record_cap: 602
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 40.0
  - 40.0
  - 40.0
_run:
  target_cells: 60000
  seed_cells: 2000
sets:
  vertex:
    n: 120000
    mesh: half_edge
    cell_set: cell
  cell:
    n: 60000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
seed:
- op: mesh_seed
  at: vertex
  cell_set: cell
  n_cells: 2000
  seed: 0
  vseed_cv: 0.15
  radius: 5.0
  jitter: 0.15
  p0: 3.5
  shape: plane
  width: 4.0
operators:
- op: cell_geometry
  at: cell
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 20.0
  K_R: 0.0
  Lambda: 0.5
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  K_bend: 0.0
  K_lumen: 0.0
- op: cell_die
  at: vertex
  cell_set: cell
  p0: 3.5
  band_deg: 4.0
  shrink_rate: 0.05
  critical_frac: 0.15
  n_bands: 9
  model: prescribed
  region: band
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- cell_geometry
- cell_mechanics
- cell_die
- edge_flip
- topo_record
_basis:
  chem: none
  mat: static
  mech: plain
  grid: 4 chemistry x 2 material x 2 mechanics
  why: chemistry=none, material=static, mechanics=plain -- one cell of the basis grid written by make_basis.py;
    every value not on an axis is shared with the other fifteen.
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 30
  mesh_color: '#cfd8e3'
  mesh_style: surface
  mesh_edges: true
  real_time: false
  slow_motion: 2
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
