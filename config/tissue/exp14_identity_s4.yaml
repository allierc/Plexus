general:
  name: exp14_identity_s4
  title: A closed epithelium of 400 cells kept at its size by crowding extrusion, its clones labelled
  seed: 4
  n_frames: 26000
  dt: 1.0
  record_cap: 2600
  boundary: free
  dim: 3
  world: [50.0, 50.0, 50.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 2000
    state:
      area: {width: 1}
      centroid: {width: 3}
      chem: {width: 2, integration: first_order}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      inhib_frac: {width: 1}
      apop_flag: {width: 1}
      cell_id: {width: 1}
      parent_id: {width: 1}
      clone: {width: 1}
      mutant: {width: 1}
  vertex:
    n: 4000
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
  half_edge:
    n: 16000
    maps: {srce: vertex, trgt: vertex, face: cell}
fields: {}
seed:
- {op: seed_mesh, at: vertex, implementation: lineage, n_cells: 400, radius: 7.0, jitter: 0.18, p0: 3.5,
  seed: 4, vseed_cv: 0.15, age_seed: 60.0, mutant_frac: 0.1}
operators:
- {op: cell_geometry, at: cell}
- {op: cell_grow, at: vertex, model: timer_planar, cycle_frames: 120.0, rho: 1.0, a_sw: 50.0, hill: 4.0,
  vth_frac: 2.5}
- {op: cell_mechanics, at: vertex, K_A: 1.0, K_P: 1.0, K_V: 2.0, K_R: 0.4, Lambda: 3.0, Gamma: 0.4, p0: 3.5,
  mu: 1.0, relax_iters: 30, eta: 0.08, cap_frac: 0.12}
- {op: edge_flip, at: vertex, every: 4, engine_clock: true, l_th_frac: 0.15, max_flips: 300}
- {op: cell_divide, at: vertex, model: timer_fitness, every: 4, engine_clock: true, cycle: 60.0, cycle_cv: 0.4,
  min_cycle: 4, max_cycle: 1000000000, p0: 3.5, reset_noise: 0.12, advantage: 0.0}
- {op: cell_die, at: vertex, implementation: t2, rule: crowded, select: division, every: 4, engine_clock: true,
  n_max: 6, min_age: 4, capacity: 400, max_mark_frac: 0.5, shrink_rate: 0.3, critical_frac: 0.15, p0: 3.5,
  seed: 4}
- {op: topo_record, at: vertex, every: 1}
schedule: [cell_geometry, cell_grow, cell_mechanics, edge_flip, cell_divide, cell_die, topo_record]
plotting:
  renderer: vtk_mesh
  background: black
  mesh_color_by: mutant
  mesh_mark_division: false
  duration_s: 10
  slow_motion: 1
  label_colors: ['#b8b8b8', '#e03b2f']
