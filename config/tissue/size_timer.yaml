general:
  name: size_timer
  seed: 0
  n_frames: 1601
  dt: 1.0
  record_cap: 1603
  boundary: free
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  cell:
    n: 12800
    state:
      area:
        width: 1
      centroid:
        width: 3
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      inhib_frac:
        width: 1
  vertex:
    n: 25584
    mesh: half_edge
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
      sep:
        width: 3
        integration: first_order
  half_edge:
    n: 102400
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
operators:
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  rate: 0.000578
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: cell_mechanics
  model: apicobasal
  at: vertex
  k_v: 4.0
  kappa_s: 0.2
  gamma: 0.0
  Lambda: 0.0
  K_R: 0.0
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  sep_mu: 1.0
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  every: 4
  engine_clock: true
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  model: timer
  cycle: 100.0
- op: topo_record
  at: vertex
  every: 1
schedule:
- cell_geometry
- cell_grow
- cell_mechanics
- edge_flip
- cell_divide
- topo_record
seed:
- op: seed_mesh
  at: vertex
  n_cells: 200
  radius: 5.0
  jitter: 0.02
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
  model: apicobasal
  h0: 0.88
  ref_frame: 60
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 30
  mesh_color: '#cfd8e3'
  mesh_style: surface
  mesh_edges: true
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 34.0
    walls: 64
    loc:
    - 0.015
    - 0.035
    wall_color: '#e8e8e8'
    mid: false
    points: false
  cross_section_height: 0.24
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: volume
    xlabel: frame
    ylabel: cell volume
    ticks: 4
  scale_bar_corner: right_face
  scale_bar_lift: -0.07

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: A spherical cluster of particles initially appears small and uniform in a large cubic
      domain. As the simulation progresses, the cluster expands in size while internal red and blue regions
      begin to emerge and fluctuate. The cluster reaches a maximum volume and then undergoes a period
      of contraction and expansion, showing dynamic internal movement. By the final frames, the cluster
      has grown significantly larger and maintains a complex, heterogeneous internal structure.
    objects: The primary object is a spherical cluster composed of many small, interconnected white cells.
      Within this sphere, distinct red and blue regions appear, representing different internal states
      or properties. The cluster is centered within a large, transparent 500 $\mu$m cubic bounding box.
      A small circular inset in the bottom left corner provides a cross-sectional view of the sphere's
      boundary.
