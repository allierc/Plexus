general:
  name: sheet_morphogen
  seed: 0
  n_frames: 400
  dt: 1.0
  record_cap: 402
  boundary: free
  dim: 3
  world:
  - 18.0
  - 18.0
  - 18.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  cell:
    n: 2000
    state:
      area:
        width: 1
      centroid:
        width: 3
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      apop_flag:
        width: 1
      inhib_frac:
        width: 1
      chem:
        width: 2
        integration: first_order
  vertex:
    n: 4000
    mesh: half_edge
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        record: false
  half_edge:
    n: 16000
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
seed:
- op: seed_mesh
  at: vertex
  shape: disc
  n_cells: 400
  radius: 5.0
  jitter: 0.15
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: seed_cell_chem
  at: cell
  seed: 0
  seed_frac: 0.03
operators:
- op: cell_geometry
  at: cell
- op: cell_neighbours
  at: cell
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.046
  kk: 0.062
  rate: 1.0
- op: cell_grow
  at: vertex
  rate: 0.002
  a_sw: 0.35
  hill: 4.0
  rho: 0.0
  vth_frac: 2.5
  conserve_amount: false
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 20.0
  K_R: 0.0
  Lambda: 0.5
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  K_bend: 0.0
  K_lumen: 0.0
  plane_axis: 2
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- cell_geometry
- cell_neighbours
- cell_chem_diffuse
- cell_chem_react
- cell_grow
- cell_mechanics
- edge_flip
- topo_record
plotting:
  renderer: vtk_mesh
  background: black
  mesh_mark_division: true
  mesh_apop_color: '#e8c33a'
  camera:
    elev: 90.0
    azim: 0.0

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a hexagonal mesh of cells where red color intensity represents a
      morphogen concentration. Initially, small, isolated clusters of high concentration appear sporadically
      across the sheet. As time progresses, these clusters expand and merge into larger, more defined
      regions of high concentration. By the final frames, the morphogen has organized into three distinct,
      large, and stable domains.
    objects: The scene consists of a large, roughly circular sheet composed of 374 individual hexagonal
      cells. The cells are arranged in a continuous, interlocking honeycomb lattice. The color of the
      cells ranges from white (low concentration) to deep red (high concentration). The size of the individual
      hexagonal cells remains constant throughout the entire simulation.
  movie_kburns:
    description: The simulation shows a 2D hexagonal mesh representing a morphogen concentration field
      on a sheet. Over time, the red regions of high concentration expand and merge while the white regions
      of low concentration are compressed. The overall shape of the sheet remains relatively stable while
      the internal patterns shift dynamically. The concentration gradients evolve as the red "islands"
      grow and eventually dominate more of the surface area.
    objects: The scene consists of a single continuous sheet composed of a hexagonal grid of cells. The
      cells are colored in a gradient ranging from white (low concentration) to deep red (high concentration).
      The mesh forms an irregular, roughly elliptical shape centered in the frame. Each individual hexagon
      is small and uniform in size, creating a smooth transition between the different concentration zones.
