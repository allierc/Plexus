general:
  title: + morphogen reaction on the living shell
  name: f5_morphogen
  seed: 0
  n_frames: 250
  dt: 1.0
  record_cap: 252
  boundary: free
  dim: 3
  world: [32.0, 32.0, 32.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 16000
    state:
      area: {width: 1}
      centroid: {width: 3}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      apop_flag: {width: 1}
      inhib_frac: {width: 1}
      chem: {width: 2, integration: first_order}
  vertex:
    n: 32000
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
      sep: {width: 3, integration: first_order}
  half_edge:
    n: 128000
    maps: {srce: vertex, trgt: vertex, face: cell}
fields: {}
seed:
- {op: seed_mesh, model: apicobasal, at: vertex, n_cells: 4000, radius: 8.8, jitter: 0.15, p0: 3.5, seed: 0,
  vseed_cv: 0.15, h0: 0.8, age_seed: 25.0}
- {op: seed_cell_chem, at: cell, seed: 0, seed_frac: 0.12}
operators:
- {op: cell_geometry, at: cell}
- {op: cell_neighbours, at: cell}
- {op: cell_chem_diffuse, at: cell, implementation: graph_laplacian, d_a: 0.08, d_h: 0.16, chi: 4.0}
- {op: cell_chem_react, at: cell, model: gray_scott, F: 0.05, kk: 0.063, rate: 1.0}
- {op: cell_grow, at: vertex, rate: 0.0005, rho: 1.0, a_sw: 50.0, hill: 4.0, vth_frac: 2.5}
- {op: cell_die, at: vertex, model: crowded, p0: 3.5, n_max: 7, min_age: 4, shrink_rate: 0.2, critical_frac: 0.15,
  every: 4, engine_clock: true, max_mark_frac: 0.03}
- {op: cell_mechanics, model: apicobasal, at: vertex, k_v: 4.0, kappa_s: 0.2, gamma: 0.0, Lambda: 0.0,
  K_R: 0.0, mu: 1.0, relax_iters: 30, eta: 0.08, cap_frac: 0.12, sep_mu: 1.0}
- {op: edge_flip, at: vertex, every: 4, engine_clock: true, l_th_frac: 0.35, max_flips: 30}
- {op: cell_divide, at: vertex, model: timer, cycle: 50.0, every: 4, engine_clock: true, cycle_cv: 0.05,
  min_cycle: 4, max_cycle: 1000000000, p0: 3.5, reset_noise: 0.12}
- {op: topo_record, at: vertex, every: 1}
schedule: [cell_geometry, cell_neighbours, cell_chem_diffuse, cell_chem_react, cell_grow, cell_die, cell_mechanics,
  edge_flip, cell_divide, topo_record]
plotting:
  renderer: vtk_points
  background: black
  duration_s: 10
  slow_motion: 1
  up_axis: 2
  box_frame: false
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  fps: 30
  real_time: false
  mesh_color: '#ffffff'
  mesh_style: surface
  mesh_edges: true
  mesh_mark_division: true
  mesh_apop_color: '#0099ff'
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 30.0
    walls: 64
    loc: [0.015, 0.035]
    wall_color: '#e8e8e8'
    mid: false
    points: false
  cross_section_height: 0.24
  curve:
  - {quantity: cells, xlabel: frame, ylabel: cells, ticks: 4}
  - {quantity: volume, xlabel: frame, ylabel: cell volume, ticks: 4}
  chem_max: 0.5
