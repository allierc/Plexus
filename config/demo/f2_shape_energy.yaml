general:
  title: '+ shape energy: the shell relaxes'
  name: f2_shape_energy
  seed: 0
  n_frames: 250
  dt: 1.0
  record_cap: 252
  boundary: free
  dim: 3
  world: [32.0, 32.0, 32.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 16000
    state:
      area: {width: 1}
      centroid: {width: 3}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      apop_flag: {width: 1}
      inhib_frac: {width: 1}
  vertex:
    n: 32000
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
      sep: {width: 3, integration: first_order}
  half_edge:
    n: 128000
    maps: {srce: vertex, trgt: vertex, face: cell}
fields: {}
seed:
- {op: seed_mesh, model: apicobasal, at: vertex, n_cells: 4000, radius: 8.8, jitter: 0.15, p0: 3.5, seed: 0,
  vseed_cv: 0.15, h0: 0.8, age_seed: 25.0}
operators:
- {op: cell_geometry, at: cell}
- {op: cell_mechanics, model: apicobasal, at: vertex, k_v: 4.0, kappa_s: 0.2, gamma: 0.0, Lambda: 0.0,
  K_R: 0.0, mu: 1.0, relax_iters: 30, eta: 0.08, cap_frac: 0.12, sep_mu: 1.0}
- {op: edge_flip, at: vertex, every: 4, engine_clock: true, l_th_frac: 0.35, max_flips: 30}
- {op: topo_record, at: vertex, every: 1}
schedule: [cell_geometry, cell_mechanics, edge_flip, topo_record]
plotting:
  renderer: vtk_points
  background: black
  duration_s: 10
  slow_motion: 1
  up_axis: 2
  box_frame: false
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  fps: 30
  real_time: false
  mesh_color: '#ffffff'
  mesh_style: surface
  mesh_edges: true
  mesh_mark_division: true
  mesh_apop_color: '#0099ff'
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 30.0
    walls: 64
    loc: [0.015, 0.035]
    wall_color: '#e8e8e8'
    mid: false
    points: false
  cross_section_height: 0.24
  curve:
  - {quantity: cells, xlabel: frame, ylabel: cells, ticks: 4}
  - {quantity: volume, xlabel: frame, ylabel: cell volume, ticks: 4}
