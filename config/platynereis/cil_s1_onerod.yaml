# STEP 1 of the rebuild: ONE cilium, on a FIXED base, driven by a moment at that base.
# Nothing else in the scene -- no water, no cell -- so that 'does it beat' has one answer.
#
# THREE OPERATORS, AND IT WAS SIX. Stretch and bend are one material; the base's position pin,
# its direction clamp and its drive are one moment across one joint; and the drag was never a
# new mechanism at all -- motion_ops.drag already existed and only lacked a tangent, so it
# gained `along: chain` and rod_ops lost an operator.
#
# EVERY CONSTANT HERE WAS MEASURED BY A SWEEP, not chosen (tools/rod_sweep.py, 10 s runs):
#   k_bend    5e5 returns NaN; the bending term's stiffest mode is about 16k so an explicit
#             step needs dt < 0.5/sqrt(k) = 7.1e-4 against this dt of 1e-3. 5e4 is the limit.
#   drag k    5.0 gave a DEAD TIP (tip/base 0.15). The sperm number Sp = L(ratio*k*om/B)^(1/4)
#             was 4.3, so the stroke died a quarter of the way up. 0.07 puts Sp at 1.49,
#             inside the 1-4 real cilia live at, and the tip then swings 29 deg.
#   zeta      stretch 1.0 returns NaN, 0.3 is stable; bend 0.15 returns NaN, 0.05 is stable.
#             Both are needed because the only other sink is the drag, which has to be turned
#             DOWN to reach a biological Sp -- so the springs ring for the whole run without it.
#   clamp     0 lets the rod WINDMILL: a clean 29 deg beat whose CENTRE drifts to +32 deg,
#             because rod_elastic penalises curvature and a rigid rotation about the pin has
#             none. 40 rad/s centres it at -1.7 deg with the LARGEST amplitude of any value
#             tried (31.8 deg); 160 overpowers the drive and the beat collapses to 8 deg.
general:
  name: cil_s1_onerod
  seed: 0
  n_frames: 10000
  dt: 0.001
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  boundary: free
  save_data: true
  units:
    length_um: 50.0
    time_s: 1.0
sets:
  rod_node:
    n: 24
    start:
    - - 0.5
      - 0.5
      - 0.25
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: free
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        boundary: free
seed:
- op: rod_seed
  at: rod_node
  length: 0.4
  base:
  - 0.5
  - 0.5
  - 0.3
  direction:
  - 0.0
  - 0.0
  - 1.0
  beat_axis:
  - 0.0
  - 1.0
  - 0.0
  n_rod: 1
operators:
- op: rod_elastic
  at: rod_node
  k_stretch: 100000.0
  k_bend: 50000.0
  zeta_stretch: 0.3
  zeta_bend: 0.05
- op: rod_base
  at: rod_node
  moment: 1.0
  omega: 6.283185
  waveform: sine
  omega_n: 600.0
  zeta: 1.0
  clamp: 40.0
  clamp_zeta: 1.0
  anchor: fixed
- op: drag
  at: rod_node
  k: 0.07
  along: chain
  ratio: 2.0
fields: {}
schedule:
- rod_elastic
- rod_base
- drag
plotting:
  renderer: vtk_points
  background: black
  box_frame: true
  up_axis: 2
  subject: rod_node
  dot_size: 5.0
  dot_shading: true
  max_frames: 300
  stills: 6
  keep_stills: true
  fps: 20.0
  chain:
    set: rod_node
    per: 24
    width: 7
    color: '#ffffff'
