# THE CONTROLLED COMPARISON: 0152's rod, with WATER and nothing else changed.
#
# Every rod parameter is copied verbatim from cil_s1_onerod: 24 nodes, length 0.4, 1 Hz,
# moment 1.0, clamp 40, k_bend 5e4, k_stretch 1e5, zeta_stretch 0.3, zeta_bend 0.05, the same
# direction and the same beat axis. 0160 was NOT this comparison -- it changed four of those
# (omega 1->2 Hz, moment 1->800, clamp 40->15, k_bend 5e4->5e5) because a moment of 1 in water
# produced a 1.0 degree base swing, so it could not show what water alone does.
#
# WHAT ADDING WATER NECESSARILY DRAGS WITH IT, listed so 'only water' is not overclaimed:
#   * the stand-in `drag: {along: chain}` GOES. It was the fluid's proxy; keeping it beside real
#     water would count the fluid twice. Replacing it IS the experiment.
#   * the rod becomes `entity: mpm_particle`, so mpm_scatter/mpm_gather can carry momentum
#     between it and the water. Its Young's modulus is 1.0 against the water's bulk modulus of
#     1e5, so rod_elastic still supplies every bit of its stiffness.
#   * `boundary: free` -> `wall`, because MPM water needs a container -- which moves the drawn
#     box from [-0.5,+0.5] to [0,1], so the base moves from (0,0,-0.2) to (0.5,0.5,0.3). Same
#     place relative to the box's centre.
#   * the schedule gains a substep block at 5e-4, so the rod integrates on a FINER step than
#     152's flat 1e-3. Finer is more accurate, not different physics.
#   * rod_elastic and rod_base emit `mpm_acceleration` rather than `acceleration`, so their
#     forces go to the grid instead of being integrated by the engine while mpm_gather
#     overwrites the same coordinate.
general:
  name: cil_s3_onlywater
  seed: 0
  n_frames: 2000
  dt: 0.005
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  boundary: wall
  save_data: null
  record_cap: 161
  units:
    length_um: 50.0
    time_s: 1.0
sets:
  rod_node:
    n: 24
    start:
    - - 0.5
      - 0.5
      - 0.3
    entity: mpm_particle
    density: 1100.0
    radius: 0.01
    types:
      cilium:
        fraction: 1.0
        material: elastic
        youngs: 1.0
        density: 1100.0
        block:
        - 0.49
        - 0.49
        - 0.3
        - 0.51
        - 0.51
        - 0.7
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        boundary: free
  water:
    n: 1
    start:
    - - 0.5
      - 0.5
      - 0.5
    types:
      seawater:
        count: 1
        material: liquid
        bulk_modulus: 100000.0
        density: 1000.0
        eta: 0.001
        block:
        - 0.08
        - 0.08
        - 0.08
        - 0.92
        - 0.92
        - 0.92
  water_particle:
    parent: water
    per_parent: 1242990
    entity: mpm_particle
    density: 1000.0
    radius: 0.5
seed:
- op: rod_seed
  at: rod_node
  length: 0.4
  base:
  - 0.5
  - 0.5
  - 0.3
  direction:
  - 0.0
  - 0.0
  - 1.0
  beat_axis:
  - 0.0
  - 1.0
  - 0.0
  n_rod: 1
operators:
- op: rod_elastic
  at: rod_node
  k_stretch: 100000.0
  k_bend: 50000.0
  zeta_stretch: 0.3
  zeta_bend: 0.05
  emit: mpm_acceleration
- op: rod_base
  at: rod_node
  moment: 1.0
  omega: 6.283185
  waveform: sine
  omega_n: 600.0
  zeta: 1.0
  clamp: 40.0
  clamp_zeta: 1.0
  anchor: fixed
  emit: mpm_acceleration
- op: mpm_strain
  at: rod_node
  implementation: warp
- op: mpm_strain
  at: water_particle
  implementation: warp
- op: mpm_viscosity
  at: water_particle
  eta: 0.001
- op: mpm_scatter
  at: rod_node
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_scatter
  at: water_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
  wall_friction: 0.3
- op: mpm_gather
  at: rod_node
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
- op: mpm_gather
  at: water_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
schedule:
- substep_dt: 0.0005
  steps:
  - rod_elastic
  - rod_base
  - mpm_strain
  - mpm_strain
  - mpm_viscosity
  - mpm_scatter
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  box_frame: true
  up_axis: 2
  subject: water_particle
  dot_size: 1.6
  dot_shading: true
  max_frames: 160
  stills: 6
  keep_stills: true
  fps: 20.0
  color_field: speed
  field_cmap: inferno
  color_range:
  - 0.0
  - 0.004
  cutaway:
    axis: view
    at: 0.5
  chain:
    set: rod_node
    per: 24
    width: 7
    color: '#ffffff'
descriptions:
  movie:
    description: A thin vertical line of particles is positioned in the center of a large cubic domain.
      Over time, the particles remain stationary and do not exhibit any significant movement or dispersion.
      The simulation progresses through several time steps while the central structure maintains its integrity.
      The visual representation shows a stable state where the velocity field remains near zero.
    objects: The scene contains a single vertical line composed of many small, white particles. This line
      is located in the center of a large, black cubic volume. A scale bar in the bottom right corner
      indicates a length of 10 micrometers. The cubic domain is defined by a wireframe boundary and represents
      a 50 micrometer box.
