general:
  name: cil_s17_amp25
  seed: 0
  n_frames: 400
  dt: 0.001
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  boundary: wall
  save_data: null
  record_cap: 101
  units:
    length_um: 50.0
    time_s: 1.0
sets:
  rod_node:
    n: 24
    start:
    - - 0.5
      - 0.5
      - 0.3
    entity: mpm_particle
    density: 1100.0
    radius: 0.01
    types:
      cilium:
        fraction: 1.0
        material: elastic
        youngs: 1.0
        density: 1100.0
        block:
        - 0.49
        - 0.49
        - 0.3
        - 0.51
        - 0.51
        - 0.7
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: free
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        boundary: free
    mesh: rod_segment
  rod_segment:
    n: 23
    maps:
      srce: rod_node
      trgt: rod_node
  water:
    n: 1
    start:
    - - 0.5
      - 0.5
      - 0.5
    types:
      seawater:
        count: 1
        material: liquid
        bulk_modulus: 100000.0
        density: 1000.0
        eta: 1600.0
        block:
        - 0.08
        - 0.08
        - 0.08
        - 0.92
        - 0.92
        - 0.92
  water_particle:
    parent: water
    per_parent: 155374
    entity: mpm_particle
    density: 1000.0
    radius: 0.5
seed:
- op: rod_seed
  at: rod_node
  length: 0.4
  base:
  - 0.5
  - 0.5
  - 0.3
  direction:
  - 0.0
  - 0.0
  - 1.0
  beat_axis:
  - 0.0
  - 1.0
  - 0.0
  n_rod: 1
operators:
- op: rod_elastic
  at: rod_node
  k_stretch: 100000.0
  k_bend: 50000.0
  zeta_stretch: 0.3
  zeta_bend: 0.05
- op: rod_base
  at: rod_node
  moment: 0.0
  omega: 6.283185
  waveform: sine
  omega_n: 600.0
  zeta: 1.0
  clamp: 40.0
  clamp_zeta: 1.0
  anchor: fixed
- op: mpm_strain
  at: water_particle
  implementation: warp
- op: mpm_viscosity
  at: water_particle
  eta: 1600.0
- op: mpm_scatter
  at: water_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
  wall_friction: 0.3
- op: mpm_gather
  at: water_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
- op: drag
  at: rod_node
  k: 12.0
  along: chain
  ratio: 2.0
  field: mpm_grid
  react: true
  react_set: water_particle
- op: rod_motor
  at: rod_node
  amplitude: 25.0
  omega: 62.83185
  wavelength: 0.4
  k_motor: 50000.0
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 32
schedule:
- rod_elastic
- rod_base
- rod_motor
- drag
- substep_dt: 8.333333333333333e-05
  steps:
  - mpm_strain
  - mpm_viscosity
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  box_frame: true
  up_axis: 2
  subject: water_particle
  dot_size: 1.6
  dot_shading: true
  max_frames: 100
  stills: 6
  keep_stills: true
  fps: 20.0
  color_field: speed
  field_cmap: inferno
  cutaway:
    axis: view
    at: 0.5
  chain:
    set: rod_node
    per: 24
    width: 7
    color: '#ffffff'
  field_log: true
  color_range:
  - 0.0
  - 8.66e-06
