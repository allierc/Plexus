# spiral_galaxy (2D) -- a ROTATING self-gravitating disk (+ central point mass) on the SAME
# `squared_law` (law: gravity, all_pairs) as the nbody cluster. The spiral is not imposed:
# it emerges from ANGULAR MOMENTUM (disk_ic seeds near-circular orbits from the enclosed
# mass) + self-gravity (swing-amplified density waves). disk_ic fires once (before_frame: 1).
# N=20000 stars: the all-pairs O(N^2) force is fused with torch.compile (`compile: true`,
# ~26x, ~2.4 ms/frame on an A6000) so a dense disk runs in seconds. Total disk mass ~1.8 is
# held constant (mass/star = 1.8/20000) so the dynamics match the smaller working disk.
# Built from Mocz, "Create Your Own N-body Simulation (With Python)" (2020), papers/nbody-python/ (MIT).
general: {name: spiral_galaxy, seed: 2, n_frames: 1200, dt: 0.004, boundary: free, world: [6.0, 6.0]}
sets:
  star:
    n: 20000
    types: {s: {fraction: 1.0, mass: 0.00009}}      # disk mass ~1.8
fields: {}
operators:
  - {op: disk_ic,     at: star, G: 1.0, softening: 0.08, disc_radius: 1.6, spin: 0.90, m_bh: 1.0, vel_jitter: 0.02, before_frame: 1}
  - {op: squared_law, at: star, law: gravity, k: 1.0, softening: 0.08, all_pairs: true, compile: true}
schedule: [disk_ic, squared_law]
plotting: {background: black, point_size: 1, colors: {s: [0.85, 0.9, 1.0]}}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_star:
    description: A cluster of white particles initially appears in the center of a black field. The particles
      begin to move outward, expanding into a larger, more diffuse cloud. As time progresses, the cloud
      continues to spread and thin out across the frame. Finally, the particles become very sparse and
      faint as they reach the edges of the space.
    objects: The scene contains a large set of small, white particles. These particles are initially arranged
      in a dense, roughly spherical cluster. As the simulation evolves, the topology changes from a compact
      group to a scattered, irregular distribution. The individual particles remain consistent in size
      and color throughout the entire sequence.
