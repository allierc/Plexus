# coulomb_3_3d -- Coulomb (electrostatic inverse-square) in a 3D box via the unified `squared_law`.
# charges [2, 1, -1]; ported from ParticleGraph Coulomb (PDE_E).
# squared_law law=coulomb (default): 2nd-derivative + add-aggregated; like charges repel, opposite attract.
general: {name: coulomb_3_3d, seed: 0, n_frames: 32000, dt: 0.0000015, boundary: free, dim: 3, world: [1.0, 1.0, 1.0]}
sets:
  particle:
    n: 960
    vel_init: 0.0001
    types:
      q_p2: {fraction: 0.3333, charge: 2}
      q_p1: {fraction: 0.3333, charge: 1}
      q_n1: {fraction: 0.3334, charge: -1}
fields: {}
operators:
  - {op: radius_graph, at: particle, radius: 0.15, min_radius: 0.001}
  - {op: squared_law,  at: particle, law: coulomb, clamp: 1000000.0}
schedule: [radius_graph, squared_law]
plotting:
  renderer: vtk_points
  background: black
  size_by: charge          # point size ~ |charge|
  colors:                  # ParticleGraph PDE_E colour code (by type index)
    q_p2: [1, 1, 1]
    q_p1: [0, 0.5, 0.75]
    q_n1: [1, 0, 0]
  splat_size: 1.9
  splat_res: 820

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_particle:
    description: A dense cluster of particles is centered in a black void. The particles exhibit a subtle
      outward expansion and internal reorganization as time progresses. The distribution remains relatively
      stable, maintaining a roughly diamond-shaped boundary. The overall motion is characterized by high-frequency
      jittering within a confined spatial volume.
    objects: The scene contains a large population of small, point-like particles. These particles are
      colored in a mix of white, red, and blue. They are arranged in a dense, stochastic cluster with
      no visible connections between them. The size of each individual particle remains constant throughout
      the simulation.
