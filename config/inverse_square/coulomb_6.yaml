# coulomb_6 -- Coulomb (electrostatic inverse-square) via the unified `squared_law` operator.
# charges [1, -1, 2, -2, 3, -3]; ported from ParticleGraph Coulomb (PDE_E).
# squared_law law=coulomb (default): 2nd-derivative + add-aggregated; like charges repel, opposite attract.
general: {name: coulomb_6, seed: 0, n_frames: 32000, dt: 0.0000003, boundary: periodic}
sets:
  particle:
    n: 960
    vel_init: 0.0001
    types:
      q_p1: {fraction: 0.1667, charge: 1}
      q_n1: {fraction: 0.1667, charge: -1}
      q_p2: {fraction: 0.1667, charge: 2}
      q_n2: {fraction: 0.1667, charge: -2}
      q_p3: {fraction: 0.1667, charge: 3}
      q_n3: {fraction: 0.1665, charge: -3}
fields: {}
operators:
  - {op: radius_graph, at: particle, radius: 0.15, min_radius: 0.001}
  - {op: squared_law,  at: particle, law: coulomb, clamp: 1000000.0}
schedule: [radius_graph, squared_law]
plotting:
  background: black
  size_by: charge          # point size ~ |charge|
  colors:                  # ParticleGraph PDE_E colour code (by type index)
    q_p1: [1, 1, 1]
    q_n1: [0, 0.5, 0.75]
    q_p2: [1, 0, 0]
    q_n2: [0.75, 0, 0]
    q_p3: [0.5, 0.5, 0.5]
    q_n3: [0.5, 0.5, 0.5]
  point_size: 9.0

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_particle:
    description: The video shows a static field of multicolored particles against a black background.
      There is no visible movement or evolution of the particles between the frames. The distribution
      of the dots remains constant throughout the entire sequence. The scene represents a steady-state
      distribution of discrete points.
    objects: The scene contains thousands of small, circular dots scattered randomly across the frame.
      These particles are colored in red, blue, and various shades of gray. They are arranged in a non-uniform,
      stochastic distribution with no clear geometric patterns or connections. Each particle is approximately
      the same size, creating a uniform texture of noise.
