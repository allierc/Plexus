# coulomb_6_3d -- Coulomb (electrostatic inverse-square) in a 3D box via the unified `squared_law`.
# charges [1, -1, 2, -2, 3, -3]; ported from ParticleGraph Coulomb (PDE_E).
# squared_law law=coulomb (default): 2nd-derivative + add-aggregated; like charges repel, opposite attract.
general: {name: coulomb_6_3d, seed: 0, n_frames: 128000, dt: 0.000024, boundary: free, dim: 3, world: [1.0, 1.0, 1.0]}
sets:
  particle:
    n: 960
    vel_init: 0.0001
    types:
      q_p1: {fraction: 0.1667, charge: 1}
      q_n1: {fraction: 0.1667, charge: -1}
      q_p2: {fraction: 0.1667, charge: 2}
      q_n2: {fraction: 0.1667, charge: -2}
      q_p3: {fraction: 0.1667, charge: 3}
      q_n3: {fraction: 0.1665, charge: -3}
fields: {}
operators:
  - {op: radius_graph, at: particle, radius: 0.15, min_radius: 0.001}
  - {op: squared_law,  at: particle, law: coulomb, clamp: 1000000.0}
schedule: [radius_graph, squared_law]
plotting:
  background: black
  size_by: charge          # point size ~ |charge|
  colors:                  # ParticleGraph PDE_E colour code (by type index)
    q_p1: [1, 1, 1]
    q_n1: [0, 0.5, 0.75]
    q_p2: [1, 0, 0]
    q_n2: [0.75, 0, 0]
    q_p3: [0.5, 0.5, 0.5]
    q_n3: [0.5, 0.5, 0.5]
  splat_size: 2.6
  splat_res: 820

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_particle:
    description: A cluster of particles begins in a highly compact, organized spherical arrangement. Over
      time, the particles begin to move outward from the center, causing the cluster to expand. The expansion
      becomes increasingly chaotic as the particles spread further into the surrounding space. By the
      final frame, the cluster has significantly loosened, with many individual particles drifting away
      from the core.
    objects: The scene contains a large collection of small, spherical particles. These particles are
      primarily colored in shades of red, grey, and light blue. They are initially arranged in a dense,
      interconnected cluster at the center of the frame. As the simulation progresses, the particles maintain
      their individual shapes but lose their tight spatial connection.
