# nbody_cluster -- gravitational N-body collapse via the unified `squared_law` operator
# (law: gravity, all_pairs). Strict-Plexus reproduction of Philip Mocz, "Create Your Own
# N-body Simulation (With Python)" (2020), vendored at papers/nbody-python/ (MIT).
# 100 stars, total mass 20, softened Newtonian gravity (k=G=1, eps=0.1), OPEN boundary.
# Stars start spread in the box with random velocities and collapse into a bound, orbiting
# cluster (energy stable). Same inverse-square law as Coulomb -- only attractive, mass-
# weighted, and all-pairs (long-range, no neighbour cutoff).
general: {name: nbody_cluster, seed: 17, n_frames: 1000, dt: 0.01, boundary: free, world: [4.0, 4.0]}
sets:
  star:
    n: 100
    vel_init: 1.0
    types: {s: {fraction: 1.0, mass: 0.2}}          # 20 total mass / 100 stars
fields: {}
operators:
  - {op: squared_law, at: star, law: gravity, k: 1.0, softening: 0.1, all_pairs: true}
schedule: [squared_law]
plotting: {background: black, point_size: 4, colors: {s: [0.7, 0.7, 1.0]}}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_star:
    description: A cluster of white particles appears in the center of a black field. The particles gradually
      expand outward from the center as they move. They continue to disperse across the frame until they
      are widely scattered. The simulation ends with the particles distributed across the entire black
      space.
    objects: The objects are small, white, point-like particles. They are initially arranged in a dense,
      central cluster. As time progresses, the topology changes from a cluster to a sparse, scattered
      distribution. The particles maintain a consistent size and color throughout the entire simulation.
