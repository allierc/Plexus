# nbody_cluster -- gravitational N-body collapse via the unified `squared_law` operator
# (law: gravity, all_pairs). After Philip Mocz, "Create Your Own N-body Simulation
# (With Python)" (2020), vendored at papers/nbody-python/ (MIT).
# N=10000 stars (dense), total mass ~20 (mass/star = 0.002), softened Newtonian gravity
# (k=G=1, eps=0.1), OPEN boundary. A colder start (vel_init 0.5) + smaller dt make the
# collapse into a bound, orbiting cluster read gradually rather than flashing past. The
# all-pairs O(N^2) force is fused with torch.compile (`compile: true`) so N=10000 is cheap.
general: {name: nbody_cluster, seed: 17, n_frames: 4000, dt: 0.0006, boundary: free, world: [4.0, 4.0]}
sets:
  star:
    n: 10000
    vel_init: 0.5
    types: {s: {fraction: 1.0, mass: 0.002}}         # ~20 total mass / 10000 stars
fields: {}
operators:
  - {op: squared_law, at: star, law: gravity, k: 1.0, softening: 0.1, all_pairs: true, compile: true}
schedule: [squared_law]
plotting: {background: black, point_size: 2, colors: {s: [0.7, 0.7, 1.0]}}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_star:
    description: A large, uniform cloud of blue particles initially fills the entire frame. Over time,
      the particles begin to migrate toward the center of the space, forming a dense, concentrated cluster.
      This central mass undergoes internal structural changes, shifting from a square-like shape into
      a more elongated, horizontal band. Finally, the cluster stabilizes into a distinct, dense horizontal
      streak surrounded by a sparse halo of scattered points.
    objects: The primary objects are thousands of tiny, light-blue dots representing individual particles.
      Initially, these particles are distributed in a wide, square-shaped field across the black background.
      As the simulation progresses, the particles aggregate into a central, multi-lobed cluster with a
      high density. In the final frames, the particles form a singular, elongated horizontal structure
      with a fuzzy, diffuse boundary.
