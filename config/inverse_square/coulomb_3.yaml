# coulomb_3 -- Coulomb (electrostatic inverse-square) via the unified `squared_law` operator.
# charges [2, 1, -1]; ported from ParticleGraph Coulomb (PDE_E).
# squared_law law=coulomb (default): 2nd-derivative + add-aggregated over the neighbour graph;
# like charges repel, opposite attract. `charge` is a per-type parameter the engine broadcasts
# to a per-particle buffer the operator reads.
general: {name: coulomb_3, seed: 0, n_frames: 32000, dt: 0.0000003, boundary: periodic}
sets:
  particle:
    n: 960
    vel_init: 0.0001
    types:
      q_p2: {fraction: 0.3333, charge: 2}
      q_p1: {fraction: 0.3333, charge: 1}
      q_n1: {fraction: 0.3334, charge: -1}
fields: {}
operators:
  - {op: radius_graph, at: particle, radius: 0.15, min_radius: 0.001}
  - {op: squared_law,  at: particle, law: coulomb, clamp: 1000000.0}
schedule: [radius_graph, squared_law]
plotting:
  background: black
  size_by: charge          # point size ~ |charge|
  colors:                  # ParticleGraph PDE_E colour code (by type index)
    q_p2: [1, 1, 1]
    q_p1: [0, 0.5, 0.75]
    q_n1: [1, 0, 0]
  point_size: 9.0

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_particle:
    description: The video shows a static field of multicolored particles against a black background.
      There is no movement or evolution of the particles across the four keyframes. The distribution of
      the dots remains constant throughout the entire sequence. The scene represents a steady-state distribution
      of discrete points.
    objects: 'The scene contains three distinct sets of small, circular particles: red, blue, and white.
      These particles are distributed randomly across the entire frame without any specific geometric
      arrangement or connection. Each particle is uniform in size and appears as a single pixel or a small
      cluster of pixels. The colors are vibrant and contrast sharply against the solid black background.'
