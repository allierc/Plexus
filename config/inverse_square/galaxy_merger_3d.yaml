# galaxy_merger_3d -- the SAME two galaxies, head-on: one knob apart from `galaxy_collision_3d`
# (`swirl: 0.26` -> `0.0`), and that knob is the encounter's angular momentum. L = 0 makes the
# orbit radial, so the pericentre is 0 instead of 2.0 disc radii: the two discs fall straight
# through each other, the cores sink and merge on the first passage, and what is left is one
# spheroidal remnant with red and blue stars mixed through it and a debris halo -- no tails, since
# there is no orbital rotation to swing the stripped stars into one. Same operator, same discs,
# same masses, same `approach`: only L differs. (`approach` 0.25 rather than 0.18 keeps |v_rel|
# 0.50 -- still half the parabolic 1.00 at separation 6, so the pair is bound.)
#
# Initialization stays a SPEC concern (no operator): `spawn: two_disks` places two flat discs
# `spawn_separation` apart along x, the second tilted `spawn_tilt` radians out of the first's
# plane; `vel_init: {mode: circular_orbit}` then spins EACH disc about its own centre in its own
# plane (from that disc's enclosed mass + its `central_mass` core) and adds the encounter velocity
# as two half-speeds -- `approach` closing along the separation axis, `swirl` tangential to it.
#
# `type_layout: split_x` types the set by x, and at frame 0 the two discs are disjoint in x (each
# 2.4 wide, 6.0 apart), so the low-x disc is `red` and the high-x disc is `blue`: the colours ARE
# the two galaxies, and every later mixing of red into blue is stars changing galaxy.
general: {name: galaxy_merger_3d, seed: 2, n_frames: 10000, dt: 0.004, boundary: free, dim: 3,
          world: [12.0, 12.0, 12.0], record_cap: 1000}
sets:
  star:
    n: 25000
    spawn: two_disks                                # two flat discs, one tilted, placed to meet
    spawn_radius: 1.2                               # disc radius (each galaxy)
    spawn_thickness: 0.06                           # out-of-plane scatter: a thin disc, not a sheet
    spawn_separation: 6.0                           # distance between the two disc centres at frame 0
    spawn_offset: 0.0                               # head-on: no offset and no swirl, so L = 0
    spawn_tilt: 0.6                                 # the blue disc's plane, tilted 0.6 rad about x
    type_layout: split_x                            # low-x disc -> red, high-x disc -> blue
    vel_init: {mode: circular_orbit, G: 1.0, spin: 0.90, softening: 0.15,
               central_mass: 0.75, jitter: 0.06, approach: 0.25, swirl: 0.0}
    types:                                          # 12500 stars per galaxy: disc mass 0.75 each
      red:  {fraction: 0.5, mass: 0.00006}
      blue: {fraction: 0.5, mass: 0.00006}
fields: {}
operators:
  # softening 0.15 = 1/8 of a disc radius. Here the cores DO meet, so this is what keeps the
  # core-core force finite; halving dt to 0.002 reproduces the same trajectory to three digits.
  - {op: squared_law, at: star, law: gravity, k: 1.0, softening: 0.15, all_pairs: true}
schedule: [squared_law]
plotting: {renderer: vtk_points, background: black, colors: {red: [1.0, 0.30, 0.25], blue: [0.30, 0.55, 1.0]},
           splat_size: 1.1, splat_res: 820, movie_max_frames: 1000, fps: 25,
           # frame to the central 90% of the stars: the ~20% thrown out by the passage reach
           # several times the size of what is worth watching, and framing on the full extent
           # would leave the two discs 130 px wide in an 820 px frame.
           frame_percentile: 90,
           # camera pitch SWEEP: 0.25 rad -> 1.1 rad (~63 deg), so the encounter starts near
           # face-on and ends nearly edge-on -- the tails read as 3D structure.
           camera_azim: 0.7, camera_elev: 0.25, camera_elev_end: 1.1, camera_turns: 0.15,
           camera_zoom: 0.15, camera_pan: [0.03, 0.02]}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_star:
    description: The simulation begins with two distinct, solid spheres of red and blue color. These spheres
      rapidly disintegrate into a cloud of individual particles that begin to move and interact. As the
      particles expand, they form complex, intertwined structures that resemble swirling nebulae or turbulent
      fluids. Over time, the particles become increasingly dense and chaotic, eventually forming a large,
      overlapping cluster of red and blue points.
    objects: The scene contains two primary sets of particles, one colored red and the other colored blue.
      Initially, the red particles are clustered into a single, large, spherical mass. The blue particles
      start as a smaller, slightly elongated oval shape. As the simulation progresses, both sets of particles
      disperse into thousands of tiny, individual points that occupy a shared three-dimensional space.
