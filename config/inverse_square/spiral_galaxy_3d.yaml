# spiral_galaxy_3d -- the 3D galaxy: a rotating self-gravitating disk with finite THICKNESS on
# `squared_law` (law: gravity, all_pairs). Initialization is a SPEC concern (no operator):
# `spawn: disk` places a FLAT xy disc with out-of-plane `spawn_thickness` scatter, and
# `vel_init: {mode: circular_orbit}` seeds near-circular orbital speeds from the enclosed mass
# (+ a central point mass). Replaces the former `disk_ic` operator.
#
# TWIN of the galaxy prototype's 3D config (N=25000, cubic world 8, disc_R 1.5, thickness 0.08,
# central mass 0.5, disk mass 1.0, spin 0.9, jitter 0.06, softening 0.08, dt 0.004, 10000 frames).
general: {name: spiral_galaxy_3d, seed: 2, n_frames: 10000, dt: 0.004, boundary: free, dim: 3, world: [8.0, 8.0, 8.0]}
sets:
  star:
    n: 25000
    spawn: disk                                     # flat xy disc + out-of-plane thickness
    spawn_radius: 1.5
    spawn_thickness: 0.08
    vel_init: {mode: circular_orbit, G: 1.0, spin: 0.90, softening: 0.08, central_mass: 0.5, jitter: 0.06}
    types: {s: {fraction: 1.0, mass: 0.00004}}      # disk mass ~1.0
fields: {}
operators:
  - {op: squared_law, at: star, law: gravity, k: 1.0, softening: 0.08, all_pairs: true, compile: true}
schedule: [squared_law]
plotting: {background: black, colors: {s: [0.86, 0.9, 1.0]}, splat_size: 1.1, splat_res: 820, movie_max_frames: 1000, fps: 25}
