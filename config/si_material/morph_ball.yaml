general: {name: morph_ball, seed: 0, n_frames: 20, dt: 0.002, record_cap: 3, boundary: wall, dim: 3,
  world: [0.35, 0.35, 0.35], units: {length_um: 100.0}}
sets:
  mpm_particle:
    n: 5000
    state:
      pos: {width: 3, integration: second_order_coordinate, boundary: world, role: coordinate}
      vel: {width: 3, integration: second_order_rate, role: rate}
      rate: {width: 6, integration: none, boundary: free}
    types:
      cyto: {fraction: 1.0, youngs: 90.0, density: 1.0, block: [0.14, 0.14, 0.14, 0.21, 0.21, 0.21]}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 24}
seed:
- {op: seed_positions, at: mpm_particle, mode: ball, radius: 0.055}
operators:
- {op: mpm_strain, at: mpm_particle}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.5, a_max: 200.0}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 0.9}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 0.9, vmax: 1.0e9}
- {op: deform_control, at: mpm_particle, implementation: block, block: rate, after_frame: 1}
schedule:
- {substep_dt: 0.00034, compile: true, steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]}
- deform_control
plotting: {}
