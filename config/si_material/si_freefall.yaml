general:
  name: si_freefall
  seed: 0
  n_frames: 300
  dt: 0.02
  boundary: wall
  dim: 3
  world:
  - 100.0
  - 100.0
  - 100.0
  save_data: true
  units:
    length_um: 1000000.0
    time_s: 1.0
    force_nN: 1000000000.0
sets:
  cell:
    n: 1
    start:
    - - 50.0
      - 80.0
      - 50.0
    types:
      snow:
        fraction: 1.0
        material: snow
        shape: ball
        youngs: 140000.0
  mpm_particle:
    parent: cell
    per_parent: 33510
    radius: 0.5
    density: 400.0
    particle_mass: 50.0
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 100
operators:
- op: gravity
  at: cell
  g: 9.81
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.9
  wall_damp_mode: per_impact
  vmax: 1000000000.0
  implementation: warp
schedule:
- gravity
- substep_dt: 0.001
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  background: black
  up_axis: 1
  camera_elev: 1.18
  camera_zoom: 0.0
  box_frame: true
  hide_sets:
  - cell
  dot_size: 2.2
  render_3d: dots
  camera_turns: 0.0
  colors:
    snow:
    - 0.88
    - 0.93
    - 1.0
