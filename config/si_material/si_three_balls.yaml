general:
  name: si_three_balls
  seed: 1
  n_frames: 800
  dt: 0.0008333333333333334
  boundary: wall
  dim: 3
  world:
  - 0.5
  - 0.5
  - 0.5
  save_data: false
  units:
    length_um: 1000000.0
    time_s: 1.0
    force_nN: 1000000000.0
sets:
  cell:
    n: 3
    start:
    - - 0.15
      - 0.31
      - 0.25
    - - 0.25
      - 0.37
      - 0.25
    - - 0.35
      - 0.29
      - 0.25
    type_layout: ordered
    types:
      elastic:
        count: 1
        material: elastic
        youngs: 2000000.0
        density: 1000.0
        shape: ball
      liquid:
        count: 1
        material: liquid
        bulk_modulus: 981000.0
        density: 1000.0
        shape: ball
      snow:
        count: 1
        material: snow
        youngs: 500000.0
        density: 350.0
        shape: ball
  mpm_particle:
    parent: cell
    per_parent: 100000
    density: 1000.0
    radius: 0.05
    vel_init: 0.4
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 96
operators:
- op: gravity
  at: cell
  g: 9.81
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_viscosity
  at: mpm_particle
  eta: 0.001
- op: mpm_scatter
  at: mpm_particle
  implementation: warp
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.5
  wall_friction: 0.4
  surface_tension: 0.072
  csf_rho: 1000.0
  csf_band: 0.2
- op: mpm_gather
  at: mpm_particle
  implementation: warp
  from: mpm_grid
  wall_damp: 1.0
  vmax: 1000000000.0
schedule:
- gravity
- substep_dt: 4.385965e-05
  steps:
  - mpm_strain
  - mpm_viscosity
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  max_frames: 400
  stills: 10
  keep_stills: true
  splat_res: 600
  box_frame: true
  hide_sets:
  - cell
  colors:
    elastic:
    - 0.95
    - 0.25
    - 0.2
    liquid:
    - 0.3
    - 0.55
    - 1.0
    snow:
    - 0.95
    - 0.95
    - 0.95
  slow_motion: 4
  render_3d: dots
