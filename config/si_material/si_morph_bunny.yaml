general:
  name: si_morph_bunny
  seed: 1
  n_frames: 900
  dt: 0.0008333333333333334
  boundary: wall
  dim: 3
  world:
  - 0.5
  - 0.5
  - 0.5
  save_data: false
  units:
    length_um: 1000000.0
    time_s: 1.0
    force_nN: 1000000000.0
sets:
  cell:
    n: 3
    start:
    - - 0.12
      - 0.3
      - 0.25
    - - 0.25
      - 0.38
      - 0.25
    - - 0.38
      - 0.3
      - 0.25
    types:
      a:
        fraction: 0.3334
        material: elastic
        youngs: 2000000.0
        density: 1000.0
        shape: obj
        obj: bunny
      b:
        fraction: 0.3333
        material: elastic
        youngs: 2000000.0
        density: 1000.0
        shape: obj
        obj: bunny
      c:
        fraction: 0.3333
        material: elastic
        youngs: 2000000.0
        density: 1000.0
        shape: obj
        obj: bunny
  mpm_particle:
    parent: cell
    per_parent: 100000
    density: 1000.0
    vel_init: 0.6
    vel_init_axes:
    - 0
    - 1
    particle_mass: 2.077e-06
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 96
operators:
- op: gravity
  at: cell
  g: 9.81
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 1.0
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 1.0
  vmax: 1000000000.0
  implementation: warp
schedule:
- gravity
- substep_dt: 4.385965e-05
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  render_3d: dots
  dot_size: 1.2
  splat_res: 600
  box_frame: true
  hide_sets:
  - cell
  colors:
    a:
    - 1.0
    - 0.45
    - 0.4
    b:
    - 0.4
    - 0.85
    - 0.55
    c:
    - 0.45
    - 0.6
    - 1.0
  slow_motion: 4
