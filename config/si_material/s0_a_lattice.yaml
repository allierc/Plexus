# S0-A "nine boxes on a lattice" -- ONE type, `repeat` + `pitch`, where the reference spells 27
# types by hand. The points are split among the copies, so nine boxes weigh what one did.
general: {name: s0_a_lattice, seed: 1, n_frames: 400, dt: 0.002, boundary: wall, dim: 3, world: [0.5, 0.5, 0.5], save_data: true, record_cap: 301, units: {length_um: 1000000.0, time_s: 1.0, force_nN: 1000000000.0}}
sets:
  cell:
    n: 1
    start: [[0.25, 0.3, 0.25]]
    types:
      box: {count: 1, material: elastic, youngs: 500000.0, density: 1000.0, shape: cube, repeat: [3, 1, 3], pitch: 0.09}
  mpm_particle: {parent: cell, per_parent: 9000, radius: 0.03, density: 1000.0, particle_mass: 2.0e-7}
fields: {mpm_grid: {frame: mpm_grid, n_grid: 96}}
operators:
- {op: gravity, at: cell, g: 9.81}
- {op: mpm_strain, at: mpm_particle}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 200.0, polar: higham}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 1.0}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 0.6, wall_damp_mode: per_impact, vmax: 1000000000.0}
schedule: [gravity, {substep_dt: 5.0e-5, steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]}]
plotting: {renderer: vtk_points, background: black, up_axis: 1, box_frame: true, hide_sets: [cell], render_3d: dots, dot_size: 1.6, colors: {box: [0.5, 0.9, 0.55]}}
