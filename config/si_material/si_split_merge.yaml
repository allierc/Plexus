fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 96
operators:
- op: gravity
  at: cell
  g: 0.0
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_viscosity
  at: mpm_particle
  eta: 0.001
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 1.0
  surface_tension: 0.072
  csf_rho: 1000.0
  csf_band: 0.2
  before_frame: 1200
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 1.0
  surface_tension: -0.072
  csf_rho: 1000.0
  csf_band: 0.2
  after_frame: 1200
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 1.0
  vmax: 1000000000.0
  implementation: warp
schedule:
- gravity
- substep_dt: 2.083333e-05
  steps:
  - mpm_strain
  - mpm_viscosity
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  camera_elev: 1.18
  camera_zoom: 0.0
  camera_turns: 0.0
  box_frame: true
  hide_sets:
