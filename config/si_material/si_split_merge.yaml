  - 0.05
  save_data: false
  units:
    length_um: 1000000.0
    time_s: 1.0
    force_nN: 1000000000.0
sets:
  cell:
    n: 1
    types:
      a:
        material: liquid
        bulk_modulus: 98100.0
        block:
        - 0.01
        - 0.019
        - 0.019
        - 0.024
        - 0.031
        - 0.031
        fraction: 0.5
      b:
        material: liquid
        bulk_modulus: 98100.0
        block:
        - 0.026
        - 0.019
        - 0.019
        - 0.04
        - 0.031
        - 0.031
