general:
  name: si_jet_sphere_slice
  engine: continuous
  seed: 0
  n_frames: 900
  dt: 0.0008333333333333334
  boundary: wall
  dim: 3
  world:
  - 0.1
  - 0.05
  - 0.1
  obstacles:
  - - 0.05
    - 0.0325
    - 0.05
    - 0.002
  save_data: false
  units:
    length_um: 1000000.0
    time_s: 1.0
    force_nN: 1000000000.0
sets:
  cell:
    n: 1
    types:
      jet:
        fraction: 1.0
        material: liquid
        bulk_modulus: 40000.0
        shape: cube
        eta: 0.001
  mpm_particle:
    parent: cell
    per_parent: 1000000
    radius: 0.5
    density: 1000.0
    particle_mass: 1.76606e-08
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 96
operators:
- op: aggregate
  at: cell
- op: gravity
  at: cell
  g: 9.81
- op: mpm_emit
  at: mpm_particle
  face: -y
  speed: 0.8
  ppc: 8.0
  patch:
  - 0.46
  - 0.46
  - 0.54
  - 0.54
- op: mpm_drain
  at: mpm_particle
  face: -y
  at_fraction: 0.2
  sponge: 8.0
  damp: 0.15
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_viscosity
  at: mpm_particle
  eta: 0.001
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
  surface_tension: 0.01
  csf_rho: 1000.0
  csf_band: 0.2
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
schedule:
- aggregate
- gravity
- mpm_emit
- mpm_drain
- substep_dt: 3.205128e-05
  steps:
  - mpm_strain
  - mpm_viscosity
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  background: black
  up_axis: 1
  camera_elev: 1.18
  camera_zoom: 0.0
  camera_turns: 0.0
  box_frame: true
  hide_sets:
  - cell
  render_3d: dots
  dot_size: 1.0
  slow_motion: 4
  colors:
    jet:
    - 0.3
    - 0.62
    - 1.0
  cross_section:
    axis: z
    at: 0.5
    thickness: 1.92
    max_points: 8000
    only: true
