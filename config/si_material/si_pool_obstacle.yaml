descriptions:
  movie:
    description: A red spherical cluster of particles descends vertically through
      a large cubic domain. As it falls, it approaches a dense, horizontal layer of
      blue particles at the bottom of the cube. Upon contact, the red cluster begins
      to merge and disperse into the blue layer. Over time, the red particles become
      increasingly integrated and obscured within the blue mass.
    objects: A small, spherical cluster of red particles is positioned in the upper
      center of the domain. A large, rectangular slab of blue particles occupies the
      bottom third of the cubic space. The entire simulation is contained within a
      transparent wireframe cube with a 10 cm side length. A white scale bar in the
      bottom right corner indicates a length of 2 cm.
  movie_mpm_particle:
    description: 'A red sphere is positioned in the upper half of a transparent cube.

      The bottom portion of the cube is filled with a blue substance.

      The red sphere remains stationary in the center of the upper void.

      The blue substance remains static at the bottom of the container throughout
      the sequence.'
    objects: 'A large transparent cube serves as the primary container for the scene.

      A small red sphere is located in the upper center of the cube.

      A large blue rectangular volume occupies the bottom third of the cube.

      The red sphere and blue volume are spatially separated by a clear gap.'

