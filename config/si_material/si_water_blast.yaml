fields:
  mpm_grid: {frame: mpm_grid, n_grid: 192}
operators:
- {op: gravity, at: cell, g: 9.81}
- {op: mpm_strain, at: mpm_particle, implementation: warp}
- {op: mpm_viscosity, at: mpm_particle, eta: 0.001}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 4000.0, implementation: warp, polar: higham}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 0.4, wall_friction: 0.2, surface_tension: 0.8, csf_rho: 1000.0, csf_band: 0.3}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 1.0, vmax: 1000000000.0, implementation: warp}
schedule:
- gravity
- substep_dt: 1.5e-05
  steps: [mpm_strain, mpm_viscosity, mpm_scatter, mpm_grid_update, mpm_gather]
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  render_3d: dots
  max_frames: 200
  stills: 10
  keep_stills: true
  box_frame: true
  floor: '#06102a'
  floor_opacity: 0.35
  hide_sets: [cell]
  slow_motion: 4
  dot_size: 1.2
  dot_shading: true
  dot_specular: 0.25
  dot_specular_power: 16
  colors:
    pool: [0.06, 0.24, 0.75]
    jet00: [0.0, 0.0, 1.0]
