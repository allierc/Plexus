general:
  name: si_water_blast
  seed: 1
  n_frames: 900
  dt: 0.0005
  boundary: wall
  dim: 3
  world: [0.5, 0.5, 0.5]
  save_data: true
  units: {length_um: 1000000.0, time_s: 1.0, force_nN: 1000000000.0}

sets:
  cell:
    n: 2
    start:
    - [0.25, 0.10, 0.25]
    - [0.25, 0.08, 0.25]
    types:
      pool:
        count: 1
        material: liquid
        bulk_modulus: 2200000.0
        density: 1000.0
        eta: 0.001
        block: [0.03, 0.02, 0.03, 0.47, 0.18, 0.47]
      charge:
        count: 1
        material: liquid
        bulk_modulus: 2200000.0
        density: 1000.0
        eta: 0.001
        shape: ball
    type_layout: ordered
  mpm_particle:
    parent: cell
    per_parent: {pool: 470000, charge: 30000}
    radius: 0.035
    density: 1000.0

fields:
  mpm_grid: {frame: mpm_grid, n_grid: 128}

operators:
- {op: gravity, at: cell, g: 9.81}
- op: mpm_turgor
  at: mpm_particle[parent=1]
  pressure: 6000000.0
  after_frame: 30
  before_frame: 90
- {op: mpm_strain, at: mpm_particle, implementation: warp}
- {op: mpm_viscosity, at: mpm_particle, eta: 0.001}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 4000.0, implementation: warp, polar: higham}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 0.4, wall_friction: 0.2, surface_tension: 0.072, csf_rho: 1000.0, csf_band: 0.2}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 1.0, vmax: 1000000000.0, implementation: warp}

schedule:
- mpm_turgor
- gravity
- substep_dt: 2.5e-05
  steps: [mpm_strain, mpm_viscosity, mpm_scatter, mpm_grid_update, mpm_gather]

plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  render_3d: dots
  dot_size: 2.0
  dot_shading: true
  color_field: speed
  field_cmap: turbo
  max_frames: 450
  stills: 12
  keep_stills: true
  box_frame: true
  floor: '#0b1a3a'
  floor_opacity: 0.3
  hide_sets: [cell]
  colors: {pool: [0.30, 0.55, 1.00], charge: [1.00, 0.75, 0.25]}
  slow_motion: 4
