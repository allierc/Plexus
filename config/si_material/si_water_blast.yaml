    per_parent: {pool: 6800000, jet00: 8000, jet01: 8000, jet02: 8000, jet03: 8000, jet04: 8000, jet05: 8000, jet06: 8000,
      jet07: 8000, jet08: 8000, jet09: 8000}
    radius: 0.01
    density: 1000.0
    vel_init:
      mode: cone
      axis: 1
      speed: 11.0
      spread_deg: 30
      speed_jitter: 0.3
      types: [jet00, jet01, jet02, jet03, jet04, jet05, jet06, jet07, jet08, jet09]
      per_type:
        jet00: {speed: 5.0, spread_deg: 55.0}
        jet01: {speed: 5.67, spread_deg: 50.6}
