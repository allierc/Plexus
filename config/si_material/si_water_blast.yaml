    - [0.2573, 0.088, 0.3364]
    - [0.2298, 0.088, 0.4319]
    type_layout: ordered
    types:
      pool:
        count: 1
        block: [0.03, 0.02, 0.03, 0.47, 0.11, 0.47]
        material: liquid
        bulk_modulus: 2200000.0
        density: 1000.0
        eta: 0.001
      jet_a: {count: 12, shape: ball, material: liquid, bulk_modulus: 2200000.0, density: 1000.0, eta: 0.001}
      jet_b: {count: 13, shape: ball, material: liquid, bulk_modulus: 2200000.0, density: 1000.0, eta: 0.001}
  mpm_particle:
    parent: cell
    per_parent: {pool: 900000, jet_a: 24000, jet_b: 24000}
    radius: 0.022
    density: 1000.0
    vel_init:
      mode: cone
      speed: 6.5
      axis: 1
      spread_deg: 22
      speed_jitter: 0.3
      types: [jet_a, jet_b]
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 192}
operators:
- {op: gravity, at: cell, g: 9.81}
- {op: mpm_strain, at: mpm_particle, implementation: warp}
- {op: mpm_viscosity, at: mpm_particle, eta: 0.001}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 4000.0, implementation: warp, polar: higham}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 0.4, wall_friction: 0.2, surface_tension: 3.0, csf_rho: 1000.0,
  csf_band: 0.3}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 1.0, vmax: 1000000000.0, implementation: warp}
schedule:
- gravity
- substep_dt: 1.6e-05
  steps: [mpm_strain, mpm_viscosity, mpm_scatter, mpm_grid_update, mpm_gather]
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  render_3d: contour
  contour_by_type: false
  surface_env: true
  surface_env_color: white
  surface_opacity: 0.5
  surface_roughness: 0.07
  surface_metallic: 0.0
  contour_ngrid: 256
  contour_smooth: 6
  max_frames: 300
  stills: 12
  keep_stills: true
  box_frame: true
  floor: '#06102a'
  floor_opacity: 0.35
  hide_sets: [cell]
  slow_motion: 4
  surface_color: '#2a6fdc'
  contour_sigma: 0.85
  contour_iso_frac: 0.22
