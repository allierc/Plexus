    - [0.3501, 0.09, 0.3244]
    - [0.4193, 0.09, 0.3382]
    - [0.2003, 0.09, 0.0928]
    - [0.3732, 0.09, 0.3889]
    - [0.1922, 0.09, 0.4254]
    - [0.257, 0.09, 0.3328]
