# S0-D "a bed of grains" -- `scatter`, the last of stage 0's words: ONE type becomes 60 balls whose
# centres are drawn in a box, where a spec would otherwise need 60 types or 60 `start` rows.
# A slab is dropped on the bed afterwards, so the run says something: a bed compacts, a solid does not.
general: {name: s0_d_grains, seed: 3, n_frames: 500, dt: 0.002, boundary: wall, dim: 3, world: [0.5, 0.5, 0.5], save_data: true, record_cap: 301, units: {length_um: 1000000.0, time_s: 1.0, force_nN: 1000000000.0}}
sets:
  cell:
    n: 2
    start: [[0.25, 0.12, 0.25], [0.25, 0.36, 0.25]]
    types:
      grains: {count: 1, material: elastic, youngs: 800000.0, density: 1400.0, shape: ball, repeat: [5, 2, 6], scatter: [0.07, 0.05, 0.07, 0.43, 0.17, 0.43]}
      lid:    {count: 1, material: elastic, youngs: 8000000.0, density: 2600.0, block: [0.08, 0.34, 0.08, 0.42, 0.38, 0.42]}
  mpm_particle: {parent: cell, per_parent: 18000, radius: 0.03, density: 1500.0, particle_mass: 1.2e-4}
fields: {mpm_grid: {frame: mpm_grid, n_grid: 96}}
operators:
- {op: gravity, at: cell, g: 9.81}
- {op: mpm_strain, at: mpm_particle}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 200.0, polar: higham}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 1.0}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 0.2, wall_damp_mode: per_impact, wall_friction: 0.6, vmax: 1000000000.0}
schedule: [gravity, {substep_dt: 2.0e-5, steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]}]
plotting: {renderer: vtk_points, background: black, up_axis: 1, box_frame: true, hide_sets: [cell], render_3d: dots, dot_size: 1.6, colors: {grains: [0.95, 0.75, 0.3], lid: [0.55, 0.6, 0.68]}}
