# S4-N "the atlas, said in the spec" -- the test that closes stage S4. Every one of the fifteen
# compartments states its OWN geometry here, in a `geometry:` block on its `seed_cell_atlas` line:
# where its pieces go (`place`, `r` or `r_in`/`r_out`), which way they face (`axis`), what shape
# they are and the shape's own proportions. Nothing is read from the Python table -- the rows
# below ARE the table, and they seed the identical cell.
#
# This is config/cell/adh_base.yaml with those fifteen blocks filled in from `cell_ops.ATLAS`, and
# the point of the exercise is that the two seeds agree: same piece counts, same positions, same
# volumes. Once a table can be said in a spec, the Python copy is a DEFAULT rather than the truth.
# WHY THE PROTEINS ARE OPAQUE. The five species are co-located balls of the cell's own radius --
# they are a concentration, not a place -- so five translucent clouds of different hues BLEND, and
# yellow over blue over pink over violet over green averages to grey. Measured: zero saturated
# pixels at 0.85 opacity. Drawn opaque, the nearest dot wins and the cytoplasm reads as a speckle
# of five colours, which is what five species mixed at the same point actually looks like.
#
# AND THINNED, for the same reason. Opaque and complete, the LAST species drawn covers the other
# four -- 12,500 points of one hue over the same ball is an opaque wall, and the picture went from
# grey to uniformly green. `surface_sample: 2200` draws a fifth of each compartment, so all five
# show through each other. It is a drawing decision and changes no number in the model.
# EVERY ATLAS SEED OPERATOR GETS ITS OWN `seed`, and it matters more than it looks. The five
# protein species are five balls of the cell's own radius drawn from the same distribution, and
# `seed_cell_atlas` defaults to `seed: 0` -- so all five drew the SAME 12,500 points. Measured:
# max |difference| between protein_a and each of b, c, d, e was 0 m, exactly. Sixty-two thousand
# material points stacked in five identical copies, which is one cloud with five labels and five
# times the mass in the same place. A distinct seed per operator is what makes them five species.
general:
