# S3-G "a ring of twelve capsules pointing outward" -- `ring` places the copies on a circle and
# `orient: radial` turns each one to face away from the centre, which is what a rosette means and
# what a lattice of parallel rods is not. One type, twelve bodies, one colour each by `copy`.
general: {name: s3_g_ring, seed: 1, n_frames: 400, dt: 0.002, boundary: wall, dim: 3, world: [0.5, 0.5, 0.5], save_data: true, record_cap: 301, units: {length_um: 1000000.0, time_s: 1.0, force_nN: 1000000000.0}}
sets:
  cell:
    n: 1
    start: [[0.25, 0.25, 0.25]]
    types:
      spoke: {count: 1, material: elastic, youngs: 600000.0, density: 1000.0, shape: cylinder, aspect: 3.0, axis: z,
              ring: {n: 12, radius: 0.13, axis: y}, orient: radial}
  mpm_particle: {parent: cell, per_parent: 60000, radius: 0.03, density: 1000.0, particle_mass: 1.2e-5,
                 state: {pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}, vel: {width: 3, role: rate, integration: second_order_rate}, copy: {width: 1}}}
fields: {mpm_grid: {frame: mpm_grid, n_grid: 96}}
operators:
- {op: gravity, at: cell, g: 9.81}
- {op: mpm_strain, at: mpm_particle}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 200.0, polar: higham}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 1.0}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 0.35, wall_damp_mode: per_impact, wall_friction: 0.4, vmax: 1000000000.0}
schedule: [gravity, {substep_dt: 2.0e-5, steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]}]
plotting: {renderer: vtk_points, background: black, up_axis: 1, box_frame: true, hide_sets: [cell], render_3d: dots, dot_size: 2.0, dot_shading: body, color_field: copy, field_cmap: tab20, color_range: [0, 11]}
