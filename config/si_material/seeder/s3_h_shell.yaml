# S3-H "a cell with organelles on a shell and a nucleus in the middle" -- the atlas's own idea, said
# in a spec: `shell` scatters a type's copies over a sphere (a Fibonacci spiral, so they do not
# clump as a random draw would), `orient: radial` turns each one outward, and a second type sits
# alone at the centre. What `seed_cell_atlas` does in 200 lines of Python, in three type lines.
general: {name: s3_h_shell, seed: 1, n_frames: 300, dt: 0.002, boundary: wall, dim: 3, world: [0.5, 0.5, 0.5], save_data: true, record_cap: 301, units: {length_um: 1000000.0, time_s: 1.0, force_nN: 1000000000.0}}
sets:
  cell:
    n: 2
    start: [[0.25, 0.25, 0.25], [0.25, 0.25, 0.25]]
    types:
      mito:    {count: 1, material: elastic, youngs: 400000.0, density: 1000.0, shape: cylinder, aspect: 2.5, axis: z,
                shell: {n: 24, radius: 0.14}, orient: radial}
      nucleus: {count: 1, material: elastic, youngs: 150000.0, density: 1100.0, shape: ball}
  mpm_particle: {parent: cell, per_parent: 48000, radius: 0.03, density: 1000.0, particle_mass: 1.0e-5,
                 state: {pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}, vel: {width: 3, role: rate, integration: second_order_rate}, copy: {width: 1}}}
fields: {mpm_grid: {frame: mpm_grid, n_grid: 96}}
operators:
- {op: mpm_strain, at: mpm_particle}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 200.0, polar: higham}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 1.0}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 0.5, wall_damp_mode: per_impact, vmax: 1000000000.0}
schedule: [{substep_dt: 2.0e-5, steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]}]
plotting: {renderer: vtk_points, background: black, up_axis: 1, box_frame: true, hide_sets: [cell], render_3d: dots, dot_size: 2.0, dot_shading: body, color_field: copy, field_cmap: tab20, color_range: [0, 23]}
