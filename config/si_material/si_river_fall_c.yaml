sets:
  cell:
    n: 1
    types:
      water:
        material: liquid
        bulk_modulus: 1440000.0
        density: 1000.0
        fraction: 1.0
        shape: cube
  mpm_particle:
    parent: cell
    per_parent: 15000000
    radius: 0.5
    density: 1000.0
    particle_mass: 5.120000000000001e-07
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 100
operators:
- op: gravity
  at: cell
  g: 9.81
- op: mpm_emit
  at: mpm_particle
  face: +x
  speed: 2.0
  ppc: 8.0
  patch:
  - 0.8
  - 0.08
  - 0.87
  - 0.92
- op: mpm_drain
  at: mpm_particle
  face: +x
  at_fraction: 0.03
  sponge: 8.0
  damp: 0.3
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_viscosity
  at: mpm_particle
  eta: 0.001
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 392.40000000000003
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
  surface_tension: 0.0
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
schedule:
- gravity
- mpm_emit
- mpm_drain
- substep_dt: 1.6666666666666667e-05
