- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
  surface_tension: 0.072
  csf_rho: 1000.0
  csf_band: 0.2
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
schedule:
- gravity
- substep_dt: 6.410256e-05
  steps:
  - mpm_strain
  - mpm_viscosity
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  camera_elev: 1.18
  camera_zoom: 0.0
  camera_turns: 0.0
  box_frame: true
  hide_sets:
  - cell
  render_3d: dots
  dot_size: 1.3
  slow_motion: 4
  colors:
    water:
    - 0.3
    - 0.62
    - 1.0

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: A blue fluid substance flows from the top surface and cascades down through a series
      of stacked horizontal plates. As the fluid falls, it spreads out and splashes onto each subsequent
      level, creating thin layers of liquid. The flow becomes increasingly dispersed and turbulent as
      it moves toward the bottom of the structure. By the final frame, the fluid has accumulated on the
      lowest plate and begun to pool and spread across its surface.
    objects: The scene contains five large, rectangular grey plates arranged in a vertical, staggered
      stack. These plates are uniform in thickness and are positioned at different depths to create a
      cascading path. A blue particle-based fluid is introduced at the top and moves downward through
      the gaps between the plates. A white bounding box and a scale bar of 100 mm define the spatial dimensions
      of the simulation environment.
