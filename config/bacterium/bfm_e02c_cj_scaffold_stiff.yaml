  mpm_grid_scaffold: {frame: mpm_grid, n_grid: 128}
seed:
- op: cloud_seed
  at: stator_unit
  cloud: bfm_cj/stators
  origin: [0.5, 0.5, 0.289286]
  scale: 7142857.142857143
- op: cloud_seed
  at: membrane
  cloud: bfm_cj/membrane
  origin: [0.5, 0.5, 0.3]
  scale: 7142857.142857143
operators:
- op: membrane_potential
  at: cell
  capacitance: 66046486.71993866
  pump_max: 10000.0
  pump_rev: 0.0005670730629384497
  leak: 5878137.318074541
  psi0: 0.00042530479720383717
  h0: [0.0, 0.0]
  flux: j_motor
- {op: broadcast, at: stator_unit, block: psi, source: psi}
- op: stator_push
  model: contact
  at: c_flig_pt
  stator: stator_unit
  kappa: 0.01456522628597254
  reach: 0.064286
  axis: [0.0, 0.0, 1.0]
  sign: 1.0
  anchor: MotB_pt
  anchor_reach: 0.057143
- {op: stator_step, at: stator_unit, r0: 55.0, k_c: 50.0, eps: 0.0008506095944076743, kT: 7.256552927739212e-05,
  delta: 0.241660973353061, theta: 0.1, ions: 2.0, stochastic: false, seed: 0}
- {op: aggregate, at: stator_unit, block: flux, target: j_motor, reduce: sum}
- {op: broadcast, at: membrane, block: psi, source: psi}
- {op: stator_membrane, at: membrane, stator: stator_unit, reach: 0.042857, block: j_in}
- {op: mpm_anchor, at: lp_ring_pt, k: 4000.0, applies_to: substrate}
- {op: mpm_anchor, at: PflB_pt, k: 4000.0, applies_to: substrate}
- {op: mpm_strain, at: c_posts_a_pt, implementation: warp}
- {op: mpm_strain, at: c_posts_b_pt, implementation: warp}
- {op: mpm_strain, at: c_flig_pt, implementation: warp}
- {op: mpm_strain, at: ms_ring_pt, implementation: warp}
