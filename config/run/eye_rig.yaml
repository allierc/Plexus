name: eye_rig
spec: config/neural/ctrnn_eyeG_rig.yaml
task: t5_gaze_tracking_big
learnable:
- {block: w, of: afferent}
- {block: w, of: recurrent}
- {block: w, of: junction}
- {block: tau, of: neuron}
- {block: bias, of: neuron}
- {block: bias, of: muscle}
io: {drive_set: retina, drive_block: signal, read_set: eye, read_block: pose, read_channel: 0, unit: deg}
training:
  epochs: 150
  n_trials: 3600
  n_val: 128
  n_test: 256
  lr: 0.002
  batch: 128
  seed: 0
  curriculum: [0.25, 0.5, 0.75, 1.0]
  horizon_min: 60
