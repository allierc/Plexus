general:
  name: promo_TURING_atlas_bulk_growth_turing_g_B
  seed: 819657
  n_frames: 4300
  dt: 1.0
  record_cap: 2152
  record_every: 1
  boundary: free
  dim: 3
  world:
    - 80.0
    - 80.0
    - 80.0
_run:
  target_cells: 50000
  seed_cells: 2000
sets:
  vertex:
    n: 130004
    mesh: half_edge
    cell_set: cell
  cell:
    n: 65004
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
  - op: mesh_seed
    at: vertex
    cell_set: cell
    before_frame: 1
    n_cells: 2000
    radius: 5.0
    jitter: 0.15
    seed: 819657
    vseed_cv: 0.15
    p0: 3.5
  - op: cell_geometry
    at: cell
  - op: cell_chem_seed
    at: cell
    n_spots: 1
    cone_deg: 8.0
    seed: 819657
    before_frame: 3
    seed_frac: 0.06
  - op: cell_neighbours
    at: cell
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.08
    d_h: 0.16
    chi: 1.3
  - op: cell_chem_react
    at: cell
    model: gray_scott
    rate: 0.5
    F: 0.034
    kk: 0.063
  - op: cell_grow
    at: vertex
    cell_set: cell
    rate: 0.001732
    a_sw: 0.25
    hill: 8.0
    rho: 0.1
    vth_frac: 2.5
    after_frame: 450
    conserve_amount: false
    chan: 0
  - op: cell_mechanics
    at: vertex
    p0: 3.5
    K_A: 1.0
    K_P: 1.0
    Gamma: 0.4
    Lambda: 0.5
    K_V: 40.0
    K_R: 0.0
    K_bend: 0.0
    K_lumen: 0.0
    antiinv: 0.0
    mu: 1.0
    dt: 1.0
    relax_iters: 30
    eta: 0.08
    cap_frac: 0.12
  - op: edge_flip
    at: vertex
    l_th_frac: 0.28
    every: 1
    max_flips: 300
  - op: cell_divide
    at: vertex
    factor: 2.0
    reset_noise: 0.12
    cycle_cv: 0.15
    p0: 3.5
    every: 4
    cell_set: cell
    min_cycle: 4
    max_cycle: 1000000000
    after_frame: 450
    orient_iface: false
    orient_asw: 0.6
    g1_ramp: false
    engine_clock: true
    max_cells: 30000
  - op: topo_record
    at: vertex
    every: 1
schedule:
  - mesh_seed
  - cell_geometry
  - cell_chem_seed
  - cell_neighbours
  - cell_chem_diffuse
  - cell_chem_react
  - cell_grow
  - cell_mechanics
  - edge_flip
  - cell_divide
  - topo_record
plotting:
  renderer: vtk_mesh
  background: black
  cutaway:
    - x
    - y
