  n_frames: 2100
  dt: 1.0
  record_cap: 2102
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
_run:
  target_cells: 50000
  seed_cells: 2000
sets:
