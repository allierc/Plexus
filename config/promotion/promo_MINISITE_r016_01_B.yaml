  jitter: 0.15
  seed: 700219
  vseed_cv: 0.15
  p0: 3.5
- op: cell_geometry
  at: cell
- op: cell_chem_seed
  at: cell
  mode: scatter
  n_spots: 1
  cone_deg: 8.0
  seed: 700219
  before_frame: 3
  seed_frac: 0.06
- op: cell_neighbours
  at: cell
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gray_scott
  rate: 1.0
  F: 0.046
  kk: 0.062
- op: cell_chem_from_shape
  at: cell
  model: curvature
  vertex_set: vertex
  beta: 0.5
  F0: 0.046
  rate: 1.0
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.000866
  a_sw: 0.35
  hill: 4.0
  rho: 0.1
  vth_frac: 2.5
  after_frame: 400
  conserve_amount: false
- op: cell_mechanics
  at: vertex
  p0: 3.5
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.4
  Lambda: 0.5
  K_V: 20.0
  K_R: 0.0
  K_bend: 0.02
  K_lumen: 2.0
  antiinv: 0.0
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: interface_tension
  at: vertex
  cell_set: cell
  K_purse: 1.0
  a_sw: 0.6
  eta: 0.05
  iters: 4
  after_frame: 400
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: cell_divide
  at: vertex
  factor: 2.0
  reset_noise: 0.12
  cycle_cv: 0.15
  p0: 3.5
  every: 4
  cell_set: cell
  min_cycle: 4
  max_cycle: 1000000000
  after_frame: 400
  orient_iface: false
  orient_asw: 0.6
  g1_ramp: false
  engine_clock: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_chem_seed
- cell_neighbours
- cell_chem_diffuse
- cell_chem_react
- cell_chem_from_shape
- cell_grow
