general:
  name: promo_MINISITE_atlas_turing_grow_divide_B
  seed: 0
  n_frames: 1800
  dt: 1.0
  record_cap: 602
  boundary: free
  dim: 3
  world:
    - 50.0
    - 50.0
    - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  cell:
    n: 60000
    state:
      area:
        width: 1
      centroid:
        width: 3
      chem:
        width: 2
        integration: first_order
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      inhib_frac:
        width: 1
  vertex:
    n: 120000
    mesh: half_edge
  half_edge:
    n: 480000
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
operators:
  - op: mesh_seed
    at: vertex
    before_frame: 1
    n_cells: 2000
    radius: 5.0
    jitter: 0.18
    p0: 3.5
    seed: 0
    vseed_cv: 0.15
  - op: cell_chem_seed
    at: cell
    seed: 0
    before_frame: 3
    seed_frac: 0.06
  - op: cell_neighbours
    at: cell
    vertex_set: vertex
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.08
    d_h: 0.16
    chi: 1.3
  - op: cell_chem_react
    at: cell
    model: gray_scott
    F: 0.046
    kk: 0.062
    rate: 1.0
  - op: cell_chem_from_shape
    at: cell
    model: curvature
    vertex_set: vertex
    beta: 0.5
    F0: 0.046
    rate: 1.0
  - op: cell_geometry
    at: cell
  - op: cell_grow
    at: vertex
    rate: 0.000866
    rho: 0.1
    a_sw: 0.35
    hill: 4.0
    vth_frac: 2.5
    after_frame: 100
    conserve_amount: false
  - op: cell_mechanics
    at: vertex
    K_A: 1.0
    K_P: 1.0
    K_V: 2.0
    K_R: 0.4
    Lambda: 3.0
    Gamma: 0.4
    p0: 3.5
    mu: 1.0
    dt: 1.0
    relax_iters: 30
    eta: 0.08
    cap_frac: 0.12
  - op: edge_flip
    at: vertex
    every: 4
    engine_clock: true
    l_th_frac: 0.35
    max_flips: 30
  - op: cell_divide
    at: vertex
    every: 4
    engine_clock: true
    factor: 2.0
    cycle_cv: 0.15
    min_cycle: 4
    max_cycle: 1000000000
    p0: 3.5
    reset_noise: 0.12
  - op: topo_record
    at: vertex
    every: 3
    engine_clock: true
schedule:
  - mesh_seed
  - cell_geometry
  - cell_grow
  - cell_chem_seed
  - cell_neighbours
  - cell_chem_diffuse
  - cell_chem_react
  - cell_chem_from_shape
  - cell_mechanics
  - edge_flip
  - cell_divide
  - topo_record

plotting:
  renderer: vtk_mesh
  background: black
