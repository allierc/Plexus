general:
  name: promo_TURING_atlas_turing_two_regime_A
  seed: 0
  n_frames: 6000
  dt: 1.0
  record_cap: 602
  boundary: free
  dim: 3
  world:
    - 50.0
    - 50.0
    - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
plotting:
  renderer: vtk_mesh
  background: black
sets:
  vertex:
    n: 24000
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12000
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 4
        integration: first_order
fields: {}
operators:
  - op: cell_chem_seed
    at: cell
    seed: 0
    before_frame: 3
    seed_frac: 0.06
    chan: 0
  - op: cell_chem_seed
    at: cell
    seed: 2
    before_frame: 3
    seed_frac: 0.06
    chan: 2
  - op: mesh_seed
    at: vertex
    before_frame: 1
    cell_set: cell
    n_cells: 4000
    radius: 5.0
    jitter: 0.18
    p0: 3.5
    seed: 0
    vseed_cv: 0.15
  - op: cell_neighbours
    at: cell
    vertex_set: vertex
  - op: cell_geometry
    at: cell
  - op: cell_mechanics
    at: vertex
    K_A: 1.0
    K_P: 1.0
    K_V: 2.0
    K_R: 0.4
    Lambda: 3.0
    Gamma: 0.4
    p0: 3.5
    mu: 1.0
    dt: 1.0
    relax_iters: 30
    eta: 0.08
    cap_frac: 0.12
  - op: edge_flip
    at: vertex
    every: 4
    engine_clock: true
    l_th_frac: 0.35
    max_flips: 30
  - op: topo_record
    at: vertex
    every: 10
    engine_clock: true
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.08
    d_h: 0.16
    chi: 1.3
    chan: 0
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.08
    d_h: 0.16
    chi: 1.3
    chan: 2
  - op: cell_chem_react
    at: cell
    model: gray_scott
    F: 0.046
    kk: 0.062
    rate: 1.0
    chan: 0
  - op: cell_chem_react
    at: cell
    model: gray_scott
    F: 0.026
    kk: 0.055
    rate: 1.0
    chan: 2
schedule:
  - cell_chem_seed
  - cell_chem_seed
  - mesh_seed
  - cell_geometry
  - cell_neighbours
  - cell_mechanics
  - edge_flip
  - topo_record
  - cell_chem_diffuse
  - cell_chem_diffuse
  - cell_chem_react
  - cell_chem_react
