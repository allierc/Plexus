general:
  name: promo_ABL_promotion_abl_r023_07_09_B
  seed: 0
  n_frames: 600
  dt: 1.0
  record_cap: 602
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
_run:
  target_cells: 50000
  seed_cells: 2000
sets:
  vertex:
    n: 130004
    mesh: half_edge
    cell_set: cell
  cell:
    n: 65004
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: mesh_seed
  at: vertex
  cell_set: cell
  before_frame: 1
  n_cells: 2000
  radius: 5.0
  jitter: 0.15
  seed: 138857
  vseed_cv: 0.15
  p0: 3.5
- op: cell_geometry
  at: cell
- op: cell_chem_seed
  at: cell
  mode: scatter
  n_spots: 1
  cone_deg: 8.0
  before_frame: 3
  seed: 138857
  seed_frac: 0.06
- op: cell_neighbours
  at: cell
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gray_scott
  rate: 0.5
  F: 0.023
  kk: 0.062
- op: cell_chem_from_shape
  at: cell
  model: curvature
  vertex_set: vertex
  beta: 0.5
  F0: 0.046
  rate: 1.0
- op: cell_shape_probe
  at: cell
  vertex_set: vertex
  model: shape_index
  field: elong
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.001732
  a_sw: 0.35
  hill: 8.0
  rho: 0.1
  vth_frac: 2.5
  after_frame: 400
  conserve_amount: false
- op: cell_die
  at: vertex
  cell_set: cell
  p0: 3.5
  max_mark_frac: 0.005
  min_age: 4
  shrink_rate: 0.05
  critical_frac: 0.15
  stall_frac: 0.7
  every: 1
  after_frame: 100
- op: cell_mechanics
  at: vertex
  p0: 3.5
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.4
  Lambda: 0.5
  K_V: 40.0
  K_R: 0.0
  K_bend: 0.0
  K_lumen: 0.0
  antiinv: 0.0
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_chem_seed
- cell_neighbours
- cell_chem_diffuse
- cell_chem_react
- cell_chem_from_shape
- cell_shape_probe
- cell_grow
- cell_die
- cell_mechanics
- topo_record
_discovery:
  comp_hash: C9ccf5dcf260
  structure:
    operators:
    - id: cell_chem_diffuse0
      op: cell_chem_diffuse
      impl: graph_laplacian
    - id: cell_chem_from_shape0
