# material_cell_grow_iso -- ISOTROPIC cell_grow control: the same soft elastic ball grows by
# rest-volume growth added in ALL directions -> smooth ROUND expansion (no protrusion). The
# isotropic counterpart to material_cell_grow_aniso; together they isolate what ANISOTROPY buys.
# Growth belongs to the CELL (grow_V); MPM-particle addition is only the realization.
general: {name: material_cell_grow_iso, seed: 0, n_frames: 1800, dt: 0.0015, boundary: wall}
sets:
  cell: {n: 1, start: [[0.5, 0.5]], types: {body: {fraction: 1.0, youngs: 90}}}
  mpm_particle: {parent: cell, per_parent: 2500, grow_reserve: 9000, radius: 0.06, density: 1.0}
fields: {mpm_grid: {frame: mpm_grid, n_grid: 128}}
operators:
  - {op: cell_grow, at: cell, rate: 1.1, target: 4.5, mode: isotropic, aniso: 0.0, offset: 0.011}
  - {op: mpm_strain, at: mpm_particle}
  - {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.1, a_max: 200}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.95}
  - {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 0.95, wall_contact: 0.04, vmax: 1000000000.0}
schedule:
  - cell_grow
  - {substep_dt: 0.0001, steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]}
plotting:
  background: black
  colors: {body: [0.40, 0.85, 0.55]}
  fps: 30
  movie_max_frames: 500
