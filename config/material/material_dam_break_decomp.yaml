# material_dam_break_decomp -- the DECOMPOSED MLS-MPM (Phase 3): the oracle
# mls_mpm_mechanics split into the canonical Exchange->Field->Exchange primitives
# (mpm_strain -> p2g -> mpm_grid_update -> g2p) over a substep micro-loop, against an
# explicit `mpm_grid` background FIELD. Reproduces the monolith oracle frame-by-frame
# (see tests/test_mpm_decomposition.py). Same dam-break scenario as material_dam_break.
general: {name: material_dam_break_decomp, seed: 0, n_frames: 300, dt: 0.0036, boundary: wall}
sets:
  cell:
    n: 1
    start: [0.17, 0.4, 0.17, 0.4]
    types:
      water: {fraction: 1.0, youngs: 300, block: [0.04, 0.03, 0.3, 0.78], layers: [{frac: 1.0, youngs: 300, material: liquid}]}
  mpm_particle: {parent: cell, per_parent: 9000, radius: 0.30, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 128}
operators:
- {op: aggregate, at: cell}
- {op: gravity, at: cell, g: 12.0}
- {op: mpm_strain, at: mpm_particle}
- {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.08, a_max: 200}
- {op: mpm_grid_update, at: mpm_grid, surface_tension: 10.0, wall_damp: 0.5, wall_contact: 0.06}
- {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.5, wall_contact: 0.06, vmax: 1.0e9}
schedule:
- aggregate
- gravity
- {substep_dt: 0.0002, steps: [mpm_strain, p2g, mpm_grid_update, g2p]}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_cell:
    description: A dense cluster of blue particles begins as a vertical rectangular block on the left
      side of the frame. The block then begins to deform and expand toward the right, losing its sharp
      vertical boundaries. As it continues to move, the particles spread out into a thin, elongated horizontal
      layer across the bottom of the space. Finally, the particles settle into a low-profile, irregular
      shape that stretches across the entire width of the field.
    objects: The scene contains a large collection of small, blue particles that form a single cohesive
      mass. Initially, these particles are arranged in a tall, compact rectangular topology with straight
      edges. As time progresses, the topology shifts from a solid block to a fluid, spreading distribution.
      The particles maintain a consistent small size and uniform blue color throughout the entire simulation.
  movie_mpm_particle:
    description: A dense cluster of blue particles initially occupies a vertical rectangular region on
      the left side of the frame. Over time, the cluster begins to deform and expand toward the bottom
      right corner of the image. The shape transitions from a solid block into a tapering, elongated structure
      that stretches across the lower half of the space. By the final frame, the particles have spread
      into a thin, horizontal band with a distinct curved protrusion on the right side.
    objects: The scene contains a large collection of small, blue, point-like particles. These particles
      are initially packed closely together to form a single, cohesive rectangular mass. As the simulation
      progresses, the particles maintain a loose connection but spread out to form a more fluid, irregular
      shape. The overall size of the cluster remains relatively constant, but its spatial distribution
      changes from a vertical orientation to a horizontal one.
plotting:
  background: black
