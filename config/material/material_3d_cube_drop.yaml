descriptions:
  movie_mpm_particle:
    description: A dense cluster of blue particles is initially positioned in the
      center of a large wireframe cube. Over time, the cluster remains stationary
      and maintains its compact, roughly spherical shape. There is no visible movement
      or expansion of the particles throughout the sequence. The scene remains static,
      showing a stable distribution of points within the bounded volume.
    objects: The primary objects are a large number of small, blue particles clustered
      together. These particles form a dense, roughly spherical cloud in the center
      of the frame. They are contained within a large, white wireframe cube that defines
      the spatial boundaries. The particles are uniform in color and size, creating
      a textured, volumetric appearance.
