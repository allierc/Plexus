# material_cell_grow_aniso -- ANISOTROPIC / tip-localized cell_grow: a soft elastic ball grows a
# BUD upward (axis +y) by rest-volume growth realized as MPM-particle addition at the leading edge.
# The elongated bud ROUNDS on its own as growth saturates (target reached) and elasticity relaxes it
# -- emergent protrusion -> rounded lobe, NOT scripted. Growth belongs to the CELL (grow_V), particle
# addition is only the numerical realization. No mpm_anchor (it would pin grown material to rest).
general: {name: material_cell_grow_aniso, seed: 0, n_frames: 1800, dt: 0.0015, boundary: wall}
sets:
  cell: {n: 1, start: [[0.5, 0.4]], types: {body: {fraction: 1.0, youngs: 90}}}
  mpm_particle: {parent: cell, per_parent: 2500, grow_reserve: 7000, radius: 0.07, density: 1.0}
fields: {mpm_grid: {frame: mpm_grid, n_grid: 128}}
operators:
  # rest-volume growth law: logistic (rate, target~2.8x), MILD tip-localization along +y + moderate
  # anisotropy -> a FAT bud (not a jet) that grows upward then ROUNDS as growth saturates + elasticity relaxes.
  - {op: cell_grow, at: cell, rate: 0.9, target: 2.8, mode: tip, axis: [0.0, 1.0], aniso: 0.5, tip: 2.5, offset: 0.013}
  - {op: mpm_strain, at: mpm_particle}
  - {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.1, a_max: 200}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.95}
  - {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 0.95, wall_contact: 0.04, vmax: 1000000000.0}
schedule:
  - cell_grow
  - {substep_dt: 0.0001, steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]}
plotting:
  background: black
  colors: {body: [0.40, 0.85, 0.55]}   # tissue green
  fps: 30
  movie_max_frames: 500
