descriptions:
  movie_mpm_particle:
    description: Initially, three distinct clusters of particles are arranged in a
      linear sequence along a diagonal axis. Over time, the central blue cluster begins
      to expand and flatten, spreading across the bottom plane of the bounding box.
      The green and white clusters remain relatively stationary as the blue cluster
      grows to encompass the area beneath them. By the final frame, the blue particles
      form a large, thin sheet on the floor while the green and white clusters sit
      atop it.
    objects: 'There are three primary clusters of particles: one green, one blue,
      and one white. The green cluster is a compact, roughly spherical mass located
      on the left side of the scene. The white cluster is a similar compact, spherical
      mass located on the right side of the scene. The blue cluster starts as a compact
      sphere in the center but transforms into a large, flat, two-dimensional sheet
      that covers the bottom of the cube.'
