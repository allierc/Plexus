  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
descriptions:
  movie_mpm_particle:
    description: Three spherical particles are shown moving within a 3D bounding box.
      The blue particle moves towards the center while the red and green particles
      move towards each other. The red and green particles eventually collide and
      overlap in the center of the box. The blue particle then moves towards the combined
      red and green cluster.
    objects: There are three spherical particles in the scene. The particles are colored
      blue, red, and green. They are of approximately equal size and are initially
      separated from each other. The particles move independently until the red and
      green ones merge into a single overlapping cluster.
