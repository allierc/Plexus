general: {name: material_central_contraction, seed: 0, n_frames: 450, dt: 0.002, boundary: wall}

# A square elastic sheet (16384 MLS-MPM material points filling [0.15,0.85]^2) that
# is contracted toward its centre by a periodically pulsed active force. The force is
# decomposed into three single-concern operators:
#   pacemaker            (when)  -- a periodic scalar clock p(t) -> H.signals["beat"]
#   activation_pulse       (where) -- p(t) x Gaussian(centre,radius) -> activation field
#   active_force (what)  -- amplitude * grad(activation) -> H.part_accel (MPM body force)
# and MPM (mpm_strain / mpm_scatter / mpm_grid_update / mpm_gather) is HOW the material responds.
sets:
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      sheet: {fraction: 1.0, youngs: 80, block: [0.15, 0.15, 0.85, 0.85]}
  mpm_particle: {parent: cell, per_parent: 16384, density: 1.0}

fields:
  activation: {frame: grid, res: 128}      # the scalar pulse field (rendered)
  mpm_grid: {frame: mpm_grid, n_grid: 128}     # MLS-MPM background grid (transient)

operators:
- {op: aggregate, at: cell}
- {op: pacemaker, at: activation, name: beat, period: 150, duration: 30, phase: 0}
- {op: activation_pulse, at: activation, clock: beat, center: [0.5, 0.5], radius: 0.12}
- {op: active_force, at: mpm_particle, from: activation, amplitude: 20.0, mode: inward}
- {op: drag, emit: mpm_acceleration, at: mpm_particle, k: 30.0}
- {op: mpm_strain, at: mpm_particle}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 200}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 0.5, wall_contact: 0.06}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 0.5, wall_contact: 0.06}

schedule:
- aggregate
- pacemaker
- activation_pulse
- active_force
- drag
- {substep_dt: 0.0002, steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_activation:
    description: A single white point of light appears in the center of a black field. The point gradually
      expands into a larger, fuzzy white orb. The orb continues to grow and become more diffuse until
      it fills a significant portion of the frame. Finally, the orb fades away, leaving the screen completely
      black.
    objects: The scene contains a single luminous object against a solid black background. This object
      starts as a tiny, concentrated white dot in the center. It transforms into a medium-sized, glowing
      white sphere with soft, blurred edges. The object eventually expands into a large, faint white cloud
      before disappearing.
  movie_cell:
    description: The simulation begins with a uniform distribution of blue particles across a square domain.
      Over time, the particles begin to cluster and aggregate toward the center of the frame. This central
      concentration creates a denser core while the surrounding areas become more sparse. By the final
      frame, the particles have formed a distinct, high-density central mass with a surrounding halo.
    objects: The scene contains a large number of small, individual blue particles. These particles are
      initially arranged in a stochastic, homogeneous distribution across the square area. As the simulation
      progresses, the particles maintain their individual identities but change their spatial arrangement.
      The final state shows a dense, interconnected cluster in the center surrounded by a less dense periphery.
  movie_mpm_particle:
    description: The video shows a large collection of blue particles distributed within a square boundary
      on a black background. Over time, the particles exhibit a subtle, fluid-like shifting motion while
      maintaining a relatively uniform density. There is no significant clustering or large-scale structural
      change visible throughout the sequence. The overall appearance remains a steady, shimmering field
      of points.
    objects: The scene contains thousands of small, individual blue points. These particles are arranged
      in a dense, stochastic distribution that fills a central square area. Each point is roughly the
      same size and maintains a consistent bright blue color. The particles are not connected to one another,
      forming a discrete point cloud rather than a continuous field.
