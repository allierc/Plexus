descriptions:
  movie_activation:
    description: The video shows a black screen with no visible movement or changes.
      There are no particles, agents, or fields evolving over time. The scene remains
      static and completely dark throughout the entire duration. No scientific simulation
      is occurring in this sequence.
    objects: There are no objects present in the scene. The entire frame is a uniform
      black color. There is no topology or arrangement to describe as the space is
      empty. The size of any potential objects is zero as they do not exist.
  movie_cell:
    description: The simulation shows a dense collection of blue particles distributed
      within a square boundary. Over time, the particles undergo subtle spatial rearrangements
      while maintaining a relatively constant overall density. The distribution appears
      to be in a state of equilibrium or slow diffusion, with no large-scale structural
      changes. The final frames show a nearly identical configuration to the initial
      state, suggesting a steady-state system.
    objects: The objects are small, irregularly shaped blue clusters or particles.
      They are arranged in a high-density, stochastic distribution that fills a large
      square area. Each individual particle is much smaller than the overall square
      container. The particles are disconnected from one another, forming a porous,
      sponge-like texture across the field.
  movie_mpm_particle:
    description: A large collection of blue particles is distributed uniformly across
      a black background. Over time, a small cluster of particles begins to aggregate
      and move toward the center of the frame. This cluster eventually forms a distinct,
      elongated shape that resembles a small figure or organism. The rest of the particles
      remain in a state of high-entropy, random distribution throughout the space.
    objects: The scene contains thousands of tiny, individual blue dots representing
      particles. These particles are arranged in a dense, stochastic pattern that
      fills a large square area. A specific subset of these particles coalesces into
      a singular, connected structure near the bottom center. This central object
      is dark and elongated, contrasting with the surrounding bright blue field.
plotting:
  dot_size: 1.2
