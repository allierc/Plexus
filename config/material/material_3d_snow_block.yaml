descriptions:
  movie_mpm_particle:
    description: A dense cluster of grey particles is initially positioned in the
      center of a large wireframe cube. Over the course of the simulation, the cluster
      gradually descends toward the bottom face of the cube. The particles maintain
      a relatively cohesive, roughly spherical shape as they move downward. By the
      final frame, the cluster has settled near the bottom corner of the bounding
      box.
    objects: The scene contains a large, hollow wireframe cube that defines the spatial
      boundaries. Inside this cube, there is a dense collection of small, grey particles.
      These particles are clustered together to form a single, roughly spherical mass.
      The particles are much smaller than the cube, which serves as the primary reference
      for scale.
