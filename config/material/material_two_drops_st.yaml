descriptions:
  movie_cell:
    description: Two separate blue and orange circular clusters initially exist side-by-side.
      They begin to move toward each other and merge into a single, unified shape.
      As they fuse, the internal boundaries shift and reorganize into a complex, interlocking
      pattern. The final state shows a single, stable composite object with a distinct
      blue and orange distribution.
    objects: The scene contains two primary clusters of particles, one blue and one
      orange. Initially, these clusters are separate, roughly circular, and of similar
      size. As they merge, they form a single, larger, roughly spherical object. The
      final object maintains a dual-color composition with a complex, irregular internal
      interface.
  movie_mpm_particle:
    description: Two distinct clusters of particles begin as separate entities and
      move toward each other. As they approach, the two groups begin to intermingle
      and overlap significantly. The particles continue to mix until they form a single,
      unified cluster with a complex internal structure. By the end of the sequence,
      the two colors are thoroughly integrated into a single cohesive shape.
    objects: The scene contains two primary sets of particles, one colored blue and
      the other colored orange. Initially, the blue particles form a circular cluster
      on the left, while the orange particles form a similar circular cluster on the
      right. Both clusters are composed of many small, individual points that maintain
      a roughly spherical boundary. As the simulation progresses, the two sets of
      particles merge into a single, larger, and more irregular composite shape.
