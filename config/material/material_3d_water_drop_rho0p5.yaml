descriptions:
  movie_mpm_particle:
    description: A cluster of blue particles initially occupies the center of a 3D
      bounding box. Over time, the cluster collapses downward toward the bottom surface
      of the box. The particles spread out horizontally as they settle, forming a
      thin layer. By the final frame, the particles have flattened into a nearly uniform
      distribution across the bottom plane.
    objects: The scene contains a large collection of small, blue particles. These
      particles are initially clustered in a dense, roughly spherical shape in the
      center of the space. As the simulation progresses, they transition into a flattened,
      disc-like arrangement. The particles are contained within a large, transparent
      wireframe cube that defines the spatial boundaries.
