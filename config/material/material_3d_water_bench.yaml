descriptions:
  movie_mpm_particle:
    description: The simulation begins with a discrete set of colored hexagonal particles
      distributed within a 3D bounding box. Over time, these particles rapidly transition
      into a dense, continuous field of points that settle toward the bottom plane
      of the volume. The field exhibits complex, swirling patterns and turbulent structures
      as it evolves. Eventually, the distribution stabilizes into a layered, multi-colored
      sheet with distinct peaks and valleys.
    objects: The scene contains a collection of hexagonal particles that are initially
      separated and scattered in space. These particles are rendered in a vibrant
      spectrum of colors including magenta, cyan, green, blue, and orange. As the
      simulation progresses, the individual hexagons merge into a massive, interconnected
      cloud of tiny points. The final state shows a large, flat surface of points
      with varying heights and intricate, nested color patterns.
