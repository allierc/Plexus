descriptions:
  movie_activation:
    description: The video shows a black screen with no visible movement or changes.
      There are no particles, agents, or fields evolving over time. The scene remains
      static and completely dark throughout the entire duration. No scientific simulation
      is occurring in this sequence.
    objects: There are no objects present in the scene. The entire frame is a uniform
      black color. There is no topology or arrangement to describe as the space is
      empty. The size of any potential objects is zero as they do not exist.
  movie_cell:
    description: The simulation shows a dense collection of blue particles contained
      within a square boundary. Over the course of the video, the particles undergo
      subtle stochastic fluctuations in their positions. The overall density and distribution
      of the blue field remain constant throughout the sequence. There is no significant
      macroscopic movement or structural change in the aggregate.
    objects: The scene contains a large number of small, individual blue particles.
      These particles are arranged in a high-density, disordered distribution that
      fills a square area. Each particle is roughly uniform in size and maintains
      a consistent blue color. The particles are not connected to one another, forming
      a granular, fluid-like texture.
  movie_mpm_particle:
    description: The simulation shows a dense field of blue particles distributed
      uniformly across a square domain. Over time, the particles exhibit very subtle
      fluctuations in their spatial distribution. The overall density and global structure
      of the field remain constant throughout the sequence. There is no significant
      movement or large-scale evolution of the particle patterns.
    objects: The scene contains a large number of small, blue, point-like particles.
      These particles are arranged in a stochastic, non-connected distribution across
      the entire frame. Each individual particle is uniform in size and color. The
      particles collectively form a high-density, homogeneous field within a square
      boundary.
