- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.5
  wall_contact: 0.06
  vmax: 1.0e9
schedule:
- gravity
- substep_dt: 0.0002
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: mpl2d
  colormap: Set1
  background: black
  dot_size: 1.2
