fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 192
operators:
- op: gravity
  at: body
  g: 11.0
- op: mpm_strain
  at: mpm_particle
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
