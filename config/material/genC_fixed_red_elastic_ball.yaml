general:
  name: genC_fixed_red_elastic_ball
  seed: 0
  n_frames: 500
  dt: 0.0036
  boundary: wall
  obstacles:
  - - 0.5
    - 0.3
    - 0.12
sets:
  body:
    n: 1
    start:
    - 0.5
    - 0.8
    - 0.5
    - 0.8
    types:
      jelly:
        fraction: 1.0
        youngs: 70
        block:
        - 0.39
        - 0.7
        - 0.61
        - 0.92
        layers:
        - frac: 1.0
          youngs: 70
          material: elastic
  mpm_particle:
    parent: body
    per_parent: 14500
    radius: 0.12
