fields:
  activation:
    frame: grid
    res: 128
  mpm_grid:
    frame: mpm_grid
    n_grid: 192
  cells:
    frame: label_image
    source: material/cardio_cells_label.tif
general:
  boundary: wall
  dt: 0.002
  n_frames: 600
  name: material_cardio_cells
  seed: 0
operators:
- op: seed_from_segmentation
  at: mpm_particle
  from: cells
  cell_set: cell
  youngs_min: 40
  youngs_max: 220
  props: material/cardio_cells_props.json
- at: activation
  duration: 30
  name: beat
  op: pacemaker
  period: 150
  phase: 0
- at: activation
  center:
  - 0.5
  - 0.5
  clock: beat
  op: activation_pulse
  radius: 0.12
- amplitude: 20.0
  at: mpm_particle
  from: activation
  mode: inward
  op: active_force
- at: mpm_particle
  k: 30.0
  op: drag
  emit: mpm_acceleration
- at: mpm_particle
  op: mpm_strain
- a_max: 200
  at: mpm_particle
  drag: 0.0
  op: mpm_scatter
  to: mpm_grid
  store_stress: true
- at: mpm_grid
  op: mpm_grid_update
  wall_contact: 0.06
  wall_damp: 0.5
  implementation: nosync
- at: mpm_particle
  from: mpm_grid
  op: mpm_gather
  wall_contact: 0.06
  wall_damp: 0.5
schedule:
- seed_from_segmentation
- pacemaker
- activation_pulse
- active_force
- drag
- substep_dt: 0.0002
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
sets:
  tissue:
    n: 1
    start:
    - - 0.5
      - 0.5
    types:
      sheet:
        block:
        - 0.02
        - 0.02
        - 0.98
        - 0.98
        fraction: 1.0
        youngs: 80
  cell:
    parent: tissue
    per_parent: 472
    radius: 0.02
    types:
      myocyte:
        fraction: 1.0
        youngs: 80
  mpm_particle:
    density: 1.0
    parent: cell
    per_parent: 2500
plotting:
  background: black
  dot_size: 1.2
