# A tissue made of MEASURED CELLS, not a continuum with a pattern painted on it.
#
# The hierarchy plexus2 describes, all three levels declared and each meaning what it says:
#
#   tissue        one entity, the sheet
#   cell          472 entities, one per cell found in the recording by segmenting the BEAT
#   mpm_particle  36 material points per cell, placed inside that cell's own measured shape
#
# `seed_from_segmentation` is what makes the middle level real: it reads the instance map, moves
# each cell entity onto its own centroid, places each cell's particles inside its own mask, and
# gives every cell ONE Young's modulus shared exactly by its particles. Two particles either side
# of a cell boundary therefore have different material, which is the whole point -- a stiffness
# map cannot do that, because it has no boundaries in it.
#
# The stiffness is not invented: it comes from each cell's MEASURED beat amplitude, mapped
# inversely (a cell that moved little is stiff). That is a hypothesis, stated in the operator.
#
# Four pulses: period 150 frames x 4 = 600, and the run is 600 frames.
fields:
  activation: {frame: grid, res: 128}
  mpm_grid: {frame: mpm_grid, n_grid: 128}
  cells: {frame: label_image, source: material/cardio_cells_label.tif}
general: {boundary: wall, dt: 0.002, n_frames: 600, name: material_cardio_cells, seed: 0}
operators:
- {at: tissue, op: aggregate}
- {op: seed_from_segmentation, at: mpm_particle, from: cells, cell_set: cell,
   youngs_min: 40, youngs_max: 220, props: material/cardio_cells_props.json}
- {at: activation, duration: 30, name: beat, op: pacemaker, period: 150, phase: 0}
- at: activation
  center: [0.5, 0.5]
  clock: beat
  op: activation_pulse
  radius: 0.12
- {amplitude: 20.0, at: mpm_particle, from: activation, mode: inward, op: active_force}
- {at: mpm_particle, k: 30.0, op: drag, emit: mpm_acceleration}
- {at: mpm_particle, op: mpm_strain}
- {a_max: 200, at: mpm_particle, drag: 0.0, op: mpm_scatter, to: mpm_grid, store_stress: true}
- {at: mpm_grid, op: mpm_grid_update, wall_contact: 0.06, wall_damp: 0.5}
- {at: mpm_particle, from: mpm_grid, op: mpm_gather, wall_contact: 0.06, wall_damp: 0.5}
schedule:
- aggregate
- seed_from_segmentation
- pacemaker
- activation_pulse
- active_force
- drag
- substep_dt: 0.0002
  steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]
sets:
  tissue:
    n: 1
    start:
    - [0.5, 0.5]
    types:
      sheet: {block: [0.02, 0.02, 0.98, 0.98], fraction: 1.0, youngs: 80}
  cell:
    parent: tissue
    per_parent: 472
    radius: 0.02
    types:
      myocyte: {fraction: 1.0, youngs: 80}      # the per-cell value is overwritten by the seed
  mpm_particle: {density: 1.0, parent: cell, per_parent: 500}
plotting:
  background: black
