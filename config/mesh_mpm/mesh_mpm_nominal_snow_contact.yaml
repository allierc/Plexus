# MESH-MPM 13 -- THE SAME SPHEROID INTO SNOW, so the material is the only thing that differs.
#
# `mesh_mpm_nominal_gel_contact.yaml` WITH ONE TYPE CHANGED: `material: snow`, E = 90, density 0.35,
# against the gel's elastic E = 15 at density 1.0. Same tissue, same mapping, same contact, same
# 500,000 points, same 800 frames -- so what differs between the two movies is the constitutive law
# and nothing else.
#
# WHY SNOW IS THE INTERESTING SECOND MATERIAL. The gel is elastic: it stores what the spheroid does
# to it and springs back, so its strain field is a picture of the CURRENT load. Snow is elasto-
# plastic with hardening -- it yields, compacts and KEEPS the deformation -- so the same indenter
# leaves a permanent cavity and the strain field is a picture of the run's HISTORY. A spheroid
# growing into a matrix that does not spring back is closer to what a tumour meets than an elastic
# gel is, and it is the case where "the matrix was pushed out of the way" and "the matrix is under
# load" stop being the same statement.
#
# `implementation: warp` ON `mpm_strain` IS LOAD-BEARING HERE, not a speed choice: the default
# strain reaches snow's plastic branch through `torch.linalg.svd` and boolean-mask indexing, neither
# of which can be captured, and the warp kernel does the same maths with `wp.svd3` and per-thread
# branches (`CAPTURABLE_MATERIAL_BRANCHES`). The spec already asks for it.
#
# 800 FRAMES, AND THE LIMIT IS REAL. Not the solver: Growth here compounds: the mesh is
# 38,000 half-edges at frame 400, 178,000 at 550 and 263,000 at 600 -- roughly 1.5x per fifty
# frames -- so 800 lands near a million half-edges and ~170,000 cells, past the reservoir this spec
# declares and far past the point where rebuilding the contact's direction-bin table once a frame is
# affordable. The 800-frame attempt sat at frame 604 after twenty minutes with the GPU idle. 500
# still multiplies the 400-frame run's mesh by three, which is the range this ladder can report on.

general:
  name: mesh_mpm_nominal_snow_contact
  seed: 0
  n_frames: 800
  dt: 0.0032
  record_cap: 202
  boundary: free
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1172.3329425556858
    force_nN: 9162.430188008488
  record_every: 4
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  fps: 60
  mesh_color: '#cfd8e3'
  real_time: false
  slow_motion: 2
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
  - quantity: radius
    xlabel: frame
    ylabel: shell radius
    ticks: 4
  render_3d: surface
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
  surface_opacity: 1.0
  surface_color: '#cfd8e3'
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    max_points: 8000
sets:
  vertex:
    n: 524288
    mesh: half_edge
    cell_set: cell
  cell:
    n: 262144
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
  mpm_particle:
    n: 500000
    types:
      snow:
        fraction: 1.0
        youngs: 90.0
        density: 0.35
        material: snow
        block:
        - 0.05
        - 0.05
        - 0.05
        - 0.95
        - 0.95
        - 0.472
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 200
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.003457
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: junction_myosin
  at: vertex
  activity: 1.0
  tau: 20.0
  beta: 1.0
  myo_new: 1.0
  dt: 1.0
  inherit: true
  keyed_on: length
  destabilising: true
  k_perim: 1.0
  lam: 0.0
  gam: 0.0
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  centre:
  - 0.5
  - 0.5
  - 0.5
  scale: 0.00449
  k_frac: 0.9
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 100000.0
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 8.0
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1000000000.0
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 2.0
  K_R: 0.4
  Lambda: 3.0
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 0.0032
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
- op: junction_sync
  at: vertex
  myo_new: 1.0
  inherit: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_grow
- junction_myosin
- substep_dt: 0.0003555556
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- cell_mechanics
- edge_flip
- cell_divide
- junction_sync
- topo_record
- mesh_inside
