# MESH-MPM 07 -- ONE OPERATOR ON TOP OF THE WORKING RUNG: `cell_divide`, and nothing else.
#
# `mesh_mpm_spheroid_gel.yaml` PLUS `cell_divide`. No `cell_mechanics`, no `cell_grow`, no
# `edge_flip`, no `junction_myosin`. The shell is still a PRESCRIBED tool -- `surface_drive` scales
# it x2.4 about its centroid -- and the only thing added is that a cell whose wedge volume has
# doubled since birth splits. That is the ladder's discipline: adding all six tissue operators at
# once produced a tissue dividing ten times too fast with no way to say which one did it.
#
# GROWTH COMES FROM THE SCALING, NOT FROM `cell_grow`. Scaling the shell x2.4 multiplies every
# wedge volume by 2.4^3 = 13.8, so each cell crosses the x2 threshold about 3.8 times over the run
# and the count should rise toward ~400 x 13.8 without a growth operator anywhere in the schedule.
# The division is driven by geometry the drive imposes, which is exactly what makes this a
# one-operator test rather than a two-operator one.
#
# `rigid: false` IS REQUIRED, NOT PREFERRED. Growth otherwise resets the vertices from the SEEDED
# shape every frame, and after a division that array is the wrong length -- the new vertices would
# be dropped and the mesh would disagree with itself. Incremental, the scaling composes with
# whatever the topology has become.
#
# THE THIRD CURVE IS THE INFORMATIVE ONE. `cells` shows the division firing and `cell area` shows it
# halving them, but neither says whether the SURFACE survived it. `shell radius` does: its mean is
# how big the shell is and its SPREAD is whether it is still a shell. `mesh_contact` is star-shaped
# and its premise is that a ray from `centre` meets the surface once, so a rising sd is the surface
# going off-sphere -- the thing that collapses the direction-bin grid, and it shows there long
# before the picture looks wrong.
#
# 160 FRAMES, NOT 400, AND THE REASON IS THE RESULT. At the full length this run dies: the
# direction-bin grid degrades as division inserts septa, the bucket depth climbs, and `_query` asks
# for gigabytes around frame 184. The growth is rescaled to 128 frames so the shell still reaches
# x2.4 and the run COMPLETES -- which is what makes the curves exist at all. Where it breaks is
# recorded here rather than left as a crash.

general:
  name: mesh_mpm_spheroid_gel_divide
  seed: 0
  n_frames: 160
  dt: 0.0032
  record_cap: 42
  record_every: 4
  boundary: wall
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1000.0
    force_nN: 6666.666666666667
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  render_3d: surface
  dot_size: 1.6
  fps: 60
  slow_motion: 4
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  cross_section:
    axis: z
    at: 0.5
    thickness: 6
    max_points: 6000
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
  mesh_color: '#cfd8e3'
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
  - quantity: radius
    xlabel: frame
    ylabel: shell radius
    ticks: 4
sets:
  vertex:
    n: 32768
    mesh: half_edge
    cell_set: cell
  cell:
    n: 16384
  mpm_particle:
    n: 500000
    types:
      gel:
        fraction: 1.0
        youngs: 30.0
        density: 1.0
        block:
        - 0.15
        - 0.05
        - 0.15
        - 0.85
        - 0.45
        - 0.85
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  n_cells: 400
  radius: 0.08
  centre:
  - 0.5
  - 0.53
  - 0.5
  jitter: 0.18
  p0: 3.5
  seed: 0
  cell_set: cell
- op: surface_drive
  at: vertex
  grow: 2.4
  over: 128
  rigid: false
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  k_frac: 0.45
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 100000.0
  centre: centroid
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.5
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1.0e9
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
- op: cell_divide
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
schedule:
- mesh_seed
- surface_drive
- substep_dt: 0.0004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- mesh_inside
- cell_divide
descriptions:
  movie:
    description: A large purple cube is subjected to a compressive force from a thin, grey mesh sheet
      on its top surface. As time progresses, the cube undergoes significant deformation, flattening and
      expanding outward under the pressure. The internal stress distribution becomes visible as a heat
      map, transitioning from dark purple to bright yellow and red. By the final frame, the cube has been
      compressed into a much thinner, wider shape with high-intensity stress concentrated at the bottom
      and center.
    objects: "The primary object is a large, roughly cubic volume of particles that starts as a dark purple\
      \ mass. A thin, grey rectangular mesh sheet sits on top of the cube, acting as the source of external\
      \ pressure. A smaller, blue rectangular inset in the top-left corner provides a zoomed-in view of\
      \ the surface deformation. A white wireframe box defines the 1 mm\xB3 simulation domain, with a\
      \ 0.25 mm scale bar provided for spatial reference."
  movie_mpm_particle:
    description: A large cube of particles undergoes a deformation process over time. The particles shift
      from a uniform blue state to a gradient of red and purple. The overall shape of the particle mass
      compresses and tilts slightly as the simulation progresses. The movement appears smooth and continuous,
      representing an elastic deformation of a 1 mm cube.
    objects: The primary object is a large, dense collection of particles forming a roughly cubic shape.
      These particles transition from a solid blue color to a gradient of red at the bottom and purple
      at the top. A smaller, static blue cube is shown in an inset box in the upper left corner for reference.
      The entire simulation is contained within a wireframe bounding box with a scale bar indicating 0.25
      mm.
