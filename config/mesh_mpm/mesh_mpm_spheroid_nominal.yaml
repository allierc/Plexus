# MESH-MPM 03n -- THE SPHEROID ALONE, at the reference's own scale, in the ladder's renderer.
#
# `promo_G_gates_gate_00_spheroid_B.yaml` VERBATIM apart from TWO lines: the name and `plotting`.
#
# THE SHELL STAYS AT THE ORIGIN, and an earlier version of this file moved it to the middle of the
# world box because it rendered in a corner. That is a renderer problem and moving the tissue is not
# the fix: `cell_mechanics`'s radial term is
#
#     E += K_R * (|pos| - R0)^2                     -- |pos| from the WORLD ORIGIN, not the centroid
#
# so with `K_R: 0.4` and the shell at [25,25,25] every vertex sat 43 units from the origin against
# an R0 of 4.65, and the term dragged the tissue apart: 685 cells instead of 6,786, and a torn
# surface. The energy LOOKS translation-invariant and is not. The renderer now frames on the content
# for a `free` boundary, which is where the problem actually was.
#
# ONE RENDERER FOR THE WHOLE LADDER. This used to declare `vtk_mesh` while every other rung declared
# `vtk_points`, so the working point and the experiments were two different pictures made by two
# different code paths -- and comparing them was comparing renderers as much as runs. `vtk_points`
# now covers both: with a material set present it draws the material and puts any `mesh: half_edge`
# set over it as a wireframe; with no material it draws the mesh itself, lit and solid. The choice
# is made from what the run CONTAINS, so no spec has to state it.

general:
  name: mesh_mpm_spheroid_nominal
  seed: 0
  n_frames: 401
  dt: 1.0
  record_cap: 403
  boundary: free
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 60
  mesh_color: '#cfd8e3'
  real_time: false
sets:
  vertex:
    n: 25584
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12800
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
fields: {}
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 200
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.003457
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: junction_myosin
  at: vertex
  activity: 1.0
  tau: 20.0
  beta: 1.0
  myo_new: 1.0
  dt: 1.0
  inherit: true
  keyed_on: length
  destabilising: true
  k_perim: 1.0
  lam: 0.0
  gam: 0.0
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 2.0
  K_R: 0.4
  Lambda: 3.0
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
- op: junction_sync
  at: vertex
  myo_new: 1.0
  inherit: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_grow
- junction_myosin
- cell_mechanics
- edge_flip
- cell_divide
- junction_sync
- topo_record
