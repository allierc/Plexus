# MESH-MPM 10 -- THE MATRIX IN CONTACT: gate 04's experiment, with the tissue SOLVED not replayed.
#
# `mesh_mpm_half_ecm_far.yaml` WITH ONE NUMBER CHANGED -- `cavity_r` 0.22 -> 0.045 -- so the matrix
# now stands where the spheroid is going. Everything else is the rung that was verified inert: the
# tissue reproduced `mesh_mpm_spheroid_half` frame for frame with the 200,000 fibre points present
# and the contact reporting zero (200/386/1054/2862 cells at frames 0/100/200/300, and roundness
# agreeing to four decimals). So anything that differs from here is the contact.
#
# THIS IS GATE 04, LIVE. That gate coupled a growing epithelium to an MPM matrix and could only do
# it as a REPLAY -- 200 cached meshes out of an npz -- because the two subsystems' clocks differ by
# ~10^5. What made the live version possible was not solving that ratio but noticing there were two
# separate problems wearing one name:
#
#   the COORDINATES   `mesh_contact` maps the surface at the point of USE (`scale` + `centre`), so
#                     the vesicle stays at the origin in its own units where `cell_mechanics`'s
#                     radial term requires it. Translating it destroys the tissue on frame 0.
#   the CLOCK         `cell_mechanics` divides its solved displacement by its own `dt` and the
#                     engine multiplies by `general.dt`; setting them equal makes the tissue's
#                     relaxation independent of the timestep the MPM needs.
#
# 0.045 IS THE CAVITY AND 0.0377 IS WHERE THE TISSUE STARTS, so the matrix is clear of it at frame 0
# -- matrix seeded where the ball will be is in contact before the clock starts, and the moment of
# first contact could then not be observed. The tissue ends at 0.0161 x 9.32 = 0.150, gate 04's own
# final radius, so the matrix sees what it saw.
#
# THE MATRIX IS DRAWN TRANSLUCENT because it is a SHELL and the tissue is inside it. The isosurface
# is built from the largest positional set -- 200,000 fibre points against the vesicle's ~25,000
# vertices -- so at full opacity the movie is a plain grey ball and the experiment is invisible.
# That is a rendering fact and not a dynamical one: this rung reproduces `mesh_mpm_spheroid_half`
# cell for cell (200/386/1054/2862 at frames 0/100/200/300, roundness equal to four decimals).

general:
  name: mesh_mpm_half_ecm
  seed: 0
  n_frames: 401
  dt: 0.0032
  record_cap: 403
  boundary: free
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1172.3329425556858
    force_nN: 9162.430188008488
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 60
  mesh_color: '#cfd8e3'
  real_time: false
  slow_motion: 2
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
  - quantity: radius
    xlabel: frame
    ylabel: shell radius
    ticks: 4
  render_3d: surface
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
  surface_opacity: 0.22
  surface_color: '#7a8ea8'
  cross_section:
    axis: z
    at: 0.5
    thickness: 6
    max_points: 6000
sets:
  vertex:
    n: 25584
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12800
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
  mpm_particle:
    n: 200000
    types:
      matrix:
        fraction: 1.0
        youngs: 15.0
        density: 1.0
        block:
        - 0.1
        - 0.1
        - 0.1
        - 0.9
        - 0.9
        - 0.9
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 200
  radius: 2.5
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.003457
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: junction_myosin
  at: vertex
  activity: 1.0
  tau: 20.0
  beta: 1.0
  myo_new: 1.0
  dt: 1.0
  inherit: true
  keyed_on: length
  destabilising: true
  k_perim: 1.0
  lam: 0.0
  gam: 0.0
- op: ecm_seed
  at: mpm_particle
  centre:
  - 0.5
  - 0.5
  - 0.5
  cavity_r: 0.045
  cavity_h: 0.045
  cavity_sphere: true
  axis: 1
  shell_r: 0.45
  margin: 0.02
  n_fibres: 10000
  fibre_len: 0.12
  align: 0.0
  align_dir:
  - 1.0
  - 0.0
  - 0.0
  seed: 0
  before_frame: 1
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  centre:
  - 0.5
  - 0.5
  - 0.5
  scale: 0.0161
  k_frac: 0.45
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 100000.0
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 8.0
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1000000000.0
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 0.25
  K_V: 8.0
  K_R: 0.4
  Lambda: 0.375
  Gamma: 0.1
  p0: 3.5
  mu: 1.0
  dt: 0.0032
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
- op: junction_sync
  at: vertex
  myo_new: 1.0
  inherit: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_grow
- junction_myosin
- ecm_seed
- substep_dt: 0.0004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- cell_mechanics
- edge_flip
- cell_divide
- junction_sync
- topo_record
- mesh_inside
