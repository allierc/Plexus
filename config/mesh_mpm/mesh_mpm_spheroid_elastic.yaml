# MESH-MPM 03 -- the CELL SPHEROID: an epithelium, not a shell, driven into the same gel.
#
# WHAT MAKES IT A SPHEROID AND NOT RUNG 01's SPHERE. `config/promotion/promo_G_gates_gate_00_spheroid_B.yaml`
# builds the okuda vesicle: 200 cells as a spherical Voronoi tessellation with `vseed_cv: 0.15` and
# `jitter: 0.18`, a `cell` SET carrying per-cell area and centroid, and `cell_mechanics` -- the AVM
# shape energy K_A(A-A0)^2 + K_P(P-P0)^2 + K_V(v-v_eq)^2 + Lambda*l. So the surface here is
# cell-scale FACETED and ELASTIC, where rung 01's is a smooth rigid shell, and the contact meets a
# tessellation whose faces are the size of the features it is resolving.
#
# THE TISSUE GROWS, AND THE CLOCK DOES NOT STOP IT. `cell_grow`'s rate is PER CALL, not per unit
# time -- it raises each cell's targets (A0, P0, v_eq) by `rate` every frame it runs, and
# `cell_mechanics` then inflates the cell by force balance -- so 400 frames here buy exactly what
# 400 of the gate's buy, whatever `dt` says. At the gate's own 0.003457 that is a target volume
# 1.003457^400 = 4.0x, i.e. a radius 1.58x, so the spheroid arrives at the gel already swelling.
# (The earlier version of this file claimed the opposite and left growth out. The 10^5 clock ratio
# is real and it is why gate 04 was a replay, but it bites only what reads `H.dt`; a per-frame rate
# is not that.)
#
# `cell_divide` AND `edge_flip` ARE STILL OUT, and for a different reason: both change the FACE
# COUNT, and `mesh_contact` rebuilds its direction-bin table from the surface every frame while the
# renderer's skinned overlay binds the face array once. Topology that changes under a contact is
# its own rung, with its own question -- does a T1 under load do anything the contact can see --
# and putting it in this one would confound growth with reconnection.
#
# `rigid: false` ON THE DRIVE, WHICH IS THE POINT OF THE RUNG. The other three tools reset their
# vertices from the seeded shape every frame -- exact, and right for a rigid indenter. Doing that
# here would overwrite `cell_mechanics` on the drive axis every frame, so the mechanics would run
# and be discarded and the surface would read as rigid while a schedule full of operators said
# otherwise. Incremental, the tissue keeps whatever shape it solved.
#
# THE COUPLING IS STILL ONE-WAY, AND THAT IS STATED RATHER THAN IMPLIED. `mesh_contact` computes the
# reaction and accumulates it per vertex in `VERTEX_FORCE`, but no operator in this schedule applies
# it, so the gel does not yet push back on the tissue -- the epithelium deforms under its own energy
# and under the drive, not under the load. `ecm_load` is the registered operator for that half and
# it appears in no spec; making it work is the next rung, not this one.

general:
  name: mesh_mpm_spheroid_elastic
  seed: 0
  n_frames: 400
  dt: 0.0032
  record_cap: 102
  record_every: 4
  boundary: wall
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1000.0
    force_nN: 6666.666666666667
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  render_3d: surface
  dot_size: 1.6
  fps: 60
  slow_motion: 4
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  cross_section:
    axis: z
    at: 0.5
    thickness: 6
    max_points: 6000
sets:
  vertex:
    n: 8192
    mesh: half_edge
    cell_set: cell
  cell:
    n: 1024
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
  mpm_particle:
    n: 500000
    types:
      gel:
        fraction: 1.0
        youngs: 30.0
        density: 1.0
        block:
        - 0.15
        - 0.05
        - 0.15
        - 0.85
        - 0.45
        - 0.85
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  cell_set: cell
  n_cells: 200
  radius: 0.15
  centre:
  - 0.5
  - 0.61
  - 0.5
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.003457
  rho: 1.0
  a_sw: 0.0
  hill: 4.0
  vth_frac: 2.5
- op: surface_drive
  at: vertex
  axis: 1
  by: -0.11
  over: 320
  rigid: false
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  k_frac: 0.45
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 100000.0
  centre: centroid
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 2.0
  K_R: 0.4
  Lambda: 3.0
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: topo_record
  at: vertex
  every: 4
  engine_clock: true
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.5
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1.0e9
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
schedule:
- mesh_seed
- cell_geometry
- cell_grow
- surface_drive
- substep_dt: 0.0004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- cell_mechanics
- topo_record
- mesh_inside
descriptions:
  movie:
    description: A large purple cube is subjected to a compressive force from a thin, grey mesh sheet
      on its top surface. As time progresses, the cube undergoes significant deformation, flattening and
      expanding outward under the pressure. The internal stress distribution becomes visible as a heat
      map, transitioning from dark purple to bright yellow and red. By the final frame, the cube has been
      compressed into a much thinner, wider shape with high-intensity stress concentrated at the bottom
      and center.
    objects: "The primary object is a large, roughly cubic volume of particles that starts as a dark purple\
      \ mass. A thin, grey rectangular mesh sheet sits on top of the cube, acting as the source of external\
      \ pressure. A smaller, blue rectangular inset in the top-left corner provides a zoomed-in view of\
      \ the surface deformation. A white wireframe box defines the 1 mm\xB3 simulation domain, with a\
      \ 0.25 mm scale bar provided for spatial reference."
  movie_mpm_particle:
    description: A large cube of particles undergoes a deformation process over time. The particles shift
      from a uniform blue state to a gradient of red and purple. The overall shape of the particle mass
      compresses and tilts slightly as the simulation progresses. The movement appears smooth and continuous,
      representing an elastic deformation of a 1 mm cube.
    objects: The primary object is a large, dense collection of particles forming a roughly cubic shape.
      These particles transition from a solid blue color to a gradient of red at the bottom and purple
      at the top. A smaller, static blue cube is shown in an inset box in the upper left corner for reference.
      The entire simulation is contained within a wireframe bounding box with a scale bar indicating 0.25
      mm.
