# MESH-MPM 09t -- THE TWIN: the working tissue and a gel slab that it never touches.
#
# `mesh_mpm_spheroid_half` UNCHANGED, with a gel SLAB added below it and `mesh_contact` scheduled.
# The tissue stays at the ORIGIN in its own units -- radius 2.343 growing to 9.32 -- and the contact
# maps it into the box at the point of use (`scale: 0.0161`, `centre: [0.5, 0.5, 0.5]`), which is
# exactly what gate 04 did with `scale: 0.00853` and what lets `cell_mechanics`'s origin-referenced
# radial term stay correct. Translating the tissue instead destroys it on frame 0.
#
# A SLAB, NOT A SHELL, and that is a rendering decision as much as a modelling one. The matrix shell
# of rung 09 surrounds the spheroid, and since the isosurface is built from the LARGEST positional
# set -- 200,000 fibre points against ~25,000 vertices -- the movie was an opaque grey ball with the
# experiment sealed inside it. A slab underneath occludes nothing.
#
# THEY NEVER TOUCH: the mapped tissue ends at 0.5 - 0.150 = 0.350 and the slab's top is 0.30. So
# `mesh_contact` is present, the 200,000 points are present, and the contact must report zero all
# run -- which is what makes this the TWIN of `mesh_mpm_spheroid_half` rather than a new experiment.
# The comparison is cell count and roundness, frame for frame; rung 09 already passed it
# (200/386/1054/2862 at frames 0/100/200/300, roundness equal to four decimals).

general:
  name: mesh_mpm_half_gel_twin
  seed: 0
  n_frames: 401
  dt: 0.0032
  record_cap: 403
  boundary: free
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1172.3329425556858
    force_nN: 9162.430188008488
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 60
  mesh_color: '#cfd8e3'
  real_time: false
  slow_motion: 2
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
  - quantity: radius
    xlabel: frame
    ylabel: shell radius
    ticks: 4
  render_3d: surface
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
  surface_opacity: 1.0
  surface_color: '#cfd8e3'
sets:
  vertex:
    n: 25584
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12800
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
  mpm_particle:
    n: 200000
    types:
      gel:
        fraction: 1.0
        youngs: 15.0
        density: 1.0
        block:
        - 0.15
        - 0.15
        - 0.05
        - 0.85
        - 0.85
        - 0.3
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 200
  radius: 2.5
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.003457
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: junction_myosin
  at: vertex
  activity: 1.0
  tau: 20.0
  beta: 1.0
  myo_new: 1.0
  dt: 1.0
  inherit: true
  keyed_on: length
  destabilising: true
  k_perim: 1.0
  lam: 0.0
  gam: 0.0
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  centre:
  - 0.5
  - 0.5
  - 0.5
  scale: 0.0161
  k_frac: 0.45
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 100000.0
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 8.0
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1000000000.0
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 0.25
  K_V: 8.0
  K_R: 0.4
  Lambda: 0.375
  Gamma: 0.1
  p0: 3.5
  mu: 1.0
  dt: 0.0032
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
- op: junction_sync
  at: vertex
  myo_new: 1.0
  inherit: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_grow
- junction_myosin
- substep_dt: 0.0004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- cell_mechanics
- edge_flip
- cell_divide
- junction_sync
- topo_record
- mesh_inside
