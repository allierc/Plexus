general:
  name: mesh_mpm_step5_sheet_buckle
  seed: 0
  n_frames: 401
  dt: 1.0
  record_cap: 403
  boundary: free
  dim: 3
  world:
  - 40.0
  - 40.0
  - 40.0
  units:
    length_um: 10.0
    time_s: 600.0
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 0.55
  mesh_color: '#cfd8e3'
  real_time: false
  slow_motion: 2
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    span: 18.0
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
sets:
  vertex:
    n: 16384
    mesh: half_edge
    cell_set: cell
  cell:
    n: 8192
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
fields: {}
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  shape: disc
  n_cells: 200
  radius: 5.0
  centre:
  - 0.0
  - 0.0
  - 5.0
  jitter: 0.25
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_chem_seed
  at: cell
  vertex_set: vertex
  before_frame: 1
  mode: cones
  n_spots: 1
  cone_deg: 22.0
  seed_dir:
  - 0.0
  - 0.0
  - 1.0
  seed: 0
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.0075
  rho: 0.0
  a_sw: 0.4
  a_sw_rel: true
  hill: 4.0
  vth_frac: 2.5
- op: cell_mechanics
  model: monolayer
  at: vertex
  k_v: 6.0
  kappa_s: 0.2
  h0: 0.25
  gamma: 0.06
  mu: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  rest_calibration: force_balance
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
  project: false
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_chem_seed
- cell_grow
- cell_mechanics
- edge_flip
- cell_divide
- topo_record
