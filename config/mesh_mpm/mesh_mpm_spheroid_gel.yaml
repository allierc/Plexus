# MESH-MPM 05 -- THE GROWING SPHEROID AND THE GEL. Nothing is driven; growth does the pressing.
#
# `mesh_mpm_spheroid_half.yaml` PLUS A GEL, and the tissue is untouched: same radius, same 200 cells,
# same four rescaled constants. What is added is 500,000 material points, the MLS-MPM cycle, and
# `mesh_contact` between them -- so anything that differs from the half rung is the gel.
#
# NOTHING IS DRIVEN, which is the point. There is no `surface_drive`: the spheroid sits with its
# lower pole 0.1 above the gel and INDENTS IT BY GROWING. `cell_grow` raises each cell's targets
# every frame and `cell_mechanics` inflates the cell by force balance, so the shell goes 2.34 -> ~9.3
# over 400 frames and its lower pole travels ~7 units -- 70 um -- into a gel whose top is at 20.
# That is the experiment gate 04 was built to run and could only run as a replay.
#
# TWO CLOCKS IN ONE SCHEDULE, AND THEY DO NOT HAVE TO BE RECONCILED. The tissue's operators are all
# per-FRAME (`cell_grow`'s rate is per call; `cell_mechanics` is a relaxation, not a rate; both carry
# their own `dt: 1.0` and never read the engine's), so `general.dt` is free and is set to what the
# MPM wants: 0.032 over a 4e-3 substep is 8 substeps a frame. The 10^5 ratio that made gate 04 a
# replay is a ratio between two DECLARED clocks, and only one of these two subsystems has one.
#
# `boundary: wall` AND `cell_mechanics centre`, TOGETHER OR NEITHER. MPM needs a walled box, so the
# gel must sit in [0, world] and the tissue on top of it -- and `K_R` penalises (|pos| - R0)^2 with
# |pos| from the WORLD ORIGIN, so a tissue moved off the origin is torn apart by a term that looks
# translation-invariant and is not (measured: 685 cells instead of 6,786). `centre` moves that term's
# origin to where the tissue actually is. Every other term is translation-invariant already.
#
# THE UNITS ARE THE TISSUE'S OWN. `log/okuda_ECM/0u_units/units.json` fixes one tissue length unit at
# 10 um from measured junction lengths, so the 50-unit box is 500 um, a cell-cell contact is ~4 um
# and the spheroid is 47 um across, growing to 186. `force_nN: 0.6667` follows from wanting E = 30 to
# be 200 Pa (stress_Pa = 1e3*force_nN/length_um^2) -- a 1-3 mg/ml collagen I gel.
#
# THE COUPLING IS ONE-WAY, AND THAT IS STATED RATHER THAN IMPLIED. `mesh_contact` computes the
# reaction and accumulates it per vertex in `VERTEX_FORCE`; no operator here applies it, so the gel
# does not push back on the tissue. The epithelium deforms under its own energy and its growth, not
# under the load. `ecm_load` is the registered operator for that half and it appears in no spec.
#
# THE SPHEROID IS DRAWN THE WAY THE HALF RUNG DRAWS IT -- flat, opaque, cell edges, division pair
# marked -- and not as the thin wireframe the renderer defaults to for a mesh over a cloud. That
# default is right for a 2,304-quad plate, whose edges over 500,000 dots would be a moire; a
# 200-cell epithelium is a picture in its own right and the run is about what it does.

general:
  name: mesh_mpm_spheroid_gel
  seed: 0
  n_frames: 401
  dt: 0.032
  record_cap: 403
  boundary: wall
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
  units:
    length_um: 10.0
    force_nN: 0.6666666666666666
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 60
  mesh_color: '#cfd8e3'
  real_time: false
  slow_motion: 2
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
  render_3d: surface
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
sets:
  vertex:
    n: 25584
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12800
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
  mpm_particle:
    n: 500000
    types:
      gel:
        fraction: 1.0
        youngs: 30.0
        density: 1.0
        block:
        - 10.0
        - 10.0
        - 2.0
        - 40.0
        - 40.0
        - 20.0
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 200
  radius: 2.5
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
  centre: &id001
  - 25.0
  - 25.0
  - 22.6
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.003457
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: junction_myosin
  at: vertex
  activity: 1.0
  tau: 20.0
  beta: 1.0
  myo_new: 1.0
  dt: 1.0
  inherit: true
  keyed_on: length
  destabilising: true
  k_perim: 1.0
  lam: 0.0
  gam: 0.0
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  centre: centroid
  k_frac: 0.45
  mu: 0.4
  dt: 0.032
  n_grid: 64
  a_max: 100000.0
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.5
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1.0e9
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 0.25
  K_V: 8.0
  K_R: 0.4
  Lambda: 0.375
  Gamma: 0.1
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  centre: *id001
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
- op: junction_sync
  at: vertex
  myo_new: 1.0
  inherit: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_grow
- junction_myosin
- substep_dt: 0.004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- cell_mechanics
- edge_flip
- cell_divide
- junction_sync
- topo_record
- mesh_inside
