# MESH-MPM 05 -- THE SPHEROID INDENTS THE GEL BY GROWING. Nothing is translated.
#
# `mesh_mpm_sphere_elastic.yaml` WITH ONE OPERATOR LINE CHANGED: `surface_drive` scales the shell
# about its own centroid instead of pushing it down. Same gel, same 500,000 material points, same
# solver, same penalty -- so what differs from rung 01 is that the tool inflates rather than
# descends, and the contact patch grows for a reason a real spheroid has.
#
# THE SURFACE IS PRESCRIBED, AND THAT IS THE WHOLE DESIGN. There is no `cell_grow`, no
# `cell_mechanics`, no `cell_divide`, no `edge_flip` -- the shell is a kinematic tool, exactly as
# the plate, the sphere and the pyramid are. The gel feels the shell; the shell feels nothing.
#
# WHY NOT A SOLVED EPITHELIUM, having tried it. `log/okuda_ECM/04_spheroid_ecm` is the run this
# reproduces and it has NO vertex set at all: its only sets are the MPM parent and the material
# points, and its surface is 200 cached meshes replayed out of
# `_tissue/cellfix_B_new_f401_x4_c4a5698982.npz`. It worked precisely BECAUSE there was no tissue in
# it -- a replayed surface cannot answer, so the coupling is one-way by construction. Putting a live
# okuda vesicle in the same schedule is a different experiment, and the first attempt showed why:
# the tissue divided about ten times too fast (2,022 faces at frame 100 against 201 for the same
# tissue alone), which a spec-for-spec probe pinned on the presence of the MPM set and the contact
# rather than on the boundary, the radial term's origin or the timestep. That is an influence FROM
# the gel TO the spheroid, and it is unresolved. This rung does not depend on it.
#
# THE GEOMETRY, so the comparison with rung 01 is exact. Seeded at radius 0.08 with its lower pole
# at 0.45 -- the gel's top -- and grown x2.4 over 320 of the 400 frames, the pole travels
# 0.192 - 0.08 = 0.112 into the gel, against the 0.11 rung 01's sphere is driven. The shell's
# TESSELLATION is unchanged by scaling, so the contact's direction-bin grid stays at ~17 rows for
# the whole run instead of railing at its floor the way a dividing tissue's did.

general:
  name: mesh_mpm_spheroid_gel
  seed: 0
  n_frames: 400
  dt: 0.0032
  record_cap: 102
  record_every: 4
  boundary: wall
  dim: 3
  world:
    - 1.0
    - 1.0
    - 1.0
  units:
    length_um: 1000.0
    force_nN: 6666.666666666667
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  render_3d: surface
  dot_size: 1.6
  fps: 60
  slow_motion: 4
  color_field: deformation
  color_range:
    - 0.0
    - 0.35
  cross_section:
    axis: z
    at: 0.5
    thickness: 6
    max_points: 6000
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
  mesh_color: '#cfd8e3'
sets:
  vertex:
    n: 4096
    mesh: half_edge
    cell_set: sphere_face
  sphere_face:
    n: 512
  mpm_particle:
    n: 500000
    types:
      gel:
        fraction: 1.0
        youngs: 30.0
        density: 1.0
        block:
          - 0.15
          - 0.05
          - 0.15
          - 0.85
          - 0.45
          - 0.85
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
seed:
  - op: mesh_seed
    at: vertex
    n_cells: 400
    radius: 0.08
    centre:
      - 0.5
      - 0.53
      - 0.5
    jitter: 0.18
    p0: 3.5
    seed: 0
operators:
  - op: surface_drive
    at: vertex
    grow: 2.4
    over: 320
  - op: mesh_contact
    at: mpm_particle
    surface: vertex
    k_frac: 0.45
    mu: 0.4
    dt: 0.0032
    n_grid: 64
    a_max: 100000.0
    centre: centroid
  - op: mpm_strain
    at: mpm_particle
    implementation: warp
  - op: mpm_scatter
    at: mpm_particle
    to: mpm_grid
    drag: 0.5
    a_max: 100000.0
    implementation: warp
  - op: mpm_grid_update
    at: mpm_grid
    wall_damp: 0.7
  - op: mpm_gather
    at: mpm_particle
    from: mpm_grid
    wall_damp: 0.7
    wall_contact: 0.04
    vmax: 1.0e9
    implementation: warp
  - op: mesh_inside
    at: mpm_particle
    n_grid: 64
schedule:
  - surface_drive
  - substep_dt: 0.0004
    steps:
      - mesh_contact
      - mpm_strain
      - mpm_scatter
      - mpm_grid_update
      - mpm_gather
  - mesh_inside
descriptions:
  movie:
    description: A large purple cube is subjected to a compressive force from a thin, grey mesh sheet on its top surface. As time progresses, the cube undergoes significant deformation, flattening and expanding outward under the pressure. The internal stress distribution becomes visible as a heat map, transitioning from dark purple to bright yellow and red. By the final frame, the cube has been compressed into a much thinner, wider shape with high-intensity stress concentrated at the bottom and center.
    objects: "The primary object is a large, roughly cubic volume of particles that starts as a dark purple mass. A thin, grey rectangular mesh sheet sits on top of the cube, acting as the source of external pressure. A smaller, blue rectangular inset in the top-left corner provides a zoomed-in view of the surface deformation. A white wireframe box defines the 1 mm³ simulation domain, with a 0.25 mm scale bar provided for spatial reference."
  movie_mpm_particle:
    description: A large cube of particles undergoes a deformation process over time. The particles shift from a uniform blue state to a gradient of red and purple. The overall shape of the particle mass compresses and tilts slightly as the simulation progresses. The movement appears smooth and continuous, representing an elastic deformation of a 1 mm cube.
    objects: The primary object is a large, dense collection of particles forming a roughly cubic shape. These particles transition from a solid blue color to a gradient of red at the bottom and purple at the top. A smaller, static blue cube is shown in an inset box in the upper left corner for reference. The entire simulation is contained within a wireframe bounding box with a scale bar indicating 0.25 mm.
