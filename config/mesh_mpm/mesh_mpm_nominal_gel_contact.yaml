# MESH-MPM 12 -- THE FULL-SIZE SPHEROID IN THE GEL, drawn as surfaces.
#
# `mesh_mpm_spheroid_nominal` -- which is `promo_G_gates_gate_00_spheroid_B` verbatim -- pressed into
# the gel of rung 11. The tissue is UNTOUCHED and at the ORIGIN in its own units (radius 4.65 growing
# to 17.95); `mesh_contact` maps it into the box at the point of use with `scale: 0.00836`, so it
# ends at 0.150 -- gate 04's own final radius, and 0.00836 is within 2% of gate 04's own 0.00853.
# The only edits to the tissue are its clock and its box, and neither is dynamical: every tissue
# operator here is per-FRAME, and `cell_mechanics` now divides by `general.dt` so the engine's own
# multiplication cancels it whatever the timestep.
#
# `render_3d: surface` RATHER THAN `dots`, because the question here is the SHAPE. Rung 11 draws the
# gel as points coloured by strain, which is the right picture for a FIELD -- a bulb under an
# indenter is interior and a boundary cannot show it. This one shows what the two bodies look like:
# the skinned isosurface of the gel, built once at rest and ridden by the particles, with the
# epithelium over it flat and cell-edged. The section still carries the field.
#
# 500 FRAMES AND A NEARER START. At 400 the spheroid spent a third of the run in the air and the
# contact was the last act; the gel's top is now 0.472 against a mapped lower pole of 0.4791, so
# they meet in the first few frames. `scale` drops 0.00836 -> 0.00449 because the tissue keeps
# growing: at 800 frames the shell is several times the radius it reaches at 400, and the old scale
# would put it through the wall of its own box. The reservoirs are raised with it -- a vesicle that
# runs out of its own vertex array stops rather than reports.
#
# 800 FRAMES, AND THE LIMIT IS REAL. Not the solver: Growth here compounds: the mesh is
# 38,000 half-edges at frame 400, 178,000 at 550 and 263,000 at 600 -- roughly 1.5x per fifty
# frames -- so 800 lands near a million half-edges and ~170,000 cells, past the reservoir this spec
# declares and far past the point where rebuilding the contact's direction-bin table once a frame is
# affordable. The 800-frame attempt sat at frame 604 after twenty minutes with the GPU idle. 500
# still multiplies the 400-frame run's mesh by three, which is the range this ladder can report on.

general:
  name: mesh_mpm_nominal_gel_contact
  seed: 0
  n_frames: 500
  dt: 0.0032
  record_cap: 202
  boundary: free
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1172.3329425556858
    force_nN: 9162.430188008488
  record_every: 4
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  fps: 60
  mesh_color: '#cfd8e3'
  real_time: false
  slow_motion: 2
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
  - quantity: radius
    xlabel: frame
    ylabel: shell radius
    ticks: 4
  render_3d: surface
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
  surface_opacity: 1.0
  surface_color: '#cfd8e3'
  cross_section:
    axis: y
    at: 0.5
    thickness: 6
    max_points: 8000
sets:
  vertex:
    n: 524288
    mesh: half_edge
    cell_set: cell
  cell:
    n: 262144
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
  mpm_particle:
    n: 500000
    types:
      gel:
        fraction: 1.0
        youngs: 15.0
        density: 1.0
        block:
        - 0.05
        - 0.05
        - 0.05
        - 0.95
        - 0.95
        - 0.472
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 200
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.003457
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: junction_myosin
  at: vertex
  activity: 1.0
  tau: 20.0
  beta: 1.0
  myo_new: 1.0
  dt: 1.0
  inherit: true
  keyed_on: length
  destabilising: true
  k_perim: 1.0
  lam: 0.0
  gam: 0.0
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  centre:
  - 0.5
  - 0.5
  - 0.5
  scale: 0.00449
  k_frac: 0.9
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 100000.0
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 8.0
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1000000000.0
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 2.0
  K_R: 0.4
  Lambda: 3.0
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 0.0032
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
- op: junction_sync
  at: vertex
  myo_new: 1.0
  inherit: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_grow
- junction_myosin
- substep_dt: 0.0004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- cell_mechanics
- edge_flip
- cell_divide
- junction_sync
- topo_record
- mesh_inside
