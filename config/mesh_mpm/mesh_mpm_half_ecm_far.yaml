# MESH-MPM 09 -- THE MATRIX ADDED TO THE WORKING TISSUE, gate 04's way: the CONTACT does the mapping.
#
# THE TISSUE IS NOT MOVED, AND THAT IS THE WHOLE POINT. `mesh_mpm_spheroid_half`'s vesicle lives at
# the ORIGIN in its own units -- radius 2.343 growing to 9.32 -- because `cell_mechanics`'s radial
# term penalises (|pos| - R0)^2 from the WORLD origin and is the one part of the shape energy that
# is not translation-invariant. Translating it into the matrix's box destroys it: measured, the
# radius spread goes 0.006 -> 0.407 of the mean on the FIRST recorded frame, before a division.
#
# SO THE MAPPING HAPPENS AT THE POINT OF USE, which is what `log/okuda_ECM/04_spheroid_ecm` did and
# what its `scale: 0.00853007254279858` is. `export_tissue` wrote each cached mesh as `p - c` --
# about the tissue's OWN centroid, in tissue units -- and `mesh_contact` mapped it into the unit box
# with `scale` and `centre`. A radius of 17.58 tissue units was 0.15 of the box because
# 0.15/17.58 = 0.00853. The live path now does exactly that, on a copy: the surface is centred on
# its own centroid, scaled by `scale`, and placed at `centre`. Here 0.0161 x 9.32 = 0.150, the same
# final radius gate 04 reached, so the matrix sees the same thing it saw.
#
# THE CAVITY IS OVERSIZED ON PURPOSE, and this rung is the sanity check. `cavity_r: 0.22` against a
# tissue that ends at 0.150 means the two NEVER TOUCH: `mesh_contact` is scheduled, the 200,000
# fibre points are there, and the contact must report zero all run. What it tests is that the
# matrix and the mapping are inert -- that the tissue reproduces `mesh_mpm_spheroid_half` cell for
# cell. Gate 04's own `cavity_r: 0.045` is the next rung, and only worth running if this one holds.
#
# `cell_mechanics dt: 0.0032` MATCHES `general.dt`, AND IT MUST. The operator divides the
# displacement it solves by its own `dt` and the engine multiplies the emitted velocity by the
# ENGINE's, so what moves is (x - x0) * general.dt / operator.dt. Both are 1.0 in every spec written
# so far and they cancel; lowering `general.dt` for the co-scheduled MPM without lowering this one
# ran the tissue's relaxation at 0.32% of its intended rate -- 270 cells instead of 7,814, with every
# shape diagnostic reporting a healthy round shell. It reads as a growth-rate problem and it is a
# unit-of-time problem. The operator now warns when the two disagree.
#
# THE MATRIX IS DRAWN TRANSLUCENT because it is a SHELL and the tissue is inside it. The isosurface
# is built from the largest positional set -- 200,000 fibre points against the vesicle's ~25,000
# vertices -- so at full opacity the movie is a plain grey ball and the experiment is invisible.
# That is a rendering fact and not a dynamical one: this rung reproduces `mesh_mpm_spheroid_half`
# cell for cell (200/386/1054/2862 at frames 0/100/200/300, roundness equal to four decimals).

general:
  name: mesh_mpm_half_ecm_far
  seed: 0
  n_frames: 401
  dt: 0.0032
  record_cap: 403
  boundary: free
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1172.3329425556858
    force_nN: 9162.430188008488
plotting:
  renderer: vtk_points
  background: black
  up_axis: 2
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  dot_size: 1.6
  fps: 60
  mesh_color: '#cfd8e3'
  real_time: false
  slow_motion: 2
  curve:
  - quantity: cells
    xlabel: frame
    ylabel: cells
    ticks: 4
  - quantity: area
    xlabel: frame
    ylabel: cell area
    ticks: 4
  - quantity: radius
    xlabel: frame
    ylabel: shell radius
    ticks: 4
  render_3d: surface
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
  surface_opacity: 0.22
  surface_color: '#7a8ea8'
  cross_section:
    axis: z
    at: 0.5
    thickness: 6
    max_points: 6000
sets:
  vertex:
    n: 25584
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12800
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
  mpm_particle:
    n: 200000
    types:
      matrix:
        fraction: 1.0
        youngs: 15.0
        density: 1.0
        block:
        - 0.1
        - 0.1
        - 0.1
        - 0.9
        - 0.9
        - 0.9
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 200
  radius: 2.5
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.003457
  rho: 1.0
  a_sw: 50.0
  hill: 4.0
  vth_frac: 2.5
- op: junction_myosin
  at: vertex
  activity: 1.0
  tau: 20.0
  beta: 1.0
  myo_new: 1.0
  dt: 1.0
  inherit: true
  keyed_on: length
  destabilising: true
  k_perim: 1.0
  lam: 0.0
  gam: 0.0
- op: ecm_seed
  at: mpm_particle
  centre:
  - 0.5
  - 0.5
  - 0.5
  cavity_r: 0.22
  cavity_h: 0.22
  cavity_sphere: true
  axis: 1
  shell_r: 0.45
  margin: 0.02
  n_fibres: 10000
  fibre_len: 0.12
  align: 0.0
  align_dir:
  - 1.0
  - 0.0
  - 0.0
  seed: 0
  before_frame: 1
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  centre:
  - 0.5
  - 0.5
  - 0.5
  scale: 0.0161
  k_frac: 0.45
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 100000.0
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 8.0
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1000000000.0
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 0.25
  K_V: 8.0
  K_R: 0.4
  Lambda: 0.375
  Gamma: 0.1
  p0: 3.5
  mu: 1.0
  dt: 0.0032
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: cell_divide
  at: vertex
  cell_set: cell
  every: 4
  engine_clock: true
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
- op: junction_sync
  at: vertex
  myo_new: 1.0
  inherit: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_grow
- junction_myosin
- ecm_seed
- substep_dt: 0.0004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- cell_mechanics
- edge_flip
- cell_divide
- junction_sync
- topo_record
- mesh_inside
