# MESH-MPM 06 -- ONE OPERATOR TOWARD A GROWING SPHEROID: `cell_mechanics`.
#
# `mesh_mpm_spheroid_gel.yaml` PLUS EXACTLY ONE OPERATOR, which is the whole method. The working
# point is a PRESCRIBED shell -- scaled about its centroid, rigid, feeling nothing -- and the
# destination is a solved epithelium that grows because its cells do. Going there in one step is
# what produced a tissue dividing ten times too fast with no way to say which of six added operators
# did it. This rung adds the first: the shell stops being rigid and holds its shape by force balance,
# while `surface_drive` still supplies the growth.
#
# `rigid: false` ON THE DRIVE, WITHOUT WHICH THE OPERATOR IS INERT. Growth resets the vertices from
# the SEEDED shape every frame, which is exact and right for a tool; here it would discard whatever
# `cell_mechanics` had just solved, so the shell would read as rigid while the schedule said
# otherwise. Incremental, the scaling composes with the mechanics instead of overwriting it.
#
# THE CONSTANTS ARE DERIVED, NOT COPIED, AND THAT IS NOT OPTIONAL. The vertex energy is not
# invariant under a dilation, and this shell is radius 0.08 with cells of area 2.0e-4 against the
# reference's radius 5.0 and area 1.551 -- a factor of 7,800 in cell area. Holding each per-cell
# ratio to K_A A^2 fixed (K_P ~ A, K_V ~ 1/R^2, Lambda ~ A^1.5, Gamma ~ A, K_R ~ A^2/R^2) and then
# correcting each against its MEASURED ratio gives the numbers below. Verified:
#
#     spec                    cell area   K_P/K_A   K_V/K_A   Lambda/K_A   Gamma/K_A   K_R/K_A
#     reference R5.0 N200         1.551     9.704      5.40        601.9       194.1     8.216
#     this      R0.08 N400      1.993e-4     8.977     5.424        511.4       179.5     6.757
#
# `centre: [0.5, 0.53, 0.5]` because `K_R` penalises (|pos| - R0)^2 from the WORLD ORIGIN, and this
# shell is not there. Every other term is translation-invariant already.
#
# WHAT THIS RUNG IS ASKED. Does adding a solved tissue operator to a schedule that also runs MPM
# keep the run clean -- the bin grid off its floor, the penetration steady, the momentum residual at
# 1e-8 -- or does it reproduce the tenfold divergence? `cell_grow`, `cell_divide` and `edge_flip`
# come after, one at a time, and only if this one holds.

general:
  name: mesh_mpm_spheroid_gel_mech
  seed: 0
  n_frames: 400
  dt: 0.0032
  record_cap: 102
  record_every: 4
  boundary: wall
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1000.0
    force_nN: 6666.666666666667
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  render_3d: surface
  dot_size: 1.6
  fps: 60
  slow_motion: 4
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  cross_section:
    axis: z
    at: 0.5
    thickness: 6
    max_points: 6000
  mesh_style: surface
  mesh_edges: true
  mesh_opacity: 1.0
  mesh_flat: true
  mesh_color: '#cfd8e3'
sets:
  vertex:
    n: 4096
    mesh: half_edge
    cell_set: sphere_face
  sphere_face:
    n: 512
  mpm_particle:
    n: 500000
    types:
      gel:
        fraction: 1.0
        youngs: 30.0
        density: 1.0
        block:
        - 0.15
        - 0.05
        - 0.15
        - 0.85
        - 0.45
        - 0.85
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  n_cells: 400
  radius: 0.08
  centre:
  - 0.5
  - 0.53
  - 0.5
  jitter: 0.18
  p0: 3.5
  seed: 0
- op: surface_drive
  at: vertex
  grow: 2.4
  over: 320
  rigid: false
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  k_frac: 0.45
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 100000.0
  centre: centroid
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.5
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1.0e9
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
- op: cell_mechanics
  at: vertex
  centre:
  - 0.5
  - 0.53
  - 0.5
  K_A: 1.0
  K_P: 0.0001401
  K_V: 7778.0
  K_R: 3.193e-05
  Lambda: 5.212e-06
  Gamma: 5.607e-05
  p0: 3.5
  mu: 7800.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
schedule:
- mesh_seed
- surface_drive
- substep_dt: 0.0004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- mesh_inside
- cell_mechanics
descriptions:
  movie:
    description: A large purple cube is subjected to a compressive force from a thin, grey mesh sheet
      on its top surface. As time progresses, the cube undergoes significant deformation, flattening and
      expanding outward under the pressure. The internal stress distribution becomes visible as a heat
      map, transitioning from dark purple to bright yellow and red. By the final frame, the cube has been
      compressed into a much thinner, wider shape with high-intensity stress concentrated at the bottom
      and center.
    objects: "The primary object is a large, roughly cubic volume of particles that starts as a dark purple\
      \ mass. A thin, grey rectangular mesh sheet sits on top of the cube, acting as the source of external\
      \ pressure. A smaller, blue rectangular inset in the top-left corner provides a zoomed-in view of\
      \ the surface deformation. A white wireframe box defines the 1 mm\xB3 simulation domain, with a\
      \ 0.25 mm scale bar provided for spatial reference."
  movie_mpm_particle:
    description: A large cube of particles undergoes a deformation process over time. The particles shift
      from a uniform blue state to a gradient of red and purple. The overall shape of the particle mass
      compresses and tilts slightly as the simulation progresses. The movement appears smooth and continuous,
      representing an elastic deformation of a 1 mm cube.
    objects: The primary object is a large, dense collection of particles forming a roughly cubic shape.
      These particles transition from a solid blue color to a gradient of red at the bottom and purple
      at the top. A smaller, static blue cube is shown in an inset box in the upper left corner for reference.
      The entire simulation is contained within a wireframe bounding box with a scale bar indicating 0.25
      mm.
