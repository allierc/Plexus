# MESH-MPM 01 -- the SPHERE: a closed vertex surface driven into the same elastic gel.
#
# THE CONTACT'S NATIVE CASE, WHICH MAKES IT THE CONTROL. For a closed star-shaped shell the
# forbidden region IS the shell's interior, so `centre: centroid` needs no offset: there is no
# standoff to choose and no degenerate ray to avoid. The plate and the pyramid are the awkward
# cases; this is the one `mesh_contact` was written for, and all three now run one code path.
#
# A HERTZIAN CONTACT: the patch GROWS with indentation, so the gel is loaded through a
# different history from the flat punch's at the same final depth. `seed_mesh` builds the shell
# as a spherical Voronoi tessellation -- 400 faces -- which is the same seeder 461 okuda specs
# use for an epithelium, here carrying no biology and only its geometry.
#
# THE LADDER'S SHARED PART, IDENTICAL IN ALL THREE RUNGS. Same gel (E = 30 stress units = 200 Pa at
# this calibration, a 1-3 mg/ml collagen I gel), same 500,000 material points, same warp solver,
# same penalty (`k_frac: 0.45`, 20% of the explicit ceiling), same descent. Only the TOOL differs,
# so anything that differs between the movies is the shape of the indenter.
#
# THE TOOL STARTS 0.01 ABOVE THE GEL -- 10 um, two thirds of a grid cell -- and travels `by: -0.11`
# over 320 of the 400 frames, then holds for 80. The approach used to be 0.10 of the box, i.e. half
# the run spent watching a tool fall through empty space; contact now begins around frame 30 and the
# rest of the movie is the thing the run is about. The hold is not padding either: it is the only
# stretch in which the surface is at REST under load, where the friction law's regularised branch
# and the penalty's steady overlap can be read without a sliding term.
#
# `by:` AND NOT `target:`, because `target` is an absolute coordinate of the surface's CENTROID --
# the low point of a flat plate, the centre of a sphere, and neither for a pyramid. Three rungs
# meant to travel the same distance would have had to declare three different numbers.
#
# `centre: centroid` RIDES THE TOOL. `mesh_contact` is star-shaped: it rays from `centre` and pushes
# anything between `centre` and the surface outward, so `centre` names the region the gel may not
# enter. Re-read every frame it is the tool's own middle, and `centre_offset` lifts it into the body
# of an OPEN tool (a plate or a pyramid has no interior to sit in). Declared fixed, the standoff
# drifts as the tool descends -- 0.30 to 0.50 on the first version of the sheet, which walked the
# contact's direction-bin grid from 90 rows to 150 for a geometry that never changed.

general:
  name: mesh_mpm_sphere_elastic
  seed: 0
  n_frames: 400
  dt: 0.0032
  record_cap: 102
  record_every: 4
  boundary: wall
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  units:
    length_um: 1000.0
    force_nN: 6666.666666666667
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  render_3d: surface
  dot_size: 1.6
  fps: 60
  slow_motion: 4
  color_field: deformation
  color_range:
  - 0.0
  - 0.35
  cross_section:
    axis: z
    at: 0.5
    thickness: 6
    max_points: 6000
sets:
  vertex:
    n: 4096
    mesh: half_edge
    cell_set: sphere_face
  sphere_face:
    n: 512
  mpm_particle:
    n: 500000
    types:
      gel:
        fraction: 1.0
        youngs: 30.0
        density: 1.0
        block:
        - 0.15
        - 0.05
        - 0.15
        - 0.85
        - 0.45
        - 0.85
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: mesh_seed
  at: vertex
  n_cells: 400
  radius: 0.15
  centre:
  - 0.5
  - 0.61
  - 0.5
  jitter: 0.15
  p0: 3.5
  seed: 0
- op: surface_drive
  at: vertex
  axis: 1
  by: -0.11
  over: 320
- op: mesh_contact
  at: mpm_particle
  surface: vertex
  k_frac: 0.45
  mu: 0.4
  dt: 0.0032
  n_grid: 64
  a_max: 100000.0
  centre: centroid
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.5
  a_max: 100000.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.7
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1.0e9
  implementation: warp
- op: mesh_inside
  at: mpm_particle
  n_grid: 64
schedule:
- mesh_seed
- surface_drive
- substep_dt: 0.0004
  steps:
  - mesh_contact
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- mesh_inside
descriptions:
  movie:
    description: A large purple cube is subjected to a compressive force from a thin, grey mesh sheet
      on its top surface. As time progresses, the cube undergoes significant deformation, flattening and
      expanding outward under the pressure. The internal stress distribution becomes visible as a heat
      map, transitioning from dark purple to bright yellow and red. By the final frame, the cube has been
      compressed into a much thinner, wider shape with high-intensity stress concentrated at the bottom
      and center.
    objects: "The primary object is a large, roughly cubic volume of particles that starts as a dark purple\
      \ mass. A thin, grey rectangular mesh sheet sits on top of the cube, acting as the source of external\
      \ pressure. A smaller, blue rectangular inset in the top-left corner provides a zoomed-in view of\
      \ the surface deformation. A white wireframe box defines the 1 mm\xB3 simulation domain, with a\
      \ 0.25 mm scale bar provided for spatial reference."
  movie_mpm_particle:
    description: A large cube of particles undergoes a deformation process over time. The particles shift
      from a uniform blue state to a gradient of red and purple. The overall shape of the particle mass
      compresses and tilts slightly as the simulation progresses. The movement appears smooth and continuous,
      representing an elastic deformation of a 1 mm cube.
    objects: The primary object is a large, dense collection of particles forming a roughly cubic shape.
      These particles transition from a solid blue color to a gradient of red at the bottom and purple
      at the top. A smaller, static blue cube is shown in an inset box in the upper left corner for reference.
      The entire simulation is contained within a wireframe bounding box with a scale bar indicating 0.25
      mm.
