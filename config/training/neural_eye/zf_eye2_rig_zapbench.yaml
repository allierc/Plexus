name: zf_eye2_rig_zapbench
model: config/neural/zf_eyeG2_285.yaml
learnable:
- {block: w, of: synapse}
- {block: w, of: afferent}
- {block: w, of: junction_lr}
- {block: w, of: junction_mr}
- {block: tau, of: neuron}
- {block: bias, of: neuron}
- {block: bias, of: muscle}
task:
  reference: {corpus: t9_zapbench_eye, n_test: 1}
  drive: {set: retina, block: signal}
  observe: {set: eye, block: pose, channel: 0, unit: deg, elements: all}
  loss: mse
  record: {set: neuron, block: voltage, every_s: 0.914}
training:
  epochs: 0
  init_from: zf_eye2_rig
