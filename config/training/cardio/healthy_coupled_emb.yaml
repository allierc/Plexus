name: healthy_coupled_emb
model: config/tissue/cardio_strain_healthy_coupled_emb.yaml
learnable:
- {param: W1, op: active_strain, lr: 0.01}
- {param: W2, op: active_strain, lr: 0.003}
- block: embedding
  of: cell
  lr: 0.01
  prior: {shrink_to_mean: 0.01}
task:
  reference:
    recording: healthy
    beats: [1, 2, 3]
  drive: {set: mpm_particle, prescribe: edge_band, width: 0.03}
  observe: {set: mpm_particle, block: pos, measure: cell_affine, of: cell}
  loss: affine_mse
  u_weight: 1.0
  mask: interior
training: {optimizer: adam, lr: 0.01, schedule: cosine, lr_min_frac: 0.05, iters: 60, seed: 0, save_every: 10}
