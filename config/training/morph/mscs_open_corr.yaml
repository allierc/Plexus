name: mscs_open_corr
model: config/si_material/mscs_morph.yaml
learnable:
- block: rate
  of: mpm_particle
  with: lattice
  over: material
  K: 12
  extent: [0.175, 0.175, 0.175, 0.13764]
task:
  reference:
    shape: mscs_open_surface
    size: 0.238416
    centre: [0.174979, 0.175501, 0.172083]
  observe: {set: mpm_particle, block: pos, measure: grid_mass, grid: mpm_grid}
  loss: log_mse
training:
  optimizer: adam
  lr: 3.0
  lr_min: 0.15
  schedule: cosine
  seed: 0
  stages:
  - resolution: {mpm_grid: 32}
    iters: 80
  - resolution: {mpm_grid: 48}
    iters: 80
  - resolution: {mpm_grid: 64}
    iters: 80
  render: {frames: 200, px: 1100}
