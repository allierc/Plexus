name: wl_gc_base_mc
model: config/redox/wl_f338_in4.yaml
learnable:
- {param: theta, op: diffuse, title: GraphCast model of whole-body calcium (exp19)}
task:
  reference: {field_recording: wholistic_f338_mcherry, coarsen: 1, n_test: 320, n_val: 160}
  observe: {field: ratio}
  loss: masked_mse
training: {optimizer: adam, lr: 0.001, lr_min_frac: 0.05, clip: 1.0, iters: 1500, horizon: [1, 1, 3, 6], batch: 4, seed: 0, save_every: 50}
