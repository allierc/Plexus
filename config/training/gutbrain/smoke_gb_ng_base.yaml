name: smoke_gb_ng_base
model: config/gutbrain/gb_ng_glucose_f1.yaml
learnable:
- param: W_short
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per short edge (6 nearest cells)
- param: W_mid
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per middle edge
- param: W_long
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per long edge
- block: tau
  of: neuron
  lr: 0.0018
  title: each cell's rate 1/tau
- block: rest
  of: neuron
  lr: 0.0018
  title: each cell's rest value
- block: input
  of: neuron
  lr: 0.0018
  title: each cell's weights on the 6 forcings
task:
  reference:
    trace_recording: gutbrain_glucose_f1
    split: recording
    test_stride: 8
  drive:
    set: stimulus
    block: u
    window:
    - 0
    - 0
  observe:
    set: neuron
    block: dff
  loss:
  - term: trace_mse
    reduction: norm2
training:
  optimizer: adam
  lr: 0.0018
  schedule: none
  clip: 1.0
  batch: 4
  seed: 0
  save_every: 500
  select: last
  stages:
  - horizon: 1
    iters: 20
  - horizon: 5
    iters: 10
