name: gb_gc_persist
model: config/gutbrain/gb_gc_glucose_f1.yaml
learnable:
- {param: theta, op: state_diffuse, title: "the GraphCast law's weights, one flat tensor"}
- {block: embedding, of: neuron, title: "each cell's embedding, 8 numbers"}
task:
  reference: {trace_recording: gutbrain_glucose_f1, split: recording, test_stride: 1}
  drive: {set: stimulus, block: u, window: [-5, 1]}
  observe: {set: neuron, block: dff}
  loss: trace_mse
training: {optimizer: adam, lr: 0.001, schedule: none, clip: 1.0, batch: 4, seed: 0, save_every: 500, select: last,
           stages: [{horizon: 1, iters: 0}]}
