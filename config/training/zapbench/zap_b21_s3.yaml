name: zap_b21_s3
model: config/zapbench/zap_b21_s3.yaml
learnable:
- param: A_send
  op: state_diffuse
  lr: 0.0009
  title: 'each neuron''s signed output a_j: its excitatory (> 0) or inhibitory (< 0) identity'
- param: W_grid
  op: state_diffuse
  lr: 0.0009
  title: 'one weight per grid edge (squared: transport only)'
- param: G_recv
  op: state_diffuse
  lr: 0.0018
  title: each neuron's receiving gain (squared)
- block: tau
  of: neuron
  lr: 0.0018
  title: each neuron's rate 1/tau
- block: rest
  of: neuron
  lr: 0.0018
  title: each neuron's rest value
- block: input
  of: neuron
  lr: 0.0018
  title: each neuron's weights on the 22 stimulus features
- param: omega_mlp
  op: state_diffuse
  lr: 1.0e-06
  title: the modulation's SIREN weights
task:
  reference:
    trace_recording: zapbench_destripe
    split: all
    test_stride: 8
  drive:
    set: stimulus
    block: u
    window:
    - 0
    - 0
  observe:
    set: neuron
    block: dff
  loss:
  - term: trace_mse
    reduction: norm2
  warmup: 10
  rollouts:
  - name: nominal
  - name: W0
    zero:
    - A_send
  - name: no_stimulus
    drive: 'off'
training:
  optimizer: adam
  lr: 0.0018
  schedule: none
  clip: 1.0
  batch: 4
  seed: 3
  save_every: 500
  select: last
  stages:
  - horizon: 1
    iters: 30000
  - horizon: 2
    iters: 15000
  - horizon: 3
    iters: 10000
  - horizon: 4
    iters: 7500
  - horizon: 5
    iters: 6000
  - horizon: 10
    iters: 6000
  - horizon: 15
    iters: 6000
  - horizon: 20
    iters: 6000
  - horizon: 25
    iters: 6000
  - horizon: 30
    iters: 6000
  - horizon: 35
    iters: 6000
  - horizon: 40
    iters: 6000
  - horizon: 45
    iters: 6000
  - horizon: 50
    iters: 6000
