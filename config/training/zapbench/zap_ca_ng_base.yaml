name: zap_ca_ng_base
model: config/zapbench/zap_ca_ng.yaml
learnable:
- param: W_short
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per short edge (6 nearest neurons)
- param: W_mid
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per middle edge
- param: W_long
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per long edge
- block: tau
  of: neuron
  lr: 0.0018
  title: each neuron's rate 1/tau
- block: rest
  of: neuron
  lr: 0.0018
  title: each neuron's rest value
- block: input
  of: neuron
  lr: 0.0018
  title: each neuron's weights on the 22 stimulus features
- param: rate
  op: calcium_indicator
  lr: 0.0018
  title: the indicator's raw rate, k = sigmoid(rate)
- param: taps
  op: calcium_indicator
  lr: 0.0018
  title: the start-of-rollout inverse, one weight per recorded frame
task:
  reference:
    trace_recording: zapbench
    split: all
    test_stride: 8
  drive:
    set: stimulus
    block: u
    window:
    - 0
    - 0
  observe:
    set: neuron
    block: dff
  loss:
  - term: trace_mse
    reduction: norm2
training:
  optimizer: adam
  lr: 0.0018
  schedule: none
  clip: 1.0
  batch: 4
  seed: 0
  save_every: 500
  select: last
  stages:
  - horizon: 1
    iters: 12000
  - horizon: 2
    iters: 6000
  - horizon: 3
    iters: 4000
  - horizon: 4
    iters: 3000
  - horizon: 5
    iters: 2400
  - horizon: 6
    iters: 2000
  - horizon: 7
    iters: 1714
  - horizon: 8
    iters: 1500
  - horizon: 9
    iters: 1333
  - horizon: 10
    iters: 1200
