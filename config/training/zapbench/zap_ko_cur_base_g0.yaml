name: zap_ko_cur_base_g0
model: config/zapbench/zap_ko_cur.yaml
learnable:
- param: W
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: 'one weight per mesh edge: a mesoscale connectome'
- param: mesh_rate
  op: state_diffuse
  lr: 0.0018
  title: each mesh node's rate 1/tau
- param: mesh_rest
  op: state_diffuse
  lr: 0.0018
  title: each mesh node's rest value
- block: tau
  of: neuron
  lr: 0.0018
  title: each neuron's rate 1/tau
- block: rest
  of: neuron
  lr: 0.0018
  title: each neuron's rest value
- block: gain
  of: neuron
  lr: 0.0018
  title: each neuron's gain on the mesh
- block: input
  of: neuron
  lr: 0.0018
  title: each neuron's weights on the 22 stimulus features
task:
  reference:
    trace_recording: zapbench
    split: all
    test_stride: 8
  drive:
    set: stimulus
    block: u
    window:
    - 0
    - 0
  observe:
    set: neuron
    block: dff
  loss:
  - term: trace_mse
    reduction: norm2
training:
  optimizer: adam
  lr: 0.0018
  schedule: none
  clip: 1.0
  batch: 4
  seed: 0
  save_every: 500
  select: last
  stages:
  - horizon: 1
    iters: 4000
  - horizon: 2
    iters: 2000
  - horizon: 3
    iters: 1333
  - horizon: 4
    iters: 1000
  - horizon: 5
    iters: 800
  - horizon: 6
    iters: 666
  - horizon: 7
    iters: 571
  - horizon: 8
    iters: 500
  - horizon: 9
    iters: 444
  - horizon: 10
    iters: 400
  - horizon: 11
    iters: 363
  - horizon: 12
    iters: 333
  - horizon: 13
    iters: 307
  - horizon: 14
    iters: 285
  - horizon: 15
    iters: 266
  - horizon: 16
    iters: 250
  - horizon: 17
    iters: 235
  - horizon: 18
    iters: 222
  - horizon: 19
    iters: 210
  - horizon: 20
    iters: 200
