learnable:
- lr: 0.0009
  op: state_diffuse
  param: W_short
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
    dale: 0.001
  title: one weight per short edge (the finest level, every neuron's Delaunay neighbours)
- lr: 0.0009
  op: state_diffuse
  param: W_mid
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per middle edge (the 16- and 32-um levels)
- block: tau
  lr: 0.0018
  of: neuron
  title: each neuron's rate 1/tau
- block: rest
  lr: 0.0018
  of: neuron
  title: each neuron's rest value
- block: input
  lr: 0.0018
  of: neuron
  title: each neuron's weights on the 27 stimulus features (22 visual + 5 ephys)
model: config/zapbench/zap_g17_mesh3.yaml
name: zap_g17_mesh3_dale_d1em3
task:
  drive:
    block: u
    set: stimulus
    window:
    - 0
    - 0
  loss:
  - reduction: norm2
    term: trace_mse
  observe:
    block: dff
    set: neuron
  reference:
    split: all
    test_stride: 8
    trace_recording: zapbench_destripe_ephys
  warmup: 10
training:
  batch: 4
  clip: 1.0
  lr: 0.0018
  optimizer: adam
  save_every: 500
  schedule: none
  seed: 0
  select: last
  stages:
  - horizon: 1
    iters: 12000
  - horizon: 2
    iters: 6000
  - horizon: 3
    iters: 4000
  - horizon: 4
    iters: 3000
  - horizon: 5
    iters: 2400
  - horizon: 10
    iters: 2400
  - horizon: 15
    iters: 2400
  - horizon: 20
    iters: 2400
  - horizon: 25
    iters: 2400
  - horizon: 30
    iters: 2400
  - horizon: 35
    iters: 2400
  - horizon: 40
    iters: 2400
  - horizon: 45
    iters: 2400
  - horizon: 50
    iters: 2400
