name: zap_gm12_now
model: config/zapbench/zap_gm12_snd_nol1.yaml
learnable:
- param: theta_f
  op: state_diffuse
  lr: 0.0018
  prior:
    l1: 0.025
    l2: 0.0005
  title: the update MLP f_theta
- block: input
  of: neuron
  lr: 0.0018
  title: each neuron's weights on the 22 stimulus features
- block: embedding
  of: neuron
  lr: 0.002325
  title: each neuron's 2-number embedding a_i
task:
  reference:
    trace_recording: zapbench_destripe
    split: zapbench
    test_stride: 8
  drive:
    set: stimulus
    block: u
    window:
    - 0
    - 0
  observe:
    set: neuron
    block: dff
  loss:
  - term: trace_mse
    reduction: norm2
  warmup: 10
training:
  optimizer: adam
  lr: 0.0018
  schedule: none
  clip: 1.0
  batch: 4
  seed: 0
  save_every: 500
  select: last
  stages:
  - horizon: 1
    iters: 12000
  - horizon: 2
    iters: 6000
  - horizon: 3
    iters: 4000
  - horizon: 4
    iters: 3000
  - horizon: 5
    iters: 2400
  - horizon: 10
    iters: 2400
  - horizon: 15
    iters: 2400
  - horizon: 20
    iters: 2400
  - horizon: 25
    iters: 2400
  - horizon: 30
    iters: 2400
  - horizon: 35
    iters: 2400
  - horizon: 40
    iters: 2400
  - horizon: 45
    iters: 2400
  - horizon: 50
    iters: 2400
