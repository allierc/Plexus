name: zap_b18_ml_h200_x5
model: config/zapbench/zap_b18_lksiren.yaml
learnable:
- param: theta_g
  op: state_diffuse
  lr: 0.0018
  prior:
    l1: 0.14
    monotone: 375.0
    pin: 0.45
  title: the message MLP g_phi
- param: W_short
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per short edge (6 nearest neurons)
- param: W_mid
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per middle edge
- param: W_long
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per long edge
- block: tau
  of: neuron
  lr: 0.0018
  title: each neuron's rate 1/tau
- block: rest
  of: neuron
  lr: 0.0018
  title: each neuron's rest value
- block: input
  of: neuron
  lr: 0.0018
  title: each neuron's weights on the 27 stimulus features (22 visual + 5 ephys)
- block: embedding
  of: neuron
  lr: 0.002325
  title: each neuron's 2-number embedding a_i
- param: omega_mlp
  op: state_diffuse
  lr: 1.0e-06
  title: the modulation's SIREN weights
task:
  reference:
    trace_recording: zapbench_destripe_ephys
    split: all
    test_stride: 8
  drive:
    set: stimulus
    block: u
    window:
    - 0
    - 0
  observe:
    set: neuron
    block: dff
  loss:
  - term: trace_mse
    reduction: norm2
  warmup: 10
training:
  optimizer: adam
  lr: 0.0018
  schedule: none
  clip: 1.0
  batch: 4
  seed: 0
  save_every: 500
  select: last
  stages:
  - horizon: 1
    iters: 60000
  - horizon: 2
    iters: 30000
  - horizon: 3
    iters: 20000
  - horizon: 4
    iters: 15000
  - horizon: 5
    iters: 12000
  - horizon: 10
    iters: 12000
  - horizon: 15
    iters: 12000
  - horizon: 20
    iters: 12000
  - horizon: 25
    iters: 12000
  - horizon: 30
    iters: 12000
  - horizon: 35
    iters: 12000
  - horizon: 40
    iters: 12000
  - horizon: 45
    iters: 12000
  - horizon: 50
    iters: 12000
  - horizon: 60
    iters: 12000
  - horizon: 70
    iters: 12000
  - horizon: 80
    iters: 12000
  - horizon: 90
    iters: 12000
  - horizon: 100
    iters: 12000
  - horizon: 125
    iters: 12000
  - horizon: 150
    iters: 12000
  - horizon: 175
    iters: 12000
  - horizon: 200
    iters: 12000
