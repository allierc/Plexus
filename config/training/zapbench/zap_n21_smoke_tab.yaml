name: zap_n21_smoke_tab
model: config/zapbench/zap_n21_ph_tab.yaml
learnable:
- param: W_short
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per short edge (the finest level, every neuron's Delaunay neighbours)
- param: W_mid
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per middle edge (the 16- and 32-um levels)
- param: W_long
  op: state_diffuse
  lr: 0.0009
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
  title: one weight per long edge (level 2, the 64-um cubes)
- block: tau
  of: neuron
  lr: 0.0018
  title: each neuron's rate 1/tau
- block: rest
  of: neuron
  lr: 0.0018
  title: each neuron's rest value
- block: input
  of: neuron
  lr: 0.0018
  title: each neuron's weights on the 22 stimulus features
- param: phi
  op: state_diffuse
  lr: 0.0018
  title: the phase per ordered pair of cell types (atlas regions), rad
- param: alpha_table
  op: state_diffuse
  lr: 0.0018
  title: one broadcast angle per stimulus block, rad
task:
  reference:
    trace_recording: zapbench_destripe
    split: all
    test_stride: 64
  drive:
    set: stimulus
    block: u
    window:
    - 0
    - 0
  observe:
    set: neuron
    block: dff
  loss:
  - term: trace_mse
    reduction: norm2
  warmup: 10
  rollouts:
  - name: nominal
  - name: W0
    zero:
    - W_short
    - W_mid
  - name: no_stimulus
    drive: 'off'
training:
  optimizer: adam
  lr: 0.0018
  schedule: none
  clip: 1.0
  batch: 4
  seed: 0
  save_every: 30
  select: last
  stages:
  - horizon: 1
    iters: 40
  - horizon: 5
    iters: 20
