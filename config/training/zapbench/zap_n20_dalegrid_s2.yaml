name: zap_n20_dalegrid_s2
model: config/zapbench/zap_n20_dalegrid_s2.yaml
learnable:
- param: W_grid
  op: state_diffuse
  lr: 0.0009
  title: 'one weight per grid edge (squared: transport only)'
  prior:
    l1: 7.5e-05
    l2: 7.5e-07
    dale: 0.001
- param: G_recv
  op: state_diffuse
  lr: 0.0018
  title: each neuron's receiving gain (squared)
- block: tau
  of: neuron
  lr: 0.0018
  title: each neuron's rate 1/tau
- block: rest
  of: neuron
  lr: 0.0018
  title: each neuron's rest value
- block: input
  of: neuron
  lr: 0.0018
  title: each neuron's weights on the 22 stimulus features
- param: omega_mlp
  op: state_diffuse
  lr: 1.0e-06
  title: the modulation's SIREN weights
task:
  reference:
    trace_recording: zapbench_destripe
    split: all
    test_stride: 8
  drive:
    set: stimulus
    block: u
    window:
    - 0
    - 0
  observe:
    set: neuron
    block: dff
  loss:
  - term: trace_mse
    reduction: norm2
  warmup: 10
  rollouts:
  - name: nominal
  - name: W0
    zero:
    - W_grid
  - name: no_stimulus
    drive: 'off'
training:
  optimizer: adam
  lr: 0.0018
  schedule: none
  clip: 1.0
  batch: 4
  seed: 2
  save_every: 500
  select: last
  stages:
  - horizon: 1
    iters: 12000
  - horizon: 2
    iters: 6000
  - horizon: 3
    iters: 4000
  - horizon: 4
    iters: 3000
  - horizon: 5
    iters: 2400
  - horizon: 10
    iters: 2400
  - horizon: 15
    iters: 2400
  - horizon: 20
    iters: 2400
  - horizon: 25
    iters: 2400
  - horizon: 30
    iters: 2400
  - horizon: 35
    iters: 2400
  - horizon: 40
    iters: 2400
  - horizon: 45
    iters: 2400
  - horizon: 50
    iters: 2400
