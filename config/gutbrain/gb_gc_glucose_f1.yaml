general:
  name: gb_gc_glucose_f1
  seed: 0
  n_frames: 1
  dt: 1.0
  boundary: wall
  dim: 3
  world: [1.0, 1.0, 1.0]
  save_data: false
sets:
  brain: {n: 1}
  neuron:
    parent: brain
    per_parent: 190346
    grow_reserve: 0
    title: "the 190,346 segmented cells of glucose fish 1 (Chen 2026 deposit), at their footprint centroids"
    state:
      dff: {width: 6, role: coordinate, integration: first_order, boundary: free, title: "dF/F now and the five frames before, newest first"}
      xyz: {width: 3, integration: none, boundary: free, record: false, title: "footprint centroid, um"}
      embedding: {width: 8, integration: none, boundary: free, record: false, title: "the neuron's learned embedding, 8 numbers"}
  stimulus:
    parent: brain
    per_parent: 6
    grow_reserve: 0
    title: "the 6 known inputs of the session: UV pulse, beam galvo x, y, grating speed, swim power L, R"
    state:
      u: {width: 7, integration: none, boundary: free, record: false, title: "each feature at frames t-5 .. t+1"}
fields: {}
seed:
- {op: seed_state_from_file, at: neuron, file: zebrafish/gutbrain_glucose_f1_recording.npz, blocks: {xyz: pos_um}}
- {op: seed_state_random, at: neuron, block: embedding, lo: 1.0, hi: 1.0}
- {op: seed_state_random, at: stimulus, block: u, lo: 0.0, hi: 0.0}
operators:
- {op: state_diffuse, model: graphcast, at: neuron, block: dff, positions: xyz, mesh_spacing: 16.0, mesh_mirror_axis: 1, mesh_levels: 4, latent: 32, layers: 8, inputs: 6, embedding: embedding, embedding_dim: 8, forcing: stimulus.u, forcing_dim: 42, seed: 0, checkpoint: true, title: "each neuron's dF/F, its dynamics learned by GraphCast message passing through a multi-level mesh"}
schedule: [state_diffuse]
plotting: {renderer: none, max_frames: 0}
