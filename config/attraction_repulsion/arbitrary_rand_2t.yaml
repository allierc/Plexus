# arbitrary_rand_2t -- random attraction-repulsion sweep: 2 types, 6000 particles, random p
general: {name: arbitrary_rand_2t, seed: 0, n_frames: 250, dt: 0.1, boundary: periodic}
sets:
  particle:
    n: 6000
    types:
      t0: {fraction: 0.5, p: [1.3554, 1.5191, 1.7652, 1.9092]}
      t1: {fraction: 0.5, p: [1.1511, 1.9334, 1.0052, 1.753]}
fields: {}
operators:
  - {op: radius_graph,         at: particle, radius: 0.075}
  - {op: attraction_repulsion, at: particle, sigma: 0.005}
schedule: [radius_graph, attraction_repulsion]
plotting:
  background: black
  colormap: tab10
  point_size: 2.0

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_particle:
    description: The video shows a dense field of orange and blue particles against a black background.
      The particles appear to be moving in a chaotic, jittery fashion across the entire frame. There is
      no discernible global flow or large-scale structure forming over time. The distribution of the particles
      remains relatively uniform throughout the duration of the sequence.
    objects: The scene contains two distinct sets of small, point-like particles. One set is colored orange,
      while the other set is colored blue. The particles are distributed randomly and are not connected
      to one another in any way. Each individual particle is very small and occupies only a few pixels
      in size.
