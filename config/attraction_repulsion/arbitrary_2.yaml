# Two-type attraction-repulsion, matching ParticleGraph arbitrary_3_1's regime
# (sigma=0.005, max_radius=0.075, periodic, first_derivative, dt=0.1) with the
# first two param rows of that config. Dense O(N^2) op -> N kept GPU-feasible.
general:
  name: arbitrary_2
  seed: 0
  n_frames: 250
  dt: 0.1
  boundary: periodic

sets:
  particle:
    n: 6000
    types:
      t0: { fraction: 0.5, p: [1.6233, 1.0413, 1.6012, 1.5615] }
      t1: { fraction: 0.5, p: [1.7667, 1.8308, 1.0855, 1.9055] }

fields: {}

operators:
  - { op: radius_graph, at: particle, radius: 0.075 } # rebuild neighbour graph
  - { op: attraction_repulsion, at: particle, sigma: 0.005 } # message pass over it

schedule: [radius_graph, attraction_repulsion]

plotting:
  background: black
  colormap: tab10
  point_size: 4.0

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie_particle:
    description: The video shows a dense field of small, glowing particles moving in a complex, fluid-like
      motion. These particles appear to be drifting and swirling, creating a sense of depth and dynamic
      flow. The overall scene transitions through various patterns of movement, from organized streams
      to more chaotic, scattered distributions. The background remains dark, highlighting the vibrant
      colors and intricate paths of the moving points.
    objects: The scene is populated by thousands of tiny, point-like particles distributed throughout
      the frame. These particles are primarily colored in shades of orange and light blue, creating a
      high-contrast visual effect. They are arranged in a non-linear, stochastic topology, appearing to
      flow together in clusters and individual streams. The size of each particle is uniform and very
      small, resembling a field of distant stars or microscopic matter in motion.
