general:
  name: hlo_f1_emb6_die
  seed: 0
  n_frames: 6
  dt: 1.0
  boundary: wall
  dim: 3
  world: [0.109375, 1.0, 1.0]
  save_data: false
sets: {}
fields:
  ratio: {frame: grid, res: 128, components: 1, title: the redox ratio NADH/FAD of each voxel}
  embedding: {frame: grid, res: 128, components: 6, title: "each voxel's learned embedding, 6 numbers"}
  alive: {frame: grid, res: 128, components: 1, title: "each voxel's alive fraction A, the recorded tissue at the start"}
operators:
- {op: diffuse, model: graphcast, at: ratio, latent: 16, layers: 2, embedding: embedding, embedding_dim: 6, spacing: [5.0, 3.3146, 3.3146], seed: 0, checkpoint: true,
   title: the voxels' own dynamics, learned by message passing between lattice neighbours}
- {op: decay, model: surface_death, at: alive, ratio: ratio, hazard: ratio, rc0: 0.58, substeps: 4,
   title: "a voxel at the surface dies at a rate its stress sets"}
schedule: [diffuse, decay]
