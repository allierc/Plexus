general:
  name: hlo_ko_off
  seed: 0
  n_frames: 6
  dt: 1.0
  boundary: wall
  dim: 3
  world: [0.109375, 1.0, 1.0]
  save_data: false
sets: {}
fields:
  ratio: {frame: grid, res: 128, components: 1, title: the redox ratio NADH/FAD of each voxel}
  rest: {frame: grid, res: 128, components: 1, title: "each voxel's metabolic set point, offset from the tissue mean"}
  rate: {frame: grid, res: 128, components: 1, title: "each voxel's relaxation rate 1/tau, per 10 min"}
  beta: {frame: grid, res: 128, components: 1, title: "each voxel's sensitivity to the washout"}
  embedding: {frame: grid, res: 128, components: 6, title: "each voxel's embedding, whose distances set the exchange"}
operators:
- {op: diffuse, model: known_ode, at: ratio, rest: rest, rate: rate, beta: beta, embedding: embedding, drive_offset: true, forcing: 69,
   substeps: 4, spacing: [5.0, 3.3146, 3.3146],
   title: "each voxel relaxes to its set point, exchanges with its neighbours and follows the washout"}
schedule: [diffuse]
