general:
  name: apop_ctrl
  seed: 0
  n_frames: 600
  dt: 1.0
  record_cap: 602
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
_run:
  target_cells: 60000
  seed_cells: 2000
sets:
  vertex:
    n: 120000
    mesh: half_edge
    cell_set: cell
  cell:
    n: 60000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: mesh_seed
  at: vertex
  cell_set: cell
  before_frame: 1
  n_cells: 2000
  seed: 0
  vseed_cv: 0.15
  radius: 5.0
  jitter: 0.15
  p0: 3.5
- op: cell_geometry
  at: cell
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 20.0
  K_R: 0.0
  Lambda: 0.5
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  K_bend: 0.0
  K_lumen: 0.0
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_mechanics
- edge_flip
- topo_record
_basis:
  chem: none
  mat: static
  mech: plain
  grid: 4 chemistry x 2 material x 2 mechanics
  why: chemistry=none, material=static, mechanics=plain -- one cell of the basis grid
    written by make_basis.py; every value not on an axis is shared with the other
    fifteen.
