general:
  name: mini_coral_nodilute
  seed: 0
  n_frames: 500
  dt: 1.0
  record_cap: 502
  boundary: free
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
sets:
  vertex:
    n: 4996
    mesh: half_edge
    cell_set: cell
  cell:
    n: 2500
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: mesh_seed
  at: vertex
  cell_set: cell
  n_cells: 150
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  before_frame: 1
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_neighbours
  at: cell
- op: cell_chem_seed
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.06
- op: cell_chem_diffuse
  at: cell
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.055
  kk: 0.062
  rate: 1.0
- op: morphogen_growth_3d
  at: vertex
  cell_set: cell
  rate: 0.002773
  a_sw: 50.0
  hill: 4.0
  rho: 1.0
  vth_frac: 1.4
  conserve_amount: false
- op: cell_mechanics
  at: vertex
  p0: 3.5
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.4
  Lambda: 3.0
  K_V: 2.0
  K_R: 0.4
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  l_th_frac: 0.35
  every: 4
  max_flips: 30
  engine_clock: true
- op: cell_divide
  at: vertex
  factor: 2.0
  reset_noise: 0.12
  cycle_cv: 0.15
  p0: 3.5
  every: 4
  cell_set: cell
  min_cycle: 4
  max_cycle: 1000000000
  engine_clock: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_neighbours
- cell_chem_seed
- cell_chem_diffuse
- cell_chem_react
- morphogen_growth_3d
- cell_mechanics
- edge_flip
- cell_divide
- topo_record
_discovery:
  comp_hash: MINI_coral_nodilute
  region: minisite coral, conserve_amount OFF [reference buffers 3552/1800]
_premises:
  waive:
    P3: REFERENCE REPRODUCTION. vth_frac 1.4 < factor 2.0 is a property OF the minisite
      config we are reproducing, not our choice. It means every division there comes
      from the max_cycle timer rather than from a cell reaching size, so cell number
      doubles while mean cell volume halves and the ball never grows -- which is exactly
      the behaviour Cedric observed in the reference movie. Reproducing it faithfully
      requires reproducing this. mini_grow_divide_bigger is the same config with the
      ceiling raised, and is the controlled comparison.
