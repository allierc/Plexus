general:
  name: promo_0_b_null_plain_B
  seed: 0
  n_frames: 1800
  dt: 1.0
  record_cap: 1802
  record_every: 1
  boundary: free
  dim: 3
  world:
    - 80.0
    - 80.0
    - 80.0
_run:
  target_cells: 60000
  seed_cells: 2000
sets:
  cell:
    n: 60000
    state:
      chem:
        width: 2
        integration: first_order
      centroid:
        width: 3
      area:
        width: 1
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
  vertex:
    n: 120000
    mesh: half_edge
  half_edge:
    n: 480000
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
seed:
  - op: mesh_seed
    at: vertex
    n_cells: 2000
    seed: 0
    vseed_cv: 0.15
    radius: 5.0
    jitter: 0.15
    p0: 3.5
operators:
  - op: cell_geometry
    at: cell
  - op: cell_mechanics
    at: vertex
    K_A: 1.0
    K_P: 1.0
    K_V: 20.0
    K_R: 0.0
    Lambda: 0.5
    Gamma: 0.4
    p0: 3.5
    mu: 1.0
    dt: 1.0
    relax_iters: 30
    eta: 0.08
    cap_frac: 0.12
    K_bend: 0.0
    K_lumen: 0.0
  - op: cell_divide
    at: vertex
    factor: 2.0
    cycle_cv: 0.15
    min_cycle: 4
    max_cycle: 1000000000
    p0: 3.5
    every: 4
    engine_clock: true
  - op: edge_flip
    at: vertex
    l_th_frac: 0.28
    every: 1
    max_flips: 300
  - op: topo_record
    at: vertex
    every: 1
schedule:
  - cell_geometry
  - cell_mechanics
  - cell_divide
  - edge_flip
  - topo_record
_basis:
  chem: none
  mat: static
  mech: plain
  death: false
  gate:
  hill: 4.0
  drive:
  rho_gated: 0.1
  grid: 4 chemistry x 2 material x 2 mechanics, + a death twin of each Route A base
  why: chemistry=none, material=static, mechanics=plain -- one cell of the basis grid written by make_basis.py; every value not on an axis is shared with the other fifteen.
