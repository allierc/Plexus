general:
  name: promo_apopgeo_half_B
  seed: 0
  n_frames: 600
  dt: 1.0
  record_cap: 602
  record_every: 1
  boundary: free
  dim: 3
  world:
    - 80.0
    - 80.0
    - 80.0
_run:
  target_cells: 4000
  seed_cells: 400
sets:
  vertex:
    n: 8000
    mesh: half_edge
    cell_set: cell
  cell:
    n: 4000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
seed:
  - op: mesh_seed
    at: vertex
    cell_set: cell
    n_cells: 400
    seed: 0
    vseed_cv: 0.15
    radius: 5.0
    jitter: 0.15
    p0: 3.5
operators:
  - op: cell_geometry
    at: cell
  - op: cell_die
    at: vertex
    cell_set: cell
    p0: 3.5
    shrink_rate: 0.05
    critical_frac: 0.15
    min_age: 0
    mode: band
    band_deg: 45.0
    n_bands: 1
  - op: cell_mechanics
    at: vertex
    K_A: 1.0
    K_P: 1.0
    K_V: 20.0
    K_R: 0.0
    Lambda: 0.5
    Gamma: 0.4
    p0: 3.5
    mu: 1.0
    dt: 1.0
    relax_iters: 30
    eta: 0.08
    cap_frac: 0.12
  - op: edge_flip
    at: vertex
    l_th_frac: 0.28
    every: 1
    max_flips: 300
  - op: topo_record
    at: vertex
    every: 1
schedule:
  - cell_geometry
  - cell_die
  - cell_mechanics
  - edge_flip
  - topo_record
_apopgeo:
  geometry: half
  selector:
    mode: band
    band_deg: 45.0
    n_bands: 1
  why: death is the only mechanism in this composition, so the cell count can only fall and n_apop must equal 400 - cells_final exactly
