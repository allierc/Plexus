general:
  name: b_star_death
  seed: 0
  n_frames: 1800
  dt: 1.0
  record_cap: 1802
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
_run:
  target_cells: 60000
  seed_cells: 2000
sets:
  vertex:
    n: 120000
  cell:
    n: 60000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: mesh_seed
  at: vertex
  cell_set: cell
  before_frame: 1
  n_cells: 2000
  seed: 0
  vseed_cv: 0.15
  radius: 5.0
  jitter: 0.15
  p0: 3.5
- op: cell_geometry
  at: cell
- op: cell_neighbours
  at: cell
- op: cell_chem_seed
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.06
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.046
  kk: 0.062
  rate: 0.5
- op: cell_chem_from_shape
  at: cell
  model: curvature
  vertex_set: vertex
  beta: 0.5
  F0: 0.046
  rate: 1.0
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.000866
  a_sw: 0.35
  hill: 4.0
  rho: 0.1
  vth_frac: 2.5
  after_frame: 100
  conserve_amount: false
- op: cell_die
  at: vertex
  cell_set: cell
  p0: 3.5
  mode: competition
  max_mark_frac: 0.005
  min_age: 4
  shrink_rate: 0.05
  critical_frac: 0.15
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 80.0
  K_R: 0.0
  Lambda: 0.5
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
  K_bend: 0.02
  K_lumen: 0.5
- op: interface_tension
  at: vertex
  cell_set: cell
  K_purse: 1.0
  a_sw: 0.6
- op: cell_divide
  at: vertex
  cell_set: cell
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  every: 4
  engine_clock: true
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_neighbours
- cell_chem_seed
- cell_chem_diffuse
- cell_chem_react
- cell_chem_from_shape
- cell_grow
- cell_die
- cell_mechanics
- interface_tension
- cell_divide
- edge_flip
- topo_record
_basis:
  chem: gs
  mat: gated
  mech: shaping
  death: true
  gate: soft
  hill: 4.0
  drive: lo
  rho_gated: 0.1
  grid: 4 chemistry x 2 material x 2 mechanics, + a death twin of each Route A base
  why: chemistry=gs, material=gated, mechanics=shaping -- one cell of the basis grid
    written by make_basis.py; every value not on an axis is shared with the other
    fifteen.
