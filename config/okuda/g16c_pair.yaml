general:
  name: g16c_pair
  seed: 0
  n_frames: 600
  dt: 1.0
  record_cap: 602
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
_run:
  target_cells: 4000
  seed_cells: 400
sets:
  vertex:
    n: 8000
  cell:
    n: 4000
    state:
      chem:
        width: 4
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: mesh_seed
  at: vertex
  cell_set: cell
  before_frame: 1
  n_cells: 400
  seed: 0
  vseed_cv: 0.15
  radius: 5.0
  jitter: 0.15
  p0: 3.5
- op: cell_geometry
  at: cell
- op: cell_chem_seed
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.12
  chan: 0
- op: cell_chem_seed
  at: cell
  seed: 7
  before_frame: 3
  mode: scatter
  seed_frac: 0.12
  chan: 2
- op: cell_neighbours
  at: cell
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  chan: 0
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  chan: 2
  d_a: 0.08
  d_h: 0.16
  chi: 0.4
- op: cell_chem_react
  at: cell
  model: gray_scott
  chan: 0
  rate: 1.0
  F: 0.046
  kk: 0.062
- op: cell_chem_react
  at: cell
  model: gray_scott
  chan: 2
  rate: 1.0
  F: 0.039
  kk: 0.058
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 20.0
  K_R: 0.0
  Lambda: 0.5
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_chem_seed
- cell_chem_seed
- cell_neighbours
- cell_chem_diffuse
- cell_chem_diffuse
- cell_chem_react
- cell_chem_react
- cell_mechanics
- edge_flip
- topo_record
_gate:
  gate: G16c
  predicted_spacing_chan0: 6.99
  predicted_spacing_chan2: 3.18
  tolerance: 0.2
  A:
    chi: 1.3
    d_a: 0.08
    d_h: 0.16
    F: 0.046
    kk: 0.062
  B:
    chi: 0.4
    d_a: 0.08
    d_h: 0.16
    F: 0.039
    kk: 0.058
  why: each wavelength was measured ALONE. Two species share one mesh, one buffer
    and one dt, and a stability limit is a property of the pair -- so keeping their
    separate wavelengths together is a claim that has to be measured, not assumed
