general:
  name: ref_uniform_inflation
  seed: 0
  n_frames: 350
  dt: 0.02
  record_cap: 352
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
sets:
  vertex:
    n: 30000
  cell:
    n: 16000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: seed_mesh_3d
  at: vertex
  cell_set: cell
  n_cells: 500
  vseed_cv: 0.15
- op: shape_energy_3d
  at: vertex
  p0: 3.7
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.12
  Lambda: 0.08
  K_V: 6.0
  K_R: 0.02
  K_bend: 0.0
  antiinv: 0.0
  mu: 1.0
  dt: 0.02
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: reconnect_t1_3d
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: divide_3d
  at: vertex
  factor: 2.0
  reset_noise: 0.12
  cycle_cv: 0.15
  p0: 3.9
  every: 1
  max_div: 120
  max_div_frac: 0.03
  vcap: 1.8
  cell_set: cell
  min_cycle: 8
  max_cycle: 12
  after_frame: 100
  orient_iface: false
  orient_asw: 1.2
  g1_ramp: false
- op: topo_snapshot_3d
  at: vertex
  every: 1
- op: vesicle_growth
  at: vertex
  cell_set: cell
  rate: 0.006
  dt: 0.02
schedule:
- seed_mesh_3d
- shape_energy_3d
- reconnect_t1_3d
- divide_3d
- topo_snapshot_3d
- vesicle_growth
_discovery:
  comp_hash: C6a07112cc06
  structure:
    operators:
    - id: divide_3d0
      op: divide_3d
      impl: hertwig
    - id: reconnect_t1_3d0
      op: reconnect_t1_3d
    - id: seed_mesh_3d0
      op: seed_mesh_3d
    - id: shape_energy_3d0
      op: shape_energy_3d
      impl: default
    - id: vesicle_growth0
      op: vesicle_growth
    connections: []
  region: uniform inflation (no patterning)
  defect_fixes:
  - D1 engine owns the clock (every=1)
  - D2 one global dt=0.02
  - D3 topo_snapshot every=1 == position stride
