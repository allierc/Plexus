general:
  name: stage_buds_web_seed2
  seed: 774113
  n_frames: 3000
  dt: 1.0
  record_cap: 3002
  record_every: 1
  boundary: free
  dim: 3
  world:
    - 80.0
    - 80.0
    - 80.0
_run:
  target_cells: 50000
  seed_cells: 2000
sets:
  vertex:
    n: 130004
    mesh: half_edge
    cell_set: cell
  cell:
    n: 65004
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
  - op: mesh_seed
    at: vertex
    cell_set: cell
    n_cells: 2000
    radius: 5.0
    jitter: 0.15
    seed: 774113
    vseed_cv: 0.15
  - op: cell_geometry
    at: cell
  - op: cell_chem_seed
    at: cell
    n_spots: 1
    cone_deg: 8.0
    seed: 774113
    model: cones
  - op: cell_neighbours
    at: cell
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.08
    d_h: 0.16
    chi: 1.3
    before_frame: 900
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.32
    d_h: 0.16
    chi: 1.3
    after_frame: 900
  - op: cell_chem_react
    at: cell
    model: gray_scott
    rate: 0.5
    F: 0.023
    kk: 0.062
  - op: cell_chem_from_shape
    at: cell
    model: curvature
    vertex_set: vertex
    beta: 0.5
    F0: 0.046
    rate: 1.0
  - op: cell_shape_probe
    at: cell
    vertex_set: vertex
    model: shape_index
    field: elong
  - op: cell_grow
    at: vertex
    cell_set: cell
    rate: 0.001732
    a_sw: 0.35
    hill: 8.0
    rho: 0.1
    vth_frac: 2.5
    after_frame: 400
    conserve_amount: true
  - op: cell_mechanics
    at: vertex
    p0: 3.5
    K_A: 1.0
    K_P: 1.0
    Gamma: 0.4
    Lambda: 0.5
    K_V: 40.0
    K_R: 0.0
    K_bend: 0.0
    K_lumen: 0.0
    antiinv: 0.0
    mu: 1.0
    dt: 1.0
    relax_iters: 30
    eta: 0.08
    cap_frac: 0.12
  - op: interface_tension
    at: vertex
    cell_set: cell
    K_purse: 1.0
    a_sw: 0.6
    eta: 0.05
    iters: 4
    after_frame: 400
  - op: edge_flip
    at: vertex
    l_th_frac: 1.9600000000000002
    every: 1
    max_flips: 300
  - op: cell_divide
    at: vertex
    factor: 2.0
    reset_noise: 0.12
    cycle_cv: 0.15
    p0: 3.9
    every: 1
    cell_set: cell
    min_cycle: 16
    max_cycle: 1000000000
    after_frame: 400
    orient_iface: false
    orient_asw: 0.6
    g1_ramp: false
  - op: topo_record
    at: vertex
    every: 1
schedule:
  - mesh_seed
  - cell_geometry
  - cell_chem_seed
  - cell_neighbours
  - cell_chem_diffuse
  - cell_chem_diffuse
  - cell_chem_react
  - cell_chem_from_shape
  - cell_shape_probe
  - cell_grow
  - cell_mechanics
  - interface_tension
  - edge_flip
  - cell_divide
  - topo_record
_discovery:
  comp_hash: C1f31794c6e7
  structure:
    operators:
      - id: cell_chem_diffuse0
        op: cell_chem_diffuse
        impl: graph_laplacian
      - id: cell_chem_diffuse1
        op: cell_chem_diffuse
        impl: graph_laplacian
      - id: cell_chem_from_shape0
        op: cell_chem_from_shape
        impl: curvature
      - id: cell_chem_react0
        op: cell_chem_react
        impl: gray_scott
      - id: cell_chem_seed0
        op: cell_chem_seed
        impl: cone
      - id: cell_divide0
        op: cell_divide
        impl: hertwig
      - id: cell_geometry0
        op: cell_geometry
      - id: cell_grow0
        op: cell_grow
        impl: hill_conserve_amount
      - id: cell_mechanics0
        op: cell_mechanics
        impl: default
      - id: cell_neighbours0
        op: cell_neighbours
      - id: cell_shape_probe0
        op: cell_shape_probe
        impl: shape_index
      - id: edge_flip0
        op: edge_flip
      - id: interface_tension0
        op: interface_tension
      - id: mesh_seed0
        op: mesh_seed
    connections:
      - src_op: cell_chem_react
        dst_op: cell_grow
        slot: gate
      - src_op: cell_chem_react
        dst_op: interface_tension
        slot: site
  region: emergent RD + purse-string
  defect_fixes:
    - D1 engine owns the clock (every=1)
    - D2 one global dt=1.0
    - D3 topo_snapshot every=1 == position stride
