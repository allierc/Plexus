general:
  name: round40_mc8
  seed: 0
  n_frames: 900
  dt: 1.0
  record_cap: 902
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
_run:
  target_cells: 20000
  seed_cells: 500
sets:
  vertex:
    n: 16196
  cell:
    n: 8100
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: seed_mesh_3d
  at: vertex
  cell_set: cell
  before_frame: 1
  n_cells: 500
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry_3d
  at: cell
- op: seed_cell_rd
  at: cell
  mode: tip
  n_spots: 1
  amp: 2.0
  tip_radius: 2.0
  seed: 0
- op: cell_adjacency
  at: cell
- op: grow_3d
  at: vertex
  cell_set: cell
  rate: 0.001733
  a_sw: 1.5
  hill: 4.0
  rho: 0.0
  vth_frac: 2.5
  after_frame: 100
  dt: 1.0
  conserve_amount: true
- op: shape_energy_3d
  at: vertex
  p0: 3.9
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.05
  Lambda: 0.2
  K_V: 6.0
  K_R: 0.02
  K_bend: 0.0
  antiinv: 0.0
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: rd_interface_tension
  at: vertex
  cell_set: cell
  K_purse: 0.0
  K_extrude: 4.0
  a_sw: 0.5
  eta: 0.05
  iters: 4
  after_frame: 100
- op: reconnect_t1_3d
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: divide_3d
  at: vertex
  factor: 2.0
  reset_noise: 0.12
  cycle_cv: 0.4
  p0: 3.9
  every: 1
  cell_set: cell
  min_cycle: 16
  max_cycle: 1000000000
  after_frame: 100
  orient_iface: true
  orient_asw: 1.0
  g1_ramp: false
- op: topo_snapshot_3d
  at: vertex
  every: 1
schedule:
- seed_mesh_3d
- cell_geometry_3d
- seed_cell_rd
- cell_adjacency
- grow_3d
- shape_energy_3d
- rd_interface_tension
- reconnect_t1_3d
- divide_3d
- topo_snapshot_3d
