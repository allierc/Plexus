general:
  name: wk_apical_area_pos_s0
  seed: 0
  n_frames: 400
  dt: 1.0
  record_cap: 402
  boundary: free
  dim: 3
  world:
    - 50.0
    - 50.0
    - 50.0
sets:
  vertex:
    n: 4996
  cell:
    n: 2500
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
  - op: mesh_seed
    at: vertex
    cell_set: cell
    n_cells: 150
    radius: 5.0
    jitter: 0.18
    p0: 3.5
    seed: 0
    vseed_cv: 0.15
  - op: cell_geometry
    at: cell
  - op: cell_neighbours
    at: cell
  - op: cell_chem_seed
    at: cell
    seed: 0
    mode: scatter
    seed_frac: 0.06
  - op: cell_chem_diffuse
    at: cell
    d_a: 0.08
    d_h: 0.16
    chi: 1.3
  - op: cell_chem_react
    at: cell
    model: gray_scott
    F: 0.046
    kk: 0.062
    rate: 1.0
  - op: cell_chem_from_shape
    at: cell
    model: apical_area
    vertex_set: vertex
    beta: 1.5
    F0: 0.046
    rate: 1.0
  - op: cell_grow
    at: vertex
    cell_set: cell
    rate: 0.003466
    a_sw: 0.25
    hill: 4.0
    rho: 0.35
    vth_frac: 2.5
    conserve_amount: false
  - op: cell_mechanics
    at: vertex
    p0: 3.5
    K_A: 1.0
    K_P: 1.0
    Gamma: 0.4
    Lambda: 3.0
    K_V: 2.0
    K_R: 0.4
    mu: 1.0
    dt: 1.0
    relax_iters: 60
    eta: 0.08
    cap_frac: 0.12
  - op: edge_flip
    at: vertex
    l_th_frac: 0.35
    every: 4
    max_flips: 30
    engine_clock: true
  - op: cell_divide
    at: vertex
    factor: 2.0
    reset_noise: 0.12
    cycle_cv: 0.15
    p0: 3.5
    every: 4
    cell_set: cell
    min_cycle: 4
    max_cycle: 1000000000
    engine_clock: true
  - op: topo_record
    at: vertex
    every: 1
schedule:
  - mesh_seed
  - cell_geometry
  - cell_neighbours
  - cell_chem_seed
  - cell_chem_diffuse
  - cell_chem_react
  - cell_chem_from_shape
  - cell_grow
  - cell_mechanics
  - edge_flip
  - cell_divide
  - topo_record
_discovery:
  comp_hash: WK_wk_apical_area_pos_s0
  region: shape->chemistry feedback
