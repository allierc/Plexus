general:
  name: r002_15
  seed: 0
  n_frames: 900
  dt: 1.0
  record_cap: 802
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
_run:
  target_cells: 50000
  seed_cells: 2000
sets:
  vertex:
    n: 260004
  cell:
    n: 130004
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: mesh_seed
  at: vertex
  cell_set: cell
  before_frame: 1
  n_cells: 2000
  seed: 0
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_neighbours
  at: cell
- op: cell_chem_seed
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.06
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.046
  kk: 0.062
  rate: 1.0
- op: cell_chem_from_shape
  at: cell
  model: curvature
  vertex_set: vertex
  beta: 0.5
  F0: 0.046
  rate: 1.0
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.000866
  a_sw: 0.35
  hill: 4.0
  rho: 0.1
  vth_frac: 3.5
  after_frame: 100
  dt: 1.0
  conserve_amount: true
- op: cell_mechanics
  model: monolayer
  at: vertex
  k_v: 6.0
  kappa_s: 0.2
  h0: 0.4
  gamma: 0.06
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: cell_divide
  at: vertex
  cell_set: cell
  factor: 2.0
  cycle_cv: 0.15
  min_cycle: 4
  max_cycle: 1000000000
  p0: 3.5
  reset_noise: 0.12
  every: 4
  engine_clock: true
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_neighbours
- cell_chem_seed
- cell_chem_diffuse
- cell_chem_react
- cell_chem_from_shape
- cell_grow
- cell_mechanics
- cell_divide
- edge_flip
- topo_record
_discovery:
  comp_hash: Ca230941a0b1
  structure:
    operators:
    - id: cell_adjacency0
      op: cell_neighbours
    - id: cell_diffuse0
      op: cell_chem_diffuse
      impl: graph_laplacian
    - id: cell_geometry_3d0
      op: cell_geometry
    - id: cell_react0
      op: cell_chem_react
      impl: gierer_meinhardt
    - id: grow_3d0
      op: cell_grow
      impl: hill_conserve_amount
    - id: reconnect_t1_3d0
      op: edge_flip
    - id: seed_mesh_3d0
      op: mesh_seed
    - id: shape_energy_3d0
      op: cell_mechanics
      impl: monolayer
    - id: shape_to_chem0
      op: cell_chem_from_shape
      impl: curvature
    connections:
    - src_op: cell_chem_react
      dst_op: cell_grow
      slot: gate
  region: coral chemistry + growth gate + CURVATURE FEEDBACK + cell division -- the
    bump emerges where activity and curvature coincide
  defect_fixes:
  - D1 engine owns the clock (every=1)
  - D2 one global dt=1.0
  - D3 topo_snapshot every=1 == position stride
  why: 'coral_gate is the NULL of this experiment and the docstring of cell_chem_from_shape
    says so: `beta = 0 is the null and must be run. Without it, "shape feeds back"
    is asserted, not tested.` coral_gate carries cell_chem_from_shape:curvature with beta
    0.0 -- the second arrow of Okuda''s coupling present and zeroed. This turns it
    on. F_j = F0 * (1 + beta * curvature_hat), so beta > 0 makes a bulging cell feed
    FASTER: curvature raises the feed, the feed raises the activator, the activator
    opens the growth gate, and growth raises curvature. A bump therefore needs BOTH
    -- activity and curvature -- and neither alone closes the loop. Cell division
    is added so the bump can be built from new cells rather than only by stretching
    the ones already there, which is what Okuda''s tissue does and what P7 refuses
    when it is absent.'
