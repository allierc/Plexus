general:
  name: p1_ph_coral_fixed_ball
  seed: 0
  n_frames: 500
  dt: 0.02
  record_cap: 502
  record_every: 1
  boundary: free
  dim: 3
  world:
    - 80.0
    - 80.0
    - 80.0
sets:
  vertex:
    n: 30000
  cell:
    n: 16000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
  - op: mesh_seed
    at: vertex
    cell_set: cell
    n_cells: 2000
    vseed_cv: 0.15
  - op: cell_geometry
    at: cell
  - op: cell_chem_seed
    at: cell
    mode: scatter
    seed_frac: 0.06
  - op: cell_neighbours
    at: cell
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.08
    d_h: 0.16
    chi: 65.0
  - op: cell_chem_react
    at: cell
    model: gray_scott
    rate: 50.0
    F: 0.055
    kk: 0.062
  - op: cell_mechanics
    model: monolayer
    at: vertex
    k_v: 6.0
    kappa_s: 0.2
    h0: 0.4
    gamma: 0.06
    mu: 1.0
    dt: 0.02
    relax_iters: 30
    eta: 0.08
    cap_frac: 0.12
  - op: edge_flip
    at: vertex
    l_th_frac: 0.28
    every: 1
    max_flips: 300
  - op: topo_record
    at: vertex
    every: 1
schedule:
  - mesh_seed
  - cell_geometry
  - cell_chem_seed
  - cell_neighbours
  - cell_chem_diffuse
  - cell_chem_react
  - cell_mechanics
  - edge_flip
  - topo_record
_discovery:
  comp_hash: C08666c8bf72
  structure:
    operators:
      - id: cell_adjacency0
        op: cell_neighbours
      - id: cell_diffuse0
        op: cell_chem_diffuse
        impl: graph_laplacian
      - id: cell_geometry_3d0
        op: cell_geometry
      - id: seed_cell_rd0
        op: cell_chem_seed
        impl: scatter
      - id: cell_react0
        op: cell_chem_react
        impl: gray_scott
      - id: reconnect_t1_3d0
        op: edge_flip
      - id: seed_mesh_3d0
        op: mesh_seed
      - id: shape_energy_3d0
        op: cell_mechanics
        impl: monolayer
    connections: []
  region: mechanics-only (no growth)
  defect_fixes:
    - D1 engine owns the clock (every=1)
    - D2 one global dt=0.02
    - D3 topo_snapshot every=1 == position stride
