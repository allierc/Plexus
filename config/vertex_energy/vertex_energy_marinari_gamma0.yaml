general:
  name: vertex_energy_marinari_gamma0
  seed: 0
  n_frames: 300
  dt: 1.0
  record_cap: 302
  boundary: free
  dim: 3
  world:
    - 14.0
    - 14.0
    - 14.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  cell:
    n: 12800
    state:
      area:
        width: 1
      centroid:
        width: 3
      chem:
        width: 2
        integration: first_order
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
  vertex:
    n: 25584
    mesh: half_edge
  half_edge:
    n: 102400
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
seed:
  - op: mesh_seed
    at: vertex
    n_cells: 200
    radius: 4.55
    jitter: 0.8
    p0: 3.5
    seed: 0
    vseed_cv: 0.0
operators:
  - op: cell_geometry
    at: cell
  - op: cell_mechanics
    at: vertex
    model: marinari
    K: 160.0
    Lambda: 56.8
    Gamma: 0.0
    crowding: 1.0
    K_V: 2.0
    K_R: 0.0
    p0: 3.5
    mu: 1.0
    relax_iters: 1
    eta: 0.02
    cap_frac: 0.015
  - op: edge_flip
    at: vertex
    every: 4
    engine_clock: true
    l_th_frac: 0.35
    max_flips: 30
  - op: topo_record
    at: vertex
    every: 1
schedule:
  - cell_geometry
  - cell_mechanics
  - edge_flip
  - topo_record

plotting:
  renderer: vtk_points
  background: black
  real_time: false
  fps: 20
  movie_max_frames: 300
  mesh_edges: true
  curve:
    - quantity: area
      ticks: 4
    - quantity: radius
      ticks: 4
