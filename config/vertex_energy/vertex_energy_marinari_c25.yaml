general:
  name: vertex_energy_marinari_c25
  seed: 0
  n_frames: 300
  dt: 1.0
  record_cap: 302
  boundary: free
  dim: 3
  world:
  - 14.0
  - 14.0
  - 14.0
  units:
    length_um: 10.0
    time_s: 600.0
plotting:
  renderer: vtk_points
  background: black
  real_time: false
  fps: 20
  movie_max_frames: 300
  mesh_edges: true
  curve:
  - quantity: area
    ticks: 4
  - quantity: radius
    ticks: 4
sets:
  vertex:
    n: 25584
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12800
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
fields: {}
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 200
  radius: 4.55
  jitter: 0.8
  p0: 3.5
  seed: 0
  vseed_cv: 0.0
- op: cell_geometry
  at: cell
- op: cell_mechanics
  at: vertex
  p0: 3.5
  mu: 1.0
  relax_iters: 1
  eta: 0.02
  cap_frac: 0.015
  K_V: 2.0
  K_R: 0.0
  model: marinari
  K: 160.0
  Lambda: 56.8
  Gamma: 12.475
  crowding: 1.0
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_mechanics
- edge_flip
- topo_record
descriptions:
  movie:
    description: A large spherical cluster of particles is shown within a cubic bounding
      box. Over the course of the simulation, the cluster undergoes a slight contraction
      in its overall radius. The internal structure of the sphere remains relatively
      stable, with the polygonal facets shifting slightly. By the final frame, the
      sphere has reached a steady state with a constant radius and stable internal
      geometry.
    objects: The primary object is a large, beige-colored sphere composed of many
      smaller polygonal facets. This sphere is centered within a transparent, wireframe
      cubic bounding box. A scale bar in the bottom left corner indicates a length
      of 25 micrometers. Two line graphs on the right side track the evolution of
      the sphere's area and radius over 300 frames.
