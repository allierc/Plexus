general:
  title: 'An epithelial sheet: 400 cells of different sizes'
  name: exp01_v6
  seed: 0
  n_frames: 400
  dt: 1.0
  record_cap: 402
  boundary: free
  dim: 3
  world: [24.0, 24.0, 24.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 8000
    state:
      area: {width: 1}
      centroid: {width: 3}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      apop_flag: {width: 1}
      inhib_frac: {width: 1}
  vertex:
    n: 20000
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
  half_edge:
    n: 64000
    maps: {srce: vertex, trgt: vertex, face: cell}
fields: {}
seed:
- {op: seed_mesh, at: vertex, shape: disc, n_cells: 400, radius: 5.0, jitter: 0.15, p0: 3.878, seed: 0,
  vseed_cv: 0.15, age_seed: 25.0, a0_scale: {axis: x, values: [2.0, 1.0]}}
operators:
- {op: cell_geometry, at: cell}
- {op: topo_record, at: vertex, every: 1}
- {op: cell_mechanics, at: vertex, K_A: 0.1, K_P: 0.1, K_V: 20.0, K_R: 0.0, Lambda: 0.0, Gamma: 0.0, p0: 3.878,
  mu: 1.0, relax_iters: 12, eta: 0.08, cap_frac: 0.03, K_bend: 0.0, K_lumen: 0.0, plane_axis: 2}
schedule: [cell_geometry, cell_mechanics, topo_record]
plotting:
  renderer: vtk_points
  background: black
  duration_s: 10
  slow_motion: 1
  up_axis: 2
  box_frame: false
  camera: {elev: 90.0, azim: -90.0}
  camera_turns: 0.0
  camera_zoom: 0.0
  fps: 30
  real_time: false
  mesh_color: '#ffffff'
  mesh_style: surface
  mesh_edges: true
  mesh_mark_division: true
  mesh_apop_color: '#0099ff'
  zoom: 1.8
  scale_bar_corner: right
  scale_bar_um: 20
  curve:
  - {quantity: cells, xlabel: frame, ylabel: cells, ticks: 4}
  - {quantity: area, xlabel: frame, ylabel: cell area, ticks: 4}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a cluster of cells that maintains a constant total count of 374
      throughout the duration. Over time, the individual cells undergo a gradual expansion in their average
      surface area. This growth is accompanied by a slight increase in the standard deviation of the cell
      areas. The overall circular shape of the cluster remains stable while internal structural changes
      occur.
    objects: The scene contains a large, circular cluster composed of hundreds of individual polygonal
      cells. These cells are white with black outlines, creating a tessellated pattern that fills the
      circular boundary. Each cell is roughly hexagonal or pentagonal in shape, varying slightly in size
      and orientation. A scale bar at the bottom indicates that the entire cluster has a diameter of approximately
      100 micrometers.
