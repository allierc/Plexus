descriptions:
  movie:
    description: The simulation shows a static scene where three blue cylindrical
      objects are positioned in the center of a large black cube. There is no visible
      movement or evolution of the objects or the environment across the frames. The
      spatial configuration remains constant throughout the entire duration of the
      sequence. The scene represents a fixed snapshot of a computational mesh or physical
      model.
    objects: The scene contains three light blue cylindrical objects clustered together
      in the center. These objects are arranged in a tight group, with two appearing
      to be slightly behind the third. Each cylinder is small in scale relative to
      the large bounding box, which measures 100 $\mu$m on each side. The cylinders
      have a uniform blue color and a smooth, solid surface appearance.

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a cluster of three blue rectangular blocks situated in the center
      of a large black cubic domain. Over the course of the video, the blocks remain stationary and do
      not change their relative positions or shapes. The surrounding environment remains static, with
      no movement of the bounding box or the scale bar. The entire scene is constant throughout the time
      sequence.
    objects: The scene contains three light blue rectangular blocks clustered together in the center.
      These blocks are arranged in a tight group, with two blocks in the front and one slightly behind
      them. Each block is small relative to the overall 100 $\mu$m cubic domain. The blocks have a uniform
      blue color and sharp, well-defined edges.
