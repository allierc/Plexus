general:
  title: 'An epithelial sheet: 400 cells of different sizes'
  name: exp01_v8
  seed: 0
  n_frames: 400
  dt: 1.0
  record_cap: 402
  boundary: free
  dim: 3
  world: [24.0, 24.0, 24.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 8000
    state:
      area: {width: 1}
      centroid: {width: 3}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      apop_flag: {width: 1}
      inhib_frac: {width: 1}
  vertex:
    n: 20000
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
  half_edge:
    n: 64000
    maps: {srce: vertex, trgt: vertex, face: cell}
fields: {}
seed:
- {op: seed_mesh, at: vertex, shape: disc, n_cells: 400, radius: 5.0, jitter: 0.15, p0: 3.722, seed: 0,
  vseed_cv: 0.15, age_seed: 25.0, a0_scale: {axis: x, values: [2.0, 1.0]}}
operators:
- {op: cell_geometry, at: cell}
- {op: topo_record, at: vertex, every: 1}
- {op: cell_mechanics, at: vertex, K_A: 1.0, K_P: 0.1, K_V: 20.0, K_R: 0.0, Lambda: 0.0, Gamma: 0.0, p0: 3.722,
  mu: 1.0, relax_iters: 12, eta: 0.08, cap_frac: 0.03, K_bend: 0.0, K_lumen: 0.0, plane_axis: 2}
schedule: [cell_geometry, cell_mechanics, topo_record]
plotting:
  renderer: vtk_points
  background: black
  duration_s: 10
  slow_motion: 1
  up_axis: 2
  box_frame: false
  camera: {elev: 90.0, azim: -90.0}
  camera_turns: 0.0
  camera_zoom: 0.0
  fps: 30
  real_time: false
  mesh_color: '#ffffff'
  mesh_style: surface
  mesh_edges: true
  mesh_mark_division: true
  mesh_apop_color: '#0099ff'
  zoom: 1.8
  scale_bar_corner: right
  scale_bar_um: 20
  curve:
  - {quantity: cells, xlabel: frame, ylabel: cells, ticks: 4}
  - {quantity: area, xlabel: frame, ylabel: cell area, ticks: 4}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a collection of cells undergoing a structural reorganization over
      time. Initially, the cells are arranged in a somewhat irregular, mixed pattern of shapes. As the
      frames progress, the cells transition into a more uniform hexagonal tiling. By the final frames,
      the cells have achieved a highly ordered, honeycomb-like structure across the entire area.
    objects: The scene contains a large cluster of white, polygonal cells arranged in a circular formation.
      These cells are interconnected at their edges to form a continuous, tessellated surface. Each individual
      cell is small, with an average area that slightly increases as the simulation progresses. The overall
      structure maintains a consistent size while the internal geometry becomes more regular.
