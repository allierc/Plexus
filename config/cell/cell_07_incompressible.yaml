descriptions:
  movie:
    description: The simulation shows a spherical cell structure undergoing a significant
      morphological deformation over time. Initially, the cell is perfectly spherical
      and centered within the domain. As the simulation progresses, the bottom portion
      of the cell begins to flatten and expand outward. By the final frames, the cell
      has transformed into a flattened, asymmetrical shape with a distinct indentation
      on the upper side.
    objects: The scene contains three distinct types of particles representing different
      cellular components. Yellow particles form a dense, central spherical cluster
      representing the nucleus. Blue particles are distributed throughout the interior
      of the cell, representing the cytosol. Red particles form a thick outer shell
      or membrane surrounding the blue and yellow components.

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: A spherical cell-like structure initially sits in the center of a cubic domain. Over
      time, the sphere moves downward and toward the right side of the bounding box. As it moves, the
      internal structure undergoes a significant deformation, flattening against the bottom surface. The
      cross-sectional view shows the internal nucleus shifting and the cytoplasm compressing as the cell
      settles.
    objects: The scene contains a large spherical body composed of many small blue particles. Inside this
      body is a smaller, dense cluster of yellow particles representing a nucleus. The blue particles
      are arranged in a thick outer membrane and a lighter inner cytosol. The entire system is contained
      within a large, transparent white wireframe cube.
