general:
  title: 'exp 2 v1: slide 13 exactly'
  name: exp02_v1
  seed: 0
  n_frames: 400
  dt: 1.0
  record_cap: 402
  boundary: free
  dim: 3
  world: [24.0, 24.0, 24.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 8000
    state:
      area: {width: 1}
      centroid: {width: 3}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      apop_flag: {width: 1}
      inhib_frac: {width: 1}
  vertex:
    n: 20000
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
  half_edge:
    n: 64000
    maps: {srce: vertex, trgt: vertex, face: cell}
fields: {}
seed:
- {op: seed_mesh, at: vertex, shape: disc, n_cells: 400, radius: 5.0, jitter: 0.7, p0: 3.878, seed: 0,
  vseed_cv: 0.15, age_seed: 25.0}
operators:
- {op: cell_geometry, at: cell}
- {op: cell_mechanics, at: vertex, K_A: 0.1, K_P: 0.1, K_V: 20.0, K_R: 0.0, Lambda: 0.0, Gamma: 0.0, p0: 3.878,
  mu: 1.0, relax_iters: 3, eta: 0.08, cap_frac: 0.12, K_bend: 0.0, K_lumen: 0.0, plane_axis: 2}
- {op: edge_flip, at: vertex, l_th_frac: 0.28, every: 1, max_flips: 300}
- {op: topo_record, at: vertex, every: 1}
schedule: [cell_geometry, cell_mechanics, edge_flip, topo_record]
plotting:
  renderer: vtk_points
  background: black
  duration_s: 10
  slow_motion: 1
  up_axis: 2
  box_frame: false
  camera: {elev: 90.0, azim: -90.0}
  camera_turns: 0.0
  camera_zoom: 0.0
  fps: 30
  real_time: false
  mesh_color: '#ffffff'
  mesh_style: surface
  mesh_edges: true
  mesh_mark_division: true
  mesh_apop_color: '#0099ff'
  zoom: 1.33
  scale_bar_corner: right
  scale_bar_um: 20
  curve:
  - {quantity: cells, xlabel: frame, ylabel: cells, ticks: 4}
  - {quantity: area, xlabel: frame, ylabel: cell area, ticks: 4}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a stable cluster of cells that maintains a consistent circular shape
      throughout the time sequence. The number of cells remains constant at 372, and the average cell
      area stays nearly identical across all frames. The horizontal bar in the bottom-right graph expands
      to the right, indicating the progression of time from frame 0 to 401. There is no observable movement,
      growth, or structural change in the cell cluster over the duration of the video.
    objects: The scene contains a large, circular cluster composed of many individual polygonal cells.
      These cells are white with thin black outlines, creating a tessellated pattern similar to a honeycomb.
      Each individual cell is small, with an average area of approximately 18.8 square micrometers. The
      entire cluster is centered in a large black void, with a 20 micrometer scale bar provided for size
      reference.
