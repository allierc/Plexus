general:
  name: morph_column
  seed: 0
  n_frames: 30
  dt: 0.002
  record_cap: 60
  boundary: wall
  dim: 3
  world:
  - 0.35
  - 0.35
  - 0.35
  units:
    length_um: 100.0
sets:
  mpm_particle:
    n: 6000
    types:
      cyto:
        fraction: 1.0
        youngs: 90.0
        density: 1.0
        block:
        - 0.12
        - 0.12
        - 0.12
        - 0.22999999999999998
        - 0.22999999999999998
        - 0.22999999999999998
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 40
operators:
- op: deform_control
  at: mpm_particle
  rate:
  - -11.83586
  - 12.06236
  - -11.8989
  - -0.42219
  - 0.01807
  - 0.45631
  over: 10
- op: mpm_strain
  at: mpm_particle
  implementation: default
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.5
  a_max: 200.0
  implementation: default
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: default
schedule:
- deform_control
- substep_dt: 0.00025
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  box_frame: true
  render_3d: points
  dot_size: 1.6
  fps: 30
  slow_motion: 2

