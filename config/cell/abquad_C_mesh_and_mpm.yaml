descriptions:
  movie:
    description: The simulation shows a pair of cyan-colored objects located in the
      center of a large black cubic domain. These objects appear to be stationary
      or moving very slowly within the 100 $\mu$m box. The internal structure of the
      objects shows a speckled, multi-colored pattern of yellow and green. The overall
      scene remains static throughout the short time interval shown.
    objects: There are two primary objects positioned side-by-side in the center of
      the frame. They are cyan in color with internal yellow and green speckles. Each
      object is approximately 25 $\mu$m in size, as indicated by the scale bar. They
      are contained within a large, transparent wireframe cube representing a 100
      $\mu$m domain.

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: Two small, blue-colored clusters are positioned in the center of a large, black cubic
      domain. Over time, these clusters remain relatively stationary while the simulation progresses.
      The surrounding space is empty, with no other visible particles or fields moving. The simulation
      concludes with the clusters maintaining their initial shape and position.
    objects: The scene contains two distinct, rounded clusters located in the center of a large cube.
      These clusters are primarily light blue with some darker blue and white speckles. Each cluster is
      approximately 10-15 micrometers in diameter, based on the 25 micrometer scale bar. The clusters
      are positioned side-by-side, nearly touching each other in the middle of the domain.
