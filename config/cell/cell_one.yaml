general:
  name: cell_one
  seed: 0
  n_frames: 4000
  record_cap: 602
  dt: 0.0028
  dim: 3
  boundary: wall
  world:
  - 1.0
  - 1.0
  - 1.0
sets:
  cell:
    n: 1
    spawn: point
    types:
      c:
        fraction: 1.0
        youngs: 40
    state:
      pos:
        width: 3
        integration: none
        boundary: free
  cytosol:
    parent: cell
    per_parent: 12000
    radius: 0.16
    density: 1.0
    types:
      light:
        fraction: 0.5
        youngs: 15
        material: liquid
        density: 0.6
      heavy:
        fraction: 0.5
        youngs: 15
        material: liquid
        density: 1.8
  nucleus:
    parent: cell
    per_parent: 1500
    radius: 0.055
    density: 2.6
    types:
      n:
        fraction: 1.0
        youngs: 300
        material: elastic
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 96
operators:
- op: gravity
  at: cell
  g: 4.0
- op: mpm_strain
  at: cytosol
- op: mpm_strain
  at: nucleus
- op: mpm_scatter
  at: cytosol
  to: mpm_grid
  drag: 0.02
  a_max: 200
- op: mpm_scatter
  at: nucleus
  to: mpm_grid
  drag: 0.02
  a_max: 200
- op: mpm_grid_update
  at: mpm_grid
  surface_tension: 60.0
  wall_damp: 1.0
  buoyancy: 4.0
  rho_ref: 1.2
- op: mpm_gather
  at: cytosol
  from: mpm_grid
  wall_damp: 1.0
  wall_contact: 0.04
- op: mpm_gather
  at: nucleus
  from: mpm_grid
  wall_damp: 1.0
  wall_contact: 0.04
schedule:
- gravity
- mpm_strain
- mpm_strain
- mpm_scatter
- mpm_scatter
- mpm_grid_update
- mpm_gather
- mpm_gather
plotting:
  background: black
  cutaway:
  - x
  up_axis: 1
  camera_elev: 1.18
  camera_zoom: 0.0
  camera_turns: 0.0
  box_frame: true
  hide_sets:
  - cell
  render_3d: dots
  dot_size: 1.2
  splat_size: 2.6
  splat_res: 560
  panels: true
  panels_thick: 0.1
