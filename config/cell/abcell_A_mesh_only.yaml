descriptions:
  movie:
    description: The simulation shows a spherical cluster of particles centered within
      a large cubic domain. Over the course of the video, the particles exhibit high-frequency
      oscillations and internal movements while maintaining a stable overall spherical
      shape. The surrounding environment remains static, with no significant changes
      to the boundary or the background. The simulation concludes with the cluster
      remaining in its central position without expanding or dispersing.
    objects: A large, transparent cube defines the simulation domain with a side length
      of 100 $\mu$m. At the center of this cube is a spherical cluster of particles
      with a diameter of approximately 25 $\mu$m. The particles within the sphere
      are colored in shades of green, red, and blue, arranged in a dense, radiating
      pattern. A white scale bar in the bottom-left corner indicates a length of 25
      $\mu$m for spatial reference.

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The video shows a static 3D simulation of a single cylindrical object centered within
      a large cubic domain. There is no movement or evolution of the object or the surrounding field over
      the duration of the sequence. The scene remains perfectly still, representing a single frame of
      a computational fluid dynamics or structural analysis. The visual output provides a snapshot of
      the mesh and geometry setup for the simulation.
    objects: A single light blue cylinder is positioned in the center of the scene. The cylinder is oriented
      vertically and appears to have a uniform diameter and height. It is contained within a large, black
      cubic bounding box that represents the simulation domain. A white scale bar in the bottom left corner
      indicates a length of 25 micrometers.
