  splat_size: 2.6
  splat_res: 560
  panels: true
  panels_thick: 0.1

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: A spherical cluster of particles initially suspended in a 3D domain begins to move downward
      toward the bottom boundary. As it descends, the outer blue layer deforms and stretches, eventually
      flattening against the floor. The inner yellow core remains relatively compact but becomes increasingly
      compressed as the outer layer spreads out. By the final frames, the structure has transitioned from
      a sphere to a flattened, pancake-like shape resting on the surface.
    objects: 'The scene contains two distinct sets of particles: a large outer shell and a smaller inner
      core. The outer shell consists of numerous small blue particles arranged in a spherical topology
      that gradually flattens. The inner core is composed of smaller yellow particles clustered tightly
      together in a central spherical arrangement. Both sets of particles are contained within a large,
      transparent cubic domain defined by white wireframe edges.'
