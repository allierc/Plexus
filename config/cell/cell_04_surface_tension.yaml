general:
  name: cell_04_surface_tension
  seed: 0
  n_frames: 1500
  record_cap: 602
  dt: 0.0015
  dim: 3
  boundary: wall
  world:
  - 1.0
  - 1.0
  - 1.0
sets:
  cell:
    n: 1
    types:
      c:
        fraction: 1.0
        youngs: 40
    state:
      pos:
        width: 3
        integration: none
        boundary: free
    start:
    - - 0.5
      - 0.5
      - 0.72
  nucleus:
    parent: cell
    per_parent: 1500
    radius: 0.055
    density: 2.6
    types:
      n:
        fraction: 1.0
        youngs: 300
        material: elastic
  cytosol:
    parent: cell
    per_parent: 12000
    radius: 0.16
    radius_inner: 0.065
    density: 1.0
    types:
      light:
        fraction: 0.5
        youngs: 15
        material: liquid
        density: 0.6
      heavy:
        fraction: 0.5
        youngs: 15
        material: liquid
        density: 1.8
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 96
operators:
- op: aggregate
  at: cell
- op: gravity
  at: cell
  gy: 0.0
  gz: -9.0
- op: mpm_strain
  at: nucleus
- op: mpm_strain
  at: cytosol
- op: mpm_scatter
  at: nucleus
  to: mpm_grid
  drag: 0.02
  a_max: 200
- op: mpm_scatter
  at: cytosol
  to: mpm_grid
  drag: 0.02
  a_max: 200
- op: mpm_grid_update
  at: mpm_grid
  surface_tension: 1000.0
  wall_damp: 1.0
- op: mpm_gather
  at: nucleus
  from: mpm_grid
  wall_damp: 1.0
  wall_contact: 0.04
- op: mpm_gather
  at: cytosol
  from: mpm_grid
  wall_damp: 1.0
  wall_contact: 0.04
schedule:
- aggregate
- gravity
- substep_dt: 0.0001
  steps:
  - mpm_strain
  - mpm_strain
  - mpm_scatter
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
  - mpm_gather
plotting:
  background: black
  colors:
    light:
    - 0.25
    - 0.69
    - 1.0
    heavy:
    - 0.12
    - 0.31
    - 0.66
    n:
    - 1.0
    - 0.82
    - 0.29
    m:
    - 0.95
    - 0.35
    - 0.45
  fps: 30
  movie_max_frames: 600
  up_axis: 2
  camera_elev: 1.18
  camera_zoom: 0.0
  camera_turns: 0.0
  box_frame: true
