descriptions:
  movie:
    description: The simulation shows a multi-colored, textured object resting on
      the bottom surface of a large cubic domain. Over the course of the video, the
      object remains stationary in its position while its internal colors and patterns
      shift slightly. The surrounding environment is a dark, empty void defined by
      a white wireframe cube. No external forces or large-scale movements occur within
      the 100 $\mu$m box.
    objects: A single, flattened, dome-shaped object sits at the center of the bottom
      plane. It features a complex internal texture with a mix of cyan, green, red,
      and yellow colors. The object is relatively small, measuring approximately 25
      $\mu$m in width according to the provided scale bar. The scene is enclosed within
      a large, white wireframe cube representing a 100 $\mu$m simulation box.

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a dense cluster of fibers or filaments located at the bottom of
      a large cubic domain. Over the course of the video, the internal structure of this cluster undergoes
      subtle morphological changes and internal rearrangements. The surrounding space remains empty, indicating
      that the activity is localized to the bottom surface. The overall shape of the cluster remains relatively
      stable while the individual filaments shift slightly.
    objects: The primary objects are a collection of thin, hair-like filaments clustered together in a
      mound. These filaments exhibit a multi-colored appearance, primarily featuring shades of green,
      yellow, and red. They are arranged in a dense, tangled topology that forms a roughly hemispherical
      shape on the floor of the cube. The entire cluster is small relative to the domain, occupying a
      space much smaller than the 100 $\mu$m cube.
