general:
  name: probe_free_P100
  seed: 0
  n_frames: 200
  record_cap: 41
  dt: 0.0015
  dim: 3
  boundary: wall
  world: [1.0, 1.0, 1.0]
sets:
  cell:
    n: 1
    types:
      c: {fraction: 1.0, youngs: 40}
    state:
      pos: {width: 3, integration: none, boundary: free}
    start: [[0.5, 0.5, 0.5]]
  cytosol:
    parent: cell
    per_parent: 12000
    radius: 0.16
    density: 1.0
    types:
      light: {fraction: 1.0, youngs: 400, material: liquid, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 96}
operators:
  - {op: aggregate, at: cell}
  - {op: gravity, at: cell, gy: 0.0, gz: 0.0}
  - {op: mpm_turgor, at: cytosol, pressure: 100.0}
  - {op: mpm_strain, at: cytosol}
  - {op: mpm_scatter, at: cytosol, to: mpm_grid, drag: 0.02, a_max: 200}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 1.0}
  - {op: mpm_gather, at: cytosol, from: mpm_grid, wall_damp: 1.0, wall_contact: 0.04}
schedule:
  - aggregate
  - gravity
  - mpm_turgor
  - substep_dt: 0.0001
    steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]
plotting: {background: black, fps: 30, up_axis: 2, render_3d: dots}
