general:
  title: 'An epithelial sheet: 400 cells of different sizes'
  name: exp01_v1
  seed: 0
  n_frames: 400
  dt: 1.0
  record_cap: 402
  boundary: free
  dim: 3
  world: [24.0, 24.0, 24.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 8000
    state:
      area: {width: 1}
      centroid: {width: 3}
      A0: {width: 1}
      P0: {width: 1}
      V0f: {width: 1}
      alive: {width: 1, record: false}
      age: {width: 1}
      ndiv: {width: 1}
      Vbirth: {width: 1, record: false}
      divjit: {width: 1, record: false}
      mg_scale: {width: 1, record: false}
      A0_init: {width: 1, record: false}
      P0_init: {width: 1, record: false}
      V0f_init: {width: 1, record: false}
      apop_flag: {width: 1}
      inhib_frac: {width: 1}
  vertex:
    n: 20000
    mesh: half_edge
    state:
      pos: {width: 3, role: coordinate, integration: second_order_coordinate, boundary: world}
      vel: {width: 3, role: rate, integration: second_order_rate, record: false}
  half_edge:
    n: 64000
    maps: {srce: vertex, trgt: vertex, face: cell}
fields: {}
seed:
- {op: seed_mesh, at: vertex, shape: disc, n_cells: 400, radius: 5.0, jitter: 0.7, p0: 3.878, seed: 0,
  vseed_cv: 0.15, age_seed: 25.0}
operators:
- {op: cell_geometry, at: cell}
- {op: topo_record, at: vertex, every: 1}
schedule: [cell_geometry, topo_record]
plotting:
  renderer: vtk_points
  background: black
  duration_s: 10
  slow_motion: 1
  up_axis: 2
  box_frame: false
  camera: {elev: 90.0, azim: -90.0}
  camera_turns: 0.0
  camera_zoom: 0.0
  fps: 30
  real_time: false
  mesh_color: '#ffffff'
  mesh_style: surface
  mesh_edges: true
  mesh_mark_division: true
  mesh_apop_color: '#0099ff'
  zoom: 1.33
  scale_bar_corner: right
  scale_bar_um: 20
  curve:
  - {quantity: cells, xlabel: frame, ylabel: cells, ticks: 4}
  - {quantity: area, xlabel: frame, ylabel: cell area, ticks: 4}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a stable cluster of cells that maintains a constant count of 372
      throughout the sequence. The average cell area remains steady at approximately 18.9 square micrometers
      across all frames. There is no visible movement or structural reorganization of the cluster over
      the 401 frames. The overall shape of the aggregate remains circular and compact during the entire
      observation period.
    objects: The scene contains a large, circular cluster composed of many individual polygonal cells.
      These cells are white with black outlines, creating a mosaic-like appearance. Each cell is roughly
      uniform in size, fitting together in a dense, packed arrangement. The entire cluster is centered
      in a large black void, with a 20 micrometer scale bar provided for reference.
