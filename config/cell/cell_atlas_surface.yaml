general:
  name: cell_atlas_surface
  seed: 0
  n_frames: 800
  dt: 0.002
  boundary: wall
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  save_data: false
  units:
    length_um: 100.0
sets:
  cell:
    n: 1
    start:
    - - 0.5
      - 0.8
      - 0.5
  compartment:
    parent: cell
    per_parent: 1104
    radius: 0.1
    types:
      plasma_membrane:
        count: 421
        youngs: 1500.0
        density: 1.0
        material: elastic
      cytoskeleton:
        count: 400
        youngs: 600.0
        density: 1.0
        material: elastic
      nucleus:
        count: 138
        youngs: 200.0
        density: 1.1
        material: elastic
      chromatin:
        count: 31
        youngs: 45.0
        density: 1.2
        material: elastic
      nucleolus:
        count: 2
        youngs: 120.0
        density: 1.3
        material: elastic
      rough_er:
        count: 11
        youngs: 70.0
        density: 1.0
        material: elastic
      smooth_er:
        count: 3
        youngs: 60.0
        density: 1.0
        material: elastic
      golgi:
        count: 14
        youngs: 65.0
        density: 1.0
        material: elastic
      mitochondria:
        count: 77
        youngs: 110.0
        density: 1.1
        material: elastic
      centriole:
        count: 2
        youngs: 700.0
        density: 1.1
        material: elastic
      protein_a:
        count: 1
        youngs: 40.0
        density: 0.6
        material: elastic
      protein_b:
        count: 1
        youngs: 40.0
        density: 0.6
        material: elastic
      protein_c:
        count: 1
        youngs: 40.0
        density: 0.6
        material: elastic
      protein_d:
        count: 1
        youngs: 40.0
        density: 0.6
        material: elastic
      protein_e:
        count: 1
        youngs: 40.0
        density: 0.6
        material: elastic
  mpm_particle:
    parent: compartment
    per_parent:
      plasma_membrane: 200
      cytoskeleton: 500
      nucleus: 4000
      chromatin: 1000
      nucleolus: 1000
      rough_er: 10000
      smooth_er: 10000
      golgi: 1000
      mitochondria: 1000
      centriole: 1000
      protein_a: 100000
      protein_b: 100000
      protein_c: 100000
      protein_d: 100000
      protein_e: 100000
    radius: 0.02
    density: 1.0
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 256
seed:
- op: seed_cell_atlas
  at: compartment
  particles: mpm_particle
  cell_radius: 0.1
  seed: 0
  geometry:
    plasma_membrane:
      thickness: 0.07
operators:
- op: gravity
  at: cell
  g: 1.5
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 1.0
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 1.0
  vmax: 1.0e9
  implementation: warp
- op: aggregate_centroid
  at: compartment
  child: mpm_particle
- op: aggregate_centroid
  at: cell
  child: compartment
schedule:
- gravity
- substep_dt: 3.5e-05
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
- aggregate_centroid
- aggregate_centroid
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  box_frame: true
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  render_3d: compartments
  dot_size: 1.2
  fps: 60
  slow_motion: 2
  hide_sets:
  - cell
  - compartment
  colors:
    plasma_membrane:
    - 0.62
    - 0.82
    - 0.96
    cytoskeleton:
    - 0.3
    - 0.85
    - 0.4
    nucleus:
