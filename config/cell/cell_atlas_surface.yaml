    - 0.82
  surface_smooth: 24
  surface_blur: 1.1
  surface_spacing: 0.0035
  surface_sample: 60000
  surface_max_cells: 60000000
  surface:
    plasma_membrane:
      spacing: 0.005
      blur: 1.4
      smooth: 50
    nucleus:
      spacing: 0.0045
      blur: 1.4
      smooth: 50
    cytoskeleton:
      render: dots
      point_size: 1.1
    chromatin:
      render: dots
      point_size: 1.4
    smooth_er:
      render: dots
      point_size: 1.3
    rough_er:
      spacing: 0.0018
