# lorenz attractor -- Lorenz (1963) convection: THE butterfly, two spiralling lobes.
# A dense `cloud` is seeded in a tiny cube inside the basin; the `attractor_flow`
# operator rides every point along dx/dt = f(x) and the chaos unfolds the seed into
# the attractor. `boundary: free` -> open space (the flow is bounded by its dissipation).
general:
  name: lorenz
  seed: 0
  n_frames: 10000
  dt: 0.004
  boundary: free
  dim: 3
  world: [50.0, 50.0, 50.0]
  record_cap: 800
sets:
  cloud:
    n: 60000
    start: [0.6, 0.6, 14.6, 1.4, 1.4, 15.4]
    types:
      c: {fraction: 1.0}
fields: {}
operators:
- {op: attractor_flow, at: cloud, system: lorenz, sigma: 10.0, rho: 28.0, beta: 2.6666667}
schedule: [attractor_flow]
plotting:
  renderer: vtk_points
  background: black
  colors:
    c: [0.24, 1.0, 0.42]
  splat_size: 1.15
  splat_res: 820
  movie_max_frames: 700
  fps: 30
  camera_zoom: 0.25
  camera_azim: 0.4
  camera_elev: 0.95
  camera_elev_end: 1.4
  camera_turns: 0.08
