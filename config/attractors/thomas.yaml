# thomas attractor -- Thomas' cyclically-symmetric attractor: a woven cage of interlinked loops.
# A dense `cloud` is seeded in a tiny cube inside the basin; the `attractor_flow`
# operator rides every point along dx/dt = f(x) and the chaos unfolds the seed into
# the attractor. `boundary: free` -> open space (the flow is bounded by its dissipation).
general:
  name: thomas
  seed: 0
  n_frames: 15000
  dt: 0.02
  boundary: free
  dim: 3
  world: [12.0, 12.0, 12.0]
  record_cap: 800
sets:
  cloud:
    n: 60000
    start: [0.35, 0.15, -0.05, 0.85, 0.65, 0.45]
    types:
      c: {fraction: 1.0}
fields: {}
operators:
- {op: attractor_flow, at: cloud, system: thomas, b: 0.208}
schedule: [attractor_flow]
plotting:
  renderer: vtk_points
  background: black
  colors:
    c: [0.72, 0.45, 1.0]
  splat_size: 1.15
  splat_res: 820
  movie_max_frames: 700
  fps: 30
  camera_zoom: 0.25
  camera_azim: 0.5
  camera_elev: 0.7
  camera_elev_end: 1.2
  camera_turns: 0.5
