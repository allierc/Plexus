# rossler attractor -- Rossler (1976): the iconic spiral-and-fold.
# A dense `cloud` is seeded in a tiny cube inside the basin; the `attractor_flow`
# operator rides every point along dx/dt = f(x) and the chaos unfolds the seed into
# the attractor. `boundary: free` -> open space (the flow is bounded by its dissipation).
general:
  name: rossler
  seed: 0
  n_frames: 14000
  dt: 0.015
  boundary: free
  dim: 3
  world: [30.0, 30.0, 50.0]
  record_cap: 800
sets:
  cloud:
    n: 60000
    start: [0.7, 0.7, -0.3, 1.3, 1.3, 0.3]
    types:
      c: {fraction: 1.0}
fields: {}
operators:
- {op: attractor_flow, at: cloud, system: rossler, a: 0.2, b: 0.2, c: 5.7}
schedule: [attractor_flow]
plotting:
  renderer: vtk_points
  background: black
  colors:
    c: [1.0, 0.82, 0.28]
  splat_size: 1.15
  splat_res: 820
  movie_max_frames: 700
  fps: 30
  camera_zoom: 0.25
  camera_azim: 0.3
  camera_elev: 0.5
  camera_elev_end: 1.15
  camera_turns: 0.1

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: A cluster of yellow particles begins as a small, dense point in the center of a 3D bounding
      box. Over time, the particles expand and begin to rotate, forming a large, sweeping arc that stretches
      vertically. As the simulation progresses, the structure twists and flattens into a complex, multi-layered
      spiral shape. In the final frames, the particles stretch into elongated, orbital paths that wrap
      around the central axis.
    objects: The primary objects are 60,000 individual yellow particles that represent a dynamic fluid
      or particle system. These particles are initially clustered together in a tight, spherical topology
      before evolving into a large, curved sheet. The particles maintain a consistent small size throughout
      the simulation, though their collective arrangement changes from a point to a complex spiral. The
      entire system is contained within a large, white wireframe cube that provides a spatial reference
      for the motion.
