# aizawa attractor -- a torus with an axial spike drilling through a sphere.
# A dense `cloud` is seeded in a tiny cube inside the basin; the `attractor_flow`
# operator rides every point along dx/dt = f(x) and the chaos unfolds the seed into
# the attractor. `boundary: free` -> open space (the flow is bounded by its dissipation).
general:
  name: aizawa
  seed: 0
  n_frames: 10000
  dt: 0.008
  boundary: free
  dim: 3
  world: [4.0, 4.0, 4.0]
  record_cap: 800
sets:
  cloud:
    n: 60000
    start: [-0.15, -0.25, -0.25, 0.35, 0.25, 0.25]
    types:
      c: {fraction: 1.0}
fields: {}
operators:
- {op: attractor_flow, at: cloud, system: aizawa, a: 0.95, b: 0.7, c: 0.6, d: 3.5, e: 0.25, f: 0.1}
schedule: [attractor_flow]
plotting:
  renderer: vtk_points
  background: black
  colors:
    c: [0.55, 0.85, 1.0]
  splat_size: 1.15
  splat_res: 820
  movie_max_frames: 700
  fps: 30
  camera_zoom: 0.25
  camera_azim: 0.4
  camera_elev: 0.9
  camera_elev_end: 1.3
  camera_turns: 0.4
