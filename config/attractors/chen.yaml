# chen attractor -- Chen (1999): a denser, more twisted double-scroll (a Lorenz cousin).
# A dense `cloud` is seeded in a tiny cube inside the basin; the `attractor_flow`
# operator rides every point along dx/dt = f(x) and the chaos unfolds the seed into
# the attractor. `boundary: free` -> open space (the flow is bounded by its dissipation).
general:
  name: chen
  seed: 0
  n_frames: 15000
  dt: 0.002
  boundary: free
  dim: 3
  world: [60.0, 60.0, 60.0]
  record_cap: 800
sets:
  cloud:
    n: 60000
    start: [0.6, 0.6, 19.6, 1.4, 1.4, 20.4]
    types:
      c: {fraction: 1.0}
fields: {}
operators:
- {op: attractor_flow, at: cloud, system: chen, a: 35.0, b: 3.0, c: 28.0}
schedule: [attractor_flow]
plotting:
  renderer: vtk_points
  background: black
  colors:
    c: [0.2, 0.92, 0.78]
  splat_size: 1.15
  splat_res: 820
  movie_max_frames: 700
  fps: 30
  camera_zoom: 0.25
  camera_azim: 0.4
  camera_elev: 0.95
  camera_elev_end: 1.4
  camera_turns: 0.1

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: A small cluster of cyan particles begins as a concentrated point near the center of a
      3D bounding box. As time progresses, the particles rapidly expand and organize into a complex, symmetrical
      double-lobed structure. The structure maintains a stable, intertwined shape while the surrounding
      cloud of particles becomes more diffuse. By the final frames, the system reaches a steady state
      where the central core remains clearly defined against a faint background of scattered points.
    objects: The primary objects are thousands of tiny cyan particles that form a dense, interconnected
      web. These particles are arranged in a symmetrical, butterfly-like topology with two distinct lobes
      connected at a central point. The size of individual particles is extremely small, appearing as
      single pixels or dots within the larger volume. A secondary set of much fainter, scattered cyan
      points forms a sparse cloud surrounding the main structure.
