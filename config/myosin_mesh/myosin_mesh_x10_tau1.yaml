general:
  name: myosin_mesh_x10_tau1
  seed: 0
  n_frames: 500
  dt: 1.0
  record_cap: 804
  boundary: free
  dim: 3
  world:
    - 50.0
    - 50.0
    - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
sets:
  cell:
    n: 12800
    state:
      area:
        width: 1
      centroid:
        width: 3
      chem:
        width: 2
        integration: first_order
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      inhib_frac:
        width: 1
    types:
      soft:
        fraction: 0.5
        myo_drive: 1.0
      tense:
        fraction: 0.5
        myo_drive: 10.0
  vertex:
    n: 25584
    mesh: half_edge
  half_edge:
    n: 102400
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
seed:
  - op: mesh_seed
    at: vertex
    n_cells: 200
    radius: 5.0
    jitter: 0.18
    p0: 3.5
    seed: 0
    vseed_cv: 0.15
    type_layout: split_z
operators:
  - op: cell_geometry
    at: cell
  - op: cell_grow
    at: vertex
    rate: 0.003457
    rho: 1.0
    a_sw: 50.0
    hill: 4.0
    vth_frac: 2.5
  - op: junction_myosin
    at: vertex
    activity: 1.0
    tau: 1.0
    beta: 1.0
    myo_new: 1.0
    dt: 1.0
    inherit: true
    keyed_on: tension
    destabilising: true
    k_perim: 1.0
    lam: 3.0
    gam: 0.0
    activity_from: myo_drive
  - op: cell_mechanics
    at: vertex
    K_A: 1.0
    K_P: 1.0
    K_V: 2.0
    K_R: 0.4
    Lambda: 3.0
    Gamma: 0.4
    p0: 3.5
    mu: 1.0
    dt: 1.0
    relax_iters: 30
    eta: 0.08
    cap_frac: 0.12
  - op: edge_flip
    at: vertex
    every: 4
    engine_clock: true
    l_th_frac: 0.35
    max_flips: 30
  - op: cell_divide
    at: vertex
    every: 4
    engine_clock: true
    factor: 2.0
    cycle_cv: 0.15
    min_cycle: 4
    max_cycle: 1000000000
    p0: 3.5
    reset_noise: 0.12
  - op: junction_sync
    at: vertex
    myo_new: 1.0
    inherit: true
  - op: topo_record
    at: vertex
    every: 1
schedule:
  - cell_geometry
  - cell_grow
  - junction_myosin
  - cell_mechanics
  - edge_flip
  - cell_divide
  - junction_sync
  - topo_record

plotting:
  renderer: vtk_points
  background: black
  edge_color: type
  edge_width: 3.0
  colors:
    soft:
      - 0.35
      - 0.6
      - 1.0
    tense:
      - 1.0
      - 0.35
      - 0.25
  curve:
    - quantity: myosin
      ymin: 0.0
      ymax: 6.0
      ticks: 4
    - quantity: cells
      ymin: 0.0
      ymax: 1000.0
      ticks: 4
  real_time: false
  fps: 20
  movie_max_frames: 200
  zoom: 2
