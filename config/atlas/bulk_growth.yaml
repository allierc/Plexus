# bulk_growth -- a FILLED spheroid of cells, grown from 20, opened with a cutaway.
#
# NOT AN EPITHELIUM. The `cutaway_growth*` series is a closed vertex SURFACE seen from inside; this
# is a solid aggregate -- cells packed through the volume, the way an organoid or a tumour spheroid
# is. The difference is not cosmetic: a surface has an inside and an outside and grows by adding
# area, while a filled body grows by adding cells anywhere and the interior is where the
# interesting question lives (does it stay packed, does it hollow, does the core stall).
#
# TWENTY LIVE CELLS IN A FORTY-THOUSAND SLOT POOL. `n` is the initially LIVE count and `buffer` is
# the allocation, so the run starts as a 20-cell clump and `agent_divide` wakes dormant slots as
# cells proliferate. Starting small is the point: a spheroid grown from 20 develops its own
# packing, where one seeded at 4,000 inherits whatever the spawn distribution happened to be.
#
# THE MECHANICS ARE PAIRWISE, NOT A VERTEX MODEL. `attraction_repulsion` over a `radius_graph` is
# short-range repulsion (volume exclusion -- two cells cannot occupy one place) plus longer-range
# attraction (cohesion -- the aggregate holds together instead of dispersing). That is the minimum
# that makes a packed 3D body, and it needs no mesh, which is what lets the population change
# freely: a vertex model would have to retopologise on every division.
#
# RENDERED WITH A QUADRANT REMOVED. A filled body is opaque, so the live view of a solid spheroid
# is a featureless ball whatever is happening inside it. `cutaway: [x, y]` drops the cells whose
# centroid-relative position is positive in both axes -- the cut is taken against the CLOUD'S OWN
# centroid, not the world origin, because a growing aggregate drifts and a fixed cut would slide
# off the body.
general:
  name: bulk_growth
  seed: 0
  n_frames: 4000
  record_cap: 602
  dt: 1.0
  dim: 3
  boundary: free
  world: [1.0, 1.0, 1.0]
sets:
  cell:
    n: 20
    buffer: 40000
    # ONE TYPE, AND ITS `p` IS THE WHOLE MECHANICS. The law is
    #     f = p0*exp(-(r^2)^p1 / sigma^2)  -  p2*exp(-(r^2)^p3 / sigma^2)
    # with the displacement applied along (neighbour - self), so POSITIVE f pulls together and
    # negative pushes apart. Two conditions make a packed cohesive body rather than a collapsed
    # point or a gas: p2 > p0, so the net force AT CONTACT (where both exponentials are 1) is
    # repulsive and cells cannot occupy the same place; and p3 > p1, so the repulsion decays
    # FASTER with distance than the attraction and the force turns positive further out, which is
    # what holds the aggregate together. 1.8 > 1.0 and 1.9 > 0.7.
    types:
      cell:
        fraction: 1.0
        p: [1.0, 0.7, 1.8, 1.9]
    spawn: ball
    spawn_radius: 0.02
    state:
      pos: {width: 3, integration: first_order, boundary: free}
fields: {}
operators:
# `radius` sets who feels whom. At the seeded spacing (20 cells in a 0.02 ball) neighbours sit
# ~0.01 apart; 0.03 takes the first couple of shells, which is what a contact-range law wants.
- {op: radius_graph, at: cell, radius: 0.03}
# sigma is the repulsion core -- the distance below which two cells push apart. Set to roughly the
# cell spacing so the packing is one-cell-per-place rather than a collapsed point.
- {op: attraction_repulsion, at: cell, sigma: 0.012}
# `rate` is per-tick per-cell. 0.004 doubles the population about every 175 ticks, so 4,000 frames
# is ~20 doublings of headroom against a 40,000 ceiling that `max_occ` stops at.
- {op: agent_divide, at: cell, rate: 0.004, offset: 0.004, max_occ: 0.95}
schedule: [radius_graph, attraction_repulsion, agent_divide]
plotting:
  background: black
  cutaway: [x, y]
  dot_fill: 0.9
