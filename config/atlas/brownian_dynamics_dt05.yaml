# `agitate` pure Brownian bath, Plexus side, dt = 0.5 (80 frames): same total time T = 40 as the
# dt=1.0 spec. Half the step size, double the steps -- D must be UNCHANGED iff the noise carries the
# Wiener sqrt(dt) displacement scaling. See config/atlas/brownian_dynamics.yaml for the full note.
general:
  name: brownian_dynamics_dt05
  seed: 0
  n_frames: 80
  dt: 0.5
  boundary: free
  dim: 2
  world: [40.0, 40.0]

sets:
  cell:
    n: 20000
    buffer: 20000
    start: [[20.0, 20.0]]
    state:
      pos: { width: 2 }

fields: {}

operators:
  - { op: agitate, at: cell, kT: 0.1, gamma: 1.0 }

schedule: [agitate]

plotting:
  background: black
  point_size: 3.0
