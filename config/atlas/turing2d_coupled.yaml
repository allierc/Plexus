# turing2d_coupled -- `turing2d_two` AND NOTHING ELSE BUT THE COUPLING.
#
# It is generated from that file, so the two systems, their diffusivities, chi, the seeds and the
# layout are identical by construction and the ONLY difference is gamma. That is what makes the
# pair a controlled comparison rather than two runs that happen to look different.
#
# THREE WRONG DIAGNOSES GOT IT HERE, all recorded because each was a plausible story that the data
# refused. (1) "gamma 1.0 is too strong" -- true, the cross term exceeded the whole autocatalysis,
# but lowering it to 0.2 changed nothing. (2) "one 4-wide seeder starves system B of substrate" --
# also true, column 3 got a small random field instead of u=1, and fixing it still left B dead.
# (3) The actual cause: the file had been forked from `turing2d_disc_chi4`, so it ran at chi 4.0
# where `turing2d_two` runs at 1.3. B's reaction point (F 0.026 / kk 0.055) needs a short
# activator range, and at chi 4.0 d*chi reaches 0.640 -- past what an explicit Euler step on a
# Laplacian with eigenvalues in [-2,0] survives once the reaction is added. It went non-finite.
#
# The lesson is the generation, not the number: a variant that is supposed to differ in ONE
# parameter should be DERIVED from its control, not rebuilt beside it.
#
# THE REGRESSION TEST IS gamma = 0, which must reproduce `turing2d_two` bit for bit -- verified
# already for the 3D pair, where a coupled instance at gamma 0 matched two independent
# `gray_scott` instances exactly.
general:
  name: turing2d_coupled
  seed: 0
  n_frames: 6000
  record_cap: 602
  dt: 1.0
  dim: 2
  boundary: free
  world:
    - 49.4
    - 49.4
sets:
  cell:
    n: 4000
    spawn: sunflower
    spawn_radius: 19.0
    state:
      pos:
        width: 2
        integration: none
        boundary: free
      chem:
        width: 4
        integration: first_order
        boundary: free
fields: {}
seed:
  - op: cell_chem_seed
    at: cell
    seed: 0
    mode: scatter
    seed_frac: 0.12
    chan: 0
  - op: cell_chem_seed
    at: cell
    seed: 2
    mode: scatter
    seed_frac: 0.12
    chan: 2
operators:
  - op: radius_graph
    at: cell
    radius: 0.95
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.08
    d_h: 0.16
    chi: 1.3
    chan: 0
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.03
    d_h: 0.16
    chi: 1.3
    chan: 2
  - op: cell_chem_react
    at: cell
    model: gray_scott_coupled
    chan: 0
    F: 0.046
    kk: 0.062
    F2: 0.026
    kk2: 0.055
    gamma: 0.2
    rate: 1.0
schedule:
  - radius_graph
  - cell_chem_diffuse
  - cell_chem_diffuse
  - cell_chem_react
plotting:
  renderer: mpl2d
  background: black
  dot_fill: 0.9
