# THE WORKING POINT IS ParticleGraph's, MEASURED NOT GUESSED: d = 0.02, chi = 1.0, rate 0.05,
# a = 0.6, 4,000 frames. Two things carried it. The initial condition must sit ON the simplex --
# `init_mesh` case 'RD_Mesh' does rand(n,3) then divides by the row sum, so u+v+w = 1 exactly --
# because the logistic factor is (1 - p - a*rival) and starting at p = 0.175 leaves 0.83 of net
# growth for everyone, so the run climbs to the simplex instead of competing on it. And the
# diffusion must be small: at an effective 0.13 every domain merged into one disc-spanning wave
# (sd 0.012 / 0.112 / 0.131); at 0.02 the domains drop below the disc and spirals appear
# (sd 0.354 / 0.395 / 0.371). d = 0.05 works too, so the result is not knife-edge -- the IC was
# the parameter that mattered.
general:
  name: turing2d_rps
  seed: 0
  n_frames: 4000
  record_cap: 602
  dt: 1.0
  dim: 2
  boundary: free
  world:
    - 49.4
    - 49.4
sets:
  cell:
    n: 4000
    spawn: sunflower
    spawn_radius: 19.0
    state:
      pos:
        width: 2
        integration: none
        boundary: free
      chem:
        width: 3
        integration: first_order
        boundary: free
fields: {}
seed:
  - op: cell_chem_seed
    at: cell
    seed: 0
    mode: simplex
    n_species: 3
operators:
  - op: radius_graph
    at: cell
    radius: 0.95
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    chi: 1.0
    d:
      - 0.02
      - 0.02
      - 0.02
  - op: cell_chem_react
    at: cell
    model: rock_paper_scissor
    a: 0.6
    rate: 0.05
schedule:
  - radius_graph
  - cell_chem_diffuse
  - cell_chem_react
plotting:
  renderer: mpl2d
  background: black
  dot_fill: 0.9
  blend: additive
  species:
    - '#ff0000'
    - '#00ff00'
    - '#0000ff'
