# turing2d_gs_coupled_beta -- `turing2d_two_beta` WITH the cross term. The coupled twin of the independent run.
#
# Derived from `turing2d_coupled`, with system B moved to Pearson's beta point (0.026, 0.051) --
# the same point `turing2d_two_beta` runs it at independently and `turing2d_gs_beta` runs it
# at alone. Three specs, one reaction point, three degrees of company:
#
#     turing2d_gs_beta      B's motif by itself
#     turing2d_two_beta     B's motif sharing the cells with A, no chemistry between them
#     turing2d_gs_coupled_beta   B's motif with A actively suppressing its activator
#
# so the difference between the first two is competition for SPACE and between the last two is
# competition for CHEMISTRY. Neither is separable from a single run.
#
# gamma is 0.2. At the equilibrium the uncoupled pair settles into, the autocatalysis u*a^2 is
# about 0.020 and gamma*a1*a2 is about 0.029*gamma, so this puts the cross term near 30% of growth
# -- enough to exclude, not enough to sterilise. At gamma 1.0 both systems went extinct by frame
# 600, which is the measurement that set this number.
# SYSTEM B DIFFUSES AT PEARSON'S RATIO, d = [0.08, 0.16] -- the same as system A. It used to
# inherit turing2d_two's B, where d_a is 0.03 so the two systems differ in SCALE; that puts B's
# ratio at 0.16/0.03 = 5.3, and Pearson's (F, k) labels only name distinct motifs at Du/Dv = 2.
# Measured: at 5.3 the six points gave ONE field at six amplitudes -- species B correlated 0.86 to
# 0.95 between eta, kappa, lambda and theta. The diffusion length was setting the pattern and the
# reaction point was decorating it. At ratio 2 the labels mean what they say, and B then differs
# from A in (F, kk) ALONE, which is what a regime sweep is supposed to vary.
general:
  name: turing2d_gs_coupled_beta
  seed: 0
  n_frames: 6000
  record_cap: 602
  dt: 1.0
  dim: 2
  boundary: free
  world:
  - 49.4
  - 49.4
sets:
  cell:
    n: 4000
    spawn: sunflower
    spawn_radius: 19.0
    state:
      pos:
        width: 2
        integration: none
        boundary: free
      chem:
        width: 4
        integration: first_order
        boundary: free
fields: {}
operators:
- op: cell_chem_seed
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.12
  chan: 0
- op: cell_chem_seed
  at: cell
  seed: 2
  before_frame: 3
  mode: scatter
  seed_frac: 0.12
  chan: 2
- op: radius_graph
  at: cell
  radius: 0.95
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
  chan: 0
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
  chan: 2
- op: cell_chem_react
  at: cell
  model: gray_scott_coupled
  chan: 0
  F: 0.046
  kk: 0.062
  F2: 0.026
  kk2: 0.051
  gamma: 0.2
  rate: 1.0
schedule:
- cell_chem_seed
- cell_chem_seed
- radius_graph
- cell_chem_diffuse
- cell_chem_diffuse
- cell_chem_react
plotting:
  background: black
  dot_fill: 0.9
