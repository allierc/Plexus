general:
  name: exp15_arms_nc_m10_mid_s1
  seed: 0
  n_frames: 40000
  record_cap: 2500
  dt: 0.04
  dim: 2
  boundary: free
  world: [360.0, 360.0]
sets:
  cell:
    n: 102400
    state:
      pos: {width: 2, integration: none, boundary: free}
      chem: {width: 3, integration: first_order, boundary: free}
      trait: {width: 1, integration: none, boundary: free}
fields: {}
seed:
- {op: seed_positions, at: cell, model: tiled_lattice, side: 40, tiles: 64, gap: 4}
- op: seed_cell_chem
  at: cell
  model: lattice_sites
  fractions: [0.25, 0.25, 0.25]
  seed: 1
operators:
- {op: radius_graph, at: cell, model: periodic_tiles, radius: 1.0, tile_side: 40}
- op: cell_chem_react
  at: cell
  implementation: rps_lattice
  a: 1.0
  rate: 1.0
  seed: 1
  trait: {block: trait, mutation: 0.1, cost: 0.0, init: 1.0, seed: 1}
- op: cell_chem_diffuse
  at: cell
  implementation: lattice_exchange
  chi: 1.0
  d: [0.64, 0.64, 0.64]
  seed: 1
  carry: [trait]
schedule: [radius_graph, cell_chem_react, cell_chem_diffuse]
plotting:
  renderer: mpl2d
  background: black
  blend: additive
  dot_size: 2
  species: ['#e8262a', '#2f5fd0', '#f2d21b']
  duration_s: 10
  curve:
  - {quantity: 'species:cell', ylabel: individuals per species, ymin: 0.0, ymax: 102400.0}
