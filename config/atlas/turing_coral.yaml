# turing_coral -- Gray-Scott on the cell graph, 4,000 cells, on a surface that does not grow
#
# ONE OF THE THREE MINISITE SCENES, generated by `tools/make_atlas_scenes.py` from
# `config/gates/gate_00_spheroid.yaml` so the mechanics is the gated one and not a second copy of it.
#
# THE DIFFUSION IS ON THE CELL GRAPH, NOT ON A LATTICE. The cells are the nodes,
# `cell_neighbours` is the graph, and the Laplacian runs over shared faces -- so the domain is the
# tissue's own topology. `chi` is the CROSS-DIFFUSION that makes the pattern follow the surface
# rather than the index order, and it is the parameter that separates this from a Gray-Scott on a
# sphere-shaped array.
#
# GROWTH AND DIVISION ARE REMOVED, and that is the scene. With a fixed cell count the only thing
# moving is the chemistry, which is the one way to see whether the pattern is a property of the
# REACTION or of the remeshing that a growing tissue does underneath it.
general:
  name: turing_coral
  seed: 0
  n_frames: 6000
  dt: 1.0
  record_cap: 602
  boundary: free
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
plotting:
  background: black
sets:
  vertex:
    n: 24000
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12000
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 2
        integration: first_order
fields: {}
operators:
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 4000
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_chem_seed
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.06
- op: cell_neighbours
  at: cell
  vertex_set: vertex
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.046
  kk: 0.062
  rate: 1.0
- op: cell_geometry
  at: cell
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 2.0
  K_R: 0.4
  Lambda: 3.0
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: topo_record
  at: vertex
  # THE TOPOLOGY MUST BE RECORDED ON THE SAME CLOCK AS THE POSITIONS, and 1 is not that clock.
  # `record_cap: 602` against 6000 frames makes the engine record positions every 10th tick (601
  # rows); `every: 1` recorded 6001 topology rows. `run_one`'s D3 check refuses the pair outright:
  # "positions=601 frames but topology=6001 ... pairs each frame's coordinates with ANOTHER frame's
  # connectivity and fabricates inverted cells", so the okuda side of this scene has never run.
  # 10 = 6000 / (602 - 1). `vertex_spheroid` never hit this because its cap exceeds its frame count
  # and both clocks are 1.
  every: 10
schedule:
- mesh_seed
- cell_geometry
- cell_chem_seed
- cell_neighbours
- cell_chem_diffuse
- cell_chem_react
- cell_mechanics
- edge_flip
- topo_record
