general:
  name: exp15_kerr_r3_s1
  seed: 0
  n_frames: 100000
  record_cap: 2500
  dt: 0.05
  dim: 2
  boundary: free
  world: [520.0, 520.0]
sets:
  cell:
    n: 250000
    state:
      pos: {width: 2, integration: none, boundary: free}
      chem: {width: 3, integration: first_order, boundary: free}
fields: {}
seed:
- {op: seed_positions, at: cell, model: tiled_lattice, side: 250, tiles: 4}
- op: seed_cell_chem
  at: cell
  model: lattice_sites
  fractions: [0.25, 0.25, 0.25]
  seed: 1
operators:
- {op: radius_graph, at: cell, model: periodic_tiles, radius: 3.0, tile_side: 250}
- {op: cell_chem_react, at: cell, model: kerr_csr, delta_c: 0.3333333333333333, delta_s0: 0.25, delta_r: 0.3125,
  tau: 0.75, neighbourhood: local, rate: 1.0, seed: 1}
schedule: [radius_graph, cell_chem_react]
plotting:
  renderer: mpl2d
  background: black
  blend: additive
  dot_size: 2
  species: ['#e8262a', '#2f5fd0', '#2fb24a']
  duration_s: 10
  curve:
  - {quantity: 'species:cell', ylabel: per species, ymin: 0.0, ymax: 250000.0}
