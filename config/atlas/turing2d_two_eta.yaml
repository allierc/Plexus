# turing2d_two_eta -- the TWO-SYSTEM twin of `turing2d_gs_eta`.
#
# System A is `turing2d_two`'s (F 0.046 / kk 0.062), unchanged, and system B is moved to Pearson's
# eta point (0.034, 0.063) -- the same point the one-system spec `turing2d_gs_eta` runs alone.
# So the pair answers a question neither run can on its own: does a motif survive being laid over
# another one on the same cells, or does the shared geometry suppress it?
#
# The two systems remain INDEPENDENT here -- separate `chan` spans, no cross term -- so anything
# that changes between this and the solo run is competition for space and neighbours, not
# chemistry. `turing2d_coupled` is where they are given a cross term.
# SYSTEM B DIFFUSES AT PEARSON'S RATIO, d = [0.08, 0.16] -- the same as system A. It used to
# inherit turing2d_two's B, where d_a is 0.03 so the two systems differ in SCALE; that puts B's
# ratio at 0.16/0.03 = 5.3, and Pearson's (F, k) labels only name distinct motifs at Du/Dv = 2.
# Measured: at 5.3 the six points gave ONE field at six amplitudes -- species B correlated 0.86 to
# 0.95 between eta, kappa, lambda and theta. The diffusion length was setting the pattern and the
# reaction point was decorating it. At ratio 2 the labels mean what they say, and B then differs
# from A in (F, kk) ALONE, which is what a regime sweep is supposed to vary.
general:
  name: turing2d_two_eta
  seed: 0
  n_frames: 6000
  record_cap: 602
  dt: 1.0
  dim: 2
  boundary: free
  world:
  - 49.4
  - 49.4
sets:
  cell:
    n: 4000
    spawn: sunflower
    spawn_radius: 19.0
    state:
      pos:
        width: 2
        integration: none
        boundary: free
      chem:
        width: 4
        integration: first_order
        boundary: free
fields: {}
operators:
- op: cell_chem_seed
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.12
  chan: 0
- op: cell_chem_seed
  at: cell
  seed: 2
  before_frame: 3
  mode: scatter
  seed_frac: 0.12
  chan: 2
- op: radius_graph
  at: cell
  radius: 0.95
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
  chan: 0
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
  chan: 2
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.046
  kk: 0.062
  rate: 1.0
  chan: 0
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.034
  kk: 0.063
  rate: 1.0
  chan: 2
schedule:
- cell_chem_seed
- cell_chem_seed
- radius_graph
- cell_chem_diffuse
- cell_chem_diffuse
- cell_chem_react
- cell_chem_react
plotting:
  renderer: mpl2d
  background: black
  dot_fill: 0.9
