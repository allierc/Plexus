# turing_two_both -- TWO INDEPENDENT Gray-Scott systems on one cell set.
#
# WHAT "TWO SPECIES" MEANS HERE, AND WHAT IT DOES NOT. The minisite clip captioned "two species"
# is NOT this: `turing2d_two_species` is `chem width: 2` with a single `react`, i.e. one Gray-Scott
# pair at F 0.039 / kk 0.058 -- the same two chemicals (activator a, substrate u) the other two
# clips have, at a different point in the (F, kk) plane. That is why it looks so like the coral
# clip: same chi, neighbouring parameters.
#
# This spec is two genuinely independent systems sharing one `chem` buffer:
#     columns 0,1  species A = (a1, u1)      columns 2,3  species B = (a2, u2)
# `cell_chem_diffuse` and `cell_chem_react` each take a `chan` naming the pair they own and write
# zeros in every other column, so the two cannot leak into one another through either step. They
# are coupled only through the geometry they share.
#
# THE SCHEDULE NAMES EACH OPERATOR TWICE ON PURPOSE. The engine binds the i-th OCCURRENCE of a
# token to the i-th INSTANCE of that operator (`_want = {_idx[_n]}`), and an instance with no
# occurrence to bind to is CONSTRUCTED, LISTED IN THE RUN BANNER, AND NEVER CALLED. Naming
# `cell_chem_react` once with two instances declared would run species A and silently drop
# species B, and the run would look like a one-species run that had simply lost its second pattern.
#
# BOTH: a coarse spot-former laid over a fine brancher -- B differs in scale AND in regime, so
# the two motifs share no wavelength and no morphology. This is the strongest separation the
# two-species mechanism can express without coupling them.
#
# THE RATIO IS MADE BY SHORTENING THE ACTIVATOR, NOT BY LENGTHENING THE INHIBITOR, and that is a
# stability constraint rather than a taste. `cell_chem_diffuse` steps an explicit Euler on the
# DEGREE-NORMALISED graph Laplacian, whose eigenvalues lie in [-2, 0], so the diffusion number
# d * chi must stay below 1 -- and below about 0.5 once the reaction is added on top. At chi 1.3
# the baseline d_h 0.16 gives 0.208, comfortably inside; the first attempt at ratio 32 raised d_h
# to 0.64, giving 0.83, and species B went non-finite within 120 frames while species A ran on
# normally -- a dead pattern next to a live one, which reads as "the second species did nothing"
# rather than as a blown-up integration. Holding d_h at 0.16 and cutting d_a instead buys the same
# ratio at the same cost in stability as the baseline.
#
# CORE-ONLY: an exploration, not a promotion check. No okuda twin, no byte-identity gate.
general:
  name: turing_two_both
  seed: 0
  n_frames: 6000
  dt: 1.0
  record_cap: 602
  boundary: free
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
plotting:
  background: black
sets:
  vertex:
    n: 24000
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12000
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 4
        integration: first_order
fields: {}
operators:
- op: cell_chem_seed
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.06
  chan: 0
- op: cell_chem_seed
  at: cell
  seed: 2
  before_frame: 3
  mode: scatter
  seed_frac: 0.1
  chan: 2
- op: mesh_seed
  at: vertex
  before_frame: 1
  cell_set: cell
  n_cells: 4000
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  vseed_cv: 0.15
- op: cell_neighbours
  at: cell
  vertex_set: vertex
- op: cell_geometry
  at: cell
- op: cell_mechanics
  at: vertex
  K_A: 1.0
  K_P: 1.0
  K_V: 2.0
  K_R: 0.4
  Lambda: 3.0
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  every: 4
  engine_clock: true
  l_th_frac: 0.35
  max_flips: 30
- op: topo_record
  at: vertex
  every: 10
  engine_clock: true
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
  chan: 0
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.005
  d_h: 0.16
  chi: 1.3
  chan: 2
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.046
  kk: 0.062
  rate: 1.0
  chan: 0
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.026
  kk: 0.055
  rate: 1.0
  chan: 2
schedule:
- cell_chem_seed
- cell_chem_seed
- mesh_seed
- cell_geometry
- cell_neighbours
- cell_mechanics
- edge_flip
- topo_record
- cell_chem_diffuse
- cell_chem_diffuse
- cell_chem_react
- cell_chem_react
