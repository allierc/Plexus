# turing_rps_growth -- May-Leonard on a GROWING epithelium, with the RED species driving growth.
#
# The combination of `r013_05` (growing tissue + Turing, from the minisite's fourth section) and
# `turing_rps`: r013_05's mesh, mechanics, division and edge-flips, with its Gray-Scott chemistry
# replaced by the three-species cyclic model at the working point `turing_rps` established.
#
# RED ACTIVATES LOCAL GROWTH, and that is the whole point of the composition. `cell_grow` already
# takes a `chan` naming which species gates it and an `a_sw` threshold on that species' value, so
# the coupling needs NO new operator -- it is the growth operator reading column 0, which under
# the `species` LUT below is drawn red. Cells inside a red domain pass the Hill gate and grow;
# cells in the green or blue domains do not. Since the RPS domains TRAVEL, the growth front travels
# with them: the tissue is not growing where it is red once, it is growing wherever red currently
# is, and the surface records the history of a rotating wave.
#
# a_sw IS 0.45, NOT r013_05's 0.35. Under the simplex seed u+v+w = 1, so a species' value lives on
# [0,1] and 0.45 means "this cell is more than half red" -- a domain interior rather than a domain
# edge. r013_05's 0.35 was calibrated against a Gray-Scott activator with a different range.
#
# THREE OPERATORS FROM r013_05 ARE DROPPED, deliberately, and none of them for convenience:
#   cell_chem_from_shape  writes `F` from local curvature. F is a Gray-Scott feed rate; May-Leonard
#                         has no such parameter, so the operator would be modulating nothing.
#   interface_tension     a SECOND chemistry-to-mechanics coupling (the purse-string). Keeping it
#                         would mean two mechanisms answering to the same red field, and no run
#                         could say which one shaped the surface.
#   cell_shape_probe      publishes the apoptosis discriminator; nothing dies in this spec.
#
# GROWTH STARTS AT FRAME 450, inherited from r013_05, and the reason is the same: the pattern needs
# to establish before the geometry starts moving under it, or the tissue grows on noise.
general:
  name: turing_rps_growth
  seed: 819657
  n_frames: 2150
  dt: 1.0
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
  record_cap: 602
_run:
  target_cells: 50000
  seed_cells: 2000
sets:
  vertex:
    n: 130004
    mesh: half_edge
    cell_set: cell
  cell:
    n: 65004
    state:
      chem:
        width: 3
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: mesh_seed
  at: vertex
  cell_set: cell
  before_frame: 1
  n_cells: 2000
  radius: 5.0
  jitter: 0.15
  seed: 819657
  vseed_cv: 0.15
  p0: 3.5
- op: cell_geometry
  at: cell
- op: cell_chem_seed
  at: cell
  mode: simplex
  n_spots: 1
  cone_deg: 8.0
  seed: 819657
  before_frame: 3
  n_species: 3
- op: cell_neighbours
  at: cell
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  chi: 1.0
  d:
  - 0.02
  - 0.02
  - 0.02
- op: cell_chem_react
  at: cell
  model: rock_paper_scissor
  a: 0.6
  rate: 0.05
  chan: 0
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.001732
  a_sw: 0.45
  hill: 8.0
  rho: 0.1
  vth_frac: 2.5
  after_frame: 450
  conserve_amount: false
  chan: 0
- op: cell_mechanics
  at: vertex
  p0: 3.5
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.4
  Lambda: 0.5
  K_V: 40.0
  K_R: 0.0
  K_bend: 0.0
  K_lumen: 0.0
  antiinv: 0.0
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: cell_divide
  at: vertex
  factor: 2.0
  reset_noise: 0.12
  cycle_cv: 0.15
  p0: 3.5
  every: 4
  cell_set: cell
  min_cycle: 4
  max_cycle: 1000000000
  after_frame: 450
  orient_iface: false
  orient_asw: 0.6
  g1_ramp: false
  engine_clock: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_chem_seed
- cell_neighbours
- cell_chem_diffuse
- cell_chem_react
- cell_grow
- cell_mechanics
- edge_flip
- cell_divide
- topo_record
