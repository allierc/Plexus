# turing2d_gs_beta -- Gray-Scott at Pearson point beta: spatiotemporal chaos -- worms that never settle.
#
# ONE PARAMETER PAIR CHANGES, (F, kk) = (0.026, 0.051). Everything else -- the disc, the 4,000 cells,
# the adjacency, chi 4.0, d_a 0.08 / d_h 0.16 -- is `turing2d_disc_chi4`'s, so the sweep isolates
# the reaction and nothing else. Derived from that file rather than rebuilt beside it, which is the
# lesson `turing2d_coupled` cost: a variant meant to differ in one parameter must come FROM its
# control.
#
# THE BASIS IS PEARSON'S OWN DIAGRAM and it transfers because the diffusivity ratio does. Pearson
# integrates Du = 2e-5 for the substrate against Dv = 1e-5 for the activator -- the substrate twice
# the activator -- and d_h / d_a = 0.16 / 0.08 is the same 2. A ratio of 2 is what makes his (F, k)
# labels mean here what they mean there.
# CHI IS 0.5 HERE, NOT 4.0, AND THAT IS WHY THIS POINT WAS DEAD. At d_a*chi = 0.32 a seeded
# nucleus at a = 0.5 spreads over its ~8 neighbours in a single step and each lands below the
# autocatalysis threshold a > (F+kk)/u, so it decays before it can grow: measured a -> 0 and u -> 1
# across the whole disc, a blank white frame. The three points that survived at chi 4.0 all sit at
# kk >= 0.061, where the pattern tongue is wide enough to catch a diluted nucleus; these three do
# not. Lowering chi gives the reaction time against the diffusion. Verified on beta: dead at
# chi 4.0, sd 0.022 at 1.3, sd 0.043 at 0.5.
general:
  name: turing2d_gs_beta
  seed: 0
  n_frames: 6000
  record_cap: 602
  dt: 1.0
  dim: 2
  boundary: free
  world:
    - 49.4
    - 49.4
sets:
  cell:
    n: 4000
    spawn: sunflower
    spawn_radius: 19.0
    state:
      pos:
        width: 2
        integration: none
        boundary: free
      chem:
        width: 2
        integration: first_order
        boundary: free
fields: {}
seed:
  - op: cell_chem_seed
    at: cell
    seed: 0
    mode: scatter
    seed_frac: 0.12
operators:
  - op: radius_graph
    at: cell
    radius: 0.95
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    d_a: 0.08
    d_h: 0.16
    chi: 0.5
  - op: cell_chem_react
    at: cell
    model: gray_scott
    F: 0.026
    kk: 0.051
    rate: 1.0
schedule:
  - radius_graph
  - cell_chem_diffuse
  - cell_chem_react
plotting:
  renderer: mpl2d
  background: black
  dot_fill: 0.9
