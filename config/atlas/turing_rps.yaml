# turing_rps -- the 3D twin of `turing2d_rps`: May-Leonard on the closed vertex mesh.
#
# DERIVED FROM `turing_coral`, the 3D control that patterns, so the geometry, the mesh seed, the
# mechanics and the schedule are its. Only the chemistry changes: chem widens to three columns, the
# seeder switches to `simplex`, and the reaction becomes `rock_paper_scissor`.
#
# THE WORKING POINT COMES FROM THE 2D TWIN, not from a fresh guess: d 0.02, chi 1.0, a 0.6,
# rate 0.05. It transfers because both sides diffuse through the same operator on the same
# DEGREE-NORMALISED graph Laplacian -- `cell_neighbours` builds the adjacency from the mesh here
# and `radius_graph` builds it from positions there, but the Laplacian sees only a graph either
# way, so `d * chi` means the same thing on both.
#
# WHAT THE 3D VERSION CAN SHOW THAT THE DISC CANNOT: the spirals live on a CLOSED surface, so there
# is no boundary for a wave to die against and no edge for a spiral core to anchor to. Whether the
# cyclic domains still organise into spirals when they have nowhere to terminate is the question
# this run exists to answer, and it is not one the flat disc can be asked.
general:
  name: turing_rps
  seed: 0
  n_frames: 6000
  dt: 1.0
  record_cap: 602
  boundary: free
  dim: 3
  world:
    - 50.0
    - 50.0
    - 50.0
  units:
    length_um: 10.0
    time_s: 600.0
plotting:
  renderer: vtk_mesh
  background: black
  blend: additive
  species:
    - '#ff0000'
    - '#00ff00'
    - '#0000ff'
sets:
  vertex:
    n: 24000
    mesh: half_edge
    cell_set: cell
  cell:
    n: 12000
    state:
      area:
        width: 1
      cen:
        width: 3
      chem:
        width: 3
        integration: first_order
fields: {}
operators:
  - op: mesh_seed
    at: vertex
    cell_set: cell
    n_cells: 4000
    radius: 5.0
    jitter: 0.18
    p0: 3.5
    seed: 0
    vseed_cv: 0.15
  - op: cell_chem_seed
    at: cell
    seed: 0
    mode: simplex
    n_species: 3
  - op: cell_neighbours
    at: cell
    vertex_set: vertex
  - op: cell_chem_diffuse
    at: cell
    implementation: graph_laplacian
    chi: 1.0
    d:
      - 0.02
      - 0.02
      - 0.02
  - op: cell_chem_react
    at: cell
    model: rock_paper_scissor
    a: 0.6
    rate: 0.05
    chan: 0
  - op: cell_geometry
    at: cell
  - op: cell_mechanics
    at: vertex
    K_A: 1.0
    K_P: 1.0
    K_V: 2.0
    K_R: 0.4
    Lambda: 3.0
    Gamma: 0.4
    p0: 3.5
    mu: 1.0
    dt: 1.0
    relax_iters: 30
    eta: 0.08
    cap_frac: 0.12
  - op: edge_flip
    at: vertex
    every: 4
    engine_clock: true
    l_th_frac: 0.35
    max_flips: 30
  - op: topo_record
    at: vertex
    every: 10
    engine_clock: true
schedule:
  - mesh_seed
  - cell_geometry
  - cell_chem_seed
  - cell_neighbours
  - cell_chem_diffuse
  - cell_chem_react
  - cell_mechanics
  - edge_flip
  - topo_record
