# Differential for adhere/lennard_jones (jax-morph LennardJones), ISOLATED.
#
# The oracle run this mirrors is atlas_jax_morph/_oracle/runs/diff_lennard_jones/:
# jax-morph BrownianDynamics(LennardJones(epsilon=1.0), gamma=1.0, kT=0.0) run ALONE (no growth, no
# division) on SIX well-separated dumbbell pairs, uniform radius 0.5 (sigma = r_i+r_j = 1.0),
# 100 macro-steps at dt=0.01. LennardJones is a POTENTIAL (it writes no state; its whole contract
# is the force F = -grad U), so it is isolated from every other mechanism and driven by the
# reference's OWN overdamped Langevin step at kT=0, whose update dx = dt*forces/gamma is exactly
# the Plexus engine's overdamped Euler of the operator's emitted velocity: pos += dt * mobility * F,
# with mobility == 1/gamma == 1. The trajectory is therefore a pure function of the LJ force law,
# and a per-cell position diff isolates it.
#
# WHY DUMBBELLS. A purely-adhesive many-cell blob is geometrically frustrated -- it collapses into
# the stiff r^-12 core and the explicit integrator explodes. Six pairs with centres 5 apart
# (> 2.5*sigma, so NO cross-pair force), each starting at a different separation
# [1.15, 1.25, 1.35, 1.50, 1.70, 2.60]*sigma, each relax MONOTONICALLY to contact -- sweeping the
# adhesive tail, the cutoff ramp, and beyond-cutoff -- with no collapse and no deep-core excursion.
# This isolates the LJ-DISCRIMINATING feature (adhesive tail + equilibrium AT contact) that the
# repulsion-only siblings lack; the SoftSphere negative control leaves every pair frozen.
#
# The `start:` positions are the oracle's live-cell coordinates VERBATIM (6-decimal, printed by
# _oracle/scripts/lennard_jones.py) so the two sides share a BYTE-IDENTICAL float32 IC. n=12 live +
# 4 dead padding slots (buffer 16) park the dead slots at the origin (state zeros), matching the
# oracle, so the dead-pair mask and the sigma=0 safe_divide/cutoff guards are exercised.
# lennard_jones is gated after_frame:1 so recorded frame 0 = the pristine IC and frame t = the IC
# after t overdamped steps, aligning cell-for-cell and frame-for-frame with the reference s_0..s_100.
general:
  name: lennard_jones
  seed: 0
  n_frames: 100
  dt: 0.01
  boundary: free
  dim: 2
  world: [40.0, 40.0]

sets:
  cell:
    n: 12
    buffer: 16                     # 12 live (6 dumbbells) + 4 dead padding slots (occ=0, parked at origin)
    # the oracle's 12 live cells (6-decimal, byte-identical to reference.npz p0[:12])
    start:
    - [4.000000, 20.575000]
    - [4.000000, 19.425000]
    - [9.000000, 20.625000]
    - [9.000000, 19.375000]
    - [14.000000, 20.675000]
    - [14.000000, 19.325000]
    - [19.000000, 20.750000]
    - [19.000000, 19.250000]
    - [24.000000, 20.850000]
    - [24.000000, 19.150000]
    - [29.000000, 21.300000]
    - [29.000000, 18.700000]
    # a set that declares `state:` gets ONLY these blocks; pos + vel makes it a 2nd-order set so
    # EMIT="velocity" is overdamped (v := delta; pos += dt*v), matching BrownianDynamics.
    state:
      pos: { width: 2 }
      vel: { width: 2 }

fields: {}

operators:
  # the r_min 12-6 Lennard-Jones contact force, autodiffed to an overdamped velocity.
  # epsilon 1.0, uniform radius 0.5 (the operator's scalar-radius fallback -> sigma = 1.0),
  # mobility 1.0 == 1/gamma, default cutoff window [1.5, 2.5]*sigma. after_frame:1 so frame 0 =
  # pristine IC (see header).
  - { op: adhere, implementation: lennard_jones, at: cell, after_frame: 1,
      epsilon: 1.0, radius: 0.5, mobility: 1.0 }

schedule: [adhere]

plotting:
  background: black
  point_size: 6.0
