# Differential for adhere/soft_sphere (jax-morph SoftSphere), ISOLATED.
#
# The oracle run this mirrors is atlas_jax/_oracle/runs/diff_soft_sphere/:
# jax-morph BrownianDynamics(SoftSphere(epsilon=1.0), gamma=1.0, kT=0.0) run ALONE (no growth, no
# division) on a fixed 19-cell mutually-overlapping sunflower cluster, uniform radius 0.5
# (sigma = r_i+r_j = 1.0), 60 macro-steps at dt=0.2. SoftSphere is a POTENTIAL (it writes no
# state; its whole contract is the force F = -grad U), so it is isolated from every other
# mechanism and driven by the reference's OWN overdamped Langevin step at kT=0, whose update
# dx = dt*forces/gamma is exactly the Plexus engine's overdamped Euler of the operator's emitted
# velocity: pos += dt * mobility * F, with mobility == 1/gamma == 1. The trajectory is therefore a
# pure function of the force law, and a per-cell position diff isolates it.
#
# The `start:` positions are the oracle's live-cell coordinates VERBATIM (6-decimal, printed by
# _oracle/scripts/soft_sphere.py) so the two sides share a BYTE-IDENTICAL float32 IC. n=19 live +
# 5 dead padding slots (buffer 24) put the dead slots at the origin (state zeros), matching the
# oracle, so the dead-pair mask and the sigma=0 safe_divide are exercised. soft_sphere is gated
# after_frame:1 so recorded frame 0 = the pristine IC and frame t = the IC after t overdamped
# steps, aligning cell-for-cell and frame-for-frame with the reference history s_0..s_60.
general:
  name: soft_sphere
  seed: 0
  n_frames: 60
  dt: 0.2
  boundary: free
  dim: 2
  world: [40.0, 40.0]

sets:
  cell:
    n: 19
    buffer: 24                     # 19 live + 5 dead padding slots (occ=0, parked at origin)
    # the oracle's 19 live founders (6-decimal, byte-identical to reference.npz p0[:19])
    start:
    - [20.296985, 20.000000]
    - [19.620703, 20.347467]
    - [20.058058, 19.338464]
    - [20.478080, 20.623570]
    - [19.122665, 19.844812]
    - [20.831088, 19.471330]
    - [19.722017, 21.034082]
    - [19.469857, 18.979241]
    - [21.150199, 20.420051]
    - [18.803410, 20.493935]
    - [20.576836, 18.767336]
    - [20.426267, 21.359006]
    - [18.715227, 19.255448]
    - [21.507185, 19.668650]
    - [19.080188, 21.308337]
    - [19.787502, 18.360169]
    - [21.304528, 21.099458]
    - [18.244514, 20.072595]
    - [21.280492, 18.725739]
    # a set that declares `state:` gets ONLY these blocks; pos + vel makes it a 2nd-order set so
    # EMIT="velocity" is overdamped (v := delta; pos += dt*v), matching BrownianDynamics.
    state:
      pos: { width: 2 }
      vel: { width: 2 }

fields: {}

operators:
  # the purely-repulsive harmonic soft-sphere contact force, autodiffed to an overdamped velocity.
  # epsilon 1.0, uniform radius 0.5 (the operator's scalar-radius fallback -> sigma = 1.0),
  # mobility 1.0 == 1/gamma. after_frame:1 so frame 0 = pristine IC (see header).
  - { op: adhere, implementation: soft_sphere, at: cell, after_frame: 1,
      epsilon: 1.0, radius: 0.5, mobility: 1.0 }

schedule: [adhere]

plotting:
  background: black
  point_size: 6.0
