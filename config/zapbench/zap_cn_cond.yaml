general:
  name: zap_cn_cond
  seed: 0
  n_frames: 1
  dt: 1.0
  boundary: wall
  dim: 3
  world: [1.0, 1.0, 1.0]
  save_data: false
sets:
  brain: {n: 1}
  neuron:
    parent: brain
    per_parent: 71721
    grow_reserve: 0
    title: "the 71,721 segmented neurons of the ZAPBench fish, at their soma centroids"
    state:
      dff: {width: 6, role: coordinate, integration: first_order, boundary: free, title: "dF/F now and the five frames before, newest first"}
      xyz: {width: 3, integration: none, boundary: free, record: false, title: "soma centroid, um"}
      embedding: {width: 2, integration: none, boundary: free, record: false, title: "the neuron's learned embedding, 2 numbers (connectome-gnn's a_i)"}
  stimulus:
    parent: brain
    per_parent: 22
    grow_reserve: 0
    title: "the 22 known stimulus features of ZAPBench"
    state:
      u: {width: 7, integration: none, boundary: free, record: false, title: "each feature at frames t-5 .. t+1"}
fields: {}
seed:
- {op: seed_state_from_file, at: neuron, file: zebrafish/zapbench_recording.npz, blocks: {xyz: pos_um}}
- {op: seed_state_random, at: neuron, block: embedding, lo: 1.0, hi: 1.0}
- {op: seed_state_random, at: stimulus, block: u, lo: 0.0, hi: 0.0}
operators:
- {op: state_diffuse, model: connectome, at: neuron, block: dff, positions: xyz, positions_file: zebrafish/zapbench_recording.npz, mesh_spacing: 16.0, mesh_mirror_axis: 0, mesh_levels: 4, hidden: 64, substeps: 8, mesh_embedding_dim: 2, message: conductance, inputs: 6, embedding: embedding, embedding_dim: 2, forcing: stimulus.u, forcing_dim: 154, seed: 0, checkpoint: true, title: "each neuron's dF/F, its dynamics learned as a circuit on the multi-level mesh: one state per mesh node, one weight per mesh edge"}
schedule: [state_diffuse]
plotting: {renderer: none, max_frames: 0}
