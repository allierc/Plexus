module: src/plexus/operators/candidates/jax_morph_lennard_jones.py
test: tests/test_jax_morph_lennard_jones.py
evidence:
  oracle_run: diff_lennard_jones
  diff_metric: |
    D_pos = max over ALL 101 frames (t = 0..100) and ALL 12 live cells of the per-cell
    Euclidean position discrepancy ||x_plx(t,i) - x_ref(t,i)||_2, divided by the contact
    distance sigma = r_i + r_j = 1.0 (uniform radius 0.5). UNITS: fractions of sigma (one cell
    diameter). x_ref is the jax-morph BrownianDynamics(LennardJones(epsilon=1.0), gamma=1.0,
    kT=0.0) trajectory -- the reference's OWN overdamped Euler at zero temperature, whose update
    is exactly dx = dt*F/gamma = dt*(-grad U). x_plx is the Plexus adhere/lennard_jones operator
    under the engine's overdamped Euler, on a BYTE-IDENTICAL initial condition (SIX well-separated
    dumbbell pairs -- centres 5 apart, > 2.5*sigma so no cross-pair force -- at initial separations
    [1.15, 1.25, 1.35, 1.50, 1.70, 2.60]*sigma, radius 0.5, + 4 dead padding slots parked at the
    origin), same dt = 0.01, same 100 steps, aligned cell-for-cell and frame-for-frame
    (lennard_jones is gated after_frame:1 so frame 0 is the pristine IC and frame t is the IC after
    t overdamped steps). Because kT = 0 makes the reference deterministic (verified identical across
    two PRNG keys) and its Euler-Maruyama update reduces to dx = dt*forces, the trajectory is a PURE
    function of the force law, so D_pos isolates the LJ r_min 12-6 force F = -grad
    eps((sigma/r)^12 - 2(sigma/r)^6) -- its ADHESIVE tail, equilibrium AT contact, and sigma-relative
    smooth C1 cutoff -- the feature distinguishing it from the purely-repulsive soft_sphere/hertzian.
    Computed by _oracle/scripts/_analyze_lennard_jones.py into log/atlas_jax/lennard_jones/diff.json.
  threshold: 0.001
  threshold_why: |
    1.0e-3 sigma, PRE-REGISTERED in the scorer (_analyze_lennard_jones.py:83, THRESHOLD = 1.0e-3)
    before the diff was computed. It is ~500x below one cell radius (0.5 sigma) and ~3 orders under
    the real dynamics the test must resolve (max live displacement 0.350 sigma; five dumbbells relax
    monotonically from separations 1.15..1.70 sigma down to contact 1.0, the sixth at 2.60 sigma
    stays frozen beyond the cutoff). A genuine force-law error CANNOT slip under it: the NEGATIVE
    CONTROL -- the purely-repulsive SoftSphere (LJ with the adhesive tail DELETED), which leaves
    every pair frozen -- diverges the trajectory by 0.350 sigma (350x the bar); coding the textbook
    4-eps form eps(4((sigma/r)^12 - (sigma/r)^6)) instead of the r_min form puts the well at
    2^(1/6) sigma with the wrong depth, dropping the 0.5 aggregation factor doubles the force, and
    using sigma = mean instead of sum halves the contact distance -- all diverge by O(sigma),
    hundreds of times the bar. Yet 1e-3 is NOT a bit-identity gate: across this same pair-potential
    family the identical scorer admits ordinary float32-level agreement (soft_sphere D_pos 2.7e-6,
    harmonic 7.9e-6, hertzian force-err 1.9e-6, all non-zero), so passing does not require exact
    arithmetic. THIS member happened to land the strongest possible pass -- D_pos = 0.0, the two
    float32 stacks (jax jit-scan vs torch autograd) byte-equal over all 101x12 live positions --
    which is verified REAL, not an aliasing artifact: the two arrays are distinct objects, diverge
    from the SoftSphere reference by 0.350 sigma, and the cells genuinely moved 0.350 sigma. Looser
    would admit an adhesion-off / 4-eps / dropped-prefactor reimplementation as "agreement"; tighter
    is moot here (the result is exactly 0) but for the family would fail on float32 reassociation.
  value: 0.0
  passed: true
  plexus_run: log/atlas_jax/lennard_jones/
  scorer: atlas_jax/_oracle/scripts/_analyze_lennard_jones.py
  acted_ledger: |
    adhere: calls 100 / acted 47, moved 2.679448 (cumulative max-cell displacement), kind lateral,
    structural false; inert_operators []; unverifiable_operators []; valid_evidence true ("every
    scheduled operator acted at least once"). The one scheduled operator moved cells on every frame
    of the ACTIVE phase -- adhere registers as acted on 47 frames and then falls below the move
    threshold once the five tail pairs reach contact (~frame 42; gyration plateaus 8.5795 -> 8.5678,
    nn-distance 1.5917 -> 1.2667 and both flatline thereafter), exactly the overdamped fixed point,
    NOT a still life. Frame-0 == pristine IC on both sides (residual 0.0/0.0).
  corroborators: |
    All from log/atlas_jax/lennard_jones/diff.json unless noted. (1) Frame 0 == pristine IC on BOTH
    sides (residual 0.0/0.0) -- the aligned convention is real; and the whole float32 trajectory is
    BYTE-EQUAL (np.array_equal True over 101x16x2), so D_pos = 0.0 is exact, not rounded. (2)
    Deliberately MISALIGNED comparison x_plx(t) vs x_ref(t-1) scores 0.0268 sigma (27x the bar and
    infinitely larger than D_pos) -> the frame alignment is genuinely correct, not an accidental
    match to a shifted trajectory. (3) Per-pair separation trajectory agrees to 0.0 sigma: the five
    tail pairs reach contact 1.0 and the beyond-cutoff pair stays frozen at 2.60 on BOTH sides. (4)
    NEGATIVE CONTROL fires: the adhesion-off SoftSphere on the SAME IC leaves every pair frozen and
    the Plexus LJ trajectory diverges from it by 0.350 sigma (350x the bar; ratio softsphere/lj is
    unbounded since lj-diff is 0), so PASS resolves the adhesive tail, not just a shared core -- and
    proves the two arrays are distinct trajectories, not aliased. (5) Every DEAD padding slot never
    moved on either side (0.0/0.0): the alive/self mask and the sigma=0 safe_divide/cutoff guards
    reproduce, no phantom pull. (6) Single-step IC force residual 9.4e-05 (eps/sigma units) is an
    ORACLE-INTERNAL float32 reassociation, NOT a Plexus<->reference force error: the recovered
    Plexus step plx[1]-plx[0] and the reference step ref[1]-ref[0] both differ from the standalone
    LennardJones.forces(IC) by the SAME 9.4e-07, i.e. they equal each other exactly. (7) Oracle
    self-guard carried through (diff_lennard_jones/summary.json): the 2-cell radial scan matches the
    analytic r_min force 12 eps(x^12 - x^6)/r to 4.6e-06, force is exactly -0.0 at contact and
    beyond 2.6 sigma, BrownianDynamics(kT=0) is deterministic across two PRNG keys, and its first
    Euler step equals dt*forces bit-for-bit. Oracle provenance: real jax-morph 0.4.0 / jax 0.11.0
    in the isolated venv (git ace08b8).
  scope: |
    UNIFORM-radius test: reference and spec both use radius 0.5, so the candidate exercises the
    contact distance sigma = r_i + r_j at EQUAL radii; the headline SUM-vs-mean size-consistency
    (heterogeneous r_i != r_j) is NOT exercised here (a mean-instead-of-sum contact rule would
    diverge by O(sigma) under two distinct radii -- the extending experiment, already carried on the
    hertzian twin which DID use heterogeneous radius + per-cell epsilon). Nor is per-cell epsilon
    exercised: the probe _probe_eps confirmed the per-cell arithmetic-mean mix equals the shared
    scalar at equal epsilon, but the trajectory uses a shared epsilon=1.0. The r_cutoff at 2.5 sigma
    sits beyond the resting contact, so the C1 truncation WINDOW [1.5, 2.5]*sigma is swept by the
    relaxing pairs (the adhesive tail is exercised through the cutoff ramp) and the one beyond-cutoff
    pair confirms exactly-zero force past 2.5 sigma. What it does NOT touch: the per-cell VIRIAL
    pressure the base derives from the same energy (a separate VirialStress mechanism, out of scope).
    This validates the IMPLEMENTATION reproduces the reference LJ force and its overdamped dynamics
    (to byte equality); it does not by itself decide the verdict/dispute (new -> adhere), which rests
    on the signature argument in `why`.
