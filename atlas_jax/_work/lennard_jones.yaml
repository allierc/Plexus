id: lennard_jones
order: 18
raw_name: LennardJones
raw_kind: potential (PairwisePotential)
code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L419
paper_section: p. 9 'Mechanical interactions' (Morse energy Vij, eq. lines 514-520; also Methods p. 14
  lines 758-772) - the paper's mechanics are Morse ONLY; LennardJones appears nowhere in the paper.
summary: 'A pair-interaction ENERGY component (not a step): given cell positions it returns a scalar total
  interaction energy over live, non-self pairs, from which the wrapping step (MechanicalRelaxation / BrownianDynamics
  / ActiveBrownianDynamics2D) derives per-cell forces by autodiff. The pair energy is Lennard-Jones in
  ``r_min`` form: a hard r^-12 repulsive core plus a 2*r^-6 adhesive tail whose minimum is exactly ``-epsilon``
  at the contact distance ``sigma = r_i + r_j``, multiplied by a smooth cutoff that truncates the tail
  between ``r_onset_frac*sigma`` and ``r_cutoff_frac*sigma``. It writes no state itself.'
equations: "Pair energy (LJ, r_min form), for a pair at separation r with contact distance sigma:\n  x\
  \       = safe_divide(sigma, r)              # = sigma/r, but 0 (not inf) at r=0\n  U_lj(r) = epsilon\
  \ * ( x**12 - 2 * x**6 )     # minimum -epsilon exactly at r = sigma\n  U(r)    = U_lj(r) * S(r; r_on,\
  \ r_off)        # tail truncated by the smooth cutoff\nwhere\n  sigma   = r_i + r_j                \
  \          # contact distance = sum of the two radii (per pair)\n  r_on    = r_onset_frac  * sigma \
  \             # default 1.5 * sigma\n  r_off   = r_cutoff_frac * sigma              # default 2.5 *\
  \ sigma\nSmooth cutoff S (jax-md multiplicative switch, C1), with r2=r^2, ron2=r_on^2, roff2=r_off^2:\n\
  \  S(r) = 1                                              for r <= r_on\n  S(r) = (roff2-r2)^2 (roff2\
  \ + 2 r2 - 3 ron2)/(roff2-ron2)^3   for r_on < r < r_off\n  S(r) = 0                               \
  \               for r >= r_off\nAggregation (inherited from PairwisePotential.total_energy):\n  E_total\
  \ = 0.5 * sum_i sum_{j alive, j != i} U(r_ij)   # each live pair counted once\n  forces  = -grad_positions(E_total)\
  \                    # via jax.grad; no analytic force\nPer-cell virial pressure (inherited, optional\
  \ consumer):\n  p_i = -(1/(2 d V_i)) sum_j r_ij (dU/dr)(r_ij)         # V_i is the d-ball volume of\
  \ radius r_i\nCODE vs PAPER: the paper uses the MORSE energy for all mechanics, never Lennard-Jones:\n\
  \  V_morse(r) = epsilon * [ (1 - exp(-alpha (r - sigma)))^2 - 1 ]   (paper eq., p. 9 / p. 14)\n"
params:
  epsilon: well_depth / adhesion_energy_scale - sets BOTH the repulsion strength and the adhesive well
    depth (the minimum equals -epsilon at contact). A shared scalar OR a per-cell ``StateFieldSpec``;
    a per-cell epsilon is combined per pair by the ARITHMETIC mean ``0.5*(e_i+e_j)`` (base ``mix``), not
    a geometric / Lorentz-Berthelot rule. Default 1.0.
  r_onset_frac: interaction_cutoff_onset - start of the smooth truncation window as a multiple of the
    contact distance sigma; the tail is untouched (S=1) inside this radius. Default 1.5.
  r_cutoff_frac: interaction_range / cutoff - end of the smooth truncation window as a multiple of sigma,
    beyond which the energy is exactly 0. Must satisfy r_onset_frac < r_cutoff_frac (checked at construction).
    Default 2.5.
state_io:
  reads:
  - position (capacity, n_space_dim) - supplied to total_energy; also state.position for virial
  - radius (capacity,) - forms the per-pair contact distance sigma = r_i + r_j
  - alive (capacity,) - masks dead cells and self-pairs in neighbor_sum
  - 'displacement (static, from the state''s space: free_space / periodic) - the pairwise metric'
  - n_space_dim (static) - only for the inherited virial_pressure (d-ball volume)
  - epsilon field - ONLY if epsilon is a StateFieldSpec; then declared via state_reads() so the wrapping
    step allocates it. With the default scalar epsilon, reads nothing beyond base fields.
  writes:
  - 'NONE. This is an energy component, not a step: it returns a scalar energy / a force array / a per-cell
    pressure. The consuming step writes position (relaxation, Brownian) or a pressure field (virial stress);
    LennardJones declares no state_writes of its own.'
surprises:
- THE PAPER DOES NOT USE LENNARD-JONES. Every mechanical interaction in the paper is the MORSE potential
  (p. 9 'Mechanical interactions'; Methods p. 14). ``LennardJones`` is a library-only alternative pair
  potential, exercised by no paper experiment - a reimplementer targeting the paper would never instantiate
  this class. Recorded as the source/paper divergence; source wins.
- It is the ``r_min`` LJ form ``eps*((sigma/r)^12 - 2 (sigma/r)^6)``, NOT the textbook ``4 eps ((sigma/r)^12
  - (sigma/r)^6)``. Here sigma is the location of the MINIMUM (= contact distance r_i+r_j) with value
  -epsilon, NOT the zero-crossing. Coding the standard 4-eps form puts the well at 2^(1/6) sigma with
  the wrong depth - a silent, plausible-looking error.
- sigma is per-pair and size-dependent (r_i + r_j), and BOTH cutoff radii are sigma-relative, so the interaction
  rescales as cells grow. A fixed absolute cutoff would break size-consistency.
- The smooth cutoff S multiplies the WHOLE energy (core included), not just the r^-6 tail. It is inert
  on the core only because r_on = 1.5*sigma > sigma keeps S=1 for r < sigma; a reimplementer who lowers
  r_onset_frac below 1 would start cutting into the repulsive core.
- 'Zero-safety: ``x = safe_divide(sigma, r)`` returns 0 (not inf) at r=0, so the self-diagonal and dead-dead
  padded pairs give U=0 instead of NaN under the always-on jax_debug_nans. A naive sigma/r blows up. _smooth_cutoff
  and safe_divide similarly guard the sigma=0 dead-pair case.'
- Aggregation carries a 0.5 factor (each pair counted once) and neighbor_sum masks self and dead pairs.
  Dropping the 0.5 double-counts the energy and hence the forces.
- 'No analytic force: forces are ``-jax.grad(total_energy)`` and there is NO jax-md dependency - the energy
  is hand-written and differentiated. The C1 cutoff keeps the force continuous but with a small slope
  kink at the window edges.'
- 'Unlike Morse, LJ has NO width/steepness knob: the 12-6 exponents fix the shape. Only epsilon and the
  two cutoff fractions are tunable, so it cannot be tuned to reproduce a given Morse alpha.'
verdict: new
of: null
implementation_of: adhere
why: "VERDICT new -- contract `adhere`, implementation_of: adhere. LennardJones is the 12-6 SHAPE of a\n\
  pairwise cell-cell mechanical-interaction contract the frozen 42 do NOT carry: a Lateral force over\n\
  live non-self cell pairs whose interaction range is set by the two cells' PHYSICAL RADII (contact\n\
  distance sigma = r_i + r_j, so the excluded-volume core and adhesive well track cell size as cells\n\
  grow and divide), reading a shared-or-per-cell interaction strength (epsilon), defined by a\nconserved\
  \ pair ENERGY whose autodiff gives the force. LJ is an ADHESIVE member -- a hard r^-12 core\nminus a\
  \ 2 r^-6 tail, minimum -epsilon exactly at contact -- so `adhere` names it directly (the\nrepulsion-only\
  \ SoftSphere / Hertzian are the adhesion-off limit of the SAME signature). The six\nPairwisePotential\
  \ members (Morse, SoftSphere, Hertzian, Harmonic, LennardJones + the abstract\nparent) share ONE typed\
  \ signature and differ ONLY in the pair-energy law U(r); they collapse to\nONE contract with several\
  \ implementations, so soft_sphere / morse / hertzian / harmonic /\nlennard_jones are all implementation_of:\
  \ adhere. That is ONE new contract for the whole family, not\nsix -- the several-implementations-per-contract\
  \ result the ledger wants, NOT an inflated `new`\ncount. R4 forbids `of: adhere` (unregistered), so\
  \ this entry NAMES adhere only as the shared\nimplementation_of; promoting it is a separate step.\n\n\
  WHY NOT alias -- verified AT THE SOURCE. The nearest registered contract is attraction_repulsion,\n\
  and its NAME matches the pull-minus-push biology, which is the tempting alias the parent\npairwise_potential\
  \ + Morse + Hertzian + Harmonic entries all made. But rule 4 pins `of:` to the\nPROMOTED operator, and\
  \ src/plexus/operators/attraction_repulsion.py factually does not cover LJ:\n  - set=\"particle\", EMIT=\"\
  velocity\" (lines 28, 30): a hand-coded D'Orsogna self-propelled-particle\n    overdamped VELOCITY law,\
  \ not a cell energy differentiated into a force.\n  - REQUIRES_PARAMS=[\"sigma\"], self.sigma=float(params[\"\
  sigma\"]) (lines 32, 43): a single GLOBAL\n    scalar interaction length -- a free tuning knob, NOT\
  \ a per-pair contact distance.\n  - REQUIRES_TYPE_PROPS=[\"p\"], p indexed by node_type (lines 33, 61):\
  \ per-TYPE coupling, not a\n    per-cell / shared scalar.\n  - forward() reads pos / occ / edge_index\
  \ / node_type and NEVER reads radius (lines 52-61); it is\n    O(E) message passing on a neighbour graph,\
  \ with no energy, no virial, and no size-consistent\n    contact distance.\nSo attraction_repulsion\
  \ does NOT \"already IS\" this contract; asserting alias flatters the language\nby hiding a missing\
  \ capability -- the exact failure record.py names for `alias`. The alias-majority\nsiblings are the\
  \ mis-normalization (their own skeptics flagged refinement / new); I decline to\npropagate a false alias\
  \ for family cosmetics.\n\nWHY NOT refinement -- the honest closest alternative. One could keep a single\
  \ interaction contract\nand WIDEN attraction_repulsion to host LJ, paying the cost openly (cell_divide\
  \ / cell_grow set the\nprecedent that growing the declared read set is a costed widening). I reject\
  \ it because the widening\nis NOT bounded to a field or two: hosting LJ changes set (particle -> cell),\
  \ changes emit (a\nvelocity law -> an energy whose grad is the force), re-sources the interaction range\
  \ from a free\nglobal knob to a physical consequence of cell size (sigma = r_i + r_j read from radius),\
  \ swaps\nper-type programming for a per-cell coupling, and grows an energy output. That DELETES the\n\
  fixed-width, type-programmed D'Orsogna self-propelled-particle pattern-forming model that IS\nattraction_repulsion\
  \ and breaks every existing user of its global sigma / per-type p. Widening that\ndoes violence to the\
  \ contract's biology is exactly what the record distinguishes from a refinement\n-> `new`, and beyond\
  \ even a bounded refinement.\n\nWHY NOT new-per-shape / out_of_scope. Minting a SEPARATE contract for\
  \ the 12-6 shape (vs Morse's\nexponential well or the harmonic core) would inflate exactly the yield\
  \ this ledger measures; LJ\ndiffers from its siblings ONLY in U(r), an implementation detail below the\
  \ signature. And unlike\nNoForce (the identity element / absence of interaction), LJ is a real forward\
  \ interaction with a\npair map, radius-coupled separation reads, and a force output, so it is not out_of_scope.\
  \ The\nregistered near-misses beyond attraction_repulsion all lose their biology if widened: `separation`\n\
  is a mean-aggregated 1/|d|^2 boids steering nudge (no cell radius, no compact support, no energy);\n\
  `cohesion` is attraction-only steering; `squared_law` is a size-blind inverse-square with no soft\n\
  core -- turning any of them into a size-coupled, energy-defined hard-matter potential converts a\nsteering\
  \ heuristic into cell mechanics.\n\nI ALIGN WITH soft_sphere (order 15, new -> adhere, which survived\
  \ its skeptic dispute), not the\nalias majority: LJ has the IDENTICAL signature to SoftSphere and, being\
  \ adhesive, fits `adhere` even\nmore naturally than the repulsion-only SoftSphere does. Splitting the\
  \ family across alias /\nrefinement / new fractures the one pair-potential family -- either the whole\
  \ family is `adhere` or\nattraction_repulsion must widen, and it cannot widen without deleting the D'Orsogna\
  \ model.\n\nSCOPE / SOURCE. Rule 5, SOURCE wins: the paper's mechanics are Morse ONLY (p. 9 / p. 14\
  \ / Fig. 1d);\nLennardJones appears in NO paper experiment -- it is a code-only library alternative,\
  \ and a\nreimplementer targeting the paper would never instantiate it. Recorded as the source/paper\n\
  divergence. The per-cell VIRIAL PRESSURE the base also derives from this energy is NOT an output of\n\
  this interaction contract; it is the separate VirialStress entry's mechanism (it writes a `stress`\n\
  field), kept out of scope here, consistent with Morse / Hertzian / SoftSphere. The r_min 12-6 form\n\
  (well at contact, not the textbook 4-eps zero-crossing form), the whole-energy smooth C1 cutoff on\n\
  [1.5, 2.5]*sigma, the SUM-vs-MEAN combining rules, the safe_divide zero guards, and the 0.5\npair-double-count\
  \ factor are implementation properties of THIS member recorded in surprises, not\ncontract-level distinctions.\n"
