status: validated
module: src/plexus/operators/candidates/jax_morph_division.py
test: tests/test_jax_morph_division.py
evidence:
  oracle_run: diff_division
  diff_metric: |
    |p_hat_plexus - p_hat_oracle|, the absolute difference in the POOLED per-macro-step division
    hazard (dimensionless probability per alive cell per macro-step). For each engine
    p_hat = (committed divisions) / (eligible alive-cell-steps), pooled over M=48 independent
    seeds x 40 macro-steps at dt=1.0, division_rate=0.08 on the 4 anchor founders. With NO death
    and division_overflow==0 on every seed (verified; CAP=512 >> mean+4SD so the count never hits
    an array bound), each committed division is exactly one live-count increment, so p_hat is the
    maximum-likelihood Bernoulli hazard pooled over every eligible cell-step and is INVARIANT to
    the PRNG stream and to the 40-vs-41 recorded-frame convention -- the realization-independent
    invariant to diff a stochastic operator on, unlike the raw final count. Oracle:
    Model([MechanicalRelaxation(Morse), SaturatingCellGrowth, Division(n_space_dim=2)]) -- the
    authors' own anchor proliferation composition -- p_hat from the pooled count trajectory over
    48 jax PRNG keys (_oracle/runs/diff_division: reference.npz + summary.json; script
    _oracle/scripts/division.py). Plexus: config/atlas_jax/division.yaml run through the engine with
    cell_divide's occupancy tapped before/after every call to count (elig = live cells at the
    decision, committed = daughters woken that call); measured on the division-ONLY reduction,
    PROVEN count-neutral at seed 0 (full composition and division-only both give 124) because only
    cell_divide draws H.rng in this spec, so dropping relax/grow_radius leaves the division RNG
    stream bit-identical (log/atlas_jax/division/diff_plexus_summary.json; script
    _oracle/scripts/division_plexus.py). The hazard is a per-cell-step rate, so relax and growth --
    which move cells and grow radii but neither add nor remove cells -- cannot perturb it; both
    sides measure the SAME hazard map. Scope: this differ tests the HAZARD map (the one the open
    124-vs-82 discrepancy is about); volume_conservation/placement are corroborated separately by
    the anchor gyration (below), not by this count-based scalar.
  threshold: |
    3 * SE_pooled = 0.005225, with SE_pooled = sqrt(SE_oracle^2 + SE_plexus^2) and each
    SE = sqrt(p_hat*(1-p_hat)/eligible_cellsteps) (~46000-48000 eligible cell-steps per side ->
    SE ~ 1.22e-3, SE_pooled 1.74e-3). Pre-registered as the FORMULA 3*SE_pooled -- the standard
    sampling band for "the two engines draw from the same Bernoulli p" -- not a number picked after
    the result. At this M it resolves any hazard divergence >~6.7% relative, which catches every
    GROSS port defect that would produce a systematically different cell count: a doubled rate sits
    40 SE_pooled out, and a wrong dt, a draw applied to dead-or-already-divided slots, or a
    mis-scoped eligibility mask each shift p_hat by tens of percent. A tighter band (1 SE) would
    flag ordinary Monte-Carlo scatter between two INDEPENDENT PRNG stacks (jax vs torch) as
    disagreement -- the very confound that made the raw 124-vs-82 single count misleading. HONEST
    LIMIT: at M=48 this band does NOT resolve the O((lambda*dt)^2/2) ~ 0.003 gap between the exact
    hazard 1-exp(-lambda*dt) and its linear approximation lambda*dt; that specific subtlety is
    excluded on independent grounds -- the equations block shows BOTH engines carry the source's
    -expm1 law, and both pooled estimates independently match the analytic hazard 0.076884 to under
    one SE (a criterion the count-alone number cannot, which is why the triangulation is recorded).
  value: 0.00109115
  passed: true
  detail: |
    p_hat_oracle = 0.077787 (SE 1.22e-3; 3734 divisions / 48003 eligible cell-steps),
    p_hat_plexus = 0.076696 (SE 1.24e-3; 3528 divisions / 46000 eligible cell-steps).
    |diff| = 0.00109 = 0.63 * SE_pooled  <=  threshold 0.005225  -> PASS.
    Triangulation: both match the exact hazard 1-exp(-0.08*1.0)=0.076884 -- oracle +0.74 SE,
    plexus -0.15 SE (both < 1 SE) -- so the two engines agree with theory AND with each other.
    RESOLVES the known open discrepancy: the flagged 124-vs-82 final-count gap is RNG realization
    noise, NOT a wrong contract. The oracle final-count distribution (mean 81.8, SD 43.6, min 18,
    max 234 over 48 seeds) contains BOTH the smoke count 82 (z=+0.005) and the Plexus/anchor count
    124 (z=+0.97) as ordinary draws; Plexus seed 0 gives exactly 124 (the anchor's flagged value)
    and oracle seed 0 gives 82 (smoke) purely because the jax and torch PRNG streams differ. This
    is a Galton-Watson count whose SD (~44) is comparable to its mean (~82), so a single seed can
    never separate a wrong hazard from noise -- the pooled hazard can, and it agrees. The
    volume-conservation/placement maps (not exercised by the count-based hazard) are corroborated
    by the anchor gyration agreeing to ~9% (Plexus 3.52 vs reference 3.23). Acted ledger
    (log/atlas_jax/division/diag.json): cell_divide calls 41 / acted 33, grow_radius 41/41, relax
    41/33, seed_state 1/1, inert_operators [] -> valid_evidence true.
state_io_notes:
  reads:
  - position
  writes:
  - position
  maps:
  - hazard = per-cell Bernoulli event with probability p = 1 - exp(-clip(division_rate,0,inf)*dt) on a
    fixed capacity buffer; a committed divider wakes one free slot, the daughter inherits every heritable
    field and resets the rest to default; a division past capacity is dropped (registered cell_divide
    stops when the buffer is full, jax-morph drops-and-tallies into division_overflow)
  - volume_conservation = both daughters take radius r*m with m = 2^(-1/d) (n_space_dim sets the exponent),
    halving the mother's d-volume into two equal daughters -- vs registered cell_divide's mass-doubling,
    where the daughter inherits the mother's radius unchanged
  - placement = daughter offset by the NEW radius r*m along dir = normalize(orientation_snr*a_hat + isotropic_unit_RMS_noise),
    so the two daughters end exactly just-touching (centre gap 2*r*m = sum of radii); orientation_snr=0
    or a zero division_axis falls back to isotropic placement
  - lineage = a born flag plus the mother parent-slot index recorded on the woken slot (sentinel -1 elsewhere),
    reconstructing clonal ancestry that the registered birth flag alone cannot
