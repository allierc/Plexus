      '
    threshold: '3.0e-3 (max-abs, gene-concentration units). Chosen BEFORE the cross-run comparison from
      solver

      physics, not from the observed number. Both sides evaluate the identical vector field, so the

      only possible disagreement is substep-sequence jitter between two independent adaptive Dopri5

      controllers (diffrax PIDController vs the operator''s hand-rolled I-controller), each bounded by

      its truncation-from-truth at rtol=1e-4. The reference''s own worst-case distance from a

      machine-accuracy (rtol=1e-10) endpoint is MEASURED at 9.9e-4 (dt=2, config A, summary.json); by

      the triangle inequality two such rtol=1e-4 integrations agree to within ~2e-3, so 3e-3 (~3x the

      measured reference truncation) is the tightest bound a correct operator with a legitimately

      different adaptive integrator can be held to. A tighter 1e-3 would risk a false fail from

      integrator jitter alone -- the criterion-no-valid-config-can-meet trap. The pre-registered

      negative control (drop the /dt mean-rate conversion: endpoint = g0 + delta) lands O(0.1) away at

      dt=2, so 3e-3 still rejects a genuine wiring bug by >30x.

      '
    value: 2.220446049250313e-16
    passed: true
    result: 'PASS by ~13 orders of magnitude. D_max = 2.2e-16 (machine epsilon) << threshold 3e-3, so
      the

      verdict does NOT hinge on the threshold choice -- it holds under any principled bound down to

      float64 roundoff. net-equality = 0.0 (the torch MLP reproduces the exported JAX MLP EXACTLY),

      so the field is bit-identical and the endpoint agreement is the INTEGRATOR. Notably

      plexus_vs_truth == reference_vs_truth to ~15 digits (dt=2/A: 9.8942968251614e-4 vs

      9.8942968251636e-4): both adaptive Dopri5 controllers -- diffrax PIDController and the operator''s

      hand-rolled I-controller -- take the SAME accept/reject substep sequence on this field, so they

      diverge from machine-truth IDENTICALLY and from each other by ~0. The pre-registered negative

      control (drop the /dt mean-rate conversion) lands 0.408 (A) / 0.252 (B) from the reference at

      dt=2 -- >100x the threshold -- confirming the metric would catch a genuine wiring error. Driver

