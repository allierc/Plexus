  summary: 'One Euler-Maruyama step of overdamped Langevin (Brownian) dynamics. It moves cell positions
    by a dt-scaled displacement = deterministic drift down the potential''s force field plus Gaussian
    thermal noise, and records that displacement so the same step can be replayed pathwise or scored.
    It is a DYNAMIC step: it returns a sparse position *delta* (dt-scaled increment) that the model accumulates,
    not an absolute position. With kT=0 the noise vanishes and it degenerates to a single gradient-descent
    relaxation step (learning rate dt/gamma); with potential=None the drift vanishes and it is a free
    Brownian gas (pure noise).'
  equations: "Update (code): dx = mean + std * xi, applied as a delta to position, with\n  mean = dt *\
    \ F(state) / gamma,  where F = potential.forces(state) = -grad U  (forces already carry the minus\
    \ sign),\n  std  = sqrt(2 * kT * dt / gamma),\n  xi ~ N(0, I) standard normal, shape (capacity, n_space_dim).\n\
    i.e. dx = -(grad U / gamma) * dt + sqrt(2 kT dt / gamma) * xi  (the docstring's Euler-Maruyama form).\
    \ NOTE the split dt-scaling: drift ~ dt (linear), noise ~ sqrt(dt) (Wiener increment). Score (logp):\
    \ sum over ALIVE cells and dims of gaussian_logp(dx; mean, std), where\n  gaussian_logp(x, mean, std)\
    \ = -0.5*((x-mean)/std)^2 - log(std) - 0.5*log(2*pi)\n  (a fully-normalized Gaussian log-density).\
    \ It scores the recorded realized dx, not xi.\n  If std == 0 (kT == 0, deterministic) the contribution\
    \ is masked to 0 (degenerate delta,\n  no finite density) instead of dividing by zero.\nSymbols: U\
    \ = interaction potential energy (Morse etc.); F = per-cell force -grad U;\n  gamma = translational\
    \ drag; kT = thermal energy (temperature); dt = macro-step size;\n  xi = exogenous standard-normal\
    \ noise; N = number of live cells; capacity = padded array size.\nPAPER FORM (contrast): the paper\
    \ writes no Langevin/Euler-Maruyama equation; its relaxation is\n  deterministic 'gradient descent\
    \ energy minimization of the Morse potential for a fixed number\n  of steps' (p. 14) = the kT=0 special\
    \ case of the above."
  params:
    potential: 'interaction_potential -- source of the mechanical drift; its forces(state) = -grad U give
      the deterministic drift. Pass None -> NoForce (a free Brownian gas: pure noise, no drift).'
    n_space_dim: spatial_dimension (static) -- sizes the trailing dim of the recorded xi/dx trace arrays
