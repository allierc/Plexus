- id: no_force
  order: 12
  raw_name: NoForce
  raw_kind: potential (Potential)
  code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L108
  paper_section: p. 3, Fig. 1d (the mechanical-interaction slot; the paper fills it only with Morse)
  summary: 'The trivial (null) interaction potential: total energy is identically zero and every cell
    feels zero force, so it leaves positions untouched. It is the neutral default the position-moving
    steps resolve ``potential=None`` to - a free Brownian / active-Brownian gas, or a no-op mechanical
    relaxation - and the natural base for active-matter / flocking models whose only coupling lives in
    a separate step (e.g. a neighbour-alignment torque).'
  equations: "Let x be the (capacity, d) position array and i index a cell. NoForce defines\n  U(x, state)\
    \ = 0                       (total interaction energy, a scalar constant)\n  F_i = -grad_{x_i} U =\
    \ 0  for all i    (per-cell force, shape (capacity, d))\nIn the source: ``total_energy`` returns ``jnp.asarray(0.0)``\
    \ (a scalar, ignoring both positions and state); ``forces`` is OVERRIDDEN to return ``jnp.zeros_like(state.position)``\
    \ directly rather than autodiffing the zero energy. Symbols: x = state.position, d = n_space_dim,\
    \ U = total interaction energy, F_i = force on cell i. Same as the code; the paper writes no NoForce\
    \ (its only potential is the Morse energy U(r) = eps[(1 - exp(-alpha(r - sigma)))^2 - 1], p. 3 / Methods)."
  params: {}
  state_io:
    reads: []
    writes: []
  verdict: out_of_scope
  of: null
  why: 'OUT_OF_SCOPE: NoForce carries no biological content. It is the null / identity element of the

    mechanical-interaction slot -- the value ``potential=None`` resolves to inside BrownianDynamics,

    ActiveBrownianDynamics2D, MechanicalRelaxation and relax_equilibrium (each does

    ``potential if potential is not None else NoForce()``). Its energy is the constant 0 and its force

    is identically zero; it has no parameters, reads no field values, contributes no leaves to the

    model pytree, and has no counterpart in the paper (the paper''s cells ALWAYS interact via the Morse

    pair potential, Fig. 1d). It is a software null-object -- framework plumbing so a position-integrator

    step always has a ``Potential`` object to call -- not a forward operation on state.


    DECISIVE TEST in the Plexus algebra: "no mechanical interaction" is the EMPTY COMPOSITION -- a

    pipeline that includes zero interaction operators -- i.e. the identity of operator composition. An

    algebra need not register its identity element as an operator; you get it for free by composing

    nothing. jax-morph must materialize NoForce only because its ``Potential`` slot has to be filled by

    SOME object; a Plexus model expresses the same free / non-interacting regime by omitting the

    interaction operator entirely. Nothing in the promoted vocabulary is gained or missing here.


    CLOSEST registered contract: the lateral/interaction pairwise-force slot -- ``attraction_repulsion``

    (with ``cohesion`` / ``separation``), the home the paper''s Morse potential and its SoftSphere /

    Hertzian / Harmonic / LennardJones siblings will normalize to. NoForce is NOT an implementation_of

    that contract: it has no pairwise neighbour map, reads no separations, and emits zero -- it is the

    ABSENCE of the interaction, not a member of it. It also cannot be `alias` or `refinement`: there is

    no registered no-op / identity contract to alias, and widening any interaction contract to admit

    "reads nothing, writes zero, no map" would erase the pairwise force that IS that contract. And not

    `new`: registering a do-nothing operator would inflate the atlas yield with content-free plumbing
    --

    exactly what out_of_scope exists to prevent (R7 already flags a writes-nothing operator as an

    undetectable no-op; the ``contract.writes: [position]`` below is only the formal force-slot the

    potential drives, carrying an identically-zero increment, mirroring the StochasticStep out_of_scope

    entry whose ``contract.writes: [trace]`` is likewise a formal, not a persistent, write).


    STRONGEST COUNTERARGUMENT (and why it loses): in an operator ALGEBRA the identity element is a

    first-class member, and NoForce is type-level interchangeable with Morse (same ``Potential``

    protocol, consumed by the same integrator steps), so one could record it as the degenerate

    implementation_of the pairwise-interaction contract rather than dismiss it as plumbing -- a view

    that captures the real modeling affordance that jax-morph represents "no coupling" as a value of

    the same type as "Morse coupling" (the base for active-matter / flocking models whose only coupling

    lives in a separate alignment step). It loses because the biological measurement counts CONTRACTS,

    not type slots: NoForce reads nothing, writes nothing real, carries no map or parameters, and is

    never constructed in the paper -- it is the ``potential=None`` sentinel, which Plexus realizes by

    omitting the operator, so there is no forward mechanism here to normalize.

    '
  contract:
    name: no_interaction
    kind: lateral
    family: interaction
    set: cell
    inputs:
    - cell
    outputs:
    - cell
    reads: []
    writes:
    - pos
    maps: []
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
  surprises:
  - 'NOT IN THE PAPER. The paper''s cells ALWAYS interact via a pairwise Morse potential (p. 3, Fig. 1d:
    repulsion for excluded volume, attraction for adhesion). NoForce has no paper / biological counterpart
    - it is a library engineering affordance (a null Potential) for active-matter base models where the
    coupling lives elsewhere. A reimplementer mapping the paper 1:1 would never produce it.'
  - '``forces`` is deliberately OVERRIDDEN to return zeros directly instead of inheriting the base ``forces``
    (which autodiffs ``total_energy``). Both give zero, but the override skips building and differentiating
    the energy graph. NB: NoForce is a direct ``Potential`` subclass (not ``PairwisePotential``), so its
    own ``total_energy`` is a bare ``0.0`` with no pairwise sum - the class docstring''s "skipping the
    dense O(N^2) pairwise sum" describes the general motivation, not this class''s own energy (there is
    no sum here to skip). The real cost avoided is the grad trace.'
  - 'NoForce is almost never constructed by name: it is what ``potential=None`` resolves to inside ``BrownianDynamics``,
    ``ActiveBrownianDynamics2D``, ``MechanicalRelaxation``, and ``relax_equilibrium`` (each does ``potential
    if potential is not None else NoForce()``). Miss that None-mapping and you lose the free-gas / no-op-relaxation
    default.'
  - It is parameterless - an ``eqx.Module`` with no fields, hence no tunable knobs. There is nothing to
    differentiate through and nothing to optimize; it contributes no leaves to the model pytree.
  - '``total_energy`` returns a scalar ``jnp.asarray(0.0)`` at the default dtype (float32 unless x64 is
    enabled; the test suite enables x64), whereas ``forces`` returns ``zeros_like(state.position)`` which
    inherits position''s exact shape and dtype. A hand-rolled version that returned a scalar or a wrong-dtype
    array from ``forces`` would break the ``dt * forces / gamma`` drift broadcast.'
  - 'Under ``MechanicalRelaxation`` the no-op is realized through the GENERAL FIRE path, not a special
    case: because ``grad U = 0`` everywhere the residual is 0 <= f_tol at iteration 0, so the ``while_loop``
    body never runs and positions pass through unchanged. ``relax_equilibrium`` also has an explicit ``if
    potential is None`` short-circuit, but the step stores an actual ``NoForce()`` (not None) and relies
    on the loop''s immediate convergence instead.'
  state_io_notes:
    writes:
    - position
- id: pairwise_potential
  order: 13
  raw_name: PairwisePotential
  raw_kind: potential (Potential)
  code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L128
  paper_section: p. 9, 'Mechanical interactions', eq. V_ij(r) (also fig. 1d; SI p. 14 'Mechanical Interactions')
  summary: 'The abstract base for every soft-matter pair interaction. Given a subclass''s elementwise
    pair_energy(r, *params) and per-pair pair_params(state), it derives the cluster''s total interaction
    energy (dense N x N, half-summed over live non-self pairs so each unordered pair counts once), the
    per-cell forces (-grad of that energy w.r.t. position, by autodiff -- no jax-md), and the per-cell
    virial pressure. It touches NO state field of its own: it is a read-only energy/force/pressure provider
    that a moving step (relaxation / Brownian) or a stress step consumes. Couplings (epsilon, alpha, k,
    ...) resolve from a shared scalar or a per-cell field, symmetrised per pair by mix (the arithmetic
    mean); the contact distance uses a separate additive rule sigma = r_i + r_j so interactions stay size-consistent
    as cells grow.'
  equations: "Given a subclass's pair energy U(r; p_1..p_k) and pair_params(state) -> (p_1..p_k), each\
    \ an\n(N,N) matrix broadcastable with r:\n\n  separation:    r_ij = safe_norm( displacement(pos_i,\
    \ pos_j) )         # (N,N); 0 on the i==i diagonal\n  total energy:  E    = 0.5 * sum_i sum_{j !=\
    \ i, alive_i & alive_j} U(r_ij; p_ij)\n                        # neighbor_sum masks self & dead pairs;\
    \ the 0.5 dedups the symmetric double count\n  forces:        F_i  = -dE / d(pos_i)              \
    \                    # jax.grad, inherited from Potential; NO jax-md force law\n  virial press.: p_i\
    \  = -(1 / (2 d V_i)) * sum_{j != i, alive} r_ij * (dU/dr)(r_ij) * alive_i\n                     \
    \   # Irving-Kirkwood one-half bond split; d = n_space_dim;\n                        # V_i = 2 r_i\
    \ (d=1) | pi r_i^2 (d=2) | 4/3 pi r_i^3 (d=3); dead cell -> 0\n  coupling:      shared scalar c  \
    \      -> broadcast_to (N,N)\n                 per-cell field spec f  -> mix( state.f )\n  mix (default):\
    \ M_ij = 0.5 (v_i + v_j)                                 # arithmetic mean: no sqrt -> finite grad\
    \ at 0/dead cells\n\nConcrete Morse (paper eq., p.9) -- the one instance the paper actually describes:\n\
    \  U(r) = eps * [ (1 - exp(-alpha (r - sigma)))^2 - 1 ],   sigma = r_i + r_j\nIn code (Morse.pair_energy)\
    \ this is additionally multiplied by a sigma-relative smooth cutoff\nthat the paper's V_ij does not\
    \ mention.\n"
  params:
    (base class has no constructor fields): PairwisePotential is abstract -- it declares no eqx fields;
      all tunables live on the concrete subclasses (Morse.epsilon/alpha, SoftSphere.epsilon, Harmonic.k,
      ...). The three entries below are the mechanism's actual tunable surface.
    pair_energy: 'extension_point (method): the elementwise interaction-energy law U(r, *params) -> (N,N);
      abstract here (raises NotImplementedError). Sets the potential shape (repulsive core / adhesive
      tail).'
    pair_params: 'extension_point (method): builds the per-pair (N,N) parameter matrices from state (e.g.
      sigma = r_i + r_j, epsilon, alpha); abstract here. Where a coupling becomes size-consistent.'
    mix: 'pair_combination_rule: turns a per-cell coupling v (N,) into a symmetric per-pair coupling 0.5(v_i
      + v_j); default arithmetic mean, overridable (e.g. geometric mean / Lorentz-Berthelot).'
    coupling (epsilon/alpha/k/...): 'interaction_coupling: each subclass coupling is EITHER a shared scalar
      (broadcast to every pair) OR a per-cell StateFieldSpec of shape () read from state and mixed per
      pair; per-type or per-cell ARRAYS are rejected by __check_init__.'
  state_io:
    reads:
    - position
    - alive
    - radius
    - displacement
    - n_space_dim
    - <coupling field>
    writes: []
  surprises:
  - 'SOURCE vs PAPER: the paper (Methods, p. 9, line 498) says ''JAX-MD was used to perform molecular
    dynamics simulations for cell mechanics'', but the source computes forces by autodiff of the energy
    with NO jax-md dependency (module docstring: ''forces come from autodiff of the energy, with no jax-md
    dependency''). SOURCE WINS -- a reimplementer trusting the paper would pull in jax-md and a hand-coded
    force law this code deliberately avoids.'
  - 'The 0.5 in total_energy is a DOUBLE-COUNT dedup, not a bond split: neighbor_sum already sums every
    ordered (i,j) with j!=i, and U is symmetric, so each unordered pair appears twice; the 0.5 corrects
    it. Drop it and you double both energy AND force.'
  - 'virial_pressure''s factor of 2 is a DIFFERENT 1/2: it is the Irving-Kirkwood one-half bond split
    (each pair''s virial shared between its two cells), NOT the total_energy double-count dedup (there
    neighbor_sum already gives cell i its full per-cell virial). Conflating the two halves is easy and
    wrong.'
  - mix is the ARITHMETIC mean 0.5(v_i+v_j), not the geometric / Lorentz-Berthelot mean standard in MD.
    Chosen for a finite gradient everywhere (no sqrt at zero / dead cells under the always-on jax_debug_nans).
    The additive contact rule sigma = r_i + r_j is a SEPARATE convention the subclasses apply in pair_params,
    not routed through mix.
  - Couplings are restricted to a shared scalar OR a per-cell scalar StateFieldSpec; per-TYPE and per-cell
    ARRAYS are rejected at construction (__check_init__). So heterotypic adhesion (the paper's type x
    type 'cadherin' matrix, p. 20) cannot be an arbitrary type-type interaction matrix here -- it must
    be encoded as a per-cell scalar field, and every pair coupling is then forced to be the MEAN of two
    per-cell values. A real expressiveness limit vs the paper's differential-adhesion story.
  - pair_energy is evaluated on the i==i diagonal (r=0 via safe_norm) and on dead-dead padded pairs even
    though neighbor_sum masks them out of the SUM -- and jax.grad still flows through those masked entries.
    So every subclass MUST be value- AND gradient-safe at r=0 (LJ uses safe_divide(sigma, r); the compact
    repulsions use a double-where). A naive 1/r would NaN under debug_nans despite the mask.
  - forces() lives on the Potential base (line 84), so PairwisePotential inherits force = -jax.grad(total_energy).
    Any custom energy (not just pairwise) can subclass Potential directly and get forces for free; NoForce
    (line 108) overrides forces to zeros to skip the O(N^2) autodiff entirely.
  verdict: alias
  of: attraction_repulsion
  implementation_of: attraction_repulsion
  why: 'ALIAS of `attraction_repulsion`. PairwisePotential is the ABSTRACT base for the paper''s

    soft-matter pair interactions -- not itself a force law (its pair_energy raises

    NotImplementedError) but the shared machinery every concrete pair potential inherits. It turns

    a subclass''s conservative pair energy U(r; p) into (i) the cluster total interaction energy

    (dense N x N, half-summed over live non-self pairs so each unordered pair counts once) and (ii)

    per-cell forces F_i = -grad_i E by autodiff. That is exactly attraction_repulsion''s biology: a

    pairwise radial cell-cell interaction -- a repulsive core (excluded volume) with an optional

    adhesive tail (cell-cell adhesion) -- whose force is the gradient of a conservative radial

    potential. attraction_repulsion hand-codes its two-Gaussian force f(r)*(pos_j - pos_i);

    PairwisePotential writes the energy and autodiffs it. Same contract, two realizations of the

    one conservative radial pair force.


    The concrete members -- Morse (order 14), SoftSphere (15), Hertzian (16), Harmonic,

    LennardJones -- are interchangeable force-law SHAPES over this one contract; each concrete

    subclass is implementation_of: attraction_repulsion (Morse carries BOTH terms and is the

    canonical member; SoftSphere / Hertzian are the purely-repulsive limit). This

    several-implementations-per-contract pattern is the GOOD result the registry exists to hold,

    not a missed contract. Morse''s own entry already records this reading and cites this parent.


    NOT `refinement`: no field of attraction_repulsion''s signature is FORCED to change. (1)

    energy -> autodiff-force versus a hand-coded force is an implementation STRATEGY, not a

    contract -- stillinger_weber is itself an energy-defined interaction in this same

    lateral/interaction family, so "write an energy and differentiate it" does not by itself mint

    or widen a contract. (2) The per-cell coupling reads (a shared scalar OR a per-cell scalar

    epsilon / alpha / k symmetrised per pair by the arithmetic-mean mix; the additive contact rule

    sigma = r_i + r_j read from radius) are default-compatible and break no existing user, so they

    are not a costed widening. (3) The dense O(N^2) half-sum versus a neighbour-graph reduction is

    the same range / pair-topology axis squared_law already carries (all_pairs vs the radius_graph

    neighbour list) and on which attraction_repulsion already truncates via its radius_graph map.


    NOT `new`: attraction_repulsion already IS the pairwise attraction-repulsion contract; minting

    a second contract for the base machinery would inflate exactly the yield this ledger exists to

    measure.


    NOT `out_of_scope`: unlike NoForce (order 12, the identity / ABSENCE of interaction, which

    reads nothing and emits zero), PairwisePotential is the real forward interaction -- it has a

    pair map, reads separations and couplings, and produces the force that drives motion. Its

    abstractness (no own pair_energy) is WHY it is the contract rather than a single

    implementation, not evidence that it is mere plumbing.


    SCOPE / SOURCE notes. (a) The per-cell VIRIAL PRESSURE the base also derives from the same

    energy is NOT an output of THIS interaction contract; it is the separate VirialStress entry

    (order 20), which writes a `stress` field -- kept out of scope here, consistent with the Morse

    entry. (b) forces() itself lives on the Potential base (line 84), not on PairwisePotential;

    any custom energy can subclass Potential and inherit -grad forces for free (NoForce overrides

    it to zeros). That inheritance is engine machinery, not a second contract. (c) The coupling

    restriction -- a shared scalar OR a per-cell SCALAR field only; per-type and per-cell ARRAY

    couplings rejected at __check_init__ -- is a real EXPRESSIVENESS limit of this implementation

    against the paper''s type x type cadherin adhesion matrix (Fig. S1); recorded in surprises as

    an implementation weakness, not a contract change (an override of mix() or an external epsilon

    route would supply the matrix). (d) SOURCE vs PAPER (rule 5): the paper (p. 9) says JAX-MD

    performs the mechanics, but the source derives forces by autodiff with NO jax-md dependency

    (surprises). SOURCE WINS; it does not change the verdict -- either way it is the same pairwise

    cell-cell interaction.

    '
  contract:
    name: attraction_repulsion
    kind: lateral
    family: interaction
    set: cell
    inputs:
    - cell
    outputs:
    - cell
    reads:
    - pos
    - radius
    - alive
    - displacement
    - coupling
    writes:
    - pos
    maps:
    - pairwise
    - contact
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
  state_io_notes:
    reads:
    - position
    - coupling field (shared scalar OR per-cell scalar field, e.g. epsilon / alpha / k), symmetrised per
      pair by the arithmetic-mean mix rule
    writes:
    - position
    maps:
    - pairwise radial interaction over live non-self pairs (dense N x N, half-summed so each unordered
      pair counts once); force on each cell = -grad of a conservative radial pair energy by autodiff,
      the concrete well SHAPE supplied by a subclass's pair_energy (repulsive core +/- adhesive tail)
    - contact distance sigma = r_i + r_j (additive, size-consistent as cells grow); a per-cell coupling
      symmetrised per pair by the arithmetic-mean mix; a conservative radial pair force integrated overdamped
      or minimised by the wrapping motion step
- id: morse
  order: 14
  raw_name: Morse
  raw_kind: potential (PairwisePotential)
  code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L269
  paper_section: p. 9 (Methods, 'Mechanical interactions', eq. V_ij(r), lines 514-520); restated p. 14
    (SI, 'Mechanical Interactions'); fig. 1d (repulsive core = volume exclusion, attractive tail = cell-cell
    adhesion)
  summary: An interaction ENERGY, not a state-writing step. It evaluates a Morse pair potential over every
    live, non-self pair -- a repulsive core plus an adhesive tail with its minimum -epsilon at the contact
    distance sigma = r_i + r_j -- and sums it into the scalar total interaction energy; the base class
    turns that into per-cell forces (autodiff of the energy) and per-cell virial pressure. Morse itself
    writes NOTHING to state; a wrapping step (MechanicalRelaxation, BrownianDynamics, VirialStress) consumes
    total_energy / forces / virial_pressure and moves positions or records stress. The code multiplies
    the well by a sigma-relative smooth cutoff on [1.5*sigma, 2.5*sigma] that the paper's written formula
    does not have.
  equations: "Indices: i, j range over state-array slots (0..capacity-1); r_ij = |displacement(pos_i,\
    \ pos_j)|.\n\nPer-pair parameters (Morse.pair_params):\n    sigma_ij = radius_i + radius_j       \
    \   # contact distance = well minimum (ADDITIVE rule)\n    eps_ij   = coupling(epsilon)          \
    \  # scalar -> broadcast (N,N); StateFieldSpec -> mix()\n    alpha_ij = coupling(alpha)          \
    \    # scalar -> broadcast (N,N); StateFieldSpec -> mix()\n    mix(v)_ij = 0.5*(v_i + v_j)       \
    \      # arithmetic mean for a per-cell coupling (NOT for sigma)\n\nElementwise Morse energy with\
    \ cutoff (Morse.pair_energy):\n    e_ij    = 1 - exp(-alpha_ij * (r_ij - sigma_ij))\n    U_ij    =\
    \ eps_ij * (e_ij^2 - 1)         # = eps*(1 - exp(-alpha(r-sigma)))^2 - eps\n    Ucut_ij = U_ij * S(r_ij;\
    \ r_on = 1.5*sigma_ij, r_off = 2.5*sigma_ij)   # <-- cutoff NOT in paper\n    U(sigma) = -eps (well\
    \ minimum);  U(r -> inf) -> 0 already (e -> 1), the cutoff truncates the tail.\n\njax-md multiplicative_isotropic_cutoff\
    \ S (helper _smooth_cutoff, C1 in value and 1st derivative):\n    S(r) = 1                       \
    \                                         for r <= r_on\n         = (r_off^2 - r^2)^2 (r_off^2 + 2\
    \ r^2 - 3 r_on^2) / (r_off^2 - r_on^2)^3   for r_on < r < r_off\n         = 0                    \
    \                                            for r >= r_off\n\nReductions inherited from PairwisePotential:\n\
    \    E(positions, state) = 0.5 * sum_i sum_{j!=i, alive} Ucut_ij      # 0.5 counts each pair once\n\
    \    forces(state)       = -grad_positions E                          # autodiff, shape (N, dim)\n\
    \    p_i (virial)        = -(1/(2 d V_i)) * sum_{j!=i,alive} r_ij (dU/dr)(r_ij)   # V_i = d-ball volume(radius_i)\n\
    \nPaper form (p. 9 / p. 14), IDENTICAL to U_ij but with NO cutoff factor:\n    V_ij(r) = eps_ij [1\
    \ - exp(-alpha_ij (r_ij - sigma_ij))]^2 - eps_ij\nThe CODE is authoritative: it adds the [1.5*sigma,\
    \ 2.5*sigma] smooth cutoff the paper omits.\n"
  params:
    epsilon: well depth (energy scale) -- how deep the adhesive well / how strong the interaction; at
      contact V = -epsilon. Shared scalar (default 3.0) or a per-cell StateFieldSpec combined per pair
      by the arithmetic-mean mix(). This is the knob the paper's adhesion example learns (epsilon_ij set
      by regulated cadherin concentration).
    alpha: well steepness / inverse interaction range -- larger alpha narrows the well (steeper, shorter-range
      interaction), smaller alpha widens the attractive tail. Shared scalar (default 2.8) or per-cell
      StateFieldSpec, mixed by arithmetic mean.
    r_onset_frac: interaction-range onset, as a multiple of the contact distance sigma. Below r_onset_frac*sigma
      the energy is untouched (S=1). Default 1.5. Pure numeric field (never per-cell).
    r_cutoff_frac: interaction-range end, as a multiple of sigma. Beyond r_cutoff_frac*sigma the energy
      is exactly 0 (S=0). Default 2.5. Construction requires r_onset_frac < r_cutoff_frac (_check_config).
  state_io:
    reads: 'position (the (N,dim) positions the energy is evaluated at, passed by the wrapping step);
