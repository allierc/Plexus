- id: saturating_cell_growth
  order: 9
  raw_name: SaturatingCellGrowth
  raw_kind: step (SimulationStep)
  code_path: papers/jax-morph/jax_morph/physics/growth.py:L23
  paper_section: p. 9 Methods "Cell Growth" eq. Ri(t+dt)=min(Ri(t)+dR, Rmax); restated p. 14
  summary: Dynamic step. For each cell it grows the per-cell radius toward the module target max_radius
    by the exact closed-form flow of a saturating (von Bertalanffy) law dr/dt = k*(1 - r/R), where the
    rate k is read per cell from the growth_rate state field. It returns a sparse, dt-scaled delta on
    radius only; growth is fastest at small r and relaxes to zero as r approaches max_radius.
  equations: "Code (authoritative) -- the exact flow of the linear ODE dr/dt = k*(1 - r/R):\n  decay =\
    \ exp(-growth_rate * dt / max_radius)\n  dr    = (max_radius - radius) * (1 - decay)\nreturned as\
    \ state.deltas(radius=dr). Symbols: r = per-cell radius (state field radius);\nk = per-cell growth_rate\
    \ (state field, default 0); R = max_radius (module param);\ndt = macro-step duration. As dt grows\
    \ the increment saturates at (R - r), so r\napproaches but never overshoots R for k >= 0, and no min/clamp\
    \ is used.\nPaper (Methods, stated twice): Ri(t+dt) = min(Ri(t) + dR, Rmax) -- a CONSTANT\nincrement\
    \ dR per step (linear growth) with a hard min clamp at Rmax. The code does\nNOT implement that constant-rate-plus-min\
    \ law; it implements the saturating\nexponential relaxation above. Per the loop rule the code wins;\
    \ the disagreement is\nrecorded under surprises.\n"
  params:
    max_radius: asymptotic_target_size
  state_io:
    reads:
    - radius
    - growth_rate
    writes:
    - radius
  surprises:
  - 'Paper/code contradiction (the most important thing here). The paper specifies

    CONSTANT-rate linear growth with a hard min clamp -- Ri(t+dt)=min(Ri+dR,Rmax),

    Methods "Cell Growth" twice, plus the intro "cells grow at a fixed rate until

    reaching a maximum radius". The code implements a SATURATING von Bertalanffy law

    dr/dt=k(1-r/R) with NO clamp (saturation is intrinsic). Different trajectories: the

    paper radius grows at constant speed then stops abruptly at Rmax; the code radius

    decelerates smoothly toward R and asymptotes. A reimplementer following the paper

    would produce the wrong dynamics.

    '
  - 'The growth rate is NOT a constructor parameter. growth_rate is a per-cell STATE

    FIELD (module-level spec GROWTH_RATE, heritable=True, default 0.0), designed to be

    rewritten each macro-step by an upstream controller (gene network / MLP) so

    gradients flow through it from a morphology objective. Default 0 means no growth

    unless a rate is supplied. The sole constructor param is max_radius (default 1.0; a

    jax.Array makes it a traced, optimizable target).

    '
  - 'The increment is the EXACT flow of the linear law, not forward Euler. A naive Euler

    reimplementation dr = k*(1 - r/R)*dt would differ numerically and can overshoot for

    large dt; the closed form dr=(R-r)*(1-exp(-k*dt/R)) is unconditionally stable and

    monotone for any dt and any k >= 0.

    '
  - 'dt-scaling is baked into the returned delta (the exponential already contains dt).

    This is a DYNAMIC step: the model sums its delta with any other radius writers and

    does NOT re-scale by dt afterward. The exact-flow property holds only while this is

    the sole dynamic writer of radius; with a co-writer it degrades to a stable

    operator-split contribution (still additive).

    '
  - 'GROWTH_RATE is exported from the module so a separate control step can declare the

    SAME spec and remain merge-compatible; heritable=True means a daughter inherits the

    mother''s growth propensity on division unless a controller overwrites it.

    '
  verdict: refinement
  of: cell_grow
  implementation_of: cell_grow
  why: "Refinement of `cell_grow`, the registered growth primitive. Same biology -- a cell grows\ntoward\
    \ a maximum size by a SATURATING growth law -- so this is NOT `new`: promoting a second\ngrowth contract\
    \ would inflate the yield the ledger exists to measure. But it does not fit\ncell_grow's REGISTERED\
    \ signature, so it is not a clean `alias`/drop-in implementation either;\nthe signature must WIDEN,\
    \ and a refinement nobody costed is a breaking change.\n\nWHAT WIDENS (the typed signature fields):\n\
    \n- kind: structural -> field (delta-emitting). Registered cell_grow is `structural`\n  (EMIT=None,\
    \ forward() returns {}): it advances a rest-VOLUME multiplier grow_V by a\n  logistic law and REALIZES\
    \ it by waking dormant MPM reserve particles in place. This\n  mechanism is a DYNAMIC per-cell relaxation\
    \ that emits an integrable delta on `radius`\n  (dr = (R-r)(1-exp(-k*dt/R))) and mutates no state\
    \ directly. Admitting it flips the kind,\n  and that BREAKS the invariant every current cell_grow\
    \ user relies on -- that growth is\n  structural and contributes NOTHING to the dynamic-phase delta\
    \ accumulation. Any co-writer\n  of the size field must now operator-split with growth.\n\n- outputs\
    \ / writes: {} + grow_V + child particle occ  ->  an additive delta on `radius`, a\n  geometric size\
    \ scalar carried by a point/soft-sphere cell. The realization is a scalar\n  radius, not MPM reserve\
    \ particles, so the contract can no longer REQUIRE an mpm_particle\n  `child` with a grow_reserve\
    \ pool.\n\n- reads / params: the growth RATE moves from a constructor scalar `rate` to a per-cell\n\
    \  HERITABLE STATE FIELD `growth_rate` (default 0), read each macro-step so an upstream\n  controller\
    \ (gene network / MLP) can drive it and gradients flow back from a morphology\n  objective. That differentiable,\
    \ per-cell, controllable rate is the whole design point.\n\n- maps (growth law): generalizes from\
    \ logistic-only (dV/dt = rate*V*(1-V/target)) to a\n  family of saturating laws including the von\
    \ Bertalanffy EXACT flow used here\n  (dr/dt = k(1-r/R), integrated in closed form -- unconditionally\
    \ stable, monotone, no\n  min/clamp). This one is additive and breaks nothing.\n\nCLOSEST-CONTRACT\
    \ check: cell_grow is unambiguously the closest registered contract (the only\nother growth-family\
    \ op is cell_divide, which is TOPOLOGY, not size). Widening cell_grow does\nless violence than minting\
    \ a new contract: cell_grow's own contract already declares the\ndiscretisation swappable and the\
    \ growth LAW the invariant, and a scalar radius on a\npoint-cell is exactly 'another discretisation'\
    \ of the same cell-growth biology -- so it\nbelongs to the SAME contract, refined, not a fresh one.\n\
    \nSOURCE-vs-PAPER (recorded in surprises, rule 5): the paper's Methods state constant-rate\nlinear\
    \ growth with a hard clamp, R(t+dt)=min(R+dR, Rmax); the CODE implements the saturating\nexponential\
    \ relaxation above with no clamp. The code wins; the disagreement is a genuine\npaper/code contradiction,\
    \ not a normalization choice, and it does not change the verdict --\neither reading is still cell\
    \ growth toward a maximum size.\n"
  contract:
    name: grow_radius
    kind: lateral
    family: growth
    set: cell
    inputs:
    - cell
    outputs:
    - cell
    reads:
    - radius
    - growth_rate
    writes:
    - radius
    maps:
    - growth_law
    - realization
    - rate
  status: validated
  module: src/plexus/operators/candidates/jax_morph_saturating_cell_growth.py
  test: tests/test_jax_morph_saturating_cell_growth.py
  evidence:
    oracle_run: diff_saturating_cell_growth
    diff_metric: "D_max = the maximum absolute per-cell radius deviation between the Plexus grow_radius\n\
      trajectory and the jax-morph SaturatingCellGrowth reference, over EVERY recorded frame\n(t = 0..20:\
      \ the seeded IC plus 20 macro-steps at dt = 2.0) and EVERY live cell, in\ndimensionless simulation-length\
      \ (radius) units. Reported as value = max(D_max_A, D_max_B):\n  D_max_A -- the 4-cell engine run\
      \ of config/atlas_jax/saturating_cell_growth.yaml exactly as\n    run_spec runs it (r0 = 0.30, growth_rate\
      \ = 0.40, max_radius = 0.6), diffed against\n    oracle scenario A over the 4 live cells (acted\
      \ ledger: grow_radius acted 13/20 calls,\n    the later 7 emitting a sub-float delta once radius\
      \ has reached R -- correct saturation).\n  D_max_B -- a heterogeneous 6x6 (r0 x growth_rate) grid\
      \ of 36 cells rolled 20 steps through\n    the real engine first-order integration radius += dt*delta,\
      \ diffed against oracle\n    scenario B; it spans k = 0 (byte no-op), small-k near-linear growth,\
      \ large-k near-instant\n    saturation (where forward Euler at dt = 2 would overshoot), r0 == R\
      \ (dr ~ 0), and r0 > R\n    (relaxation DOWN to R -- the no-clamp claim; last radius reaches R =\
      \ 0.6 from above).\nGrowth is ISOLATED (no relaxation, no division) so both sides keep the same\
      \ cells in the same\narray slots and align cell-for-cell, frame-for-frame. The oracle is diff_saturating_cell_growth\n\
      (reference.npz), whose own float32-vs-float64-analytic error is 9.5e-8, confirming the reference\n\
      is the exact von-Bertalanffy flow, not forward Euler and not a min-clamp. A negative control\nthat\
      \ drops the /dt mean-rate convention (radius += dt*dr) scores 0.55, ~5e4x above threshold,\nso the\
      \ metric provably catches a wiring defect precisely because dt = 2 (not 1) makes the\nconvention\
      \ observable.\n"
    threshold: 1.0e-05
    threshold_why: '1e-5 sits ~100x above float32 round-off (the reference''s own float32-vs-analytic
      error is

      9.5e-8) yet ~5e4x below the negative-control wiring-defect signal (0.55), so it separates

      bit-level agreement from any real trajectory disagreement -- a wrong growth law, a dropped

      dt-scaling, a forward-Euler overshoot, or a min-clamp -- without flagging float32 noise. It

      was fixed in the diff script before the run, not chosen after seeing value = 0.

      '
    value: 0.0
    passed: true
    passed_note: 'value = 0.0 EXACTLY: the Plexus engine and the jax-morph reference produce bit-identical

      float32 radius trajectories over all 20 frames in both scenarios (D_max_A = 0.0, D_max_B = 0.0).

      Corroborating checks all clean -- frame0_is_ic_residual = 0.0 (frame 0 is the pure seeded IC),

      k0_noop_drift = 0.0 (the k = 0 column never moves), aboveR_last_min = 0.6 = R (no clamp; cells

      above R relax down to R). The grow_radius contract reproduces SaturatingCellGrowth''s per-cell

      radius ODE to the last bit.

      '
  state_io_notes:
    maps:
    - growth_law = von Bertalanffy exact flow dr = (max_radius - radius)*(1 - exp(-growth_rate*dt/max_radius)),
      the closed-form integral of dr/dt = k*(1 - r/R); saturating, monotone, unconditionally stable for
      any dt, no min/clamp
    - realization = per-cell scalar radius on a point / soft-sphere cell (NO MPM reserve particles); dt-scaling
      is baked into the returned delta, which is summed with any other radius writers (stable operator-split
      contribution)
    - rate source = per-cell heritable state field growth_rate (default 0.0), rewritten each macro-step
      by an upstream controller so gradients flow through it; the sole constructor param is max_radius
      (a traced, optimizable target)
  implementation_blocked: 'This is a REFINEMENT of `cell_grow` that cannot be registered as an implementation
    of it: the shipped `cell_grow` is kind=structural (returns {}, advances a rest volume) and this one
    is kind=lateral (returns a radius delta), and the registry forbids implementations of one contract
    from differing in kind -- correctly, since kind is biology. It is therefore parked under the distinct
    name `grow_radius`. Promoting it means deciding whether `cell_grow` should become lateral, which breaks
    every existing user of it. That is a language decision, not a code fix.'
  collision_note: registered as `grow_radius`, not `cell_grow` -- see implementation_blocked. The ledger
    still counts it as a refinement of cell_grow, not as new vocabulary.
  signature_note: kind is `lateral` (it returns a radius delta the engine integrates), not `field`. This
    is the very difference that blocks registering it as an implementation of `cell_grow`.
- id: active_brownian_dynamics2_d
  order: 10
  raw_name: ActiveBrownianDynamics2D
  raw_kind: step (StochasticStep)
  code_path: papers/jax-morph/jax_morph/physics/mechanics/dynamics.py:L199
  paper_section: p. 14 (SI I, 'Mechanical Interactions'); active variant ABSENT -- see surprises
  summary: One Euler-Maruyama macro-step of overdamped active Brownian (self-propelled) dynamics in 2-D.
    On top of the passive Langevin drift (potential force / gamma) and translational noise, each cell
    self-propels at its per-cell speed active_speed along a persistent heading angle active_heading, and
    that heading rotationally diffuses. It writes a position displacement delta and a heading increment
    delta, recording both exogenous noises so the step is pathwise-differentiable and scorable (a Gaussian
    kernel on the displacement and on the heading increment).
  equations: "Per alive cell i, over a macro-step dt (F_i = potential forces = -grad_i U; theta_i =\n\
    active_heading; v0_i = active_speed; D_r = rot_diffusion):\n\n  e_i      = (cos theta_i, sin theta_i)\
    \                      # heading unit vector (2-D)\n  drift_i  = F_i / gamma + v0_i * e_i        \
    \                # NOTE: v0 term is NOT divided by gamma\n  mean_t_i = dt * drift_i\n  std_t    =\
    \ sqrt(2 * kT * dt / gamma)                       # translational noise scale (shared)\n  dx_i   \
    \  = mean_t_i + std_t * xi_t_i,   xi_t_i ~ N(0, I_2) # position displacement\n  std_r    = sqrt(2\
    \ * D_r * dt)                              # heading noise scale (NO gamma)\n  dtheta_i = std_r *\
    \ xi_r_i,              xi_r_i ~ N(0, 1)   # heading increment; drift is ZERO\n\nApplied as dynamic\
    \ (additive) deltas:  position_i += dx_i ;  active_heading_i += dtheta_i.\n\nScore (logp), summed\
    \ over alive cells, deterministic component contributes 0:\n  logp = sum_i [ log N(dx_i | mean_t_i,\
    \ std_t^2) + log N(dtheta_i | 0, std_r^2) ]\n\nPassive limit v0 = 0 recovers BrownianDynamics (dynamics.py:L36).\
    \ Paper's mechanics (p. 14) is a\nDIFFERENT operation entirely: deterministic gradient-descent energy\
    \ minimization of the Morse\npotential Vij(r) = eps[(1 - exp(-alpha(r - sigma)))^2 - 1]; no noise,\
    \ no self-propulsion."
  params:
    potential: 'interaction_potential -- a Potential whose autodiff forces (-grad U) give the mechanical
      drift term; None resolves to NoForce (a free active gas: self-propulsion + heading noise only).'
    n_space_dim: spatial_dimension -- static int, must be 2 (heading is a scalar angle); sizes the (N,
      2) translational trace fields and is re-checked against the live state's actual dimension at trace
      time. Constructor raises ValueError if != 2.
    gamma: translational_drag_coefficient -- divides the potential force in the drift AND sets the translational
