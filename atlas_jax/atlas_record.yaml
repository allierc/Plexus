- id: lie__trotter_macro_step_split
  order: 21
  raw_name: Lie-Trotter macro-step split
  raw_kind: integration contract
  code_path: papers/jax-morph/jax_morph/core/step.py:L364
  paper_section: guides/concepts.md, 'A simulation integrates a hybrid dynamical system' (F_dt = F_disc
    o F_dyn o F_qs)
  summary: Model.__call__ advances the shared state by ONE macro-step as a fixed-order Lie-Trotter operator
    split, s_{n+1} = (Phi_discrete o Phi_dynamic o Phi_quasistatic)(s_n), then t += dt. Phase A runs every
    quasistatic step in pipeline order (each returns a full state, later steps see earlier updates); phase
    B evaluates every dynamic step at the SAME post-quasistatic state, sums their alive-masked, already-dt-scaled
    sparse deltas, and applies them once; phase C runs every discrete step in pipeline order. First-order
    (O(dt)) accurate; a whole simulation iterates this one map.
  equations: "Macro-step operator (Model.__call__, step.py:519; phase skeleton Model._run, step.py:485):\n\
    \  s_{n+1} = (Phi_disc o Phi_dyn o Phi_qs)(s_n),   then   t <- t + dt\n  (\"o\" is function composition:\
    \ the RIGHTMOST map (quasistatic) is applied FIRST.)\nWhole trajectory is the n_steps-fold iterate\
    \ of the identical map:\n  s(T) = F_dt^{n_steps}(s_0),   T = n_steps * dt.\n\nPhase A - quasistatic\
    \ (sequential, pipeline order over i in QS):\n  s <- Phi^qs_i(s)          # each step returns a COMPLETE\
    \ new state; later steps see earlier ones\nPhase B - dynamic (Jacobi: every dyn step read the ONE\
    \ post-A state s*, then summed once):\n  delta_i = Phi^dyn_i(s*)   # sparse delta (state.deltas);\
    \ untouched fields = None; dt-scaling baked in\n  total_f = sum over writers i of delta_i.f     (None\
    \ contributions skipped)\n  total_f <- where(alive, total_f, 0)  for cell-scope fields only  (global/grid\
    \ fields NOT masked)\n  s <- eqx.apply_updates(s*, total)             # NO extra dt multiply here\
    \ (_accumulate_dynamic, :342)\nPhase C - discrete (sequential, pipeline order over k in DISC):\n \
    \ s <- Phi^disc_k(s)        # each returns a COMPLETE new state; sees earlier jumps\nTime: t advances\
    \ by dt exactly ONCE, after all three phases (out.set('t', out['t']+dt), step.py:548).\nPRNG: keys\
    \ = jax.random.split(key, len(steps)); step i receives keys[i] (step.py:542-545).\n\nPaper form (guides/concepts.md):\
    \ F_dt = F^disc_dt o F^dyn_dt o F^qs_dt, s_{n+1}=F_dt(s_n),\ns(T)=F_dt^{n_steps}(s_0), T=n_steps*dt\
    \ -- identical to the code.\n"
  params:
    steps: 'operator_sequence: ordered tuple of SimulationStep sub-maps composed into the macro-step (Model.__init__,
      step.py:382). List order is honored WITHIN the quasistatic and discrete phases (pipeline, each sees
      prior updates) but is IGNORED within the dynamic phase (all dynamic steps read the same post-quasistatic
      state).'
    dt: 'integration_timestep: macro-step duration and the O(dt) accuracy knob; also the scale each dynamic
      step pre-multiplies its own delta by. Call-time keyword-only argument, not a stored constructor
      field.'
    key: 'stochastic_seed: JAX PRNG key split once into len(steps) sub-keys, one per step by index; deterministic
      steps are still handed a key and ignore it. Call-time keyword-only argument.'
  state_io:
    reads:
    - 't: read to advance simulation time (out[''t'']).'
    - 'alive (+ n_cells): dynamic-phase masking zeroes dead cell-scope deltas (_accumulate_dynamic, step.py:357-359).'
    - the union of every constituent step's state_reads() via Model.state_requires() (step.py:608); the
      split declares no physics reads of its own.
    writes:
    - 't: t + dt, once per macro-step, after all three phases (step.py:548).'
    - every stochastic step's trace fields, reset to their declared defaults at macro-step start (_reset_traces,
      step.py:467/494).
    - the union of every constituent step's state_writes(); the split orchestrates the phase writes but
      itself writes only t.
  surprises:
  - 'Fixed phase order overrides list order: the macro-step is ALWAYS quasistatic -> dynamic -> discrete
    no matter how steps are ordered in Model(steps=...). List order only sequences steps WITHIN the quasistatic
    and discrete phases. A reimplementer who simply runs steps in declaration order gets different dynamics.'
  - 'Dynamic phase is JACOBI, not Gauss-Seidel: every dynamic step is evaluated at the ONE frozen post-quasistatic
    state s* (step.py:504-508), so no dynamic writer sees another''s increment; deltas are summed. Running
    them sequentially (each seeing the last) is a different, wrong integrator -- the docstring flags this
    explicitly (step.py:530-531).'
  - 'No dt-scaling in accumulation: each dynamic step returns an increment ALREADY multiplied by dt (contract,
    step.py:76-78); _accumulate_dynamic (step.py:342) only sums and applies. Multiplying by dt again double-scales
    every dynamic force.'
  - 'Return-shape contract splits by type: quasistatic/discrete return a COMPLETE state; dynamic returns
    a SPARSE delta from state.deltas(...) with every untouched field None. Summation reads fields by attribute
    and skips None (step.py:353); a dynamic step that returns a full state breaks the sum.'
  - 'Alive-masking is cell-scope only: summed dynamic deltas are zeroed on dead slots via state.alive
    (step.py:357-359), but global/grid fields are NOT masked. Dead cells are not integrated; the environment
    (grids, globals) still is.'
  - 'Time advances exactly once, last: t <- t + dt happens after all three phases (step.py:548), not per
    step or per phase, so simulated time is real physical time T = n_steps*dt.'
  - 'One key split per macro-step by index: keys = jax.random.split(key, len(steps)) and step i gets keys[i]
    (step.py:542-545). Deterministic steps receive (and ignore) a key. Replay substitutes a fixed _PLACEHOLDER_KEY
    = PRNGKey(0) for deterministic steps (step.py:34, 563).'
  - 'Trace fields reset FIRST, every macro-step: _reset_traces (step.py:494) wipes ephemeral stochastic
    traces to their defaults before phase A, making each recorded trace per-macro-step; a dynamic (additive)
    trace field must default to 0 or reset-then-accumulate would record default+value instead of the step''s
    own increment.'
  - 'Composition reads right-to-left: Phi_discrete o Phi_dynamic o Phi_quasistatic applies QUASISTATIC
    first despite being written last -- easy to misread as discrete-first, which would invert the whole
    integrator.'
  - 'PAPER vs CODE: the paper never names ''Lie-Trotter'', operator splitting, or first-order accuracy
    -- that formalization is the library''s (guides/concepts.md). The paper (Fig. 1a caption, p.2 line
    100; Methods ''To create an initial state'', p.14 lines 747-748) describes an informal per-timestep
    sequence -- ''cell division, cell growth, and mechanical relaxation'', one division per step -- with
    division positioned differently from the code''s fixed order where division (a discrete event) runs
    LAST. SOURCE WINS: the contract is the three-phase fixed split; the paper''s one-division-per-step
    is a modeling choice layered on top, not the integrator.'
  - 'Sampling and scoring share ONE skeleton: forward __call__ and score-time _replay_transition both
    call _run (step.py:547, 570) with different per_step closures, so the composition order is identical
    forward and in replay; a replay that reordered the phases would silently break gradient consistency.'
  verdict: out_of_scope
  of: null
  why: 'OUT_OF_SCOPE: the Lie-Trotter macro-step split is the INTEGRATOR of the operator algebra, not
    an

    operator in it. It carries no biological content -- there is no biological process named "advance

    the whole system by one integration step", and the contract rule that an operator take a

    biological name (divide / diffuse / adhere) has nothing to name here. Its ONLY own persistent

    write is the global time scalar t <- t + dt (step.py:548); every other state change in a

    macro-step is the constituent operators'' own writes, merely sequenced and (in the dynamic phase)

    summed by this scheduler. And it is explicitly numerics: guides/concepts.md names it a

    first-order (O(dt)) Lie-Trotter operator split -- the same category as the serializer and PRNG

    helpers the out_of_scope definition cites.


    In an operator ALGEBRA the composition law -- how operators are sequenced and how their effects

    combine -- is part of the algebra''s DEFINITION, not one of its elements. Plexus''s engine already

    owns that composition: it runs ordered operator pipelines and fixes its own phase/accumulation

    policy. So there is nothing for the promoted VOCABULARY (the typed maps over sets and fields in

    src/plexus/operators/) to gain from this map; it is the interpreter of the vocabulary, not a word

    in it.


    Not alias / refinement: no registered contract models "orchestrate three phase maps and advance

    time", and widening any forward operator to admit that would graft the scheduler onto a

    forward-dynamics signature. Not new: registering the integrator as an operator would inflate the

    atlas yield with framework machinery -- exactly what out_of_scope exists to prevent (R7 already

    flags a writes-nothing operator; the contract.writes: [t] below is only the formal time-advance

    slot, a non-physics write, mirroring the sibling out_of_scope entries stochastic_step

    (contract.writes: [trace]) and no_force (contract.writes: [position])).


    CLOSEST registered contract: aggregate (aggregate/hierarchy) -- the dynamic phase aggregates

    (sums) the sparse per-writer deltas into one applied update. But the resemblance is incidental:

    aggregate is a value-rollup operator over a hierarchy, whereas the macro-step is the scheduler

    that happens to sum deltas as one of its three phases; it is not an aggregation of state values.


    STRONGEST COUNTERARGUMENT (and why it loses): the split is NOT trivial plumbing. The Jacobi (not

    Gauss-Seidel) evaluation of the dynamic phase, the FIXED quasistatic -> dynamic -> discrete order

    that overrides list order, and the dt-scaled sparse-delta accumulation are load-bearing SEMANTIC

    choices -- a reimplementer who gets any of them wrong produces different dynamics (the surprises

    list four such traps). One could argue this is a genuine "integration contract" the atlas should

    record as new, and that if Plexus''s engine composes operators differently the disagreement is

    exactly the source-vs-language contradiction this exercise prizes. It loses because the atlas

    measures the OPERATOR vocabulary -- typed maps over sets and fields -- and every one of those

    load-bearing choices is a property of the ENGINE that runs ANY operator pipeline, not of a

    forward operator over state. That a choice is easy to get wrong makes it worth DOCUMENTING (it

    is, in the surprises), not worth counting as a word in the vocabulary. This mirrors the

    stochastic_step verdict, where machinery equally load-bearing and equally easy to mis-wire

    (trace / replay / score) was ruled an ENGINE concern, out_of_scope. If Plexus''s own scheduler

    genuinely disagrees with this fixed three-phase Jacobi split, that is an engine-level

    contradiction to record against the engine, not a new forward operator.


    SOURCE-vs-PAPER (recorded in surprises): the paper never says "Lie-Trotter", "operator split", or

    "first-order accurate" -- that formalization is the library''s (guides/concepts.md). The paper

    (Fig. 1a caption p.2 L100; Methods p.14 L747-748) gives an informal per-timestep sequence "cell

    division, cell growth, and mechanical relaxation" with division positioned differently from the

    code''s fixed order (discrete/division LAST). SOURCE WINS: the contract is the three-phase fixed

    split; the paper''s one-division-per-step is a modeling choice layered on top.


    OVERLAP: the sibling entries step_type:_quasistatic___dynamic___discrete (order 22) and

    declared_field_dataflow_validation (order 23) describe the SAME core/step.py composition machinery

    (the phase taxonomy and the build-time dataflow validation this split relies on) and should

    receive the same out_of_scope verdict.

    '
  contract:
    name: integrate
    kind: aggregate
    family: hierarchy
    set: cell
    inputs:
    - cell
    outputs:
    - cell
    reads:
    - alive
    - t
    writes:
    - t
    maps: []
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: step_type:_quasistatic___dynamic___discrete
  order: 22
  raw_name: 'step type: quasistatic / dynamic / discrete'
  raw_kind: step taxonomy
  code_path: papers/jax-morph/jax_morph/core/step.py:L50-L56
  paper_section: guides/concepts.md '## Models are ordered step pipelines' (step-type table); also core-abstractions.md
    '### StepType'
  summary: '`step_type` is a class-level StrEnum tag (QUASISTATIC / DYNAMIC / DISCRETE) each step declares;
    it touches no state itself but fixes (1) which of the three macro-step phases the step runs in and
    (2) how the Model interprets the step''s return value. Quasistatic and discrete steps return a COMPLETE
    new state and run sequentially in pipeline order; a dynamic step returns a SPARSE, dt-scaled delta
    (via `state.deltas`) that the Model evaluates for every dynamic writer at the SAME post-quasistatic
    state, then sums, alive-masks, and applies once. It classifies a step by TIME-SCALE SEMANTICS (fast
    constraint / finite rate / instantaneous event), orthogonal to which fields it touches.'
  equations: "StepType is a StrEnum: DYNAMIC='dynamic', QUASISTATIC='quasistatic', DISCRETE='discrete'\n\
    (step.py:L50-L56). It is declared per step as the class var `step_type` and consumed by the Model.\n\
    \nOne macro-step is a first-order Lie-Trotter operator split of three phase maps in a FIXED order\n\
    (concepts.md; Model.__call__ step.py:L519):\n\n    s_{n+1} = ( Phi_discrete  o  Phi_dynamic  o  Phi_quasistatic\
    \ )( s_n ),   then  t <- t + dt\n\nPhase A  QUASISTATIC  (Model._run L497; pipeline/sequential --\
    \ each step sees prior updates):\n    for each quasistatic step k in order:  s <- step_k(s, dt=dt,\
    \ key=key)        # returns a FULL state\n\nPhase B  DYNAMIC  (Model._run L504, _accumulate_dynamic\
    \ L342; all at the SAME post-qs state s*):\n    delta_k   = step_k(s*, dt=dt, key=key)   for each\
    \ dynamic step k             # returns state.deltas(field=incr_over_dt), other fields None\n    total[f]\
    \  = sum_k delta_k[f]                                                 # summed by field name; None\
    \ (untouched) skipped\n    total[f] <- where(alive, total[f], 0)    for cell-scope f             \
    \       # dead slots not integrated; global fields unmasked\n    s <- eqx.apply_updates(s*, total)\
    \                                            # applied ONCE; None fields left exactly as-is\n\nPhase\
    \ C  DISCRETE  (Model._run L513; pipeline/sequential -- each step sees earlier jumps):\n    for each\
    \ discrete step k in order:  s <- step_k(s, dt=dt, key=key)           # returns a FULL state\n\ndt-scaling\
    \ is baked INSIDE each dynamic step (its returned increment is already over dt); the\naccumulator\
    \ does NO scaling. Return-value contract (SimulationStep.__call__ docstring L126):\nQUASISTATIC/DISCRETE\
    \ -> new full state; DYNAMIC -> sparse per-dt delta.\n"
  params:
    step_type: class-level time-scale-semantics tag selecting phase AND return-value interpretation (QUASISTATIC=fast
      constraint solved at current slow state / DYNAMIC=finite-rate increment over dt / DISCRETE=instantaneous
      event or reset). Declared as `eqx.AbstractClassVar[StepType]` on each SimulationStep subclass --
      a CLASS variable fixed at class-definition time, NOT a constructor argument, so it is not tunable
      per instance and is baked into the compiled program as a constant.
  state_io:
    reads:
    - alive
    writes:
    - t
    note: 'The taxonomy declares NO physical fields itself; each concrete step declares its own state_reads()/state_writes().
      What step_type fixes is the WRITE-CONFLICT policy over those declarations (Model._validate L394):
      a quasistatic field admits exactly one writer; a dynamic field admits many additive writers; a field
      cannot be both; discrete steps are exempt from the write-conflict check entirely.'
  surprises:
  - 'PAPER CONTRADICTION (source wins). The paper (Deshpande 2025, p. 14 ''FORWARD SIMULATION'') has NO
    step-type taxonomy: it describes the simulation as "any subset or combination of the steps detailed
    below" -- a flat, customizable sequence of full-state operations (cell growth, mechanical relaxation,
    cell division, diffusion) applied per timestep, with "each simulation timestep [consisting] of one
    cell division." The words quasistatic / dynamic / discrete / Lie-Trotter / hybrid / macro-step appear
    ZERO times in the paper text. The three-phase time-scale taxonomy, the operator split, and the dt-scaled
    sparse-delta contract are a library RE-ARCHITECTURE of the original flat pipeline. Recorded per rule
    5: SOURCE WINS.'
  - The DYNAMIC phase is NOT Gauss-Seidel. Every dynamic step is evaluated at the SAME post-quasistatic
    state (it does not see other dynamic steps' updates); their sparse deltas are SUMMED and applied in
    one op, so the dynamic phase is order-independent. Quasistatic and discrete phases ARE sequential
    (each step sees prior updates). A reimplementer who runs dynamic steps one after another (each on
    the last one's output) changes the dynamics.
  - 'Return value is OVERLOADED by type behind one identical signature `__call__(state, *, dt, key) ->
    state`. A dynamic step MUST return `state.deltas(...)` (a sparse increment over dt, every untouched
    field None), NOT a full state; returning a full state from a dynamic step is a silent correctness
    bug (AGENTS.md explicitly: "Do not implement a dynamic step by returning a complete updated state").
    Quasistatic/discrete return a full state.'
  - dt-scaling lives INSIDE each dynamic step, not in the combiner. `_accumulate_dynamic` sums the deltas
    with NO dt multiplication ("each step baked its own dt-scaling in"). A reimplementer who expects the
    model to multiply increments by dt will mis-scale the finite-rate terms.
  - Write-conflict policy is per-type and ASYMMETRIC (Model._validate). A QUASISTATIC field admits EXACTLY
    ONE writer; a DYNAMIC field admits MANY (additive) writers; a field cannot be both quasistatic- and
    dynamic-written (ValueError). DISCRETE steps are EXEMPT from write-conflict checks entirely ("discrete
    steps are resets") -- two discrete steps may write the same field and the later-in-pipeline one silently
    wins, no error.
  - 'StepType is a StrEnum, but phase dispatch and validation compare by IDENTITY (`step.step_type is
    StepType.DYNAMIC`), not by `==`. `StepType.DYNAMIC == ''dynamic''` is True, yet assigning the raw
    string ''dynamic'' as a step''s `step_type` passes no `is`-check: the step would silently run in NO
    phase (never executed) rather than raise. Set the enum member, not the string.'
  - Cell-scope dynamic totals are alive-masked (dead slots zeroed) before `apply_updates`; GLOBAL fields
    (grids, scalars) are NOT masked. Bool/discrete base fields like `alive` are protected from accidental
    integration only because a well-formed dynamic delta leaves them None -- the summed update touches
    an untouched (None) field never, so a dynamic step that wrongly writes `alive` would bypass that protection.
  verdict: out_of_scope
  of: null
  why: '`step_type` is a class-level classification TAG, not a forward operator over sets and fields.

    It declares no physics of its own (the state_writes a step advertises belong to the concrete

    step, never to the tag); what the tag fixes is (a) which of the three fixed macro-step phases a

    step runs in and (b) how the Model interprets that step''s return value (full state vs sparse

    dt-delta), plus the per-type write-conflict policy in Model._validate. That is

    integration/scheduling machinery -- the engine layer that COMPOSES the forward operators, not a

    member of the forward algebra. It is the per-step annotation consumed by the sibling Lie-Trotter

    macro-step split (order 21), which is itself the engine''s composition map; the two are one

    engine concern seen from two sides (the tag classifies, the split dispatches).


    Not alias/refinement: no registered contract models a time-scale-classification tag, and

    widening one (say `diffuse`, or any lateral force) to carry a phase / return-value-dispatch

    attribute would graft a scheduler concern onto a forward-dynamics signature and break every

    existing user of that contract. Not new: counting an operator-CLASSIFICATION tag as a new

    OPERATOR would inflate the atlas yield with framework machinery -- exactly what out_of_scope

    exists to prevent, and the same call already made for StochasticStep (order 5), where

    differentiability is ruled an engine concern, not a forward operator. The biology lives entirely

    in the concrete steps each tag labels (grow, relax, divide, diffuse), each already its own atlas

    entry with its own real contract; the tag adds only WHEN and HOW those effects are composed in

    time, never a new effect on state.


    MEASUREMENT NOTE (the load-bearing observation). step_type is a genuine axis Plexus''s IR does

    not currently carry: a TIME-SCALE / integration-phase classification (fast constraint / finite

    rate / instantaneous event). Plexus does classify its operators -- but along a DIFFERENT axis.

    Its `kind` taxonomy (lateral/aggregate/broadcast/exchange/field/structural/rewire) is a

    data-flow-SHAPE axis (which sets and fields an operator couples), orthogonal to time-scale. So

    the closest Plexus analogue is not any registered contract at all but Plexus''s own `kind`

    meta-taxonomy, and even that is a different axis. This is a gap in the engine/IR meta-layer, not

    a missing forward operator; a classification-of-operators is not an operator, so it is recorded

    out_of_scope with the axis noted rather than promoted into the vocabulary.


    CONTRACT FIELDS BELOW are a validator formality: R6/R7 require a typed, writes-non-empty

    contract even for out_of_scope. No Plexus kind genuinely fits a scheduling meta-tag;

    kind=exchange / family=coupling names only the write-into-shared-state coupling the taxonomy

    governs, and writes:[t] mirrors the single field the macro-step it dispatches actually advances.

    '
  contract:
    name: timescale
    kind: exchange
    family: coupling
    set: cell
    inputs:
    - cell
    outputs:
    - cell
    reads:
    - alive
    writes:
    - t
    maps: []
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: declared_field_dataflow_validation
  order: 23
  raw_name: declared field dataflow validation
  raw_kind: composition contract
  code_path: papers/jax-morph/jax_morph/core/step.py:364
  paper_section: guides/concepts.md, 'Physics and control compose through fields'
  summary: Steps couple ONLY through named state fields -- there is no other channel. Each step declares
    the fields it reads (state_reads), writes (state_writes) and, if stochastic, its ephemeral records
    (trace_writes) as tuples of StateFieldSpec. When a Model is constructed, Model._validate cross-checks
    those declarations (write-conflict policy + trace uniqueness + spec consistency) and build_state_from_model
    then SYNTHESIZES the typed state class as exactly the base fields merged with the union of every step's
    required fields. So the contract does not transform field values; it defines and validates the schema
    through which steps couple, which is why recomposition is add/remove/reorder rather than editing a
    monolithic simulator.
  equations: "This is a composition/validation contract, not a numeric update. The \"update\" is the set\
    \ of\nbuild-time predicates and the schema synthesis.\n\nSCHEMA SYNTHESIS  (state.py: merge_specs,\
    \ build_state_from_model)\n  specs        = merge_specs(BASE_SPECS, U_step  step.state_requires())\n\
    \  step.state_requires() = merge_specs(state_reads(), state_writes()[, trace_writes()]).values()\n\
    \  StateCls     = eqx.Module with one jax.Array attribute per name in specs, shape:\n            \
    \       global scope -> spec.shape\n                   cell   scope -> (capacity, *spec.shape)\n \
    \ merge_specs raises ValueError if two declarations SHARE a name but are not EXACTLY equal.\n\nBUILD-TIME\
    \ WRITE-CONFLICT VALIDATION  (step.py: Model._validate, over NON-discrete steps)\n  let Q(f) = {quasistatic\
    \ steps writing field f},  D(f) = {dynamic steps writing f}\n    require  |Q(f)| <= 1            \
    \         (a quasistatic field admits exactly ONE writer)\n    require  a field is Q-owned XOR D-owned\
    \  (never both quasistatic- and dynamic-written)\n    |D(f)| unrestricted -> deltas SUMMED:   total_f\
    \ = sum_d  delta_d[f]  (alive-masked, cell scope)\n    DISCRETE steps EXEMPT from this check    (resets\
    \ are allowed to clobber)\n\nTRACE-FIELD VALIDATION  (step.py: Model._validate, over stochastic steps)\n\
    \    each trace name owned by exactly ONE stochastic step (no sharing)\n    trace name NOT in reserved,\
    \  reserved = {base field names} U {every step.state_writes()}\n    dynamic trace field: spec.default\
    \ == 0   (reset-then-accumulate records only its own increment)\n\nREADS ARE NOT VALIDATED. A field\
    \ may be read with no writer (allocated at spec.default, held by\nthe initial condition or as a never-changing\
    \ constant). Reads still enter state_requires(), so a\nDECLARED read guarantees the field is allocated\
    \ -- but nothing checks that a writer exists.\n\nSymbols: f = field name; capacity = fixed cell-slot\
    \ count (static shapes for compiled rollouts);\nBASE_SPECS = (position, radius, celltype, alive, t).\n"
  params:
    name: coupling-key / field identity -- the name by which steps couple; the ONLY inter-step channel.
    shape: per-cell feature dimension (trailing array shape; () = scalar). Full cell array is (capacity,
      *shape).
    dtype: storage dtype (None -> JAX default float; e.g. ALIVE is bool).
    heritable: division-inheritance policy -- True daughter copies mother's value, False daughter reset
      to default (cell scope only).
    default: fill / reset value -- allocates empty states, resets ephemeral trace fields each macro-step,
      inits non-inherited daughters. Also the dynamic-trace validity check (must be 0).
    scope: locality -- 'cell' (per-cell, leading capacity axis, alive-masked, resized on division) vs
      'global' (time/scalar/Eulerian grid; storage only, no grid coupling provided).
    Model(steps): pipeline order -- the ordered tuple of steps whose declarations are cross-validated
      at construction and whose union defines the synthesized state schema.
  state_io:
    reads: 'Schema-level only -- consumes each step''s declared state_reads()/state_writes()/trace_writes()
      SPEC tuples; it does not read any field VALUE. Always-in-scope base fields it merges against: position,
      radius, celltype, alive, t.'
    writes: Synthesizes (does not mutate) the generated BaseState subclass schema = merge_specs(BASE_SPECS,
      union of step.state_requires()); raises ValueError on any write/spec/trace conflict at Model build
      time. Writes no state field values.
  surprises:
  - 'Named "dataflow VALIDATION" but it validates WRITES only. Reads are deliberately never cross-checked
    (Model._validate comment: "The model does not police reads"): a field read with no writer is legal,
    and there is NO DAG / read-before-write / dependency-order check. The name over-promises what is enforced.'
  - Validation does NOT verify that a step's __call__ body touches only its declared fields. The declaration
    is an unenforced PROMISE. A step that reads state.foo without declaring foo either AttributeErrors
    at run time (if no step allocated foo) or silently works (if another step happened to allocate it)
    -- never a build-time error. Correctness of the wiring rests on steps declaring honestly.
  - 'DISCRETE steps are entirely EXEMPT from the write-conflict policy ("discrete steps are resets"):
    two discrete steps may both write `alive` and clobber, and a discrete write never reserves a field
    against quasistatic/dynamic writers. BUT discrete writes DO reserve their names against trace fields
    (reserved is built from every step''s state_writes(), discrete included).'
  - 'The quasistatic/dynamic writer rule is per-field and decided by StepType: >1 DYNAMIC writer of a
    field is allowed and the deltas are ADDED (alive-masked); a QUASISTATIC field admits exactly one writer;
    a field cannot be both. A reimplementer treating "one writer per field" as universal would wrongly
    reject multi-writer dynamic accumulation.'
  - merge_specs dedups only EXACTLY-equal specs. Customizing a base spec inline in one step (POSITION(heritable=False))
    while another step uses the plain POSITION is a build-time ValueError -- a shared field must be declared
    IDENTICALLY by every step that names it.
  - Reads are intentionally NOT reserved against trace-field names, so the Emit->React pattern (a downstream
    step reads an upstream step's within-macro-step trace as a state_read equal to a trace_write) stays
    legal. Reserving reads would forbid that intended consumption path.
  - 'The contract is split across two files: the declaration vocabulary and merge (StateFieldSpec, merge_specs,
    build_state_from_model) live in core/state.py; the build-time cross-validation (Model._validate, reached
    from Model.__init__) lives in core/step.py. It is not in one place.'
  - 'PAPER vs SOURCE. Source (this hardened library): steps declare reads/writes and Model build-time
    validates + synthesizes the state type. Paper (Deshpande 2025, p.14, "I. Forward Simulation"): a single
    CellState datatype holds "the position of particles, their radii, division propensities, chemical
    concentrations ... and any additional state information," and the simulation "can be customized to
    contain any subset or combination of the steps" -- composition purely by CONVENTION, with NO declared
    reads/writes and NO build-time validation (a paper grep for valid/conflict/schema/declare/contract
    finds only "validation LOSS"). A reader of the paper alone would model steps as freely mutating a
    shared struct; the declared-field dataflow contract is an invention of the library re-engineering,
    not described in the paper.'
  verdict: out_of_scope
  of: null
  why: 'OUT_OF_SCOPE: declared-field dataflow validation is the declaration discipline and TYPE SYSTEM

    of the operator algebra, not an operator in it. It reads no field VALUE and writes none: it only

    (a) cross-validates each step''s declared state_reads()/state_writes()/trace_writes() at Model

    build time (write-conflict policy + trace uniqueness + spec consistency) and (b) synthesizes the

    typed state class as merge_specs(BASE_SPECS, union of step.state_requires()). "Advance the state"

    has nothing to name here -- there is no biological process called "check that the steps declare

    their fields honestly", so the contract rule that an operator take a biological name (divide /

    diffuse / adhere) finds nothing to name.


    It is the fourth face of the one core/step.py engine layer whose other three faces are already

    out_of_scope: the Lie-Trotter macro-step split (order 21, `integrate`), the step_type time-scale

    taxonomy (order 22, `timescale`), and the StochasticStep differentiability mixin (order 5 / 24).

    Both the 21 and 22 why-blocks explicitly name order 23 for this same verdict. In an operator

    ALGEBRA the composition law -- how operators declare and share the state they couple through --

    is part of the algebra''s DEFINITION, not one of its elements; Plexus''s engine and IR already own

    that discipline (typed reads/writes per operator, and record.py R7 rejecting a writes-nothing

    operator is the direct analogue of "a declared write is the only coupling channel").


    Not alias / refinement: no registered contract models a build-time schema validator, and widening

    any forward operator (say `diffuse`, or any lateral force) to carry declaration cross-checking

    would graft a validator onto a forward-dynamics signature -- pure violence to its biology. Not

    new: `new` requires the capability be ABSENT from the promoted language, and this is the exact

    opposite of absent -- it is the FRAME the language is written in, so registering it as an operator

    would inflate the atlas yield with the very type discipline every entry already presupposes,

    exactly what out_of_scope exists to prevent.


    CONTRACT FIELDS BELOW are a validator formality: R6/R7 require a typed, writes-non-empty contract

    even for out_of_scope. No Plexus kind fits a schema validator; kind=exchange / family=coupling

    names only the write-into-shared-named-state coupling this contract governs; reads = the BASE_SPECS

    it merges every step''s declarations against (position, radius, celltype, alive, t); writes=[alive]

    is the formal allocation representative (a non-physics write mirroring the siblings'' writes:[t] and

    stochastic_step''s writes:[trace]).


    STRONGEST COUNTERARGUMENT (and why it loses): this is arguably the atlas''s most valuable POSITIVE

    result rather than a scope exclusion. The target has INDEPENDENTLY reinvented the very discipline

    the Plexus algebra is built on -- typed per-operator reads/writes as the sole coupling channel,

    plus a write-conflict policy that is R7''s no-op rule made per-field -- which one could read as a

    `new` build-time-dataflow-validator capability the language should register. It loses because the

    atlas measures the OPERATOR VOCABULARY (typed forward maps over sets and fields), and a validator

    is not a forward map -- it is the type system those maps are written in, which Plexus already

    embodies; and `new` further requires ABSENCE, whereas this is the frame, not a gap. The honest

    resolution is out_of_scope WITH the correspondence logged as a MEASUREMENT NOTE: jax-morph carries

    one axis Plexus''s IR does not -- a per-StepType (time-scale-keyed) write-conflict policy

    (quasistatic = one writer; dynamic = many, summed; discrete = exempt) that REFINES R7''s flat

    no-op/writes rule. That axis is worth DOCUMENTING against the engine, not counting as a word in

    the vocabulary.


    SOURCE-vs-PAPER (recorded in surprises): the paper (Deshpande 2025, p.14, "I. Forward Simulation")

    describes a single CellState struct composed "by any subset or combination of the steps" -- by

    CONVENTION, with no declared reads/writes and no build-time validation (a paper grep for

    valid/conflict/schema/declare/contract finds only "validation LOSS"). SOURCE WINS: the declared-

    field dataflow contract is an invention of the hardened library, invisible to a paper-only reader.

    '
