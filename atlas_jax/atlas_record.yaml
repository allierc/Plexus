- id: mechanical_relaxation
  order: 19
  raw_name: MechanicalRelaxation
  raw_kind: step (SimulationStep)
  code_path: papers/jax-morph/jax_morph/physics/mechanics/relaxation.py:L221
  paper_section: 'p. 14 (Materials and Methods, ''Mechanical Interactions''): "Relaxation is performed
    by gradient descent energy minimization of the Morse potential for a fixed number of steps (except
    in the case where we learn cell adhesion)"; framework slot Fig. 1a (''mechanical relaxation'').'
  summary: 'Quasistatic step: relaxes cell positions to a mechanical equilibrium of an interaction potential,
    overwriting POSITION with the force-balanced configuration x* where grad_x U(x*) = 0. The forward
    runs FIRE (a momentum-accelerated minimizer) to a genuine force tolerance f_tol -- a real equilibrium,
    not a fixed step count -- and the backward differentiates that EQUILIBRIUM by the implicit function
    theorem (jax.custom_vjp), restricted to the physical (deformation) subspace, so the rigid-body gauge
    modes carry no gradient. potential=None -> NoForce makes it a no-op.'
  equations: "FORWARD (code) -- relax to a mechanical equilibrium x* = argmin_x U(x; state), realized\
    \ as the\n  ROOT of grad_x U(x*, params) = 0, by FIRE (Fast Inertial Relaxation Engine; Bitzek 2006),\
    \ NOT\n  plain gradient descent. Per iteration with force f = -grad_x U(x):\n    P     = f . v   \
    \                                 (power; step is \"uphill\" when P <= 0)\n    v     <- 0 if uphill\
    \ else v ;   v <- v + dt * f  (zero the velocity on an uphill step)\n    v     <- (1 - alpha) v +\
    \ alpha (f / |f|) |v|     (mix velocity toward the force direction)\n    x     <- x + dt * v     \
    \                         (semi-implicit Euler position update)\n    dt,alpha adapted: after n_min(=5)\
    \ consecutive downhill steps dt <- min(dt*f_inc, dt_max) and\n      alpha <- alpha*f_alpha; on an\
    \ uphill step dt <- dt*f_dec and alpha <- alpha_start, v <- 0.\n  STOP when |grad_x U|_inf <= f_tol\
    \ (a genuine force balance) OR the iteration count reaches\n  max_steps. Then position <- x*. (NoForce:\
    \ grad U = 0 at step 0, the loop body never runs.)\nBACKWARD (code) -- gradient of the EQUILIBRIUM\
    \ by the implicit function theorem, not the solver\n  path. At x*, grad_x U(x*, p) = 0, so by IFT\
    \  dx*/dp = -H^{-1} d(grad_x U)/dp  with the Hessian\n  H = d^2 U / dx^2. For an output cotangent\
    \ g = dL/dx*, solve the adjoint on the PHYSICAL subspace\n      (P H P + ridge) u = P g       by conjugate\
    \ gradient (maxiter 500),\n  where P projects OUT the rigid-body null modes -- dead-cell DOFs, d global\
    \ translations, and\n  d(d-1)/2 global rotations of the alive cells (all exact zero modes of a distance-only\
    \ U). Then\n      dL/dp = -u^T d(grad_x U)/dp   (the vjp of grad_x U wrt p = (potential, state), applied\
    \ to -u)\n  yielding gradients for BOTH the potential's parameters and the incoming state (radii ->\
    \ sigma...).\n  Symbols: U = interaction energy; x* = relaxed positions; H = Hessian at x*; P = physical-subspace\n\
    \  projector; ridge = Tikhonov damping on residual soft modes; g/u = output/adjoint cotangents.\n\
    PAPER FORM (contrast, p. 14): \"gradient descent energy minimization of the Morse potential for a\n\
    \  FIXED NUMBER OF STEPS (except in the case where we learn cell adhesion)\" -- plain first-order\n\
    \  descent, no momentum, no force-tolerance stop, and (implied) backprop through the unrolled\n  descent.\
    \ SOURCE WINS: FIRE-to-tolerance forward + implicit-diff equilibrium backward."
  params:
    potential: interaction_potential -- its total_energy(x, state) defines the energy landscape U whose
      force balance grad_x U = 0 is the equilibrium this step relaxes to. Any Potential; its float leaves
      are traced/optimizable. Pass None -> NoForce (relaxation becomes a no-op; positions pass through).
    max_steps: solver_iteration_cap (eqx.field static int) -- a FALLBACK bound on FIRE iterations, NOT
      the convergence criterion (that is f_tol). Static so the jax.lax.while_loop is jittable. Reaching
      it without hitting f_tol emits a runtime RuntimeWarning and returns the last (off-equilibrium) iterate
      anyway. Default 500.
    f_tol: equilibrium_tolerance (force convergence threshold) -- FIRE stops when the force inf-norm |grad_x
      U|_inf <= f_tol, i.e. a genuine mechanical equilibrium (the residual measured at the returned configuration).
      Plain float field. Default 1e-3.
    ridge: 'adjoint_regularization (Tikhonov damping) -- added to the PROJECTED Hessian in the backward
      implicit-diff solve (P H P + ridge) u = P g to condition residual near-zero soft modes. BACKWARD-ONLY:
      it changes gradients, never the forward relaxation. Plain float field. Default 1e-6.'
  state_io:
    reads:
    - position (POSITION) -- explicitly declared; supplies the FIRE initial condition x0 = state.position.
    - potential.state_reads() -- any NON-base per-cell field the potential sources its couplings from
      (e.g. a per-cell epsilon StateFieldSpec when adhesion is field-driven). Empty for NoForce and for
      scalar-coupling potentials.
    writes:
    - 'position (POSITION) -- QUASISTATIC absolute overwrite: returns state.set(''position'', x*), the
      relaxed equilibrium positions (a full state, NOT a dynamic delta).'
  surprises:
  - 'PAPER vs SOURCE (the key contradiction). The paper''s Methods (p. 14) defines mechanical relaxation
    as "gradient descent energy minimization of the Morse potential for a FIXED NUMBER OF STEPS (except
    in the case where we learn cell adhesion)". The SOURCE differs on THREE axes: (1) the minimizer is
    FIRE (momentum + adaptive timestep), not plain gradient descent; (2) it runs to a force TOLERANCE
    f_tol (a real equilibrium), with max_steps only a fallback bound, not a fixed step count; (3) the
    gradient is the implicit-function-theorem sensitivity of the EQUILIBRIUM, not backprop through the
    descent iterates. The paper''s own parenthetical "(except in the case where we learn cell adhesion)"
    marks exactly the regime where fixed-step solver-path gradients break down -- which is the problem
    the code''s implicit-diff approach solves in general. SOURCE WINS.'
  - The gradient is NOT taken through the solver path. jax.custom_vjp replaces the forward FIRE loop's
    autodiff with the IFT adjoint, so _fire_to_tol is forward-only and its internal ops are never differentiated.
    A reimplementer who autodiffs through the FIRE while_loop gets path-dependent (not equilibrium) gradients
    plus O(max_steps) memory; the whole point is that the answer depends only on the converged x*, not
    on how FIRE got there.
  - 'Rigid-body null modes carry ZERO gradient by design. The adjoint is solved only on the physical (deformation)
    subspace: dead-cell DOFs, one global translation (d modes), and one global rotation (d(d-1)/2 modes)
    are projected out of BOTH the operator and the RHS (P g). A shape objective is unaffected; a translation-/rotation-sensitive
    objective simply gets NO gradient for that sensitivity (rather than a spurious ridge-scaled one).
    To make absolute position/orientation optimizable you must break the symmetry physically (pin a cell,
    add a field/substrate). A naive H u = g solve without projection is singular / ill-conditioned at
    a free-space equilibrium.'
  - max_steps is a FALLBACK bound, not the loop count (the opposite of the paper's fixed-step relaxation).
    On non-convergence the step returns the last iterate anyway and warns via jax.debug.callback -- a
    HOST-side warning that fires even from inside a jitted / vmapped / differentiated call. Under vmap
    the guarding lax.cond runs both branches, so the callback re-checks the tolerance host-side and only
    warns for lanes that genuinely missed f_tol.
  - 'The FIRE integrator constants are HARDCODED in _fire_to_tol, not constructor knobs: dt_start=0.01,
    dt_max=0.1, n_min=5, f_inc=1.1, f_dec=0.5, alpha_start=0.1, f_alpha=0.99 (the standard Bitzek-2006
    FIRE schedule). Only max_steps / f_tol / ridge are exposed; a reimplementer expecting to tune the
    timestep or velocity-mixing from the step API finds no such parameter.'
  - ridge is BACKWARD-ONLY and applied on the PROJECTED subspace (+ ridge * vp), not on the full-space
    Hessian. It perturbs gradients, never the relaxed positions. ridge=0 risks a singular adjoint on residual
    soft modes; a large ridge biases the physical-mode sensitivities -- which is why the exact rigid modes
    are PROJECTED out first rather than merely ridge-damped.
  - 'The adjoint differentiates wrt the incoming STATE too, not only the potential''s parameters: params
    = (potential, state) rides the custom_vjp as ONE differentiable pytree (its float leaves traced, its
    bool/callable leaves -- the alive mask, callables -- getting float0), so gradients flow back to cell
    radii (radius -> sigma) etc. State cannot be a nondiff_argnum because nondiff_argnums must be hashable
    and a state carrying array leaves is not.'
  - Declared state_reads OMITS radius / alive / displacement. total_energy actually consumes state.radius
    (sigma = r_i + r_j), state.alive (pair masking), and state.displacement, but the step declares only
    POSITION + potential.state_reads() -- those three are BASE fields assumed present, not re-declared.
    A reimplementer building the dataflow graph off state_reads() alone would miss that radius (and liveness)
    drive the equilibrium.
  - 'The force is carried through the while_loop carry, not recomputed in cond: body computes f = -grad
    U at the new position for the next iteration and cond tests that CARRIED force, so the O(N^2) energy
    gradient is evaluated exactly once per FIRE step. Recomputing grad inside cond would double the force
    evaluations per step.'
  - 'The NoForce no-op is realized through the GENERAL FIRE path, not a special case in the step: grad
    U = 0 everywhere gives residual 0 <= f_tol at iteration 0, so the while_loop body never runs and positions
    pass through unchanged. relax_equilibrium has an explicit `if potential is None` short-circuit, but
    the step stores an actual NoForce() (potential is not None), so that branch is never taken -- it relies
    on immediate convergence instead.'
  verdict: new
  of: null
  why: 'NEW -- a QUASISTATIC MECHANICAL-EQUILIBRATION operator `relax`: it advances cell POSITION to

    the force-balanced configuration x* where grad_x U(x*) = 0, running an inner minimizer (FIRE)

    to a genuine force tolerance and returning the EQUILIBRIUM, not a single dynamic increment.

    No registered contract carries this "relax to mechanical equilibrium" biology.


    CLOSEST REGISTERED CONTRACT = attraction_repulsion (lateral/interaction), the canonical

    pairwise force law that moves cells. Widening it to admit `relax` does violence to its biology

    on three axes: (1) TEMPORAL MODE -- attraction_repulsion emits ONE overdamped velocity per

    macro-step over a radius_graph edge-set (a dynamic forward map); `relax` is QUASISTATIC,

    iterating an inner solver to a force-balanced fixed point and overwriting absolute position

    with x*. (2) OUTPUT -- a single-step velocity/force delta versus a converged equilibrium

    configuration. (3) BACKWARD -- forward autodiff of the force versus the IMPLICIT-FUNCTION-

    THEOREM sensitivity of the EQUILIBRIUM (dx*/dp = -H^-1 d(grad U)/dp), solved on the physical

    subspace with the rigid-body gauge modes projected out so translation and rotation carry no

    gradient. Turning a per-step force emitter into an equilibrium solver is a DIFFERENT contract,

    not a wider one, and would break every user who relies on attraction_repulsion being a pure

    single-step motion law.


    NOT the campaign-local `adhere` contract (Morse/SoftSphere/Hertzian, order 15). `adhere` is the

    FORCE LAW -- a pair POTENTIAL whose energy/forces move cells; `relax` is the potential-AGNOSTIC

    SOLVER that wraps ANY Potential (including NoForce, where it is a no-op) and relaxes it to

    equilibrium. They lie on ORTHOGONAL axes (which force law vs how to advance under it) and

    compose: the same `relax` step runs Morse, SoftSphere or NoForce. So `relax` is not an

    implementation_of `adhere`, and cannot be aliased to it anyway -- adhere is absent from the

    frozen 42 and R4 forbids a non-registered `of:`.


    NOT alias of `agitate` (BrownianDynamics, order 17), the sibling stepper. `agitate` is the

    motion-family THERMAL-NOISE primitive (std = sqrt(2 kT dt / gamma)); `relax` is the

    DETERMINISTIC (kT=0) equilibration and, unlike agitate''s single Euler-Maruyama increment, runs

    to a force balance rather than taking one time-step. Different biology (equilibration vs

    thermal agitation), different backward (implicit-diff of a fixed point vs pathwise noise).


    SOURCE-vs-PAPER (in surprises): the paper (p. 14) calls this "gradient descent energy

    minimization ... for a FIXED NUMBER OF STEPS"; the source runs FIRE to a force TOLERANCE and

    differentiates the EQUILIBRIUM by implicit diff. SOURCE WINS -- and that contradiction is

    exactly why `relax` (a converged, implicitly-differentiated equilibrium) is a distinct contract

    from a fixed-step descent, which would be mere repeated application of the force law.

    '
