- id: stochastic_step
  order: 5
  raw_name: StochasticStep
  raw_kind: step (SimulationStep)
  code_path: papers/jax-morph/jax_morph/core/step.py:L148
  paper_section: p. 10 (Methods, "Gradient calculation", the REINFORCE estimator); appendix pp. 16-18
    (REINFORCE / policy-gradient derivation); guide jax_morph/guides/extending.md heading "Stochastic
    steps"
  summary: An abstract mixin (subclass of SimulationStep, is_stochastic=True) that does not itself write
    physical state but fixes the sample/replay/score contract for a stochastic step. The DERIVED forward
    __call__ samples a *trace* -- parameter-free exogenous noise plus the realized action (e.g. the 0/1
    divided, or a displacement dx) -- and replays it pathwise to produce the step's actual effect (a new
    state for quasistatic/discrete, a dt-scaled sparse delta for dynamic), co-emitting the trace into
    ephemeral trace fields of the post-step state. Separately, the model's scoring drivers read that recorded
    trace back out and replay it with parameters live, summing each selected step's log-density (logp)
    -- this is the differentiable REINFORCE policy the paper needs.
  equations: "The mixin has no numeric physics update of its own; its \"update to the state\" is the composition\n\
    it forces on every subclass.\n\nForward sampler (derived __call__, L327-339):\n    __call__(s; dt,\
    \ key) = replay(s, sample_trace(s; dt, key); dt, pathwise=True)\n\nPer-step scoring (Model._replay_transition,\
    \ L550-572); with the recorded post-step state s'_rec,\n    trace = trace_from_state(stop_gradient(s'_rec))\
    \          # trace detached; only s / theta carry gradient\n    scored   step i:  L += logp(s, trace,\
    \ dt);  s <- replay(s, trace; dt, pathwise=False)  # frozen action\n    unscored step i:  s <- replay(s,\
    \ trace; dt, pathwise=True)                             # recompute from noise\n    pathwise = not\
    \ scored                                    # set by the MODEL, not the step\n\nReparameterization\
    \ lives inside replay, keyed on `pathwise` (extending.md Example B, L374-380):\n    pathwise=True\
    \  -> dx = mean(s) + std(theta) * xi          # recomputed with live theta\n    pathwise=False ->\
    \ dx = frozen realized value              # a discrete node ignores pathwise entirely\n\nThe score-function\
    \ gradient this implements (paper p. 10, eq.):\n    grad_theta L(theta) ~= sum_{t=0..T-1} L_t * grad_theta\
    \ log pi_theta(a_t | s_t)\nwhere logp = log pi_theta(a_t | s_t), L_t is the discounted future loss,\
    \ a_t the division action.\nMDP trajectory density (appendix p. 17): P(tau) = P(s0) * prod_t pi(a_t|s_t)\
    \ P(s_{t+1}|s_t,a_t);\nthe code factorizes exactly this, one pi_theta term per stochastic step per\
    \ macro-step.\n"
  params:
    score_by_default: scoring-inclusion policy flag -- a static, keyword-only bool (default True). Whether
      this step's logp is summed when a scoring driver is called with score=None; 'all' overrides it.
      It is the ONLY per-instance knob the mixin adds, is NOT a physics parameter, and is NOT the reparameterizability
      switch (that is intrinsic to the distribution and lives inside replay, selected by the model's pathwise
      = not scored).
  state_io:
    reads: None declared by the mixin itself -- state_reads() defaults to () and is subclass-defined (e.g.
      Division reads division_rate, division_axis).
    writes: None declared by the mixin itself -- state_writes() defaults to () and is subclass-defined.
      A stochastic output that must PERSIST across macro-steps is a state_writes field (written by replay),
      never a trace field.
    trace_writes: 'The mixin adds a THIRD, ephemeral I/O category (trace_writes(), default ()): the recorded
      trace -- exogenous noise + realized action + an {action}_eligible mask -- reset to its declared
      default at the start of every macro-step (Model._reset_traces, L467-483). Folded into state_requires()
      (state_reads U state_writes U trace_writes, L197-203) but kept disjoint from state_writes.'
  surprises:
  - '__call__ is DERIVED, not implemented by the subclass (L327-339): it is exactly sample_trace then
    replay(pathwise=True). A reimplementer who writes __call__ directly loses the guarantee that the forward
    pass records precisely what a later replay would reconstruct.'
  - 'replay is the SINGLE source of the effect AND must co-emit every declared trace field into the state/delta
    it returns. Forgetting one is a SILENT failure: the forward records the reset default, trace_from_state
    reads that default back, and logp scores garbage with no error. check_stochastic_step (L625) is the
    only guard -- it drives the step from two different sentinel pre-fills and asserts the recorded trace
    round-trips (a single-run/reset-to-default inspection cannot catch it).'
  - 'Reparameterizability is NOT a constructor knob -- it is intrinsic to the distribution and encoded
    by whether replay honours pathwise=True. The model always passes pathwise = not scored: a scored step
    freezes its realized action (score-function/REINFORCE gradient through its own logp), an unscored
    reparameterizable step recomputes its value from the frozen noise with live theta so the gradient
    flows pathwise into a later scored step''s logp. A discrete node has nothing to reparameterize and
    ignores pathwise.'
  - 'Trace fields are EPHEMERAL and validated hard (Model._validate, L426-462): a trace field may not
    shadow a base or state_writes field (the per-macro-step reset would wipe it), must be unique per stochastic
    step (two steps sharing a name clobber one allocation -- namespace by the action verb), and a DYNAMIC
    (additive) trace field must default to 0 or reset-then-accumulate records default+value instead of
    the step''s own increment.'
  - 'sample_trace may OMIT a derived realized value (a Brownian dx = mean + std*xi): the pathwise replay
    recomputes and records it, so there are never "two formulas that must agree". But it must return every
    entry replay(pathwise=True) reads (the noise + any directly sampled discrete action), and each entry
    AS it will be recorded -- eligibility masking happens inside sample_trace, not replay.'
  - _dist(state, dt) is the recommended SINGLE source of the distribution parameters, called by both sample_trace
    and logp so a step cannot sample under one distribution and score under another.
  - Scoring stop_gradient's the recorded next-state ONCE (L558) so the trace is detached and only the
    live conditioning state and theta carry gradient; deterministic steps inside replay get a fixed _PLACEHOLDER_KEY
    = PRNGKey(0) (L34), since replay is a re-execution with live params, not a re-draw.
  - 'PAPER-vs-CODE gap: the paper describes ONLY the discrete-event REINFORCE / score-function estimator
    for cell division ("stochastic operations do not have a well-defined differentiation rule", p. 9-10),
    and treats the division plane as chosen uniformly at random (p. 2). The code GENERALIZES this into
    a reparameterizable pathwise branch (replay(pathwise=True)) and an oriented placement -- a second,
    lower-variance gradient path the paper never mentions. The two estimators must not be summed in one
    run (division.py L1-8); the source is authoritative here.'
  verdict: out_of_scope
  of: null
  why: 'StochasticStep is an ABSTRACT differentiability mixin, not a forward-dynamics operator. Its own

    state_writes() and trace_writes() both default to (): it writes no physical state of its own and

    adds exactly one non-physical constructor knob (score_by_default, a scoring-inclusion flag). Its

    entire content is the gradient-estimator machinery -- sample parameter-free exogenous noise,

    replay it to produce the effect, and score each selected step''s logp -- i.e. the REINFORCE /

    score-function estimator (paper p. 10) for discrete events plus a reparameterized pathwise branch

    the model selects via `pathwise = not scored`. That is autodiff / optimization plumbing. In

    Plexus, differentiability is an ENGINE concern (torch autograd over the forward operators), not an

    operator in the forward algebra, so there is nothing here for the vocabulary to gain.


    The biology lives entirely in the concrete subclasses, each already its own atlas entry and each

    carrying its own real contract: a Bernoulli division IS `cell_divide` (order 26 `division`), death

    IS apoptosis (order 6 `death`), a Brownian displacement IS motion. The mixin adds nothing to those

    forward effects; it adds only the gradient PATH (which estimator, how the trace round-trips into

    scoring). Hence not `alias`/`refinement`: no registered contract models gradient estimation, and

    widening one to admit trace/replay/score would graft an optimization concern onto a

    forward-dynamics signature. And not `new`: counting a differentiability contract as a new operator

    would inflate the yield with framework machinery, exactly the failure out_of_scope exists to

    prevent. The strongest counter -- "an operator whose effect is a scored random draw" is a genuine

    gap -- is rejected because that forward effect already has a biological home in the subclass''s own

    contract; only the AD path is left over, and that is not a forward operation on state.


    SOURCE-vs-PAPER (recorded in surprises): the paper describes ONLY the discrete score-function

    estimator and a uniformly-random division plane; the code additionally supports a reparameterized

    pathwise branch and oriented placement -- a lower-variance path the paper never mentions. The two

    estimators must not be summed in one run (division.py L1-8); the source is authoritative.


    OVERLAP: the sibling entry `stochastic_trace___replay___score` (order 24) is the SAME

    core/step.py:148 class and should receive the same out_of_scope verdict.

    '
  contract:
    name: sample_score
    kind: exchange
    family: fields
    set: cell
    inputs:
    - cell
    outputs:
    - cell
    reads: []
    writes:
    - trace
    maps: []
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: death
  order: 6
  raw_name: Death
  raw_kind: step (StochasticStep)
  code_path: papers/jax-morph/jax_morph/physics/death.py:L26
  paper_section: 'p. 2 (Forward Model): death is ABSENT from the model''s cell capabilities; see surprises'
  summary: 'Discrete stochastic removal (apoptosis) as a scorable jump: each cell alive at the death decision
    independently draws a Bernoulli death event with per-cell hazard probability p = 1 - exp(-death_rate*dt).
    A cell that draws 1 has its boolean `alive` flipped to False; the step also writes a persistent per-step
    `death` record (float 0/1) for lineage postprocessing and co-emits the ephemeral scored trace (`died`,
    `die_eligible`). It does NOT free or recycle the vacated slot within the step -- reuse is deferred
    to a later macro-step.'
  equations: "Indices: i ranges over state-array slots (0..capacity-1). lambda_i = death_rate_i (per-cell\n\
    hazard rate), dt = macro-step duration, alive_i = boolean liveness mask.\n\nPer-cell hazard over one\
    \ macro-step (Death._dist, shared by sample and score):\n    p_i = 1 - exp(-lambda_i * dt)       \
    \     # code: -jnp.expm1(-clip(death_rate,0,None)*dt)\n\nForward sample (sample_trace):\n    died_i\
    \         = Bernoulli(p_i) * alive_i   # exact 0/1 forward draw, masked to live cells\n          \
    \                                      #   identity surrogate: d died_i / d p_i = 1\n    die_eligible_i\
    \ = alive_i                    # cells alive AT the death decision\n\nEffect (replay; hard, ignores\
    \ `pathwise` -- a discrete node has nothing to reparameterize):\n    die_i    = (died_i > 0.5) AND\
    \ alive_i       # re-AND with live `alive` is a guard\n    alive_i' = alive_i AND (NOT die_i)    \
    \      # slot flipped dead; NOT freed this macro-step\n    death_i  = 1.0 if die_i else 0.0      \
    \      # persistent per-step record, cast to float\n\nScore (logp -- score-function / REINFORCE term,\
    \ not pathwise):\n    logp = sum_i die_eligible_i * [ died_i*log(p_i) + (1-died_i)*log(1-p_i) ]\n\n\
    PAPER vs CODE: the paper writes NO death equation -- \"death\"/\"apoptosis\" never appear in it\n\
    (see surprises). The above is the CODE only. It mirrors Division's hazard p = 1 - exp(-lambda*dt).\n"
  params:
    score_by_default: default-scoring / gradient-term inclusion flag -- whether this stochastic step contributes
      its `logp` (the score-function term for survival/death objectives) when a scoring driver is called
      with score=None. Static bool, not a physical parameter. NOTE the tunable physical parameter is `death_rate`,
      which is NOT a constructor argument but a per-cell STATE field (heritable) supplied by an initial
      condition or an upstream controller.
  state_io:
    reads:
    - death_rate
    writes:
    - alive
    - death
    trace_writes:
    - died
    - die_eligible
  surprises:
  - 'PAPER CONTRADICTION (source wins, and the most valuable item here): the paper does NOT model cell
    death. The strings "death"/"apoptosis"/"necrosis" appear ZERO times in it; the forward model''s cell-capability
    list (p. 2) is exactly "division, growth, mechanical stress sensing, and morphogen excretion and detection"
    -- no death. The paper''s only cell removal is an EXTERNAL robustness ablation applied post-hoc to
    a finished cluster ("robustness to cell removal", p. 8; Fig. caption "Loss of the final state after
    removal, at random, of a fraction of cells", p. 21) to measure loss sensitivity -- NOT a per-cell
    hazard dynamic inside the model. So `Death` is a reimplemented-library step with no counterpart mechanism
    in the paper; a reader who trusts the paper would omit it entirely.'
  - Composition ordering is load-bearing. Division MUST run before Death in the discrete phase (divide-then-die).
    Both are DISCRETE, run in pipeline order, and are exempt from write-conflict checks. In one macro-step
    a mother AND its newborn daughters can all die. Reversing the order, or recycling death-freed slots
    in the same step, corrupts lineage reconstruction.
  - Death flips `alive` to False but does NOT free/recycle the vacated slot within the step. Division's
    slot allocator (`jnp.nonzero(~alive)`) reuses the slot only on a LATER macro-step; deferring reuse
    is deliberate so the `death` record survives for `reconstruct_lineage`, which processes births-then-deaths
    within each frame.
  - Two look-alike fields. `died` is the EPHEMERAL trace (reset each macro-step, scored by logp, straight-through
    float 0/1). `death` is a PERSISTENT state_writes float 0/1 record and is RE-DERIVED inside replay
    by `(died > 0.5) & state.alive`, not copied from `died`. A reimplementer who persists `died` directly,
    or drops the re-AND with `alive`, would mark an already-dead slot as newly dead.
  - '`death` is OVERWRITTEN each macro-step (set to that step''s die mask), NOT accumulated. It is meaningful
    only as the full (n_steps+1, capacity) trajectory fed to `reconstruct_lineage`; reading a single final
    `death` array as a lifetime death count is wrong. It is cast to float (death_rate.dtype), not bool,
    so it can be summed/averaged/differentiated downstream; `alive` stays boolean.'
  - 'Eligibility mask: `die_eligible = alive` is captured at the death DECISION (after Division has already
    run within the same discrete phase). `logp` multiplies the per-cell Bernoulli density by `die_eligible`,
    so a cell dead-at-decision contributes 0. Re-reading a live `alive` at score time would use the wrong
    mask (alive changes between decision and score). This is the codebase''s `{action}_eligible` trace
    convention.'
  - '`death_rate` is clipped to >= 0 (`jnp.clip(rate, 0, None)`) before forming p, so a negative rate
    (e.g. an unconstrained controller output) yields p = 0 rather than a negative probability that would
    NaN through `bernoulli_logp`. Omitting the clip silently corrupts the score.'
  - 'Gradient-estimator discipline: the forward `died` is an EXACT Bernoulli draw (bit-identical to the
    hard sample, temperature-free identity surrogate), but the physical effect is a hard boolean mask
    -- so survival/death objectives must use the SCORE-FUNCTION gradient via `logp` (REINFORCE), never
    a pathwise gradient through the alive mask. A discrete node has nothing to reparameterize; `replay`
    ignores `pathwise`. Use exactly one estimator per run, never both.'
  verdict: new
  of: null
  why: 'No registered contract removes cells or models cell death. The frozen baseline has proliferation

    (cell_divide) and size change (cell_grow) in the growth family, but nothing that RETIRES a set

    member. The closest contract is cell_divide, and the resemblance is real -- Death shares its exact

    Bernoulli hazard p = 1 - exp(-death_rate*dt), its >=0 rate clip, its straight-through discrete

    draw, its {action}_eligible trace convention, and its structural/growth/cell typing. But it is

    cell_divide''s biological INVERSE: division wakes a dormant slot (occ 0->1), shrinks the mother

    by 2^(-1/d), scatters a volume-conserving daughter that inherits the mother''s heritable state,

    and records born/mother lineage; Death flips `alive` True->False (a live slot 1->0), frees no slot

    within the macro-step, and writes a per-step float `death` lineage record. Widening cell_divide to

    also destroy set members would force ONE contract to both create and remove cells -- violence to

    its biology (mitosis is not apoptosis; the paper itself lists division as a cell capability and

    never mentions death, see surprises). The shared Bernoulli-hazard timing is an interchangeable

    IMPLEMENTATION detail -- death could equally be threshold- or stress-triggered -- not contract

    identity, which Plexus fixes by what the operator does to the state (its outputs/writes and

    semantics), not by the noise model it borrows. Hence `new`: a distinct structural/growth operator

    `apoptose` on the cell set, not an alias or refinement of cell_divide.

    '
  contract:
    name: apoptose
    kind: structural
    family: growth
    set: cell
    inputs:
    - cell
    outputs:
    - cell
    reads:
    - death_rate
    writes:
    - alive
    - death
    maps: []
  status: validated
  module: src/plexus/operators/candidates/jax_morph_death.py
  test: tests/test_jax_morph_death.py
  evidence:
    oracle_run: diff_death
    diff_metric: 'Pooled per-macro-step death hazard difference |p_hat_plexus - p_hat_oracle| (dimensionless

      probability per macro-step). For each side p_hat = (n_active[0] - n_active[-1]) / sum(n_active[:-1])

      over all 41 recorded frames of a PURE-DEATH rollout (apoptose / Death the ONLY operator; no

      births, so every live-count decrement is one committed death and p_hat is the maximum-likelihood

      Bernoulli hazard pooled over every eligible live-cell-step). Oracle: Model([Death]), N0=50000

      live cells at uniform death_rate lambda=0.05, dt=1.0, 40 macro-steps

      (atlas_jax/_oracle/runs/diff_death). Plexus: config/atlas_jax/death.yaml, identical

      N0/lambda/dt/frame-count (log/atlas_jax/death). The estimator is invariant to the engine''s

      record-after-apply off-by-one -- Plexus'' first RECORDED frame is already post-step-1 (47506,

      not the pristine 50000; apoptose acted 41x over 41 frames per the acted ledger) -- because a

      constant-hazard process is stationary, so any consecutive-frame window is unbiased for p.

      A frame-index-aligned survival-curve diff would be WRONG here; the pooled hazard is not.

      '
    threshold: '0.000986 = 3 * SE_pooled, with SE_pooled = sqrt(SE_oracle^2 + SE_plexus^2) and each

      SE = sqrt(p_hat*(1-p_hat)/eligible_cellsteps); ~8.8e5 eligible live-cell-steps per side give

      SE ~ 2.3e-4. Pre-registered as the FORMULA 3*SE_pooled (a principled sampling band), not a

      number picked after the result. Not looser: the exact hazard 1-exp(-lambda*dt)=0.048771 differs

      from the linear-approximation bug lambda*dt=0.05 by 0.00123 > 0.000986, so this band FAILS an

      operator that wrote p=rate*dt instead of the source''s -expm1(-rate*dt), whereas a 5% band would

      pass that bug undetected.

      '
    value: 5.66e-05
    passed: true
    detail: 'p_hat_oracle = 0.048928 (SE 2.29e-4; 43236 deaths / 883662 eligible cell-steps),

      p_hat_plexus = 0.048985 (SE 2.35e-4; 41169 deaths / 840445 eligible cell-steps).

      diff = 5.66e-05 = 0.17 * SE_pooled  <=  threshold 0.000986  -> PASS.

      Both match the exact hazard 1-exp(-0.05)=0.048771: oracle 0.69 SE, plexus 0.91 SE (both < 3 SE).

      Acted ledger: apoptose calls 41, acted 41, inert_operators [] -> valid_evidence true.

