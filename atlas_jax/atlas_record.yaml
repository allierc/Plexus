- id: lennard_jones
  order: 18
  raw_name: LennardJones
  raw_kind: potential (PairwisePotential)
  code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L419
  paper_section: p. 9 'Mechanical interactions' (Morse energy Vij, eq. lines 514-520; also Methods p.
    14 lines 758-772) - the paper's mechanics are Morse ONLY; LennardJones appears nowhere in the paper.
  summary: 'A pair-interaction ENERGY component (not a step): given cell positions it returns a scalar
    total interaction energy over live, non-self pairs, from which the wrapping step (MechanicalRelaxation
    / BrownianDynamics / ActiveBrownianDynamics2D) derives per-cell forces by autodiff. The pair energy
    is Lennard-Jones in ``r_min`` form: a hard r^-12 repulsive core plus a 2*r^-6 adhesive tail whose
    minimum is exactly ``-epsilon`` at the contact distance ``sigma = r_i + r_j``, multiplied by a smooth
    cutoff that truncates the tail between ``r_onset_frac*sigma`` and ``r_cutoff_frac*sigma``. It writes
    no state itself.'
  equations: "Pair energy (LJ, r_min form), for a pair at separation r with contact distance sigma:\n\
    \  x       = safe_divide(sigma, r)              # = sigma/r, but 0 (not inf) at r=0\n  U_lj(r) = epsilon\
    \ * ( x**12 - 2 * x**6 )     # minimum -epsilon exactly at r = sigma\n  U(r)    = U_lj(r) * S(r; r_on,\
    \ r_off)        # tail truncated by the smooth cutoff\nwhere\n  sigma   = r_i + r_j              \
    \            # contact distance = sum of the two radii (per pair)\n  r_on    = r_onset_frac  * sigma\
    \              # default 1.5 * sigma\n  r_off   = r_cutoff_frac * sigma              # default 2.5\
    \ * sigma\nSmooth cutoff S (jax-md multiplicative switch, C1), with r2=r^2, ron2=r_on^2, roff2=r_off^2:\n\
    \  S(r) = 1                                              for r <= r_on\n  S(r) = (roff2-r2)^2 (roff2\
    \ + 2 r2 - 3 ron2)/(roff2-ron2)^3   for r_on < r < r_off\n  S(r) = 0                             \
    \                 for r >= r_off\nAggregation (inherited from PairwisePotential.total_energy):\n \
    \ E_total = 0.5 * sum_i sum_{j alive, j != i} U(r_ij)   # each live pair counted once\n  forces  =\
    \ -grad_positions(E_total)                    # via jax.grad; no analytic force\nPer-cell virial pressure\
    \ (inherited, optional consumer):\n  p_i = -(1/(2 d V_i)) sum_j r_ij (dU/dr)(r_ij)         # V_i is\
    \ the d-ball volume of radius r_i\nCODE vs PAPER: the paper uses the MORSE energy for all mechanics,\
    \ never Lennard-Jones:\n  V_morse(r) = epsilon * [ (1 - exp(-alpha (r - sigma)))^2 - 1 ]   (paper\
    \ eq., p. 9 / p. 14)\n"
  params:
    epsilon: well_depth / adhesion_energy_scale - sets BOTH the repulsion strength and the adhesive well
      depth (the minimum equals -epsilon at contact). A shared scalar OR a per-cell ``StateFieldSpec``;
      a per-cell epsilon is combined per pair by the ARITHMETIC mean ``0.5*(e_i+e_j)`` (base ``mix``),
      not a geometric / Lorentz-Berthelot rule. Default 1.0.
    r_onset_frac: interaction_cutoff_onset - start of the smooth truncation window as a multiple of the
      contact distance sigma; the tail is untouched (S=1) inside this radius. Default 1.5.
    r_cutoff_frac: interaction_range / cutoff - end of the smooth truncation window as a multiple of sigma,
      beyond which the energy is exactly 0. Must satisfy r_onset_frac < r_cutoff_frac (checked at construction).
      Default 2.5.
  state_io:
    reads:
    - position (capacity, n_space_dim) - supplied to total_energy; also state.position for virial
    - radius (capacity,) - forms the per-pair contact distance sigma = r_i + r_j
    - alive (capacity,) - masks dead cells and self-pairs in neighbor_sum
    - 'displacement (static, from the state''s space: free_space / periodic) - the pairwise metric'
    - n_space_dim (static) - only for the inherited virial_pressure (d-ball volume)
