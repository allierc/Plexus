    For a pair at separation r with contact distance sigma = r_i + r_j (sum of the two cells'' radii),
    it contributes overlap energy U(r) = (epsilon/2)(1 - r/sigma)^2 while the cells overlap (r < sigma)
    and exactly zero at and beyond contact. It does not itself write state; a wrapping step (MechanicalRelaxation
    / BrownianDynamics / ActiveBrownianDynamics2D / a stress step) turns its autodiff-derived forces into
    a position update. Both energy and force vanish at r = sigma (C1), so cells feel a soft push that
    fades smoothly as the overlap closes -- the canonical soft-disk / active-matter excluded-volume model,
    with no adhesive tail and no cutoff to tune.'
  params:
    epsilon:
