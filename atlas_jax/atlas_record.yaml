  equations: "CODE (this class). pair_energy(r, sigma, eps) delegates to _compact_repulsion(r, sigma,\
    \ eps, exponent=2.0, prefactor=0.5), i.e.\n\n    U(r) = 0.5 * eps * (1 - r/sigma)^2   for r < sigma,\
    \   U(r) = 0   for r >= sigma,\n\nwith sigma = r_i + r_j (contact distance = SUM of radii, per pair)\
    \ and eps the repulsion strength (a shared scalar, or the arithmetic mean 0.5*(eps_i + eps_j) when\
    \ epsilon is a per-cell field). Radial force magnitude F = -dU/dr = eps*(1 - r/sigma)/sigma > 0 inside\
    \ contact (repulsion); at r -> sigma both U -> 0 and dU/dr -> 0 (C1; the second derivative jumps from\
    \ eps/sigma^2 to 0). Forces are obtained by autodiff of the total energy, never hand-coded: total_energy\
    \ = 0.5 * sum_i sum_{j != i, alive} U(r_ij)  (the leading 0.5 counts each pair once and is DISTINCT\
    \ from the per-pair 0.5 above; self- and dead-pairs are dropped by neighbor_sum). Per-cell virial\
    \ pressure (inherited from PairwisePotential): p_i = -(1/(2 d V_i)) * sum_j r_ij (dU/dr)(r_ij), V_i\
    \ the d-ball volume of radius r_i (2 r, pi r^2, 4/3 pi r^3 for d = 1,2,3); the sign makes compression\
