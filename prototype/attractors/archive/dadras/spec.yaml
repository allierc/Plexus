# Dadras-Momeni (2009) -- xd=y-a x+b y z; yd=c y-x z+z; zd=d x y-e z. A swooping multi-wing
# "bird" of swept sheets. Fully 3D, so the camera orbits freely.
general: {name: dadras, seed: 0, n_frames: 16000, dt: 0.003,
          boundary: free, dim: 3, world: [50.0, 30.0, 40.0], record_cap: 800}
sets:
  cloud:
    n: 120000
    start: [0.8, 1.8, -2.3, 1.4, 2.4, -1.7]             # seed cube (center [1.1,2.1,-2] +/- 0.3)
fields: {}
operators:                                              # dt<=0.004 keeps Euler stable on the quadratic terms; clamp is a far safety valve only
  - {op: attractor_flow, at: cloud, system: dadras, a: 3.0, b: 2.7, c: 1.7, d: 2.0, e: 9.0, clamp: 5000.0}
schedule: [attractor_flow]
plotting:
  color: [1.0, 0.35, 0.72]          # magenta
  splat_core: 0.95
  splat_halo: 3.2
  ref_quantile: 0.93
  gamma: 0.78
  core_power: 3.0
  core_amt: 0.6
  bloom: 0.45
  trail_decay: 0.45
  camera_azim: 0.6
  camera_elev: 1.08
  camera_turns: 0.45
  camera_elev_drift: 0.1
