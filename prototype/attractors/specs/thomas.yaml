# Thomas' cyclically-symmetric attractor -- xd = sin(y) - b x (+ cyclic y,z). A woven cage of
# interlinked loops; mixing is slow (small Lyapunov exponent) so it runs for a long sim-time.
general: {name: thomas, seed: 0, n_frames: 15000, dt: 0.02,
          boundary: free, dim: 3, world: [12.0, 12.0, 12.0], record_cap: 800}
sets:
  cloud:
    n: 120000
    start: [0.35, 0.15, -0.05, 0.85, 0.65, 0.45]        # seed cube (center [0.6,0.4,0.2] +/- 0.25)
fields: {}
operators:
  - {op: attractor_flow, at: cloud, system: thomas, b: 0.208}
schedule: [attractor_flow]
plotting:
  color: [0.72, 0.45, 1.0]          # violet
  splat_core: 0.95
  splat_halo: 3.2
  ref_quantile: 0.93
  gamma: 0.80
  core_power: 3.0
  core_amt: 0.6
  bloom: 0.45
  trail_decay: 0.5
  camera_azim: 0.5
  camera_elev: 1.1                   # fully 3D -> orbit freely to show the woven symmetry
  camera_turns: 0.5
  camera_elev_drift: 0.1
