# Halvorsen attractor -- a cyclically-symmetric (x->y->z) quadratic chaotic flow.
# A dense cloud is seeded in a tiny cube inside the basin; the `attractor_flow` operator
# rides every point along dx/dt = f(x) and the chaos unfolds the seed into a fat, three-armed
# glowing knot. `boundary: free` = open space (the flow is bounded by its own dissipation).
general: {name: halvorsen, seed: 0, n_frames: 10000, dt: 0.004,
          boundary: free, dim: 3, world: [16.0, 16.0, 16.0], record_cap: 800}
sets:
  cloud:
    n: 120000
    start: [-2.35, -2.35, -2.35, -1.65, -1.65, -1.65]   # small seed cube (center [-2,-2,-2] +/- 0.35)
fields: {}
operators:
  - {op: attractor_flow, at: cloud, system: halvorsen, a: 1.4}
schedule: [attractor_flow]
plotting:
  color: [1.0, 0.62, 0.16]          # amber
  splat_core: 0.95
  splat_halo: 3.2
  ref_quantile: 0.93
  gamma: 0.78
  core_power: 3.0
  core_amt: 0.6
  bloom: 0.45
  trail_decay: 0.45
  camera_azim: 0.5
  camera_elev: 1.05                  # 3/4 view of the three-armed knot; orbit reveals the 3-fold symmetry
  camera_turns: 0.50
  camera_elev_drift: 0.12
