# Chua's circuit double-scroll -- xd=alpha(y-x-h(x)); yd=x-y+z; zd=-beta y, with the piecewise-
# linear diode h(x)=m1 x + 0.5(m0-m1)(|x+1|-|x-1|). Two spiral disks joined in a bow-tie in the
# x-z plane (y is thin), so the camera views broadside along y and sweeps elevation gently.
general: {name: chua, seed: 0, n_frames: 12000, dt: 0.006,
          boundary: free, dim: 3, world: [8.0, 4.0, 10.0], record_cap: 800}
sets:
  cloud:
    n: 120000
    start: [0.45, -0.15, -0.35, 0.75, 0.15, -0.05]      # seed cube (center [0.6,0,-0.2] +/- 0.15)
fields: {}
operators:
  - {op: attractor_flow, at: cloud, system: chua,
     alpha: 15.6, beta: 28.58, m0: -1.1428571, m1: -0.7142857}
schedule: [attractor_flow]
plotting:
  color: [0.38, 0.62, 1.0]          # azure
  splat_core: 0.95
  splat_halo: 3.2
  ref_quantile: 0.93
  gamma: 0.78
  core_power: 3.0
  core_amt: 0.6
  bloom: 0.45
  trail_decay: 0.45
  camera_azim: 0.0                   # x -> screen-x, z -> screen-y: the bow-tie is in the x-z plane
  camera_elev: 1.32
  camera_turns: 0.08
  camera_elev_drift: 0.14
