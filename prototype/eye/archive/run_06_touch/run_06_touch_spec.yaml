# minimal transmission rig -- run_06_touch: E 240.0, A 67.0, radius 0.022, k_bone 9000.0
general:
  name: bench_run_06_touch
  seed: 0
  n_frames: 1800
  dt: 0.003
  boundary: wall
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  record_cap: 4000
  field_record_cap: 4000
sets:
  eye:
    n: 1
    start:
    - - 0.62
      - 0.5
      - 0.5
    state:
      pos:
        width: 3
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        integration: second_order_rate
        boundary: free
        record: false
      gaze:
        width: 3
        integration: none
        boundary: free
    types:
      globe:
        fraction: 1.0
        youngs: 420.0
        layers:
        - frac: 0.6
          youngs: 45.0
        - frac: 0.88
          youngs: 130.0
        - frac: 1.0
          youngs: 420.0
  mpm_particle:
    parent: eye
    per_parent: 40000
    radius: 0.105
    density: 1.0
  muscle:
    n: 2
    start:
    - - 0.3738084049835406
      - 0.5650999999999999
      - 0.5
    - - 0.3738084049835406
      - 0.4349
      - 0.5
    state:
      pos:
        width: 3
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        integration: second_order_rate
        boundary: free
        record: false
      act:
        width: 1
        integration: first_order
        boundary: free
      tension:
        width: 1
        integration: none
        boundary: free
      length:
        width: 1
        integration: none
        boundary: free
    types:
      muscle:
        fraction: 1.0
        youngs: 240.0
  muscle_particle:
    parent: muscle
    per_parent: 9000
    radius: 0.022
    density: 1.0
  bone:
    n: 1
    start:
    - - 0.16999999999999998
      - 0.5
      - 0.5
    types:
      bone:
        fraction: 1.0
        youngs: 1600.0
  bone_particle:
    parent: bone
    per_parent: 16000
    radius: 0.1
    density: 2.0
  orbit:
    n: 1
    start:
    - - 0.62
      - 0.5
      - 0.5
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 112
operators:
- op: eye_anatomy
  at: mpm_particle
  before_frame: 1
  center:
  - 0.62
  - 0.5
  - 0.5
  a_eq: 0.105
  axial_ratio: 1.0
  lens_radius: 0.0
  lens_center:
  - 0.0
  - 0.0
  - 0.0
  lens_youngs: 420.0
  cornea_youngs: 420.0
  pupil_deg: 0.0
  iris_deg: 0.0
- op: bone_block
  at: bone_particle
  before_frame: 1
  lo:
  - 0.1
  - 0.4
  - 0.4
  hi:
  - 0.24
  - 0.6
  - 0.6
  youngs: 1600.0
- op: muscle_morphogenesis
  implementation: tube
  at: muscle_particle
  before_frame: 1
  bone_end:
  - 0.21
  - 0.5
  - 0.5
  sphere_end:
  - 0.515
  - 0.5
  - 0.5
  radius: 0.022
  youngs: 240.0
  cap: 0.1
  bone_ends:
  - - 0.21
    - 0.5650999999999999
    - 0.5
  - - 0.21
    - 0.4349
    - 0.5
  sphere_ends:
  - - 0.5376168099670813
    - 0.5650999999999999
    - 0.5
  - - 0.5376168099670813
    - 0.4349
    - 0.5
- op: eye_pose
  at: eye
  child: mpm_particle
  shell_min: 0.86
- op: muscle_geometry
  at: muscle
  child: muscle_particle
  eye: eye
- op: muscle_probe
  implementation: tour
  at: muscle
  order:
  - 0
  - 1
  a_hi: 1.0
  tonic: 0.02
  hold: 500
  rest: 250
  lead: 100
  tau: 0.02
  step_frames: 60
- op: muscle_contract
  at: muscle_particle
  muscles: muscle
  amplitude: 67.0
  stretch_activation: 0.0
  strength:
  - 1.0
  - 1.0
- op: pin_region
  implementation: clamp
  at: bone_particle
  axis: 0
  beyond: -1000000000.0
- op: orbit_socket
  at: mpm_particle
  orbit: orbit
  k: 5000.0
  damp: 12.0
  radius: 0.112
  aperture: 62.0
  k_fat: 4000.0
  c_fat: 90.0
- op: drag
  at: mpm_particle
  k: 5.0
  emit: mpm_acceleration
- op: drag
  at: muscle_particle
  k: 6.0
  emit: mpm_acceleration
- op: mpm_strain
  at: mpm_particle
- op: mpm_strain
  at: muscle_particle
- op: mpm_strain
  at: bone_particle
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200
  polar: higham
- op: mpm_scatter
  at: muscle_particle
  to: mpm_grid
  implementation: accumulate
  drag: 0.0
  a_max: 200
  polar: higham
- op: mpm_scatter
  at: bone_particle
  to: mpm_grid
  implementation: accumulate
  drag: 0.0
  a_max: 200
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 1.0
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 1.0
  wall_contact: 0.02
  vmax: 1000000000.0
- op: mpm_gather
  at: muscle_particle
  from: mpm_grid
  wall_damp: 1.0
  wall_contact: 0.02
  vmax: 1000000000.0
- op: mpm_gather
  at: bone_particle
  from: mpm_grid
  wall_damp: 1.0
  wall_contact: 0.02
  vmax: 1000000000.0
schedule:
- eye_anatomy
- bone_block
- muscle_morphogenesis
- eye_pose
- muscle_geometry
- muscle_probe
- muscle_contract
- orbit_socket
- pin_region
- drag
- substep_dt: 0.0002
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  background: black
  fps: 30
