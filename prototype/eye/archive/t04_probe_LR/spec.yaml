# Phase 2 -- OPEN-LOOP step response. `oculomotor_drive` is replaced by
# `muscle_probe`, which steps LR from tonic to a_hi and ignores the gaze
# entirely, so the input is independent of the state and the closed-loop
# identification bias of Phase 1a is gone by construction.
general:
  name: eye_probe_c_a_probe_LR
  seed: 0
  n_frames: 650
  dt: 0.003
  boundary: wall
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  record_cap: 4000
  field_record_cap: 1
sets:
  eye:
    n: 1
    start:
    - - 0.5
      - 0.5
      - 0.46
    state:
      pos:
        width: 3
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        integration: second_order_rate
        boundary: free
        record: false
      gaze:
        width: 3
        integration: none
        boundary: free
    types:
      globe:
        fraction: 1.0
        youngs: 300.0
        layers:
        - frac: 0.6
          youngs: 9.0
        - frac: 0.88
          youngs: 40.0
        - frac: 1.0
          youngs: 300.0
  mpm_particle:
    parent: eye
    per_parent: 45000
    radius: 0.115
    density: 1.0
  muscle:
    n: 6
    start:
    - - 0.4875
      - 0.4942
      - 0.3375
    - - 0.4367
      - 0.5468
      - 0.3339
    - - 0.3896
      - 0.4942
      - 0.3435
    - - 0.4367
      - 0.4445
      - 0.3393
    - - 0.4754
      - 0.6046
      - 0.4612
    - - 0.4757
      - 0.406
      - 0.4591
    state:
      pos:
        width: 3
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        integration: second_order_rate
        boundary: free
        record: false
      act:
        width: 1
        integration: first_order
        boundary: free
      tension:
        width: 1
        integration: none
        boundary: free
      length:
        width: 1
        integration: none
        boundary: free
    types:
      muscle:
        fraction: 1.0
        youngs: 240.0
  muscle_particle:
    parent: muscle
    per_parent: 2200
    radius: 0.02
    density: 1.0
  orbit:
    n: 1
    start:
    - - 0.5
      - 0.5
      - 0.46
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 112
operators:
- op: eye_anatomy
  at: mpm_particle
  before_frame: 1
  center:
  - 0.5
  - 0.5
  - 0.46
  a_eq: 0.115
  axial_ratio: 0.82
  lens_youngs: 520.0
  cornea_youngs: 260.0
- op: muscle_morphogenesis
  at: muscle_particle
  before_frame: 1
  center:
  - 0.5
  - 0.5
  - 0.46
  a_eq: 0.115
  c_ax: 0.0943
  width: 0.034
  thickness: 0.021
  arc_deg: 30.0
  gap: 0.02
  embed: -0.013
  frac: 0.55
  youngs: 240.0
- op: eye_pose
  at: eye
  child: mpm_particle
  shell_min: 0.86
- op: muscle_geometry
  at: muscle
  child: muscle_particle
  eye: eye
- op: muscle_probe
  at: muscle
  muscle: 0
  a_hi: 1.0
  tonic: 0.14
  t_on: 60
  t_off: 560
  tau: 0.02
- op: muscle_contract
  at: muscle_particle
  muscles: muscle
  amplitude: 60.0
  stretch_activation: 0.0
- op: bone_anchor
  at: muscle_particle
  k: 9000.0
  c: 60.0
- op: orbit_socket
  at: mpm_particle
  orbit: orbit
  k: 5000.0
  damp: 12.0
  radius: 0.12200000000000001
  aperture: 62.0
  k_fat: 4000.0
  c_fat: 90.0
- op: drag
  at: mpm_particle
  k: 5.0
  emit: mpm_acceleration
- op: drag
  at: muscle_particle
  k: 6.0
  emit: mpm_acceleration
- op: mpm_strain
  at: mpm_particle
- op: mpm_strain
  at: muscle_particle
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200
- op: mpm_scatter
  at: muscle_particle
  to: mpm_grid
  implementation: accumulate
  drag: 0.0
  a_max: 200
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 1.0
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 1.0
  wall_contact: 0.02
  vmax: 1000000000.0
- op: mpm_gather
  at: muscle_particle
  from: mpm_grid
  wall_damp: 1.0
  wall_contact: 0.02
  vmax: 1000000000.0
schedule:
- eye_anatomy
- muscle_morphogenesis
- eye_pose
- muscle_geometry
- muscle_probe
- muscle_contract
- bone_anchor
- orbit_socket
- drag
- substep_dt: 0.00012
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  background: black
  fps: 30
