# embryo_BUD_base -- PHASE 3 / BUD batch 1: ISOLATED localized-growth (tip) mechanism validation.
# Inherits the MOR operating substrate (embryo_MOR_cap_align06_nodiv_s0: oriented 2-type demix via
# chemotax+sediment, flow_align, MPM+anchor, nodiv) and swaps cell_grow whole-body ANISOTROPIC growth for
# LOCALIZED TIP growth (mode=tip, tip seeds only the leading edge along axis) -- goal: a discrete,
# persistent, rounding BUD (org_bud_score>0 AND org_growth_bud_overlap>0) WITHOUT rupture or pattern loss.
# GENTLE budget deliberately AVOIDS the MOR tip-RUNAWAY [rejected b68/b69]: that plume came from dumping the
# whole reserve (target 5.5, prestretch 0.6, rate 1.1, reserve 36000) at one tip -> area 3-6x, escape 1.0.
# Here: rate 0.4 (slow wake ~3 particles/frame), target 1.8, prestretch 0.75 (mild pressure), reserve CAPPED
# at 8000 (hard ceiling 2.0x = physical plume bound). RUNAWAY SIGNATURE to watch: area >2.5x + deform >0.2 +
# escape ~1.0 TOGETHER (distinct from the ~0.7 body-drift-artifact escape under sediment).
general: {name: embryo_BUD_base, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44
    buffer: 44
    spawn: sunflower
    spawn_radius: 0.09
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.18, div_rate: 0.0, p: [0.0, 1.0, 0.0, 1.0]}
      b: {fraction: 0.5, move_speed: 0.18, div_rate: 0.0, p: [0.0, 1.0, 0.0, 1.0]}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 1.0, youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 8000, grow_reserve: 8000, radius: 0.15, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
  chem: {frame: grid, res: 64, components: 2}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}
  - {op: attraction_repulsion, at: agent, sigma: 0.03}
  - {op: deposit, at: agent, to: chem, amount: 0.5}
  - {op: diffuse, at: chem, rate: 0.1}
  - {op: decay, at: chem, rate: 0.2}
  - {op: chemotax, at: 'agent[type=a]', from: chem, channel: 1, gain: -0.10}
  - {op: chemotax, at: 'agent[type=b]', from: chem, channel: 0, gain: -0.10}
  - {op: sediment, at: 'agent[type=a]', gy: -0.10}
  - {op: sediment, at: 'agent[type=b]', gy: 0.10}
  - {op: glide, at: agent}
  - {op: cell_grow, at: cell, rate: 0.4, target: 1.8, mode: tip, aniso: 1.0, tip: 1.5, axis: [0.0, 1.0], offset: 0.03, prestretch: 0.75}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.1, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 2.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 8.0, wall_damp: 0.95}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.95, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - attraction_repulsion
  - deposit
  - diffuse
  - decay
  - chemotax
  - sediment
  - glide
  - cell_grow
  - mpm_anchor
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
