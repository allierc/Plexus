# embryo_GRO_u40 -- b54 uniform-elastic youngs ladder: SOFTER body (youngs 40) vs the u.yaml youngs 90.
# Softer elastic should offer less resistance to growth pressure -> larger area growth (hypothesis).
# All else identical to embryo_GRO_u (confine 0.03 + repel 150, radius 0.24, reserve 3000, target 2.0).
general: {name: embryo_GRO_u40, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44
    buffer: 3000
    spawn: sunflower
    spawn_radius: 0.16
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12, div_rate: 0.0}
      b: {fraction: 0.5, move_speed: 0.12, div_rate: 0.0}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 40
        layers:
          - {frac: 1.0, youngs: 40, material: elastic}     # UNIFORM softer elastic body
  mpm_particle: {parent: cell, per_parent: 8000, grow_reserve: 3000, radius: 0.24, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}
  - {op: glide, at: agent}
  - {op: cell_divide, at: agent, rate: 0.0, max_occ: 0.95, offset: 0.004}
  - {op: cell_grow, at: cell, rate: 1.1, target: 2.0, mode: isotropic, aniso: 0.0, offset: 0.01}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.1, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.9}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.9, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - glide
  - cell_divide
  - cell_grow
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
