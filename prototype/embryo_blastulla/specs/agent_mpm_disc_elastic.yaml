# agent_mpm_disc_elastic -- ACTIVE MATTER x MPM, 2D.
# Same as agent_mpm_disc_water but the disc is ELASTIC (a soft deformable tissue) with a thin
# LIQUID SKIN (outer 12%): the skin supplies the surface-tension colour field that both holds
# the disc's boundary and confines the agents, while the elastic interior deforms as the agents
# push through it (agent_to_mpm) -- closer to a tissue-in-membrane embryo. Rotates slowly.
general: {name: agent_mpm_disc_elastic, seed: 0, n_frames: 300, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 400
    spawn: disc
    spawn_radius: 0.24
    types:
      a: {fraction: 0.5, move_speed: 0.5}
      b: {fraction: 0.5, move_speed: 0.5}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 120
        layers:
          - {frac: 0.88, youngs: 120, material: elastic}   # deformable interior
          - {frac: 1.0,  youngs: 40,  material: liquid}     # surface-tension skin -> colour field
  mpm_particle: {parent: cell, per_parent: 12000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.035}
  - {op: polar_align, at: agent, gamma: 80.0, noise: 2.5}
  - {op: repel, at: agent, strength: 3.0, r0: 0.02}
  - {op: glide, at: agent}
  - {op: mpm_spin, at: mpm_particle, omega: 0.8, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 4.0e-5, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 120.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.8, confine: 140.0}
schedule:
  - radius_graph
  - polar_align
  - repel
  - glide
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.010
