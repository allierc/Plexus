# embryo_INT_g20_1p5x_move24 -- INT batch 8 (Batch 39): MOTILITY-FLOW capstone, PUSH to the user motility ceiling
# move_speed 0.24 (2x baseline). Same 1.5x g20-k6 dividing triple. Tests whether stronger motility raises coherent
# flow (net_circ / fourier_m1 drift / deform_rms) further while the chemotactic sort still holds -- OR whether at
# 0.24 diffusive rearrangement finally remixes (seg -> <0.22, b34 precedent at 0.24 nodiv). seed 0.
general: {name: embryo_INT_g20_1p5x_move24, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 132
    buffer: 225                              # cap: 0.88*225 = 198 = ~1.5x
    spawn: sunflower
    spawn_radius: 0.30
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.24, p: [0.0, 1.0, 0.0, 1.0]}
      b: {fraction: 0.5, move_speed: 0.24, p: [0.0, 1.0, 0.0, 1.0]}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}
          - {frac: 1.0,  youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
  chem: {frame: grid, res: 64, components: 2}
operators:
  - {op: cell_divide, at: agent, rate: 0.4, max_occ: 0.88, offset: 0.004}
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}
  - {op: attraction_repulsion, at: agent, sigma: 0.03}
  - {op: deposit, at: agent, to: chem, amount: 0.5}
  - {op: diffuse, at: chem, rate: 0.1}
  - {op: decay, at: chem, rate: 0.2}
  - {op: chemotax, at: 'agent[type=a]', from: chem, channel: 1, gain: -0.20}
  - {op: chemotax, at: 'agent[type=b]', from: chem, channel: 0, gain: -0.20}
  - {op: glide, at: agent}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 20.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 8.0e-6, k: 6.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - cell_divide
  - radius_graph
  - repel
  - attraction_repulsion
  - deposit
  - diffuse
  - decay
  - chemotax
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
