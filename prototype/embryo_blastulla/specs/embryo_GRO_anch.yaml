# embryo_GRO_anch -- GRO batch 1 OBSTACLE-DOC slot: same growth as embryo_GRO_base but with the
# substrate `mpm_anchor` (k 20) RESTORED. Predict: growth FAILS to expand area -- woken reserve
# particles (rest = frame-0 parent centre) are pulled inward by the anchor -> densification/overpack,
# not epiboly. Isolates why GRO must release the substrate anchor.
general: {name: embryo_GRO_anch, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44
    buffer: 3000
    spawn: sunflower
    spawn_radius: 0.22
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12, div_rate: 0.0}
      b: {fraction: 0.5, move_speed: 0.12, div_rate: 0.0}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}
          - {frac: 1.0,  youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 14000, grow_reserve: 6000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 8.0, r0: 0.02}
  - {op: glide, at: agent}
  - {op: cell_divide, at: agent, rate: 0.0, max_occ: 0.95, offset: 0.004}
  - {op: cell_grow, at: cell, rate: 0.3, target: 1.4, mode: isotropic, aniso: 0.0, offset: 0.01}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 20.0}     # RESTORED -- fights growth
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 3.0, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - glide
  - cell_divide
  - cell_grow
  - mpm_anchor
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
