# embryo_GRO_pb_res16a -- STAGE GRO batch 9 (b59). The GRO OPERATING POINT: the b58 prestretch fix
# (grow_ratio 1.202 at ps0.6) on the CLEAN weak-anchor base (mpm_anchor k2 = roundest, cleanest TIER-1,
# growth uncosted) WITH big reserve headroom (16000, cap 8000->24000 = 3.0x). The b58 result: prestretch-
# realized growth is RESERVE-LIMITED (bigres 16k 1.252 > base 12k 1.202) -> this res16a + wkanch is seed0
# of the 3-seed replication AND the base of the reserve ladder (res20a/res24a). offset 0.03 interior
# (b58: offset 0.06 fragments). prestretch 0.6 via dotted override. per_parent 8000 + reserve 16000 =
# 24000 pts (~1200s < wall). Growth read via drift-free grow_ratio.
general: {name: embryo_GRO_pb_res16a, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44
    buffer: 3000
    spawn: sunflower
    spawn_radius: 0.09
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12, div_rate: 0.0}
      b: {fraction: 0.5, move_speed: 0.12, div_rate: 0.0}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 90
        layers:
          - {frac: 1.0, youngs: 90, material: elastic}     # uniform free elastic ball, NO stiff membrane
  mpm_particle: {parent: cell, per_parent: 8000, grow_reserve: 16000, radius: 0.15, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}                      # USER FIX: 1A non-collapse force
  - {op: glide, at: agent}
  - {op: cell_divide, at: agent, rate: 0.0, max_occ: 0.95, offset: 0.004}   # division OFF (isolate growth)
  - {op: cell_grow, at: cell, rate: 1.1, target: 3.0, mode: isotropic, aniso: 0.0, offset: 0.03}  # THE growth op (interior offset)
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.1, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 2.0}             # WEAK anchor: contain drift, growth uncosted (b58)
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.95}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.95, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}   # USER FIX: 1A confine
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - glide
  - cell_divide
  - cell_grow
  - mpm_anchor
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
