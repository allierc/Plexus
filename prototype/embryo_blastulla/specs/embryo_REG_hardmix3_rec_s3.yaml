# embryo_REG_hardmix3_rec_s3 -- REG b116 (TERMINUS CONFIRMATION). DEEPER, UNIFORM active-counter-sort HARDMIX3, RECOVER arm, seed 3.
# b115 HARDMIX2 fired the pre-registered falsifier: recover final seg 0.923+/-0.096 vs frozen 0.244+/-0.149, Delta +0.68 >> 2*SD
# across 3 seeds = the ORG partition ACTIVELY RE-SORTS to ctrl fidelity once native demix drivers are restored (frozen, drivers
# OFF, stays deeply mixed) = EMERGENT REGENERATION of the partition. BUT the b115 insult under-scattered at the 50% checkpoint
# (seed0 0.910, seed2 0.50; only seed1 clearly <0.5) -- seed0's frozen only mixed AFTER the window. b116 = decisive replication
# on FRESH seeds 3/4/5 with a UNIFORMLY-DEEP insult so frozen is <0.5 at the 50% checkpoint on ALL seeds:
#   over [3000,6000): sediment SWAPPED and STRENGTHENED (a gy +0.18 / b gy -0.18; ORG value is 0.13) + chemotax MIX +0.20
#   + a mechanical repel-BURST add-on (2nd repel copy, strength 110, r0 0.040) to guarantee the scramble on stubborn seeds.
# RECOVER: BOTH sorting drivers RESTORED to ORG demix values at 6000 (chemotax -0.10, sediment a -0.13 / b +0.13); burst ends.
# Pairs with embryo_REG_hardmix3_froz_s3 (drivers left OFF after 6000). Primitives ONLY (frame-gated op copies; no repair op).
# Base = LOCKED ORG capstone embryo_ORG_swap_anisoY_sed13.yaml; body untouched by the insult.
general: {name: embryo_REG_hardmix3_rec_s3, seed: 3, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44
    buffer: 44
    spawn: sunflower
    spawn_radius: 0.09
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.18, div_rate: 0.0, p: [0.0, 1.0, 0.0, 1.0]}
      b: {fraction: 0.5, move_speed: 0.18, div_rate: 0.0, p: [0.0, 1.0, 0.0, 1.0]}
  cell:
    n: 7
    start: [[0.50, 0.50], [0.50, 0.30], [0.30, 0.50], [0.70, 0.50], [0.50, 0.66], [0.40, 0.78], [0.60, 0.78]]
    type_layout: split_x
    types:
      growA:
        fraction: 0.5
        youngs: 120
        layers:
          - {frac: 1.0, youngs: 120, material: elastic}
      growB:
        fraction: 0.5
        youngs: 120
        layers:
          - {frac: 1.0, youngs: 120, material: elastic}
  mpm_particle: {parent: cell, per_parent: 900, grow_reserve: 1550, radius: 0.10, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
  chem: {frame: grid, res: 64, components: 2}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}
  # PERTURBATION -- mechanical repel BURST add-on over [3000,6000): larger r0 spreads cells apart to deepen the scramble.
  - {op: repel, at: agent, strength: 110.0, r0: 0.040, after_frame: 3000, before_frame: 6000}
  - {op: attraction_repulsion, at: agent, sigma: 0.03}
  - {op: deposit, at: agent, to: chem, amount: 0.5}
  - {op: diffuse, at: chem, rate: 0.1}
  - {op: decay, at: chem, rate: 0.2}
  # PERTURBATION -- chemotax cue: DEMIX(-0.10) [0,3000), BOOSTED MIX(+0.20) [3000,6000), RESTORE DEMIX(-0.10) [6000,end).
  - {op: chemotax, at: 'agent[type=a]', from: chem, channel: 1, gain: -0.10, before_frame: 3000}
  - {op: chemotax, at: 'agent[type=b]', from: chem, channel: 0, gain: -0.10, before_frame: 3000}
  - {op: chemotax, at: 'agent[type=a]', from: chem, channel: 1, gain: 0.20, after_frame: 3000, before_frame: 6000}
  - {op: chemotax, at: 'agent[type=b]', from: chem, channel: 0, gain: 0.20, after_frame: 3000, before_frame: 6000}
  - {op: chemotax, at: 'agent[type=a]', from: chem, channel: 1, gain: -0.10, after_frame: 6000}
  - {op: chemotax, at: 'agent[type=b]', from: chem, channel: 0, gain: -0.10, after_frame: 6000}
  # PERTURBATION -- sediment: NORMAL(+/-0.13) [0,3000), SWAPPED+STRENGTHENED(+/-0.18) [3000,6000), RESTORED(+/-0.13) [6000,end).
  - {op: sediment, at: 'agent[type=a]', gy: -0.13, before_frame: 3000}
  - {op: sediment, at: 'agent[type=b]', gy: 0.13, before_frame: 3000}
  - {op: sediment, at: 'agent[type=a]', gy: 0.18, after_frame: 3000, before_frame: 6000}
  - {op: sediment, at: 'agent[type=b]', gy: -0.18, after_frame: 3000, before_frame: 6000}
  - {op: sediment, at: 'agent[type=a]', gy: -0.13, after_frame: 6000}
  - {op: sediment, at: 'agent[type=b]', gy: 0.13, after_frame: 6000}
  - {op: glide, at: agent}
  - {op: cell_grow, at: 'cell[type=growB]', rate: 0.4, target: 3.0, mode: anisotropic, aniso: 1.0, axis: [0.0, 1.0], offset: 0.03, prestretch: 0.7, stress_gain: 0.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.1, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 8.0, wall_damp: 0.95}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.95, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - attraction_repulsion
  - deposit
  - diffuse
  - decay
  - chemotax
  - sediment
  - glide
  - cell_grow
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
