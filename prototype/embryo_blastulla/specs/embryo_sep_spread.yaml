# embryo_sep_spread -- Batch-4 Stage-1A COMBO probe: active `separation` + LOWER spawn density.
# Rationale (Batch 4): b03 pinned the residual 1A defect as a FROZEN-EARLY doublet -- nn_min sits
# dead-flat ~0.0048 across 5/25/50/75/100% at confine 0.1 (msd frozen ~1.5e-4), yet at confine 0.0
# (seed1) nn_min STARTS at 0.0235 (>= r0) and cells diffuse (msd climbs 0.0013->0.017). So the doublet
# is CREATED by confinement's early inward press (cells lock within r0 before hard repel can hold
# spacing), then freezes. This spec stacks the two most mechanism-matched fixes: (1) active `separation`
# (self-limiting boids push, strong on a 0.005 doublet, ~7x weaker on the 0.05 lattice) to un-stick the
# pair, AND (2) a wider/thinner spawn lattice (n 44->32, spawn_radius 0.22->0.26, nominal spacing
# ~0.059->~0.081) so fewer cells are pressed into contact in the first frames. Run at confine 0.1 (the
# escape-safe, collapse-free point). If this reaches nn_min>=r0 while the sep-only and spread-only slots
# fall short, the fix requires BOTH un-sticking AND reduced early crowding. Base repel 8 / r0 0.02 so the
# gate stays at nn_min>=0.02 (r0 unchanged -- widening r0 only raises the bar; see b03 r0_03 slot).
general: {name: embryo_sep_spread, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 32                                    # LOWER density (was 44) -> wider even spacing
    buffer: 3000
    spawn: sunflower
    spawn_radius: 0.26                        # WIDER lattice (was 0.22)
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12, separation: 60.0}
      b: {fraction: 0.5, move_speed: 0.12, separation: 60.0}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}
          - {frac: 1.0,  youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 8.0, r0: 0.02}
  - {op: separation, at: agent, scale: 1.0e-7}          # active personal-space push (un-stick doublet)
  - {op: glide, at: agent}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 40.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 3.0, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - separation
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
