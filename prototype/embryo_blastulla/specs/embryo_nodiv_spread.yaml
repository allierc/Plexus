# embryo_nodiv_spread -- Batch-9 Stage-1A ROOT-CAUSE probe: nodiv base with LOWER spawn density.
# Rationale (Batch 9): b03 showed the residual 1A defect is a FROZEN-EARLY doublet -- nn_min sits
# dead-flat at ~0.006 (< r0 0.02) across 5/25/50/75/100% (0.0068->0.0054->0.0066->0.0066->0.0059,
# noise not climb) and gr_peak_r is bit-identical 0.0101 at every timepoint, so the close pair is a
# LOCKED force-balance equilibrium set in the first 5%, not a slowly-healing/worsening process. Hard
# exclusion (strength 8->24) only lifted the plateau 0.0025->0.0059; the trajectory being flat predicts
# more force plateaus too. This spec attacks the ROOT CAUSE instead of fighting it post-hoc: spread the
# initial lattice so no pair starts (or early-drifts) within r0. n 44->32 and spawn_radius 0.22->0.26
# raise nominal spacing ~sqrt(pi*R^2/n) from ~0.059 to ~0.081 (~1.4x, well above r0 0.02). Everything
# else is byte-identical to embryo_nodiv.yaml. If nn_min>=r0 here while the exclusion-force slots
# plateau, the doublet is SPAWN-CROWDING, not an exclusion-strength deficit.
general: {name: embryo_nodiv_spread, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 32                                    # LOWER density (was 44) -> wider even spacing
    buffer: 3000
    spawn: sunflower                         # EVEN initial coverage (Vogel golden-angle lattice)
    spawn_radius: 0.26                        # WIDER lattice (was 0.22)
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12}
      b: {fraction: 0.5, move_speed: 0.12}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}
          - {frac: 1.0,  youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 8.0, r0: 0.02}
  - {op: glide, at: agent}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 40.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 3.0, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
