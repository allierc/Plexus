# embryo_MOR_ab -- STAGE MOR batch 6 (b73). BUCKLE-ELIMINATION for the MOR-1 MAGNITUDE gate.
# b72 proved the negative paired Delta-m1 on the buckle-prone seeds is a BUCKLE ARTIFACT: stiffening
# seed2 youngs 90->160 FLIPPED its paired Delta-m1 from -0.045 to +0.110 (iso m1 0.148 -> +x 0.258),
# but circ stayed 0.606 (<0.7) so the shell still crumpled. This spec stacks TWO anti-buckle levers:
#   (1) youngs 90 -> 200 (stiffer shell resists compression buckling)
#   (2) surface_tension 0 -> 8 (rounds the outer boundary; penalizes high-wavenumber wrinkling m3-m5
#       far more than the low-wavenumber m1 bud dipole -> should kill buckle while sparing the +x bud).
# Growth axis +x (aniso 1.0), partition +y (differential sediment). Run paired iso (cell_grow.aniso 0.0)
# vs +x (aniso 1.0) on matched seed files s0/s1/s2 -> per-seed Delta-m1 with ROUND shells (target circ>0.85).
# GATE: all 3 paired Delta-m1 > 0 AND m1(+x)-m1(iso) > 2*SD with circ>0.80 -> MOR-1 magnitude MET.
general: {name: embryo_MOR_ab, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44
    buffer: 3000
    spawn: sunflower
    spawn_radius: 0.09
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12, div_rate: 0.0, p: [0.0, 1.0, 0.0, 1.0]}
      b: {fraction: 0.5, move_speed: 0.12, div_rate: 0.0, p: [0.0, 1.0, 0.0, 1.0]}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 1.0, youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 8000, grow_reserve: 36000, radius: 0.15, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
  chem: {frame: grid, res: 64, components: 2}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}
  - {op: attraction_repulsion, at: agent, sigma: 0.03}
  - {op: deposit, at: agent, to: chem, amount: 0.5}
  - {op: diffuse, at: chem, rate: 0.1}
  - {op: decay, at: chem, rate: 0.2}
  - {op: chemotax, at: 'agent[type=a]', from: chem, channel: 1, gain: -0.10}
  - {op: chemotax, at: 'agent[type=b]', from: chem, channel: 0, gain: -0.10}
  - {op: sediment, at: 'agent[type=a]', gy: -0.10}
  - {op: sediment, at: 'agent[type=b]', gy: 0.10}
  - {op: glide, at: agent}
  - {op: cell_divide, at: agent, rate: 0.0, max_occ: 0.95, offset: 0.004}
  - {op: cell_grow, at: cell, rate: 1.1, target: 5.5, mode: anisotropic, aniso: 1.0, axis: [1.0, 0.0], offset: 0.03, prestretch: 0.6}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.1, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 2.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 8.0, wall_damp: 0.95}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.95, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - attraction_repulsion
  - deposit
  - diffuse
  - decay
  - chemotax
  - sediment
  - glide
  - cell_divide
  - cell_grow
  - mpm_anchor
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
