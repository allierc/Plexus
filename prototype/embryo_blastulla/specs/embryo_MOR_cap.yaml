# embryo_MOR_cap -- STAGE MOR batch 10/10 (b77), the CAMPAIGN CAPSTONE (terminus).
# Integrates ALL established legs into ONE embryo and adds the ONE never-combined leg = DIVISION:
#   partition  (1E: heterotypic 2-channel chemotactic cross-repulsion, chemotax a<-ch1 / b<-ch0)
#   orientation(ORI/PAT: differential sediment a gy -0.10 / b gy +0.10 -> +y type-axis mi_type_y >=0.976)
#   growth     (GRO: cell_grow rest-volume expansion, epiboly area ~2x)
#   oriented-bud(MOR-1: anisotropic +x cell_grow -> body m=1 dipole, paired dm1 +0.067+-0.020)
#   flow       (INT: flow_align gain 40 coherent-flow regularizer)
#   DIVISION   (INT: cell_divide bounded ~1.5x -- the leg NEVER combined with the growing/budding embryo)
# Division: per-type div_rate 0.4 (per-type overrides op rate; MOR_ab had div_rate 0.0 = OFF), buffer 75
#   -> cap = max_occ 0.88 * 75 = 66 = ~1.5x of n=44 (the INT-established non-rupturing envelope).
# CAPSTONE QUESTION: does the full 6-leg chain hold TIER-1 (collapsed 0, nn_min ~r0) AND preserve each
#   established phenotype (mi_type_y >=0.90 oriented partition, area ~2x growth, +x m1 bud, seg high)
#   while division proliferates? INT established division is a mechanical mixing event that dilutes demix;
#   here the chemotactic+sediment re-sorting must outpace division mixing in the GROWING embryo.
general: {name: embryo_MOR_cap, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44
    buffer: 75
    spawn: sunflower
    spawn_radius: 0.09
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12, div_rate: 0.4, p: [0.0, 1.0, 0.0, 1.0]}
      b: {fraction: 0.5, move_speed: 0.12, div_rate: 0.4, p: [0.0, 1.0, 0.0, 1.0]}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 1.0, youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 8000, grow_reserve: 36000, radius: 0.15, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
  chem: {frame: grid, res: 64, components: 2}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}
  - {op: attraction_repulsion, at: agent, sigma: 0.03}
  - {op: deposit, at: agent, to: chem, amount: 0.5}
  - {op: diffuse, at: chem, rate: 0.1}
  - {op: decay, at: chem, rate: 0.2}
  - {op: chemotax, at: 'agent[type=a]', from: chem, channel: 1, gain: -0.10}
  - {op: chemotax, at: 'agent[type=b]', from: chem, channel: 0, gain: -0.10}
  - {op: sediment, at: 'agent[type=a]', gy: -0.10}
  - {op: sediment, at: 'agent[type=b]', gy: 0.10}
  - {op: glide, at: agent}
  - {op: cell_divide, at: agent, rate: 0.4, max_occ: 0.88, offset: 0.004}
  - {op: cell_grow, at: cell, rate: 1.1, target: 5.5, mode: anisotropic, aniso: 1.0, axis: [1.0, 0.0], offset: 0.03, prestretch: 0.6}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.1, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 2.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 8.0, wall_damp: 0.95}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.95, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - attraction_repulsion
  - deposit
  - diffuse
  - decay
  - chemotax
  - sediment
  - glide
  - cell_divide
  - cell_grow
  - mpm_anchor
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
