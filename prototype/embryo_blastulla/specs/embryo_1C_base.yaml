# embryo_1C_base -- Stage-1C workhorse: the 1B deform operating point (slow_k6: move 0.12,
# agent_to_mpm.agent_mass 8e-6, k 6.0) with DIVISION turned back ON, BOUNDED to ~4x growth.
# Rationale (Batch 14): 1A closed (b06), 1B gate consolidated (b13) -- slow_k6 is an [established]
# escape-safe membrane-deform lever (deform_rms ~0.0078, 6.3x the quiescent floor, escape 0/0/0).
# 1C asks: does DIVISION PRESSURE (proliferation crowding the core) deform/expand the shell on top
# of the flow-coupling deform, WITHOUT over-packing collapse (b01: div_rate 0.6 + buffer 3000 floods
# to n=2850 -> collapsed 0.99, a packing artifact)? So growth is CAPPED here: cap = max_occ*buffer.
# buffer 200, max_occ 0.88 -> ~176 cells = ~4x the initial 44 (the user's ceiling; disc holds ~1040
# at r0=0.02 hex, so 4x is geometrically safe -- collapse, if any, is a mechanism result not packing).
# Division uses the cell_divide `rate` fallback (types carry NO div_rate) so slots tune cell_divide.rate
# and cell_divide.max_occ directly. Judge every slot: TIER-1 gate escape=0 & collapsed=0 & nn_min>=r0
# FIRST, then area (shell expansion) + deform_rms/fourier_m2 rise vs the nodiv slow_k6 control.
general: {name: embryo_1C_base, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44                                    # start sparse; proliferate toward the cap (max_occ*buffer)
    buffer: 200                              # cap growth: max_occ 0.88*200 = ~176 = ~4x
    spawn: sunflower
    spawn_radius: 0.22
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12}
      b: {fraction: 0.5, move_speed: 0.12}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}     # water core (light blue), ~93% of radius
          - {frac: 1.0,  youngs: 200, material: elastic}     # THIN elastic membrane (deep blue), outer ~7%
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: cell_divide, at: agent, rate: 0.4, max_occ: 0.88, offset: 0.004}   # 1C: bounded proliferation (~4x)
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}         # 1A-locked: strong hard exclusion
  - {op: glide, at: agent}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 40.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 8.0e-6, k: 6.0}   # slow_k6: 1B deform operating point
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}   # 1A-locked: low press
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - cell_divide
  - radius_graph
  - repel
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
