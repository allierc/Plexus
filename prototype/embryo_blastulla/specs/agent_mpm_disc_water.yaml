# agent_mpm_disc_water -- ACTIVE MATTER x MPM, 2D.
# Two agent types (red/blue) self-propel + polar-align (collective migration) INSIDE a large
# WATER disc (all-liquid MPM, held together by surface tension). The fluid drags the agents
# and its surface-tension interface confines them (mpm_to_agent k + confine); the agents push
# momentum into the fluid and deform it (agent_to_mpm). The disc rotates slowly (mpm_spin).
#
# CLOCK: one global dt. The MPM clock is master (dt=0.002 per frame, substep_dt=2e-4 -> 10
# substeps/frame). Agent gains are expressed in THIS time unit: displacement/frame = dt*speed,
# turn/frame = dt*gamma; so agent speeds/rates look large vs the dt=1 active_matter2 specs.
general: {name: agent_mpm_disc_water, seed: 0, n_frames: 300, dt: 0.002, boundary: wall}
sets:
  agent:                                   # active-matter agents (name != cell, != mpm_particle)
    n: 400
    spawn: disc
    spawn_radius: 0.26
    types:
      a: {fraction: 0.5, move_speed: 0.5}
      b: {fraction: 0.5, move_speed: 0.5}
  cell:                                    # MPM disc parent (one disc at the domain centre)
    n: 1
    start: [[0.5, 0.5]]
    types:
      water:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 1.0, youngs: 200, material: liquid}   # whole disc liquid -> colour field
  mpm_particle: {parent: cell, per_parent: 12000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  # --- agent kinematics (all first-derivative, same prediction as mpm_to_agent) ---
  - {op: radius_graph, at: agent, radius: 0.035}
  - {op: polar_align, at: agent, gamma: 80.0, noise: 2.5}
  - {op: repel, at: agent, strength: 3.0, r0: 0.02}
  - {op: glide, at: agent}
  # --- slow disc rotation ---
  - {op: mpm_spin, at: mpm_particle, omega: 0.8, spin_k: 20.0}
  # --- MPM decomposed solver (+ agents pushing the grid, between p2g and grid_update) ---
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.4, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-5, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 300.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  # --- fluid drags + confines the agents (reads solved g.v; AFTER the substep) ---
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.8, confine: 140.0}
schedule:
  - radius_graph
  - polar_align
  - repel
  - glide
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.010
