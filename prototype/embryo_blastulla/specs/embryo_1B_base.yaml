# embryo_1B_base -- Stage-1B workhorse: the STABLE 1A operating point (n44, confine 0.03, repel 150),
# nodiv, with the confine/repel now BAKED IN so slot overrides only touch the flow drivers.
# Rationale (Batch 7): 1A gate (collapsed=0 & escape=0) met since b03 and now nn_min sits AT r0 (b06 s3
# 0.0199 = 0.995x; s4 = n44+c03+r150 = 0.019, collapsed/escape 0). The flagship low-density point (s3, n24)
# has the cleanest lattice, but 1B is about INNER FLOW DEFORMING the membrane, so we use n44 here for more
# collective cell->fluid->membrane push. Baseline (this spec, no driver change): deform_rms ~0.0012,
# fourier_m2/m3 ~3e-4, flow ~0.0016, net_circulation 0 -- membrane essentially UNDEFORMED. 1B slots raise a
# single driver (agent_to_mpm.agent_mass, mpm_spin.omega, move_speed via _fast, flow_align.gain) and measure
# deform_rms / fourier_m2+m3 / deform_cell_corr rise while collapsed=0 & escape=0 hold.
general: {name: embryo_1B_base, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44                                    # fixed population (division returns at 1C)
    buffer: 3000
    spawn: sunflower
    spawn_radius: 0.22
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12}
      b: {fraction: 0.5, move_speed: 0.12}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}     # water core (light blue), ~93% of radius
          - {frac: 1.0,  youngs: 200, material: elastic}     # THIN elastic membrane (deep blue), outer ~7%
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}         # 1A-locked: strong hard exclusion
  - {op: glide, at: agent}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 40.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}   # cells deform membrane (1B lever)
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}   # 1A-locked: low press
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
