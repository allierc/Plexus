# agent_mpm_disc_stable -- ACTIVE MATTER x MPM, 2D. The LONG-RUN-STABLE base.
# Lesson from the 1500-frame runs: an all-liquid disc slowly volume-drifts and aggressive cells
# tear any free blob into wall-coating tendrils. Fix: an ELASTIC body with a LIQUID SKIN, held by
# a weak SUBSTRATE ANCHOR (mpm_anchor: k*(rest-pos) on every point) so the blob deforms locally
# under the cells but can NEVER spread/drift to the walls -- an anchored tissue (embryo on a
# substrate). Cells are gentle (small push) so they sculpt rather than shred. Bounded for any
# duration. MPM clock master (dt=0.002, substep 2e-4).
general: {name: agent_mpm_disc_stable, seed: 0, n_frames: 1500, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 2000
    spawn: disc
    spawn_radius: 0.24
    types:
      a: {fraction: 0.5, move_speed: 0.4}
      b: {fraction: 0.5, move_speed: 0.4}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 80
        layers:
          - {frac: 0.85, youngs: 80, material: elastic}    # deformable tissue interior
          - {frac: 1.0,  youngs: 30, material: liquid}      # surface-tension skin -> colour field
  mpm_particle: {parent: cell, per_parent: 12000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.03}
  - {op: polar_align, at: agent, gamma: 60.0, noise: 3.0}
  - {op: repel, at: agent, strength: 2.0, r0: 0.015}
  - {op: glide, at: agent}
  # weak substrate anchor: bounds the blob to its rest disc (deforms locally, no drift/spread)
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 12.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.6, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 1.5e-5, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 200.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.7, confine: 160.0}
schedule:
  - radius_graph
  - polar_align
  - repel
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.008
