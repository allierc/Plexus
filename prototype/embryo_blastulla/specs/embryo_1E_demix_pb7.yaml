# embryo_1E_demix_pb7 -- 1E batch 2 EXPLOIT: active-demix b-push ladder rung HIGH. a-pull 0.6 (b24 optimum)
# + b self-push 0.7. Tests the ESCAPE ceiling of the outward b-push: if seg keeps rising here, push is not
# yet saturated; if escape spikes (rmax>1) with seg flat/down, 0.7 is past the sweet spot. escape = the gate.
general: {name: embryo_1E_demix_pb7, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 132
    buffer: 200
    spawn: sunflower
    spawn_radius: 0.30
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12, p: [0.6, 1.0, 0.0, 1.0]}   # COHESIVE core (pull 0.6)
      b: {fraction: 0.5, move_speed: 0.12, p: [0.0, 1.0, 0.7, 1.0]}   # SELF-DISPERSING shell (push 0.7)
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}
          - {frac: 1.0,  youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: cell_divide, at: agent, rate: 0.0, max_occ: 0.88, offset: 0.004}
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 150.0, r0: 0.02}
  - {op: attraction_repulsion, at: agent, sigma: 0.03}
  - {op: glide, at: agent}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 20.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 8.0e-6, k: 4.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 0.03, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - cell_divide
  - radius_graph
  - repel
  - attraction_repulsion
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
