# spiral_galaxy -- a ROTATING self-gravitating disk (+ central black hole) rebuilt on the
# SAME Newtonian gravity operator as the Mocz cluster. The spiral is not imposed: it emerges
# from ANGULAR MOMENTUM (disk_ic seeds near-circular orbits from the enclosed mass) + self-
# gravity (swing-amplified density waves). disk_ic fires once (before_frame: 1).
general: {name: spiral_galaxy, seed: 2, n_frames: 2600, dt: 0.004, boundary: free, world: [6.0, 6.0]}
sets:
  star:
    n: 1500
    types: {s: {fraction: 1.0, mass: 0.0012}}       # disk mass ~1.8
fields: {}
operators:
  - {op: disk_ic, at: star, G: 1.0, softening: 0.05, disc_radius: 1.6, spin: 0.95, m_bh: 1.0, vel_jitter: 0.02, before_frame: 1}
  - {op: nbody_gravity, at: star, G: 1.0, softening: 0.05}
schedule: [disk_ic, nbody_gravity]
plotting: {background: black, point_size: 2, colors: {s: [0.85, 0.9, 1.0]}}
