# embryo_sep -- Stage-1A spec: embryo_nodiv + ACTIVE-PRESSURE `separation` (the b05 falsifier-fix).
# Rationale (Batch 6): b03 showed the residual 1A defect is a FROZEN early doublet (nn_min ~0.005 < r0
# 0.02) that hard `repel` lifts only partway (8->24 @ confine 0.2: nn_min 0.0025->0.0059, still < r0).
# The b05 hypothesis pre-registered a falsifier: if hard exclusion saturates below r0, switch to an
# ACTIVE-pressure operator. `separation` is a boids lateral push -a3*w*mean_j d/|d|^2 -- self-limiting
# (strong on a 0.005 doublet, ~10x weaker on the 0.05 lattice), so it should un-stick the pair without
# disturbing even coverage. This spec = embryo_nodiv with `separation` added; run at confine 0.1 (the
# escape-safe, collapse-free point) with BASE repel 8/r0 0.02 so its effect is isolated vs the R4
# control c0p1_ctrl_s8 (same config, no separation). Calibration (first probe): scale 1e-7 x weight 60
# => push ~1.2e-3 at |d|=0.005, ~1.3x the ambient confine speed (b03 ~9e-4); ~7x weaker at the lattice.
general: {name: embryo_sep, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44
    buffer: 3000
    spawn: sunflower
    spawn_radius: 0.22
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12, separation: 60.0}
      b: {fraction: 0.5, move_speed: 0.12, separation: 60.0}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}
          - {frac: 1.0,  youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 8.0, r0: 0.02}
  - {op: separation, at: agent, scale: 1.0e-7}          # active personal-space push (un-stick doublet)
  - {op: glide, at: agent}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 40.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 3.0, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - separation
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
