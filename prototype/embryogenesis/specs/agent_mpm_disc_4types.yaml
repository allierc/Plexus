# agent_mpm_disc_4types -- ACTIVE MATTER x MPM, 2D. THE SHOWCASE.
# 4000 cells of FOUR types with VERY DIFFERENT behaviour, swimming inside a large blue WATER
# disc (all-liquid MPM, surface tension), dragged/confined by the fluid and deforming it back;
# the disc rotates slowly. Per-type behaviour is built by instancing the same operators with
# `agent[type=X]` selectors (each masked to one type):
#   a (red, flocker)      : strong polar alignment -> a coherent migrating swarm
#   b (gold, disperser)   : strong short-range repulsion + fast -> a space-filling gas
#   c (green, aggregator) : deposits a chemical + chemotaxes up its own gradient -> clusters
#   d (white, random)     : weak align + high angular noise -> jittery, passively carried
# MPM clock is master (dt=0.002, substep 2e-4). Agent gains are in this time unit.
general: {name: agent_mpm_disc_4types, seed: 0, n_frames: 1500, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 4000
    spawn: disc
    spawn_radius: 0.26
    types:
      a: {fraction: 0.25, move_speed: 0.5}     # flocker
      b: {fraction: 0.25, move_speed: 0.8}     # disperser (fast)
      c: {fraction: 0.25, move_speed: 0.4}     # aggregator
      d: {fraction: 0.25, move_speed: 0.4}     # random
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      water:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 1.0, youngs: 200, material: liquid}
  mpm_particle: {parent: cell, per_parent: 16000, radius: 0.34, density: 1.0}
fields:
  chemical: {frame: grid, res: 128, couples_to: agent, components: 4}   # one channel per type (deposit writes node_type's channel)
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  # neighbour graph shared by the alignment/repulsion laws
  - {op: radius_graph, at: agent, radius: 0.03}
  # --- per-type behaviour (masked instances; the schedule token runs every instance) ---
  - {op: polar_align, at: 'agent[type=a]', gamma: 150.0, noise: 1.5}    # a: strong flock
  - {op: polar_align, at: 'agent[type=d]', gamma: 8.0,   noise: 12.0}   # d: noisy random walk
  - {op: repel, at: 'agent[type=b]', strength: 10.0, r0: 0.032}         # b: strong disperse
  - {op: repel, at: agent, strength: 1.5, r0: 0.012}                    # mild global hard core (all)
  - {op: deposit, at: 'agent[type=c]', to: chemical, amount: 0.03}      # c: lay signal
  - {op: diffuse, at: chemical, rate: 0.16}
  - {op: decay,   at: chemical, rate: 0.03}
  - {op: chemotax, at: 'agent[type=c]', from: chemical, omega: 140.0, channel: 2}   # c: climb own (type-c) gradient
  - {op: glide, at: agent}                                              # all move along heading
  # --- slow disc rotation ---
  - {op: mpm_spin, at: mpm_particle, omega: 0.8, spin_k: 20.0}
  # --- MPM solver (+ agents deform the grid, between p2g and grid_update) ---
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.4, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 5.0e-6, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 300.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  # --- fluid drags + confines all cells ---
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.8, confine: 140.0}
schedule:
  - radius_graph
  - polar_align
  - repel
  - deposit
  - diffuse
  - decay
  - chemotax
  - glide
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2], c: [0.4, 1.0, 0.5], d: [1.0, 1.0, 1.0]}
  background: black
  marker: dot
  point_size: 0.006
