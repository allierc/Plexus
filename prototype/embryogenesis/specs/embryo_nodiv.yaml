# embryo_nodiv -- Batch-4 Stage-1A spec: base operator set with DIVISION REMOVED.
# Rationale (Batch 4): at 12000 frames the base `cell_divide` (rate 0.6) floods the core to the hard
# buffer cap of n=2850 (~65x the initial 44), which PHYSICALLY over-packs the disc -- area 0.36 holds
# only ~1040 cells at r0=0.02, so 2850 is ~2.7x past capacity. That makes `collapsed` a jamming
# artifact and renders the feedback/confinement bracket uninformative (all 8 b01 slots collapsed ~0.99
# identically). To ISOLATE the collapse mechanism for Stage 1A (a stable, fixed-population blastula
# holding even coverage), division is disabled HERE. Division returns at Stage 1C, where the membrane
# must deform/grow to accommodate the added cells (no fixed multiplier -- bounded only by what fits).
general: {name: embryo_nodiv, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44                                    # fixed population (no proliferation this stage)
    buffer: 3000
    spawn: sunflower                         # EVEN initial coverage (Vogel golden-angle lattice)
    spawn_radius: 0.22
    vmax: 0.6                                # safety clamp only; balance must rarely hit it
    types:
      a: {fraction: 0.5, move_speed: 0.12}
      b: {fraction: 0.5, move_speed: 0.12}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}     # water core (light blue), ~93% of radius
          - {frac: 1.0,  youngs: 200, material: elastic}     # THIN elastic membrane (deep blue), outer ~7%
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 8.0, r0: 0.02}          # HARD min cell-cell distance (no collapse)
  - {op: glide, at: agent}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 40.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}   # cells deform membrane
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 3.0, field: colour}   # drag + confine to CORE
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}    # polarity follows the flow
schedule:
  - radius_graph
  - repel
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
