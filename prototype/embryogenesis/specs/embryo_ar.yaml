# embryo_ar -- Batch-5 Stage-1A spec: nodiv base + LONGER-RANGE DISPERSAL via `attraction_repulsion`
# (PUSH-ONLY), the mechanism that can CROSS nn_min >= r0 where hard `repel` only asymptotes to it.
# Rationale (Batch 5): b04 proved `repel` is a linear spring `strength*(r0-dist)` that vanishes AT r0, so
# brute strength approaches r0 asymptotically (s96 -> nn_min 0.0163 = 0.82x r0) but never cleanly crosses
# 0.02. `attraction_repulsion` is a first-derivative (velocity) law -- COMPATIBLE with repel/glide in the
# same set (unlike `separation`, which is second-derivative and crashed b04 s0/s3/s6) -- with force
#   f(r) = p1*exp(-r^(2p2)/2s2) - p3*exp(-r^(2p4)/2s2),  dpos = mean_j f * (pos_j - pos_i).
# PUSH-ONLY: p1=0 (no pull), p3=push, so cells always repel out to ~2-3 sigma, establishing a PREFERRED
# spacing > r0. sigma=0.02 -> peak push velocity at r~sigma=0.02 (the target min spacing); the push decays
# by r~0.045, so the central clump disperses to ~0.03-0.04 spacing (nn_min should exceed r0) while cells
# stay central (occupied radius ~0.12 << 0.31 boundary -> escape stays 0). `repel` is KEPT as the hard
# floor. Push strength here p3=0.3 (gentle); embryo_ar_hi.yaml uses 0.6. Run @ confine 0.1 (escape-safe).
general: {name: embryo_ar, seed: 0, n_frames: 12000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44
    buffer: 3000
    spawn: sunflower
    spawn_radius: 0.22
    vmax: 0.6
    types:
      a: {fraction: 0.5, move_speed: 0.12, p: [0.0, 1.0, 0.3, 1.0]}   # [pull, pull_exp, PUSH, push_exp]
      b: {fraction: 0.5, move_speed: 0.12, p: [0.0, 1.0, 0.3, 1.0]}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}
          - {frac: 1.0,  youngs: 200, material: elastic}
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 8.0, r0: 0.02}                 # HARD floor (kept)
  - {op: attraction_repulsion, at: agent, sigma: 0.02}              # LONGER-RANGE push-only disperser
  - {op: glide, at: agent}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 40.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 3.0, field: colour}
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}
schedule:
  - radius_graph
  - repel
  - attraction_repulsion
  - glide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
