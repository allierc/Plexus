# embryo_base -- the AGENTIC-LOOP base spec (Phase 1). The loop mutates its operator params.
# A BLASTULA: a THIN elastic membrane shell (deep blue, outer ~7%) enclosing a WATER core (light
# blue), anchored (bounded, contains the fluid). TWO cell types start on an even sunflower lattice
# INSIDE the core and are CONFINED TO THE CORE (confinement on the liquid colour g.c, so cells
# never enter the membrane). They divide, flow, and deform the membrane from within.
#
# Phase-1 targets (see instruction_embryo.md): inner flow deforms the outer membrane; cells NEVER
# collapse (min cell-cell distance held by `repel`); motion bounded by PARAMETER BALANCE (not the
# vmax clamp); division progressively deforms the blastula; continuous flow at high density;
# collective migration + left/right partitioning by type.
general: {name: embryo_base, seed: 0, n_frames: 3000, dt: 0.002, boundary: wall}
sets:
  agent:
    n: 44                                    # start sparse (~/8); proliferate to fill the core
    buffer: 3000
    spawn: sunflower                         # EVEN initial coverage (Vogel golden-angle lattice)
    spawn_radius: 0.22
    vmax: 0.6                                # safety clamp only; the loop must find a balance that rarely hits it
    types:
      a: {fraction: 0.5, move_speed: 0.06, div_rate: 0.6}
      b: {fraction: 0.5, move_speed: 0.06, div_rate: 0.6}
  cell:
    n: 1
    start: [[0.5, 0.5]]
    types:
      body:
        fraction: 1.0
        youngs: 200
        layers:
          - {frac: 0.93, youngs: 40,  material: liquid}     # water core (light blue), ~93% of radius
          - {frac: 1.0,  youngs: 200, material: elastic}     # THIN elastic membrane (deep blue), outer ~7%
  mpm_particle: {parent: cell, per_parent: 14000, radius: 0.34, density: 1.0}
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 64}
operators:
  - {op: radius_graph, at: agent, radius: 0.05}
  - {op: repel, at: agent, strength: 8.0, r0: 0.02}          # HARD min cell-cell distance (no collapse)
  - {op: glide, at: agent}
  - {op: cell_divide, at: agent, rate: 0.6, max_occ: 0.9, offset: 0.004}
  - {op: mpm_anchor, at: mpm_particle, mode: substrate, k: 40.0}
  - {op: mpm_spin, at: mpm_particle, omega: 0.3, spin_k: 20.0}
  - {op: mpm_strain, at: mpm_particle}
  - {op: p2g, at: mpm_particle, to: mpm_grid, drag: 0.3, a_max: 200}
  - {op: agent_to_mpm, at: agent, to: mpm_grid, agent_mass: 2.0e-6, k: 1.0}   # cells deform membrane
  - {op: mpm_grid_update, at: mpm_grid, surface_tension: 0.0, wall_damp: 0.7}
  - {op: g2p, at: mpm_particle, from: mpm_grid, wall_damp: 0.7, wall_contact: 0.04, vmax: 1.0e9}
  - {op: mpm_to_agent, at: agent, from: mpm_grid, k: 0.3, confine: 3.0, field: colour}   # drag + confine to CORE
  - {op: flow_align, at: agent, from: mpm_grid, gain: 40.0}    # polarity follows the flow (collective migration)
schedule:
  - radius_graph
  - repel
  - glide
  - cell_divide
  - mpm_anchor
  - mpm_spin
  - {substep_dt: 0.0002, steps: [mpm_strain, p2g, agent_to_mpm, mpm_grid_update, g2p]}
  - mpm_to_agent
  - flow_align
plotting:
  colors: {a: [1.0, 0.28, 0.28], b: [1.0, 0.85, 0.2]}
  background: black
  marker: dot
  point_size: 0.01
