general:
  name: toy_small
  seed: 42
  dim: 3
  units:
    length_um: 10.0
    time_s: 0.02

data:
  source: simulate
  state: voltage
  positions: positions
  stimulus: stim
  types: type_id
  graph:
    kind: knn
    k: 16
  split:
    train: [0, 3000]
    val: [3000, 3500]
    test: [3500, 4000]

model:
  encoder_decoder: off
  message: simple
  n_passes: 1
  embedding: free
  embedding_dim: 2
  latent_dim: 64
  hidden_dim: 64
  n_hidden_layers: 1
  observation: identity

training:
  n_iter: 20000
  batch_frames: 8
  lr: 1.0e-3
  lr_embedding: 1.0e-2
  lr_scheduler: linear_warmup_cosine
  warmup_iters: 1000
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 32.0
  target: increment
  target_norm: inverse_increment_variance
  rollout:
    schedule: [1]
    tail:
      fraction: 0.0
      lr_scale: 1.0e-3
  checkpoint_every: 1000
  seed: 42
  device: cuda
