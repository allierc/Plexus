general:
  name: transport_coarse
  seed: 42
  n_frames: 1200
  dt: 1.0
  dim: 2
  world: 1.0
  boundary: periodic
  field_record_cap: 240
  units:
    length_um: 1024.0
    time_s: 1.0

sets:
  probe:
    n: 1
    spawn: random

fields:
  u:
    frame: grid
    res: 256
    components: 1

operators:
  - op: advect_field
    at: u
    model: transport
    amplitude: [0.894427, 0.447214]
    wavelength: [1.0, 0.333333]
    speed: 0.000833333
    axis: 0

schedule:
  - advect_field

data:
  source: simulate
  state: voltage
  positions: positions
  stimulus: u
  graph:
    kind: none
    k: 0
  toy:
    set: probe
    edge_set: none
    kind: coarse_only
    amplitude: 1.0
    length_scale: 0.5
    inhibitory_fraction: 0.0
  split:
    train: [0, 900]
    val: [900, 1050]
    test: [1050, 1200]

model:
  encoder_decoder: off
  message: simple
  n_passes: 1
  embedding: none
  embedding_dim: 2
  latent_dim: 64
  hidden_dim: 64
  n_hidden_layers: 1
  observation: identity

training:
  n_iter: 1
  batch_frames: 1
  lr: 1.0e-3
  lr_scheduler: none
  warmup_iters: 0
  grad_clip: 32.0
  target: increment
  target_norm: none
  checkpoint_every: 1
  seed: 42
  device: cpu
