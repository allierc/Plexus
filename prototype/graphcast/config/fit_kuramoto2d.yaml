# HOW THIS SPEC WAS MADE: start from toy2d_fine.yaml and change four things.
#
#   1. operators:  kuramoto_field  ->  kuramoto_known_ode   the learnable twin, written in the
#                  K: 0.9, omega_mean/spread, discs        observables (v, w) = (sin phi, cos phi)
#                  ->  K_init: 0.0, learn: [K, omega]      because sin alone is many-to-one
#   2. schedule:   the twin's name replaces the original's
#   3. fit:        added, and `rollout` is NOT optional here -- see below
#   4. the mask is NOT carried over: it is read off the data, so it cannot drift from it
#
# fit_kuramoto2d -- recover K and omega_i of the fine rule from the recorded field.
# The FITTING TWIN of toy2d_fine.yaml. `kuramoto_known_ode` is `kuramoto_field` written in the
# observables (v, w) = (sin phi, cos phi) with its two constants made learnable:
#
#     r_i = omega_i + K SUM_j (v_j w_i - w_j v_i),   dv_i/dt = w_i r_i m_i,  dw_i/dt = -v_i r_i m_i
#
# K is ONE coupling shared by every pixel; omega_i is ONE PER PIXEL and is the heterogeneity. They
# get separate learning rates for the same reason lr_W and lr_embedding differ in production: K
# sees 10^6 gradient contributions per step and omega_i sees one.
#
# ROLLOUT IS NOT OPTIONAL HERE. omega is free per pixel, so at any single instant it can absorb
# K*coupling entirely; only the coupling's variation IN TIME distinguishes them. Measured, a
# one-step loss leaves K at 4% of its true value.
general: {name: fit_kuramoto2d, seed: 42, n_frames: 1200, dt: 1.0, dim: 2, world: 1.0, boundary: periodic, units: {length_um: 1024.0, time_s: 1.0}}
sets: {}
fields:
  v: {frame: grid, res: 1024, components: 2}   # (sin phi, cos phi)
operators:
  - {op: kuramoto_known_ode, at: v, dt: 0.25, substeps: 12, K_init: 0.0, learn: [K, omega]}
schedule: [kuramoto_known_ode]
fit:
  data: {run: toy2d_fine_noed_simple_p1_none, field: v,
         split: {train: [0, 870], val: [870, 900], test: [900, 1200]}}
  batch_frames: 1
  rollout: {horizon: 2, recurrent: true, weighting: uniform}
  trainer: {n_iter: 1200, betas: [0.9, 0.95], grad_clip: 32.0, scheduler: cosine_to_zero,
            groups: [{params: [kuramoto_known_ode.K], lr: 0.02},
                     {params: [kuramoto_known_ode.omega], lr: 0.01}]}
  operators:
    - {op: mse_loss, norm: none}
  schedule: [mse_loss, step]
