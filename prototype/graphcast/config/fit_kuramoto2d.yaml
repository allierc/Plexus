general:
  name: fit_kuramoto2d
  seed: 42
  n_frames: 1200
  dt: 1.0
  dim: 2
  world: 1.0
  boundary: periodic
  units: {length_um: 1024.0, time_s: 1.0}
data:
  source: zarr
  path: log/toy2d_fine_noed_simple_p1_none/field.zarr
  state: voltage
  positions: positions
  stimulus: v
  graph: {kind: none, k: 0}
  split:
    train: [0, 900]
    val: [900, 1050]
    test: [1050, 1200]
model: {encoder_decoder: false, message: simple, n_passes: 1, embedding: none, embedding_dim: 2,
  latent_dim: 64, hidden_dim: 64, n_hidden_layers: 1, observation: identity}
training: {n_iter: 1, batch_frames: 1, lr: 0.001, lr_scheduler: none, warmup_iters: 0,
  grad_clip: 32.0, target: increment, target_norm: none, checkpoint_every: 1, seed: 42,
  device: cpu}
trainer:
  field: v
  batch_frames: 4
  model:
    fields:
      v: {frame: grid, res: 1024, components: 2}
    operators:
    - op: kuramoto_known_ode
      at: v
      model: phase_fit
      learn: [K, omega]
      K_init: 0.0
      dt: 0.25
      substeps: 12
    schedule:
    - {op: kuramoto_known_ode, every: 1}
  operators:
  - {op: plexus_model, role: predict, field: v, steps: 1, target: increment}
  - {op: mse_loss, role: loss, norm: none}
  - op: adamw
    role: step
    n_iter: 1500
    groups:
    - params: [kuramoto_known_ode.K]
      lr: 0.002
    - params: [kuramoto_known_ode.omega]
      lr: 0.01
    betas: [0.9, 0.95]
    grad_clip: 32.0
    scheduler: cosine_to_zero
  schedule: [predict, loss, step]
