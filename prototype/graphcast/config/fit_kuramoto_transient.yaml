# fit_kuramoto_transient -- THE SAME MODEL AS fit_kuramoto2d, FITTED ON DIFFERENT FRAMES.
# Two changes only, and neither is a hyperparameter:
#
#     split.train   [0, 870] -> [0, 60]     the TRANSIENT: records 0..20 of 401
#     rollout       horizon 2 -> 8
#
# WHY, and it is a statement about the physics rather than about the optimiser. A coupling is
# identifiable only WHILE IT IS STILL DOING SOMETHING. Early in the run K is actively synchronising
# oscillators from random phases; once domains lock, neighbours are in phase, the coupling term
# SUM_j (v_j w_i - w_j v_i) is ~0 inside a domain, and any K > 0 only adds error at the walls. So a
# loss over equilibrated frames is asking the data about a parameter that has stopped mattering.
#
# MEASURED, with omega frozen at the TRUTH so only K is in question. Where the loss is minimised:
#
#     starts used                 minimum
#     early 0..9                  K = 0.9   <- the truth
#     spread 0..216 (step 24)     K = 0.3
#     late 130..238               K = 0.1
#
# and on the transient, as the horizon grows the minimum moves onto the truth AND sharpens
# (loss(K=0.1)/loss(K=0.9) rises from 1.6x at horizon 1 to 2.2x at 16):
#
#     horizon      1     2     4     8    16
#     min at K   0.7   0.7   0.7   0.9   0.9
#
# NEITHER LEARNING RATE NOR BATCH SIZE CAN SUBSTITUTE. On all frames every combination of
# lr in {0.005, 0.02, 0.05} and batch in {1, 4, 8} lands K between 0.018 and 0.035 -- a 2x spread
# around a value 26x too small, because the objective's own minimum is there. On the transient the
# same two knobs matter a great deal, taking K from 0.27 to 0.69. A knob only helps once the signal
# exists.
#
# FITTED, omega frozen at the truth, lr 0.02 batch 2: K = 0.723 at horizon 2, 0.752 at 4,
# 0.888 at 8 (98.6% of the true 0.90), 0.879 at 16. Horizon 8 is where it lands and 16 buys
# nothing for twice the tape.
#
# WHAT THIS SPEC STILL HAS TO SOLVE, stated because the ablations above did not: omega is learned
# HERE, not given, and omega is best determined by exactly the late frames this split excludes. The
# transient makes K identifiable and makes omega harder. A frame WEIGHTING rather than a hard cut is
# the obvious next move, and this spec is the control it would be measured against.
general: {name: fit_kuramoto_transient, seed: 42, n_frames: 1200, dt: 1.0, dim: 2, world: 1.0, boundary: periodic, units: {length_um: 1024.0, time_s: 1.0}}
sets: {}
fields:
  v: {frame: grid, res: 1024, components: 2}
operators:
  - {op: kuramoto_known_ode, at: v, dt: 0.25, substeps: 12, K_init: 0.0, learn: [K, omega]}
schedule: [kuramoto_known_ode]
fit:
  data: {run: toy2d_fine_noed_simple_p1_none, field: v,
         split: {train: [0, 60], val: [60, 75], test: [900, 1200]}}
  batch_frames: 1
  rollout: {horizon: 8, recurrent: true, weighting: uniform}
  trainer: {n_iter: 400, betas: [0.9, 0.95], grad_clip: 32.0, scheduler: cosine_to_zero,
            groups: [{params: [kuramoto_known_ode.K], lr: 0.02},
                     {params: [kuramoto_known_ode.omega], lr: 0.01}]}
  operators:
    - {op: mse_loss, norm: none}
  schedule: [mse_loss, step]
