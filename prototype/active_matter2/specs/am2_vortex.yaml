# am2_vortex -- COMMUNICATING ACTIVE MATTER: vortices & spiral chemical waves.
# Ziepke et al., Nat. Commun. 13:6727 (2022), Fig. 1e,h,j,m.
#
# Strong chemotaxis (omega) + strong excitable emission (beta) with a slow refractory
# state (small eps) drive the positive feedback that concentrates agents into dense
# aggregates: each traps a self-sustained SPIRAL chemical wave, and the agents' inward
# polarization (chemotaxis toward the core) stabilizes the vortex. Denser than streams.
general: {name: am2_vortex, seed: 1, n_frames: 1200, dt: 1.0, boundary: periodic}
sets:
  cell:
    n: 12000
    spawn: random
    types:
      a: {fraction: 1.0, move_speed: 0.005}
fields:
  chemical: {frame: grid, res: 220, couples_to: cell, components: 1}
operators:
- {op: radius_graph, at: cell, radius: 0.028}
- {op: relay,  at: cell, to: chemical, beta: 0.22, c_th: -0.001, sigma: 1.3}
- {op: adapt,  at: cell, from: chemical, eps: 0.04}          # slow refractory -> excitable spirals
- {op: diffuse, at: chemical, rate: 0.18}
- {op: decay,   at: chemical, rate: 0.018}
- {op: polar_align, at: cell, gamma: 0.18, noise: 0.035}
- {op: chemotax, at: cell, from: chemical, omega: 0.55}      # strong inward chemotaxis
- {op: repel,  at: cell, strength: 0.02, r0: 0.011}          # keeps the vortex from collapsing
- {op: glide,  at: cell}
schedule: [radius_graph, relay, adapt, diffuse, decay, polar_align, chemotax, repel, glide]
plotting:
  colors: {a: [1.0, 0.55, 0.2]}
  background: black
  marker: triangle
  triangle_size: 0.009
  gamma: 0.65
  overlay: true
