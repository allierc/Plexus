general:
  name: vertex_mpm
  seed: 0
  n_frames: 400
  dt: 0.002
  boundary: wall
sets:
  agent:
    n: 500
    spawn: disc
    spawn_radius: 0.22
    types:
      A:
        fraction: 0.5
        move_speed: 0.12
      B:
        fraction: 0.5
        move_speed: 0.12
  cell:
    n: 1
    start:
    - - 0.5
      - 0.5
    types:
      body:
        fraction: 1.0
        youngs: 120
        layers:
        - frac: 0.88
          youngs: 120
          material: elastic
        - frac: 1.0
          youngs: 40
          material: liquid
  mpm_particle:
    parent: cell
    per_parent: 12000
    radius: 0.34
    density: 1.0
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 64
operators:
- op: radius_graph
  at: agent
  radius: 0.035
- op: heading_align
  at: agent
  gain: 4.0
  noise: 0.5
- op: glide
  at: agent
- op: mpm_spin
  at: mpm_particle
  omega: 0.4
  spin_k: 20.0
- op: mpm_strain
  at: mpm_particle
- op: p2g
  at: mpm_particle
  to: mpm_grid
  drag: 0.3
  a_max: 200
- op: agent_to_mpm
  at: agent
  to: mpm_grid
  agent_mass: 4.0e-05
  k: 1.0
- op: mpm_grid_update
  at: mpm_grid
  surface_tension: 120.0
  wall_damp: 0.7
- op: g2p
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.7
  wall_contact: 0.04
  vmax: 1000000000.0
- op: mpm_to_agent
  at: agent
  from: mpm_grid
  k: 1.0
  confine: 260.0
schedule:
- radius_graph
- heading_align
- glide
- mpm_spin
- substep_dt: 0.0002
  steps:
  - mpm_strain
  - p2g
  - agent_to_mpm
  - mpm_grid_update
  - g2p
- mpm_to_agent
