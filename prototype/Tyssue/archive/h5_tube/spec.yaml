general:   # run-level settings
  name: tyssue_fig5_h5_tube   # run name (-> archive/<name>/)
  seed: 0   # RNG seed
  n_frames: 300   # number of simulation frames
  dt: 1.0   # time step (a label: the bounded-Euler relaxation is per-frame)
  record_cap: 302
  boundary: free   # domain boundary (free = unbounded; border vertices are pinned)
  dim: 3   # spatial dimension
  world:   # world box size
  - 80.0
  - 80.0
  - 80.0
sets:   # the biological SETS (Levels) of the model
  vertex:   # VERTEX set: mesh-vertex positions -- the mechanical DOF
    n: 6384   # buffer size (max elements)
  cell:   # CELL set: per-cell biological state (the plexus2 two-level hierarchy)
    n: 3200   # buffer size (max elements)
    state:   # per-element state blocks (name: {width, integration})
      chem:
        width: 2   # number of scalar columns in this state block
        integration: first_order
      cen:   # cell centroid (aggregate readout)
        width: 3   # number of scalar columns in this state block
      area:   # cell area (aggregate readout from vertices)
        width: 1   # number of scalar columns in this state block
fields: {}   # continuous fields
operators:   # the operators to instantiate (each realises one mechanism)
- op: seed_mesh_3d
  at: vertex   # the set this operator acts on
  n_cells: 800
  radius: 5.0
  jitter: 0.16   # initial positional disorder
  p0: 3.9   # target shape index -- the rigidity knob (< ~3.81 solid, > ~3.81 fluid)
  seed: 0   # RNG seed
  before_frame: 1   # run this operator once, before the given frame
  vseed_cv: 0.15
- op: cell_geometry_3d
  at: cell   # the set this operator acts on
- op: seed_cell_rd
  at: cell   # the set this operator acts on
  mode: cones
  n_spots: 5
  cone_deg: 12.0
- op: grow_3d
  at: vertex   # the set this operator acts on
  cell_set: cell
  rate: 0.05   # growth rate of the target area per frame
  a_sw: 0.5
  hill: 4.0
  rho: 0.0
  vth_frac: 1.5
- op: shape_energy_3d
  at: vertex   # the set this operator acts on
  p0: 3.9   # target shape index -- the rigidity knob (< ~3.81 solid, > ~3.81 fluid)
  K_A: 1.0   # area-elasticity stiffness
  K_P: 1.0   # perimeter-elasticity stiffness
  Gamma: 0.05
  Lambda: 0.2
  K_V: 4.0
  K_R: 0.02
  mu: 1.0   # mobility (overdamped)
  dt: 1.0   # time step (a label: the bounded-Euler relaxation is per-frame)
  relax_iters: 30   # inner bounded-Euler relaxation steps per frame
  eta: 0.08   # relaxation step size
  cap_frac: 0.12   # max per-step move as a fraction of mean edge (the stability cap)
- op: reconnect_t1_3d
  at: vertex   # the set this operator acts on
  l_th_frac: 0.28
  every: 1   # run this operator every N frames
  max_flips: 100
- op: divide_3d
  at: vertex   # the set this operator acts on
  factor: 2.0
  reset_noise: 0.12
  cycle_cv: 0.15
  p0: 3.9   # target shape index -- the rigidity knob (< ~3.81 solid, > ~3.81 fluid)
  every: 2   # run this operator every N frames
  max_div: 12
  max_div_frac: 0.03
  cell_set: cell
  min_cycle: 0
  max_cycle: 1000000000
- op: topo_snapshot_3d
  at: vertex   # the set this operator acts on
  every: 1   # run this operator every N frames
schedule:   # the order the operators run each frame
- seed_mesh_3d
- cell_geometry_3d
- seed_cell_rd
- grow_3d
- shape_energy_3d
- reconnect_t1_3d
- divide_3d
- topo_snapshot_3d
