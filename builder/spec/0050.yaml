# R2 -- the assembled anatomy, dropped.
#
# R1 placed 4,117 cells at their measured positions and drew them. This gives every one of them
# MATTER: each cell is a parent of MPM material points, so the animal is a heap of 4,117 soft
# bodies that share one background grid and therefore push on each other. Then gravity is turned
# on for the first time.
#
# WHAT IT IS FOR. A cloud of dots falls the same way whatever the dots mean; a body does not. If
# the anatomy holds its shape through the drop -- if the episphere stays a head and the parapodia
# stay parapodia -- then the placement is mechanically coherent and everything after this can be
# built on it. If it explodes, a layer is in the wrong place and the rest of the ladder would have
# been built on sand.
#
# WHY THE WORLD IS TALLER THAN THE REGION. `neural_seed`'s affine fills the unit box by
# construction, so an animal seeded into a taller world still spans z = 0 to 0.95 and is already
# resting on the floor. `scale` shrinks the cube to 0.55 of the world and `offset` lifts it, so
# there is 0.35 of a world unit -- about 69 um, a third of the animal's own length -- to fall
# through before it meets the floor.
#
# The per-class materials are a first guess and are stated as such: yolk soft and dense, chaetae
# stiff (they are chitin rods), muscle and epidermis in between. Nothing has been fitted.
general:
  name: plat_r2_fall
  seed: 0
  n_frames: 240
  dt: 2.0e-05
  dim: 3
  world: [1.0, 1.0, 1.6]
  boundary: wall
  save_data: true
  record_cap: 241
  # One world unit is the region's own cube, 195.9 um, because `neural_seed` checks this number
  # against the manifest rather than assuming it. The force unit follows from length and time.
  units: {length_um: 195.9, time_s: 1.0, force_nN: 1000000000.0}
sets:
  brain: {n: 1}
  neuron:
    parent: brain
    per_parent: 4117
    type_layout: ordered
    # THE 18 CELL CLASSES IN THE DATA'S OWN ROW ORDER, each now carrying a material as well as a
    # colour. `type_layout: ordered` hands rows to types in the order declared, and the classes
    # occupy one unbroken run of rows each -- checked in tools/platynereis_specs.py, because if
    # that ever stopped being true every cell would be silently mislabelled.
    types:
      Interneuron:        {count: 317,  shape: ball, material: elastic, youngs: 1500.0, density: 1050.0}
      Motoneuron:         {count: 124,  shape: ball, material: elastic, youngs: 1500.0, density: 1050.0}
      Sensory neuron:     {count: 503,  shape: ball, material: elastic, youngs: 1500.0, density: 1050.0}
      chaetal complex:    {count: 657,  shape: ball, material: elastic, youngs: 8000.0, density: 1200.0}
      ciliary band:       {count: 74,   shape: ball, material: elastic, youngs: 1200.0, density: 1050.0}
      coelothelium:       {count: 101,  shape: ball, material: elastic, youngs: 1200.0, density: 1040.0}
      epidermis:          {count: 1120, shape: ball, material: elastic, youngs: 2500.0, density: 1060.0}
      excretory system:   {count: 20,   shape: ball, material: elastic, youngs: 1200.0, density: 1040.0}
      gland:              {count: 10,   shape: ball, material: elastic, youngs: 1000.0, density: 1040.0}
      gland cell:         {count: 62,   shape: ball, material: elastic, youngs: 1000.0, density: 1040.0}
      glia cell:          {count: 72,   shape: ball, material: elastic, youngs: 1200.0, density: 1040.0}
      macrophage-like:    {count: 13,   shape: ball, material: elastic, youngs: 900.0,  density: 1030.0}
      mesoderm:           {count: 24,   shape: ball, material: elastic, youngs: 1500.0, density: 1050.0}
      microvillar:        {count: 13,   shape: ball, material: elastic, youngs: 1200.0, density: 1040.0}
      multiciliated cell: {count: 6,    shape: ball, material: elastic, youngs: 1200.0, density: 1050.0}
      muscle:             {count: 840,  shape: ball, material: elastic, youngs: 3000.0, density: 1060.0}
      pigment cell:       {count: 156,  shape: ball, material: elastic, youngs: 1800.0, density: 1060.0}
      yolk:               {count: 5,    shape: ball, material: elastic, youngs: 400.0,  density: 1150.0}
  # EVERY CELL IS A LITTLE BALL OF MATTER. 24 material points each, 98,808 in all. The mass fixes
  # the volume (`V = per_parent * particle_mass / density`), and it is chosen so a cell of density
  # 1050 comes out a ball of radius 1.9 um -- the scale the compendium's own soma spheres are
  # drawn at. The mass is in WORLD units, not kilogrammes: `p_vol = particle_mass / density` is
  # read as a world-cube volume, so 1.26e-15 (the value in SI) made every cell 5,000x too small.
  # The classes differ in density, so a denser cell is a slightly smaller one of the same mass,
  # which is what sharing one particle mass means.
  mpm_particle:
    parent: neuron
    per_parent: 24
    density: 1050.0
    radius: 0.0097
    particle_mass: 1.67e-04
fields:
  mpm_grid: {frame: mpm_grid, n_grid: 96}
seed:
- {op: neural_seed, at: neuron, region: platynereis_larva_4117, v0_mean: 0.0, v0_sd: 0.0,
   scale: 0.55, offset: [0.22, 0.22, 0.62]}
operators:
# GRAVITY ALONG -z, NAMED AXIS-BY-AXIS. A bare `g:` pulls along -y, which is right for a scene
# whose up axis is y and wrong here: this animal's up axis is z (its own long axis runs head to
# tail along z), so a bare `g` would drag it sideways through its own body.
- {op: gravity, at: neuron, gx: 0.0, gy: 0.0, gz: -9.81}
- {op: mpm_strain, at: mpm_particle, implementation: warp}
- {op: mpm_scatter, at: mpm_particle, to: mpm_grid, drag: 0.0, a_max: 200.0,
   implementation: warp, polar: higham}
- {op: mpm_grid_update, at: mpm_grid, wall_damp: 0.6, wall_friction: 0.4}
- {op: mpm_gather, at: mpm_particle, from: mpm_grid, wall_damp: 1.0, vmax: 1000000000.0,
   implementation: warp}
schedule:
- gravity
- substep_dt: 2.0e-06
  steps: [mpm_strain, mpm_scatter, mpm_grid_update, mpm_gather]
plotting:
  renderer: vtk_points
  background: black
  box_frame: true
  up_axis: 2
  dot_shading: true
  max_frames: 240
  stills: 4
  keep_stills: true
  # The particles are coloured by the CELL they belong to, so the classes stay legible through the
  # drop: this is the same palette R1 drew, applied to the parent body rather than to the point.
  colors:
    Interneuron: '#2f6fb5'
    Motoneuron: '#d45fa8'
    Sensory neuron: '#e0a53a'
    chaetal complex: '#c9c9d2'
    ciliary band: '#e24a6a'
    coelothelium: '#d98a3d'
    epidermis: '#6d7f96'
    excretory system: '#5fb3d9'
    gland: '#8e6fc4'
    gland cell: '#a98ad4'
    glia cell: '#1f9e8f'
    macrophage-like: '#9c9c6e'
    mesoderm: '#b06a2c'
    microvillar: '#7fd4c4'
    multiciliated cell: '#f07a94'
    muscle: '#c94040'
    pigment cell: '#6a6a93'
    yolk: '#d8d2c4'
