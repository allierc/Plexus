# STEP 1 of the rebuild: ONE cilium, on a FIXED base, driven by a moment at that base.
# Nothing else in the scene -- no water, no cell -- so that 'does it beat' has one answer.
#
# EVERY CONSTANT HERE WAS MEASURED BY A SWEEP, not chosen. tools/rod_sweep.py, 10 s runs:
#
#   k_bend    5e5 returns NaN; the bending operator's stiffest mode is about 16k so an
#             explicit step needs dt < 0.5/sqrt(k), which is 7.1e-4 against this dt of 1e-3.
#             5e4 is the stiffest stable value.
#   drag      5.0 gave a DEAD TIP (tip/base 0.15). The sperm number Sp = L(zeta_perp*om/B)^(1/4)
#             was 4.3, so the stroke died a quarter of the way up the rod. 0.07 puts Sp at 1.49,
#             inside the 1-4 that real cilia live at, and the tip then swings 29 deg.
#   zeta      stretch 1.0 returns NaN (dt*2*sqrt(k) = 0.63 on top of dt*sqrt(k) = 0.32); 0.3 is
#             stable and holds the rod at 100% of its length. Bending needs its own 0.05 or the
#             bending modes ring for the whole run, because drag is too low to damp anything.
#   clamp     0 lets the rod WINDMILL: a clean 29 deg beat whose CENTRE drifts to +32 deg,
#             because rod_bend penalises curvature and a rigid rotation about the pin has none.
#             40 rad/s centres it at -1.7 deg with the LARGEST amplitude of any value tried
#             (31.8 deg); 160 overpowers the drive and the beat collapses to 8 deg.
general:
  name: cil_s1_onerod
  seed: 0
  n_frames: 10000
  dt: 0.001
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  boundary: free
  save_data: true
  units:
    length_um: 50.0
    time_s: 1.0
sets:
  rod_node:
    n: 24
    start:
    - - 0.5
      - 0.5
      - 0.25
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: free
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        boundary: free
seed:
- op: rod_seed
  at: rod_node
  length: 0.4
  base:
  - 0.5
  - 0.5
  - 0.3
  direction:
  - 0.0
  - 0.0
  - 1.0
  beat_axis:
  - 0.0
  - 1.0
  - 0.0
  n_rod: 1
operators:
- op: rod_stretch
  at: rod_node
  k: 100000.0
  zeta: 0.3
- op: rod_bend
  at: rod_node
  k: 50000.0
  zeta: 0.05
- op: rod_base_moment
  at: rod_node
  moment: 1.0
  omega: 6.283185
  waveform: sine
- op: rod_pin
  at: rod_node
  anchor: fixed
  omega_n: 600.0
  zeta: 1.0
  clamp: 40.0
  clamp_zeta: 1.0
- op: rod_drag
  at: rod_node
  zeta_par: 0.07
  ratio: 2.0
fields: {}
schedule:
- rod_stretch
- rod_bend
- rod_base_moment
- rod_pin
- rod_drag
plotting:
  renderer: vtk_points
  background: black
  box_frame: true
  up_axis: 2
  subject: rod_node
  dot_size: 5.0
  dot_shading: true
  max_frames: 300
  stills: 6
  keep_stills: true
  fps: 20.0
  chain:
    set: rod_node
    per: 24
    width: 7
    color: '#ffffff'
