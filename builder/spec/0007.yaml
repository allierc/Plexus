general:
  name: platynereis_a1_body
  seed: 1
  n_frames: 300
  dt: 0.002
  boundary: wall
  dim: 3
  world:
  - 0.5
  - 0.5
  - 0.5
  save_data: true
  units:
    length_um: 1000000.0
    time_s: 1.0
    force_nN: 1000000000.0
sets:
  cell:
    n: 1
    start:
    - - 0.25
      - 0.32
      - 0.25
    type_layout: ordered
    types:
      body:
        count: 1
        material: elastic
        youngs: 2000000.0
        density: 1050.0
        shape: mesh:platynereis_body
  mpm_particle:
    parent: cell
    per_parent: 60000
    density: 1050.0
    radius: 0.07
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 96
operators:
- op: gravity
  at: cell
  g: 9.81
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_viscosity
  at: mpm_particle
  eta: 0.001
- op: mpm_scatter
  at: mpm_particle
  implementation: warp
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.6
  wall_friction: 0.3
  surface_tension: 0.072
  csf_rho: 1000.0
  csf_band: 0.2
- op: mpm_gather
  at: mpm_particle
  implementation: warp
  from: mpm_grid
  wall_damp: 1.0
  vmax: 1000000000.0
schedule:
- gravity
- substep_dt: 4.444444e-05
  steps:
  - mpm_strain
  - mpm_viscosity
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  up_axis: 1
  camera_elev: 1.18
  camera_turns: 0.0
  camera_zoom: 0.0
  max_frames: 300
  stills: 3
  keep_stills: true
  splat_res: 600
  box_frame: true
  hide_sets:
  - cell
  floor: '#0b1a3a'
  floor_opacity: 0.25
  colors:
    body:
    - 0.85
    - 0.72
    - 0.45
  slow_motion: 4
  render_3d: dots
  dot_size: 2.0
  dot_shading: body
