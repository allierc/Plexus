# 152's ROD, 20 um, IN WATER, AT A REYNOLDS NUMBER WE CAN AFFORD.
#
# The physically right answer is out of reach and the arithmetic says why. Water's kinematic
# viscosity is 1e-6 m^2/s; in a box declared 50 um across, one world unit is 5e-5 m, so water is
# nu = 400 world^2/s. The spec had nu = eta/rho = 1e-6 -- water's value IN METRES, inside a box
# labelled 50 um, off by 4e8. So every run so far has been a METRE tank wearing a 50 um label,
# which is why it sat at Re = 9e5 instead of the 2.3e-3 a cilium lives at.
#
# Raising nu to 400 is therefore a CORRECTION, not a hack -- and it cannot be run. Explicit
# viscous diffusion needs dt < dx^2/(6 nu) = 1.0e-07, which is 4,915x more substeps: 428 s per
# FRAME, 95 hours for 4 seconds of simulated time. And no grid saves it, because dt scales as
# dx^2 and the cell that would allow the current substep is 1.10 world units, wider than the box.
# Physically: viscous momentum crosses the box in L^2/nu = 2.5 ms against a 1000 ms beat, so the
# fluid reaches steady state 400 times per stroke. That IS the quasi-static Stokes regime, and an
# explicit solver must resolve the very diffusion the regime treats as instantaneous.
#
# SO THIS RUN SITS AT Re = 1, the boundary rather than the destination: nu = U L / Re = 0.90 with
# U the 2.25 world/s tip speed and L the 0.4 rod. Grid 64 -> 32 because dt scales as dx^2 and
# that buys 4x, with the water resampled to keep 8 particles a cell. The moment goes to 1.6e5
# because viscous drag here is some 200x the inertial drag it replaces.
#
# WHAT IT IS FOR: to see whether the tipping collapses as Re crosses 1. If it does, steady
# streaming was the cause and the diagnosis holds. If it does not, the diagnosis is wrong and we
# should know before building anything on it.
general:
  name: cil_s4_stokes
  seed: 0
  n_frames: 800
  dt: 0.005
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  boundary: wall
  save_data: null
  record_cap: 161
  units:
    length_um: 50.0
    time_s: 1.0
sets:
  rod_node:
    n: 24
    start:
    - - 0.5
      - 0.5
      - 0.3
    entity: mpm_particle
    density: 1100.0
    radius: 0.01
    types:
      cilium:
        fraction: 1.0
        material: elastic
        youngs: 1.0
        density: 1100.0
        block:
        - 0.49
        - 0.49
        - 0.3
        - 0.51
        - 0.51
        - 0.7
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        boundary: free
  water:
    n: 1
    start:
    - - 0.5
      - 0.5
      - 0.5
    types:
      seawater:
        count: 1
        material: liquid
        bulk_modulus: 100000.0
        density: 1000.0
        eta: 900.0
        block:
        - 0.08
        - 0.08
        - 0.08
        - 0.92
        - 0.92
        - 0.92
  water_particle:
    parent: water
    per_parent: 155374
    entity: mpm_particle
    density: 1000.0
    radius: 0.5
seed:
- op: rod_seed
  at: rod_node
  length: 0.4
  base:
  - 0.5
  - 0.5
  - 0.3
  direction:
  - 0.0
  - 0.0
  - 1.0
  beat_axis:
  - 0.0
  - 1.0
  - 0.0
  n_rod: 1
operators:
- op: rod_elastic
  at: rod_node
  k_stretch: 100000.0
  k_bend: 50000.0
  zeta_stretch: 0.3
  zeta_bend: 0.05
  emit: mpm_acceleration
- op: rod_base
  at: rod_node
  moment: 160000.0
  omega: 6.283185
  waveform: sine
  omega_n: 600.0
  zeta: 1.0
  clamp: 40.0
  clamp_zeta: 1.0
  anchor: fixed
  emit: mpm_acceleration
- op: mpm_strain
  at: rod_node
  implementation: warp
- op: mpm_strain
  at: water_particle
  implementation: warp
- op: mpm_viscosity
  at: water_particle
  eta: 900.0
- op: mpm_scatter
  at: rod_node
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_scatter
  at: water_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
  wall_friction: 0.3
- op: mpm_gather
  at: rod_node
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
- op: mpm_gather
  at: water_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 32
schedule:
- substep_dt: 1.428571e-04
  steps:
  - rod_elastic
  - rod_base
  - mpm_strain
  - mpm_strain
  - mpm_viscosity
  - mpm_scatter
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  box_frame: true
  up_axis: 2
  subject: water_particle
  dot_size: 1.6
  dot_shading: true
  max_frames: 160
  stills: 6
  keep_stills: true
  fps: 20.0
  color_field: speed
  field_cmap: inferno
  color_range:
  - 0.0
  - 0.004
  cutaway:
    axis: view
    at: 0.5
  chain:
    set: rod_node
    per: 24
    width: 7
    color: '#ffffff'
descriptions:
  movie:
    description: A thin vertical line of particles is positioned in the center of a large cubic domain.
      Over time, the particles remain stationary and do not exhibit any significant movement or dispersion.
      The simulation progresses through several time steps while the central structure maintains its integrity.
      The visual representation shows a stable state where the velocity field remains near zero.
    objects: The scene contains a single vertical line composed of many small, white particles. This line
      is located in the center of a large, black cubic volume. A scale bar in the bottom right corner
      indicates a length of 10 micrometers. The cubic domain is defined by a wireframe boundary and represents
      a 50 micrometer box.
