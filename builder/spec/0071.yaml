  - 0.5
  - 0.5
  - 0.0
- op: seed_state_random
  at: cell
  block: phase
  lo: 0.0
  hi: 6.2832
operators:
- op: neuron_update
  at: cell
  model: leaky_tanh
  noise: 0.01
- op: neuron_signal
  at: cell
  model: type_pairwise
  edge_set: synapse
  activation: tanh
- op: phase_clock
  at: cell
  block: phase
  omega: 3.0
  jitter: 0.12
  seed: 7
- op: polar_active_stress
  at: mpm_particle
  model: driven
  cell_set: cell
  block: polarity
  phase_block: phase
  drive: voltage
  v0: 0.15
  v_scale: 0.45
  rectify: relu
  amplitude_frac: 0.3
  deviatoric: true
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
  wall_friction: 0.3
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 1.0
  vmax: 1000000000.0
  implementation: warp
schedule:
- neuron_update
- neuron_signal
- phase_clock
- substep_dt: 1.515152e-03
  steps:
  - polar_active_stress
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
