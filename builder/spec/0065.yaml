# R4 -- the connectome doing something: the membrane law, the synaptic
# law, and every soma coloured by its own membrane state.
# Written by tools/platynereis_specs.py.
general:
  name: plat_r4_activity
  seed: 0
  n_frames: 600
  dt: 0.05
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  boundary: wall
  save_data: true
  record_cap: 601
  units:
    length_um: 195.9
    time_s: 1.0
sets:
  brain:
    n: 1
  neuron:
    parent: brain
    per_parent: 4117
    type_layout: ordered
    types:
      Interneuron:
        count: 317
        p: &id001
        - 1.0
        - 0.0
        - 1.2
        - 0.5
        - 1.0
        - 0.0
      Motoneuron:
        count: 124
        p: *id001
      Sensory neuron:
        count: 503
        p: *id001
      chaetal complex:
        count: 657
        p: *id001
      ciliary band:
        count: 74
        p: &id002
        - 2.0
        - 0.0
        - 1.2
        - 0.5
        - 0.5
        - 0.0
      coelothelium:
        count: 101
        p: *id001
      epidermis:
        count: 1120
        p: *id001
      excretory system:
        count: 20
        p: *id001
      gland:
        count: 10
        p: *id001
      gland cell:
        count: 62
        p: *id001
      glia cell:
        count: 72
        p: *id001
      macrophage-like:
        count: 13
        p: *id001
      mesoderm:
        count: 24
        p: *id001
      microvillar:
        count: 13
        p: *id001
      multiciliated cell:
        count: 6
        p: *id002
      muscle:
        count: 840
        p: *id002
      pigment cell:
        count: 156
        p: *id001
      yolk:
        count: 5
        p: *id001
  synapse:
    parent: brain
    edge_set: true
    entity: connection
    pre: neuron
    post: neuron
    edges_file: neural_regions/platynereis_larva_4117/connectome.npz
seed:
- op: neural_seed
  at: neuron
  region: platynereis_larva_4117
  v0_mean: 0.0
  v0_sd: 0.5
operators:
- op: neuron_update
  at: neuron
  model: leaky_tanh
  noise: 0.01
- op: neuron_signal
  at: neuron
  model: type_pairwise
  edge_set: synapse
  activation: tanh
schedule:
- neuron_update
- neuron_signal
fields: {}
plotting:
  renderer: vtk_points
  background: black
  box_frame: false
  up_axis: 2
  dot_shading: true
  max_frames: 300
  stills: 6
  keep_stills: true
  camera_roll: 180.0
  dot_size: 7.0
  color_field: voltage
  field_cmap: coolwarm
  color_range:
  - -1.5
  - 1.5
  static_mesh:
    file: neural_regions/platynereis_larva_4117/body_outline.obj
    color: '#aeb6c2'
    opacity: 0.08
    to_world:
      origin:
      - 6929.0
      - 4209.0
      - -2760.0
      scale: 5.104645227156713e-06
