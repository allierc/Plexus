# A REAL BEAT AT A REAL REYNOLDS NUMBER. Every number below came from a measurement.
#
#   nu 1.6        100x the nu_eff = 0.016 the shear-wave bench MEASURED for this MPM (builder
#                 0193-0202). Below that floor the spec's eta does nothing: bench runs A and E
#                 differ only in eta, by 1000x, and their nu_eff differ by 8%.
#   moment 3.3e5  at Re << 1 the response is LINEAR in the moment, and moment 1000 gave a 0.03
#                 deg tip, so 10 deg needs 3.33e5. Not a guess -- an extrapolation of a measured
#                 slope.
#   k_stretch     the moment drives the first node at M/|e| and only the stretch spring resists,
#     3.67e10     so strain = M/(|e|^2 k). 3% strain at this moment needs 3.67e10. At the
#                 inherited 1e5 the rod pulled apart into an L, which Cedric saw in the picture
#                 before I read the length column.
#   k_bend 1e7    Sp = L (zeta_perp omega / B)^(1/4) = 4.1, which is a real sperm's (about 5).
#   substep       2/sqrt(k_stretch) with a 0.8 margin -- 600 a frame. The STRETCH spring sets the
#     8.3e-6      timestep now, not the fluid: the viscous limit at nu 1.6 is 1.0e-4, twelve
#                 times looser. That is the usual story for an inextensible filament, and a rod
#                 that barely stretches is exactly what a cilium is.
#
# THE CLAMP AND THE PIN HAD TO SCALE WITH THE DRIVE, which the first take of this spec missed.
# The moment drives the base joint at M/|e|^2 = 1.1e9 rad/s^2, and a clamp of 40 rad/s restores
# only clamp^2 * theta = 2.8e2 at 10 degrees -- four MILLION times weaker. So the base simply
# flopped over: measured, centred at +107 deg with the rod curled to 81% end to end, while the
# segments themselves stretched only 0.27% (k_stretch was right; nothing was pulling apart).
# The clamp that holds the base at 10 degrees is sqrt(M/(|e|^2 * 0.175)) = 7.9e4 rad/s, and it
# needs dt < 2/clamp = 2.5e-5 against a substep of 8.3e-6, so it fits. The position pin goes to
# 1e5 for the same reason: the base node had slid 3.2e-2 off its anchor.
#
# RESULT SOUGHT: Re = 0.11 and Sp = 4.1 together -- the first configuration in this build where
# BOTH dimensionless groups sit in a real organism's range. A smaller stroke than 152's costs
# less (the bill goes as sqrt(amplitude)) AND sits at a lower Reynolds number, so it is more
# correct rather than a compromise.
general:
  name: cil_s7_beat
  seed: 0
  n_frames: 800
  dt: 0.005
  dim: 3
  world:
  - 1.0
  - 1.0
  - 1.0
  boundary: wall
  save_data: null
  record_cap: 161
  units:
    length_um: 50.0
    time_s: 1.0
sets:
  rod_node:
    n: 24
    start:
    - - 0.5
      - 0.5
      - 0.3
    entity: mpm_particle
    density: 1100.0
    radius: 0.01
    types:
      cilium:
        fraction: 1.0
        material: elastic
        youngs: 1.0
        density: 1100.0
        block:
        - 0.49
        - 0.49
        - 0.3
        - 0.51
        - 0.51
        - 0.7
    state:
      pos:
        width: 3
        role: coordinate
        integration: second_order_coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: second_order_rate
        boundary: free
  water:
    n: 1
    start:
    - - 0.5
      - 0.5
      - 0.5
    types:
      seawater:
        count: 1
        material: liquid
        bulk_modulus: 100000.0
        density: 1000.0
        eta: 1600.0
        block:
        - 0.08
        - 0.08
        - 0.08
        - 0.92
        - 0.92
        - 0.92
  water_particle:
    parent: water
    per_parent: 155374
    entity: mpm_particle
    density: 1000.0
    radius: 0.5
seed:
- op: rod_seed
  at: rod_node
  length: 0.4
  base:
  - 0.5
  - 0.5
  - 0.3
  direction:
  - 0.0
  - 0.0
  - 1.0
  beat_axis:
  - 0.0
  - 1.0
  - 0.0
  n_rod: 1
operators:
- op: rod_elastic
  at: rod_node
  k_stretch: 36700000000.0
  k_bend: 10000000.0
  zeta_stretch: 0.3
  zeta_bend: 0.05
  emit: mpm_acceleration
- op: rod_base
  at: rod_node
  moment: 333000.0
  omega: 6.283185
  waveform: sine
  omega_n: 100000.0
  zeta: 1.0
  clamp: 80000.0
  clamp_zeta: 1.0
  anchor: fixed
  emit: mpm_acceleration
- op: mpm_strain
  at: rod_node
  implementation: warp
- op: mpm_strain
  at: water_particle
  implementation: warp
- op: mpm_viscosity
  at: water_particle
  eta: 1600.0
- op: mpm_scatter
  at: rod_node
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_scatter
  at: water_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: warp
  polar: higham
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
  wall_friction: 0.3
- op: mpm_gather
  at: rod_node
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
- op: mpm_gather
  at: water_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 32
schedule:
- substep_dt: 8.333333333333334e-06
  steps:
  - rod_elastic
  - rod_base
  - mpm_strain
  - mpm_strain
  - mpm_viscosity
  - mpm_scatter
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
  - mpm_gather
plotting:
  renderer: vtk_points
  background: black
  box_frame: true
  up_axis: 2
  subject: water_particle
  dot_size: 1.6
  dot_shading: true
  max_frames: 160
  stills: 6
  keep_stills: true
  fps: 20.0
  color_field: speed
  field_cmap: inferno
  color_range:
  - 0.0
  - 0.1
  cutaway:
    axis: view
    at: 0.5
  chain:
    set: rod_node
    per: 24
    width: 7
    color: '#ffffff'
descriptions:
  movie:
    description: A thin vertical line of particles is positioned in the center of a large cubic domain.
      Over time, the particles remain stationary and do not exhibit any significant movement or dispersion.
      The simulation progresses through several time steps while the central structure maintains its integrity.
      The visual representation shows a stable state where the velocity field remains near zero.
    objects: The scene contains a single vertical line composed of many small, white particles. This line
      is located in the center of a large, black cubic volume. A scale bar in the bottom right corner
      indicates a length of 10 micrometers. The cubic domain is defined by a wireframe boundary and represents
      a 50 micrometer box.
