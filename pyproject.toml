[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plexus"
version = "0.0.1"
description = "Unified differentiable framework for inverse problems in living tissue: hierarchical sets + operators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torch_geometric",
    "numpy",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The regression series (tests/regression, marker `regression`) reruns working points for minutes
# on a GPU; it is deselected by default and requested with `pytest tests/regression -m regression`.
addopts = "-m 'not regression and not engine'"
markers = ["regression: reruns working points; needs CUDA and minutes (tests/REGRESSION_PLAN.md)",
           "engine: runs the engine on a GPU for minutes (e.g. tests/test_ion_flow.py, the exp04 ion-flow element)"]
testpaths = ["tests"]
