# The round, as a graph. Cedric, 5 August: "what about a graph provided to the round with agents
# and information flow so that it is blind ... that would be easy to modify, easy to understand
# instead of hardcoding?"
#
# THIS FILE IS THE MULTI-AGENT DESIGN. Not a diagram of it -- the thing itself. The round loads it,
# checks it, sorts it and runs it, and holds no opinion about what any node is for.
#
# WHY A GRAPH RATHER THAN THE THREE HARD-CODED STAGES IT REPLACES. The defect this campaign hit at
# least six times is A PRODUCER WITH NO CONSUMER: something computed, written to disk, and never
# handed to the role that needed it. `steer` never reached the Proposer. The premise diagnosis was
# spent on a refusal. `sat` was set in two places and emitted in none. The eye disagreed with the
# Reader on 2 of 10 runs and nothing compared them. Every one of those was found by hand, weeks
# later. As a graph it is arithmetic: a node that emits something no `in:` names is unreachable, and
# `engine.load_flow()` says so at load time, before a GPU or a token is spent.
#
#   id      the node's name, and the default name of what it emits
#   code    a function in round.py, called as fn(ctx) -> value
#   agent   a module in crew/, run as its ROLE says
#   in      what it is given. Every name must be emitted by some node, or the flow is refused
#   out     what it emits, if not its own id. Omit for a terminal node that only writes files
#   each    fan out: run once per item of the named list, not once for the batch
#   writes  the files this node produces. Declaring it marks the node TERMINAL, so the
#           producer-with-no-consumer check accepts that nothing reads its return value
#   args    values merged into the context for that node only -- how a campaign decision is
#           declared here rather than hard-coded in round.py
#
# TO CHANGE THE LOOP, EDIT THIS FILE. Dropping the eye is deleting four lines. Adding a fifth role
# is adding four, plus its .py and .md. Neither touches round.py -- which is the test the design
# has to pass, because the eleven roles Phase 12 removes were each ADDED by editing the engine.

# WHICH PREMISES THIS CAMPAIGN HOLDS ITSELF TO. Not a node the round executes -- `biologist.py`
# reads it directly, on the cluster as well as here -- but the same kind of declaration as
# `parents.pool` and `route_a.plan`, so it is written here with its reason rather than compiled
# into a list in the code. Add an id to retire a premise; delete the line to bring it back. The
# check itself stays in biologist.py either way, because "we tried this and it fired on
# everything" is a finding about the campaign, and deleting the code deletes the finding.
premises:
  retired:
    # Cedric, 8 August: "delete premise 3 5 and 7, they are too strong. I keep P1 and P11,
    # there are sound gate keepers." Measured over rounds 1-4 of this campaign:
    P2:  >-
      "a morphogen sets WHERE and HOW FAST, not WHETHER" -- so a gated composition must keep
      rho > 0, and rho = 0 is refused before the GPU. The objection is real at the limit (an
      infinite tip-to-body ratio is a body frozen while its tip builds itself out of nothing) and
      it has never been tested anywhere short of the limit. Meanwhile it bars the campaign from
      the one regime Okuda is about: at the basis default rho = 1.0 a red cell grows 2x a white
      one, which is a bias, not localization, and every run is a sphere. Retired so the ratio can
      be swept as a quantity instead of vetoed as a principle.
    P3:  >-
      refused FOUR route A slots in round 3 before the GPU, because the vth_frac grid and the
      factor grid cross each other on coral_gate_div. The relation is real; as a veto it spent
      a quarter of a round saying so.
    P3b: >-
      fires whenever cells divide faster than they grow -- v_cell 0.083 at factor 1.5, 0.163
      at 2.0 -- which is the regime the campaign is trying to characterise, not an error in it.
    P5:  >-
      a statement about the frame clock, settled once when dt was removed from the growth
      operators. Nothing since round 1 has been able to break it.
    P5b: >-
      broke in the CONTROL itself (residual force 1.38 -> 3.25 at a fixed 2000 cells). It says
      relax_iters is constant while the tissue grows, which is true, is about the solver, and
      is not something a spec edit can answer.
    P7:  >-
      broke on ALL 15 valid runs of round 3 and on every dividing rung of round 1. A check that
      fails on everything separates nothing.

nodes:

  # ---- what the round starts from ------------------------------------------------
  # WHERE ROUND 1 STARTS. Nothing in the first version of this flow said, so on a fresh campaign the
  # parent set was empty and nothing could be built -- a missing node, found by trying to launch.
  # These are Cedric's choices, each with a spec and a measured diag.json on disk. After round 1 the
  # campaign's own records supersede them.
  - id: parents
    code: round.parents
    args:
      # HOW MANY to build from, and what counts as FORCED. The second is a judgement about
      # evidence -- a composition carrying `interface_push` is paid to have a
      # protrusion -- so it is a campaign decision, not arithmetic.
      limit: 6
      # DISABLED 10 August, and it cost the campaign its best specimen. This is a MEASURED proxy
      # for forcing -- "a pressure ratio this high means the tube was pushed" -- and it sorted any
      # run above it dead last, permanently. Measured over r001-r029: 11 runs crossed it and NOT
      # ONE was ever used as a parent. Among them `r019_07`, protr_peak 1.817 and grip_peak 0.294,
      # the highest of BOTH in the whole campaign, against a control ceiling of 1.595 / 0.262 that
      # four rounds could not beat. The loop's best result was structurally unreachable.
      #
      # A proxy for forcing is only defensible while forcing is a knob hiding inside a sound
      # operator. Since the 10 August split it is its own operator, absent from the vocabulary, so
      # `forcing_terms` below settles the question STRUCTURALLY by reading the spec -- and a
      # measured stand-in can now only produce false positives, which is exactly what it did.
      # null = no measured demotion. Set a number to bring it back.
      forced_p_ratio: null
      # THE PORTFOLIO. Cedric, 10 August: "in the new loop I would like to explore altogether tube
      # forming, budding, branching, complex shape." The old selection was a greedy sort on
      # grip_peak then protr_peak, which can only climb ONE hill: measured over r001-r029, 18
      # distinct compositions in 196 structural records, one composition proposed 87 times, and for
      # four rounds the top six parents were five clones of a single result.
      #
      # One reserved seat per target morphology, so a lone branched specimen is a parent even when
      # every high-grip run is a sphere; `score` is a weighted sum over that run's own metrics, so
      # each target defines what "best" means for it. `max_per_lineage` is what actually closes the
      # rabbit hole -- no family may hold more than this many seats.
      per_target: 1
      max_per_lineage: 2
      targets:
        # KEYED ON MEASURED QUANTITIES, NOT ON THE CLASSIFIER'S LABEL. The first version filtered
        # each seat by `morphology`, and the classifier -- whose own docstring calls itself a HINT
        # -- returns `sphere` for almost everything: 314 of 416 runs in the old ledger and 14 of 14
        # in round 1 of this one, including r001_03 at aspect 4.914 with two tips and r001_04 at
        # 6.804. So tube/branched/complex matched nothing, every seat fell through, and the
        # portfolio silently became the greedy ranking it was written to replace. `where` is a floor
        # on what was measured; `morphology` may still be added as an extra filter when the label is
        # trusted.
        # _final, NOT _peak -- the campaign proved its own instrument blind. Standing law L3,
        # r001-r006: "protrusion_aspect_max_peak and n_tubes do NOT discriminate a finger from a
        # lobe" -- every high-aspect run (7.742, 5.909, 5.578) reads as a lobe or pointed star by
        # the eye, with aspect_FINAL 0 and n_tips 0. A peak is a transient bulge on the way to
        # somewhere; a value that survives to the last frame is a structure. Measured over 81
        # scored runs, aspect_final is nonzero in TWO of them -- r004_06 at 2.207, the campaign's
        # one run the classifier called `tube`, and r006_08 at 0.414. The threshold is 0.4 rather
        # than 2.0 because "a protrusion still there at the end" is the claim; 2.0 would be a seat
        # that has matched one run in ninety-four.
        tube:
          # NOT KEYED ON `protrusion_aspect_max_final`, WHICH CANNOT SEE A TUBE ON THIS SUBSTRATE.
          # r013_05 is eleven arms with activator at their tips, 5.92 long and 2.11 across, and
          # reads aspect_final 0.0 and n_tips_final 0. It could not take this seat and got into
          # r014 through `complex`, on grip -- the one specimen closest to the campaign's stated
          # objective, invisible to the objective's own metric. That is standing law L3, filed
          # since r006 and never acted on: "the metric zeroes tips the picture shows".
          # `n_tubes` comes from `tissue_analysis:tube_diameter`, is admitted and headline, and
          # counts r013_05's arms at 11 -- the same number the eye reports. Aspect stays in the
          # SCORE, where a run that has it ranks higher, but no longer in the gate, where it was
          # excluding the seat's own best candidate.
          #
          # NOT `ta_tube_len_final`, though it measures exactly the quantity this seat wants and
          # reads 5.92 on r013_05: that metric is WITHDRAWN -- "the instrument gate measured it to
          # lie (F15/F16)" -- and a seat is not the place to quietly readmit a rejected instrument.
          # The seat therefore counts arms and does not weigh their length; if length is worth
          # having, the instrument has to be re-earned through the gate first.
          # SCORED ON `protr_final`, NOT ON `protrusion_aspect_max_final`, since 13 August. The
          # metric gate measured that name at 2.44x its own seed floor -- under the 3x bar -- and
          # it, together with `n_tips_final`, classifies this campaign's own phenotype montage at
          # 58.6% against a 53.1% majority baseline. It cannot tell a flower from a sphere, and it
          # was HALF THIS SEAT'S SCORE. `protr_final` resolves 15.34x and is admitted.
          where: {n_tubes_final: 2}
          score: {n_tubes_final: 1.0, protr_final: 0.5}
        bud:
          # a BULGE, not a finger -- aspect counts against it, or this is just the tube seat again
          # THE NEGATIVE ASPECT TERM IS GONE and nothing replaces it, which is a loss stated
          # rather than papered over. "A bulge, not a finger" is exactly the distinction
          # `protrusion_aspect_max` was for, and it is the distinction the gate says that metric
          # cannot make. No admitted name separates a bud from a tube, so this seat now selects the
          # best protrusion of any shape and the `tube` seat above takes the ones with arms. If the
          # distinction is worth having, it needs an instrument that earns the 3x bar.
          where: {protr_final: 1.10}
          score: {protr_final: 1.0, n_tubes_final: -0.3}
        branched:
          # LEGITIMATELY EMPTY, and left that way on purpose. A branch is two or more SUSTAINED
          # tips; n_tips_final is nonzero in two runs of eighty-one and reaches 1.0 in both, so
          # nothing in this campaign has ever branched. n_tips_PEAK >= 2 matched 27 of 81 and the
          # Analyst is explicit that those are five- and six-lobe stars -- keying the seat there
          # filled it with lobes and made the portfolio look diverse while selecting for the same
          # thing twice. An empty seat falls through to the fill and costs nothing; it will seize
          # the first real branch the moment one exists, which a lobe-filled seat could not.
          # RE-KEYED OFF `n_tips_final`, WHICH THE GATE RETIRED (2.78x its seed floor, under the
          # 3x bar). This seat was already documented as legitimately empty -- "n_tips_final is
          # nonzero in two runs of eighty-one" -- and now the reason is arithmetic rather than
          # anecdotal: the metric does not resolve, so its zeros were never evidence of no branch.
          #
          # NOTHING IN THE ADMITTED TEN MEASURES BRANCHING. A branch is an arm that itself divides,
          # and no instrument the campaign owns separates that from an arm that does not. So the
          # seat is keyed on the nearest admitted quantity -- MANY arms -- and is honest that this
          # is a proxy: four or more tubes is where a branch would have to appear if one ever did.
          where: {n_tubes_final: 4}
          score: {n_tubes_final: 1.0, protr_final: 0.5}
        complex:
          where: {grip_final: 0.05}
          score: {grip_final: 1.0, invagination_final: 0.5}
      forcing_terms: {interface_push: K_extrude}   # split out 10 Aug; NOT in the vocabulary
      # EVERY ENTRY REBUILDS AND ADMITS. Checked by `round.py --check`, because the first version of
      # this pool did not: two of its six entries were inadmissible and it took a live Proposer call
      # to find out. All were measured, not remembered -- metrics come from each run's own diag.json.
      # THE UNGATED `uniform` COLUMN WAS DROPPED, 10 August, all seven members. `rho = 1.0` with no
      # gate is unbounded exponential growth and there is no mechanism in the composition that can
      # stop it: measured at 1800 frames, b_none_uniform_plain finished at 59,782 cells against a
      # 60,000 array and b_none_uniform_shaping at 59,928 -- pinned, so their metrics describe the
      # reservoir rather than the tissue, and the morphology classifier returned `unclear` for
      # exactly that reason. Death does not rescue it either: the uniform death twin took 2,080
      # apoptoses and still finished at 57,819 cells.
      #
      # This is premise 20-odd of _premises_raw.md, unread for the whole campaign: "tissues stop
      # growing when compressed; a growth law that reads only a chemical signal has no mechanism by
      # which it can ever stop". The column is not a bad base, it is a base whose growth law is
      # incomplete -- worth rebuilding with a compression term, not worth searching from now.
      pool:
        # THE POOL IS THE BASIS, member for member -- crew/basis.yaml declares them and this
        # lists them. They drifted apart once already (a pool entry with no run on disk, a
        # basis member nothing could build from), and a pool that is not the basis is a
        # campaign searching from something nobody measured.
        - b_null_plain
        - b_null_shaping
        - b_gs_plain_soft_lo
        - b_gs_plain_soft_hi
        - b_gs_plain_sharp_lo
        - b_gs_plain_sharp_hi
        - b_gs_shaping_soft_lo
        - b_gs_shaping_soft_hi
        - b_gs_shaping_sharp_lo
        - b_gs_shaping_sharp_hi
        - b_gs_plain_soft_lo_death
        - b_gs_shaping_sharp_hi_death
        # THE STAR AND WHAT IS BRED FROM IT -- see the block in crew/basis.yaml. Nine members, all
        # on the one composition in 196 runs that made arms rather than lobes, each changing one
        # mechanism that has never run: oriented division, tension/pressure feedback, a negative
        # beta, the gate read as a fraction, and Okuda's own multi-cone seeding.
        - b_star
        - b_star_sharp
        - b_star_death
        - b_star_oriented
        - b_star_tension
        - b_star_pressure
        - b_star_avoid
        - b_star_relgate
        - b_star_cones
        # THE FLOWER AND ITS THREE -- broad petals rather than thin arms, deepest invagination on
        # file. See crew/basis.yaml; the variants ask Die, Divide and Seed whether it steers.
        - b_flower
        - b_flower_death
        - b_flower_oriented
        - b_flower_cones
  # ---- WHAT IS CURRENTLY KNOWN, as objects the round can act on -------------------
  # The last campaign handed the Proposer metrics and parents and asked it to produce knowledge.
  # It produced eleven STANDING LAWS as prose in a file nothing read back, two of which
  # contradicted each other for six rounds because no role was ever shown both at once. These two
  # nodes are the fix: the ledger says what is claimed and how strongly, the floors say what a
  # single run can resolve. Neither existed, and between them they are what an `act` needs.
  - id: claim_ledger
    code: round.claim_ledger

  # WHAT THE ANALYST'S OWN CLAIMS CAME TO. It has induced 27 and been told the fate of none: 25 had
  # never been tested by any slot and nothing in the loop said so to the role that wrote them. A
  # reviewer that never learns which of its claims survived cannot calibrate what is worth stating.
  - id: track_record
    code: round.track_record

  # THE CAMPAIGN AS A SERIES. Every role sees its own round and nothing else, and every pattern that
  # has mattered was cross-round -- foresight falling 0.635 -> 0.501 over ten rounds, the ledger
  # growing 13 -> 40 with 32 untested, one lineage producing every run above five arms. All of it
  # was computed BY HAND from files the loop had already written.
  - id: trends
    code: round.trends

  # WHAT THE SUBSTRATE HAS BEEN MEASURED TO IGNORE. 25 of 152 runs produced a trajectory
  # byte-identical to another run's -- ~16% of the GPU -- because the edit named a knob the physics
  # does not read. R6 cannot see it: the specs differ, only the trajectories do not. The Analyst
  # detected it four times (C018, C023, C026, C030, all `kind: harness`) and no act in the
  # vocabulary can bear on a harness claim, so four correct detections had no addressee. This node
  # is the addressee. It REPORTS, it does not refuse: a Proposer that reads the list needs no rule.
  - id: inert
    code: round.inert

  # WHERE THE CAMPAIGN HAS AND HAS NOT BEEN. The loop has a ledger (what it believes) and a
  # portfolio (what to build on) and has never had a MAP. Equal-width cells over the measured range
  # of two admitted metrics, so nothing here declares a threshold; an empty cell is a fact, and
  # whether it is unreachable or merely unvisited is the Proposer's judgement.
  - id: occupancy
    code: round.occupancy

  # THE ANALYST'S PROSE, WHICH REACHED NOBODY. 444 lines over ten rounds whose only reader was the
  # regex that lifts a fenced JSON block out of it; `history` is rendered from the ledger, not from
  # this. Last round's, necessarily -- the Analyst runs at the end of a round and the Proposer at
  # the start, so a same-round edge would be a cycle.
  - id: last_analysis
    code: round.last_analysis

  - id: metric_floors
    code: round.metric_floors

  - id: history
    code: round.history
    args:
      # null = hand over ALL of knowledge.md. It was 12000, and `_read` keeps the LAST 12000
      # characters of a 38,591-character file, so rounds 1-20 were invisible to every role in
      # every round -- silently, because the cut happens before the block's TRUNCATED marker.
      # If this ever outgrows a context the answer is to COMPACT the file into a synthesis, not
      # to drop its oldest and most settled evidence.
      limit: null

  # THE GROUNDER'S VERDICT, CARRIED FORWARD. It was a terminal node writing a file nothing read,
  # while crew/grounder.md tells the role its verdict "becomes next round's proposal". Round 28's
  # verdict -- that Okuda's tubes come from a mechanics leg, not radial push -- was the most
  # strategic sentence of the round and reached nobody.
  - id: grounding
    code: round.grounding

  - id: metric_bank
    code: round.metric_bank

  - id: menu
    code: round.menu
    in: [parents]
    args:
      # HOW THE MENU IS BUILT is a campaign decision, not an implementation detail.
      limit: 40          # rows offered per parent
      grid: [0.5, 2.0]   # the factors of the parent's OWN value a set_param row offers
      closure: 4         # distinct values RUN before a knob is withheld as closed

  # A CHILD THAT BROKE A PREMISE ITS PARENT HOLDS differs from it in a small enumerable set of ways,
  # so each difference is a hypothesis and reverting exactly one is a legal one-edit experiment.
  # Round 2 had both halves on disk and nothing joined them. This edge is that join.
  - id: diagnosis
    code: round.diagnosis
    in: [parents]

  # WHAT THE CAMPAIGN HAS NOT TRIED. proposer.md says "cover the map"; nothing told it what was
  # uncovered, and the measured cost was a round where eight of eleven slots came off one parent while
  # two of thirteen operators could not be reached at all. In the control loop this is unnecessary --
  # its hand-maintained sweep table IS the coverage -- so here it is derived once a round.
  - id: coverage
    code: round.coverage
    in: [parents, claim_ledger]

  # ---- propose -------------------------------------------------------------------
  # WHAT LAST ROUND PROPOSED AND COULD NOT RUN. Cedric, 6 August, reading three red `set_impl`
  # lines: "does it get the message to rectify if necessary next round?" It did not. Refusals were
  # printed to a terminal and lost, so the Proposer could re-propose the same dead edit forever
  # with nothing to tell it otherwise -- and once lost twelve slots across two rounds while being
  # told none of it. This is the sixth producer-with-no-consumer, and the one this graph could not
  # catch, because a refusal was never a node. Now it is.
  # THE HUMAN'S CHANNEL. `campaign/user_input.md` has been protected from every reset since before
  # Phase 12 -- "it is the human-in-the-loop channel" -- and has reached no role since Phase 12
  # deleted the agent that read it. A consumer with no producer, which this graph exists to catch
  # and could not, because it was never a node. Read at the top of EVERY round, so an instruction
  # written mid-campaign lands on the next round without a relaunch.
  - id: user_input
    code: round.user_input

  - id: refusals
    code: round.refusals

  - id: proposer
    agent: proposer
    # `track_record`, `inert`, `occupancy` and `last_analysis` ADDED 16 AUGUST, and all four are the
    # same defect: the round computed a fact and handed it to a role that could not act on it, or
    # to nobody. track_record told the ANALYST that nobody tests its claims -- the Proposer is the
    # only role that can; inert was not computed at all; occupancy did not exist; and the Analyst's
    # reasoning died in analysis.md. Facts to the role that decides, rather than rules in the engine.
    in: [parents, menu, metric_bank, coverage, diagnosis, history, refusals, user_input,
         grounding, claim_ledger, metric_floors, trends, track_record, inert, occupancy,
         last_analysis]
    out: edits

  # ---- build, launch, measure ----------------------------------------------------
  # ---- Route A: what VALUE makes a mechanism work ---------------------------------
  # Cedric, 7 August: "fix 16 jobs per run, 8 for route A 8 for route B", and "route A should be
  # parents of route B too". Route B chooses WHICH mechanism; A sweeps one knob on a known-good
  # recipe to closure. 25 rounds of B alone produced 214 dead spheres of 273, because the setting
  # that makes division real -- `rho` -- had never been swept by anyone. A's runs are recorded
  # like any other, so `parents` picks them up and B builds its next mechanism on them.
  - id: route_a
    code: round.route_a
    args:
      # THE SWEEP PLAN IS A CAMPAIGN DECISION, so it is declared here rather than in round.py --
      # the same reason `parents.pool` is. Each entry is [base, operator, knob, values]; the node
      # walks the bases in rotation, gives each an equal share of the remaining slots, and lets a
      # base with nothing open pass its share on. A knob run at every value on its base is CLOSED
      # and never offered again -- closure is scoped (base, knob) and to Route A's own slots, so
      # one base cannot retire another's ladder and a Route B edit cannot be counted as a rung.
      #
      # RE-BASED 8 AUGUST onto the generated basis. The old plan swept `cellfix_B_new` and
      # `coral_gate_div`, both archived: their mechanics model cannot express K_bend or K_lumen,
      # so half the questions below were unaskable on them.
      #
      # FOUR BASES, ONE PER CHEMISTRY COLUMN, all `gated` except the chemistry-free one, which has
      # no gate to close. That is the comparison Route A exists to make -- Cedric, 8 August: "add 4
      # to study RD mechanisms in route A" -- and it only became possible when `brusselator` gave
      # the chemistry axis its third model. The same knob swept on four reaction schemes answers
      # "is this a property of growth or a property of gray_scott", which no single-base sweep can.
      #
      # EVERY GRID EXCLUDES ITS BASE'S OWN DEFAULT VALUE. Measured on the last campaign: 5 of 24
      # Route A slots re-ran the baseline unchanged -- r001_12 (rho 0.1), r002_13 (vth_frac 2.5)
      # and r004_13 (factor 2.0) are bit-identical to each other, because all three values are what
      # `coral_gate_div` already carried. A free determinism check, and an expensive sweep point.
      # The round's own control measures that point every round for nothing.
      #
      # 6, NOT 8 -- THE SPLIT MOVED TOWARD ROUTE B FOR THE CLAIM CAMPAIGN. Measured over r001-r022:
      # a round is 15 runs of which 9 are Route A and only 6 are Route B, so ten rounds buy about
      # sixty epistemic acts -- and every act that tests, falsifies, bounds, transfers or
      # discriminates a CLAIM has to come out of those six. At 1.8 h a round that is the binding
      # constraint on the whole claim layer, and moving it costs no GPU.
      #
      # Route A can afford to give them up. Its ladders were bought to learn what value makes a
      # mechanism work, and the most valuable thing they produced -- the per-metric seed floors,
      # spanning 2% to 41% -- is now MEASURED and written into epistemic_spec.md. It keeps six
      # slots because closing a knob is still a real result and the bases still differ; it does
      # not keep nine.
      slots: 6
      plan:
        # ---- LOCALIZATION FIRST, and the previous version of this plan led with `cell_divide.factor`
        # at [1.3, 1.6, ...] instead. That ordering came from "nothing downstream means anything
        # until the tissue gains material", which was true of the old substrate and is false of
        # this one: the basis reaches 53,000 cells and one Route A rung hit 129,703. The problem
        # is now the opposite, and the Grounder has said so for three rounds running -- Okuda
        # Fig 5a grows 2032 -> 3572 cells (1.76x), the control reached 30,743 (15x), and
        # "over-proliferation floods the surface, raising n_spots while each dilutes into a bulge".
        # Leading with the low end of `factor` walks further into the failure.
        #
        # `rho` IS THE LOCALIZATION KNOB. Growth is rate*(rho + Hill(a)), so the tip-to-body ratio
        # is (rho+1):rho -- and the basis default rho = 1.0 is 2:1. A red cell grows twice as fast
        # as a white one, which is a bias, not localization, and every run in the basis and every
        # run in rounds 1-3 is a sphere. The old grid [0.25, 0.5, 2.0, 3.0] made this worse: three
        # of its four values are LESS localized than the base and its best is 5:1.
        #
        #     rho 0.05 -> 21:1     rho 0.1 -> 11:1     rho 0.25 -> 5:1     rho 0.5 -> 3:1
        #
        # 0.0 (infinite ratio, activator-only growth) is now reachable too -- P2 was retired on
        # 8 August precisely because it vetoed the limit case as a principle instead of letting
        # the campaign measure where the objection starts to bite.
        - [b_gs_plain_soft_lo,     cell_grow,   rho,      [0.05, 0.1, 0.25, 0.5]]
        - [b_bru_question,    cell_grow,   rho,      [0.05, 0.1, 0.25, 0.5]]
        # HOW BIG A RED CELL MAY GET BEFORE IT DIVIDES -- the lever the Grounder has asked for in
        # three consecutive rounds and nobody moved: "cap cells_final near 3600 so growth loads
        # into elongation, not more cells". Okuda Fig 5a grows 2032 -> 3572 cells, 1.76x. This
        # campaign's control reached 30,743, FIFTEEN times, and the Grounder's reading is that the
        # surface floods with spots which each dilute into a bulge.
        #
        # THE TOP OF BOTH GRIDS IS CUT (vth_frac 16, factor 14) -- Cedric, 8 August. A cell at
        # factor 14 divides only on reaching FOURTEEN TIMES ITS OWN BIRTH VOLUME, which on a
        # 2,000-cell sphere is one enormous cell among small ones; P8 (the shape-index floor) or
        # P11 (self-intersection) would likely refuse it, and a grid whose top rungs are refused
        # spends slots discovering its own bound. 10x and 8x already ask the question.
        #
        # `vth_frac` caps a cell's target volume at vth_frac x v_ref, the SEED-TIME MEDIAN cell
        # volume; `factor` divides it at
        # factor x its BIRTH volume. At the basis values (2.5 and 2.0) a cell divides at 2x and
        # can never reach 2.5x -- so growth has nowhere to go except into more cells. Cedric,
        # 8 August: "we should allow up to x4 or x10 cell growth in red spot?" These grids are
        # that question. They must be swept TOGETHER: factor above vth_frac is a cell that can
        # never reach the size that divides it, which is the relation the retired P3 used to veto.
        - [b_gs_plain_soft_lo,     cell_grow,   vth_frac, [4.0, 6.0, 10.0]]
        - [b_bru_question,    cell_grow,   vth_frac, [4.0, 6.0, 10.0]]
        - [b_gs_plain_soft_lo,     cell_divide, factor,   [2.4, 3.0, 5.0, 8.0]]
        - [b_bru_question,    cell_divide, factor,   [2.4, 3.0, 5.0, 8.0]]
        # The low end of `factor` stays on the CHEMISTRY-FREE base only. Rounds 1-3 closed that
        # ladder on three bases and it produced the campaign's one replicated law -- fewer
        # divisions, bigger cells, rounder shell, higher coupling, monotone on all of them. It is
        # knowledge, not a question, and re-running it on the gated bases would spend eight slots
        # confirming that flooding floods. Keeping it here preserves the geometric control.
        # ---- THE GATE ITSELF: where the activator opens growth, and how sharply.
        - [b_gs_plain_soft_lo,     cell_grow,   a_sw,     [0.1, 0.2, 0.5, 0.7]]
        - [b_bru_question,    cell_grow,   a_sw,     [0.1, 0.2, 0.5, 0.7]]
        - [b_gs_plain_soft_lo,     cell_grow,   hill,     [1.0, 2.0, 8.0, 16.0]]
        - [b_bru_question,    cell_grow,   hill,     [1.0, 2.0, 8.0, 16.0]]
        - [b_gs_plain_soft_lo,     cell_grow,   rate,     [0.000433, 0.001732, 0.003464, 0.006928]]
        # ---- THE RD MECHANISMS. Each model's OWN parameters -- they do not share a vocabulary,
        # which is exactly the mistake that shipped four bases carrying Gray-Scott's `F` and `kk`
        # on a gierer_meinhardt slot. gray_scott reads F/kk, gierer_meinhardt reads a0/mu_h/sat,
        # brusselator reads gamma (with A, B fixed at the Turing-unstable 1.0 / 3.0).
        - [b_gs_plain_soft_lo,     cell_chem_react, F,       [0.03, 0.038, 0.054, 0.06]]
        - [b_gs_plain_soft_lo,     cell_chem_react, kk,      [0.052, 0.057, 0.066, 0.07]]
        - [b_bru_question,    cell_chem_react, gamma,   [0.05, 0.15, 0.6, 1.2]]
        # Diffusion is shared vocabulary and IS comparable across the three, so it is swept on all
        # of them: the ratio d_h/d_a is what sets the Turing wavelength in every one of these
        # schemes, and whether the spacing responds the same way is a real question about the
        # models rather than about their parameter names.
        - [b_gs_plain_soft_lo,     cell_chem_diffuse, d_a,   [0.02, 0.04, 0.16, 0.3]]
        - [b_bru_question,    cell_chem_diffuse, d_a,   [0.02, 0.04, 0.16, 0.3]]
        - [b_bru_question,    cell_chem_diffuse, d_h,   [0.04, 0.08, 0.32, 0.6]]
        - [b_gs_plain_soft_lo,     cell_chem_diffuse, chi,   [0.3, 0.65, 2.0, 2.8]]
        # ---- SHAPE -> CHEMISTRY, the second arrow. beta = 0 is the null and must be run.
        - [b_gs_plain_soft_lo,     cell_chem_from_shape, beta, [-2.0, 0.0, 1.0, 2.0]]
        - [b_bru_question,    cell_chem_from_shape, beta, [-2.0, 0.0, 1.0, 2.0]]
        - [b_gs_plain_soft_lo,     cell_chem_from_shape, F0,   [0.02, 0.03, 0.07, 0.1]]
        # ---- MECHANICS LAST, and these have NEVER been swept by this project. K_bend and K_lumen
        # were inexpressible in the old base's model; K_purse existed only alongside the forcing
        # term that disqualifies a run. They are the three terms that can neck a lobe into a
        # finger, so a null result here is as informative as a positive one.
        # FOUR KNOBS APPEAR TWICE BELOW, and that is deliberate rather than a duplicate to tidy
        # away: a closed coarse grid and a refinement of it are two entries on the same
        # (base, knob). Closure is counted on VALUES, per base, so the coarse grid stays closed
        # and only the unrun refinement is offered. K_bend, Lambda, vth_frac and factor each have
        # a pair.
        #
        # ---- THE SIZE-CONTROL MODELS, added 9 August and never yet run against each other. They
        # are `model=` variants, so the swept key is `model` and the values are names -- which
        # `_build_sweep` handles, because it writes any key onto the operator dict. Route B can
        # only reach them one edit at a time; a ladder is what tells them apart.
        #
        # Each is a mechanism from Ginzberg, Kafri & Kirschner rather than a knob: `sizer` makes
        # small cells grow faster, `balance` sets a target size from a synthesis/degradation
        # equilibrium with no size sensor at all, `timer` lands every cell on target size at a
        # fixed cycle length. `cell_divide.doubler` is the birth-relative rule that was default
        # until 8 August and corrects no size deviation -- it is the NULL these are read against.
        # The default (absent from both grids, measured every round as the control) is cell_grow
        # exponential + cell_divide sizer.
        - [b_gs_plain_soft_lo,     cell_grow,   model,    [sizer, balance, timer]]
        - [b_gs_plain_soft_lo,     cell_divide, model,    [doubler, timer]]
        # ---- THE DIFFUSION RATIO, which is what actually sets the Turing wavelength. `d_a` is the
        # campaign's strongest lever -- spots 166 -> 3 and grip 0.018 -> 0.089 across its grid --
        # but it is confounded: moving it changes the wavelength AND the diffusion speed together.
        # Sweeping `d_h` at fixed `d_a` separates them, and it is the one experiment that could
        # break "coarser-grips-harder", fifteen rounds of it: fine spots at a HIGH ratio may grip
        # where fine spots at low d_a do not.
        - [b_gs_plain_soft_lo,     cell_chem_diffuse, d_h,   [0.04, 0.08, 0.32, 0.6, 1.2]]
        # ---- REFINING THE TWO STRUCTURES ALREADY FOUND. Both were located on a 4-point grid
        # spanning a decade, which is enough to see a shape and not enough to resolve it.
        # K_bend has an INTERIOR OPTIMUM: grip 0.0412 / 0.0431 / 0.0574 / 0.0360 at 0 / 0.005 /
        # 0.08 / 0.3, the second non-monotone result this project has produced.
        - [b_gs_shaping_soft_lo,   cell_mechanics, K_bend,  [0.03, 0.05, 0.12, 0.2]]
        # Lambda is a CLIFF, not a slope: grip 0.0511 / 0.0519 / 0.0227 / 0.0021 and corr 0.87 ->
        # 0.40 at 0 / 0.2 / 1.0 / 2.0. Everything happens between 0.2 and 1.0 and nothing is
        # measured there. Lambda charges for edge length, so it opposes any shape that is not a
        # sphere -- where exactly it starts winning is worth a number.
        - [b_gs_shaping_soft_lo,   cell_mechanics, Lambda,  [0.3, 0.45, 0.6, 0.8]]
        # ---- THE GROWTH CEILINGS, re-opened at the top because 1800 frames changed what they
        # mean. At 900 the control ended at 3,089 cells; at 1800 it reaches 7,424, so a ceiling
        # that was never approached now binds, and its effect compounds over the second half of a
        # run that did not previously exist.
        - [b_gs_plain_soft_lo,     cell_grow,   vth_frac, [14.0, 20.0, 30.0]]
        - [b_gs_plain_soft_lo,     cell_divide, factor,   [11.0, 16.0, 24.0]]
        - [b_gs_shaping_soft_lo,   cell_mechanics, K_bend,  [0.0, 0.005, 0.08, 0.3]]
        - [b_gs_shaping_soft_lo,   cell_mechanics, K_lumen, [0.0, 0.1, 2.0, 8.0]]
        - [b_gs_shaping_soft_lo,   interface_tension, K_purse, [0.0, 0.25, 3.0, 6.0]]
        - [b_gs_shaping_soft_lo,   cell_mechanics, K_V,     [5.0, 10.0, 40.0, 80.0]]
        - [b_gs_shaping_soft_lo,   cell_mechanics, Lambda,  [0.0, 0.2, 1.0, 2.0]]
        # ---- THE DEATH LADDERS, and the reason the death twins are in the basis at all. Route A
        # cannot introduce an operator -- `_build_sweep` refuses "route A base has no
        # cell_die" and this plan is static -- so a mechanism absent from the basis can never
        # be swept. cell_die spent five rounds on the menu, flagged by `coverage` as the only
        # operator never exercised, and was never chosen; these ladders ask what it DOES rather
        # than waiting for the Proposer to volunteer.
        #
        # `mode` is a `model=`-style axis -- each value is a different biological hypothesis about
        # WHY a cell is eliminated, sharing one mark/shed/extrude pathway -- and `_build_sweep`
        # writes any key onto the operator dict, exactly as it does for cell_grow.model. The base
        # itself runs `competition`, so that is the control these are read against and it is
        # absent from the grids.
        - [b_gs_plain_soft_lo_death,   cell_die, mode, [smaller, older, crowded, dimmer]]
        # `dimmer` reads the activator, so it is NOT offered on the b_none column: a mode that
        # returns None on a base with no chemistry is a slot spent measuring nothing.
        # HOW FAST, as distinct from WHO -- the knob that decides whether death is a mechanism or
        # a demolition. Uncapped, five of six modes took r020_00_ctrl from protr 1.513 / grip 0.228
        # to 1.131 / 0.049 with 1,660 of 7,424 cells dead; at 0.005 every mode finished within a
        # few percent of its parent with no premise broken. 0.005 is the base, so this spans a
        # factor of twenty around it and asks where the wall is.
        - [b_gs_plain_soft_lo_death,   cell_die, max_mark_frac, [0.001, 0.002, 0.01, 0.02]]
        - [b_gs_shaping_sharp_hi_death, cell_die, max_mark_frac, [0.001, 0.002, 0.01, 0.02]]
        # ---- IS BRUSSELATOR INERT, OR JUST SLOW? Every bru member measured grip -0.003 to 0.003
        # against 0.034-0.076 for gray_scott, and it was about to be written off as a mechanism.
        # But `gamma` was set to 0.05 to stop it DIVERGING at 0.3 -- chosen for stability, never
        # once for patterning -- so "brusselator does not couple" is a claim about one untested
        # number. The column is gone; the question is a ladder on the one member that carries it.
        # - [b_bru_question, cell_chem_react, gamma, [0.02, 0.10, 0.16, 0.24]]   # base withdrawn un-run

  - id: build
    code: round.build_all
    in: [edits, parents, route_a]
    out: specs
    args:
      # Cedric, 7 August: "fix 16 jobs per run, 8 for route A 8 for route B" -- and 6 August:
      # "the one-edit-per-slot rule is too rigid, allows 4". Both were decisions made in
      # conversation and both were hard-coded here; this is where they belong.
      slots: 16
      # 1800, DOUBLED 9 August. Cedric, having watched r017_07 and r014_01: "there are indeed
      # protrusions, a bit big in diameter, but the metrics are healthy -- would just need to run
      # x2 frames to see further protrusions." Both runs are still elongating when the clock stops
      # (protr_peak == protr_final on r014_01), so 900 frames is measuring the middle of the
      # morphogenesis, not its end.
      #
      # PAIRED WITH PG_ROUND_CAP=90, which the launch must set. At 900 frames a round took ~50-85
      # minutes; doubling the frames roughly doubles that, and the 30-minute default cap would
      # SIGTERM nearly every run. 90 lets the small runs -- which is most of them now that rho=0.1
      # and the sizer hold cell counts near 2,500 -- finish all 1800, and salvages the few large
      # ones at whatever frame they reached, recorded as `stopped_early`.
      # 1800, AND IT WAS BRIEFLY 3600. Doubling again was measured, committed, and reverted the
      # same day: Cedric decided not to relaunch, so the file must say what is actually running.
      # A config that describes a run nobody started is the same lie as a comment that stopped
      # describing the code.
      #
      # The measurement stands if it is ever wanted. At 1800 frames the population is bimodal:
      # the protrusion lineage (2,500-16,000 cells; r017_07 is 2,486) finishes all 1800 in 22-40
      # minutes, while the exploders sit at 76,807 cells by FRAME 430 after 46 minutes, limited by
      # the 130,004-cell reservoir rather than by the clock. So 3600 would be cheap where it helps
      # and irrelevant where it does not -- and it must move together with PG_ROUND_CAP, which
      # would need 180, taking a round to three hours and the campaign to ~8 rounds a day.
      frames: 1800
      max_edits: 4
      # HOW MANY REPEATS A ROUND MAY BUY. A refused duplicate is re-admitted at a fresh seed and
      # relabelled a robustness test -- which was right, because "a difference smaller than the
      # seed spread is not a difference" and this campaign had never measured its own seed spread.
      # But it was UNCAPPED, so re-proposing a known experiment cost nothing and paid: it survived,
      # produced a scored outcome and inflated the confirm rate. Measured r025-r028, replicates took
      # 5 of 7 Route B slots in r028, 4 of 5 in r027 and in r025, 3 of 4 in r026 -- Route B had
      # become a robustness-testing service. Two bounds a noise floor; the rest is a round that has
      # stopped searching. Past the budget the duplicate is refused AS a duplicate, and that refusal
      # now reaches the Proposer.
      max_replicates: 2
      # THE CELL CAP A ROUTE A RUN IS GIVEN. Not derived from the base's seed count, which is what
      # capped cellfix_B_new at 10,404 while rho = 1.0 wanted more (finished 9,999, buf_full).
      # A sweep pushes a knob until something stops it; if the array stops it, the sweep measured
      # the array. Cost is ~22 MB of recorded trajectory per 1,000 cells of cap, so 100,000 is
      # ~2.2 GB per run against an A6000's 49 GB. There is always a ceiling -- this one is set by
      # memory rather than by an accident of how many cells the base happened to start with.
      sweep_cells: 100000

  # ---- forecast: BEFORE the jobs, or it is not a forecast --------------------------
  # Cedric, 13 August: "the prediction from the specs, is it a new agent take the specs, the
  # knowledge and produce the same 3-4 sentences, max word limit."
  #
  # `planned` is the list `launch` is about to submit, emitted early so the Forecaster can fan out
  # over it -- the engine keys a fan-out by its item, and a spec is a dict, so the names have to
  # exist as their own list before the jobs do.
  - id: planned
    code: round.planned
    in: [specs]

  # NOT GIVEN THE METRICS, THE RUN, OR THE EYE. It fills crew/description.md's six slots from the
  # spec and what the campaign believes, and that is the whole input. See crew/forecaster.md.
  - id: forecaster
    agent: forecaster
    in: [specs, history, claim_ledger]
    each: planned
    out: forecast

  # `forecast` IN THE LAUNCHER'S `in:` IS LOAD-BEARING AND IS NOT A DATA DEPENDENCY. `launch` does
  # not read it. It is here so the topological sort cannot start a job until every forecast has been
  # written -- because a forecast filed after the run is a postdiction, and the two are identical on
  # disk. Deleting this one word would silently convert every foresight score in the campaign into a
  # measurement of nothing, and the round would still complete and still print a number.
  - id: launch
    code: round.launch
    in: [specs, forecast]
    out: names

  - id: measure
    code: round.measure_all
    in: [names]
    out: metrics

  - id: control
    code: round.control_of
    in: [specs, metrics]

  - id: score
    code: round.score
    in: [specs, metrics]
    out: predictions

  # The premise verdicts and null results as TEXT, never as a refusal.
  - id: observations
    code: round.observations_of
    in: [metrics]

  - id: morphology
    code: round.morphology_of
    in: [metrics]

  # ---- observe: one call per run -------------------------------------------------
  # The only role that looks at the picture. It disagreed with both the metric and the text roles on
  # 2 of 10 runs last round, and it is the cheapest node here at 3.7% of the budget.
  # BLIND SINCE 13 AUGUST. `metrics` is still in its `in:` and no metric reaches the prompt: the
  # module builds the SCALE BAR note from `camera_lbox`, which lives in that bundle, and without it
  # the eye cannot tell a 2,000-cell sphere from a 53,000-cell one because the camera box is chosen
  # per run. The box is a property of the picture; the rest of the bundle is the answer, and
  # crew/eye.py says why it is no longer shown.
  - id: eye
    agent: eye
    in: [metrics]
    each: names
    out: observed

  # ---- review: one call over the batch -------------------------------------------
  # THE SWEEPS AS SWEEPS. Without this the Analyst gets eight anonymous rows in `metrics` and
  # nothing saying they are one knob at eight values -- and `score` skips them, correctly, because
  # a sweep makes no prediction. So the one thing a sweep produces, a response curve, was the one
  # thing nothing assembled. Cedric asked whether the memory file collected Route A properly; it
  # did not, and this is why.
  - id: route_a_results
    code: round.route_a_results
    in: [specs, metrics]

  - id: analyst
    agent: analyst
    in: [control, metrics, predictions, observations, observed, history, user_input,
         route_a_results, claim_ledger, track_record, trends, inert, occupancy]

  - id: grounder
    agent: grounder
    in: [metrics, morphology, observed]

  # ---- the record is written by the engine, never by an agent ---------------------
  # `writes:` is how a node declares itself TERMINAL -- it produces files, not data the graph needs.
  # Without it the load check refuses this node, which is exactly right: on the flow's first load it
  # said "'record' emits 'record' and NO node consumes it", and the honest answer is that its output
  # is a file rather than an edge. A terminal node has to say so, otherwise the check would have to
  # stay silent about every genuine dead end and would catch nothing.
  # ---- THE ACTS BECOME EVIDENCE --------------------------------------------------
  # This is the node that closes the loop the epistemic audit found open. Route B could pose
  # experiments and the Analyst could write prose, and nothing carried the OUTCOME of an experiment
  # back onto the knowledge it was performed against -- so eleven laws accumulated with no
  # provenance and two contradictory ones coexisted for six rounds.
  #
  # It consumes `analyst`, which nothing consumed before: the role's own output was written to a
  # file and dropped. Its `induce` block is now read from it, which is also what makes the edge
  # real rather than declared.
  - id: claims_update
    code: round.claims_update
    in: [specs, predictions, analyst]
    writes: campaign/claims.jsonl + campaign/knowledge.md

  # ---- the score on the KNOWLEDGE, which nothing consumes -------------------------
  # Terminal on purpose. Cedric, 13 August: "the discrepancies between prediction and eye should not
  # govern the loop, because the eye might be wrong, and the knowledge too limited for the
  # forecaster. I see it more like a score for the knowledge building." No `in:` in this file names
  # `foresight`, and that absence is the design -- a thermometer, not a thermostat.
  - id: foresight
    code: round.foresight
    in: [forecast, observed]
    writes: campaign/foresight.jsonl

  - id: record
    code: round.record_all
    in: [specs, metrics, predictions]
    writes: campaign/records.jsonl
