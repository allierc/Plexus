# The round, as a graph. Cedric, 5 August: "what about a graph provided to the round with agents
# and information flow so that it is blind ... that would be easy to modify, easy to understand
# instead of hardcoding?"
#
# THIS FILE IS THE MULTI-AGENT DESIGN. Not a diagram of it -- the thing itself. The round loads it,
# checks it, sorts it and runs it, and holds no opinion about what any node is for.
#
# WHY A GRAPH RATHER THAN THE THREE HARD-CODED STAGES IT REPLACES. The defect this campaign hit at
# least six times is A PRODUCER WITH NO CONSUMER: something computed, written to disk, and never
# handed to the role that needed it. `steer` never reached the Proposer. The premise diagnosis was
# spent on a refusal. `sat` was set in two places and emitted in none. The eye disagreed with the
# Reader on 2 of 10 runs and nothing compared them. Every one of those was found by hand, weeks
# later. As a graph it is arithmetic: a node that emits something no `in:` names is unreachable, and
# `engine.load_flow()` says so at load time, before a GPU or a token is spent.
#
#   id      the node's name, and the default name of what it emits
#   code    a function in round.py, called as fn(ctx) -> value
#   agent   a module in crew/, run as its ROLE says
#   in      what it is given. Every name must be emitted by some node, or the flow is refused
#   out     what it emits, if not its own id. Omit for a terminal node that only writes files
#   each    fan out: run once per item of the named list, not once for the batch
#   writes  the files this node produces. Declaring it marks the node TERMINAL, so the
#           producer-with-no-consumer check accepts that nothing reads its return value
#   args    values merged into the context for that node only -- how a campaign decision is
#           declared here rather than hard-coded in round.py
#
# TO CHANGE THE LOOP, EDIT THIS FILE. Dropping the eye is deleting four lines. Adding a fifth role
# is adding four, plus its .py and .md. Neither touches round.py -- which is the test the design
# has to pass, because the eleven roles Phase 12 removes were each ADDED by editing the engine.

# WHICH PREMISES THIS CAMPAIGN HOLDS ITSELF TO. Not a node the round executes -- `biologist.py`
# reads it directly, on the cluster as well as here -- but the same kind of declaration as
# `parents.pool` and `route_a.plan`, so it is written here with its reason rather than compiled
# into a list in the code. Add an id to retire a premise; delete the line to bring it back. The
# check itself stays in biologist.py either way, because "we tried this and it fired on
# everything" is a finding about the campaign, and deleting the code deletes the finding.
premises:
  retired:
    # Cedric, 8 August: "delete premise 3 5 and 7, they are too strong. I keep P1 and P11,
    # there are sound gate keepers." Measured over rounds 1-4 of this campaign:
    P3:  >-
      refused FOUR route A slots in round 3 before the GPU, because the vth_frac grid and the
      factor grid cross each other on coral_gate_div. The relation is real; as a veto it spent
      a quarter of a round saying so.
    P3b: >-
      fires whenever cells divide faster than they grow -- v_cell 0.083 at factor 1.5, 0.163
      at 2.0 -- which is the regime the campaign is trying to characterise, not an error in it.
    P5:  >-
      a statement about the frame clock, settled once when dt was removed from the growth
      operators. Nothing since round 1 has been able to break it.
    P5b: >-
      broke in the CONTROL itself (residual force 1.38 -> 3.25 at a fixed 2000 cells). It says
      relax_iters is constant while the tissue grows, which is true, is about the solver, and
      is not something a spec edit can answer.
    P7:  >-
      broke on ALL 15 valid runs of round 3 and on every dividing rung of round 1. A check that
      fails on everything separates nothing.

nodes:

  # ---- what the round starts from ------------------------------------------------
  # WHERE ROUND 1 STARTS. Nothing in the first version of this flow said, so on a fresh campaign the
  # parent set was empty and nothing could be built -- a missing node, found by trying to launch.
  # These are Cedric's choices, each with a spec and a measured diag.json on disk. After round 1 the
  # campaign's own records supersede them.
  - id: parents
    code: round.parents
    args:
      # HOW MANY to build from, and what counts as FORCED. The second is a judgement about
      # evidence -- a composition carrying `rd_interface_tension.K_extrude > 0` is paid to have a
      # protrusion -- so it is a campaign decision, not arithmetic.
      limit: 6
      forced_p_ratio: 2.0
      forcing_terms: {rd_interface_tension: K_extrude}
      # EVERY ENTRY REBUILDS AND ADMITS. Checked by `round.py --check`, because the first version of
      # this pool did not: two of its six entries were inadmissible and it took a live Proposer call
      # to find out. All were measured, not remembered -- metrics come from each run's own diag.json.
      pool:
        # RE-BASED 8 AUGUST ONTO THE GENERATED BASIS -- `discovery_okuda/make_basis.py`. Cedric:
        # "put the current 12 folders of log/okuda into archive, you write a new set of 12 specs...
        # to form a sound basis for the agentic loop. Route A can pull from this basis, not limited
        # to two specs."
        #
        # WHAT WENT, AND WHY IT WAS NOT A BASIS. Sixteen folders accumulated over four phases: six
        # different frame counts (201/301/401/501/801/901), `grip_peak` absent from all sixteen
        # because they predate the metric registry the campaign scores on, one folder with no spec
        # at all, and one (`repair_l_th_frac`, act_cv 4.97) whose number came from the `mode: tip`
        # artifact. Three were in this pool and exactly TWO could be a Route A base. A basis has to
        # let you compare its members to each other; those could not be compared to each other, nor
        # to a 900-frame campaign run. They are in log/okuda/_superseded_pre_basis/.
        #
        # WHAT REPLACED IT IS A GRID, NOT A COLLECTION -- 3 chemistry x 2 material x 2 mechanics,
        # generated so that every value NOT on an axis is written once and shared by all twelve.
        # The diff between any two members is exactly the axes that separate them, which is what
        # makes "Route A pulls from the basis" mean "choose an axis to move" rather than "pick a
        # folder". Twelve bases also means the per-base share in `route_a.slots` must ROTATE rather
        # than divide -- see that node.
        #
        #   chemistry   none | gray-scott | gierer-meinhardt
        #   material    static (divide, no growth) | uniform (gate open) | gated (Hill on activator)
        #   mechanics   plain | shaping (K_bend + K_lumen + rd_interface_tension.K_purse)
        #
        # THE MECHANICS COLUMN IS THE ONE THAT WAS UNREACHABLE. `coral_gate_div` ran
        # `shape_energy_3d model: monolayer`, whose parameter list contains no K_bend and no
        # K_lumen -- so the three terms that can neck a lobe into a finger were not merely missing
        # from its spec, they were INEXPRESSIBLE in its model, and no edit the Proposer could write
        # would have reached them. All twelve carry them explicitly; four carry K_purse with
        # K_extrude at zero, which is the sound half of the forcing operator on its own.
        - b_none_static_plain      # divide, no growth, no chemistry -- the substrate null
        - b_none_static_shaping
        - b_none_uniform_plain     # grows without patterning (what cellfix_B_new was for)
        - b_none_uniform_shaping
        - b_gs_uniform_plain
        - b_gs_uniform_shaping
        - b_gs_gated_plain         # the campaign's own question: pattern gating growth
        - b_gs_gated_shaping
        - b_gm_uniform_plain
        - b_gm_uniform_shaping
        - b_gm_gated_plain
        - b_gm_gated_shaping
      #
      # DROPPED, each for a measured reason:
      #
      #   coral_gate / coral_gate_div   the campaign's parents through round 5, on `monolayer`
      #                         mechanics that cannot express the bending and lumen terms. Their
      #                         measured evidence is not discarded -- the rho ladder (cells
      #                         4.0k -> 14.2k, grip peaking at rho 1.0) and the flat vth_frac
      #                         ladder are in campaign/knowledge.md -- but a base whose mechanics
      #                         model forecloses half the search cannot lead the next campaign.
      #   refute_coral_nocons   its growth ceiling vth_frac=1.4 sits BELOW the division trigger
      #                         factor=2.0, so volume-triggered division is arithmetically
      #                         impossible. All FOUR of its children in round 1 died in under a
      #                         minute, the control among them.
      #   wk_pressure_pos_s0    passes every premise, but has no measurable chemistry-shape
      #                         coupling (corr_act_rad absent), so it cannot speak to the open
      #                         question.

  - id: history
    code: round.history

  - id: metric_bank
    code: round.metric_bank

  - id: menu
    code: round.menu
    in: [parents]
    args:
      # HOW THE MENU IS BUILT is a campaign decision, not an implementation detail.
      limit: 40          # rows offered per parent
      grid: [0.5, 2.0]   # the factors of the parent's OWN value a set_param row offers
      closure: 4         # distinct values RUN before a knob is withheld as closed

  # A CHILD THAT BROKE A PREMISE ITS PARENT HOLDS differs from it in a small enumerable set of ways,
  # so each difference is a hypothesis and reverting exactly one is a legal one-edit experiment.
  # Round 2 had both halves on disk and nothing joined them. This edge is that join.
  - id: diagnosis
    code: round.diagnosis
    in: [parents]

  # WHAT THE CAMPAIGN HAS NOT TRIED. proposer.md says "cover the map"; nothing told it what was
  # uncovered, and the measured cost was a round where eight of eleven slots came off one parent while
  # two of thirteen operators could not be reached at all. In the control loop this is unnecessary --
  # its hand-maintained sweep table IS the coverage -- so here it is derived once a round.
  - id: coverage
    code: round.coverage
    in: [parents]

  # ---- propose -------------------------------------------------------------------
  # WHAT LAST ROUND PROPOSED AND COULD NOT RUN. Cedric, 6 August, reading three red `set_impl`
  # lines: "does it get the message to rectify if necessary next round?" It did not. Refusals were
  # printed to a terminal and lost, so the Proposer could re-propose the same dead edit forever
  # with nothing to tell it otherwise -- and once lost twelve slots across two rounds while being
  # told none of it. This is the sixth producer-with-no-consumer, and the one this graph could not
  # catch, because a refusal was never a node. Now it is.
  # THE HUMAN'S CHANNEL. `campaign/user_input.md` has been protected from every reset since before
  # Phase 12 -- "it is the human-in-the-loop channel" -- and has reached no role since Phase 12
  # deleted the agent that read it. A consumer with no producer, which this graph exists to catch
  # and could not, because it was never a node. Read at the top of EVERY round, so an instruction
  # written mid-campaign lands on the next round without a relaunch.
  - id: user_input
    code: round.user_input

  - id: refusals
    code: round.refusals

  - id: proposer
    agent: proposer
    in: [parents, menu, metric_bank, coverage, diagnosis, history, refusals, user_input]
    out: edits

  # ---- build, launch, measure ----------------------------------------------------
  # ---- Route A: what VALUE makes a mechanism work ---------------------------------
  # Cedric, 7 August: "fix 16 jobs per run, 8 for route A 8 for route B", and "route A should be
  # parents of route B too". Route B chooses WHICH mechanism; A sweeps one knob on a known-good
  # recipe to closure. 25 rounds of B alone produced 214 dead spheres of 273, because the setting
  # that makes division real -- `rho` -- had never been swept by anyone. A's runs are recorded
  # like any other, so `parents` picks them up and B builds its next mechanism on them.
  - id: route_a
    code: round.route_a
    args:
      # THE SWEEP PLAN IS A CAMPAIGN DECISION, so it is declared here rather than in round.py --
      # the same reason `parents.pool` is. Each entry is [base, operator, knob, values]; the node
      # takes the next one with values still unrun and stops at `slots`. Order matters and is
      # deliberate: DIVISION FIRST, because nothing downstream means anything until the tissue
      # actually gains material. A knob run at every value here is CLOSED and never offered again.
      #
      # Why these two bases: cellfix_B_new divides cleanly (x22.7 volume) and has NO pattern
      # (act_cv 0.000); coral_gate_div has the pattern (act_cv 2.2) and its cells SHRINK as they
      # divide (v_cell 0.17). One grows without patterning, one patterns without growing. Route A
      # exists to find the setting where both happen, and hand it to Route B as a parent.
      slots: 8
      plan:
        - [cellfix_B_new,  grow_3d, rho,      [0.0, 0.1, 0.3, 1.0, 2.0]]
        # rho 0.0 is DROPPED for coral_gate_div and kept for cellfix_B_new, and the difference is
        # the gate. With the activator gate connected, rho = 0 is the infinite tip-to-body ratio
        # premise P2 refuses BEFORE the GPU ("if the gate is connected at all, then rho > 0") --
        # r001_13 died on exactly that. A refused run records no metrics, so the closure counter
        # never sees the value and route_a would re-propose it every round for the whole campaign.
        # cellfix_B_new runs a_sw = 50, so its gate is off, P2 reads `na`, and rho = 0 is a legal
        # measurement there (200 cells, no growth) rather than a pathology.
        - [coral_gate_div, grow_3d, rho,      [0.1, 0.3, 1.0, 2.0]]
        # vth_frac AND factor ARE COUPLED: volume-triggered division needs the growth ceiling
        # ABOVE the division trigger, or a cell can never reach the size that divides it. That is
        # the `refute_coral_nocons` relation documented under `parents` -- and sweeping either knob
        # alone walks straight across it. Round r003 lost FOUR slots to exactly this:
        # vth_frac 1.4 and 2.0 sit at or below factor 2.0, and factor 3.0 and 4.0 sit above
        # vth_frac 2.5. The premise refused all four before the GPU, correctly, and a refused run
        # records no metrics -- so closure never advances and route_a would re-propose them every
        # round for the rest of the campaign. Each grid now stays on its own side of the other
        # knob's value on this base (vth_frac 2.5, factor 2.0).
        # The grids may span the whole interesting range again: `route_a` now asks the STATIC
        # premises about each point before offering it, so a value that crosses the
        # vth_frac > factor constraint is dropped in milliseconds rather than discovered on the
        # cluster. Narrowing them by hand fixed one crossing and would not have seen the next.
        - [coral_gate_div, grow_3d, vth_frac, [2.2, 2.5, 3.0, 3.5, 4.5]]
        - [coral_gate_div, divide_3d,           factor,   [1.2, 1.5, 1.8, 2.0]]
        - [coral_gate_div, grow_3d, a_sw,     [0.05, 0.15, 0.35, 0.8]]
        - [coral_gate_div, grow_3d, hill,     [2.0, 4.0, 8.0, 16.0]]
        - [coral_gate_div, grow_3d, rate,     [0.000433, 0.001732, 0.006928, 0.02]]
        - [coral_gate_div, shape_to_chem,       beta,     [-4.0, -2.0, 0.0, 2.0, 4.0]]
        - [coral_gate_div, shape_to_chem,       F0,       [0.03, 0.055, 0.09, 0.11]]

  - id: build
    code: round.build_all
    in: [edits, parents, route_a]
    out: specs
    args:
      # Cedric, 7 August: "fix 16 jobs per run, 8 for route A 8 for route B" -- and 6 August:
      # "the one-edit-per-slot rule is too rigid, allows 4". Both were decisions made in
      # conversation and both were hard-coded here; this is where they belong.
      slots: 16
      frames: 900
      max_edits: 4
      # THE CELL CAP A ROUTE A RUN IS GIVEN. Not derived from the base's seed count, which is what
      # capped cellfix_B_new at 10,404 while rho = 1.0 wanted more (finished 9,999, buf_full).
      # A sweep pushes a knob until something stops it; if the array stops it, the sweep measured
      # the array. Cost is ~22 MB of recorded trajectory per 1,000 cells of cap, so 100,000 is
      # ~2.2 GB per run against an A6000's 49 GB. There is always a ceiling -- this one is set by
      # memory rather than by an accident of how many cells the base happened to start with.
      sweep_cells: 100000

  - id: launch
    code: round.launch
    in: [specs]
    out: names

  - id: measure
    code: round.measure_all
    in: [names]
    out: metrics

  - id: control
    code: round.control_of
    in: [specs, metrics]

  - id: score
    code: round.score
    in: [specs, metrics]
    out: predictions

  # The premise verdicts and null results as TEXT, never as a refusal.
  - id: observations
    code: round.observations_of
    in: [metrics]

  - id: morphology
    code: round.morphology_of
    in: [metrics]

  # ---- observe: one call per run -------------------------------------------------
  # The only role that looks at the picture. It disagreed with both the metric and the text roles on
  # 2 of 10 runs last round, and it is the cheapest node here at 3.7% of the budget.
  - id: eye
    agent: eye
    in: [metrics]
    each: names
    out: observed

  # ---- review: one call over the batch -------------------------------------------
  # THE SWEEPS AS SWEEPS. Without this the Analyst gets eight anonymous rows in `metrics` and
  # nothing saying they are one knob at eight values -- and `score` skips them, correctly, because
  # a sweep makes no prediction. So the one thing a sweep produces, a response curve, was the one
  # thing nothing assembled. Cedric asked whether the memory file collected Route A properly; it
  # did not, and this is why.
  - id: route_a_results
    code: round.route_a_results
    in: [specs, metrics]

  - id: analyst
    agent: analyst
    in: [control, metrics, predictions, observations, observed, history, user_input,
         route_a_results]

  - id: grounder
    agent: grounder
    in: [metrics, morphology, observed]

  # ---- the record is written by the engine, never by an agent ---------------------
  # `writes:` is how a node declares itself TERMINAL -- it produces files, not data the graph needs.
  # Without it the load check refuses this node, which is exactly right: on the flow's first load it
  # said "'record' emits 'record' and NO node consumes it", and the honest answer is that its output
  # is a file rather than an edge. A terminal node has to say so, otherwise the check would have to
  # stay silent about every genuine dead end and would catch nothing.
  - id: record
    code: round.record_all
    in: [specs, metrics, predictions]
    writes: campaign/records.jsonl
