# THE BASIS, DECLARED RATHER THAN COMPILED IN
#
# Cedric, 10 August: "not hardcoded but specified through the md files if possible", and then
# "move it [brusselator] to a Route A question and spend those members on the gs protrusion grid".
#
# WHY THIS FILE EXISTS. The first round of the new campaign returned sixteen runs and every one
# classified `sphere`. That was not the portfolio failing and not Route A failing -- Route A was
# sweeping three distinct operators across six distinct ladders. It was the BASIS having no
# protrusion axis. `make_basis.py` pinned `HILL = 4.0` and `RHO_GATED = 0.1` for all sixteen
# members and varied chemistry, material and mechanics instead -- and those three axes are exactly
# the ones that produced no protrusion:
#
#     run        hill   rho    aspect_peak   n_tips
#     r001_03     8.0   0.10       4.914        2      <- the only member with a sharp gate
#     r001_04     4.0   0.20       6.804        1      <- the only member with a high baseline
#     the other 14 4.0  0.05-0.10  0.0-0.6      0-2
#
# Two parameters decided finger-versus-sphere, and the grid held both fixed. So they are axes here.
#
# WHERE THE MEMBERS GO. `grip_peak` measured 0.034-0.076 across every `gs` member and -0.003 to
# 0.003 across every `bru` and `gm` member -- two of the three chemistry columns do not couple
# chemistry to shape at all, so half the basis was spending its members on tissue that cannot
# answer the campaign's question. The `gs` column gets them instead.
#
# BRUSSELATOR IS NOW A QUESTION, NOT A COLUMN. Its `gamma` was set to 0.05 to stop it diverging at
# 0.3 -- a value chosen for STABILITY and never once for patterning -- so "brusselator is inert" is
# a claim about one untested number, not about a mechanism. One member survives to carry a Route A
# ladder on `gamma`, because `_build_sweep` refuses a base that does not exist: a mechanism enters
# this campaign through the basis or not at all.

shared:
  frames: 1800                 # == crew/flow.yaml build.frames, or a base is not comparable to
  seed_cells: 2000             # its own children -- ten members once ran at half their length
  cell_buf: 60000
  vert_buf: 120000
  world: 80.0
  growth_rate: 0.000866        # the rate every campaign run has used
  vth_frac: 2.5
  divide_factor: 2.0           # of v_ref, the seed-time median cell volume
  a_sw_gated: 0.35             # an ABSOLUTE value of the activator, not a fraction of its maximum.
                               #   This line said "a FRACTION of the activator's own maximum" and
                               #   the operator read it absolutely, so the gate's real position
                               #   drifted with each run's chemistry: 0.24 of the field on the
                               #   strongest of 154 runs and above all of it on 16. `a_sw_rel` on
                               #   grow_3d now makes the fraction reading available, and the
                               #   b_star_relgate member below is what measures which one fingers.
  a_sw_open: 0.0
  beta: 0.5                    # shape -> chemistry, the second arrow
  f0: 0.046
  k_purse: 1.0                 # interface_line_tension_3d, on the `shaping` half only

# The mechanics every member shares. `Lambda` is low deliberately: it charges for edge length, so a
# high value resists the neighbour exchange that both T1 and cell extrusion depend on.
mech:
  K_A: 1.0
  K_P: 1.0
  K_V: 20.0
  K_R: 0.0
  Lambda: 0.5
  Gamma: 0.4
  p0: 3.5
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12

shaping: {K_bend: 0.02, K_lumen: 0.5}     # zero in the `plain` half
rd:      {d_a: 0.08, d_h: 0.16, chi: 1.3}
gs:      {F: 0.046, kk: 0.062, rate: 1.0}
bru:     {gamma: 0.05, A: 1.0, B: 3.0}    # gamma is the Route A question, see the note above

# THE TWO LEVERS THAT MAKE A FINGER, and the whole reason for this file.
#   gate  -- grow_3d.hill, the sharpness of the growth switch. A sharp gate concentrates growth
#            where the activator is high instead of spreading it over the shoulder of the Hill
#            curve. Measured: hill 8 gave aspect 4.914 with two tips where hill 4 gave 0.000 on
#            an otherwise identical composition.
#   drive -- grow_3d.rho, the baseline every cell grows at, so the tip:body ratio is
#            (rho + 1):rho. Measured: rho 0.20 gave aspect 6.804 against 0.000-0.6 at 0.05-0.10.
levers:
  gate:  {soft: 4.0, sharp: 8.0}
  drive: {lo: 0.1, hi: 0.2}

members:
  # --- the null. Division WITHOUT growth: cells subdivide and the body adds nothing. Every growth
  #     claim is read against these, and they are the only members that cannot saturate.
  - {name: b_null_plain,          chem: none, mat: static, mech: plain}
  - {name: b_null_shaping,        chem: none, mat: static, mech: shaping}

  # --- THE GS PROTRUSION GRID: 2 mechanics x 2 gates x 2 drives. This is where the members went.
  #     Every member differs from a neighbour in exactly one axis, and the grid spans the range
  #     that produced aspect 0 -> 6.8 in round 1 instead of pinning it at one corner.
  - {name: b_gs_plain_soft_lo,    chem: gs, mat: gated, mech: plain,   gate: soft,  drive: lo}
  - {name: b_gs_plain_soft_hi,    chem: gs, mat: gated, mech: plain,   gate: soft,  drive: hi}
  - {name: b_gs_plain_sharp_lo,   chem: gs, mat: gated, mech: plain,   gate: sharp, drive: lo}
  - {name: b_gs_plain_sharp_hi,   chem: gs, mat: gated, mech: plain,   gate: sharp, drive: hi}
  - {name: b_gs_shaping_soft_lo,  chem: gs, mat: gated, mech: shaping, gate: soft,  drive: lo}
  - {name: b_gs_shaping_soft_hi,  chem: gs, mat: gated, mech: shaping, gate: soft,  drive: hi}
  - {name: b_gs_shaping_sharp_lo, chem: gs, mat: gated, mech: shaping, gate: sharp, drive: lo}
  - {name: b_gs_shaping_sharp_hi, chem: gs, mat: gated, mech: shaping, gate: sharp, drive: hi}

  # --- DEATH, on the two corners of the grid that differ most, so the death ladders are read
  #     against a sphere and against a finger rather than against one arbitrary parent.
  - {name: b_gs_plain_soft_lo_death,    chem: gs, mat: gated, mech: plain,   gate: soft,  drive: lo, death: true}
  - {name: b_gs_shaping_sharp_hi_death, chem: gs, mat: gated, mech: shaping, gate: sharp, drive: hi, death: true}

  # --- THE STAR, and everything bred from it. r013_05 is the only specimen in 196 runs with ARMS
  #     rather than lobes: 11 tubes, reduced_volume 0.285 (deepest on file, 1.0 being a sphere),
  #     grip 0.273 and invagination 0.617 (both campaign records), activator at the tips 7.4x the
  #     cell mean. It reached that as a Route B leaf two edits from b_gs_shaping_soft_lo, and a
  #     leaf is a dead end here: `_build_sweep` refuses a base that is not in the basis, so no
  #     ladder has ever been run on the one composition that makes the shape the campaign wants.
  #
  #     THE MECHANISM, so the members below are variations on a claim and not on a lucky number:
  #     K_V 80 makes a cell nearly incompressible, so growth cannot be absorbed by inflating one
  #     cell and has to buckle the sheet; rate 0.5 halves the reaction so the spots stay far apart
  #     (spacing 4.04 cells, 75 spots) and each one gets its own arm rather than merging into a
  #     lobe. Both values sit outside the vocabulary box, which is a fact about the box.
  - {name: b_star,           chem: gs, mat: gated, mech: shaping, gate: soft,  drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.5}}
  - {name: b_star_sharp,     chem: gs, mat: gated, mech: shaping, gate: sharp, drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.5}}
  - {name: b_star_death,     chem: gs, mat: gated, mech: shaping, gate: soft,  drive: lo, death: true,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.5}}

  # --- ORIENTED DIVISION, on the star. A named Okuda mechanism that has run ZERO times in 282
  #     specs: every one carries `orient_iface: false`. Hertwig's rule splits a cell across its own
  #     long axis, which makes compact daughters and therefore a lobe; orienting the septum along
  #     the bud axis stacks daughters ALONG the arm, which is how an arm becomes a tube. Its
  #     per-cell gate was reading an absolute threshold against a relative axis until 11 August, so
  #     this is also the first run of the operator as written.
  - {name: b_star_oriented,  chem: gs, mat: gated, mech: shaping, gate: soft,  drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.5,
           divide_3d.orient_iface: true, divide_3d.orient_asw: 0.6}}

  # --- THE SECOND ARROW, on the three features it has never read. `shape_to_chem` has run
  #     `curvature` in all 275 specs and tension, apical_area and pressure in none, though all four
  #     are implemented and each standardises its own feature so `beta` means the same thing in all
  #     four. They are different biology: curvature is "the shape I already made", tension is
  #     YAP/TAZ and Piezo1, pressure is compression. A tissue that patterns where it is STRETCHED
  #     and one that patterns where it is BENT do not make the same object.
  - {name: b_star_tension,   chem: gs, mat: gated, mech: shaping, gate: soft,  drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.5, shape_to_chem.model: tension}}
  - {name: b_star_pressure,  chem: gs, mat: gated, mech: shaping, gate: soft,  drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.5, shape_to_chem.model: pressure}}
  # beta < 0 is the operator's own stated hypothesis -- "the sign is a real hypothesis, not a
  # convention, and both must be swept" -- and only the positive sign has ever run. Pattern AVOIDS
  # the deformation: spots settle in the dimples instead of on the bulges, so the tissue should
  # invaginate where it patterns rather than protrude.
  - {name: b_star_avoid,     chem: gs, mat: gated, mech: shaping, gate: soft,  drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.5, shape_to_chem.beta: -0.5}}

  # --- THE GATE ITSELF, as a fraction of the field rather than a value of it. See `a_sw_gated`
  #     above: this is the member that decides which reading makes a finger, instead of the
  #     question being settled by a comment.
  - {name: b_star_relgate,   chem: gs, mat: gated, mech: shaping, gate: soft,  drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.5, grow_3d.a_sw_rel: true}}

  # --- MULTI-TUBE SEEDING. Okuda's Fig 5 starts from N fixed radial activator cones, not from
  #     scattered noise; `mode: cones` implements exactly that and has run 3 times in 308 specs,
  #     none of them in this campaign. Six cones is six places an arm can start, chosen rather
  #     than emergent -- which makes "how many tubes" a controlled variable for the first time.
  - {name: b_star_cones,     chem: gs, mat: gated, mech: shaping, gate: soft,  drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.5,
           seed_cell_rd.mode: cones, seed_cell_rd.n_spots: 6, seed_cell_rd.cone_deg: 8.0}}

  # --- THE FLOWER. Cedric, 12 August, on `r016_01`: *"amazing like a flower."* Five BROAD ROUNDED
  #     petals with red rims around a central crater -- and that is a different object from the
  #     star, not a better one. The star makes thin arms; this makes wide flat lobes, and it holds
  #     the campaign's deepest invagination (0.684) at 22,231 cells with only 2 tubes. Two
  #     morphologies from one lineage, separated by three chemistry numbers.
  #
  #     THE THREE EDITS FROM `b_star`, in the order the campaign found them: kk 0.031 (r014_04)
  #     moves Gray-Scott along Pearson's kill axis, rate 0.25 (r015_06) halves the reaction again
  #     on top of the star's own halving -- so the pattern is four times slower than the basis --
  #     and F0 0.023 (r016_01) halves the shape->chemistry feed. Slower chemistry against the same
  #     near-incompressible mechanics: the spots have time to broaden before the sheet buckles, so
  #     each one lifts a petal instead of pulling an arm.
  - {name: b_flower,          chem: gs, mat: gated, mech: shaping, gate: soft, drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.25, cell_react.kk: 0.031,
           shape_to_chem.F0: 0.023}}
  # THE THREE VARIANTS, one per operator family, each asking whether the flower is CONTROLLABLE
  # rather than whether it is better -- a shape you cannot steer is a specimen, not a mechanism.
  #   Die     does removing cells deepen the crater, or collapse the petals?
  #   Divide  oriented division turned nothing on the star (10 tubes against 9); on broad petals
  #           it has an axis to align to that thin arms did not give it.
  #   Seed    six cones gave the star exactly six arms. If it gives the flower six petals, petal
  #           number is a controlled variable and the flower is a mechanism.
  - {name: b_flower_death,    chem: gs, mat: gated, mech: shaping, gate: soft, drive: lo, death: true,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.25, cell_react.kk: 0.031,
           shape_to_chem.F0: 0.023}}
  - {name: b_flower_oriented, chem: gs, mat: gated, mech: shaping, gate: soft, drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.25, cell_react.kk: 0.031,
           shape_to_chem.F0: 0.023, divide_3d.orient_iface: true, divide_3d.orient_asw: 0.6}}
  - {name: b_flower_cones,    chem: gs, mat: gated, mech: shaping, gate: soft, drive: lo,
     set: {shape_energy_3d.K_V: 80.0, cell_react.rate: 0.25, cell_react.kk: 0.031,
           shape_to_chem.F0: 0.023, seed_cell_rd.mode: cones, seed_cell_rd.n_spots: 6,
           seed_cell_rd.cone_deg: 8.0}}

  # --- the brusselator QUESTION: one base, carrying the gamma ladder. Not a column.
  #     WITHDRAWN 10 August, un-run: it was still going at 80 minutes when the rest of the basis
  #     had finished, and was killed so the campaign could start. That is itself a measurement --
  #     brusselator at gamma 0.05 is far slower per frame than gray_scott -- but it is not the
  #     measurement the ladder wanted. Restore this line and the ladder below together; a base
  #     without its ladder is a member nothing asks a question of, and a ladder without its base
  #     is a refusal every round.
  # - {name: b_bru_question,      chem: bru, mat: gated, mech: shaping, gate: soft,  drive: lo}

death: {mode: competition, max_mark_frac: 0.005, min_age: 4, shrink_rate: 0.05, critical_frac: 0.15}
