general:
  name: round_40_mc8
  seed: 0
  n_frames: 350
  dt: 0.02
  record_cap: 352
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
sets:
  vertex:
    n: 30000
  cell:
    n: 16000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: load_mesh_3d
  at: vertex
  cell_set: cell
  ckpt: discovery_okuda/ops/archive/smoke_hom/ckpt.npz
  before_frame: 1
- op: cell_geometry
  at: cell
- op: cell_chem_seed
  at: cell
  mode: tip
  n_spots: 1
  amp: 2.0
  tip_radius: 1.2
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.01
  a_sw: 0.5
  hill: 4.0
  rho: 0.0
  vth_frac: 1.5
  after_frame: 20
  dt: 0.02
  conserve_amount: true
- op: cell_mechanics
  at: vertex
  p0: 3.9
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.05
  Lambda: 0.2
  K_V: 6.0
  K_R: 0.02
  K_bend: 0.0
  antiinv: 0.0
  mu: 1.0
  dt: 0.02
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: rd_interface_tension
  at: vertex
  cell_set: cell
  K_purse: 0.0
  K_extrude: 12.0
  a_sw: 0.5
  eta: 0.05
  iters: 4
  after_frame: 20
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: cell_divide
  at: vertex
  factor: 2.0
  reset_noise: 0.12
  cycle_cv: 0.4
  p0: 3.9
  every: 1
  max_div: 30
  max_div_frac: 0.0075
  vcap: 1.5
  cell_set: cell
  min_cycle: 32
  max_cycle: 1000000000
  after_frame: 20
  orient_iface: true
  orient_asw: 0.5
  g1_ramp: false
- op: topo_record
  at: vertex
  every: 1
schedule:
- load_mesh_3d
- cell_geometry
- cell_chem_seed
- cell_grow
- cell_mechanics
- rd_interface_tension
- edge_flip
- cell_divide
- topo_record
_discovery:
  comp_hash: C5e315998af4
  structure:
    operators:
    - id: cell_geometry_3d0
      op: cell_geometry
    - id: seed_cell_rd0
      op: cell_chem_seed
      impl: tip
    - id: divide_3d0
      op: cell_divide
      impl: orient_iface
    - id: extrude0
      op: extrude
    - id: grow_3d0
      op: cell_grow
      impl: hill_conserve_amount
    - id: reconnect_t1_3d0
      op: edge_flip
    - id: seed_mesh_3d0
      op: mesh_seed
    - id: shape_energy_3d0
      op: cell_mechanics
      impl: default
    connections:
    - src_op: cell_chem_seed
      dst_op: cell_divide
      slot: axis
    - src_op: cell_chem_seed
      dst_op: extrude
      slot: site
    - src_op: cell_chem_seed
      dst_op: cell_grow
      slot: gate
  region: driven + forced (round-33 recipe)
  defect_fixes:
  - D1 engine owns the clock (every=1)
  - D2 one global dt=0.02
  - D3 topo_snapshot every=1 == position stride
