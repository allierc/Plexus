general:
  name: cfl_c1p3_d0p5
  seed: 0
  n_frames: 300
  dt: 1.0
  record_cap: 302
  boundary: free
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
sets:
  vertex:
    n: 30000
  cell:
    n: 16000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: seed_mesh_3d
  at: vertex
  cell_set: cell
  n_cells: 2000
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  before_frame: 1
  vseed_cv: 0.15
- op: cell_geometry_3d
  at: cell
- op: cell_adjacency
  at: cell
- op: seed_cell_rd
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.06
- op: cell_diffuse
  at: cell
  d_a: 0.08
  d_h: 0.5
  chi: 1.3
- op: cell_react
  at: cell
  model: gray_scott
  F: 0.046
  kk: 0.062
  rate: 1.0
- op: shape_energy_3d
  at: vertex
  p0: 3.5
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.4
  Lambda: 3.0
  K_V: 2.0
  K_R: 0.4
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: reconnect_t1_3d
  at: vertex
  l_th_frac: 0.35
  every: 4
  max_flips: 30
  engine_clock: true
- op: topo_snapshot_3d
  at: vertex
  every: 1
schedule:
- seed_mesh_3d
- cell_geometry_3d
- cell_adjacency
- seed_cell_rd
- cell_diffuse
- cell_react
- shape_energy_3d
- reconnect_t1_3d
- topo_snapshot_3d
