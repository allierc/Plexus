general:
  name: ref_okuda_route
  seed: 0
  n_frames: 350
  dt: 0.02
  record_cap: 352
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
sets:
  vertex:
    n: 30000
  cell:
    n: 16000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: seed_mesh_3d
  at: vertex
  cell_set: cell
  before_frame: 1
  n_cells: 500
  vseed_cv: 0.15
- op: cell_geometry_3d
  at: cell
- op: cell_adjacency
  at: cell
- op: cell_diffuse
  at: cell
  d_a: 0.02
  d_h: 0.7
  chi: 4.0
- op: cell_react
  at: cell
  implementation: gierer_meinhardt
  rate: 1.0
  gm_rho: 1.0
  mu_a: 1.0
  mu_h: 1.0
  a0: 0.01
- op: morphogen_growth_3d
  at: vertex
  cell_set: cell
  rate: 0.01
  a_sw: 1.5
  hill: 4.0
  rho: 0.0
  vth_frac: 1.5
  after_frame: 100
  dt: 0.02
  conserve_amount: true
- op: shape_energy_3d
  implementation: monolayer
  at: vertex
  k_v: 6.0
  kappa_s: 0.2
  h0: 0.4
  gamma: 0.06
  mu: 1.0
  dt: 0.02
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: reconnect_t1_3d
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: divide_3d
  at: vertex
  factor: 2.0
  reset_noise: 0.12
  cycle_cv: 0.4
  p0: 3.9
  every: 1
  max_div: 30
  max_div_frac: 0.0075
  vcap: 1.5
  cell_set: cell
  min_cycle: 16
  max_cycle: 1000000000
  after_frame: 100
  orient_iface: false
  orient_asw: 1.0
  g1_ramp: false
- op: topo_snapshot_3d
  at: vertex
  every: 1
schedule:
- seed_mesh_3d
- cell_geometry_3d
- cell_adjacency
- cell_diffuse
- cell_react
- morphogen_growth_3d
- shape_energy_3d
- reconnect_t1_3d
- divide_3d
- topo_snapshot_3d
_discovery:
  comp_hash: Cd1076ff0d59
  structure:
    operators:
    - id: cell_adjacency0
      op: cell_adjacency
    - id: cell_diffuse0
      op: cell_diffuse
    - id: cell_geometry_3d0
      op: cell_geometry_3d
    - id: cell_react0
      op: cell_react
      impl: gierer_meinhardt
    - id: divide_3d0
      op: divide_3d
      impl: hertwig
    - id: morphogen_growth_3d0
      op: morphogen_growth_3d
      impl: hill_conserve_amount
    - id: reconnect_t1_3d0
      op: reconnect_t1_3d
    - id: seed_mesh_3d0
      op: seed_mesh_3d
    - id: shape_energy_3d0
      op: shape_energy_3d
      impl: monolayer
    connections:
    - src_op: cell_react
      dst_op: morphogen_growth_3d
      slot: gate
  region: growth-driven monolayer (Okuda route)
  defect_fixes:
  - D1 engine owns the clock (every=1)
  - D2 one global dt=0.02
  - D3 topo_snapshot every=1 == position stride
