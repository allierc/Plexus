general:
  name: zz_dt1_probe
  seed: 0
  n_frames: 60
  dt: 1.0
  record_cap: 62
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
_run:
  target_cells: 16000
  seed_cells: 2000
sets:
  vertex:
    n: 41604
  cell:
    n: 20804
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: load_mesh_3d
  at: vertex
  cell_set: cell
  ckpt: /groups/saalfeld/home/allierc/Graph/Plexus/log/okuda/zz_dt1_probe/ckpt_end.npz
  before_frame: 1
- op: cell_geometry
  at: cell
- op: cell_neighbours
  at: cell
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gierer_meinhardt
  rate: 1.0
  gm_rho: 1.0
  mu_a: 1.0
  mu_h: 1.0
  a0: 0.01
- op: cell_chem_from_shape
  at: cell
  model: curvature
  vertex_set: vertex
  beta: 0.0
  F0: 0.055
  rate: 1.0
- op: cell_mechanics
  model: monolayer
  at: vertex
  k_v: 6.0
  kappa_s: 0.2
  h0: 0.4
  gamma: 0.06
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: topo_record
  at: vertex
  every: 1
schedule:
- load_mesh_3d
- cell_geometry
- cell_neighbours
- cell_chem_diffuse
- cell_chem_react
- cell_chem_from_shape
- cell_mechanics
- edge_flip
- topo_record
_discovery:
  comp_hash: Cf4907ea516e
  structure:
    operators:
    - id: cell_adjacency0
      op: cell_neighbours
    - id: cell_diffuse0
      op: cell_chem_diffuse
      impl: graph_laplacian
    - id: cell_geometry_3d0
      op: cell_geometry
    - id: cell_react0
      op: cell_chem_react
      impl: gierer_meinhardt
    - id: divide_3d0
      op: cell_divide
      impl: hertwig
    - id: grow_3d0
      op: cell_grow
      impl: hill_conserve_amount
    - id: reconnect_t1_3d0
      op: edge_flip
    - id: seed_mesh_3d0
      op: mesh_seed
    - id: shape_energy_3d0
      op: cell_mechanics
      impl: monolayer
    - id: shape_to_chem0
      op: cell_chem_from_shape
      impl: curvature
    connections:
    - src_op: cell_chem_react
      dst_op: cell_grow
      slot: gate
  region: growth-driven monolayer (Okuda route)
  defect_fixes:
  - D1 engine owns the clock (every=1)
  - D2 one global dt=1.0
  - D3 topo_snapshot every=1 == position stride
