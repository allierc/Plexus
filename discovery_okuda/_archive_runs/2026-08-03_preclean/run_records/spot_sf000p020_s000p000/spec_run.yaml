general:
  name: spot_sf0p02
  seed: 0
  n_frames: 300
  dt: 1.0
  record_cap: 302
  boundary: free
  dim: 3
  world:
  - 50.0
  - 50.0
  - 50.0
sets:
  vertex:
    n: 30000
  cell:
    n: 16000
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
fields: {}
operators:
- op: mesh_seed
  at: vertex
  cell_set: cell
  n_cells: 2000
  radius: 5.0
  jitter: 0.18
  p0: 3.5
  seed: 0
  before_frame: 1
  vseed_cv: 0.15
- op: cell_geometry
  at: cell
- op: cell_neighbours
  at: cell
- op: cell_chem_seed
  at: cell
  seed: 0
  before_frame: 3
  mode: scatter
  seed_frac: 0.02
- op: cell_chem_diffuse
  at: cell
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gray_scott
  F: 0.046
  kk: 0.062
  rate: 1.0
- op: cell_mechanics
  at: vertex
  p0: 3.5
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.4
  Lambda: 3.0
  K_V: 2.0
  K_R: 0.4
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  l_th_frac: 0.35
  every: 4
  max_flips: 30
  engine_clock: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- mesh_seed
- cell_geometry
- cell_neighbours
- cell_chem_seed
- cell_chem_diffuse
- cell_chem_react
- cell_mechanics
- edge_flip
- topo_record
_discovery:
  comp_hash: MINI_coral_fixed
  region: Turing chemistry alone on a rigid 2000-cell ball
