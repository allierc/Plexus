id: pairwise_potential
order: 13
raw_name: PairwisePotential
raw_kind: potential (Potential)
code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L128
paper_section: p. 9, 'Mechanical interactions', eq. V_ij(r) (also fig. 1d; SI p. 14 'Mechanical Interactions')
summary: 'The abstract base for every soft-matter pair interaction. Given a subclass''s elementwise pair_energy(r,
  *params) and per-pair pair_params(state), it derives the cluster''s total interaction energy (dense
  N x N, half-summed over live non-self pairs so each unordered pair counts once), the per-cell forces
  (-grad of that energy w.r.t. position, by autodiff -- no jax-md), and the per-cell virial pressure.
  It touches NO state field of its own: it is a read-only energy/force/pressure provider that a moving
  step (relaxation / Brownian) or a stress step consumes. Couplings (epsilon, alpha, k, ...) resolve from
  a shared scalar or a per-cell field, symmetrised per pair by mix (the arithmetic mean); the contact
  distance uses a separate additive rule sigma = r_i + r_j so interactions stay size-consistent as cells
  grow.'
equations: "Given a subclass's pair energy U(r; p_1..p_k) and pair_params(state) -> (p_1..p_k), each an\n\
  (N,N) matrix broadcastable with r:\n\n  separation:    r_ij = safe_norm( displacement(pos_i, pos_j)\
  \ )         # (N,N); 0 on the i==i diagonal\n  total energy:  E    = 0.5 * sum_i sum_{j != i, alive_i\
  \ & alive_j} U(r_ij; p_ij)\n                        # neighbor_sum masks self & dead pairs; the 0.5\
  \ dedups the symmetric double count\n  forces:        F_i  = -dE / d(pos_i)                        \
  \          # jax.grad, inherited from Potential; NO jax-md force law\n  virial press.: p_i  = -(1 /\
  \ (2 d V_i)) * sum_{j != i, alive} r_ij * (dU/dr)(r_ij) * alive_i\n                        # Irving-Kirkwood\
  \ one-half bond split; d = n_space_dim;\n                        # V_i = 2 r_i (d=1) | pi r_i^2 (d=2)\
  \ | 4/3 pi r_i^3 (d=3); dead cell -> 0\n  coupling:      shared scalar c        -> broadcast_to (N,N)\n\
  \                 per-cell field spec f  -> mix( state.f )\n  mix (default): M_ij = 0.5 (v_i + v_j)\
  \                                 # arithmetic mean: no sqrt -> finite grad at 0/dead cells\n\nConcrete\
  \ Morse (paper eq., p.9) -- the one instance the paper actually describes:\n  U(r) = eps * [ (1 - exp(-alpha\
  \ (r - sigma)))^2 - 1 ],   sigma = r_i + r_j\nIn code (Morse.pair_energy) this is additionally multiplied\
  \ by a sigma-relative smooth cutoff\nthat the paper's V_ij does not mention.\n"
params:
  (base class has no constructor fields): PairwisePotential is abstract -- it declares no eqx fields;
    all tunables live on the concrete subclasses (Morse.epsilon/alpha, SoftSphere.epsilon, Harmonic.k,
    ...). The three entries below are the mechanism's actual tunable surface.
  pair_energy: 'extension_point (method): the elementwise interaction-energy law U(r, *params) -> (N,N);
    abstract here (raises NotImplementedError). Sets the potential shape (repulsive core / adhesive tail).'
  pair_params: 'extension_point (method): builds the per-pair (N,N) parameter matrices from state (e.g.
    sigma = r_i + r_j, epsilon, alpha); abstract here. Where a coupling becomes size-consistent.'
  mix: 'pair_combination_rule: turns a per-cell coupling v (N,) into a symmetric per-pair coupling 0.5(v_i
    + v_j); default arithmetic mean, overridable (e.g. geometric mean / Lorentz-Berthelot).'
  coupling (epsilon/alpha/k/...): 'interaction_coupling: each subclass coupling is EITHER a shared scalar
    (broadcast to every pair) OR a per-cell StateFieldSpec of shape () read from state and mixed per pair;
    per-type or per-cell ARRAYS are rejected by __check_init__.'
state_io:
  reads:
  - position
  - alive
  - radius
  - displacement
  - n_space_dim
  - <coupling field>
  writes: []
surprises:
- 'SOURCE vs PAPER: the paper (Methods, p. 9, line 498) says ''JAX-MD was used to perform molecular dynamics
  simulations for cell mechanics'', but the source computes forces by autodiff of the energy with NO jax-md
  dependency (module docstring: ''forces come from autodiff of the energy, with no jax-md dependency'').
  SOURCE WINS -- a reimplementer trusting the paper would pull in jax-md and a hand-coded force law this
  code deliberately avoids.'
- 'The 0.5 in total_energy is a DOUBLE-COUNT dedup, not a bond split: neighbor_sum already sums every
  ordered (i,j) with j!=i, and U is symmetric, so each unordered pair appears twice; the 0.5 corrects
  it. Drop it and you double both energy AND force.'
- 'virial_pressure''s factor of 2 is a DIFFERENT 1/2: it is the Irving-Kirkwood one-half bond split (each
  pair''s virial shared between its two cells), NOT the total_energy double-count dedup (there neighbor_sum
  already gives cell i its full per-cell virial). Conflating the two halves is easy and wrong.'
- mix is the ARITHMETIC mean 0.5(v_i+v_j), not the geometric / Lorentz-Berthelot mean standard in MD.
  Chosen for a finite gradient everywhere (no sqrt at zero / dead cells under the always-on jax_debug_nans).
  The additive contact rule sigma = r_i + r_j is a SEPARATE convention the subclasses apply in pair_params,
  not routed through mix.
- Couplings are restricted to a shared scalar OR a per-cell scalar StateFieldSpec; per-TYPE and per-cell
  ARRAYS are rejected at construction (__check_init__). So heterotypic adhesion (the paper's type x type
  'cadherin' matrix, p. 20) cannot be an arbitrary type-type interaction matrix here -- it must be encoded
  as a per-cell scalar field, and every pair coupling is then forced to be the MEAN of two per-cell values.
  A real expressiveness limit vs the paper's differential-adhesion story.
- pair_energy is evaluated on the i==i diagonal (r=0 via safe_norm) and on dead-dead padded pairs even
  though neighbor_sum masks them out of the SUM -- and jax.grad still flows through those masked entries.
  So every subclass MUST be value- AND gradient-safe at r=0 (LJ uses safe_divide(sigma, r); the compact
  repulsions use a double-where). A naive 1/r would NaN under debug_nans despite the mask.
- forces() lives on the Potential base (line 84), so PairwisePotential inherits force = -jax.grad(total_energy).
  Any custom energy (not just pairwise) can subclass Potential directly and get forces for free; NoForce
  (line 108) overrides forces to zeros to skip the O(N^2) autodiff entirely.
verdict: alias
of: attraction_repulsion
implementation_of: attraction_repulsion
why: 'ALIAS of `attraction_repulsion`. PairwisePotential is the ABSTRACT base for the paper''s

  soft-matter pair interactions -- not itself a force law (its pair_energy raises

  NotImplementedError) but the shared machinery every concrete pair potential inherits. It turns

  a subclass''s conservative pair energy U(r; p) into (i) the cluster total interaction energy

  (dense N x N, half-summed over live non-self pairs so each unordered pair counts once) and (ii)

  per-cell forces F_i = -grad_i E by autodiff. That is exactly attraction_repulsion''s biology: a

  pairwise radial cell-cell interaction -- a repulsive core (excluded volume) with an optional

  adhesive tail (cell-cell adhesion) -- whose force is the gradient of a conservative radial

  potential. attraction_repulsion hand-codes its two-Gaussian force f(r)*(pos_j - pos_i);

  PairwisePotential writes the energy and autodiffs it. Same contract, two realizations of the

  one conservative radial pair force.


  The concrete members -- Morse (order 14), SoftSphere (15), Hertzian (16), Harmonic,

  LennardJones -- are interchangeable force-law SHAPES over this one contract; each concrete

  subclass is implementation_of: attraction_repulsion (Morse carries BOTH terms and is the

  canonical member; SoftSphere / Hertzian are the purely-repulsive limit). This

  several-implementations-per-contract pattern is the GOOD result the registry exists to hold,

  not a missed contract. Morse''s own entry already records this reading and cites this parent.


  NOT `refinement`: no field of attraction_repulsion''s signature is FORCED to change. (1)

  energy -> autodiff-force versus a hand-coded force is an implementation STRATEGY, not a

  contract -- stillinger_weber is itself an energy-defined interaction in this same

  lateral/interaction family, so "write an energy and differentiate it" does not by itself mint

  or widen a contract. (2) The per-cell coupling reads (a shared scalar OR a per-cell scalar

  epsilon / alpha / k symmetrised per pair by the arithmetic-mean mix; the additive contact rule

  sigma = r_i + r_j read from radius) are default-compatible and break no existing user, so they

  are not a costed widening. (3) The dense O(N^2) half-sum versus a neighbour-graph reduction is

  the same range / pair-topology axis squared_law already carries (all_pairs vs the radius_graph

  neighbour list) and on which attraction_repulsion already truncates via its radius_graph map.


  NOT `new`: attraction_repulsion already IS the pairwise attraction-repulsion contract; minting

  a second contract for the base machinery would inflate exactly the yield this ledger exists to

  measure.


  NOT `out_of_scope`: unlike NoForce (order 12, the identity / ABSENCE of interaction, which

  reads nothing and emits zero), PairwisePotential is the real forward interaction -- it has a

  pair map, reads separations and couplings, and produces the force that drives motion. Its

  abstractness (no own pair_energy) is WHY it is the contract rather than a single

  implementation, not evidence that it is mere plumbing.


  SCOPE / SOURCE notes. (a) The per-cell VIRIAL PRESSURE the base also derives from the same

  energy is NOT an output of THIS interaction contract; it is the separate VirialStress entry

  (order 20), which writes a `stress` field -- kept out of scope here, consistent with the Morse

  entry. (b) forces() itself lives on the Potential base (line 84), not on PairwisePotential;

  any custom energy can subclass Potential and inherit -grad forces for free (NoForce overrides

  it to zeros). That inheritance is engine machinery, not a second contract. (c) The coupling

  restriction -- a shared scalar OR a per-cell SCALAR field only; per-type and per-cell ARRAY

  couplings rejected at __check_init__ -- is a real EXPRESSIVENESS limit of this implementation

  against the paper''s type x type cadherin adhesion matrix (Fig. S1); recorded in surprises as

  an implementation weakness, not a contract change (an override of mix() or an external epsilon

  route would supply the matrix). (d) SOURCE vs PAPER (rule 5): the paper (p. 9) says JAX-MD

  performs the mechanics, but the source derives forces by autodiff with NO jax-md dependency

  (surprises). SOURCE WINS; it does not change the verdict -- either way it is the same pairwise

  cell-cell interaction.

  '
contract:
  name: attraction_repulsion
  kind: lateral
  family: interaction
  set: cell
  inputs:
  - cell
  outputs:
  - cell
  reads:
  - position
  - radius
  - alive
  - displacement
  - coupling field (shared scalar OR per-cell scalar field, e.g. epsilon / alpha / k), symmetrised per
    pair by the arithmetic-mean mix rule
  writes:
  - position
  maps:
  - pairwise radial interaction over live non-self pairs (dense N x N, half-summed so each unordered pair
    counts once); force on each cell = -grad of a conservative radial pair energy by autodiff, the concrete
    well SHAPE supplied by a subclass's pair_energy (repulsive core +/- adhesive tail)
  - contact distance sigma = r_i + r_j (additive, size-consistent as cells grow); a per-cell coupling
    symmetrised per pair by the arithmetic-mean mix; a conservative radial pair force integrated overdamped
    or minimised by the wrapping motion step
