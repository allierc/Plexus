id: soft_sphere
order: 15
raw_name: SoftSphere
raw_kind: potential (PairwisePotential)
code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L315
paper_section: p. 9, Materials and Methods "Mechanical interactions" (also p. 14) -- but the paper defines
  cell mechanics as the Morse potential, NOT this harmonic soft sphere; see surprises.
summary: 'A pairwise interaction ENERGY (not a step): purely repulsive, compact harmonic excluded volume.
  For a pair at separation r with contact distance sigma = r_i + r_j (sum of the two cells'' radii), it
  contributes overlap energy U(r) = (epsilon/2)(1 - r/sigma)^2 while the cells overlap (r < sigma) and
  exactly zero at and beyond contact. It does not itself write state; a wrapping step (MechanicalRelaxation
  / BrownianDynamics / ActiveBrownianDynamics2D / a stress step) turns its autodiff-derived forces into
  a position update. Both energy and force vanish at r = sigma (C1), so cells feel a soft push that fades
  smoothly as the overlap closes -- the canonical soft-disk / active-matter excluded-volume model, with
  no adhesive tail and no cutoff to tune.'
params:
  epsilon:
    role: repulsion_strength (excluded-volume energy scale / contact stiffness). Shared scalar (Python
      float or scalar jax.Array, default 1.0) OR a per-cell StateFieldSpec of shape () -- the per-cell
      form lets a regulatory network set per-cell repulsion, combined per pair by the arithmetic-mean
      mix. Per-type / per-cell raw arrays are rejected at construction; only a scalar or a per-cell scalar
      spec is accepted.
equations: "CODE (this class). pair_energy(r, sigma, eps) delegates to _compact_repulsion(r, sigma, eps,\
  \ exponent=2.0, prefactor=0.5), i.e.\n\n    U(r) = 0.5 * eps * (1 - r/sigma)^2   for r < sigma,   U(r)\
  \ = 0   for r >= sigma,\n\nwith sigma = r_i + r_j (contact distance = SUM of radii, per pair) and eps\
  \ the repulsion strength (a shared scalar, or the arithmetic mean 0.5*(eps_i + eps_j) when epsilon is\
  \ a per-cell field). Radial force magnitude F = -dU/dr = eps*(1 - r/sigma)/sigma > 0 inside contact\
  \ (repulsion); at r -> sigma both U -> 0 and dU/dr -> 0 (C1; the second derivative jumps from eps/sigma^2\
  \ to 0). Forces are obtained by autodiff of the total energy, never hand-coded: total_energy = 0.5 *\
  \ sum_i sum_{j != i, alive} U(r_ij)  (the leading 0.5 counts each pair once and is DISTINCT from the\
  \ per-pair 0.5 above; self- and dead-pairs are dropped by neighbor_sum). Per-cell virial pressure (inherited\
  \ from PairwisePotential): p_i = -(1/(2 d V_i)) * sum_j r_ij (dU/dr)(r_ij), V_i the d-ball volume of\
  \ radius r_i (2 r, pi r^2, 4/3 pi r^3 for d = 1,2,3); the sign makes compression give p > 0. --- PAPER\
  \ (p. 9 / p. 14). The paper's cell mechanics is NOT a harmonic soft sphere but the Morse potential \
  \ V_ij(r) = eps_ij[(1 - exp(-alpha_ij (r_ij - sigma_ij)))^2 - 1],  sigma_ij = R_i + R_j, which has BOTH\
  \ a repulsive core and an attractive adhesion tail. The paper calls its cells \"adhesive soft spheres\"\
  \ as a descriptor of that Morse model; it never writes the harmonic (epsilon/2)(1 - r/sigma)^2 that\
  \ this SoftSphere class implements. The SOURCE (this class) wins: SoftSphere is a purely-repulsive library\
  \ alternative the paper does not use for its results."
state_io:
  reads:
  - 'position (base POSITION): cell centres -> pairwise separations r_ij = safe_norm(pairwise_displacements(position,
    displacement)).'
  - 'radius (base RADIUS): sets the per-pair contact distance sigma = r_i + r_j, and the d-ball volume
    V_i in virial_pressure.'
  - 'alive (base ALIVE): masks self-pairs (j != i) and dead/padded cells in neighbor_sum; virial_pressure
    also zeroes dead cells.'
  - 'displacement (structural space metric): the pairwise displacement operator (handles any boundary/topology).'
  - 'n_space_dim (structural): dimension d, used only by virial_pressure to pick the d-ball volume.'
  - 'epsilon field: ONLY when epsilon is a per-cell StateFieldSpec -- then state_reads() returns that
    one spec so build_state_from_model allocates it. With the default scalar epsilon, state_reads() ==
    () (declares nothing).'
  writes:
  - 'none. SoftSphere is a Potential (an energy), not a Step: it exposes total_energy / forces / virial_pressure
    and declares no state_writes. The position (or stress) update is written by whatever step consumes
    these forces.'
surprises:
- 'PAPER vs SOURCE (the headline): the paper''s "adhesive soft spheres" are realized by the MORSE potential
  (repulsion + adhesion), not by this class. This SoftSphere is a purely-repulsive harmonic with NO attractive
  tail, so it is a mechanism the paper describes in name only. A reader who assumes "SoftSphere == the
  paper''s cell mechanics" is wrong; the paper''s force law is Morse (a sibling class in this same file).'
- sigma = r_i + r_j is the SUM of the two radii, not their mean and not a single diameter. Contact happens
  when centres are one full (R_i + R_j) apart. Using (R_i+R_j)/2 halves the contact distance and quadruples
  the effective stiffness.
- 'The energy carries a 1/2 prefactor: U = (epsilon/2)(1 - r/sigma)^2, not epsilon(1 - r/sigma)^2. It
  is the literal prefactor=0.5 inside _compact_repulsion. Dropping it doubles the force.'
- TWO independent halves. The per-pair 0.5 (harmonic prefactor) and the leading 0.5 in total_energy (each
  undirected pair counted once over the dense N x N sum) are different factors; a reimplementer who folds
  them into one under-counts either the energy or the stiffness.
- 'Gradient-safety double `where` (in the shared _compact_repulsion): base = 1 - safe_divide(r, sigma);
  the power is evaluated on where(base>0, base, 1.0) and then masked by where(base>0, ..., 0). For SoftSphere''s
  integer exponent 2 this looks redundant, but it is what keeps the FRACTIONAL exponents of the siblings
  (Hertzian 5/2) NaN-free at r >= sigma under the always-on jax_debug_nans. Omit it and the sibling potentials''
  gradients NaN.'
- 'safe_divide(r, sigma) guards dead-dead PADDED pairs where both radii (hence sigma) are 0: plain r/sigma
  would be 0/0 -> NaN, and the alive-mask in neighbor_sum removes the pair''s VALUE but not a NaN that
  has already poisoned the sum under debug_nans. The guard must sit at the divide, not at the reduction.'
- 'Per-cell epsilon combines by the ARITHMETIC mean 0.5*(eps_i+eps_j) (PairwisePotential.mix), deliberately
  NOT the geometric mean / Lorentz-Berthelot -- chosen because it has a finite gradient at zeros (no sqrt).
  So within one pair epsilon mixes by MEAN while sigma mixes by SUM: two different combination rules.'
- On the self-diagonal (i == j) r = 0, so base = 1 and pair_energy returns 0.5*eps (NONZERO), not 0. It
  is neighbor_sum's j != i mask -- not the energy formula -- that removes the spurious self-energy. A
  naive full-matrix sum without the self-mask adds a constant offset.
- 'No cutoff parameter and none needed: the support is exactly [0, sigma), so U and F are already compact
  and C1 at contact. Unlike Morse / LennardJones / Harmonic there is no r_onset_frac / r_cutoff_frac;
  porting cutoff code from a sibling would be a bug.'
- Forces come from jax.grad of total_energy, not a hand-written -dU/dr. The pair_energy must therefore
  be autodiff-clean everywhere it is evaluated (including the masked diagonal and dead pairs) -- which
  is the whole reason for safe_norm / safe_divide / the double where.
verdict: new
of: null
implementation_of: adhere
why: "SoftSphere is the purely-repulsive (zero-adhesion) IMPLEMENTATION of a pairwise\ncell-cell mechanical-interaction\
  \ contract that the frozen 42 do not carry. That\ncontract -- name `adhere` -- is a Lateral force between\
  \ two cells whose interaction\nrange is set by their PHYSICAL RADII (contact at sigma = r_i + r_j, so\
  \ the excluded\nvolume tracks size as cells grow and divide), reading a per-cell (or shared)\ninteraction\
  \ strength, and driving the cell positions through a wrapping integrator\nstep; the adhesive members\
  \ (Morse, LennardJones) add an attractive tail, SoftSphere\nand Hertzian switch it off. By the record's\
  \ own regulate rule, siblings that share\none typed signature and differ ONLY in the pair-energy law\
  \ U(r) collapse to ONE\ncontract with several implementations -- Morse/SoftSphere/Hertzian are one `adhere`,\n\
  not three contracts -- so this yields the SAME contract as its siblings, and\n`morse_potential`/`soft_sphere`/`hertzian`\
  \ are all implementation_of `adhere`.\n\nThe verdict is `new` (not alias/refinement) ONLY because `adhere`\
  \ is absent from the\nfrozen 42 and R4 rejects a non-registered `of:` target; it cannot be promoted\
  \ here,\nit can only be named as the shared implementation_of. Every registered contract that\ncomes\
  \ close loses its biology if widened to admit it:\n\n- `attraction_repulsion` (lateral/interaction)\
  \ is the closest -- it is literally\n  attraction+repulsion, the same combined biology as the adhesive\
  \ Morse, with\n  SoftSphere as its repulsion-only limit. But its contract is the D'Orsogna\n  self-propelled-particle\
  \ law: a Gaussian-difference force of FIXED GLOBAL width\n  sigma, keyed to a per-TYPE parameter vector\
  \ p=[pull,pull_range,push,push_range],\n  emitting an overdamped velocity over a radius_graph edge-set.\
  \ It has NO notion of\n  a cell's physical radius, no size-consistent contact distance, no energy/virial,\n\
  \  and a per-type (not per-cell) coupling. Widening it to read `radius` and derive\n  sigma = r_i +\
  \ r_j, to accept a compact soft-core energy law, to emit a force plus\n  a virial pressure, and to take\
  \ a per-cell scalar strength is not a widening -- it\n  deletes the fixed-width pattern-forming particle\
  \ model that IS that contract.\n\n- `separation` (lateral/interaction) is boids collision-avoidance:\
  \ a mean-aggregated\n  1/|d|^2 steering nudge keyed to a behavioral `separation` weight, diverging at\n\
  \  contact and relying on the graph's min_radius. It is short-range repulsion in name,\n  but it has\
  \ no cell radius, no compact support, no energy, no virial, saturates\n  nowhere, and covers only the\
  \ repulsive half. Turning it into a size-dependent\n  soft-core physical potential converts a heuristic\
  \ steering rule into hard-matter\n  mechanics -- different biology. `cohesion` (attraction-only steering)\
  \ and\n  `squared_law` (inverse-square, no soft core, no size) are farther near-misses for\n  the same\
  \ reasons.\n\nPer rule 5 the SOURCE wins: the paper names its cells \"adhesive soft spheres\" and\n\
  realizes them with the adhesive MORSE potential, never this harmonic (epsilon/2)\n(1 - r/sigma)^2; SoftSphere\
  \ is a code-only, purely-repulsive library alternative,\nrecorded as the adhesion-off implementation\
  \ of `adhere`. The two 1/2 factors, the\nSUM-vs-MEAN combining rules, the double-`where` gradient guard\
  \ and the virial sign\nare implementation details of THIS member, not contract-level distinctions.\n\
  \nSOURCE-VERIFIED, and it settles the dispute. The skeptic asks record.py's regulate/consistency rule\
  \ to route this entry to the parent's alias -> attraction_repulsion. Read at source, src/plexus/operators/attraction_repulsion.py\
  \ refutes the premise that target rests on: it is registered set=\"particle\" kind=\"lateral\" (line\
  \ 28), EMIT=\"velocity\" (line 30 -- a hand-coded overdamped velocity, not an energy), REQUIRES_PARAMS=[\"\
  sigma\"] with self.sigma=float(params[\"sigma\"]) (lines 32/43 -- ONE global scalar width), and REQUIRES_TYPE_PROPS=[\"\
  p\"] (line 33 -- a per-TYPE vector p=[pull,pull_range,push,push_range] indexed by node_type[i], line\
  \ 61); its forward() reads pos/edge_index/node_type/type_params/occ over a neighbour graph and NEVER\
  \ reads radius. So the registered operator has no physical-radius read, no per-pair contact distance\
  \ sigma=r_i+r_j, no energy/force/virial, a per-TYPE (not per-cell) coupling, and set=particle -- SoftSphere\
  \ is the opposite on every one of those signature fields. Consistency therefore does NOT license the\
  \ alias; applied honestly it forces the opposite verdict. SoftSphere (exponent 2.0, prefactor 0.5) and\
  \ Hertzian (2.5, 0.4) are the SAME helper _compact_repulsion separated by two numeric constants, and\
  \ Hertzian (order 16) plus the adhesive sibling Harmonic (order 17) have already normalized new -> adhere;\
  \ splitting literal twins is indefensible, so this entry matches them. The parent PairwisePotential\
  \ and Morse alias entries rest on the refuted premise that attraction_repulsion carries the pairwise-cell-mechanics\
  \ signature; reconciling them toward adhere is flagged for the analysis phase, not made here.\n"
