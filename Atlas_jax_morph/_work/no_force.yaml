surprises:
- 'NOT IN THE PAPER. The paper''s cells ALWAYS interact via a pairwise Morse potential (p. 3, Fig. 1d:
  repulsion for excluded volume, attraction for adhesion). NoForce has no paper / biological counterpart
  - it is a library engineering affordance (a null Potential) for active-matter base models where the
  coupling lives elsewhere. A reimplementer mapping the paper 1:1 would never produce it.'
- '``forces`` is deliberately OVERRIDDEN to return zeros directly instead of inheriting the base ``forces``
  (which autodiffs ``total_energy``). Both give zero, but the override skips building and differentiating
  the energy graph. NB: NoForce is a direct ``Potential`` subclass (not ``PairwisePotential``), so its
  own ``total_energy`` is a bare ``0.0`` with no pairwise sum - the class docstring''s "skipping the dense
  O(N^2) pairwise sum" describes the general motivation, not this class''s own energy (there is no sum
  here to skip). The real cost avoided is the grad trace.'
- 'NoForce is almost never constructed by name: it is what ``potential=None`` resolves to inside ``BrownianDynamics``,
  ``ActiveBrownianDynamics2D``, ``MechanicalRelaxation``, and ``relax_equilibrium`` (each does ``potential
  if potential is not None else NoForce()``). Miss that None-mapping and you lose the free-gas / no-op-relaxation
  default.'
- It is parameterless - an ``eqx.Module`` with no fields, hence no tunable knobs. There is nothing to
  differentiate through and nothing to optimize; it contributes no leaves to the model pytree.
- '``total_energy`` returns a scalar ``jnp.asarray(0.0)`` at the default dtype (float32 unless x64 is
  enabled; the test suite enables x64), whereas ``forces`` returns ``zeros_like(state.position)`` which
  inherits position''s exact shape and dtype. A hand-rolled version that returned a scalar or a wrong-dtype
  array from ``forces`` would break the ``dt * forces / gamma`` drift broadcast.'
- 'Under ``MechanicalRelaxation`` the no-op is realized through the GENERAL FIRE path, not a special case:
  because ``grad U = 0`` everywhere the residual is 0 <= f_tol at iteration 0, so the ``while_loop`` body
  never runs and positions pass through unchanged. ``relax_equilibrium`` also has an explicit ``if potential
  is None`` short-circuit, but the step stores an actual ``NoForce()`` (not None) and relies on the loop''s
  immediate convergence instead.'
