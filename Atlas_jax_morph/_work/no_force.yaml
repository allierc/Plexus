id: no_force
order: 12
raw_name: NoForce
raw_kind: potential (Potential)
code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L108
paper_section: p. 3, Fig. 1d (the mechanical-interaction slot; the paper fills it only with Morse)
summary: >-
  The trivial (null) interaction potential: total energy is identically zero and every cell feels
  zero force, so it leaves positions untouched. It is the neutral default the position-moving steps
  resolve ``potential=None`` to - a free Brownian / active-Brownian gas, or a no-op mechanical
  relaxation - and the natural base for active-matter / flocking models whose only coupling lives in
  a separate step (e.g. a neighbour-alignment torque).
equations: >-
  Let x be the (capacity, d) position array and i index a cell. NoForce defines
    U(x, state) = 0                       (total interaction energy, a scalar constant)
    F_i = -grad_{x_i} U = 0  for all i    (per-cell force, shape (capacity, d))
  In the source: ``total_energy`` returns ``jnp.asarray(0.0)`` (a scalar, ignoring both positions and
  state); ``forces`` is OVERRIDDEN to return ``jnp.zeros_like(state.position)`` directly rather than
  autodiffing the zero energy. Symbols: x = state.position, d = n_space_dim, U = total interaction
  energy, F_i = force on cell i. Same as the code; the paper writes no NoForce (its only potential is
  the Morse energy U(r) = eps[(1 - exp(-alpha(r - sigma)))^2 - 1], p. 3 / Methods).
params: {}
