id: declared_field_dataflow_validation
order: 23
raw_name: declared field dataflow validation
raw_kind: composition contract
code_path: papers/jax-morph/jax_morph/core/step.py:364
paper_section: guides/concepts.md, 'Physics and control compose through fields'
summary: Steps couple ONLY through named state fields -- there is no other channel. Each step declares
  the fields it reads (state_reads), writes (state_writes) and, if stochastic, its ephemeral records (trace_writes)
  as tuples of StateFieldSpec. When a Model is constructed, Model._validate cross-checks those declarations
  (write-conflict policy + trace uniqueness + spec consistency) and build_state_from_model then SYNTHESIZES
  the typed state class as exactly the base fields merged with the union of every step's required fields.
  So the contract does not transform field values; it defines and validates the schema through which steps
  couple, which is why recomposition is add/remove/reorder rather than editing a monolithic simulator.
equations: "This is a composition/validation contract, not a numeric update. The \"update\" is the set\
  \ of\nbuild-time predicates and the schema synthesis.\n\nSCHEMA SYNTHESIS  (state.py: merge_specs, build_state_from_model)\n\
  \  specs        = merge_specs(BASE_SPECS, U_step  step.state_requires())\n  step.state_requires() =\
  \ merge_specs(state_reads(), state_writes()[, trace_writes()]).values()\n  StateCls     = eqx.Module\
  \ with one jax.Array attribute per name in specs, shape:\n                   global scope -> spec.shape\n\
  \                   cell   scope -> (capacity, *spec.shape)\n  merge_specs raises ValueError if two\
  \ declarations SHARE a name but are not EXACTLY equal.\n\nBUILD-TIME WRITE-CONFLICT VALIDATION  (step.py:\
  \ Model._validate, over NON-discrete steps)\n  let Q(f) = {quasistatic steps writing field f},  D(f)\
  \ = {dynamic steps writing f}\n    require  |Q(f)| <= 1                     (a quasistatic field admits\
  \ exactly ONE writer)\n    require  a field is Q-owned XOR D-owned  (never both quasistatic- and dynamic-written)\n\
  \    |D(f)| unrestricted -> deltas SUMMED:   total_f = sum_d  delta_d[f]  (alive-masked, cell scope)\n\
  \    DISCRETE steps EXEMPT from this check    (resets are allowed to clobber)\n\nTRACE-FIELD VALIDATION\
  \  (step.py: Model._validate, over stochastic steps)\n    each trace name owned by exactly ONE stochastic\
  \ step (no sharing)\n    trace name NOT in reserved,  reserved = {base field names} U {every step.state_writes()}\n\
  \    dynamic trace field: spec.default == 0   (reset-then-accumulate records only its own increment)\n\
  \nREADS ARE NOT VALIDATED. A field may be read with no writer (allocated at spec.default, held by\n\
  the initial condition or as a never-changing constant). Reads still enter state_requires(), so a\nDECLARED\
  \ read guarantees the field is allocated -- but nothing checks that a writer exists.\n\nSymbols: f =\
  \ field name; capacity = fixed cell-slot count (static shapes for compiled rollouts);\nBASE_SPECS =\
  \ (position, radius, celltype, alive, t).\n"
params:
  name: coupling-key / field identity -- the name by which steps couple; the ONLY inter-step channel.
  shape: per-cell feature dimension (trailing array shape; () = scalar). Full cell array is (capacity,
    *shape).
  dtype: storage dtype (None -> JAX default float; e.g. ALIVE is bool).
  heritable: division-inheritance policy -- True daughter copies mother's value, False daughter reset
    to default (cell scope only).
  default: fill / reset value -- allocates empty states, resets ephemeral trace fields each macro-step,
    inits non-inherited daughters. Also the dynamic-trace validity check (must be 0).
  scope: locality -- 'cell' (per-cell, leading capacity axis, alive-masked, resized on division) vs 'global'
    (time/scalar/Eulerian grid; storage only, no grid coupling provided).
  Model(steps): pipeline order -- the ordered tuple of steps whose declarations are cross-validated at
    construction and whose union defines the synthesized state schema.
state_io:
  reads: 'Schema-level only -- consumes each step''s declared state_reads()/state_writes()/trace_writes()
    SPEC tuples; it does not read any field VALUE. Always-in-scope base fields it merges against: position,
    radius, celltype, alive, t.'
  writes: Synthesizes (does not mutate) the generated BaseState subclass schema = merge_specs(BASE_SPECS,
    union of step.state_requires()); raises ValueError on any write/spec/trace conflict at Model build
    time. Writes no state field values.
surprises:
- 'Named "dataflow VALIDATION" but it validates WRITES only. Reads are deliberately never cross-checked
  (Model._validate comment: "The model does not police reads"): a field read with no writer is legal,
  and there is NO DAG / read-before-write / dependency-order check. The name over-promises what is enforced.'
- Validation does NOT verify that a step's __call__ body touches only its declared fields. The declaration
  is an unenforced PROMISE. A step that reads state.foo without declaring foo either AttributeErrors at
  run time (if no step allocated foo) or silently works (if another step happened to allocate it) -- never
  a build-time error. Correctness of the wiring rests on steps declaring honestly.
- 'DISCRETE steps are entirely EXEMPT from the write-conflict policy ("discrete steps are resets"): two
  discrete steps may both write `alive` and clobber, and a discrete write never reserves a field against
  quasistatic/dynamic writers. BUT discrete writes DO reserve their names against trace fields (reserved
  is built from every step''s state_writes(), discrete included).'
- 'The quasistatic/dynamic writer rule is per-field and decided by StepType: >1 DYNAMIC writer of a field
  is allowed and the deltas are ADDED (alive-masked); a QUASISTATIC field admits exactly one writer; a
  field cannot be both. A reimplementer treating "one writer per field" as universal would wrongly reject
  multi-writer dynamic accumulation.'
- merge_specs dedups only EXACTLY-equal specs. Customizing a base spec inline in one step (POSITION(heritable=False))
  while another step uses the plain POSITION is a build-time ValueError -- a shared field must be declared
  IDENTICALLY by every step that names it.
- Reads are intentionally NOT reserved against trace-field names, so the Emit->React pattern (a downstream
  step reads an upstream step's within-macro-step trace as a state_read equal to a trace_write) stays
  legal. Reserving reads would forbid that intended consumption path.
- 'The contract is split across two files: the declaration vocabulary and merge (StateFieldSpec, merge_specs,
  build_state_from_model) live in core/state.py; the build-time cross-validation (Model._validate, reached
  from Model.__init__) lives in core/step.py. It is not in one place.'
- 'PAPER vs SOURCE. Source (this hardened library): steps declare reads/writes and Model build-time validates
  + synthesizes the state type. Paper (Deshpande 2025, p.14, "I. Forward Simulation"): a single CellState
  datatype holds "the position of particles, their radii, division propensities, chemical concentrations
  ... and any additional state information," and the simulation "can be customized to contain any subset
  or combination of the steps" -- composition purely by CONVENTION, with NO declared reads/writes and
  NO build-time validation (a paper grep for valid/conflict/schema/declare/contract finds only "validation
  LOSS"). A reader of the paper alone would model steps as freely mutating a shared struct; the declared-field
  dataflow contract is an invention of the library re-engineering, not described in the paper.'
verdict: out_of_scope
of: null
why: 'OUT_OF_SCOPE: declared-field dataflow validation is the declaration discipline and TYPE SYSTEM

  of the operator algebra, not an operator in it. It reads no field VALUE and writes none: it only

  (a) cross-validates each step''s declared state_reads()/state_writes()/trace_writes() at Model

  build time (write-conflict policy + trace uniqueness + spec consistency) and (b) synthesizes the

  typed state class as merge_specs(BASE_SPECS, union of step.state_requires()). "Advance the state"

  has nothing to name here -- there is no biological process called "check that the steps declare

  their fields honestly", so the contract rule that an operator take a biological name (divide /

  diffuse / adhere) finds nothing to name.


  It is the fourth face of the one core/step.py engine layer whose other three faces are already

  out_of_scope: the Lie-Trotter macro-step split (order 21, `integrate`), the step_type time-scale

  taxonomy (order 22, `timescale`), and the StochasticStep differentiability mixin (order 5 / 24).

  Both the 21 and 22 why-blocks explicitly name order 23 for this same verdict. In an operator

  ALGEBRA the composition law -- how operators declare and share the state they couple through --

  is part of the algebra''s DEFINITION, not one of its elements; Plexus''s engine and IR already own

  that discipline (typed reads/writes per operator, and record.py R7 rejecting a writes-nothing

  operator is the direct analogue of "a declared write is the only coupling channel").


  Not alias / refinement: no registered contract models a build-time schema validator, and widening

  any forward operator (say `diffuse`, or any lateral force) to carry declaration cross-checking

  would graft a validator onto a forward-dynamics signature -- pure violence to its biology. Not

  new: `new` requires the capability be ABSENT from the promoted language, and this is the exact

  opposite of absent -- it is the FRAME the language is written in, so registering it as an operator

  would inflate the atlas yield with the very type discipline every entry already presupposes,

  exactly what out_of_scope exists to prevent.


  CONTRACT FIELDS BELOW are a validator formality: R6/R7 require a typed, writes-non-empty contract

  even for out_of_scope. No Plexus kind fits a schema validator; kind=exchange / family=coupling

  names only the write-into-shared-named-state coupling this contract governs; reads = the BASE_SPECS

  it merges every step''s declarations against (position, radius, celltype, alive, t); writes=[alive]

  is the formal allocation representative (a non-physics write mirroring the siblings'' writes:[t] and

  stochastic_step''s writes:[trace]).


  STRONGEST COUNTERARGUMENT (and why it loses): this is arguably the atlas''s most valuable POSITIVE

  result rather than a scope exclusion. The target has INDEPENDENTLY reinvented the very discipline

  the Plexus algebra is built on -- typed per-operator reads/writes as the sole coupling channel,

  plus a write-conflict policy that is R7''s no-op rule made per-field -- which one could read as a

  `new` build-time-dataflow-validator capability the language should register. It loses because the

  atlas measures the OPERATOR VOCABULARY (typed forward maps over sets and fields), and a validator

  is not a forward map -- it is the type system those maps are written in, which Plexus already

  embodies; and `new` further requires ABSENCE, whereas this is the frame, not a gap. The honest

  resolution is out_of_scope WITH the correspondence logged as a MEASUREMENT NOTE: jax-morph carries

  one axis Plexus''s IR does not -- a per-StepType (time-scale-keyed) write-conflict policy

  (quasistatic = one writer; dynamic = many, summed; discrete = exempt) that REFINES R7''s flat

  no-op/writes rule. That axis is worth DOCUMENTING against the engine, not counting as a word in

  the vocabulary.


  SOURCE-vs-PAPER (recorded in surprises): the paper (Deshpande 2025, p.14, "I. Forward Simulation")

  describes a single CellState struct composed "by any subset or combination of the steps" -- by

  CONVENTION, with no declared reads/writes and no build-time validation (a paper grep for

  valid/conflict/schema/declare/contract finds only "validation LOSS"). SOURCE WINS: the declared-

  field dataflow contract is an invention of the hardened library, invisible to a paper-only reader.

  '
