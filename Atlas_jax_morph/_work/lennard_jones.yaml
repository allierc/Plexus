id: lennard_jones
order: 18
raw_name: LennardJones
raw_kind: potential (PairwisePotential)
code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L419
paper_section: p. 9 'Mechanical interactions' (Morse energy Vij, eq. lines 514-520; also
  Methods p. 14 lines 758-772) - the paper's mechanics are Morse ONLY; LennardJones appears
  nowhere in the paper.
summary: 'A pair-interaction ENERGY component (not a step): given cell positions it returns
  a scalar total interaction energy over live, non-self pairs, from which the wrapping step
  (MechanicalRelaxation / BrownianDynamics / ActiveBrownianDynamics2D) derives per-cell forces
  by autodiff. The pair energy is Lennard-Jones in ``r_min`` form: a hard r^-12 repulsive core
  plus a 2*r^-6 adhesive tail whose minimum is exactly ``-epsilon`` at the contact distance
  ``sigma = r_i + r_j``, multiplied by a smooth cutoff that truncates the tail between
  ``r_onset_frac*sigma`` and ``r_cutoff_frac*sigma``. It writes no state itself.'
equations: |
  Pair energy (LJ, r_min form), for a pair at separation r with contact distance sigma:
    x       = safe_divide(sigma, r)              # = sigma/r, but 0 (not inf) at r=0
    U_lj(r) = epsilon * ( x**12 - 2 * x**6 )     # minimum -epsilon exactly at r = sigma
    U(r)    = U_lj(r) * S(r; r_on, r_off)        # tail truncated by the smooth cutoff
  where
    sigma   = r_i + r_j                          # contact distance = sum of the two radii (per pair)
    r_on    = r_onset_frac  * sigma              # default 1.5 * sigma
    r_off   = r_cutoff_frac * sigma              # default 2.5 * sigma
  Smooth cutoff S (jax-md multiplicative switch, C1), with r2=r^2, ron2=r_on^2, roff2=r_off^2:
    S(r) = 1                                              for r <= r_on
    S(r) = (roff2-r2)^2 (roff2 + 2 r2 - 3 ron2)/(roff2-ron2)^3   for r_on < r < r_off
    S(r) = 0                                              for r >= r_off
  Aggregation (inherited from PairwisePotential.total_energy):
    E_total = 0.5 * sum_i sum_{j alive, j != i} U(r_ij)   # each live pair counted once
    forces  = -grad_positions(E_total)                    # via jax.grad; no analytic force
  Per-cell virial pressure (inherited, optional consumer):
    p_i = -(1/(2 d V_i)) sum_j r_ij (dU/dr)(r_ij)         # V_i is the d-ball volume of radius r_i
  CODE vs PAPER: the paper uses the MORSE energy for all mechanics, never Lennard-Jones:
    V_morse(r) = epsilon * [ (1 - exp(-alpha (r - sigma)))^2 - 1 ]   (paper eq., p. 9 / p. 14)
params:
  epsilon: 'well_depth / adhesion_energy_scale - sets BOTH the repulsion strength and the
    adhesive well depth (the minimum equals -epsilon at contact). A shared scalar OR a per-cell
    ``StateFieldSpec``; a per-cell epsilon is combined per pair by the ARITHMETIC mean
    ``0.5*(e_i+e_j)`` (base ``mix``), not a geometric / Lorentz-Berthelot rule. Default 1.0.'
  r_onset_frac: 'interaction_cutoff_onset - start of the smooth truncation window as a multiple
    of the contact distance sigma; the tail is untouched (S=1) inside this radius. Default 1.5.'
  r_cutoff_frac: 'interaction_range / cutoff - end of the smooth truncation window as a multiple
    of sigma, beyond which the energy is exactly 0. Must satisfy r_onset_frac < r_cutoff_frac
    (checked at construction). Default 2.5.'
state_io:
  reads:
  - position (capacity, n_space_dim) - supplied to total_energy; also state.position for virial
  - radius (capacity,) - forms the per-pair contact distance sigma = r_i + r_j
  - alive (capacity,) - masks dead cells and self-pairs in neighbor_sum
  - 'displacement (static, from the state''s space: free_space / periodic) - the pairwise metric'
  - n_space_dim (static) - only for the inherited virial_pressure (d-ball volume)
  - 'epsilon field - ONLY if epsilon is a StateFieldSpec; then declared via state_reads() so the
    wrapping step allocates it. With the default scalar epsilon, reads nothing beyond base fields.'
  writes:
  - 'NONE. This is an energy component, not a step: it returns a scalar energy / a force array /
    a per-cell pressure. The consuming step writes position (relaxation, Brownian) or a pressure
    field (virial stress); LennardJones declares no state_writes of its own.'
surprises:
- 'THE PAPER DOES NOT USE LENNARD-JONES. Every mechanical interaction in the paper is the MORSE
  potential (p. 9 ''Mechanical interactions''; Methods p. 14). ``LennardJones`` is a library-only
  alternative pair potential, exercised by no paper experiment - a reimplementer targeting the
  paper would never instantiate this class. Recorded as the source/paper divergence; source wins.'
- 'It is the ``r_min`` LJ form ``eps*((sigma/r)^12 - 2 (sigma/r)^6)``, NOT the textbook
  ``4 eps ((sigma/r)^12 - (sigma/r)^6)``. Here sigma is the location of the MINIMUM (= contact
  distance r_i+r_j) with value -epsilon, NOT the zero-crossing. Coding the standard 4-eps form
  puts the well at 2^(1/6) sigma with the wrong depth - a silent, plausible-looking error.'
- 'sigma is per-pair and size-dependent (r_i + r_j), and BOTH cutoff radii are sigma-relative, so
  the interaction rescales as cells grow. A fixed absolute cutoff would break size-consistency.'
- 'The smooth cutoff S multiplies the WHOLE energy (core included), not just the r^-6 tail. It is
  inert on the core only because r_on = 1.5*sigma > sigma keeps S=1 for r < sigma; a reimplementer
  who lowers r_onset_frac below 1 would start cutting into the repulsive core.'
- 'Zero-safety: ``x = safe_divide(sigma, r)`` returns 0 (not inf) at r=0, so the self-diagonal and
  dead-dead padded pairs give U=0 instead of NaN under the always-on jax_debug_nans. A naive
  sigma/r blows up. _smooth_cutoff and safe_divide similarly guard the sigma=0 dead-pair case.'
- 'Aggregation carries a 0.5 factor (each pair counted once) and neighbor_sum masks self and dead
  pairs. Dropping the 0.5 double-counts the energy and hence the forces.'
- 'No analytic force: forces are ``-jax.grad(total_energy)`` and there is NO jax-md dependency -
  the energy is hand-written and differentiated. The C1 cutoff keeps the force continuous but with
  a small slope kink at the window edges.'
- 'Unlike Morse, LJ has NO width/steepness knob: the 12-6 exponents fix the shape. Only epsilon and
  the two cutoff fractions are tunable, so it cannot be tuned to reproduce a given Morse alpha.'
