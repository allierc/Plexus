id: hertzian
order: 16
raw_name: Hertzian
raw_kind: potential (PairwisePotential)
code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L345
paper_section: absent from paper; nearest anchor is the Morse-only mechanics, p. 9 "Mechanical interactions"
  / eq. V_ij on p. 14 / Fig. 1d
summary: 'A pair-interaction ENERGY (not a state-mutating step): a purely repulsive, compact Hertzian
  elastic-contact potential. It contributes a per-pair energy U(r) = (2/5) eps (1 - r/sigma)^(5/2) for
  cells overlapping within the contact distance sigma = r_i + r_j, and exactly zero at/beyond contact.
  It writes nothing itself; a wrapping dynamic step (MechanicalRelaxation / BrownianDynamics) autodiffs
  its total energy into forces and moves the cells. Softer at contact than SoftSphere: both the force
  AND its slope vanish at r = sigma (deformable elastic spheres).'
equations: "Pair energy (code, Hertzian.pair_energy -> _compact_repulsion(r, sigma, eps, 2.5, 0.4)):\n\
  \n  U(r) = 0.4 * eps_ij * (1 - r/sigma_ij)^2.5   for r < sigma_ij,   else 0\n       = (2/5) eps_ij (1\
  \ - r_ij/sigma_ij)^(5/2)\n\nwith contact distance (additive rule, NOT the arithmetic mix used for eps):\n\
  \  sigma_ij = r_i + r_j            (sum of the two cell radii)\nand coupling:\n  eps_ij   = 0.5*(eps_i\
  \ + eps_j)  if epsilon is a per-cell StateFieldSpec (mix = arithmetic mean),\n           = eps     \
  \             if epsilon is a shared scalar.\n\nRadial repulsive force magnitude (from f = -dU/dr, the\
  \ 2/5 chosen so this has coeff 1):\n  f(r) = (eps_ij / sigma_ij) (1 - r/sigma_ij)^(3/2)   for r < sigma,\
  \ else 0.\n\nTotal energy summed once per live non-self pair (base class):\n  E = 0.5 * sum_{i != j,\
  \ both alive} U(r_ij);   forces = -grad_positions E (autodiff);\nper-cell virial pressure p_i = -(1/(2\
  \ d V_i)) sum_j r_ij (dU/dr) is inherited (repulsion -> p>0).\nSymbols: r = |x_i - x_j| pair separation;\
  \ sigma = contact distance (sum of radii); eps = contact stiffness; d = n_space_dim; V_i = d-ball volume\
  \ of cell i.\nPAPER (code disagrees): the paper defines ONLY the Morse potential for mechanics,\n  V_ij(r)\
  \ = eps_ij [ (1 - exp(-alpha_ij (r_ij - sigma_ij)))^2 - 1 ]  (adhesive soft spheres).\nHertzian is a\
  \ code-only addition to the potential library; it is not in the paper.\n"
params:
  epsilon: contact_stiffness (repulsion strength / elastic-modulus scale); default 1.0. The ONLY constructor
    parameter. Accepts a shared scalar OR a per-cell StateFieldSpec combined per pair by the arithmetic-mean
    mix() (per-type / per-cell raw arrays are rejected at construction).
  _implicit_not_a_constructor_param: interaction_length sigma = r_i + r_j is sourced from state.radius,
    NOT a tunable field on the potential; the exponent 5/2 and prefactor 2/5 are hard-coded (no cutoff
    parameter -- the interaction is self-truncating exactly at contact, unlike Morse/LJ/Harmonic).
state_io:
  reads:
  - POSITION (state.position -> pair separations r_ij)
  - RADIUS (state.radius -> contact distance sigma_ij = r_i + r_j; and d-ball volume for virial)
  - ALIVE (state.alive -> neighbor_sum masks dead cells and self-pairs)
  - space metric (state.displacement, state.n_space_dim -- static, sets minimum-image r and virial volume)
  - epsilon field (ONLY if epsilon is a per-cell StateFieldSpec; declared via state_reads())
  writes:
  - none -- a Potential mutates no state; it exposes total_energy/forces/virial that a wrapping dynamic
    step consumes, and that step writes POSITION.
surprises:
- NOT IN THE PAPER. The paper models mechanics with a single Morse potential (adhesive soft spheres, p.
  9 / p. 14 / Fig. 1d). Hertzian is a code-only extension of the pair-potential library, exercised only
  by tests (tests/physics/test_potentials.py) and the examples notebook (examples/03_potentials.ipynb);
  no paper model, config, or oracle script instantiates it. It is PURELY REPULSIVE with NO adhesive tail,
  so it cannot reproduce the paper cell-cell adhesion.
- 'Magic constant 2/5 (prefactor 0.4) is NOT arbitrary: it equals 1/exponent, which normalizes the force
  prefactor to exactly eps/sigma (f = (eps/sigma)(1 - r/sigma)^1.5). A reimplementer who writes U = eps
  (1 - r/sigma)^2.5 gets a force 2.5x too strong. (SoftSphere uses the same trick: 0.5 = 1/2 for exponent
  2.)'
- 'Softer-than-harmonic onset: exponent 5/2 makes energy ~overlap^2.5, so force ~overlap^1.5 and force-slope
  ~overlap^0.5 BOTH vanish at contact (C2 energy). SoftSphere (exponent 2) has a nonzero force-slope at
  contact (only C1). This is the whole point of Hertzian vs SoftSphere.'
- 'Fractional-power gradient guard (double where in _compact_repulsion): the (possibly fractional) power
  is evaluated on a base forced strictly positive (safe = where(base>0, base, 1.0)) before the outer where
  zeros it. A naive single where(base>0, eps*base**2.5, 0) NaNs the gradient for r >= sigma under the
  always-on jax_debug_nans, because base**2.5 is differentiated at base<=0.'
- Dead/padded-pair masking is EXTERNAL, not in the energy. For a dead-dead pair sigma=0, safe_divide(r,0)=0
  so base = 1 - 0 = 1 > 0 and _compact_repulsion returns a spurious 0.4*eps, NOT zero. That nonzero per-pair
  energy is cancelled downstream by neighbor_sum(u, state.alive), which masks self-pairs and dead cells.
  Reordering (masking inside the energy) or dropping the alive mask would inject phantom repulsion between
  dead cells.
- Contact distance sigma uses the ADDITIVE rule r_i + r_j, a different combining rule from the epsilon
  coupling (arithmetic-mean mix). Do not mix sigma with mean().
- epsilon as a StateFieldSpec is combined per PAIR by arithmetic mean (mix), chosen over a geometric mean
  specifically because it has a finite gradient at zeros/dead cells (no sqrt).
verdict: new
of: null
implementation_of: adhere
why: 'NEW to the frozen 42, and the SAME new contract its twin SoftSphere minted: `adhere`

  (implementation_of: adhere). The verdict is `new` with `of: null` because `adhere` is not yet a

  registered contract and R4 forbids naming a non-registered `of:`; it can only be carried as the

  shared implementation_of. Hertzian is the purely-repulsive, C2-soft, self-truncating

  IMPLEMENTATION of a pairwise cell-cell CONTACT-mechanics contract: a Lateral force between two

  cells whose interaction RANGE is set by their PHYSICAL RADII -- contact at sigma = r_i + r_j read

  from state.radius, so the excluded volume tracks size as cells grow and divide -- defined by a

  compact soft-core ENERGY U = (2/5) eps (1 - r/sigma)^(5/2) supported exactly on [0, sigma),

  autodiffed to a force (and a per-cell virial), with a per-cell OR shared stiffness eps. The

  adhesive members (Morse, LennardJones) add an attractive tail; SoftSphere and Hertzian switch it

  off. The whole family collapses to this ONE `adhere` contract with several implementations, so

  recording Hertzian here adds ZERO contracts -- the `new` count rises once for the FAMILY (at

  SoftSphere), not per member.


  THE DECIDING CONSTRAINT IS TWIN-CONSISTENCY, not family majority. SoftSphere (order 15) and

  Hertzian (order 16) are the two most similar members in the whole potential library: both call

  the SAME helper _compact_repulsion(r, sigma, eps, exponent, prefactor), both are purely

  repulsive, both single-parameter, differing ONLY in the two constants passed -- SoftSphere

  (2.0, 0.5) at potentials.py:342, Hertzian (2.5, 0.4) at potentials.py:372. Two mechanisms

  separated by two numeric literals handed to one function CANNOT take different verdicts.

  SoftSphere is already merged as `new -> adhere`; Hertzian must match it. This entry''s earlier

  pass landed `alias -> attraction_repulsion` (the skeptic disputed it toward `new`, and was

  right): aliasing here would split literal twins, which is indefensible.


  NOT `alias`/`refinement` of `attraction_repulsion` (the registered near-miss, and the earlier

  verdict). Read at source (src/plexus/operators/attraction_repulsion.py:28-84), the registered

  operator is the D''Orsogna self-propelled-particle law: EMIT = "velocity" (a hand-coded overdamped

  velocity, NOT an energy), a FIXED GLOBAL scalar width sigma = float(params["sigma"]), a per-TYPE

  parameter vector p = [pull, pull_range, push, push_range], Gaussian-difference message passing

  over a radius_graph edge-set, optional isotropic noise. It never reads state.radius (its `reads`

  literally carry no radius), has no size-consistent contact distance, no energy, and no virial,

  and its coupling is per-TYPE not per-cell. Aliasing asserts coverage the registered signature

  does not have; and widening attraction_repulsion to read radius, derive sigma = r_i + r_j, accept

  a compact soft-core energy law, emit a force-plus-virial, and take a per-cell scalar is not a

  widening but a DELETION of the fixed-width per-type pattern-forming model that IS that contract.


  NOT `out_of_scope`: unlike a serializer or a PRNG helper, Hertzian is a real forward interaction

  with a pair map, radial-separation and radius reads, and a force output.


  I DEPART from the family plurality, deliberately. The abstract parent PairwisePotential (order

  13), Morse (14) and Harmonic (17) all landed `alias -> attraction_repulsion`, judging the

  radius-read, the energy->autodiff-force strategy, and the dense-vs-graph topology to be

  sub-signature implementation axes. They may be right in the abstract. But two facts overrule the

  majority HERE: (a) the registered operator''s `reads` genuinely lacks `radius`, so aliasing

  overstates coverage of the promoted language; (b) SoftSphere -- Hertzian''s near-identical twin --

  is already merged as `new -> adhere`, and splitting the twins is worse than departing from the

  majority. The right resolution is FAMILY-WIDE -- reconcile parent + Morse + Harmonic toward

  `adhere` -- and that reconciliation is flagged for the analysis phase; it is not this entry''s to

  make unilaterally.


  SCOPE / SOURCE (rule 5, SOURCE wins). NOT IN THE PAPER: the paper (Methods p. 9, SI p. 14,

  Fig. 1d) defines a single mechanical potential, the ADHESIVE Morse well; Hertzian is a code-only

  library alternative, exercised only by tests and the potentials notebook, and being PURELY

  REPULSIVE it cannot reproduce the paper''s cell-cell adhesion at all. The per-cell VIRIAL PRESSURE

  the base derives from this energy is NOT an output of this interaction contract; it is the

  separate VirialStress mechanism (it writes a `stress` field), kept out of scope here. The magic

  2/5 prefactor (= 1/exponent, normalizing the force coefficient to eps/sigma), the C2 softness,

  the compact self-truncating support, the double-`where` fractional-power gradient guard, and the

  SUM-vs-MEAN combining rules are implementation properties of THIS member (recorded in surprises),

  not contract-level distinctions.

  '
contract:
  name: adhere
  kind: lateral
  family: interaction
  set: cell
  inputs:
  - cell
  outputs:
  - cell
  reads:
  - position
  - radius
  - epsilon (per-cell OR shared contact stiffness; read via state_reads only when it is a per-cell field,
    otherwise a shared scalar)
  writes:
  - position
  maps:
  - pairwise radial contact interaction over live non-self cell pairs (dense N x N, half-summed so each
    unordered pair counts once); force on each cell = -grad of the conservative Hertzian pair energy by
    autodiff
  - contact distance sigma = r_i + r_j (additive, size-consistent as cells grow); PURELY REPULSIVE compact
    soft core U = (2/5) eps (1 - r/sigma)^(5/2) with support exactly [0, sigma) -- no adhesive tail and
    no cutoff parameter (self-truncating at contact), C2 (force AND its slope vanish at contact); a radial
    pair force integrated overdamped or minimised by the wrapping motion step
