id: harmonic
order: 17
raw_name: Harmonic
raw_kind: potential (PairwisePotential)
code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L375
paper_section: 'p. 9 (Methods, "Mechanical interactions", eq. Vij); p. 14 (SI, "Mechanical
  Interactions") -- both define ONLY the Morse potential. Harmonic itself is absent from the
  paper (library-only pair potential); see surprises.'
summary: >-
  A pairwise energy over live cell pairs: a finite-range harmonic spring whose parabola is shifted
  down so it vanishes at a sigma-relative cutoff. Minimum sits at the contact distance sigma=r_i+r_j,
  so the interaction is repulsive when cells are compressed (r<sigma) and adhesive when stretched
  (sigma<r<r_c). It writes no state directly: it supplies total_energy, and forces = -grad(energy)
  are consumed by the wrapping dynamics/relaxation step, which moves positions.
equations: |
  CODE (this class, potentials.py:412-416):
    sigma = r_i + r_j                                  # contact distance = sum of the two radii
    r_c   = r_cutoff_frac * sigma                      # cutoff distance (default 2.5 * sigma)
    U(r)  = 0.5 * k * [ (r - sigma)^2 - (r_c - sigma)^2 ]   for r < r_c
    U(r)  = 0                                               for r >= r_c   (jnp.where hard truncation)
    # well depth at contact:  U(sigma) = -0.5*k*(r_c - sigma)^2 = -0.5*k*sigma^2*(r_cutoff_frac-1)^2
    # radial force:  F(r) = -dU/dr = -k*(r - sigma)  for r < r_c, 0 beyond
    #   -> jumps by k*(r_c - sigma) at r_c (energy is C0 there, force is discontinuous)

  Reductions (inherited from PairwisePotential, potentials.py:228-240):
    total_energy = 0.5 * sum over {i,j alive, i != j} U(r_ij)   # neighbor_sum masks self+dead pairs;
                                                                # 0.5 counts each unordered pair once
    forces       = -grad_position(total_energy)                 # jax.grad (autodiff, no analytic force)
    k_ij         = 0.5 * (k_i + k_j)                            # arithmetic-mean mix, only when k is a
                                                                # per-cell StateFieldSpec; scalar broadcasts

  PAPER (the only mechanical potential the paper defines, eq. Vij, p. 9 / p. 14) -- NOT this class:
    V_ij(r) = eps_ij * [ (1 - exp(-alpha_ij*(r - sigma_ij)))^2 - 1 ]
    # Morse well; harmonic is a code-side alternative with the same sigma=r_i+r_j contact convention.
params:
  k: 'interaction_stiffness -- spring constant; sets BOTH the repulsion slope and the adhesion
    (well) depth simultaneously (they are not independently tunable). Shared scalar (default 1.0)
    or a per-cell StateFieldSpec combined per pair by arithmetic-mean mix.'
  r_cutoff_frac: 'interaction_range -- cutoff distance as a multiple of the contact distance
    sigma=r_i+r_j (default 2.5); energy is shifted to 0 and truncated at r_c=r_cutoff_frac*sigma,
    force vanishes beyond. Constructor requires r_cutoff_frac > 1 (clamp must sit beyond contact).'
state_io:
  reads:
    - position   # r_ij = |x_i - x_j| via pairwise_displacements(state.displacement) + safe_norm
    - radius     # sigma = radius[:,None] + radius[None,:]  (contact distance per pair)
    - alive      # neighbor_sum masks dead cells and the self-diagonal out of the energy sum
    # displacement: static space metric carried on the state (a function, not a mutable field)
    # + the per-cell coupling field named by `k` IF k is a StateFieldSpec (none by default; k=1.0 scalar)
  writes: []      # a Potential is a pure energy/force function -- it declares no state_writes;
                  # the wrapping step (MechanicalRelaxation / BrownianDynamics / ActiveBrownianDynamics2D)
                  # writes `position`. virial_pressure(state) is also offered (per-cell scalar), unused here.
surprises:
  - 'NOT IN THE PAPER. The paper (Methods p. 9 and SI p. 14) defines a single mechanical potential,
    the Morse well. Harmonic -- and SoftSphere, Hertzian, LennardJones -- are library-only pair
    potentials added by this implementation. A reimplementer working from the paper alone would
    implement only Morse and never encounter this class.'
  - 'The down-shift is the whole point, and easy to drop. A naive "harmonic spring" 0.5*k*(r-sigma)^2
    has its minimum value 0 at contact and grows without bound (purely repulsive, infinite range).
    Subtracting (r_c-sigma)^2 makes the well minimum NEGATIVE (=-well depth) at contact and lets the
    energy hit 0 exactly at r_c, which is what turns it into a finite-range ADHESIVE well (attractive
    for sigma<r<r_c). Forget the shift and you lose both adhesion and the truncation.'
  - 'C0-only cutoff: unlike Morse/LJ (C1 _smooth_cutoff) and SoftSphere/Hertzian (compact C1 tail),
    Harmonic hard-truncates with a bare jnp.where, so the FORCE is discontinuous at r_c -- it jumps
    from -k*(r_c-sigma) to 0. The docstring calls this harmless because r_c (2.5*sigma) sits well
    beyond the resting contact distance; a reimplementer who "fixes" it with a smoothing changes the
    force law.'
  - 'sigma-relative range. r_cutoff_frac multiplies sigma = r_i + r_j (the per-pair sum of radii),
    NOT an absolute distance, so the interaction range scales with cell size and stays size-consistent
    as cells grow. Two combining rules coexist in one potential: sigma uses an ADDITIVE rule (r_i+r_j),
    while the coupling k uses an arithmetic-MEAN mix (0.5*(k_i+k_j), deliberately not the
    Lorentz-Berthelot geometric mean -- no sqrt, so the gradient stays finite at zeros/dead cells).'
  - 'Self and dead-pair terms ARE computed then masked. pair_energy at the r=0 self-diagonal returns a
    nonzero value (0.5*k*(sigma^2-(r_c-sigma)^2)); correctness depends entirely on neighbor_sum masking
    self-pairs and dead cells, and on the leading 0.5 in total_energy that avoids double-counting the
    symmetric (N,N) matrix. Skip either and the energy is wrong without crashing.'
  - 'Forces are autodiff, not analytic: forces = -jax.grad(total_energy). There is no hand-written
    force; the jnp.where truncation is differentiated directly (fine because U is a plain polynomial
    inside the cutoff, so no double-where NaN guard is needed as in the _compact_repulsion helpers).'
