disputed:
  by: skeptic
  was: alias
  claimed: refinement
  evidence: 'Registered attraction_repulsion uses a GLOBAL scalar interaction length (attraction_repulsion.py:43
    self.sigma=float(params[''sigma''])) and reads no per-cell radius; Morse''s contact distance is per-pair
    r_i+r_j from radius (potentials.py:305). Hosting Morse forces a new `radius` read + per-pair contact
    distance onto attraction_repulsion = costed widening = refinement, per the division-entry bar (atlas_record.yaml:1249-1258).
    Parent pillar also false: pairwise_potential verdict:null (1964).'
  what_would_settle_it: Confirm attraction_repulsion has no per-cell radius/size read and only a global
    scalar sigma (attraction_repulsion.py:43,32). If so, its declared signature must widen (+radius read,
    sigma -> per-pair additive r_i+r_j) to host Morse's size-consistent contact distance, which is refinement,
    not alias.
