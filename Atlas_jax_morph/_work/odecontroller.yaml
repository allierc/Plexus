disputed:
  by: skeptic
  was: new
  claimed: refinement
  evidence: 'signal.py:36-80 is a registered per-node internal-state ODE: EMIT=velocity, tau*dv/dt=-v+b+sum
    W*phi(v_pre), tag ''recurrent'' — same firing-rate-RNN class as GeneNetworkConnectionist dg/dt=sigma(W*g+W_in*u+b)-gamma*g
    (ode.py:277). The why: never names signal, wrongly calls decay/pacemaker the closest contracts.'
  what_would_settle_it: Can signal's typed contract express GeneNetworkConnectionist by supplying a per-cell
    self-loop synapse-set + input pseudo-nodes and self-integration? If it widens to a maps=[], field-forced,
    self-solved cell ODE without breaking its connectome/engine-integration identity → refinement of signal;
    if that mismatch forces a distinct operator → new stands.
