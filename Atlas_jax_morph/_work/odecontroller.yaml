id: odecontroller
order: 4
raw_name: ODEController
raw_kind: step (SimulationStep)
code_path: papers/jax-morph/jax_morph/control/ode.py:L46
paper_section: p. 10 ("Genetic regulatory interactions"); fig. 1b
summary: Abstract DYNAMIC step that integrates a per-cell ODE over one macro-step. It packs each cell's
  evolving state y = concat(hidden latent genes, observed output genes), holds the sensed driver inputs
  FIXED, integrates dy/dt = vector_field(t, y, inputs) from t=0 to t=dt with an adaptive Dopri5 solver,
  and returns the exact integrated increment y(dt) - y(0) as a sparse per-field delta (hidden field plus
  each output field). The base defines only the integration machinery; the vector_field is abstract and
  supplied by subclasses (GeneNetworkConnectionist, NeuralODE, GeneNetworkMWC).
equations: "Base ODEController (integration machinery, subclass-agnostic), per cell:\n  y0        = concat(hidden,\
  \ outputs)                      # hidden width = hidden_size, outputs width = out_size\n  inputs   \
  \ = pack(input_specs)   held FIXED over [0, dt]  # driver fields do not evolve during the solve\n  y(dt)\
  \     = ODESolve( dy/dt = vector_field(t, y, inputs),\n                        y(0) = y0, t in [0, dt],\n\
  \                        Dopri5, PIDController(rtol=1e-4, atol=1e-6), dt0=dt )\n  delta     = y(dt)\
  \ - y0          # RETURNED as a sparse dynamic delta, NOT the new state\n                          \
  \        # sliced back: first hidden_size cols -> {tag}_hidden, then each output spec in order\n\nPaper's\
  \ realized field (p. 10, \"inspired by Hiscock [24]\"), per gene i:\n  dg_i/dt = phi( sum_j W_ij g_j\
  \ + b_i ) + I_i - k_i g_i\n    g_i = expression level; W_ij = regulatory influence of gene j on i; b_i\
  \ = basal transcription rate;\n    k_i = degradation rate; I_i = forcing signal from a sensed cell input;\
  \ phi = saturating sigmoid.\n  NOTE the input I_i is ADDITIVE and OUTSIDE the sigmoid.\n\nCode's closest\
  \ subclass, GeneNetworkConnectionist.vector_field (L261):\n  dg/dt = sigma( W_gene @ g + W_in @ u +\
  \ b ) - gamma * g\n  Here the driver input u enters INSIDE the sigmoid via W_in @ u (see surprises)\
  \ and there is no\n  separate additive input term; sigma is the ALGEBRAIC sigmoid 0.5 + 0.5 * x/sqrt(1\
  \ + x^2), not\n  the logistic. GeneNetworkMWC uses a log-occupancy (MWC) drive with jax.nn.sigmoid instead.\n"
params:
  input_specs: sensed_input_field_specs -- per-cell driver fields (chemical concentrations, mechanical
    stress) held FIXED while the ODE integrates; these are the paper's forcing/sensed inputs I_i. Read-only.
  output_specs: observed_output_gene_field_specs -- per-cell evolving fields the ODE integrates and PERSISTS
    as physical state; they drive downstream cell actions (division rate, secretion rates, adhesion).
  hidden_size: latent_regulator_width -- number of hidden/intermediate regulator genes (paper fig. 1b
    blue nodes) evolved alongside the outputs; 0 allocates no latent field and gives a pure-output ODE.
  tag: latent_field_namespace -- string prefix for the heritable latent-state field '{tag}_hidden', so
    multiple controllers can coexist without a field-name collision.
state_io:
  reads:
  - input_specs (the sensed driver fields, held fixed during the solve)
  - '{tag}_hidden (only when hidden_size > 0; read back to seed y0)'
  - output_specs (read back to seed y0)
  writes:
  - output_specs (each output field's dt-increment)
  - '{tag}_hidden, shape (hidden_size,) -- only when hidden_size > 0 (heritable latent state)'
surprises:
- RETURNS A DELTA, NOT THE INTEGRATED STATE. Being a DYNAMIC step, __call__ returns solution.ys[-1] -
  y0 as a sparse delta; the Model accumulates it. A reimplementer who returns the integrated value y(dt)
  directly (quasistatic-style) would double-apply the change.
- The dt-increment is the EXACT integrated change over the interval (adaptive Dopri5), not a first-order
  rate*dt like a typical dynamic step. Because dynamic deltas are SUMMED across writers and the ODE increment
  is nonlinear in the field, a second dynamic writer of the same output field would corrupt the result
  -- the controller must solely own its output fields.
- INPUTS ARE FROZEN during the solve. vector_field closes over `inputs` packed once from the pre-step
  state; the driver fields do not evolve inside [0, dt]. This is the ODE-scale quasistatic assumption
  and is easy to miss.
- 'PAPER vs CODE contradiction on where the input enters. Paper (p. 10): dg_i/dt = phi(sum_j W_ij g_j
  + b_i) + I_i - k_i g_i -- the sensed input I_i is ADDITIVE and OUTSIDE the sigmoid. Code''s closest
  subclass GeneNetworkConnectionist puts the input INSIDE the sigmoid (sigma(W_gene@g + W_in@u + b)).
  The abstract base is agnostic (vector_field is abstract), but a reimplementer matching the paper''s
  forcing term would build a different circuit than the code ships. SOURCE WINS.'
- 'hidden_size = 0 allocates NO latent field: state_writes then returns only output_specs, and the hidden
  block is a width-0 array. hidden_size < 0 raises ValueError in __init__.'
- 'Solver magic constants a reimplementer must match to reproduce trajectories: Dopri5, PIDController(rtol=1e-4,
  atol=1e-6), dt0=dt (initial step = whole macro-step), SaveAt(t1=True) (only the endpoint is saved).'
- Scalar vs vector output packing. _width returns 1 for a scalar spec (shape ()); on unpacking, a scalar
  output delta is squeezed to chunk[:, 0] (per-cell 1-D) while a shaped output is reshaped to (n_cells,
  *spec.shape). Packing/unpacking is in DECLARATION ORDER of the specs -- order is load-bearing.
- hidden and outputs are integrated as ONE coupled system (concatenated into y); cross-regulation between
  latent and output genes happens inside vector_field, not field-by-field.
- 'The `key` argument is accepted for the uniform step interface but unused (del key): the step is deterministic.
  The ODE is integrated for ALL cell slots including dead ones; the Model''s _accumulate_dynamic alive-masks
  dead slots to zero afterward, so the step does not mask itself.'
verdict: new
of: null
why: "Closest registered contract is `signal` (lateral/interaction, set=neuron), NOT `decay` or\n`pacemaker`:\
  \ `signal` is the only other registered per-agent internal-state ODE of the same\nfiring-rate / recurrent-network\
  \ class. It integrates\ntau*dv_i/dt = -v_i + b_i + sum_e W_e*phi(v_pre(e)) on a neuron; this integrates\n\
  dg/dt = sigma(W_gene@g + W_in@u + b) - gamma*g on a cell. The reaction laws rhyme, and a skeptic\nis\
  \ right to name `signal` here (the earlier draft that called decay/pacemaker \"closest\" was wrong).\n\
  But `signal`'s typed IDENTITY is a CONNECTOME morphism, and no widening of it can absorb this ODE\n\
  without dissolving that identity. Three signature facts make them different contracts, not two\nimplementations\
  \ of one:\n  1. COUPLING TOPOLOGY. `signal`'s regulatory weights live on a first-class `synapse` EDGE-SET\n\
  \     read through the pre/post incidence maps (INPUTS=[neuron,synapse], MAPS=[pre,post]); it\n    \
  \ gathers phi(v) along `pre` and scatters current along `post`. Its own docstring: \"the maps\n    \
  \ are PART of the signature\". `regulate` has NO edge-set and NO map -- W_gene/W_in are dense\n    \
  \ per-operator parameters and each cell integrates its OWN network in isolation (maps=[]),\n     with\
  \ ZERO cell-to-cell coupling. It is intracellular, not lateral. To make `signal` express\n     this\
  \ you must invent a per-cell all-to-all self-synapse-set plus input pseudo-nodes for the\n     drive\
  \ u -- which changes the SET it runs on and empties its MAPS, the exact connectome\n     identity the\
  \ dispute's own what_would_settle_it says must not break.\n  2. INTEGRATION CONTRACT. `signal` EMITs\
  \ velocity (an instantaneous dv/dt) and the ENGINE\n     integrates the voltage coordinate. `regulate`\
  \ SELF-SOLVES the whole macro-step internally\n     (adaptive Dopri5 + PIDController, dt0=dt) and returns\
  \ the EXACT integrated increment\n     y(dt)-y0 as a sparse delta. Widening `signal` to self-solve would\
  \ break its\n     engine-integration identity -- again the disqualifying condition in what_would_settle_it.\n\
  \  3. FORCING INPUT. `regulate` reads sensed DRIVER fields u (chemical/mechanical) held FIXED over\n\
  \     the solve and entering as W_in@u; `signal` has no fixed external forcing term, only\n     recurrent\
  \ presynaptic input. (The nonlinearity also sits differently: `signal` applies phi\n     to the presynaptic\
  \ value before summing, W*phi(v); this applies sigma to the summed drive,\n     phi(W@g).)\nSo `signal`\
  \ could only \"cover\" this by changing its set, emptying its maps, dropping its\nedge-set, adding a\
  \ forcing read, and flipping engine-integration to self-solve -- five signature\nchanges that turn `signal`\
  \ into a meaningless umbrella and break every existing connectome user.\nPer what_would_settle_it, \"\
  if that mismatch forces a distinct operator -> new stands.\" It does.\nHence `new`.\nThe more distant\
  \ near-neighbours a maximalist might still reach for: `decay` (fields) literally\ncontains this ODE's\
  \ -gamma*g term, but decay is an elementwise single-field in-place evaporation\n(c <- max(0, c - k*dt))\
  \ with no production, no cross-field coupling, no input and no memory -- the\ndegradation would be one\
  \ line of a network it cannot name. `pacemaker` (a per-cell temporal\nSOURCE) shares \"emits a per-cell\
  \ time-varying signal\" but owns ONLY timing: an open-loop clock\nwith no state feedback, sensed drive\
  \ or coupling, so a closed-loop regulated circuit is not a\npacemaker. `sense`/`chemotax` couple a field\
  \ to agent MOTION, not to internal chemistry.\nThis entry is the ABSTRACT base carrying the `regulate`\
  \ contract (state_reads/state_writes + the\nmacro-step integration machinery + an abstract vector_field);\
  \ its subclasses\nGeneNetworkConnectionist, GeneNetworkMWC and NeuralODE are interchangeable IMPLEMENTATIONS\
  \ of this\none contract, differing only in the reaction law -- the several-implementations-per-contract\
  \ shape\na mature vocabulary should show, so each should carry implementation_of: regulate.\nClassification:\
  \ kind=exchange (a SET transduces its own fields; Plexus's FieldUpdate is \"no set\ninvolved\", pure\
  \ grid dynamics) and maps=[] (unlike sense/chemotax there is no spatial gather and\nno neighbour edge\
  \ -- each cell integrates independently).\n"
contract:
  name: regulate
  kind: exchange
  family: fields
  set: cell
  inputs:
  - cell
  outputs:
  - cell
  reads:
  - drive
  - gene
  writes:
  - gene
  maps: []
status: validated
module: src/plexus/operators/candidates/jax_morph_odecontroller.py
test: tests/test_jax_morph_odecontroller.py
evidence:
  oracle_run: diff_odecontroller
  diff_metric: |
    D_max -- the maximum ABSOLUTE deviation, in dimensionless gene-concentration units, over
    every recorded frame (the seeded initial condition + all 21 macro-steps = 22 frames), every
    LIVE cell (the reference alive mask; 4 live of 8 capacity), and every evolving gene component
    (the hidden latent gene concatenated with the two output genes, reference declaration order
    [gene_hidden, g_out0, g_out1] -- packing order is load-bearing), between the per-frame `gene`
    block the Plexus engine records while running the `regulate` operator (implementation
    ode_generic, the ODEController BASE integration machinery) and the jax-morph
    GeneNetworkConnectionist reference trajectory y_uniform. Both sides start from the IDENTICAL
    initial condition (all genes 0), the IDENTICAL frozen per-cell drive u = [0.8, 0.3], and the
    IDENTICAL 3-gene circuit (W_gene 3x3, W_in 3x2, b, gamma=1.0, algebraic sigmoid); both
    integrate the same autonomous ODE dg/dt = sigma(g@W_gene^T + u@W_in^T + b) - gamma*g over each
    dt=1.0 macro-step with an error-controlled adaptive Dopri5 solver at rtol=1e-4, atol=1e-6. The
    Plexus operator SELF-SOLVES the whole step and returns the mean-rate delta (y_end-g0)/dt; the
    engine's first-order integration (gene += dt*delta) recovers the endpoint y(dt), so D_max
    scores the operator AS THE ENGINE RUNS IT (float32 both sides). Frame 0 is asserted to be the
    initial condition on both sides (engine IC max|gene| = 0), fixing the alignment
    engine_frame_k == reference s_k.
    evidence.value = max(D_max over that uniform engine trajectory, D_max_distinct), where
    D_max_distinct is the SAME diff for a corroborating run that gives each of the 4 cells a
    DIFFERENT frozen drive (the reference u_distinct) through the real operator + real engine
    integration: because the operator carries maps=[] (no cell-to-cell edge), the four per-cell
    trajectories must each match the reference independently -- any leaked coupling would show
    here but is invisible in the shared-drive uniform run. This directly exercises the
    intracellular / maps=[] identity that separates `regulate` from `signal`.
    oracle_run holds reference.npz + summary.json; the engine evidence folder is
    log/atlas/odecontroller/ (acted ledger: regulate acted 19/21 calls -- the last frames sit on
    the fixed point where the delta rounds to 0 -- seed_state 1/1, inert_operators [],
    valid_evidence true). The scalar is computed by Atlas_jax_morph/diff_odecontroller.py ->
    _oracle/runs/diff_odecontroller/diff.json.
  threshold: |
    D_max <= 5.0e-3 (absolute, gene-concentration units). Both sides integrate the SAME
    autonomous ODE with an error-controlled adaptive Dopri5 at rtol=1e-4, atol=1e-6, differing
    ONLY in the step-size CONTROLLER (the reference diffrax PIDController vs the operator's
    elementary I-controller safety*err^-0.2) and the float32 backend (torch vs JAX). Two such
    integrations have a global error of a few*rtol each (~1e-4 for O(1) states), so their
    difference is bounded by the sum ~1e-3, and the contractive circuit (gamma=1.0, |W| O(1))
    does not amplify it across the 21 steps -- once the trajectory reaches its O(1) fixed point a
    single full-dt Dopri5 step passes the error test on both sides and the two become
    bit-identical, so the difference lives only in the ~5 transient frames. 5e-3 is a few times
    that summed global-error bound with float32 margin, yet still 10x below the >=0.05 deviation
    any STRUCTURAL/biology error produces: the logistic vs algebraic sigmoid moves the fixed point
    by ~0.05-0.1; the paper's additive-outside-sigmoid forcing vs the code's W_in@u INSIDE it
    shifts the trajectory by O(0.1); returning the integrated value instead of the mean-rate delta
    double-applies and diverges by O(1); dropping the occupancy mask or mis-ordering
    hidden/outputs moves components by O(0.1). The band between a correct adaptive integration
    (~1e-4) and any wiring/biology bug (>=0.05) is empty and 5e-3 sits in it. A looser bound
    (1e-1) would pass a wrong-sigmoid circuit in some regimes; a tighter one (1e-5) risks flaking
    on the legitimate cross-controller/float32 difference rather than on a defect.
  value: 2.562999725341797e-06
  passed: true
disputed:
  by: skeptic
  was: new
  claimed: refinement
  evidence: 'signal.py:36-80 is a registered per-node internal-state ODE: EMIT=velocity, tau*dv/dt=-v+b+sum
    W*phi(v_pre), tag ''recurrent'' — same firing-rate-RNN class as GeneNetworkConnectionist dg/dt=sigma(W*g+W_in*u+b)-gamma*g
    (ode.py:277). The why: never names signal, wrongly calls decay/pacemaker the closest contracts.'
  what_would_settle_it: Can signal's typed contract express GeneNetworkConnectionist by supplying a per-cell
    self-loop synapse-set + input pseudo-nodes and self-integration? If it widens to a maps=[], field-forced,
    self-solved cell ODE without breaking its connectome/engine-integration identity → refinement of signal;
    if that mismatch forces a distinct operator → new stands.
state_io_notes:
  reads:
  - driver_inputs
  - gene_state
  - hidden_state
  writes:
  - gene_state
  - hidden_state
signature_note: the hidden latents are part of the `gene` block, not a second state block; the record
  listed a `hidden` block the code does not have.
