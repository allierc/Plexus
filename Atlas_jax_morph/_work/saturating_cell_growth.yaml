id: saturating_cell_growth
order: 9
raw_name: SaturatingCellGrowth
raw_kind: step (SimulationStep)
code_path: papers/jax-morph/jax_morph/physics/growth.py:L23
paper_section: p. 9 Methods "Cell Growth" eq. Ri(t+dt)=min(Ri(t)+dR, Rmax); restated p. 14
summary: Dynamic step. For each cell it grows the per-cell radius toward the module target max_radius
  by the exact closed-form flow of a saturating (von Bertalanffy) law dr/dt = k*(1 - r/R), where the rate
  k is read per cell from the growth_rate state field. It returns a sparse, dt-scaled delta on radius
  only; growth is fastest at small r and relaxes to zero as r approaches max_radius.
equations: "Code (authoritative) -- the exact flow of the linear ODE dr/dt = k*(1 - r/R):\n  decay = exp(-growth_rate\
  \ * dt / max_radius)\n  dr    = (max_radius - radius) * (1 - decay)\nreturned as state.deltas(radius=dr).\
  \ Symbols: r = per-cell radius (state field radius);\nk = per-cell growth_rate (state field, default\
  \ 0); R = max_radius (module param);\ndt = macro-step duration. As dt grows the increment saturates\
  \ at (R - r), so r\napproaches but never overshoots R for k >= 0, and no min/clamp is used.\nPaper (Methods,\
  \ stated twice): Ri(t+dt) = min(Ri(t) + dR, Rmax) -- a CONSTANT\nincrement dR per step (linear growth)\
  \ with a hard min clamp at Rmax. The code does\nNOT implement that constant-rate-plus-min law; it implements\
  \ the saturating\nexponential relaxation above. Per the loop rule the code wins; the disagreement is\n\
  recorded under surprises.\n"
params:
  max_radius: asymptotic_target_size
state_io:
  reads:
  - radius
  - growth_rate
  writes:
  - radius
surprises:
- 'Paper/code contradiction (the most important thing here). The paper specifies

  CONSTANT-rate linear growth with a hard min clamp -- Ri(t+dt)=min(Ri+dR,Rmax),

  Methods "Cell Growth" twice, plus the intro "cells grow at a fixed rate until

  reaching a maximum radius". The code implements a SATURATING von Bertalanffy law

  dr/dt=k(1-r/R) with NO clamp (saturation is intrinsic). Different trajectories: the

  paper radius grows at constant speed then stops abruptly at Rmax; the code radius

  decelerates smoothly toward R and asymptotes. A reimplementer following the paper

  would produce the wrong dynamics.

  '
- 'The growth rate is NOT a constructor parameter. growth_rate is a per-cell STATE

  FIELD (module-level spec GROWTH_RATE, heritable=True, default 0.0), designed to be

  rewritten each macro-step by an upstream controller (gene network / MLP) so

  gradients flow through it from a morphology objective. Default 0 means no growth

  unless a rate is supplied. The sole constructor param is max_radius (default 1.0; a

  jax.Array makes it a traced, optimizable target).

  '
- 'The increment is the EXACT flow of the linear law, not forward Euler. A naive Euler

  reimplementation dr = k*(1 - r/R)*dt would differ numerically and can overshoot for

  large dt; the closed form dr=(R-r)*(1-exp(-k*dt/R)) is unconditionally stable and

  monotone for any dt and any k >= 0.

  '
- 'dt-scaling is baked into the returned delta (the exponential already contains dt).

  This is a DYNAMIC step: the model sums its delta with any other radius writers and

  does NOT re-scale by dt afterward. The exact-flow property holds only while this is

  the sole dynamic writer of radius; with a co-writer it degrades to a stable

  operator-split contribution (still additive).

  '
- 'GROWTH_RATE is exported from the module so a separate control step can declare the

  SAME spec and remain merge-compatible; heritable=True means a daughter inherits the

  mother''s growth propensity on division unless a controller overwrites it.

  '
verdict: refinement
of: cell_grow
implementation_of: cell_grow
why: "Refinement of `cell_grow`, the registered growth primitive. Same biology -- a cell grows\ntoward\
  \ a maximum size by a SATURATING growth law -- so this is NOT `new`: promoting a second\ngrowth contract\
  \ would inflate the yield the ledger exists to measure. But it does not fit\ncell_grow's REGISTERED\
  \ signature, so it is not a clean `alias`/drop-in implementation either;\nthe signature must WIDEN,\
  \ and a refinement nobody costed is a breaking change.\n\nWHAT WIDENS (the typed signature fields):\n\
  \n- kind: structural -> field (delta-emitting). Registered cell_grow is `structural`\n  (EMIT=None,\
  \ forward() returns {}): it advances a rest-VOLUME multiplier grow_V by a\n  logistic law and REALIZES\
  \ it by waking dormant MPM reserve particles in place. This\n  mechanism is a DYNAMIC per-cell relaxation\
  \ that emits an integrable delta on `radius`\n  (dr = (R-r)(1-exp(-k*dt/R))) and mutates no state directly.\
  \ Admitting it flips the kind,\n  and that BREAKS the invariant every current cell_grow user relies\
  \ on -- that growth is\n  structural and contributes NOTHING to the dynamic-phase delta accumulation.\
  \ Any co-writer\n  of the size field must now operator-split with growth.\n\n- outputs / writes: {}\
  \ + grow_V + child particle occ  ->  an additive delta on `radius`, a\n  geometric size scalar carried\
  \ by a point/soft-sphere cell. The realization is a scalar\n  radius, not MPM reserve particles, so\
  \ the contract can no longer REQUIRE an mpm_particle\n  `child` with a grow_reserve pool.\n\n- reads\
  \ / params: the growth RATE moves from a constructor scalar `rate` to a per-cell\n  HERITABLE STATE\
  \ FIELD `growth_rate` (default 0), read each macro-step so an upstream\n  controller (gene network /\
  \ MLP) can drive it and gradients flow back from a morphology\n  objective. That differentiable, per-cell,\
  \ controllable rate is the whole design point.\n\n- maps (growth law): generalizes from logistic-only\
  \ (dV/dt = rate*V*(1-V/target)) to a\n  family of saturating laws including the von Bertalanffy EXACT\
  \ flow used here\n  (dr/dt = k(1-r/R), integrated in closed form -- unconditionally stable, monotone,\
  \ no\n  min/clamp). This one is additive and breaks nothing.\n\nCLOSEST-CONTRACT check: cell_grow is\
  \ unambiguously the closest registered contract (the only\nother growth-family op is cell_divide, which\
  \ is TOPOLOGY, not size). Widening cell_grow does\nless violence than minting a new contract: cell_grow's\
  \ own contract already declares the\ndiscretisation swappable and the growth LAW the invariant, and\
  \ a scalar radius on a\npoint-cell is exactly 'another discretisation' of the same cell-growth biology\
  \ -- so it\nbelongs to the SAME contract, refined, not a fresh one.\n\nSOURCE-vs-PAPER (recorded in\
  \ surprises, rule 5): the paper's Methods state constant-rate\nlinear growth with a hard clamp, R(t+dt)=min(R+dR,\
  \ Rmax); the CODE implements the saturating\nexponential relaxation above with no clamp. The code wins;\
  \ the disagreement is a genuine\npaper/code contradiction, not a normalization choice, and it does not\
  \ change the verdict --\neither reading is still cell growth toward a maximum size.\n"
contract:
  name: cell_grow
  kind: field
  family: growth
  set: cell
  inputs:
  - cell
  outputs:
  - cell
  reads:
  - radius
  - growth_rate
  writes:
  - radius
  maps:
  - growth_law = von Bertalanffy exact flow dr = (max_radius - radius)*(1 - exp(-growth_rate*dt/max_radius)),
    the closed-form integral of dr/dt = k*(1 - r/R); saturating, monotone, unconditionally stable for
    any dt, no min/clamp
  - realization = per-cell scalar radius on a point / soft-sphere cell (NO MPM reserve particles); dt-scaling
    is baked into the returned delta, which is summed with any other radius writers (stable operator-split
    contribution)
  - rate source = per-cell heritable state field growth_rate (default 0.0), rewritten each macro-step
    by an upstream controller so gradients flow through it; the sole constructor param is max_radius (a
    traced, optimizable target)
