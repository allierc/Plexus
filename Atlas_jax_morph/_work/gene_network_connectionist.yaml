module: src/plexus/operators/candidates/jax_morph_gene_network_connectionist.py
test: tests/test_jax_morph_gene_network_connectionist.py
evidence:
  oracle_run: diff_gene_network_connectionist
  diff_metric: |
    max over {frame 0..20, cell 0..5, gene 0..4} of |G_eng - G_ref|, in float32 gene-concentration
    units. G_ref = the reference GeneNetworkConnectionist Dopri5 trajectory
    (_oracle/runs/diff_gene_network_connectionist/reference.npz['gene']; diffrax PIDController
    rtol=1e-4 atol=1e-6). G_eng = the Plexus ENGINE's recorded per-cell `gene` block from
    graphs_data/atlas/gene_network_connectionist/simulation.zarr, where regulate:connectionist
    self-solves each macro-step with fixed-step RK4 (substeps=64) and returns (g(dt)-g0)/dt so the
    engine's g += dt*delta recovers g(dt). Both sides integrate the byte-identical vector field
    dg/dt = sigma_alg(g @ W_gene^T + u @ W_in^T + b) - gamma*g, with sigma_alg(x) = 0.5 + 0.5*x/
    sqrt(1+x^2), from an identical seeded g0 (5-vector), a frozen u (2-vector) and identical params,
    all emitted by ONE generator (_gen_gene_network_connectionist.py) so the two sides cannot drift
    apart. Arrays are 21 frames x 6 cells x 5 genes; frame k = g(k*dt); this is a full end-to-end
    run_spec.py engine trajectory, NOT an operator-level probe. Driver
    Atlas_jax_morph/diff_gene_network_connectionist.py; artefact
    _oracle/runs/diff_gene_network_connectionist/diff.json.
  threshold: |
    5.0e-3 (max-abs, gene-concentration units). Chosen BEFORE the run from integrator physics, not
    from the observed number. Both sides integrate the identical vector field from an identical IC,
    so the only admissible disagreement is the integrator gap (fixed-step RK4-64 vs adaptive Dopri5
    rtol=1e-4) plus cross-backend float32 rounding. The reference rtol=1e-4 over the O(8.8) gene
    magnitudes bounds per-step truncation at ~1e-3 and it does NOT amplify: at large drive the
    algebraic sigmoid saturates (sigma'->0), the Jacobian tends to -diag(gamma), a contraction that
    damps error toward g* ~ sigma/gamma ~ 10. 5e-3 gives ~5x margin over that a-priori ceiling yet
    stays ~2 orders below the O(0.5-1) divergence any real mechanism error makes within a few frames
    (logistic instead of the algebraic sigmoid; input added OUTSIDE the sigmoid per the paper vs
    inside via W_in; a decay sign flip). A tighter 1e-3 would risk a false fail from the honest
    integrator gap -- the criterion-no-valid-config-can-meet trap. It certifies formula-identity,
    not a fitted tolerance.
  value: 6.67572021484375e-06
  passed: true
  result: |
    PASS by ~3 orders of magnitude. max|dev| = 6.68e-6 (float32 rounding, not Dopri5 truncation) <<
    threshold 5e-3, so the verdict does not hinge on the threshold choice. The signature confirms it
    is integrator/rounding-limited, not a reaction-law error: frame-0 deviation is EXACTLY 0 (the
    shared seeded IC), grows MONOTONE to 4.8e-6 by the final frame, and the max sits at frame 17,
    cell 0, gene 4 -- the largest gene (~8.4), where float32 rounding is largest (relative 8.0e-7).
    Final cell-0 genes agree component-wise to ~1e-6 (ref [7.3356, 0.3709, 2.9444, 1.3693, 8.7943]
    vs eng [7.3356, 0.3709, 2.9444, 1.3693, 8.7942]). INDEPENDENTLY reproduced by this differ in
    pure numpy (oracle venv, no torch): a fine RK4(4096) reproduces reference.npz to 3.1e-6 (the
    reference IS a genuine integration of the stated field), and an RK4-64 engine-replica matches the
    reference to 3.1e-6 in float64 -- corroborating the torch number. The pre-registered
    discriminators, run in that same numpy harness, blow past the threshold: the WRONG logistic
    sigmoid lands 1.31 from the reference and the paper's input-OUTSIDE-sigmoid form lands 2.38
    (~2.5 orders over 5e-3), so the metric genuinely catches the SOURCE-WINS mechanism choices.
    Acted ledger checked FIRST (log/atlas/gene_network_connectionist/diag.json): regulate 20/20
    calls acted, moved 0.823 (the ODE really evolved the gene block), seed_state 1/1,
    inert_operators [], valid_evidence true -- the metric is on a live operator, not an inert one.
    Score driver _oracle/runs/diff_gene_network_connectionist/diff.json; engine evidence
    log/atlas/gene_network_connectionist/.
