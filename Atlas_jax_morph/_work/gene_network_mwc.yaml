id: gene_network_mwc
order: 3
raw_name: GeneNetworkMWC
raw_kind: step (ODEController)
code_path: papers/jax-morph/jax_morph/control/ode.py:L364
paper_section: 'eq. (4), p. 16 (Methods: "Gene Networks"); first stated p. 10 lines 534-536'
summary: A per-cell dynamic controller (ODEController subclass) whose evolving state is a vector of gene
  concentrations. Over one macro-step it integrates a gene-regulatory ODE with diffrax (Dopri5, adaptive)
  holding the sensed driver inputs fixed, and writes back the sparse DELTA of each output (and optional
  latent) gene field. Each gene evolves as saturating production minus first-order decay, but the regulatory
  drive is a THERMODYNAMIC log-occupancy (MWC / statistical-mechanics) form -- a sum of signed interaction
  weights times ln(1 + concentration/threshold) -- rather than the linear W*g drive the paper's eq. (4)
  specifies.
equations: "Per cell, for gene i (n_gene = hidden_size + out_size), with fixed driver inputs u (n_in):\n\
  \n  F_i = F0_i\n        + sum_j H_gene_ij * ln(1 + g_j / K_gene_ij)     # gene -> gene log-occupancy\
  \ drive\n        + sum_k H_in_ik  * ln(1 + u_k / K_in_ik)         # input -> gene log-occupancy drive\n\
  \  dg_i/dt = rho_i * sigmoid(F_i)  -  g_i / tau_i          # saturating production minus decay\n\nwhere\
  \ (code, ode.py:449-475):\n  - g_j = max(evolving_j, 0), u_k = max(inputs_k, 0)   (clamped non-negative\
  \ before occupancy)\n  - rho   = exp(log_rho)   maximum production rate per gene\n  - tau   = exp(log_tau)\
  \   lifetime per gene (degradation rate k_i = 1/tau_i)\n  - K_gene= exp(log_K_gene), K_in = exp(log_K_in)\
  \   half-occupancy concentration thresholds\n  - sigmoid = jax.nn.sigmoid  (logistic 1/(1+e^-x))\n \
  \ - the occupancy ratio g/K is capped at finfo.max before log1p (overflow guard)\n  - DECAY uses the\
  \ RAW evolving_i (not the clamped g_i); production uses the clamped g_i.\n\n__call__ integrates dy/dt\
  \ = vector_field over [0, dt] (Dopri5, PIDController rtol=1e-4 atol=1e-6,\ndt0=dt), then returns state.deltas(...)\
  \ = y(dt) - y(0) for the hidden field and each output field.\n\nPAPER (eq. 4, p. 16 / p. 10) instead\
  \ specifies a CONNECTIONIST LINEAR drive:\n  dg_i/dt = phi( sum_j W_ij g_j + b_i ) + I_i - k_i g_i\n\
  with phi a unit-max sigmoid, W_ij linear couplings, b_i basal rate, I_i an input forcing ADDED\nOUTSIDE\
  \ the sigmoid, and k_i the degradation rate. The code's GeneNetworkConnectionist\n(ode.py:202) implements\
  \ that linear form; GeneNetworkMWC is a distinct thermodynamic variant."
params:
  input_specs: 'input_field_binding: static tuple of driver-field specs (sensed chemicals, stress, ...)
    held fixed during integration; sets n_in and the fields read as forcing u'
  output_specs: 'output_field_binding: static tuple of observed gene-field specs that are the readout
    genes (division propensity, secretion / cadherin rates); sets out_size'
  hidden_size: 'latent_regulator_count: number of hidden-state genes with no external readout that co-evolve
    and regulate every gene; keyword-only, default 0 (0 = pure-output circuit, no {tag}_hidden field allocated)'
  log_rho: 'max_production_rate (log-space): rho = exp(log_rho), the saturating ceiling of each gene''s
    production term rho*sigmoid(F)'
  log_tau: 'degradation_timescale / molecule_lifetime (log-space): tau = exp(log_tau); linear decay g/tau,
    i.e. paper rate k = 1/tau'
  F0: 'basal_activation_bias: per-gene additive drive inside the sigmoid (paper b_i); sets basal expression
    when all interactions are zero (sigmoid(F0))'
  H_gene: 'gene_coupling_strength (signed): (n_gene,n_gene) regulatory weights; sign = activating(+)/inhibitory(-),
    magnitude scales the ln(1+g/K) occupancy; diagonal allows self-regulation'
  log_K_gene: 'gene_binding_threshold (log-space): K_gene = exp(...), (n_gene,n_gene) half-occupancy concentration
    for each regulator gene j acting on gene i'
  H_in: 'input_coupling_strength / field_sensitivity (signed): (n_gene,n_in) weights coupling each sensed
    driver to each gene through its log-occupancy'
  log_K_in: 'input_binding_threshold (log-space): K_in = exp(...), (n_gene,n_in) half-occupancy concentration
    for each driver input k on gene i'
  tag: 'state_field_namespace: string prefix for the latent state field name ("{tag}_hidden"); default
    "gene" -- keeps multiple gene circuits'' hidden fields distinct'
state_io:
  reads:
  - 'input_specs (declared via state_reads()): the fixed driver fields u for this macro-step'
  - output_specs (effective, read in __call__ as the ODE initial condition y0 -- current gene concentrations)
  - '{tag}_hidden (effective, only when hidden_size>0 -- current latent gene concentrations)'
  writes:
  - '{tag}_hidden : StateFieldSpec shape (hidden_size,), only when hidden_size>0 -- sparse DELTA of latent
    genes'
  - 'each output_spec : sparse DELTA of that output gene over dt (DYNAMIC step; deltas targeting the same
    field are summed by the integrator)'
surprises:
- 'PAPER-VS-CODE CONTRADICTION (source wins): the paper (eq. 4, p. 16 and p. 10) only ever states the
  LINEAR connectionist drive phi(sum_j W_ij g_j + b_i) + I_i - k_i g_i inspired by Hiscock [24]. The MWC
  log-occupancy drive F_i = F0 + sum H*ln(1+g/K) implemented here is NOT in the paper; it is a code-only
  thermodynamic (Monod-Wyman-Changeux-style) reparameterization. A reimplementer working from the paper
  would build the connectionist form (which exists separately as GeneNetworkConnectionist) and never produce
  this class.'
- 'INPUT PLACEMENT differs from the paper even structurally: the paper adds the sensed forcing I_i OUTSIDE
  the sigmoid (phi(...) + I_i); here every input enters INSIDE the drive via H_in*ln(1+u/K_in) and is
  passed through the sigmoid. Saturation therefore couples inputs and genes, unlike eq. (4).'
- 'Two DIFFERENT sigmoids live in the same file: GeneNetworkMWC uses jax.nn.sigmoid (logistic), but the
  sibling GeneNetworkConnectionist uses _rescaled_sigmoid (algebraic x/sqrt(1+x^2) rescaled to [0,1]).
  Reusing the algebraic helper here would silently change dynamics.'
- Positive parameters (rho, tau, K) are stored in LOG space and exponentiated by _positive_from_log, which
  CLIPS the log to [log(tiny), log(max) - log(4.0)]. The "- log(4.0)" is a magic headroom constant leaving
  room for subsequent arithmetic before overflow; passing raw rho/tau/K instead of their logs would be
  wrong by an exp.
- 'DEFAULT (all params None -> zeros) is NOT a silent circuit: log-zeros give rho=tau=K=1, H=0, F0=0,
  so production = 1*sigmoid(0) = 0.5 and decay = g, driving every gene to a steady state of 0.5. "Inert"
  in the docstring means zero-INTERACTION, not zero-dynamics.'
- Non-negativity is enforced by clamping genes and drivers to >=0 ONLY inside the occupancy terms (ln(1+.)
  would NaN on negatives). The DECAY term uses the raw (possibly negative) evolving state, not the clamped
  value -- an intentional asymmetry (raw decay is restorative toward 0) a reimplementer might "fix" and
  break.
- 'Overflow guard: the ratio g/K is capped at finfo.max via jnp.minimum before log1p, documented (ode.py:465-466)
  as preventing a mixed-sign interaction row from forming (+inf)+(-inf)=NaN. Easy to omit and get NaNs
  only on extreme inputs.'
- The step is DYNAMIC and returns a SPARSE DELTA (y(dt) - y(0)), not a full updated state. Inputs u are
  held FIXED across the whole diffrax integration (closed over in the ODETerm lambda) -- gene concentrations
  evolve, sensed drivers do not. Returning a full new state, or letting u evolve, would both be wrong
  per the macro-step contract.
- 'H_gene is a full (n_gene,n_gene) matrix INCLUDING the diagonal, so a gene may regulate itself through
  ln(1+g_i/K_gene_ii). n_gene = hidden_size + out_size, and output genes are ordered so the last output
  is the readout consumed downstream (paper: last output gene = division propensity, last Nc = secretion
  rates) -- ordering of output_specs is semantically load-bearing, not documented in this class.'
- 'IMPLEMENTATION vs ORACLE (Plexus torch operator, not a source surprise, flagged for the differ): the
  torch operator returns the vector field dg/dt on the cell gene block (EMIT=velocity, INTEGRAND=gene)
  and the ENGINE integrates it one explicit-Euler step per tick, whereas the reference self-solves with
  an adaptive Dopri5 sub-solve over the same dt and returns y(dt)-y0. That is an Axis-A integration difference,
  NOT a difference in the vector field f, and it WILL show up in a trajectory differ; to compare the biology
  alone, evaluate vector_field(evolving, inputs) at t=0 against the reference vector_field on matched
  state.'
verdict: new
of: null
implementation_of: regulate
why: 'No registered contract expresses a per-cell INTERNAL regulatory dynamical system: a heritable

  gene-state vector whose autonomous per-cell ODE is integrated over one macro-step -- reading the

  cell''s own gene concentrations plus a fixed snapshot of SENSED external fields, and emitting the

  sparse gene-expression deltas that division / secretion / adhesion steps read. This class is the

  THERMODYNAMIC (MWC / statistical-mechanics log-occupancy) implementation of that contract: its

  vector field is dg/dt = rho*sigmoid(F0 + sum H*ln(1+g/K)) - g/tau. Its two siblings in the same

  file -- GeneNetworkConnectionist (linear W*g drive) and NeuralODE (black-box MLP vector field) --

  share the SAME integration and I/O contract and differ ONLY in the vector field f. This is the

  Morse/SoftSphere/Hertzian pattern: the three ODEController subclasses collapse to ONE contract

  `regulate` with three implementations, NOT three contracts -- so `implementation_of: regulate`,

  and the phase yields one new contract, not an inflated three. The verdict is `new` (not

  alias/refinement) only because `regulate` is absent from the frozen 42 and therefore cannot be an

  `of:` target until it is promoted; R4 rejects a non-registered `of:`. The closest REGISTERED

  contracts all lose their biology if widened to admit this. `signal` (lateral/interaction) is a

  recurrent nonlinear first-order ODE network -- the same -decay + bias + saturated-drive skeleton

  -- but its recurrence runs BETWEEN nodes across a fixed connectome EDGE-SET (INPUTS neuron/synapse,

  MAPS pre/post, REQUIRES edge_set); the gene circuit has NO edge set and no cross-cell coupling:

  H_gene is a dense WITHIN-cell gene->gene matrix applied independently per cell (vmap), and the

  environmental drive enters via H_in*ln(1+u/K_in) on sensed FIELDS, a term `signal` has no slot

  for. Widening `signal` to fit would make MAPS/edge_set optional and bolt on field sensing -- i.e.

  delete the connectome signalling that IS the contract for its only user. Other near-misses fail

  too: `sense` / `chemotax` (exchange/fields) read a field into cell state but carry no heritable

  internal state and no recurrent dynamics; `decay` is a bare first-order relaxation with no

  production and no coupling; `pacemaker` is a fixed-form autonomous clock with no sensed drive and

  no learnable regulatory matrix. Per rule 5 the SOURCE sets scope: this MWC log-occupancy drive is

  NOT in the paper (which states only the linear connectionist eq. 4), so it is a code-only

  thermodynamic variant recorded as the third implementation of the same biological role.

  '
contract:
  name: regulate
  kind: exchange
  family: fields
  set: cell
  inputs:
  - cell
  - drive
  outputs:
  - cell
  reads:
  - gene
  - drive
  writes:
  - gene
  maps: []
status: validated
module: src/plexus/operators/candidates/jax_morph_gene_network_mwc.py
test: tests/test_jax_morph_gene_network_mwc.py
evidence:
  oracle_run: diff_gene_network_mwc
  diff_metric: |
    value = max(metric_P, metric_A), gated on both adversarial dg batches being all-finite.
    The comparison is on the per-cell vector field f (the contract's only distinguishing content),
    NOT on a raw integrated trajectory, because f is shared by the three ODEController siblings and
    a trajectory diff would conflate f with the Axis-A integrator (engine explicit-Euler vs the
    reference's adaptive Dopri5).
      metric_P (trajectory, matched integrator): max over all (frame, cell, gene) of
        |g_engine - g_ref|, where BOTH sides integrate the SAME MWC field
        dg/dt = rho*sigmoid(F0 + sum_j H_gene*ln(1+g_j/K_gene) + sum_k H_in*ln(1+u_k/K_in)) - g/tau
        by ONE explicit-Euler step per macro-step (dt=1.0, 24 macro-steps) from an IDENTICAL g0,
        fixed drivers u0 and parameter set (float32). Units: gene concentration (dimensionless).
      metric_A (vector field, adversarial): max over two batches of |dg/dt_torch - dg/dt_jax|
        evaluated DIRECTLY at t=0 (no integration): (i) the main params on 6 corner-case cell
        states (negatives, zeros, near-zero, large positives, mixed signs) with matching drivers
        including a negative driver; (ii) an EXTREME param set (log_K at the float32 underflow clip
        so K~1.2e-38 and g/K overflows, plus mixed-sign large H) that forces the overflow guard and
        the (+inf)+(-inf)=NaN it prevents. Units: gene concentration per unit time.
    Computed by diff_gene_network_mwc.py score reading _oracle/runs/diff_gene_network_mwc/reference.npz.
    Measured: metric_P = 1.19e-07; metric_A = 9.54e-07 (main 4.77e-07, extreme 9.54e-07);
    both adversarial dg all-finite; value = 9.54e-07.
  metric_P_trajectory_max_abs: 1.1920928955078125e-07
  metric_A_vectorfield_max_abs: 9.5367431640625e-07
  diagnostic_dopri_vs_euler_one_step_gap: 0.48236727714538574
  threshold: |
    1.0e-4. It sits ~2 orders above the float32 accumulation floor for these O(0.1-1) magnitudes
    (the measured agreement is ~1e-6) yet ~4 orders BELOW both the vector-field scale (max|dg|~5-7)
    and, decisively, the reference's own Dopri5-vs-Euler one-macro-step integration gap (0.482):
    passing certifies the torch operator and the reference share the SAME vector field f while
    staying immune to the integrator difference a raw trajectory diff would mis-score. A looser 1e-2
    would still pass but would stop distinguishing f-agreement from a small drive-law error; a
    tighter 1e-8 is below float32 rounding and unmeetable by any correct implementation. Fixed
    before the run (diff_gene_network_mwc.py THRESHOLD constant), not after seeing the number.
  value: 9.5367431640625e-07
  passed: true
state_io_notes:
  reads:
  - gene_state (per-cell hidden + output gene concentrations, the ODE initial condition y0)
  - sensed_input_fields (the fixed quasistatic driver snapshot u; chemistry / mechanics, held fixed over
    dt)
  writes:
  - gene_state (per-cell concentration DELTAS for the hidden and output gene fields over dt)
  inputs:
  - sensed_input_fields
