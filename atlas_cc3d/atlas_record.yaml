    by: skeptic
    was: new
    claimed: null
    evidence: null
    what_would_settle_it: null
- id: surfacetracker
  order: 28
  raw_name: SurfaceTracker
  raw_kind: Plugin (SurfaceTrackerPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5382
  paper_section: 'Python spec class PyCoreSpecs.py:L5382 (one-line docstring stub, no physics). The

    actual interface is the INSTALLED C++ header

    include/CompuCell3D/CompuCell3D/plugins/SurfaceTracker/SurfaceTrackerPlugin.h

    (class decl L21; members lmf / maxNeighborIndex L25-27; field3DChange decl L45). The

    maintained store is the compiled CellG.surface (cpp/CompuCell.py:L527 getter, L589

    read-only setter). The SWIG-exposed sibling ClusterSurfaceTrackerPlugin

    (cpp/CompuCell.py:L10270, CellGChangeWatcher) is the closest readable analogue. NO

    extracted paper text exists; the Swat et al. (2012) Methods Cell Biol 110:325-366

    Surface-constraint discussion is UNREAD -- do not cite a page.

    '
  summary: 'Bookkeeping plugin, not an energy term. It maintains each cell''s scalar `surface`

    (a weighted boundary-site/link count) incrementally as the Potts solver accepts

    pixel copies, so that the Surface energy plugin has a live perimeter/area to

    penalise against its target. It changes no energy and writes only the derived

    per-cell `surface` field; from Python that field is read-only.

    '
  equations: "For a cell c occupying site set S_c, its surface is the lattice-weighted count of\nboundary\
    \ links from its own sites to sites NOT belonging to c, over a neighbour shell\nfixed by (neighbor_order\
    \ | max_neighbor_order | max_neighbor_distance):\n\n    surface(c) = sum_{p in S_c} sum_{n in N(p),\
    \ id(n) != c} w\n\nN(p) = the lattice-neighbour shell of site p up to maxNeighborIndex; id(n) = owner\
    \ of\nneighbour site n (0 = Medium, which counts as a non-c neighbour); w = lmf.surfaceMF,\nthe LatticeMultiplicativeFactor\
    \ for the lattice/order (header L27). On a square lattice\nat order 1, w = 1 and surface reduces to\
    \ the raw boundary-face count.\n\nMaintained INCREMENTALLY, never recomputed. On an accepted copy\
    \ that changes site pt\nfrom oldCell to newCell, the Potts solver invokes the watcher\nfield3DChange(pt,\
    \ newCell, oldCell) (header L45). Reconstructed update (canonical CC3D\nform; the .cpp does not ship,\
    \ see surprises) -- loop the shell of pt, touch ONLY the\ntwo owner cells:\n\n    if newCell == oldCell:\
    \ return                  # no-op self copy\n    for nIdx in 0 .. maxNeighborIndex:\n        nb =\
    \ boundaryStrategy.getNeighborDirect(pt, nIdx)\n        if nb.distance == 0: continue            \
    \  # off-lattice neighbour -> skip\n        nCell = cellField[nb.pt]\n        # pt is leaving oldCell:\n\
    \        if nCell != oldCell: oldCell.surface -= w  # a hetero face of oldCell is destroyed\n    \
    \    else:                oldCell.surface += w  # an internal face becomes exposed\n        # pt is\
    \ joining newCell:\n        if nCell != newCell: newCell.surface += w  # a new hetero face of newCell\
    \ appears\n        else:                newCell.surface -= w  # a hetero face becomes internal\n\n\
    Cost is O(shell size) per flip. maxNeighborIndex is derived from the XML param via\nBoundaryStrategy::getMaxNeighborIndexFromNeighborOrder\
    \ (the two order params) or\ngetMaxNeighborIndexFromDepth (the distance param) -- both symbols confirmed\
    \ in the\nlibCC3DSurfaceTracker.so symbol table, together with getNeighborDirect and the\nplugin's\
    \ own field3DChange / setNeighborOrder.\n"
  params:
    neighbor_order: 'surface_measurement_range -- the boundary neighbour-shell order counted into

      surface, given as a neighbour-ring index. Sets how "thick"/how-far-out the

      perimeter is measured; larger order gives a smoother, larger surface number.

      '
    max_neighbor_order: 'surface_measurement_range (alternate encoding) -- same measurement shell given

      as a maximum neighbour-ring index rather than an exact order.

      '
    max_neighbor_distance: 'surface_measurement_range (alternate encoding) -- same measurement shell given

      as a real lattice-distance cutoff rather than a ring index.

      '
  state_io:
    reads: "- cell_field (site -> cell id) over the configured neighbour shell of each\n  boundary site,\
      \ to decide which links are hetero-owner (Medium counts).\n- the two affected cells' current `surface`\
      \ values, for the incremental delta.\n- the pixel just changed (field3DChange argument): its old\
      \ and new owner ids.\n"
    writes: "- CellG.surface for the (at most two) cells touched by the accepted copy.\n  This field is\
      \ READ-ONLY from Python (set_surface raises AttributeError,\n  cpp/CompuCell.py:L589) -- only this\
      \ watcher may mutate it.\n- No energy delta; returns nothing to the Potts acceptance test.\n"
  surprises:
  - 'Only TWO cells are ever written, and this is the subtlest trap. A reimplementer who

    loops the neighbour shell and also updates each neighbour cell''s surface DOUBLE-COUNTS:

    a third-party neighbour (owner is neither oldCell nor newCell) keeps a hetero face with

    pt both before and after the flip, so its surface is INVARIANT. Correctness also rides

    on the two ELSE branches -- oldCell can GAIN surface (an internal face becomes exposed)

    and newCell can LOSE surface (a hetero face becomes internal) -- so "old loses, new

    gains" is only half the update.

    '
  - 'Off-lattice guard: getNeighborDirect returns a Neighbor whose .distance is 0 for a

    neighbour outside the lattice, and that entry MUST be skipped

    (`if nb.distance == 0: continue`). Without periodic wrap, cells at a wall count fewer

    neighbours and read a smaller surface near the boundary -- a deliberate edge effect the

    Surface energy inherits, not a bug.

    '
  - 'The three constructor params are MUTUALLY EXCLUSIVE: each setter nulls the other

    two (PyCoreSpecs.py:L5450-5451 / L5467-5468 / L5484-5485), and the XML emitter is an if/elif chain

    (L5407-5412) that writes exactly ONE element with priority neighbor_order >

    max_neighbor_order > max_neighbor_distance. Passing more than one is silently

    collapsed to the highest-priority set value, not an error.

    '
  - '`surface` is a WEIGHTED count (lattice multiplicative factors), not a raw

    boundary-link count -- so it differs numerically from NeighborTracker''s integer

    commonSurfaceArea and from a naive face count on non-square lattices. Its

    absolute scale also depends on the chosen neighbour order, so target_surface in

    the Surface energy plugin is only meaningful relative to the SAME order the

    tracker used. A reimplementer who counts raw faces gets a self-consistent but

    differently-scaled energy.

    '
  - 'Unlike its siblings PixelTracker and ClusterSurfaceTracker, the plain SurfaceTracker is

    NOT exposed as a Python/SWIG class (no getSurfaceTrackerPlugin, no entry in

    cpp/CompuCell.py) -- it is a pure internal core plugin, auto-loaded as the dependency of

    the Surface energy plugin rather than declared directly, so you cannot introspect its

    update from Python. Its compiled .cpp is likewise not installed in this env; only the

    INSTALLED HEADER (SurfaceTrackerPlugin.h) and the stripped .so ship. The four-branch

    field3DChange in `equations` is therefore the canonical CC3D form RECONSTRUCTED from the

    header members (lmf, maxNeighborIndex), the .so symbol table

    (getNeighborDirect / getMaxNeighborIndexFromNeighborOrder / ...FromDepth) and the

    ClusterSurfaceTracker analogue -- NOT a transcription of shipped source. The lmf weight

    and the neighbour-shell derivation are grounded in the header/symbols; the exact

    branch structure is inferred.

    '
  - 'Steerable (_PyCoreSteerableInterface): the neighbour order can be changed mid-run

    via steer(). Nothing in the spec recomputes already-stored surfaces on such a

    change, so a mid-run reorder would leave the incremental bookkeeping keyed to the

    old shell until each cell''s boundary next moves -- an ordering hazard.

    '
  - 'Category note for the algebra: like MomentOfInertia and NeighborTracker this is a

    CellGChangeWatcher -- a passive incremental-reduction observer invoked per

    accepted flip (field3DChange), NOT an energy term and NOT a scheduled stepper. It

    returns no delta and reads no field on a fixed clock; it keeps a derived per-cell

    scalar in sync with the pixel partition. Whether Plexus needs a "tracker /

    incremental observable" contract distinct from delta-returning operators is the

    open question (normalizer''s call).

    '
  - 'The consumer keeps its OWN order. The Surface ENERGY plugin (SurfacePlugin,

    PyCoreSpecs.py:L2225) carries its own neighbor_order, and its docstring

    (L2253) states "if SurfacePlugin is specified, its order overrides this" --

    so the energy term''s measurement shell can OVERRIDE the tracker''s. This is the

    mechanism that keeps target_surface and the tracked surface on the SAME order

    (the weighted-count / order-dependent-scale surprise above): consistency is

    enforced by that override coupling, not left to the two configs matching by hand. A reimplementer
    who lets tracker and energy

    diverge in order breaks the scale silently.

    '
  verdict: refinement
  of: aggregate
  implementation_of: aggregate
  why: "SurfaceTracker is the PERIMETER sibling of CenterOfMass and MomentOfInertia. All three are\nCellGChangeWatchers\
    \ that keep a per-cell derived scalar/tensor in sync with the pixel\npartition, return no energy /\
    \ acceptance delta, and expose a READ-ONLY readout the modeller\ncannot write (set_surface raises\
    \ AttributeError, cpp/CompuCell.py:L589 -- the same hard\nread-only enforcement CenterOfMass and MomentOfInertia\
    \ carry). CenterOfMass was aliased to\n`aggregate` (the first-moment reduction: children=lattice sites,\
    \ parent=cell, reduce site\npositions to a per-cell scalar/vector) and MomentOfInertia refined `aggregate`\
    \ (the\nsecond-moment reduction to a tensor). SurfaceTracker is the same children -> parent reduction\n\
    shape along the containment map -- reduce a cell's own sites onto ONE per-cell scalar,\nincrementally,\
    \ no delta -- so it is squarely the aggregate family and NOT a new contract:\nhence implementation_of:\
    \ aggregate, and the ledger must count aggregate ONCE across these\nsiblings, not thrice.\n\nIt is\
    \ a REFINEMENT and not an ALIAS because two signature fields must widen past the\nregistered centroid\
    \ signature (which writes cell.pos and reads only child positions +\noccupancy):\n(1) WRITES / OUTPUTS.\
    \ Centroid writes a first-moment mean position (a D-vector). SurfaceTracker\n    writes cell.surface\
    \ -- a weighted boundary-LINK COUNT (a perimeter/area scalar). A position\n    readout and a perimeter\
    \ readout are different output fields; the contract's writes must\n    admit a scalar boundary-count,\
    \ not only cell.pos or MomentOfInertia's shape tensor.\n(2) READS. This is the genuinely new edge,\
    \ and it is stronger than MomentOfInertia's. The\n    centroid reduction is a pure function of the\
    \ cell's OWN child positions; MomentOfInertia\n    additionally reads the parent's own cell.pos (the\
    \ COM it measures about). SurfaceTracker's\n    summand reads the OWNER of each neighbour-shell site\
    \ -- i.e. it reads the cell_id PARTITION\n    itself (is this neighbour c or non-c, Medium counting\
    \ as non-c) to decide whether a link is\n    a hetero face. So the reduction depends not just on the\
    \ child set's coordinates but on the\n    surrounding partition. That is an input edge no prior aggregate\
    \ variant has.\nWhat widening costs: any consumer or validator that assumed `aggregate` reduces a\
    \ child set to a\nposition (or an intra-cell tensor) and reads nothing but its own children must now\
    \ account for a\nreduction that (a) emits a scalar interface count and (b) reads the neighbour partition.\
    \ A\ndependency graph that treated aggregate as purely local-to-the-cell is no longer sound; that\
    \ is a\ncosted change, not a free add.\n\nTwo properties are IMPLEMENTATION, not contract, so they\
    \ do not add a fourth verdict axis:\n(a) surface is maintained INCREMENTALLY via the four-branch field3DChange\
    \ (old loses/gains,\n    new gains/loses, third-party neighbours invariant) rather than re-summed\
    \ -- an O(shell)\n    efficiency choice with the same result, exactly as CenterOfMass's incremental\
    \ moment was\n    ruled implementation. (b) The lattice multiplicative weight w = lmf.surfaceMF and\
    \ the\n    neighbour-order-dependent absolute scale are properties of the reduction's kernel/domain\n\
    \    (which links, weighted how), not new inputs/outputs -- the perimeter of a cell on a\n    hex/3D\
    \ lattice is still the same aggregate, differently weighted.\n\nWhy not NEW: the entire children ->\
    \ parent, per-cell, read-only, no-delta reduction structure is\nalready the promoted aggregate contract;\
    \ spinning a fresh contract for \"the scalar perimeter\nreduction\" would inflate the count for what\
    \ is the aggregate slot merely widened, corrupting the\nsaturation measurement the campaign exists\
    \ to make. The closest OTHER contract is CenterOfMass's\n`aggregate` itself (its first-moment sibling),\
    \ of which this is the boundary-count refinement.\n"
  contract:
    name: aggregate
    kind: aggregate
    family: hierarchy
    set: cell
    inputs:
    - site (the contained lattice-site child set; each owned site contributes its links to neighbour-shell
      sites that are NOT owned by the same cell)
    outputs:
    - cell (the parent whose derived surface/perimeter scalar is published)
    reads:
    - site.pos (the coordinate of each owned lattice site, to enumerate its neighbour shell up to maxNeighborIndex)
    - cell_id_lattice (the owner of each neighbour-shell site -- to decide which links are hetero-owner,
      Medium/id 0 counting as non-c; a NEW partition read relative to the centroid signature, which reads
      only its own children)
    - lmf.surfaceMF (the per-link lattice multiplicative weight w, fixed by the neighbour order)
    writes:
    - cell.surface (the weighted count of hetero-owner boundary links = the cell perimeter/area; a read-only
      derived readout, no energy / acceptance delta -- the WIDENED scalar write field relative to the
      centroid's cell.pos and MomentOfInertia's tensor)
    maps:
    - parent
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: uniforminitializer
  order: 29
  raw_name: UniformInitializer
  raw_kind: Steppable (UniformInitializer)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5833
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366 (chapter ref only -- no paper text
    extracted

    for this target). Checkable SOURCE anchors instead: class PyCoreSpecs.py:L5833, region

    PyCoreSpecs.py:L5742; CC3DMLGeneratorBase.py comment names it "Initial layout of cells in the

    form of rectangular slab" (L1189-1226). No page/figure cited that I have not read.

    '
  summary: 'An initialization steppable, run once before the Metropolis dynamics start. It fills one or

    more axis-aligned boxes (pt_min..pt_max) of the lattice with a regular grid of identical cubic

    cells of edge `width` lattice sites, leaving `gap` empty (medium) sites between adjacent cells,

    and stamps each cell with a type drawn from `cell_types`. It WRITES the cell-id field and the

    cell-type field of the lattice; it does not run every MCS and contributes nothing to the energy.

    '
  equations: "Not a numeric update -- a tiling of the lattice (RECONSTRUCTED from the emitted CC3DML\n\
    fields + standard CC3D semantics; the Python spec only serializes, the tiling itself is compiled\n\
    core and UNVERIFIED here). For a region with box [pt_min, pt_max],\ncell edge w = `width`, spacing\
    \ g = `gap`, each cubic cell occupies a block of sites\n  { (x0+i, y0+j, z0+k) : 0 <= i,j,k < w }\n\
    and the blocks are laid on a regular grid with stride (w + g) along each axis, so cell\norigins are\
    \ at pt_min + m*(w+g) for integer m, while the block+its trailing gap stays inside\nthe box. Every\
    \ site of a block shares one new cell id (a cell = a set of lattice sites sharing\nan id); each new\
    \ cell is assigned a type from `cell_types`. The exact type-assignment rule\n(round-robin vs. uniform-random\
    \ over the list) is decided in the compiled core and is NOT\nvisible in this Python spec -- see surprises.\n"
  params:
    pt_min:
      role: region_bound_min -- minimum corner (x,y,z lattice sites) of the box to be tiled
    pt_max:
      role: region_bound_max -- maximum corner (x,y,z lattice sites) of the box to be tiled
    width:
      role: cell_size -- edge length (in lattice sites) of each cubic cell; guarded width >= 1
    gap:
      role: cell_spacing -- number of empty (medium) sites left between adjacent cells; guarded gap >=
        0
    cell_types:
      role: type_palette -- list of cell-type names each newly stamped cell is assigned from
    regions:
      role: region_list -- UniformInitializer takes any number of UniformInitializerRegion specs, each
        with its own box/width/gap/types
  state_io:
    reads: []
    writes:
    - cell_id_field (lattice site -> cell id; new cells created as blocks of sites)
    - cell_type_field (each new cell -> a type from cell_types)
  surprises:
  - 'This is an INITIALIZER, not a per-MCS plugin: it runs exactly once at start and produces the

    initial cell configuration. Every other CC3D "mechanism" so far reads/perturbs an existing

    field; this one CREATES the cells the rest of the model then evolves. Reimplementers who model

    it as a stepping operator get the cadence wrong.

    '
  - 'A cell here is a SET OF LATTICE SITES sharing an id, laid down as a w*w*w block -- not a point

    with a radius. `width` is an integer site count, `gap` an integer site count; there are no

    physical-length units, only lattice sites.

    '
  - 'The type-assignment rule is NOT in this file. The Python spec only serializes Types as a

    comma-joined list into CC3DML (L5808); how the compiled UniformInitializer walks that list

    (cyclic round-robin vs. random draw per cell) is in the core and could not be determined from

    the spec. A reimplementer must not assume round-robin.

    '
  - 'Geometry vs. Potts box: pt_min/pt_max are validated against PottsCore dimensions (L5829-5830),

    but nothing here clips a partial cell that would straddle the box edge -- whether a trailing

    block narrower than `width` is emitted or skipped is a core-side decision not exposed here.

    '
  - '`gap` is documented as "blob gap" in the docstring (copy-pasted from BlobInitializer); for the

    uniform tiling it is the inter-cell spacing along each axis, not a blob radius. Do not read the

    docstring literally.

    '
  - 'Guard vs. default mismatch on the Region: __init__ defaults width=0 (L5754) but the check_dict

    guard rejects width < 1 (L5747), so a region constructed without an explicit width fails

    validation -- width has no usable default and must always be set. gap defaults to 0 and its

    guard only rejects gap < 0, so gap=0 (cells touching) is the valid default. from_xml (L5905)

    reads Width as required and makes Gap optional, matching this.

    '
  - 'Types round-trips through CC3DML as a comma-joined string (L5808) and is re-parsed by splitting

    on commas with spaces stripped (from_xml L5911); the ordered Python list is flattened to text,

    so any ordering the core relies on for type assignment survives only as list order in that string.

    '
  verdict: out_of_scope
  of: null
  implementation_of: seed
  why: 'INITIAL-CONDITION CONSTRUCTION, not a dynamical operator -- the same shape and the same

    verdict as its sibling BlobInitializer. Plexus operators transform state that already exists:

    each returns a delta the engine integrates every step over a set/field that is already there.

    UniformInitializer is the opposite shape -- a one-shot run once at MCS 0 that CONSTRUCTS the

    starting partition (the sets themselves) from an empty lattice plus one or more axis-aligned

    boxes, a cell `width`, a `gap`, and a type palette. In Plexus that starting partition is

    supplied by configuration/seeding, not by any registered operator; there is nothing in the

    frozen algebra to alias and nothing that could widen to admit set-construction without ceasing

    to be a per-step operator. So this is framework mechanics for establishing the initial state --

    out of scope for the OPERATOR algebra whose completeness this campaign measures.


    Crucially this is NOT a new contract: it is the SAME `seed` contract the BlobInitializer entry

    introduced, with a different tiling geometry. BlobInitializer (spherical clip), this

    UniformInitializer (a rectangular box grid), and PIFInitializer (from a PIF file) are three

    INTERCHANGEABLE implementations of one thing -- building the initial cell partition -- and must

    be counted ONCE. So `implementation_of: seed`, NOT a second `new`. Counting each of a

    framework''s lattice initializers as its own contract would measure how many ways CC3D can lay

    out a starting configuration, not whether the dynamical vocabulary is converging.


    What separates this implementation from the blob one, purely as construction geometry: the clip

    is a box (pt_min..pt_max) rather than a Euclidean sphere, so ALL non-gap tiles inside the box

    become cells (no round boundary truncation), and there is no `center`/`radius`. One further

    contradiction to record: unlike the blob''s type draw, which CC3D convention says is a uniform

    RANDOM per-cell draw, the UniformInitializer''s type-assignment rule (round-robin vs random) is

    NOT visible in this Python spec and lives in the compiled core -- a reimplementer of `seed`''s

    box variant must not assume either. The closest registered contract remains `cell_divide`

    (structural/growth); widening it to cover de-novo population seeding would do violence to its

    biology -- division is mitosis, one parent set -> two daughters conserving material and

    requiring a pre-existing cell, whereas seeding creates a whole population out of Medium with no

    parent.

    '
  contract:
    name: seed
    kind: structural
    family: growth
    set: cell
    inputs:
    - region_geometry (one or more axis-aligned boxes {pt_min, pt_max}, cell width, gap)
    - cell_type_palette
    outputs:
    - initial_cell_partition
    reads:
    - lattice_geometry (Potts domain bounds, to place and validate the box grid)
    - cell_type_registry (to resolve type-name strings)
    writes:
    - cell_field (fresh unique id per in-box, non-gap tile -- a new SET of width^d sites)
    - cell_type (assigned per created cell from the palette; rule core-side, see surprises)
    maps: "(empty lattice, list of box regions {pt_min, pt_max, width, gap}, type palette)\n  -> a partition\
      \ of the in-box, non-gap sites into fresh cell ids, each id a SET of\n     width^d sites laid on\
      \ a regular grid with stride (width + gap) along each axis, each\n     assigned a type from the\
      \ palette. Sites outside every box or in a gap lane stay Medium.\n     A one-shot construction executed\
      \ once at t=0, not a per-step delta. Same `seed` contract\n     as BlobInitializer, differing only\
      \ in the clip geometry (box grid vs spherical blob).\n"
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: volume
  order: 30
  raw_name: Volume
  raw_kind: Plugin (VolumePlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L2033
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366 -- the GGH/CPM effective-energy (Hamiltonian)

    discussion, where the volume constraint is one term of E. NOTE: no paper text was available in

    this environment, so this anchor is the chapter''s known home for the term, NOT a page I have

    read. The equation below is reconstructed from the CC3D source declaration plus standard CPM

    convention; the compiled changeEnergy was not read.

    '
  summary: 'A per-cell-type (or, in bare mode, per-cell) quadratic penalty on the deviation of a cell''s

    site COUNT from a target count. It writes no state: on every proposed pixel copy it returns a

    dE that makes copies pushing a cell away from its target volume energetically costly, so the

    Metropolis rule rejects most of them. It is what gives a set-of-sites an incompressible "size",

    and thus its objecthood -- ablate it and the cells dissolve into medium.

    '
  equations: "Effective-energy volume term, summed over all real cells sigma (Medium, id 0, is exempt):\n\
    \n  E_vol = sum_{sigma>0} lambda_V(sigma) * ( V(sigma) - V_target(sigma) )^2\n\nwhere\n  V(sigma)\
    \        = number of lattice sites carrying id sigma -- a COUNT, not a physical volume\n  V_target(sigma)\
    \ = the cell's rest / target site count\n  lambda_V(sigma) = quadratic stiffness (energy per site^2);\
    \ lambda_V = 0 removes the term\n\nThe plugin never integrates this. On each attempted pixel copy\
    \ (the id at a source site is\nproposed to overwrite a neighbour site) it returns dE = E_vol(after)\
    \ - E_vol(before). A single\ncopy touches TWO cells at once: the gaining cell V -> V+1 and the losing\
    \ cell V -> V-1 (either\nmay be Medium, which contributes 0), so dE couples both quadratics and is\
    \ NOT symmetric in V.\nThe Metropolis rule then accepts the copy with P = 1 if the TOTAL dE (this\
    \ term + all others)\n<= 0, else exp(-dE / T), where T = the Potts fluctuation_amplitude (T = 10 in\
    \ the reference\nruns). Standard CPM convention has no leading 1/2 on the quadratic.\n"
  params:
    target_volume: 'rest_volume / target_size -- the site count a cell of this type relaxes toward

      (VolumeEnergyParameter.target_volume; CC3DML attribute TargetVolume). Guarded >= 0

      (check_dict, PyCoreSpecs.py:L1978).

      '
    lambda_volume: 'constraint_stiffness -- the quadratic energy penalty per (site)^2 of deviation from
      target

      (CC3DML attribute LambdaVolume). NOT guarded: lambda_volume = 0 is legal, and is exactly the

      dissolving ablation.

      '
    _params: '(plugin constructor, VolumePlugin(*_params), PyCoreSpecs.py:L2052) zero or more

      VolumeEnergyParameter, one per cell type. Zero args = "bare" mode: target_volume /

      lambda_volume are then read PER-CELL from the cell.targetVolume / cell.lambdaVolume attributes

      instead of per-type. The two modes are mutually exclusive (per-type silences per-cell -- see

      surprises).

      '
  state_io: "reads: V(sigma), the per-cell site count -- maintained incrementally by a SEPARATE, auto-loaded\n\
    \  plugin, VolumeTrackerPlugin (a CellGChangeWatcher; cpp/CompuCell.py:L5554), NOT recomputed by\n\
    \  this plugin; and, per cell, its targetVolume + lambdaVolume, taken EITHER from per-type\n  VolumeEnergyParameters\
    \ OR, in bare mode, from the per-cell cell.targetVolume /\n  cell.lambdaVolume attributes.\nwrites:\
    \ nothing. It is an energy term -- it only changes the acceptance probability of a\n  proposed pixel\
    \ copy, never moves or writes state directly.\n"
  surprises:
  - 'Declaring per-TYPE VolumeEnergyParameters (calling param_new / passing params to the

    constructor) makes CC3D IGNORE the per-cell cell.targetVolume. A growth steppable that writes

    the per-cell value then has no effect and the cells quietly shrink -- measured 25 -> 20.9 over

    400 MCS with zero divisions, while the run reported success. Declare the plugin BARE

    (VolumePlugin() with no param_new) to use per-cell values. The two modes are mutually exclusive.

    '
  - 'Ablating it (lambda_volume = 0) does not merely relax the size: the cells DISSOLVE. Measured in

    the reference ablation (log/atlas_cc3d/volume_constraint, OFF run): mean volume 25 -> 0 and cell

    count n 45 -> 0 by MCS 200, versus the ON run relaxing 25 -> 59.4 toward target 60. With no

    volume penalty and all contact energies positive (16), the system minimises boundary by erasing

    cells into medium. Volume is what makes a cell an object here.

    '
  - 'The energy penalty and the volume COUNT are TWO different plugins. VolumePlugin only reads

    V(sigma); the count is kept up to date by VolumeTrackerPlugin, an incremental CellGChangeWatcher

    that adjusts the count on each accepted copy. A reimplementer who folds "recount the cell" into

    the energy term, or forgets the tracker, gets a plugin reading a stale or zero volume.

    '
  - 'A single pixel copy is a TWO-cell event: gaining cell V->V+1, losing cell V->V-1. Because the

    term is quadratic, the two contributions do not cancel and dE depends on how far each cell

    already is from its target -- treating volume relaxation as an independent per-cell update

    misses this coupling. Medium (id 0) has no volume constraint and contributes 0 to either side.

    '
  - 'Only target_volume is guarded (>= 0). lambda_volume is unchecked, so the zero that dissolves

    the cells passes validation silently. There is also no upper guard: a large lambda_volume with

    the fixed Potts temperature T freezes the boundary and the cell cannot reach its target at all

    -- the constraint''s effect is inseparable from fluctuation_amplitude, which is a Potts param,

    not a Volume param.

    '
  verdict: new
  of: null
  implementation_of: null
  why: "new: no registered contract covers an elastic set-point on a cell's SIZE. The closest\nregistered\
    \ operators are cell_grow (structural/growth) and this term's geometric twin\nmembrane_tension (the\
    \ `surface` entry, itself normalized `new` in this same atlas).\n- cell_grow operates on volume but\
    \ from the opposite direction: it WRITES the rest/target\n  volume forward by a logistic law (a state-writing\
    \ update, kind structural). volume_elasticity\n  writes nothing -- it returns the energy dE that resists\
    \ any deviation of the CURRENT site\n  count from that target. Widening cell_grow to absorb it would\
    \ fuse a state-writing growth\n  rule with a non-writing energy term (incompatible state_io) and erase\
    \ the very read/write\n  distinction this campaign is measuring.\n- membrane_tension is the structural\
    \ sibling (same quadratic Hookean form, same two-cell\n  incremental-delta / no-write energy shape,\
    \ same lateral/mechanics home) but constrains a\n  DIFFERENT geometric quantity: boundary count vs\
    \ bulk site count. They are two distinct\n  biophysical forces (surface tension vs bulk incompressibility),\
    \ read two different trackers,\n  and Plexus already keeps them apart, so volume_elasticity is its\
    \ own contract, NOT an\n  implementation_of membrane_tension. (One COULD argue both are implementations\
    \ of a single\n  generic \"quadratic geometric set-point\" contract; the note records the argument\
    \ for\n  collapsing them.)\n- The jax-morph proposals `relax` / `regulate` are generic relaxation\
    \ / homeostasis verbs,\n  not a volume-elasticity energy; no prior atlas proposed this specific contract,\
    \ so this is\n  its FIRST sighting (implementation_of: null).\n"
  contract:
    name: volume_elasticity
    kind: lateral
    family: mechanics
    set: cell
    inputs: "- one cell's site COUNT V(sigma) -- the number of lattice sites carrying the cell id\n  (maintained\
      \ incrementally by a separate, auto-loaded VolumeTrackerPlugin, a\n  CellGChangeWatcher; read here,\
      \ not recomputed). This is the cell's discrete \"volume\":\n  a count, not a physical length^3.\n\
      - the proposed single-pixel copy (source/target site, the two cells it touches), used to\n  obtain\
      \ the incremental change (+1 to the gaining cell, -1 to the losing cell) in each\n  involved cell's\
      \ count.\n- the target and stiffness: target_volume V_target, lambda_volume -- taken from the per-cell\n\
      \  cell.targetVolume / cell.lambdaVolume in bare mode, else the per-cell-type\n  VolumeEnergyParameter\
      \ default (the two modes are mutually exclusive).\n"
    outputs: "- a scalar energy contribution dE added to the Potts total, NOT an integrated state delta:\n\
      \  dE = E_after - E_before, with E(cell) = lambda_V*(V - V_target)^2, summed over the two\n  cells\
      \ the candidate copy changes (gainer V->V+1, loser V->V-1; Medium, id 0, contributes 0).\n  The\
      \ delta only re-weights the Metropolis acceptance probability (P=1 if total dE<=0 else\n  exp(-dE/T));\
      \ the operator writes no cell property.\n"
    reads: "- the cell's site count V(sigma) (maintained by VolumeTracker; reads 0 / inert without it).\n\
      - per-cell cell.targetVolume / cell.lambdaVolume (bare mode) OR the per-type\n  VolumeEnergyParameter\
      \ default.\n- the candidate pixel copy and its two involved cells, for the incremental +1/-1 count\
      \ change.\n"
    writes: "- NONE. changeEnergy returns dE (an energy term) and mutates no cell field; it changes only\n\
      \  the acceptance probability of the proposed pixel copy.\n- (out of band, not part of this contract)\
      \ a host steppable may set the per-cell targetVolume /\n  lambdaVolume (e.g. a growth or division\
      \ rule); that is host-driven state-setting, not the\n  energy evaluation.\n"
    maps: "- cell pixel set -> site count V = number of sites carrying the cell id (the tracker's job;\n\
      \  read here, not computed).\n- volume deviation (V - V_target) -> quadratic Hookean energy lambda_V*(dev)^2\
      \ per cell ->\n  summed over the two cells a candidate copy touches -> dE that gates the Metropolis\
      \ accept.\n  At target -> low energy; over-inflated or over-compressed -> higher energy (a two-sided\n\
      \  restoring bulk elasticity / incompressibility that gives the set-of-sites an object-like\n  size\
