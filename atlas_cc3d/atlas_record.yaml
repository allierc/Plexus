- id: curvature
  order: 13
  raw_name: Curvature
  raw_kind: Plugin (CurvaturePlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5043
  paper_section: 'Not locatable in the extractable Swat et al. (2012) Methods Cell Biol 110:325-366 text
    (no

    page verified). The only checkable anchor is the source: CurvaturePlugin.cpp changeEnergy

    (L347) and calculateInverseCurvatureSquare (L336), mirrored in the installed binary

    libCC3DCurvature.so. Concept documented as the CC3D reference-manual "Curvature Plugin"

    (used with compartmental cells / FocalPointPlasticity to stiffen chains of cells).

    '
  summary: 'A Cellular-Potts ENERGY TERM that penalizes bending of chains of compartmental cells linked

    by junctions the plugin maintains itself. For every three consecutive linked cells it adds

    lambda * kappa to the Hamiltonian, where kappa is the Menger curvature (1/circumradius) of

    the three cells'' centers of mass -- zero for a straight chain, larger the more it bends -- so

    the constraint drives linked chains toward straight lines. changeEnergy writes NO cell state

    (it returns dE for a proposed pixel copy, recomputing affected COMs with +/-1 volume). It

    ALSO grows the junction graph: when a proposed copy could form a new within-cluster junction

    it biases that move by activation_energy, and the bond is actually committed (or an emptied

    cell''s bonds erased) in the field3DChange watcher on accepted moves.

    '
  equations: "Per triple of consecutive junction-linked cells with COMs L (left), M (mid), R (right):\n\
    \n  kappa(L,M,R) = 2 * sin(theta_M) / |R - L|\n  sin(theta_M) = |(L-M) x (R-M)| / (|L-M| * |R-M|)\
    \          # cross-product magnitude\n\ntheta_M is the chain angle at the middle cell; kappa is the\
    \ Menger curvature of the three\npoints = 1/R_circ (reciprocal circumradius). Straight -> theta_M=0\
    \ -> sin=0 -> kappa=0.\n(Source calls this calculateInverseCurvatureSquare -- a MISNOMER: it is neither\
    \ inverted nor\nsquared; it is the plain curvature. CurvaturePlugin.cpp:L336-345.)\n\nBending energy\
    \ of the whole chain:  E = sum over triples of  lambda * kappa(L,M,R)\nwith lambda = internalCurvatureParamsArray[first-pair\
    \ types].lambdaCurvature (symmetric).\n\nWhat changeEnergy actually returns (CurvaturePlugin.cpp:L347-829)\
    \ is the DELTA for one\nproposed pixel copy at pt (gaining cell volume+1, losing cell volume-1, COMs\
    \ recomputed via\nprecalculateCentroid):\n  dE = sum over affected triples of  lambda * ( kappa_after\
    \ - kappa_before )\nwhere the affected triples are the up-to-5 triples spanning 3 hops each side of\
    \ the changed\ncell along the junction chain.\n\nJunction-creation term (CurvaturePlugin.cpp:L233-334,\
    \ L373-383): if newCell at pt can form a\nnew within-cluster junction (partner cell same clusterId,\
    \ both types listed, both with\nfewer than max_junctions bonds, no existing bond, partner within neighbor_order\
    \ lattice\nshells) then instead of a curvature delta,\n  dE = activation_energy      # a fixed offset,\
    \ typically negative to favour bonding\nand the bond is inserted symmetrically in field3DChange only\
    \ if the move is accepted.\n\nDEAD CODE (defined, never called): potentialFunction(lambda,offset,d0,d)\
    \ = offset +\nlambda*(d-d0)^2 (harmonic spring), and diffEnergyByType/diffEnergyLocal/diffEnergyGlobal\
    \ all\n`return 0.0`. Constructor members targetDistance(0) and maxDistance(1000) are never read.\n\
    These are vestiges of the FocalPointPlasticity template this plugin was cloned from.\n"
  params:
    lambda_curve: 'bending_stiffness -- curvature modulus lambda, multiplies the Menger curvature of each

      chain triple (per cell-type pair). Zero disables the bending penalty.

      '
    activation_energy: 'junction_formation_energy -- fixed dE offset added to a move that creates a new

      within-cluster junction (per type pair); negative values favour bond formation.

      '
    type1: type_pair_selector -- first cell type the lambda/activation apply to (symmetric with type2)
    type2: type_pair_selector -- second cell type of the pair
    cell_type: type_selector -- which cell type the junction limits below apply to
    max_junctions: 'max_connectivity -- cap on junctions a cell of this type may hold (2 = interior of
      a chain,

      1 = chain endpoint, 0 = never bonds).

      '
    neighbor_order: interaction_range -- lattice neighbor-shell order searched for junction partners
  state_io:
    reads: "- cell center of mass and volume (xCM/yCM/zCM, volume) of the changed cell and of its\n  junction\
      \ neighbors up to 3 hops each side along the chain\n- each cell's junction set (CurvatureTracker.internalCurvatureNeighbors,\
      \ in extra attributes)\n- cell type, clusterId\n- the cell lattice field around pt (getNeighborDirect\
      \ up to neighbor_order) when scouting\n  a new junction partner\n"
    writes: "- changeEnergy writes NO cell state; it returns a dE (energy term, not an update).\n- field3DChange\
      \ (accepted-move watcher) DOES mutate topological state: inserts a new\n  junction into both cells'\
      \ internalCurvatureNeighbors sets on an accepted bond-forming\n  move, and erases all references\
      \ to a cell whose volume reached 0.\n"
  surprises:
  - 'MISNOMER: calculateInverseCurvatureSquare returns neither an inverse nor a square. It is

    the Menger curvature kappa = 2*sin(theta)/|chord| = 1/R_circ (linear in curvature), and the

    energy is lambda*kappa, zero for a straight chain. A reimplementer trusting the name would

    invert or square it and get the physics backwards.

    '
  - 'Junctions are the plugin''s OWN topological state, not read from FocalPointPlasticity (the

    two are separate plugins that happen to be used together). Bonds form only WITHIN a cluster

    (same clusterId = compartmental cells), only between listed types, only up to max_junctions,

    only if none already exists. So Curvature is a hybrid: a Potts energy term PLUS a stateful

    bond-graph watcher -- not a pure energy plugin.

    '
  - 'Vestigial code changes the physics you would guess: potentialFunction (harmonic

    offset+lambda*(d-d0)^2), targetDistance, maxDistance, and diffEnergyBy* are all present but

    inert (never called / return 0). ONLY lambda_curve and activation_energy affect dynamics;

    targetDistance/maxDistance from the CC3DML are silently ignored.

    '
  - 'APPARENT BUG in the "middle cell about to disappear" branch (volume 1->0): three

    reconnection terms add curvature WITHOUT the lambda factor (CurvaturePlugin.cpp:L674, L682,

    L687 -- `energy += calculateInverseCurvatureSquare(...)` with no `lambda *`), inconsistent

    with every other branch. To match the oracle a faithful port must reproduce the missing

    factor, not "fix" it.

    '
  - 'lambda for a triple (A,B,C) is looked up by the FIRST pair''s types

    (internalCurvatureParamsArray[A.type][B.type]), not the mid-vertex pair; the index is a

    symmetric bit-pack (min+1)|((max+1)<<16), so [a][b]==[b][a]. Matters only when types differ

    along the chain.

    '
  - 'The two bonds of a cell are labelled left/right by std::set ordering on the neighbor

    POINTER (CurvatureTracker.h:L40-42), i.e. arbitrary, not geometric. Chain traversal walks up

    to 3 hops each side; only cells with <=2 junctions form a proper chain.

    '
  - 'Source comment (CurvaturePlugin.cpp:L349) states it does NOT work correctly under periodic

    boundary conditions. The plugin also force-loads the CenterOfMass plugin on init.

    '
  verdict: null
  of: null
  implementation_of: null
  why: null
  contract: null
  status: inspected
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: diffusionsolverfe
  order: 14
  raw_name: DiffusionSolverFE
  raw_kind: Steppable (DiffusionSolverFE)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L6242
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366, sec. "PDE Solvers" (DiffusionSolverFE).

    Checkable in-tree anchor for the algorithm: cc3d/twedit5/Plugins/CC3DProject/diffusion_solvers_descr.py:7

    ("Uses Forward Euler method and handles moving boundary conditions. May be slow for large

    diffusion constants."); FTCS stability limits at CC3DXMLGenerator.py:884.

    '
  summary: 'A steppable that advances one or more scalar concentration FIELDS defined over the CPM

    pixel lattice by one explicit forward-Euler (FTCS) step per Monte Carlo Step: reaction-

    diffusion-decay with a secretion source, cell-type-dependent coefficients, and per-face

    boundary conditions. It is a genuine field->field WRITE (unlike the energy-term plugins in

    this atlas): it overwrites the concentration grid c in place. The physics lives in the

    compiled core; PyCoreSpecs.py only declares the CC3DML the solver reads.

    '
  equations: "Per site i and field, one step (transcribed from the OpenCL uniDiff kernel L954-L1054;\n\
    DeltaX = DeltaT = 1 by default). NN(i) is the diffusion neighbourhood (N sites, set by the\nfield\
    \ NeighborOrder); D_i, lambda_i are the coefficients of the cell type occupying i.\n\n  isoSum_i \
    \ = D_i * ( SUM_{j in NN(i)} c_j^t  -  N * c_i^t ) / 2\n  varSum_i  = ( SUM_{j in NN(i)} D_j * ( c_j^t\
    \ - c_i^t ) ) / 2\n  c_i^{t+1} = (dt / dx^2) * ( isoSum_i + varSum_i )  +  ( 1 - dt*lambda_i ) * c_i^t\
    \   + S_i\n\nThe TWO half-sums (centre-cell D_i, plus each neighbour's own D_j, each /2) are a symmetric\n\
    average of the face flux -- the variable-diffusion scheme, needed when D differs across a\nface. For\
    \ UNIFORM D they recombine exactly to the plain discrete Laplacian:\n  isoSum + varSum = D * ( SUM_j\
    \ c_j - N c_i )\nso  c_i^{t+1} = c_i + (dt/dx^2) D grad^2_discrete c - dt*lambda*c + S = explicit\
    \ FE for\ndc/dt = D grad^2 c - lambda c + S.\n\nSymbols:\n  c_i        concentration at pixel i (a\
    \ field value, not cell state)\n  NN(i)/N    diffusion-neighbour pixels and their count (von Neumann-style;\
    \ 1st shell = 4 in 2D,\n             6 in 3D; widened by the field NeighborOrder)\n  D_i        diffusion\
    \ coefficient at i = diff_types[type(cell at i)] if set, else diff_global\n  lambda_i   decay coefficient\
    \ at i    = decay_types[type(cell at i)] if set, else decay_global\n  S_i        secretion (SEPARATE\
    \ sweep, order-dependent): for a cell of type t occupying i, add\n             value (mode Secretion,\
    \ optional relative/max uptake sink), or CLAMP c_i := value\n             (mode ConstantConcentration\
    \ / Dirichlet, re-pinned each step), or add only when a\n             neighbour site holds a different\
    \ cell id of a named type (SecretionOnContact)\nThis is the SOURCE's method (\"Forward Euler\", FE);\
    \ the continuous PDE is the paper's, the\nper-cell-type D_i/lambda_i, the two-half-sum symmetrisation\
    \ and moving-boundary coupling are\nthe code's realisation.\n"
  params:
    fluc_comp:
      role: mass_conservation_flag -- enable FluctuationCompensator, corrects c when a pixel changes cell
        id so cell moves conserve total field mass
    gpu:
      role: backend_selector -- swaps the registered solver to DiffusionSolverFE_OpenCL; numerics-only,
        no physics change
    diff_global:
      role: diffusion_coefficient (global default D; validated >= 0)
    decay_global:
      role: decay_rate (global default lambda; validated >= 0)
    diff_types:
      role: diffusion_coefficient_by_cell_type -- per-cell-type override D_t, keyed to the CPM cell occupying
        the pixel
    decay_types:
      role: decay_rate_by_cell_type -- per-cell-type override lambda_t
    init_expression:
      role: initial_condition -- muParser math expression evaluated per site at t=0
    init_filename:
      role: initial_condition -- file to load the t=0 field from
    secretion (SecretionParameters cell_type/value/constant/contact_type):
      role: 'source_term -- per-cell-type source: additive rate, Dirichlet-clamp (constant), or on-contact'
    boundary_conditions (x/y/z _min/_max _type + _val):
      role: 'boundary_condition -- per face: Value=Dirichlet (default 0.0, absorbing sink), Flux=Neumann/ConstantDerivative,
        Periodic'
    additional_term:
      role: 'UNKNOWN: reaction_term expression is present in the base spec_dict (line 580) but DiffusionSolverFEDiffusionData.xml
        (L6086) never emits it -- so via THIS python spec it is dead; only the ReactionDiffusion variant
        writes AdditionalTerm (L6773)'
    DeltaX / DeltaT / ExtraTimesPerMCS:
      role: 'UNKNOWN via this API: timestep / grid spacing / sub-cycling count exist in the core CC3DML
        (CC3DXMLGenerator.py:950,991) and set FTCS stability, but DiffusionSolverFE''s python spec exposes
        NO setter -- a tuner using PyCoreSpecs cannot change them; they fall back to core defaults 1.0/1.0/0'
  state_io:
    reads: "- the concentration field c (the grid it advances)\n- the CPM cell-id / cell-type lattice\
      \ at every pixel, to pick D_i and lambda_i and to\n  locate secreting cell interiors -- this is\
      \ the coupling to the Potts, not a field of its own\n- boundary values / initial-condition expression\
      \ or file\n"
    writes: "- the concentration field c, IN PLACE (overwrites the grid each MCS). This is an actual\n\
      \  field write, not an energy delta -- contrast the Potts plugins in this atlas that return\n  nothing\
      \ and only bias pixel-copy acceptance.\n"
  surprises:
  - 'Forward Euler is only conditionally stable: the guide (CC3DXMLGenerator.py:884) flags D > 0.16 (3D)
    or D > 0.25 (2D) at DeltaX=DeltaT=1 as unstable. The core auto/manually sub-cycles via ExtraTimesPerMCS,
    but the DiffusionSolverFE python spec exposes NO way to set it -- so a reimplementer driving from
    PyCoreSpecs gets silent blow-up at high D with no knob to fix it. These thresholds are magic constants.'
  - 'D and lambda are SPATIALLY HETEROGENEOUS, keyed to the moving CPM cell field: diff_types/decay_types
    override the global value per cell type at each pixel. Plexus `diffuse`/`decay` carry a single scalar
    rate -- they have no cell-type-indexed coefficient nor any coupling to a set-membership lattice.'
  - 'Secretion has three DISTINCT semantics under one name: Secretion ADDS a rate, ConstantConcentration
    OVERWRITES (Dirichlet clamp on the cell interior -- a set, not an add), SecretionOnContact adds only
    on heterotypic contact. A reimplementer treating ConstantConcentration as a source would be wrong
    -- it pins the value.'
  - Default boundary condition is Value 0.0 on every face = an ABSORBING sink (Dirichlet), not no-flux.
    Silence here means the field leaks out the walls; Neumann/no-flux must be requested explicitly (Flux
    type).
  - '''Handles moving boundary conditions'' + FluctuationCompensator: because cells move on the CPM lattice
    under the field, a pixel changing cell id would spuriously dilute/concentrate c; the compensator (off
    by default) rescales to conserve mass. Off-by-default means naive runs are NOT mass-conserving under
    motion.'
  - 'The diffusion stencil is written as TWO half-sums (isoSum with the CENTRE cell''s D_i, plus varSum
    with each NEIGHBOUR''s own D_j, each /2), NOT one D*Laplacian. That split is the variable-diffusion
    scheme: it symmetrises the flux across a cell-type interface and only collapses to the familiar D*(SUM
    - N c) when D is spatially uniform. A reimplementer using a single central-D Laplacian gets heterotypic
    diffusion -- the whole point of per-type coefficients -- wrong.'
  - 'I read the OpenCL (GPU) kernel (DiffusionKernel.cl, uniDiff L821-L1057) for the exact arithmetic:
    neighbour loop, the two-half-sum D average, the (1 - dt*lambda) decay factor, and the ghost-cell boundary
    handling. The compiled CPU solver (the gpu=False default) is a .so I could NOT read; the kernel''s
    own comments cross-reference the CPU code and the CC3DML is shared, so I believe the update is identical,
    but I did not verify the CPU path byte-for-byte (cc3d is deliberately not importable here). Note also
    DeltaX/DeltaT are unreachable via PyCoreSpecs, so dt/dx^2 defaults are fixed there.'
  - The class at L6242 is a thin CC3DML EMITTER; every physical parameter lives on the child DiffusionData
    / SecretionData / BoundaryConditions specs (L6070, L6160, L820), and the integrator itself is compiled.
    No update logic is in this file.
