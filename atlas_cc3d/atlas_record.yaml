- id: metropolis_acceptance
  order: 32
  raw_name: Metropolis acceptance of pixel copies
  raw_kind: core dynamics (not a class)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L1383
  paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366
  summary: 'Time advances by attempting to copy one lattice site''s cell-id into a neighbouring site,

    accepted with probability 1 if the total energy falls and exp(-dE/T) otherwise, where T is

    the fluctuation amplitude. This is the Cellular Potts Model''s modified-Metropolis Monte Carlo

    update -- the ENGINE, not a plugin. No plugin implements it; every plugin only contributes a

    term to dE, and this rule is what turns that summed energy into a stochastic accept/reject.

    It is declared on PottsCore (the simulation root), not as an energy plugin.

    '
  equations: "For a proposed copy of source site s's cell-id into target site t:\n\n  dE = sum over every\
    \ enabled plugin p of  E_p(after copy) - E_p(before copy)\n  P(accept) = 1                      if\
    \ dE <= 0\n            = exp(-(dE + offset) / T) if dE > 0\n\nT = fluctuation_amplitude. When source\
    \ and target cells carry different per-type\nfluctuation amplitudes, the scalar T for that attempt\
    \ is combined by\nfluctuation_amplitude_function in {Min, Max, ArithmeticAverage} (default Min). `offset`\n\
    shifts the acceptance exponent (default 0); its exact sign/placement in the compiled core\nwas NOT\
    \ read -- only the Boltzmann canonical form and the documented parameter roles in\nPyCoreSpecs were.\
    \ One Monte Carlo Step (MCS) is one such attempt per lattice site on average.\ndE carries NO pathwise\
    \ derivative: it is a finite energy difference between two discrete\nlattice configurations, evaluated\
    \ per proposed flip, not a force or a rate.\n"
  params:
    fluctuation_amplitude: 'the Metropolis temperature T -- amplitude of energy-increasing fluctuations
      the sweep will

      accept; larger T => more membrane agitation / less rigid energy descent. Default 10.

      '
    fluctuation_amplitude_function: 'rule (Min/Max/ArithmeticAverage) for combining two cells'' per-type
      fluctuation amplitudes

      into the scalar T of a heterotypic copy attempt. Default Min.

      '
    offset: 'additive shift in the Boltzmann acceptance exponent; biases the accept probability of

      energy-raising copies. Default 0.

      '
  state_io: 'architectural / the integrator itself. READS the summed energy change dE contributed by

    every enabled plugin for one proposed source->target pixel copy, plus T and offset. On accept,

    WRITES exactly one lattice site''s cell-id (the target site is reassigned to the source cell:

    the source cell gains a site, the neighbour cell loses one), which is how volume, surface,

    centre of mass and every derived quantity actually change. It returns NO energy term and NO

    delta of its own -- it is the consumer of every operator''s contribution, not a contributor.

    This is the exact inverse of a Plexus operator: a Plexus operator returns a delta and the

    engine integrates it deterministically; here the "operators" (plugins) return energies and

    THIS rule stochastically integrates them by accept/reject.

    '
  surprises:
  - 'ADDED BY HAND: the dynamics themselves -- discrete, stochastic, accept/reject, with no

    pathwise derivative. This is the deepest architectural finding of the CC3D atlas: the target

    framework''s time evolution is energy-minimizing Monte Carlo, while every Plexus operator

    returns a delta the engine integrates continuously. The two integration paradigms are

    orthogonal, and this entry is where that orthogonality lives.

    '
  - 'It is declared on PottsCore -- the simulation ROOT / config object -- alongside lattice

    dimensions, boundary conditions and RNG seed, not as a plugin. The acceptance rule is not

    a mechanism you add; it is the substrate every mechanism is expressed against.

    '
  - 'Heterotypic temperature: T is not necessarily one global scalar. Per-cell-type fluctuation

    amplitudes are legal, reconciled per attempt by fluctuation_amplitude_function -- so even the

    "temperature" of the dynamics can be a set-indexed field, not a constant.

    '
  verdict: out_of_scope
  of: null
  implementation_of: null
  why: 'The Metropolis acceptance carries NO biological content of its own: it is the CPM''s core

    numerical integrator -- a modified-Metropolis Monte Carlo sampler that turns a summed energy

    change into a stochastic accept/reject on one pixel copy. Every biological term lives in the

    per-plugin dE contributions (volume, adhesion, chemotaxis, ...), each catalogued as its own

    mechanism; this rule only decides whether a proposed copy is kept. In Plexus terms its

    counterpart is not any registered operator but the ENGINE''s time-integration loop, which is

    deliberately OUTSIDE the operator algebra -- Plexus registers no operator for "advance time",

    and the RK-style integrator that consumes operator deltas is not itself a contract. The

    closest registered contract is `cell_divide`/`cell_grow` (structural growth) because an

    accepted copy is a structural change to which cell owns a lattice site; but treating the

    sampler as a growth operator would be a category error -- growth is a biological program a

    cell runs, whereas this is the mechanism BY WHICH any such program is realized. Minting it as

    a `new` operator, or aliasing it to a structural contract, would inflate the yield with pure

    framework mechanics and -- worse -- would miscount the integrator as an operator, corrupting

    the saturation measurement this campaign exists to produce. Recording it as out_of_scope,

    with the paradigm gap stated plainly (energies + stochastic accept/reject vs deltas +

    deterministic integration), is the honest reduction. The contract below is a FORCED FIT

    recorded only to document the site-reassignment shape; `kind: structural` / `family: growth`

    is not a claim that Metropolis acceptance is biological growth.

    '
  contract:
    name: metropolis_step
    kind: structural
    family: growth
    set: cell
    inputs:
    - fluctuation_amplitude
    - fluctuation_amplitude_function
    - offset
    outputs:
    - accepted
    reads:
    - energy.dE_total
    - cell.lattice_sites
    writes:
    - cell.lattice_sites
    maps: []
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: energy_sum_composition
  order: 33
  raw_name: the Hamiltonian as a sum of plugin terms
  raw_kind: composition contract (not a class)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py
  paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366
  summary: Mechanisms compose by ADDING energy terms to one Hamiltonian and interact only through the
    accept/reject decision. Nothing is applied in sequence and nothing returns a delta.
  equations: E = sum_plugins E_plugin. Mechanisms interact ONLY through dE in the acceptance test.
  params: {}
  state_io: 'Architectural, not an update -- the standing composition law of the framework, not a step
    the engine

    runs. Every enabled plugin registers a term E_plugin(configuration); on each proposed pixel copy the

    Potts core asks each term for its contribution to dE and SUMS them into a single scalar dE, which
    is

    the only channel through which mechanisms interact (see the metropolis_acceptance entry for the

    accept/reject rule that consumes that sum). It writes no state itself; it holds no parameters; it

    constrains every other mechanism by fixing HOW their terms combine (additively, simultaneously, into

    one energy) rather than in sequence.

    '
  surprises:
  - 'ADDED BY HAND: the direct counterpart of jax-morph''s Lie-Trotter operator split, and the contrast
    is itself a finding: operator splitting versus energy summation are two different answers to how mechanisms
    compose'
  - 'Composition here is SIMULTANEOUS and NON-SEQUENTIAL. No plugin sees the effect of another before
    the

    copy is decided; all terms are evaluated against the SAME candidate configuration and only their sum

    matters. There is no notion of "plugin A runs, then plugin B runs on A''s output" -- the order in
    which

    plugins are listed is irrelevant to dE. This is the opposite of an operator pipeline.

    '
  - 'Because the terms combine additively into one scalar and are resolved by a single stochastic

    accept/reject, mechanisms can TRADE OFF against each other inside one step: a copy that raises volume

    energy can still be accepted if it lowers contact energy more. In an operator-splitting scheme each

    operator''s delta is applied unconditionally and such trade-offs must be engineered by hand; here
    they

    are automatic and emergent from the sum.

    '
  verdict: out_of_scope
  of: null
  implementation_of: null
  collision_note: null
  why: 'out_of_scope: this is not an operator over any biological set or field -- it is the framework''s

    COMPOSITION LAW, the meta-rule that says how the per-mechanism energy terms combine. It has no

    biological content of its own (it constrains volume, adhesion, chemotaxis alike but IS none of them),

    it holds no parameters, and it returns no per-set delta. What it fixes is the semantics of the

    interpreter, not a mechanism in the tissue.


    Crucially, there is no registered contract to alias or widen, because Plexus''s OWN composition law

    lives at the same architectural layer and is likewise NOT a member of the operator vocabulary. Plexus

    composes by operator splitting: each registered operator returns a delta and the engine applies /

    integrates those deltas in sequence (the Lie-Trotter split the surprise names). That splitting is
    a

    property of the engine, not an entry in src/plexus/operators/ -- so the frozen baseline has nothing

    named for "how operators compose". You cannot alias a vocabulary item that does not exist, and you

    cannot widen a signature (`name, kind, family, set, inputs, outputs, reads, writes, maps`) to express

    "sum every term into one scalar and resolve by one accept/reject": that is not a signature field,
    it

    is the calling convention the signatures presuppose.


    This is deliberately the SAME cut the celltype entry made (a schema is not a per-step operator ->

    out_of_scope) and NOT the cut cell_as_lattice_domain made. That entry earned `new` because the

    extended, deformable lattice DOMAIN is a substrate primitive that operators read and write over and

    that the point-agent algebra genuinely cannot represent -- a thing in the state. Energy summation
    is

    not a thing in the state; it is how the engine resolves competing terms. The campaign measures whether

    the operator VOCABULARY converges (contracts over sets/fields). Counting the composition scheme as
    a

    `new` contract would measure our engine''s calling convention, not the biological language -- it would

    inflate the yield with a non-vocabulary item and corrupt the very saturation curve this exercise

    exists to read. So the finding is recorded LOUDLY here and in the note (energy summation vs operator

    splitting, two answers to how mechanisms compose) rather than smuggled into the contract count.


    The contract below is recorded only to document the honest typed shape IF one insisted the composition

    law belonged inside the algebra -- an additive superposition of simultaneous energy terms. Its

    `kind: structural` / `family: hierarchy` is a forced fit (and the reason it is exempt from the

    writes-nothing no-op rule), not a claim that the Hamiltonian sum is an operator.

    '
  contract:
    name: superpose
    kind: structural
    family: hierarchy
    set: energy_term
    inputs:
    - the set of enabled per-mechanism energy terms, each a function E_plugin(configuration) that scores
      a candidate lattice configuration
    - the single proposed pixel copy shared by every term (all terms score the SAME candidate)
    outputs:
    - a single scalar dE = sum_plugins (E_plugin(after) - E_plugin(before)), the only channel through
      which the terms interact; consumed by the metropolis_acceptance rule, never written to state
    reads:
    - each enabled plugin's energy contribution for the candidate copy
    writes: 'NONE. It integrates no delta and mutates no cell/field property; it only combines the terms
      into the

      scalar the acceptance test reads. (structural kind, so exempt from the no-op rule -- the honest
      fact

      is that a composition law writes nothing.)

      '
    maps: '(a set of independent energy terms, one candidate copy) -> one additive scalar dE that couples
      them

      simultaneously. Additive and order-independent: no term sees another''s effect, and their sum is
      the

      sole interaction. This is the SUM-OF-ENERGIES answer to composition; the Plexus engine''s answer
      is

      the SUM-OF-DELTAS (operator splitting), and the two are not inter-expressible -- energy summation

      permits within-step trade-offs resolved by one stochastic accept/reject that a sequential delta

      pipeline cannot represent.

      '
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: mcs_time_unit
  order: 34
  raw_name: Monte Carlo Step as the time unit
  raw_kind: time-scale contract (not a class)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py
  paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366
  summary: One MCS is one attempted copy per lattice site, not a duration. There is no dt and no integrator;
    a rate must be expressed as a per-MCS probability.
  equations: 1 MCS = one attempted copy per lattice site. No dt and no integrator; a rate must be expressed
    as a per-MCS probability.
  params: {}
  state_io: 'architectural: constrains every other mechanism; writes no state itself except the integer
    step counter (the simulation clock)'
  surprises:
  - 'ADDED BY HAND: a time-scale taxonomy with no dt at all -- the sharpest possible contrast with an
    ODE-integrating framework'
  - 'The unit is STOCHASTIC and lattice-size-dependent: 1 MCS = N_sites attempted copies (a "sweep"),
    so a single tick does an amount of work proportional to the domain area/volume, and the physical meaning
    of a tick shifts if the lattice is rescaled. There is no time constant to anchor it to seconds.'
  verdict: out_of_scope
  of: null
  implementation_of: null
  why: 'Not an operator over sets/fields -- it is the ENGINE''s temporal-integration contract, the definition

    of the clock itself. It carries no biological content of its own: it does not compute a force, an

    energy term, a flux, or a division; it defines what "one step" MEANS for every mechanism that does.

    None of the seven Plexus kinds describes a scheduler, and none of the 42 registered contracts is a

    time unit -- the whole vocabulary is operators, and a clock is orthogonal to it. The kind/family/set

    below are assigned only to satisfy the schema (a global tick is least-badly a `broadcast`); that no

    kind genuinely fits is itself the evidence for `out_of_scope`.


    This entry''s real value is the CONTRADICTION it records, and it is the sharpest in the whole atlas:

    the Plexus engine advances state by INTEGRATING operator deltas against a real-valued dt (an operator

    returns d/dt of some quantity and the engine accumulates dt * delta). CompuCell3D has no dt and no

    integrator at all. Time is the Monte Carlo Step -- one attempted pixel copy per lattice site, accepted

    with probability 1 if dE < 0 else exp(-dE/T). Consequently a RATE cannot be a per-second coefficient

    here; it must be re-expressed as a per-MCS acceptance PROBABILITY, and any Plexus operator ported
    to

    this target would have its `emit: velocity`/dt-scaled delta silently mismatched -- the two frameworks

    disagree on the meaning of the time axis, not merely its units. This gap is exactly the question the

    campaign exists to measure and must not be papered over: the Plexus algebra can express the energy

    TERMS of a Potts model, but the promoted engine cannot express its TIME.

    '
  contract:
    name: advance_time
    kind: broadcast
    family: hierarchy
    set: lattice_site
    inputs:
    - temperature (Potts T, sets the Metropolis acceptance probability exp(-dE/T))
    - total_energy_delta (the summed dE from every registered energy-term plugin for a proposed copy)
    outputs:
    - one attempted copy per lattice site per tick (a full sweep = 1 MCS), each accepted or rejected by
      the Metropolis rule
    reads:
    - cell_id_lattice (to pick a source site and a random neighbour target for each attempted copy)
    writes:
    - simulation_clock (the integer MCS counter -- the ONLY state the time unit itself owns; it writes
      no cell state and no field, and there is no real-valued dt to advance)
    maps: []
