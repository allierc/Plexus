- id: momentofinertia
  order: 19
  raw_name: MomentOfInertia
  raw_kind: Plugin (MomentOfInertiaPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5350
  paper_section: 'No extracted paper text for this target. CHECKABLE anchors are the source only: class
    docstring

    "MomentOfInertia Plugin" (PyCoreSpecs.py:5351) and the compiled MomentOfInertiaPlugin

    (cpp/CompuCell.py:9002, a CellGChangeWatcher). Swat et al. (2012) Methods Cell Biol 110:325-366

    is the framework reference, but the specific page/section describing this plugin is UNREAD --

    not cited to a page I have not seen.

    '
  summary: 'A bookkeeping tracker, not an energy term and not an update the modeller writes. Registered
    as a

    CellGChangeWatcher (CompuCell.py:9002): the Potts solver calls it after every ACCEPTED pixel copy,

    and it incrementally updates the six second-moment / inertia-tensor components stored on each cell

    (CellG.iXX, iYY, iZZ, iXY, iXZ, iYZ), measured relative to that cell''s centre of mass. From those

    components it derives the cell''s shape observables: eccentricity (CellG.ecc), the equivalent-ellipsoid

    semiaxis lengths (getSemiaxes / getSemiaxesXY/XZ/YZ / getSemiaxes3D) and the principal-axis

    orientation angle (cellOrientation_xy/xz/yz). It changes no cell type, volume or position -- it only

    makes cell SHAPE and ORIENTATION queryable, which shape-dependent plugins (e.g. oriented growth,

    the oriented-cellsort example) then consume.

    '
  equations: "A cell is a set S of lattice sites {r_i}, all sharing one id. Let the centre of mass be\n\
    \  r_CM = (1/N) * sum_i r_i,   N = |S| = cell volume (site count).\nThe plugin maintains the second-moment\
    \ (inertia) tensor of S about r_CM. Writing\nx' = x - x_CM, y' = y - y_CM, z' = z - z_CM, the physicist's\
    \ inertia tensor is\n  I_XX = sum_i (y'^2 + z'^2)      I_XY = - sum_i x' y'\n  I_YY = sum_i (x'^2\
    \ + z'^2)      I_XZ = - sum_i x' z'\n  I_ZZ = sum_i (x'^2 + y'^2)      I_YZ = - sum_i y' z'\nstored\
    \ on CellG as iXX, iYY, iZZ, iXY, iXZ, iYZ.\n(SIGN/DIAGONAL CONVENTION -- physicist form above vs\
    \ the raw central second moment\nM_XX = sum x'^2 etc. -- is set in the compiled core and is NOT verifiable\
    \ from the Python layer;\nsee surprises. The derived quantities below are convention-independent up\
    \ to that choice.)\n\nIt is maintained INCREMENTALLY, never recomputed from scratch: on an accepted\
    \ copy of site p from\ncell A into cell B, helper precalculateInertiaTensorComponentsAfterFlip (CompuCell.py:4235)\
    \ returns\nthe updated tensors for the gaining/losing cells given the single-site delta and the CM\
    \ shift, so the\nper-step cost is O(1) per cell, not O(N).\n\nShape observables (2D principal case,\
    \ tensor T = [[iXX, iXY],[iXY, iYY]]):\n  eigenvalues  lambda_min <= lambda_max  of T\n  semiaxes\
    \     a, b  proportional to functions of the eigenvalues (equivalent uniform ellipsoid)\n  eccentricity\
    \ ecc = sqrt(1 - lambda_min/lambda_max)    (via eccFromComps, CompuCell.py:8994)\n  orientation  theta\
    \ = cellOrientation_xy  = angle of the major principal axis\nIn 3D the full 3x3 tensor is diagonalised\
    \ and getSemiaxes3D returns the three semiaxis lengths.\n"
  params: {}
  state_io:
    reads: 'Per accepted pixel copy: the copied site coordinate p = (x,y,z), the source cell A and target

      cell B (CellG*), and each affected cell''s current volume N and centre of mass r_CM (so it reads

      xCM/yCM/zCM, which the CenterOfMass tracker must also maintain) plus the pre-flip tensor

      components it is about to update.

      '
    writes: 'Per affected cell, in place on CellG: iXX, iYY, iZZ, iXY, iXZ, iYZ (the maintained tensor)
      and,

      on demand from those, the derived shape fields ecc and the semiaxes/orientation returned by the

      getSemiaxes*/cellOrientation_* accessors. It writes NO field, NO type, NO volume, NO position,

      and returns no energy delta -- it does not participate in the Metropolis acceptance at all.

      '
  surprises:
  - 'NOT an energy term and NOT a modeller-written update. It is a CellGChangeWatcher -- a passive

    observer the Potts solver invokes AFTER a copy is accepted. This is a third category next to

    ''energy plugin'' and ''stepper'': a per-accepted-flip incremental REDUCTION that keeps a derived

    statistic (here the inertia tensor) in sync with the pixel set. A reimplementer who models it as

    an energy or as a batch recompute-every-MCS gets the coupling and the O(1) cost wrong.

    '
  - 'Zero constructor parameters -- the spec''s __init__ takes nothing and emits a bare

    <Plugin Name="MomentOfInertia"/> element. There is nothing to tune; its only ''parameter'' is the

    implicit dependency that a CenterOfMass tracker be present so xCM/yCM/zCM are valid, otherwise the

    r_CM the tensor is measured about is stale.

    '
  - 'The exact diagonal/sign convention (physicist inertia tensor sum(y''^2+z''^2) on the diagonal, vs

    the raw central second moment sum(x''^2)) lives in the compiled C++ (MomentOfInertiaPlugin,

    not readable here) and could not be verified from the Python bindings. I inferred the physicist

    form from the attribute names and the physics; the eccentricity/semiaxis DERIVATIONS

    (eccFromComps, getSemiaxes) are what downstream code actually reads and are robust to the choice.

    '
  - 'Incremental maintenance means round-off can accumulate over a long run: the tensor is updated by

    deltas after every accepted flip rather than re-summed, so a reimplementer comparing against a

    from-scratch recompute should expect small drift, not bit-identity.

    '
  - 'Dimensionality-branched accessors: getSemiaxesXY / XZ / YZ give 2D principal analyses in each

    coordinate plane, while getSemiaxes3D diagonalises the full 3x3 tensor. Picking the wrong one for

    the lattice dimension yields a degenerate (flat) ellipsoid.

    '
  - 'The maintained fields are READ-ONLY from the modeller side: the Python binding overrides the setter
    for iXX/iYY/iZZ/iXY/iXZ/iYZ (and ecc) to raise AttributeError -- e.g. set_iXX at cpp/CompuCell.py:649
    raises "iXX is read only variable" (CellG_ecc_set exists but the derived fields cannot be assigned
    this way). Only the plugin, via the Potts change-watcher callback, may update them. This hard-enforces
    the observer characterisation: a modeller cannot inject or override cell shape, only read it. A Plexus
    reimplementation that exposes the tensor as a writable state field would be a category error -- it
    is a computed reduction, not modeller state. '
  - 'The watcher hook is field3DChange (CellGChangeWatcher interface, cpp/CompuCell.py:9016 for this plugin;
    base at 3000), NOT a per-MCS stepper: the Potts solver calls field3DChange when a lattice site''s
    cell id changes (an accepted copy), passing the site and the before/after cells. The helper returns
    an InertiaTensorComponents struct (cpp/CompuCell.py:4200) carrying the six updated components. A reimplementer
    who hooks a fixed per-step or per-MCS schedule rather than the per-accepted-change event will mis-sync
    the tensor with the pixel set. '
  verdict: refinement
  of: aggregate
  implementation_of: aggregate
  why: "MomentOfInertia is the SECOND-MOMENT sibling of CenterOfMass, and CenterOfMass was\nalready aliased\
    \ to `aggregate` (the centroid = first-moment reduction of a cell's\nlattice sites). The reduction\
    \ machinery is bit-for-bit the same shape: reduce the\ncontained lattice-site child set onto its parent\
    \ cell along the `parent` (containment)\nmap, per cell, publishing a READ-ONLY derived readout and\
    \ returning no energy /\nacceptance delta (aggregate.py: EMIT=None, MAY_MUTATE_INTEGRATED_STATE, returns\
    \ {}).\nSame kind (aggregate), same family (hierarchy), same set (cell), same input\n(the site child\
    \ set, each site occupancy 1), same map (parent). So this is squarely the\naggregate contract, not\
    \ a new one -- hence implementation_of: aggregate, and the ledger\nshould count aggregate ONCE across\
    \ the two siblings, not twice.\n\nIt is a REFINEMENT and not an alias because two SIGNATURE fields\
    \ must widen; the current\nregistered `aggregate` (its sole implementation, Centroid) cannot admit\
    \ this reduction as\nwritten:\n(1) WRITES / OUTPUTS. Centroid writes the parent's `pos` (a first-moment\
    \ mean, a D-vector).\n    MomentOfInertia writes a SECOND-moment TENSOR -- the six components iXX,iYY,iZZ,iXY,\n\
    \    iXZ,iYZ -- and the shape observables derived from it (eccentricity, equivalent-ellipsoid\n  \
    \  semiaxes, principal-axis orientation angle). A position readout and a shape/orientation\n    readout\
    \ are different output fields; the contract's `writes` must widen from {pos} to\n    also admit a\
    \ derived shape/inertia field.\n(2) READS. Centroid reads only child positions and occupancy (the\
    \ weight/divisor). The\n    second moment is taken ABOUT the centre of mass (x' = x - x_CM), so this\
    \ reduction also\n    READS the parent's `pos` -- i.e. it depends on the centroid aggregate having\
    \ already run.\n    That is a genuinely new input edge the centroid signature does not have.\nWidening\
    \ the aggregate contract this way is additive: existing centroid users are not broken\nfunctionally\
    \ (a new reduction/output variant does not change what centroid computes), but the\nCOST that must\
    \ be costed is that `aggregate`'s declared reads/writes are no longer just\n{pos}->{pos}; any consumer\
    \ or validator that assumed aggregate reduces only to a position, and\nany dependency-ordering that\
    \ assumed aggregate has no parent-state input, must now account for\na moment reduction that reads\
    \ parent.pos and writes a shape tensor (an intra-aggregate ordering\nconstraint: centroid before second-moment).\n\
    \nWhy not `new`: the only thing separating this from the promoted contract is the reduction\nkernel\
    \ and its output field; the entire children->parent reduction structure is already the\naggregate\
    \ contract, so calling it new would double-count the same operator family and\ncorrupt the saturation\
    \ measurement -- exactly what CenterOfMass's alias was guarding against.\nWhy not `alias`: aggregate's\
    \ registered signature writes a position and reads no parent state;\na tensor/shape readout measured\
    \ about the COM is not expressible without changing those fields.\nThe closest OTHER contract is CenterOfMass's\
    \ `aggregate` (centroid) itself -- this is its\nhigher-moment refinement, not a distinct mechanism.\n"
  contract:
    name: aggregate
    kind: aggregate
    family: hierarchy
    set: cell
    inputs:
    - site (the contained lattice-site child set; each site carries occupancy 1)
    outputs:
    - cell (the parent whose derived shape tensor / orientation is published)
    reads:
    - site.pos (the (x, y, z) coordinate of each lattice site the cell owns)
    - site.occupancy / cell.volume (the site count, the reduction weight and the divisor)
    - cell.pos (the centre of mass the second moment is measured about; supplied by the sibling centroid
      aggregate -- a NEW parent-state input relative to the centroid signature)
    writes:
    - cell.inertia (the six second-moment components iXX,iYY,iZZ,iXY,iXZ,iYZ about the COM, and the shape
      observables derived from them -- eccentricity, equivalent-ellipsoid semiaxes, principal-axis orientation;
      a read-only derived readout, no energy / acceptance delta -- the WIDENED write field relative to
      the centroid's cell.pos)
    maps:
    - parent
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: neighbortracker
  order: 20
  raw_name: NeighborTracker
  raw_kind: Plugin (NeighborTrackerPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L2393
  paper_section: "Source anchors (verified 2026-08-02):\n  - Spec class: PyCoreSpecs.py:L2393 (NeighborTrackerPlugin,\
    \ name \"neighbor_tracker\").\n  - Python aggregates: core/iterators.py:L366 (CellNeighborListFlex)\
    \ and its\n    common_surface_area_by_type / neighbor_count_by_type at L415/L429; the null->type-0\n\
    \    mapping is at L410, L425, L440.\n  - Accessor entry point: core/PySteppables.py:L1498 (get_cell_neighbor_data_list).\n\
    Library \"doc\": doc/code_ref/.../plugins/NeighborTrackerPlugin.rst is a BARE autodoc\nstub (7 non-blank\
    \ lines: `.. autoclass:: NeighborSurfaceData` + `.. autoclass::\nNeighborTrackerPlugin`, no members\
    \ documented, no prose, no equation). So the docs add\nnothing beyond the compiled class. No dedicated\
    \ equation/section for it in Swat et al.\n(2012) Methods Cell Biol 110:325-366 -- it is bookkeeping,\
    \ not a named energy term; the\nsource is the only evidence.\n"
  summary: 'A pure TRACKER plugin: it contributes nothing to the Potts energy and returns no

    delta. For every cell it maintains a set of its current neighbours and, for each

    neighbour, the common surface area (the number of shared lattice-site boundary

    links between the two cells). This per-cell adjacency+contact-area table is derived

    state that OTHER plugins/steppables read (e.g. contact-style or type-composition

    queries); the plugin itself never changes any cell''s volume, surface, or position.

    '
  equations: "State per cell c is a set N(c) of NeighborSurfaceData records, each a pair\n    (neighborAddress\
    \ = pointer to neighbour cell b,  commonSurfaceArea = A_cb)\nwhere A_cb = number of lattice-site boundary\
    \ links whose two sides belong to cells\nc and b respectively (medium counts as the null neighbour,\
    \ type 0).\n\nThe table is NOT recomputed by full scan; it is updated INCREMENTALLY on every\nACCEPTED\
    \ pixel copy. When a boundary site flips its cell id, for each affected\nneighbour pair the tracker\
    \ calls, in the compiled core:\n    incrementCommonSurfaceArea(...)   -> A_cb += (links gained)\n\
    \    decrementCommonSurfaceArea(...)   -> A_cb -= (links lost)\nA neighbour record is pruned when\
    \ its area reaches the removable state\n(NeighborSurfaceData.OKToRemove, i.e. A_cb == 0). Records\
    \ are kept in an ordered\nset (operator< / operator== defined on the data) keyed by neighbour identity.\n\
    \nPython-side aggregates built on top of the raw table (iterators.py CellNeighborListFlex):\n    common_surface_area_by_type[t]\
    \ = sum over neighbours b of A_cb  where type(b)=t\n    neighbor_count_by_type[t]      = count of\
    \ neighbours b with type(b)=t\n(a null neighbourAddress is reported as type 0 = medium.)\n\nThere\
    \ is no energy term: dE_NeighborTracker == 0 by construction.\n"
  params: {}
  state_io:
    reads: "- The cell-id lattice at accepted-copy boundaries (which cell owns each site and\n  its neighbours),\
      \ supplied by the Potts boundary machinery -- the plugin listens\n  to accepted pixel copies rather\
      \ than reading a Plexus field.\n- Each cell's extra-attribute storage slot (ExtraMembersGroupAccessor)\
      \ where its\n  own NeighborTracker record lives.\n"
    writes: "- Per-cell derived state cellNeighbors: a set of (neighborAddress, commonSurfaceArea)\n \
      \ records. This is the ONLY thing it writes; it writes no energy delta and no\n  volume/surface/COM\
      \ field. In Plexus terms it emits neither an energy contribution\n  nor a per-cell update to a canonical\
      \ field -- it maintains an auxiliary adjacency\n  relation over the set of cells, keyed and pruned\
      \ by shared-boundary count.\n"
  surprises:
  - 'commonSurfaceArea is an INTEGER site-boundary COUNT, not a real area. In 2D it is a

    count of shared pixel edges; in 3D a count of shared faces. A reimplementer who

    stores a float "area" or a Euclidean contact length will diverge from the oracle.

    '
  - 'Updated INCREMENTALLY (increment/decrement on each accepted copy), never by a full

    neighbourhood rescan. Getting the increment/decrement bookkeeping wrong silently

    corrupts the table without any error; there is no periodic recompute to self-heal.

    '
  - 'Medium is a first-class neighbour: a null neighborAddress is reported as cell type 0.

    Aggregates that skip null neighbours will undercount the medium-facing surface.

    '
  - 'Neighbour records are pruned exactly when commonSurfaceArea hits 0 (OKToRemove), so

    "is b a neighbour of c" means "currently shares >=1 boundary link", not "was ever

    adjacent". The relation is symmetric in principle but each cell stores its own copy.

    '
  - 'The plugin has NO constructor parameters and nothing to tune. It is a PREREQUISITE

    dependency loaded so that other plugins/steppables can query neighbours; its presence

    changes no dynamics on its own. Loading it or not is the only "knob".

    '
  - 'The neighbour set is ordered (operator< / operator== on NeighborSurfaceData) and keyed

    by neighbour identity; iteration order is deterministic but tied to that ordering, not

    to insertion or geometry -- code that assumes geometric ordering of neighbours is wrong.

    '
  verdict: refinement
  of: radius_graph
  implementation_of: radius_graph
  why: 'This builds the RELATION among cells -- for each cell c, the set of cells it currently

    touches -- which is precisely what a rewire/topology operator earns its place doing: it

    leaves a live who-interacts-with-whom graph on the set that lateral operators (here the

    CC3D contact/adhesion energy terms) read. That distinguishes it sharply from its sibling

    BoundaryPixelTracker (ruled out_of_scope): that plugin classifies a single cell''s OWN

    sub-elements (boundary vs interior pixel) and builds NO relation among cells, so it

    collapses to nothing in the point-particle representation. NeighborTracker does not

    collapse -- its output IS the interaction graph, so it is in scope and it is the

    neighbour-graph contract, i.e. `radius_graph` (src/plexus/operators/graph.py, the only

    registered rewire/topology op: set `edge_index` to the live within-set relation, emit no

    delta).


    It is not an ALIAS of radius_graph because radius_graph''s registered output is a bare,

    unweighted `edge_index`: NeighborTracker''s defining product is a WEIGHTED relation, each

    edge carrying commonSurfaceArea = the integer count of shared lattice-boundary links, a

    first-class physical quantity the contact/adhesion terms consume (contact energy scales

    with it). radius_graph structurally cannot represent that weight, so it does not already

    cover this mechanism.


    Hence REFINEMENT, and the signature field that must widen is `outputs` (and correspondingly

    `writes`): from `[edge_index]` to `[edge_index, edge_weight]`, the per-edge contact area.

    What that breaks for existing users: every current radius_graph consumer assumes edges are

    weightless and purely metric. A rewire contract that now promises an edge weight either

    forces radius_graph to synthesise a contact-area value it has no basis for (point particles

    share no boundary, only a distance), or the weight becomes OPTIONAL -- in which case any

    lateral operator that begins to REQUIRE the weight silently fails on the distance-based

    implementation with no crash. That is a costed widening of the contract, not a free add.


    It is not NEW: the "rebuild the within-set relation, emit no delta, others read the edges"

    biology is identical to radius_graph''s, so spinning up a separate contract would inflate the

    count for what is the same rewire/topology slot merely widened. The two differences beyond

    the weight are IMPLEMENTATION, not contract, so implementation_of is set to radius_graph:

    (a) the edge criterion is shared-lattice-boundary contact rather than a Euclidean radius

    cutoff -- an interchangeable way to build the same relation; (b) it is maintained

    INCREMENTALLY (increment/decrement on each accepted pixel copy) rather than by a full

    per-tick rescan -- a numerics optimisation of the same output, not a new capability.

    '
  contract:
    name: contact_graph
    kind: rewire
    family: topology
    set: cell
    inputs: []
    outputs:
    - edge_index
    - edge_weight
    reads:
    - cell_id_lattice
    writes:
    - cell.neighbors
    - edge.common_surface_area
    maps: []
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: pifdumper
  order: 21
  raw_name: PIFDumper
  raw_kind: Steppable (PIFDumperSteppable)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L6012
  paper_section: 'No extracted paper text for this target. Swat et al. (2012) Methods Cell Biol

    110:325-366 discusses the PIFF (Potts Initial File) cell-layout format used by

    PIFInitializer / BlobInitializer, but no page was read. CHECKABLE source

    anchors for the format and CC3DML used here instead: the canonical dumper

    snippet generatePIFDumperSteppable at

    cc3d/twedit5/Plugins/CC3DMLGenerator/CC3DMLGeneratorBase.py:1271, and a real

    dumped file at

    cc3d/tests/plugin_test_suite/AdhesionFlexPython_test_generate/Simulation/initial_configuration.piff:1.

    '
  summary: 'A pure-output Steppable, not a physics term. Every `frequency` Monte Carlo

    steps it READS the entire cell lattice (each site''s cell id, cluster id and type) and

    WRITES a snapshot to disk as a PIF (Potts Initial File): one plain-text line

    per lattice site (voxel). It changes NOTHING in the

    simulation state -- it is a serialization sink whose output can later be fed

    back to a PIFInitializer as an initial condition. In Plexus terms it is an

    observer/sink over the cell-id field: reads state, emits no delta.

    '
  equations: "No dynamics. The step is a serialization pass over the lattice, emitted only on\nsteps where\
    \ (mcs % frequency == 0). CONFIRMED PIF line format, read from a real\n.piff written by the same core\n\
    (tests/.../AdhesionFlexPython_test_generate/Simulation/initial_configuration.piff):\n\n    [header\
    \ line]  Include Clusters        (present when cluster ids are dumped)\n    clusterId  cellId  cellTypeNAME\
    \  xLow xHigh  yLow yHigh  zLow zHigh\n\ne.g. the literal line `8  8  Cell2  119 119  53 53  0 0`.\
    \ Three corrections to\nthe library-guide sketch that the earlier draft copied:\n  (1) the FIRST column\
    \ is the CLUSTER id, not the cell id (cell id is second);\n  (2) the type is written as its NAME string\
    \ (\"Cell2\"), NOT a numeric type index;\n  (3) the dumper emits ONE LINE PER VOXEL (xLow==xHigh,\
    \ yLow==yHigh, zLow==zHigh\n      in the sample) -- the box form xLow..xHigh is what the PIF grammar\
    \ ALLOWS,\n      but the dumper does not run-length-compress into boxes.\nThis file is the inverse\
    \ of what PIFInitializer reads back in. The Python spec\nhere only declares the steppable and its\
    \ CC3DML; the actual traversal +\nper-voxel write live in the compiled core (PlayerPython.FieldWriter\
    \ also exposes\ngeneratePIFFileFromVTKOutput as the offline equivalent).\n"
  params:
    pif_name:
      role: output_file_path
      note: 'Name/path of the PIF file to write. check_dict rejects it as invalid when

        len(pif_name) == 0 (the lambda is the INVALID predicate). NOTE: the same

        field name `pif_name` is reused by the sibling PIFInitializer (L5960) as an

        INPUT file that must already exist (its validate() calls os.path.isfile);

        here it is an OUTPUT target and is NOT existence-checked.

        '
    frequency:
      role: output_interval_mcs
      note: 'Integer Monte-Carlo-step interval between dumps; PyCoreSpecs default is 1

        (dump every MCS), but the canonical twedit-generated CC3DML defaults it to

        100. check_dict rejects frequency < 1. Its canonical home is a "Frequency"

        ATTRIBUTE on the <Steppable> header (that is where both from_xml and the

        core read it) -- but PyCoreSpecs.generate_header never writes that

        attribute, so this spec stores/validates it yet drops it on serialization.

        See surprises.

        '
  state_io:
    reads:
    - cell.id field (every lattice site's owning cell id -- second PIF column)
    - cell.cluster_id field (dumped as the FIRST PIF column when clusters are included)
    - cell.type field (every lattice site's cell type, written as a NAME string)
    - lattice dimensions (implicit, to bound the traversal)
    writes:
    - external file (PIF text on disk) -- NOT simulation state
    note: 'No simulation-state field is written. This is the clean case of the

      "energy term vs update" distinction pushed one step further: it is neither.

      It returns no delta and biases no pixel-copy acceptance; it is a read-only

      tap on the cell-id field with a side effect outside the state vector.

      '
  surprises:
  - 'ROUND-TRIP LOSS OF `frequency` (a real bug, now localized). from_xml reads

    frequency from a "Frequency" ATTRIBUTE ON THE <Steppable> HEADER

    (findAttribute("Frequency") / getAttributeAsInt, L6062-6063) -- and that is

    exactly where the canonical CC3DML puts it: twedit''s

    generatePIFDumperSteppable (CC3DMLGeneratorBase.py:1271) emits

    <Steppable Type="PIFDumper" Frequency="100">. But generate_header (L525) emits

    ONLY {"Type": registered_name} and the `xml` property (L6037) adds only a

    PIFName child; neither writes the Frequency attribute. So a spec built with

    frequency=10 serializes to CC3DML with no Frequency and reloads as the default

    1. __getstate__ (L6048) drops it too. The datum lives in hand-written XML but

    is destroyed by any Python round-trip through this spec.

    '
  - 'The library-guide line sketch the earlier draft copied

    ("cellId cellType xLow..") is WRONG on three counts, confirmed against a real

    dumped .piff (see equations): the real line LEADS with a clusterId column

    (cell id is second), writes the cell TYPE AS A NAME string not a numeric

    index, and is prefixed by an "Include Clusters" header line -- and the dumper

    writes one voxel per line rather than run-length boxes.

    '
  - 'The canonical dumper CC3DML also carries a <PIFFileExtension> element (twedit

    emits "piff", CC3DMLGeneratorBase.py:1280) and names the file after the

    SimulationName, with the MCS appended by the core to make per-dump filenames.

    PyCoreSpecs''s PIFDumperSteppable emits NEITHER a PIFFileExtension element NOR

    any MCS-suffix logic -- it declares only PIFName, so this spec under-specifies

    the actual on-disk file naming/extension.

    '
  - 'The `xml` property is byte-identical to sibling PIFInitializer''s `xml`

    (both emit just a PIFName element under the Steppable header). The only

    XML-level distinguisher between "write a PIF" and "read a PIF" is the

    Steppable Type attribute (generate_header -> Type="PIFDumper" vs the

    initializer''s registered_name), not the element body.

    '
  - '`pif_name` semantics flip between the two classes that share the field:

    INPUT-must-exist for PIFInitializer, OUTPUT-target for PIFDumper. A

    reimplementer copying the validate() logic across would wrongly demand the

    dumper''s target already exist.

    '
  - '__getstate__ returns (xml string, (), {"pif_name": ...}) -- pickling drops

    frequency too, consistent with the xml omission above.

    '
  verdict: out_of_scope
  of: null
  implementation_of: null
  why: 'PIFDumper is a serializer -- the archetypal out_of_scope mechanism named in this loop''s own

    rules. It carries ZERO biological content and ZERO dynamics: every `frequency` MCS it traverses

    the cell-id lattice and writes one plain-text line per voxel (clusterId cellId typeNAME + voxel

    extents) to a PIF file on disk. It returns no energy delta, biases no pixel-copy acceptance, and

    writes no cell, field, or Hamiltonian term -- a run with it loaded is bit-identical to one

    without (the only effect is a file appearing on disk). It is a read-only tap on the cell set with

    a side effect entirely outside the state vector.


    The closest registered contract is `playback` (field/fields), and the relationship is exactly

    inversion: playback READS recorded frames off external storage and drives them INTO a field;

    PIFDumper reads live state OUT to external storage. But that inversion is precisely why it cannot

    alias `playback` -- playback earns its place by producing an integrable field the engine consumes

    each step (it is a source of dynamics), whereas the dumper consumes nothing and produces nothing

    the engine ever reads back within the run. Promoting a sink whose only product is a disk artifact

    -- as `new` or as a `playback` alias -- would let I/O plumbing count toward the operator

    vocabulary and corrupt the saturation measurement. There is no biological process here to name.

    The contract below is recorded ONLY to document the sink''s typed shape (whole-cell-set read ->

    external bytes); its `kind: field / family: fields` is a forced fit borrowed from `playback`''s

    neighbourhood, not a claim that the dumper is a field operator.

    '
  contract:
    name: checkpoint
    kind: field
    family: fields
    set: cell
    inputs:
    - pif_name
    - frequency
    outputs:
    - pif_file
    reads:
    - cell.id
    - cell.cluster_id
    - cell.type
    writes:
    - external.pif_file
    maps: []
  status: normalized
  module: null
  test: null
