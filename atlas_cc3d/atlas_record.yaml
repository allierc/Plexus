  surprises:
  - 'The whole difference from DiffusionSolverFE is one emitted element: <AdditionalTerm> (L6772-6773),

    a muParser reaction expression that may reference OTHER fields BY NAME. That turns M independent

    diffusants into ONE coupled reaction-diffusion system. The SAME python attribute (additional_term)

    exists on DiffusionSolverFE''s spec but its DiffusionData.xml never writes it, so it is dead there
