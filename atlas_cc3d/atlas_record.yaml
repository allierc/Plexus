- id: pifinitializer
  order: 22
  raw_name: PIFInitializer
  raw_kind: Steppable (PIFInitializer)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5956
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366 discusses cell-field

    initialization in general; no page verified (no extracted paper text for this

    target). Checkable library anchor: cc3d/core/PyCoreSpecs.py:L5956 (class

    PIFInitializer) and cc3d/doc/code_ref/user/build/core/PyCoreSpecs.rst:314

    (autoclass PIFInitializer). Format examples READ (both header modes verified):

    cluster-mode cc3d/tests/plugin_test_suite/CompartmentExample_test_run/Simulation/3D_LINE_BASE.piff
    (9 tokens; clusterId 1 groups cells 1-5, so clusterId != cellId) and AdhesionFlexPython_test_run/.../initial_configuration.piff;
    headerless cc3d/tests/plugin_test_suite/ExternalPotential_test_run/Simulation/FocalPointInit.piff
    and amoebae_2D_secretion_test_run/Simulation/amoebae_2D.piff (8 tokens, no leading clusterId).

    '
  summary: 'An initialization steppable that runs ONCE at the start of a simulation. It

    reads a PIF ("Potts Initial File", .piff) whose name is given by pif_name, and

    paints the cell-id lattice directly: each line of the file names a cell and an

    axis-aligned box of lattice sites, and every site in that box is assigned to

    that cell (creating the cell on first mention). It does not evolve anything --

    it stamps the initial cell configuration onto the field, then is done. This is

    the most literal expression of the CC3D representation: a cell IS the set of

    lattice sites that share its id, built up here box-by-box.

    '
  equations: "No physics equation; a file-driven lattice-painting rule. The .py spec\n(PyCoreSpecs.py:5956)\
    \ only carries the file name and emits the CC3DML element\n<PIFName>{pif_name}</PIFName>; the actual\
    \ reading/painting is in the compiled\ncore (cpp/CompuCell3DSteppables/libCC3DPIFInitializer.so, not\
    \ readable here).\nBehaviour reconstructed from the .piff format observed in the test suite:\n\nOptional\
    \ first line:  \"Include Clusters\"\n  - if present  -> per-line token layout is:\n      clusterId\
    \  cellId  cellType  x1 x2  y1 y2  z1 z2\n  - if absent   -> per-line token layout is:\n      cellId\
    \  cellType  x1 x2  y1 y2  z1 z2\n\nFor each data line, for every lattice site (x,y,z) with\n    \
    \  x1 <= x <= x2,  y1 <= y <= y2,  z1 <= z <= z2   (inclusive box)\nassign  cellField[x,y,z] := cell(cellId),\
    \  the cell's type := cellType,\nand (cluster mode) the cell's clusterId := clusterId. A cell is created\
    \ the\nfirst time its id appears; later lines with the same cellId ADD sites to the\nsame set, so\
    \ a cell is the UNION of its boxes and need not be a single\nrectangle. Single-site lines are the\
    \ common case (x1==x2, etc.), i.e. the\nfile can enumerate the lattice pixel-by-pixel.\n"
  params:
    pif_name: 'initial_configuration_source -- filesystem path to the .piff file that

      defines the entire initial cell layout. This is the only constructor

      parameter and the only tunable; there is no numeric physics here.

      check_dict rejects only the empty string (''PIF needs a name'') at construction;

      validate() then raises SpecValueError unless os.path.isfile(pif_name) is true.

      '
  state_io: "This is an INITIALIZER (a one-shot Steppable at t=0), not an energy term and\nnot a per-step\
    \ update. In Plexus terms it neither returns a delta the engine\nintegrates nor participates in the\
    \ Metropolis accept/reject -- it seeds the\nstate the rest of the simulation then evolves.\nreads:\n\
    \  - external file pif_name (.piff text), NOT simulation state\nwrites:\n  - cell-id field over the\
    \ lattice (the sigma field mapping site to cell id)\n  - cell TYPE for each cell id named in the file\n\
    \  - cell clusterId for each cell (only when \"Include Clusters\" header present)\n  - implicitly\
    \ the roster of existing cells (cells are created as ids appear)\n"
  surprises:
  - 'A cell is NOT required to be a connected box. Multiple lines sharing a cellId

    accrete sites into one cell, so the initial cell can be an arbitrary union of

    boxes (or even disconnected). A reimplementer who keys on "one line = one

    cell" or "cell = rectangle" gets it wrong.

    '
  - 'The box bounds are INCLUSIVE on both ends: x1..x2 covers x2-x1+1 sites. Both

    forms occur in the test suite: single-site rows (AdhesionFlex

    initial_configuration.piff, "8 8 Cell2 119 119 53 53 0 0") enumerate the

    lattice pixel-by-pixel, while multi-site boxes (CompartmentExample

    3D_LINE_BASE.piff, "1 1 Side1 23 25 47 56 10 14" = a 3x10x5 box) fill a region

    in one line. A reimplementer must handle both, not assume single-site rows.

    '
  - 'The optional "Include Clusters" first line SILENTLY changes the column count:

    with header a data line is 9 tokens (clusterId cellId cellType x1 x2 y1 y2 z1 z2),

    without header it is 8 (cellId cellType ...). Parse the header before the columns;

    guessing column meaning from the first data row is unsafe. clusterId is genuinely

    independent of cellId -- verified in 3D_LINE_BASE.piff where clusterId 1 groups

    cellIds 1-5 -- so a parser that assumes clusterId==cellId corrupts compartment models.

    '
  - '2D vs 3D: files still carry z1 z2 columns; 2D simulations use z1==z2==0

    (see AdhesionFlex .piff). The z columns are always present, not optional.

    '
  - 'Internal spec name has a typo: name = "pif_initiazer" (missing ''l''). The

    CC3DML/registered name is "PIFInitializer"; code that keys off the internal

    name string must reproduce the typo. registered_name drives the emitted

    Steppable element with Type="PIFInitializer".

    '
  - 'check_dict for pif_name is (lambda x: len(x) == 0, "PIF needs a name"): it

    rejects only the EMPTY string at construction. Real file existence is

    deferred to validate() (os.path.isfile), which runs later; a nonexistent but

    non-empty path passes construction and fails only at validation time.

    '
  - 'Contrast with the sibling initializers this shares "order" space with:

    UniformInitializer / BlobInitializer generate cells procedurally from a few

    numeric params (box, gap, width, radius); PIFInitializer instead REPLAYS an

    explicit, fully-specified layout from disk. Same end state (a seeded cell

    field), opposite information source -- procedural vs. recorded.

    PIFDumperSteppable (PyCoreSpecs.py:6012) is the inverse op that WRITES this

    same format.

    '
  verdict: out_of_scope
  of: null
  implementation_of: seed
  why: 'INITIAL-CONDITION CONSTRUCTION by DESERIALIZATION, not a dynamical operator. Plexus

    operators transform state that already exists -- each returns a per-step delta the engine

    integrates over a set/field that is already present. PIFInitializer is the opposite shape:

    a one-shot that runs once at t=0 and CONSTRUCTS the starting partition (the sets

    themselves) by reading an external recorded file and painting cell ids onto an empty

    lattice, box by box. In Plexus that starting partition is supplied by configuration/seeding,

    not by any registered operator; there is nothing in the algebra to alias, and nothing that

    could widen to admit set-construction-from-a-file without ceasing to be a per-step operator.

    So this is framework mechanics for establishing the initial state -- out of scope for the

    OPERATOR algebra whose completeness this campaign measures.


    It is doubly out-of-scope: beyond being IC construction, it is specifically a DESERIALIZER

    whose exact inverse is PIFDumperSteppable (a serializer, PyCoreSpecs.py:6012). The two are a

    read/write pair over the PIF text format; a serializer/deserializer pair is the canonical

    example of plumbing with no biological content. The biology here -- "a cell is the SET of

    lattice sites that share its id" -- lives in the REPRESENTATION, not in this operator, which

    only parses text and stamps boxes.


    implementation_of: seed. PIFInitializer is the third member of the Blob / Uniform / PIF

    initializer family -- three interchangeable ways to build the SAME thing, the initial cell

    partition. The `seed` contract was already typed by the blobinitializer normalizer (order 2)

    with these three named as its implementations; recording implementation_of: seed here keeps

    the ledger counting `seed` ONCE rather than re-introducing it. Blob/Uniform generate the

    partition PROCEDURALLY from a few numeric params; PIF REPLAYS a fully-specified layout from

    disk -- same end state, opposite information source (procedural vs. recorded).


    The closest REGISTERED contract is cell_divide (structural/growth); widening it to cover

    de-novo population seeding would do violence to its biology -- division is mitosis, one

    parent set -> two daughters, conserving material and requiring a pre-existing cell, whereas

    seeding creates a whole population out of Medium with no parent. It is also NOT `playback`

    (field/fields): playback replays a recorded time-series to DRIVE a field DURING the run;

    PIFInitializer is a single t=0 read that establishes cell identities and then is done.

    '
  contract:
    name: seed
    kind: structural
    family: growth
    set: cell
    inputs:
    - recorded_layout_file (.piff path; the fully-specified initial partition, not numeric params)
    outputs:
    - initial_cell_partition
    reads:
    - external file pif_name (.piff text) -- NOT simulation state
    - cell_type_registry (to resolve type-name strings from the file to type ids)
    writes:
    - cell_field (each site in a named box assigned to that cell id -- building the SETS)
    - cell_type (per cell id, from the file's cellType column)
    - cell_cluster_id (per cell, only when the "Include Clusters" header is present)
    maps: "(empty lattice, recorded .piff layout)\n  -> a partition of the lattice into cell ids exactly\
      \ as enumerated in the file: for each\n     data line assign every site in the inclusive box (x1..x2,\
      \ y1..y2, z1..z2) to cell(cellId),\n     creating the cell on first mention and ADDING sites on\
      \ later mentions (a cell is the\n     UNION of its boxes, need not be a single rectangle). Type\
      \ and, in cluster mode,\n     clusterId are set per cell from the line. A one-shot deserialization\
      \ executed once at\n     t=0, not a per-step delta. Same seed contract as the procedural Blob/Uniform\
      \ variants;\n     the only difference is the information source (recorded file vs. numeric region\
      \ params).\n"
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: pixeltracker
  order: 23
  raw_name: PixelTracker
  raw_kind: Plugin (PixelTrackerPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5311
  paper_section: "No dedicated paper section \u2014 PixelTracker is an infrastructure plugin, not a\n\
    physics term, and is not individually described in Swat et al. (2012) Methods\nCell Biol 110:325-366.\
    \ Checkable source anchors: PyCoreSpecs.py:L5311\n(spec), cc3d/cpp/CompuCell.py:6002 (class PixelTrackerPlugin(CellGChangeWatcher);\
    \ field3DChange def at :6010, enableMediumTracker at :6031 -- verified at source),\ndoc/code_ref cpp/CompuCell/plugins/PixelTrackerPlugin.rst,\
    \ and the consumer\nPySteppables.get_cell_pixel_list (PySteppables.py:2465) + iterators.py:700\n(class\
    \ CellPixelList).\n"
  summary: "Bookkeeping/observer plugin. For every cell it maintains an explicit container\n(a set of\
    \ PixelTrackerData, each wrapping a Point3D) of the lattice sites that\ncurrently belong to that cell\
    \ \u2014 i.e. it materialises the inverse of the\ncell_field: the CPM lattice stores site -> cell\
    \ id, and PixelTracker builds and\nkeeps live the cell id -> {sites} map. It contributes NO energy\
    \ and changes no\nacceptance probability; it is a CellGChangeWatcher that reacts to each accepted\n\
    pixel copy and edits the two affected cells' pixel sets. Its purpose is O(1)\nenumeration of a cell's\
    \ pixels for downstream consumers (moment of inertia,\nwhole-cell deletion/translation, per-cell secretion,\
    \ custom steppables).\n"
  equations: "Not a Hamiltonian term: Delta H = 0, always. It is a state-mirroring update\ntriggered on\
    \ each ACCEPTED spin/pixel copy at site pt where oldCell -> newCell.\n\nLet PS(c) be the pixel set\
    \ attached to cell c. On field3DChange(pt, newCell, oldCell)\n(CompuCell.py:6010, PixelTrackerPlugin_field3DChange):\n\
    \    if oldCell is not medium (or track_medium):  PS(oldCell).erase(pt)\n    if newCell is not medium\
    \ (or track_medium):  PS(newCell).insert(pt)\nSo after any accepted copy, PS(c) = { pt : cell_field[pt]\
    \ == c }, kept exactly\nconsistent with the lattice. Consumers read it as an iterator (CellPixelList,\n\
    iterators.py:700) yielding PixelTrackerData with a .pixel Point3D.\nThe medium (cell id 0) is tracked\
    \ only if track_medium is set (enableMediumTracker,\nCompuCell.py:6031); by default the medium's sites\
    \ are NOT indexed.\n"
  params:
    track_medium: 'role = index_scope_toggle. If True, also maintain the pixel set for the

      medium (cell id 0 / null cell) via enableMediumTracker; default False.

      Off by default because the medium spans most of the lattice, so indexing it

      is expensive and rarely needed. Boolean; emitted as a bare <TrackMedium/>

      child element only when True (PyCoreSpecs.py:5333).

      '
  state_io:
    reads: "- the accepted pixel-copy event: the changed site pt (Point3D), its new owner\n  newCell,\
      \ and its previous owner oldCell (arguments of field3DChange).\n- implicitly, the cell_field, since\
      \ it is a watcher registered on lattice changes.\n"
    writes: "- PS(c): the per-cell pixel set (concretely `pixelSet`, extra-member data\n  attached to\
      \ each CellG via PixelTrackerAccessor; reached as\n  pixelTrackerAccessor.get(cell.extraAttribPtr).pixelSet,\
      \ iterators.py:703/724).\n  erase(pt) on the old owner, insert(pt) on the new owner.\n- optionally\
      \ the medium's pixel set when track_medium is True.\n- writes NOTHING to the Hamiltonian / no dE\
      \ contribution; does not touch cell\n  volume, surface, or field concentrations.\n"
  surprises:
  - "It is NOT a physics mechanism at all \u2014 it writes no energy and never changes an\nacceptance\
    \ probability. A reimplementer who slots it next to Volume/Surface/\nAdhesion as \"another energy\
    \ plugin\" is wrong: it is a pure derived-index /\nobserver that mirrors lattice state. In Plexus\
    \ terms a cell already IS a set of\nsites, so this plugin materialises a representation Plexus treats\
    \ as primitive \u2014\nthe interesting question is whether the algebra needs an explicit \"index/inverse-map\n\
    over a field partition\" contract or gets it for free.\n"
  - 'Redundancy is the point and the hazard: PS(c) is fully derivable from cell_field

    at any instant, but CC3D keeps it live incrementally so that enumerating a cell''s

    pixels is O(|cell|) instead of O(|lattice|). Rebuilding it from scratch each read

    would be correct but defeats the purpose.

    '
  - "It is a hard dependency, not an optimisation, for several downstream tools \u2014\nbut the failure\
    \ mode is NOT uniform, and a reimplementer will get this wrong.\nThe low-level accessor get_cell_pixel_list\
    \ SILENTLY returns None when\nPixelTracker is not loaded (PySteppables.py:2473-2476, `if self.pixelTrackerPlugin:\n\
    ... return None`), it does NOT raise. The AttributeError('Could not find\nPixelTracker Plugin') is\
    \ raised by the consumers that wrap it: get_copy_of_cell_pixels\n(PySteppables.py:2603) and move_cell\
    \ (2534); delete_cell (2636) inherits that raise\nvia get_copy_of_cell_pixels; merge_cells (469) raises\
    \ its own \"did you load\nPixelTracker plugin?\". So code that calls the\nraw accessor and forgets\
    \ the None-check fails downstream with a confusing\nNoneType error, not a clear \"plugin missing\"\
    \ one. MomentOfInertia-style per-cell\ngeometry and whole-cell translation both iterate PS(c).\n"
  - 'The medium is excluded by default. Anyone iterating "all tracked pixels" and

    expecting medium sites will silently get nothing unless track_medium=True. The

    default is a performance guard, not a semantic statement that the medium has no

    pixels.

    '
  - 'Two-sided edit ordering: on a copy the SAME pt is erased from oldCell and inserted

    into newCell. A naive single-sided implementation (only add to new owner) leaks

    stale membership; the erase on the old owner is mandatory for consistency.

    '
  - "track_medium is the ONLY parameter. In particular there is no neighbor_order here\n\u2014 that belongs\
    \ to the sibling BoundaryPixelTrackerPlugin (PyCoreSpecs.py:~5260),\nwhich tracks only boundary/surface\
    \ pixels. PixelTracker tracks the FULL interior\npixel set of every cell.\n"
  verdict: out_of_scope
  of: null
  implementation_of: null
  why: 'Pure derived-index / observer, no biological content. The plugin returns no energy delta,

    writes no cell-id lattice site and no field, and touches no term of the Hamiltonian: Delta H

    = 0 always, so a simulation with it loaded is bit-identical to one without (confirmed at

    source -- PyCoreSpecs.py:5311 is a spec whose only effect is emitting an optional

    <TrackMedium/> element; the incremental update is a CellGChangeWatcher, CompuCell.py:6002,

    that only edits a per-cell cache on each ACCEPTED copy). Its sole product is the inverse of

    the cell_field: the CPM lattice stores site -> cell id, and PixelTracker materialises and

    keeps live the cell id -> {sites} map so downstream tools (MomentOfInertia, whole-cell

    move/delete, per-cell secretion) can enumerate a cell''s pixels in O(|cell|) rather than

    rescanning the whole lattice. That is a spatial index, not a process.


    The closest registered contract is `radius_graph` (also rewire/topology, also index-only,

    also emits no integrable delta -- src/plexus/operators/graph.py), and this entry is ruled the

    same way its direct sibling BoundaryPixelTracker was (also out_of_scope). But radius_graph

    earns its place by building the RELATION over the elements of a set (who-interacts-with-whom),

    the substrate every lateral message-passing operator runs on. PixelTracker builds no relation

    among cells; it merely reifies set membership -- which of the lattice''s sites belong to which

    cell id -- a distinction that exists only because a CC3D cell IS a set of lattice sites and

    the lattice alone gives you only site -> id, not id -> {sites}.


    The genuine temptation here (flagged in surprises) is that PixelTracker reifies the ATLAS''s

    OWN framing of a cell as a set of sites, so one could argue the algebra is MISSING an explicit

    "index / inverse-map over a field partition" contract and this is `new`. I reject that: in the

    promoted Plexus representation a cell is a first-class element (a point/particle with a set

    identity), and set membership is PRIMITIVE -- there is no scalar cell-id field to invert,

    because the partition IS the data structure, not a derived view of a lattice. An operator

    whose whole job is to reconstruct the primitive representation from a lower-level encoding has

    no biological content the language could name; it is representation-specific plumbing that

    collapses to nothing once the representation is a partition rather than a labelled lattice.

    Hence out_of_scope, not new (and deliberately not aliased to radius_graph, which would let

    acceleration caches inflate the vocabulary count).

    '
  contract:
    name: pixel_index
    kind: rewire
    family: topology
    set: cell
    inputs: []
    outputs:
    - pixel_set
    reads:
    - cell_id_lattice
    writes:
    - cell.pixels
    maps: []
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: reactiondiffusionsolverfe
  order: 24
  raw_name: ReactionDiffusionSolverFE
  raw_kind: Steppable (ReactionDiffusionSolverFE)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L6911
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366, sec. "PDE Solvers". Checkable in-tree

    anchor for this specific solver: cc3d/twedit5/Plugins/CC3DProject/diffusion_solvers_descr.py:11

    ("ReactionDiffusion: Solves coupled reaction-diffusion equations. Uses the Forward-Euler

    Method and allows flexibility in specifying reaction terms."). Reference-manual page:

    reaction_diffusion_solver.html.

    '
  summary: 'A steppable that advances one OR MORE scalar concentration FIELDS over the CPM pixel lattice

    by one explicit forward-Euler (FTCS) step per Monte Carlo Step -- the same diffuse-decay-secrete

    update as DiffusionSolverFE, but each field additionally carries a user-supplied REACTION term

    (AdditionalTerm): a muParser math expression that may reference the OTHER fields by name (and

    the cell type at the site). The fields therefore form a COUPLED reaction-diffusion system, not

    independent diffusants. Like DiffusionSolverFE it is a genuine field->field WRITE (it overwrites

    the concentration grids in place), unlike the energy-term Potts plugins in this atlas. The

    numerics live in the compiled core; PyCoreSpecs.py only declares the CC3DML the solver reads.

    '
  equations: "Continuous coupled system (the paper's PDE), for a set of fields f = 1..M:\n\n  d c_f /\
    \ dt  =  D_f * grad^2 c_f  -  lambda_f * c_f  +  S_f  +  R_f( c_1, ..., c_M, type )\n\nCode's realisation,\
    \ per pixel i and field f, one explicit forward-Euler step (DeltaX = DeltaT\n= 1 by default). The\
    \ diffusion+decay half is the SAME FTCS scheme transcribed for DiffusionSolverFE\n(see that entry,\
    \ order 14): a symmetric two-half-sum face-flux Laplacian with per-cell-type\nD_i, lambda_i, plus\
    \ the secretion sweep S_i. On top of that, the reaction term is added each step:\n\n  c_f,i^{t+1}\
    \  =  [ DiffusionSolverFE FE update of field f at i ]  +  DeltaT * R_f,i\n\n  R_f,i = additional_term_f\
    \ evaluated at i, using the CURRENT-step values of ALL fields at i\n          and the cell type occupying\
    \ i.\n\nWorked example -- FitzHugh-Nagumo (cc3d/tests/pde_solvers/.../ReactionDiffusion_2D_FN.xml):\n\
    \  field F:  D=0.01, AdditionalTerm = \"F-F*F*F/3+0.3-H\"\n  field H:  D=0.01, AdditionalTerm = \"\
    0.08*F-0.064*H+0.056\"\nso F's reaction reads H and H's reaction reads F -- the named-field cross\
    \ reference is the coupling.\n\nSymbols:\n  c_f,i      value of field f at pixel i (a field value,\
    \ not cell state)\n  D_f        diffusion coefficient of f = diff_types[type(cell at i)] if set, else\
    \ diff_global\n  lambda_f   decay coefficient of f     = decay_types[type(cell at i)] if set, else\
    \ decay_global\n  S_f        secretion source for f (additive rate, or on-contact; NOT Dirichlet-clamp\
    \ here)\n  R_f        the muParser AdditionalTerm expression for field f (the reaction)\n\nNOT ESTABLISHED\
    \ FROM SOURCE: the exact integration of R_f -- whether it is scaled by DeltaT,\nevaluated before or\
    \ after the diffusion sweep, and whether AutoscaleDiffusion rescales it -- lives\nin the compiled\
    \ core, which was not read. The continuous form and the named-field coupling ARE\nfrom the source\
    \ (spec xml + the FN example); the discretisation detail of R is inferred.\n"
  params:
    additional_term:
      role: 'reaction_term -- THE defining feature. A muParser math expression (per field) added to that

        field''s update each step; it may reference the OTHER fields BY NAME and the cell type, which

        is how the solver couples fields into a reaction-diffusion system. Emitted as <AdditionalTerm>

        by this solver''s DiffusionData.xml (L6772-6773). (In DiffusionSolverFE the identical spec_dict

        key exists but is never emitted -- dead there, live here.)

        '
    autoscale:
      role: 'numerical_rescaling_flag -- emits <AutoscaleDiffusion>; auto-rescales the diffusion constant
        /

        timestep to keep the forward-Euler step stable at large D. Default False, set explicitly in

        __init__ (L6925), NOT inherited from the base solver dict. This is the FE-stability knob that

        DiffusionSolverFE''s python spec did not expose.

        '
    fluc_comp:
      role: mass_conservation_flag -- emits <FluctuationCompensator>, corrects field values when a pixel
        changes cell id so cell motion conserves total field mass.
    diff_global:
      role: diffusion_coefficient (global default D_f; validated >= 0)
    decay_global:
      role: decay_rate (global default lambda_f; validated >= 0)
    diff_types:
      role: diffusion_coefficient_by_cell_type -- per-cell-type override D_t, keyed to the CPM cell occupying
        the pixel
    decay_types:
      role: decay_rate_by_cell_type -- per-cell-type override lambda_t
    init_filename:
