- id: uniforminitializer
  order: 29
  raw_name: UniformInitializer
  raw_kind: Steppable (UniformInitializer)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5833
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366 (chapter ref only -- no paper text
    extracted

    for this target). Checkable SOURCE anchors instead: class PyCoreSpecs.py:L5833, region

    PyCoreSpecs.py:L5742; CC3DMLGeneratorBase.py comment names it "Initial layout of cells in the

    form of rectangular slab" (L1189-1226). No page/figure cited that I have not read.

    '
  summary: 'An initialization steppable, run once before the Metropolis dynamics start. It fills one or

    more axis-aligned boxes (pt_min..pt_max) of the lattice with a regular grid of identical cubic

    cells of edge `width` lattice sites, leaving `gap` empty (medium) sites between adjacent cells,

    and stamps each cell with a type drawn from `cell_types`. It WRITES the cell-id field and the

    cell-type field of the lattice; it does not run every MCS and contributes nothing to the energy.

    '
  equations: "Not a numeric update -- a tiling of the lattice (RECONSTRUCTED from the emitted CC3DML\n\
    fields + standard CC3D semantics; the Python spec only serializes, the tiling itself is compiled\n\
    core and UNVERIFIED here). For a region with box [pt_min, pt_max],\ncell edge w = `width`, spacing\
    \ g = `gap`, each cubic cell occupies a block of sites\n  { (x0+i, y0+j, z0+k) : 0 <= i,j,k < w }\n\
    and the blocks are laid on a regular grid with stride (w + g) along each axis, so cell\norigins are\
    \ at pt_min + m*(w+g) for integer m, while the block+its trailing gap stays inside\nthe box. Every\
    \ site of a block shares one new cell id (a cell = a set of lattice sites sharing\nan id); each new\
    \ cell is assigned a type from `cell_types`. The exact type-assignment rule\n(round-robin vs. uniform-random\
    \ over the list) is decided in the compiled core and is NOT\nvisible in this Python spec -- see surprises.\n"
  params:
    pt_min:
      role: region_bound_min -- minimum corner (x,y,z lattice sites) of the box to be tiled
    pt_max:
      role: region_bound_max -- maximum corner (x,y,z lattice sites) of the box to be tiled
    width:
      role: cell_size -- edge length (in lattice sites) of each cubic cell; guarded width >= 1
    gap:
      role: cell_spacing -- number of empty (medium) sites left between adjacent cells; guarded gap >=
        0
    cell_types:
      role: type_palette -- list of cell-type names each newly stamped cell is assigned from
    regions:
      role: region_list -- UniformInitializer takes any number of UniformInitializerRegion specs, each
        with its own box/width/gap/types
  state_io:
    reads: []
    writes:
    - cell_id_field (lattice site -> cell id; new cells created as blocks of sites)
    - cell_type_field (each new cell -> a type from cell_types)
  surprises:
  - 'This is an INITIALIZER, not a per-MCS plugin: it runs exactly once at start and produces the

    initial cell configuration. Every other CC3D "mechanism" so far reads/perturbs an existing

    field; this one CREATES the cells the rest of the model then evolves. Reimplementers who model

    it as a stepping operator get the cadence wrong.

    '
  - 'A cell here is a SET OF LATTICE SITES sharing an id, laid down as a w*w*w block -- not a point

    with a radius. `width` is an integer site count, `gap` an integer site count; there are no

    physical-length units, only lattice sites.

    '
  - 'The type-assignment rule is NOT in this file. The Python spec only serializes Types as a

    comma-joined list into CC3DML (L5808); how the compiled UniformInitializer walks that list

    (cyclic round-robin vs. random draw per cell) is in the core and could not be determined from

    the spec. A reimplementer must not assume round-robin.

    '
  - 'Geometry vs. Potts box: pt_min/pt_max are validated against PottsCore dimensions (L5829-5830),

    but nothing here clips a partial cell that would straddle the box edge -- whether a trailing

    block narrower than `width` is emitted or skipped is a core-side decision not exposed here.

    '
  - '`gap` is documented as "blob gap" in the docstring (copy-pasted from BlobInitializer); for the

    uniform tiling it is the inter-cell spacing along each axis, not a blob radius. Do not read the

    docstring literally.

    '
  - 'Guard vs. default mismatch on the Region: __init__ defaults width=0 (L5754) but the check_dict

    guard rejects width < 1 (L5747), so a region constructed without an explicit width fails

    validation -- width has no usable default and must always be set. gap defaults to 0 and its

    guard only rejects gap < 0, so gap=0 (cells touching) is the valid default. from_xml (L5905)

    reads Width as required and makes Gap optional, matching this.

    '
  - 'Types round-trips through CC3DML as a comma-joined string (L5808) and is re-parsed by splitting

    on commas with spaces stripped (from_xml L5911); the ordered Python list is flattened to text,

    so any ordering the core relies on for type assignment survives only as list order in that string.

    '
  verdict: null
  of: null
  implementation_of: null
  why: null
  contract: null
  status: inspected
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: volume
  order: 30
  raw_name: Volume
  raw_kind: Plugin (VolumePlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L2033
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366 -- the GGH/CPM effective-energy (Hamiltonian)

    discussion, where the volume constraint is one term of E. NOTE: no paper text was available in

    this environment, so this anchor is the chapter''s known home for the term, NOT a page I have

    read. The equation below is reconstructed from the CC3D source declaration plus standard CPM

    convention; the compiled changeEnergy was not read.

    '
  summary: 'A per-cell-type (or, in bare mode, per-cell) quadratic penalty on the deviation of a cell''s

    site COUNT from a target count. It writes no state: on every proposed pixel copy it returns a

    dE that makes copies pushing a cell away from its target volume energetically costly, so the

    Metropolis rule rejects most of them. It is what gives a set-of-sites an incompressible "size",

    and thus its objecthood -- ablate it and the cells dissolve into medium.

    '
  equations: "Effective-energy volume term, summed over all real cells sigma (Medium, id 0, is exempt):\n\
    \n  E_vol = sum_{sigma>0} lambda_V(sigma) * ( V(sigma) - V_target(sigma) )^2\n\nwhere\n  V(sigma)\
    \        = number of lattice sites carrying id sigma -- a COUNT, not a physical volume\n  V_target(sigma)\
    \ = the cell's rest / target site count\n  lambda_V(sigma) = quadratic stiffness (energy per site^2);\
    \ lambda_V = 0 removes the term\n\nThe plugin never integrates this. On each attempted pixel copy\
    \ (the id at a source site is\nproposed to overwrite a neighbour site) it returns dE = E_vol(after)\
    \ - E_vol(before). A single\ncopy touches TWO cells at once: the gaining cell V -> V+1 and the losing\
    \ cell V -> V-1 (either\nmay be Medium, which contributes 0), so dE couples both quadratics and is\
    \ NOT symmetric in V.\nThe Metropolis rule then accepts the copy with P = 1 if the TOTAL dE (this\
    \ term + all others)\n<= 0, else exp(-dE / T), where T = the Potts fluctuation_amplitude (T = 10 in\
    \ the reference\nruns). Standard CPM convention has no leading 1/2 on the quadratic.\n"
  params:
    target_volume: 'rest_volume / target_size -- the site count a cell of this type relaxes toward

      (VolumeEnergyParameter.target_volume; CC3DML attribute TargetVolume). Guarded >= 0

      (check_dict, PyCoreSpecs.py:L1978).

      '
    lambda_volume: 'constraint_stiffness -- the quadratic energy penalty per (site)^2 of deviation from
      target

      (CC3DML attribute LambdaVolume). NOT guarded: lambda_volume = 0 is legal, and is exactly the

      dissolving ablation.

      '
    _params: '(plugin constructor, VolumePlugin(*_params), PyCoreSpecs.py:L2052) zero or more

      VolumeEnergyParameter, one per cell type. Zero args = "bare" mode: target_volume /

      lambda_volume are then read PER-CELL from the cell.targetVolume / cell.lambdaVolume attributes

      instead of per-type. The two modes are mutually exclusive (per-type silences per-cell -- see

      surprises).

      '
  state_io: "reads: V(sigma), the per-cell site count -- maintained incrementally by a SEPARATE, auto-loaded\n\
    \  plugin, VolumeTrackerPlugin (a CellGChangeWatcher; cpp/CompuCell.py:L5554), NOT recomputed by\n\
    \  this plugin; and, per cell, its targetVolume + lambdaVolume, taken EITHER from per-type\n  VolumeEnergyParameters\
    \ OR, in bare mode, from the per-cell cell.targetVolume /\n  cell.lambdaVolume attributes.\nwrites:\
    \ nothing. It is an energy term -- it only changes the acceptance probability of a\n  proposed pixel\
    \ copy, never moves or writes state directly.\n"
  surprises:
  - 'Declaring per-TYPE VolumeEnergyParameters (calling param_new / passing params to the

    constructor) makes CC3D IGNORE the per-cell cell.targetVolume. A growth steppable that writes

    the per-cell value then has no effect and the cells quietly shrink -- measured 25 -> 20.9 over

    400 MCS with zero divisions, while the run reported success. Declare the plugin BARE

    (VolumePlugin() with no param_new) to use per-cell values. The two modes are mutually exclusive.

    '
  - 'Ablating it (lambda_volume = 0) does not merely relax the size: the cells DISSOLVE. Measured in

    the reference ablation (log/atlas_cc3d/volume_constraint, OFF run): mean volume 25 -> 0 and cell

    count n 45 -> 0 by MCS 200, versus the ON run relaxing 25 -> 59.4 toward target 60. With no

    volume penalty and all contact energies positive (16), the system minimises boundary by erasing

    cells into medium. Volume is what makes a cell an object here.

    '
  - 'The energy penalty and the volume COUNT are TWO different plugins. VolumePlugin only reads

    V(sigma); the count is kept up to date by VolumeTrackerPlugin, an incremental CellGChangeWatcher

    that adjusts the count on each accepted copy. A reimplementer who folds "recount the cell" into

    the energy term, or forgets the tracker, gets a plugin reading a stale or zero volume.

    '
  - 'A single pixel copy is a TWO-cell event: gaining cell V->V+1, losing cell V->V-1. Because the

    term is quadratic, the two contributions do not cancel and dE depends on how far each cell

    already is from its target -- treating volume relaxation as an independent per-cell update

    misses this coupling. Medium (id 0) has no volume constraint and contributes 0 to either side.

    '
  - 'Only target_volume is guarded (>= 0). lambda_volume is unchecked, so the zero that dissolves

    the cells passes validation silently. There is also no upper guard: a large lambda_volume with

    the fixed Potts temperature T freezes the boundary and the cell cannot reach its target at all

    -- the constraint''s effect is inseparable from fluctuation_amplitude, which is a Potts param,

    not a Volume param.

    '
