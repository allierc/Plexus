    fields and relax one invariant:\n  - set: particle -> also a lattice site-set (a cell is a set of\
    \ sites sharing an id,\n    not a point with a position).\n  - reads: pos -> {} (the adjacency is\
    \ static lattice structure; it reads no dynamic\n    state, whereas radius_graph reads live positions\
    \ every tick).\n  - inputs: radius (continuous cutoff) -> neighbor_order (a discrete integer selecting\n\
    \    a compiled adjacency shell) + lattice_type (square/hex geometry).\nWhat that breaks: the current\
    \ contract's invariant is \"all live pairs within a\ncontinuous radius, rebuilt each tick, edge length\
    \ = a meaningful Euclidean distance.\"\nAny downstream user that reads edge length as a continuous\
    \ distance, or relies on the\nper-tick rebuild to track motion, gets neither from a static integer-offset\
    \ lattice\nadjacency. That is a real cost a widening imposes on existing callers -- the definition\n\
    of a refinement rather than a free-of-charge alias.\nNo cross-atlas dedup: no jax-morph proposal (adhere,\
    \ agitate, apoptose, mechanosense,\nmorphogen, regulate, relax, reorient) is a relation-builder, so\
    \ this is not a second\nsighting of anything.\n"
  contract:
    name: radius_graph
    kind: rewire
    family: topology
    set: lattice_site
    inputs:
    - neighbor_order
    - lattice_type
    outputs: []
    reads: []
    writes:
    - edge_index
    maps:
