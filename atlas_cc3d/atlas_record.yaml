- id: chemotaxis
  order: 7
  raw_name: Chemotaxis
  raw_kind: Plugin (ChemotaxisPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L2653
  paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366, 'Multi-Scale Modeling of Tissues Using
    CompuCell3D'
  summary: Chemotaxis Plugin
  equations: 'dE_chemo = -lambda_chemo * (c(x_new) - c(x_old))

    Evaluated per attempted copy on the field value at the two sites; it biases the accept/reject rather
    than applying a force.'
  params:
    lambda_chemo: gradient_sensitivity
    field_name: sensed_field
  state_io: 'reads: a PDE field at two lattice sites; writes: nothing (an energy term)'
  surprises:
  - 'It is a bias on a discrete move, not a velocity: there is no drift term anywhere.'
  - 'lambda_chemo = 3000 transported cells into the boundary and destroyed them (9 -> 0 cells). At 200
    they climb and survive: mean x 15 -> 18 vs 15 -> 14.8.'
  verdict: alias
  of: chemotax
  implementation_of: chemotax
  why: 'Same biology as the registered `chemotax` (a cell follows -- or, with lambda<0, flees --

    the local gradient of a diffusible field): the Keller-Segel coupling. So this is an ALIAS,

    and `implementation_of: chemotax` so the ledger counts the contract once.


    The interesting part is HOW the two implementations realize that biology, because they sit

    on opposite sides of the "is an energy term expressible in the Plexus algebra?" question

    this campaign exists to measure. Plexus `chemotax` EMITS a velocity `gain*grad(field)` that

    the engine integrates into `pos`. CC3D''s ChemotaxisPlugin emits NOTHING: it adds a term

    dE_chemo = -lambda * (c(x_new) - c(x_old)) to the Potts energy of an attempted pixel copy,

    biasing the Metropolis accept/reject toward the higher-concentration site. There is no

    velocity and no drift anywhere in the source -- the cell''s centre of mass climbs the

    gradient only as the STATISTICAL consequence of biased copies accumulated over many attempts

    (state_io records this honestly: the plugin writes nothing directly).


    The two therefore share a contract but not a numeric routing: -lambda*(c_new - c_old) is a

    finite-difference of the field across one lattice step, i.e. a discretized -lambda*grad(c)

    scored per move -- the same quantity Plexus emits as a velocity, only consumed as an energy

    bias instead of an integrated drift. Recorded as the contradiction the loop wants: Plexus has

    no energy-term / acceptance-bias routing, so a faithful port would have to translate the

    energy bias back into the equivalent velocity `+lambda*grad(c)`, losing the Metropolis

    temperature-and-neighbourhood dependence (at lambda=3000 the bias overwhelmed T and drove

    cells into the boundary until they vanished 9->0 -- a failure mode a pure velocity emitter

    would not reproduce identically).


    ARGUMENT AGAINST this verdict (the refinement I am rejecting): one could argue the acceptance

    -bias routing is a genuinely different OUTPUT type -- an energy scalar, not a `pos` delta --

    and that widening `chemotax` to admit an `emit: energy_bias` mode is a REFINEMENT, not a

    free alias. I reject it because the contract is named by biology and by observable write

    (position moves along grad(field)); the accept/reject machinery is Potts substrate shared by

    EVERY CC3D plugin, not a property of chemotaxis, so it belongs to a future energy-routing

    question about the engine, not to a widening of this one contract.

    '
  contract:
    name: chemotax
    kind: exchange
    family: fields
    set: cell
    inputs:
    - cell
    - field
    outputs:
    - cell
    reads:
    - pos
    - field
    writes:
    - pos
    maps:
    - field
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: connectivityglobal
  order: 8
  raw_name: ConnectivityGlobal
  raw_kind: Plugin (ConnectivityGlobalPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L4088
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366 -- the plugins / effective-energy chapter,
    in

    the discussion of connectivity constraints that keep a cell a single connected object. NOTE: no

    paper text was available in this environment, so this anchor is the chapter''s known home for the

    term, NOT a page I have read. The checkable source evidence is the class at PyCoreSpecs.py:L4088

    (the CC3DML it emits), the compiled plugin method list at CompuCell.py:L5106-5178, and the test

    XML at tests/plugin_test_suite/connectivity_global_fast_test_generate/Simulation/

    connectivity_global_fast.xml.

    '
  summary: 'A per-cell-type opt-in Cellular-Potts constraint that keeps each enabled cell a SINGLE CONNECTED

    BLOB of lattice sites. It writes no state: on every proposed pixel copy it checks whether the copy

    would split the target cell''s site set into disconnected fragments and, if so, returns a large

    positive energy penalty so the Metropolis rule rejects the copy. It is a TOPOLOGICAL (effectively

    hard) constraint on the SET, not on its size or shape -- ablate it and a cell may pinch off islands

    or shed pixels into medium; keep it and the cell stays simply one piece.

    '
  equations: "ConnectivityGlobal is a Cellular-Potts effective-energy term whose job is TOPOLOGICAL, not\
    \ metric.\nIt writes nothing. On each proposed pixel copy (the id at a source site is proposed to\
    \ overwrite a\nneighbour site) the plugin's changeEnergy asks whether the copy would FRAGMENT the\
    \ target cell --\nsplit its set of lattice sites into more than one connected piece -- and returns\n\
    \n  dE_conn = S     if the copy would fragment the cell (connected-components-after > 1)\n       \
    \   = 0     otherwise\n\nwhere\n  S = connectivityStrength, a per-cell magnitude held in ConnectivityGlobalData\n\
    \      (CompuCell.py:L5106-5112; get/setConnectivityStrength, L5144-5148). It is added as a\n    \
    \  POSITIVE penalty, so with S large the Metropolis rule (accept if total dE <= 0, else\n      exp(-dE\
    \ / T), T = Potts fluctuation_amplitude) ALWAYS rejects a fragmenting copy -- the\n      constraint\
    \ is effectively HARD, not a soft quadratic.\n\nConnectedness is judged by checkIfCellIsFragmented\
    \ -- a whole-cell flood fill over the cell's site\nset -- in the default \"global\" mode. With <FastAlgorithm/>\
    \ set (fast=True) it instead uses\ncheck_local_connectivity / changeEnergyFast, a cheaper LOCAL-neighbourhood\
    \ test that approximates\nthe same veto. \"Connected\" is defined by the Potts lattice adjacency (NeighborOrder),\
    \ which is a\nPotts param, NOT a plugin param. NOTE: the exact returned value (fixed constant vs S\
    \ scaled by the\nnumber of extra components, the sign, the default S) is reconstructed from the compiled\
    \ method\nnames + the CC3DML the spec emits; the C++ changeEnergy body was NOT read (cc3d is not importable\n\
    in this environment).\n"
  params:
    fast: 'algorithm_selector (performance / approximation-fidelity flag), ConnectivityGlobalPlugin(fast=...)

      at PyCoreSpecs.py:L4094; emits <FastAlgorithm/> when True (xml, L4119-4120). False = the "global"

      whole-cell flood-fill connectivity check (checkIfCellIsFragmented; exact but O(cell size) per

      attempted copy). True = changeEnergyFast / check_local_connectivity, a LOCAL-neighbourhood

      approximation that is much cheaper but can miss some global fragmentations. Same physical intent,

      different fidelity/cost -- see surprises.

      '
    _cell_types: 'per_type_enable_set (opt-in whitelist), ConnectivityGlobalPlugin(fast, *_cell_types)
      at

      PyCoreSpecs.py:L4094-4106; each type name emits <ConnectivityOn Type="NAME"/> (xml, L4121-4122).

      Only listed cell types have connectivity enforced; unlisted types -- and Medium -- are free to

      fragment. Connectivity can ALSO be toggled on an individual cell from a steppable via

      cell.connectivityOn = True, bypassing the type list (see the connectivity_global_fast_python

      test steppable).

      '
    connectivityStrength: 'UNKNOWN (intended role = penalty magnitude / veto stiffness S). The actual
      size of the energy

      penalty is a per-cell field, ConnectivityGlobalData.connectivityStrength

      (get/setConnectivityStrength, CompuCell.py:L5112,L5144-5148), and is NOT exposed by this Python

      spec AT ALL. The PyCoreSpecs constructor lets you turn connectivity ON per type but gives no way

      to set its strength or its default -- a magnitude nobody can tune from the spec. Its default

      value, and whether the returned penalty is a fixed constant or scales with connectivityStrength,

      were not determined from source.

      '
  state_io: "reads: the target cell's SET of lattice sites (its pixels and their adjacency under the Potts\n\
    \  NeighborOrder) in order to test connectedness after the proposed copy -- via a whole-cell flood\n\
    \  fill (global mode) or a local neighbourhood scan (fast mode); the per-type ConnectivityOn\n  whitelist\
    \ and/or the per-cell cell.connectivityOn flag; and the per-cell connectivityStrength\n  magnitude.\n\
    writes: nothing. It is a Potts effective-energy term -- it only returns a dE that changes the\n  acceptance\
    \ probability of a proposed pixel copy (vetoing fragmenting ones); it never moves,\n  relabels, or\
    \ writes cell state directly.\n"
  surprises:
  - 'The penalty MAGNITUDE is unreachable from the Python spec. The constructor exposes only fast

    (bool) and an on/off list of cell types; the strength S lives entirely in the C++ per-cell

    ConnectivityGlobalData and can only be set programmatically (setConnectivityStrength). A user

    configuring via PyCoreSpecs gets a constraint whose stiffness they cannot tune and whose default

    they cannot see from the spec.

    '
  - 'It is a HARD / topological constraint dressed as an energy term. Most CPM plugins here are soft

    quadratics (volume, surface); this one instead returns a large veto penalty ONLY when a copy would

    break the cell into pieces, so it behaves as a rejection rule rather than a gradient. A

    reimplementer treating it as a tunable soft energy, or expecting it to gently pull toward

    compactness, misreads it -- it does nothing at all until a copy threatens to fragment the cell.

    '
  - 'fast != global. <FastAlgorithm/> selects check_local_connectivity, a LOCAL neighbourhood

    approximation; it can miss connectivity breaks that the whole-cell flood fill would catch, so the

    two modes are not guaranteed to give identical topology. Choosing fast is a correctness/speed

    trade, not a free speedup.

    '
  - '"Connected" is defined by the Potts NeighborOrder (lattice adjacency), which is NOT a plugin

    parameter. The same plugin yields different topology under different neighbor orders (the test XML

    uses NeighborOrder 2). A reimplementer must fix the adjacency definition explicitly; it is not

    carried in this spec.

    '
  - 'Three sibling plugins are easy to confuse and are NOT interchangeable: Connectivity

    (PyCoreSpecs.py:L4059 -- no params, no per-type list, the legacy whole-cell constraint),

    ConnectivityGlobal (this one -- per-type opt-in, global-flood-fill or fast-local), and

    ConnectivityLocalFlex (a SOFT local-energy variant with a tunable per-cell connectivityStrength,

    ConnectivityLocalFlexData at CompuCell.py:L5051). The "Global"/"LocalFlex" naming is about the

    connectivity ALGORITHM (whole-cell flood fill vs local energy), not about a spatial region.

    '
  - 'Per-cell override: cell.connectivityOn set from a steppable enables connectivity on individual

    cells regardless of the type whitelist (connectivity_global_fast_python steppable turns it on for

    cell.id < 100). So the declared spec is not the full story -- connectivity may be active on cells

    the emitted XML never lists.

    '
  verdict: new
  of: null
  implementation_of: stay_connected
  why: 'The FIRST sighting of a new contract I name `stay_connected`: a per-cell TOPOLOGICAL

    constraint that reads a body''s connected-component structure and vetoes any move that would

    split its set of parts into disconnected pieces. Against the FROZEN baseline this is `new` --

    none of the 52 promoted contracts does this. The 42 registered contracts are metric forces

    (cohesion, separation, attraction_repulsion), diffusive fields, count-changing structural ops

    (cell_divide, cell_grow), or index/rewire builders (radius_graph); not one reads connected

    components and rejects a fragmenting move. None of the 8 jax-morph proposals (adhere, agitate,

    apoptose, mechanosense, morphogen, regulate, relax, reorient) is a connectivity guard either,

    so this is a genuinely NEW contract, not a second sighting of an earlier one.


    I set implementation_of stay_connected so the ledger counts the connectivity FAMILY ONCE.

    Three CompuCell3D siblings are three IMPLEMENTATIONS of this one contract, not three

    contracts: Connectivity (one global scalar, 2D-only, local check -- [[connectivity]]),

    ConnectivityGlobal (THIS -- per-type opt-in, whole-cell flood-fill or fast-local, works in

    3D), and ConnectivityLocalFlex (per-cell soft strength). What THIS implementation adds over

    the plain sibling: (1) a per-type opt-in whitelist (each enabled type emits ConnectivityOn),

    plus a per-cell cell.connectivityOn override from a steppable; (2) a per-cell strength S in the

    C++ ConnectivityGlobalData (setConnectivityStrength) -- though the Python spec exposes only the

    on/off list and the fast flag, never S; (3) a whole-cell flood-fill (checkIfCellIsFragmented)

    in default mode, degradable to a cheaper LOCAL check via fast=True. None of these change the

    typed signature -- same reads (site-set topology), same write (none, a Potts energy veto),

    same kind/family (lateral/topology).


    Closest registered contract is `cohesion` (lateral/interaction): both keep a body together.

    But widening cohesion to admit this does violence to its biology. Cohesion is a metric

    attractive FORCE between point agents that returns an integrable delta pulling neighbours

    closer; stay_connected returns no force and no gradient -- it is a combinatorial TOPOLOGICAL

    veto over one cell''s lattice-site set that does nothing at all until a proposed pixel copy

    would fragment the set into more than one connected component, whereupon it adds a near-hard

    energy penalty the Metropolis rule almost never accepts. Cohesion presupposes point agents

    with positions and a differentiable pair potential; stay_connected presupposes an explicit

    site-set with lattice adjacency that the point-agent representation does not have, and it is a

    rejection rule, not a gradient. Widening cohesion to cover a connected-components indicator

    would erase the force/veto and the point/site distinctions that make cohesion what it is.

    '
  contract:
    name: stay_connected
    kind: lateral
    family: topology
    set: cell
    inputs:
    - site (the affected cell's owned lattice sites, each carrying its cell id, for the cell whose connectedness
      the proposed pixel copy would change)
    - connectivity_on (per-type opt-in whitelist and/or a per-cell flag; only enabled cells are constrained)
    - strength (a per-cell magnitude S in ConnectivityGlobalData; not exposed by the Python spec, settable
      only via setConnectivityStrength)
    outputs:
    - dE (a positive energy penalty added to the Metropolis total when the copy would fragment the cell
      into more than one connected component; 0 otherwise)
    reads:
    - site.cell_id (the cell's set of lattice sites and their adjacency, flood-filled whole-cell in global
      mode or scanned in a local neighbourhood in fast mode, to test connectedness after the proposed
      copy)
    - lattice adjacency / Potts NeighborOrder (defines which sites count as connected; a Potts param,
      not a plugin param -- an implicit external precondition)
    writes:
    - none (a Potts effective-energy term that returns a scalar dE and mutates no state; it changes only
      the acceptance probability of the proposed pixel copy, integrating no delta)
    maps:
    - none
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: connectivity
  order: 9
  raw_name: Connectivity
  raw_kind: Plugin (ConnectivityPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L4059
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366. No extracted paper text is available

    for this target, so no page/figure could be verified. The CHECKABLE anchors used here are

    in-source: the class at PyCoreSpecs.py:4059 and the two CC3DML generators that document the

    real mechanism -- CC3DMLGeneratorBase.py:614-632 and CC3DXMLGenerator.py:656-677.

    '
  summary: 'A Cellular-Potts ENERGY term (Potts plugin), NOT a state update. Per attempted single-pixel

    copy it inspects the cell-id lattice around the target site and adds an energy penalty if the

    copy would break the LOCAL connectivity of the affected cell -- i.e. split its set of lattice

    sites into disconnected fragments (or fuse fragments). It writes no state; it only raises the

    energy of, and therefore suppresses the acceptance of, connectivity-breaking flips. With the

    compiled default penalty (10000000) this "soft" term behaves as a near-hard topological guard

    that keeps every cell a single connected blob (one connected component). Fast/local variant: 2D square
    lattice only,

    requiring Potts NeighborOrder 1 or 2.

    '
  equations: "Potts acceptance uses total dE = sum over plugins of dE_p; Connectivity contributes dE_conn.\n\
    For a proposed copy (a source pixel overwrites target pixel t's cell id):\n\n    dE_conn = Penalty\
    \ * f(local connectivity change of the affected cell around t)\n    Penalty = 10000000           \
    \ (compiled/CC3DML-generator default; one global scalar)\n    f = 0   if every affected cell stays\
    \ locally connected after the copy\n    f > 0   (>= 1) if the copy would fragment a cell into disconnected\
    \ pieces\n            within the Moore neighbourhood of t\n\nMetropolis acceptance:  p_accept = 1\
    \ if dE_total <= 0 else exp(-dE_total / T).\nBecause Penalty (1e7) >> typical T (5-100), any fragmenting\
    \ copy gets p ~ exp(-1e7/T) ~ 0,\nso the term acts as an effectively hard constraint (cells cannot\
    \ disconnect).\n\nCAVEAT (could not verify at source): the exact form of f -- a boolean gate vs. a\
    \ count of the\nconnected components introduced -- lives in the compiled C++ ConnectivityPlugin, which\
    \ is NOT\nSWIG-exposed and whose C++ source is not in this install. Verified from source: the single\n\
    global Penalty (default 1e7), and the 2D / square-lattice / NeighborOrder<=2 restriction.\n"
  params:
    penalty:
      role: connectivity_constraint_strength
      detail: 'Global energy penalty added for a pixel copy that breaks a cell''s local connectivity.

        Compiled and CC3DML-generator default 10000000. It is ONE value shared by EVERY cell

        (not per-type, not per-cell). NOT a PyCoreSpecs constructor argument: the Python

        ConnectivityPlugin takes no arguments and emits a bare <Plugin Name="Connectivity"/>, so

        through the Python spec the penalty is pinned at the compiled default and cannot be tuned.

        Per-cell strength requires the ConnectivityLocalFlex sibling (setConnectivityStrength);

        per-type strength requires ConnectivityGlobal (<Penalty Type=...>).

        '
    neighbor_order:
      role: interaction_neighborhood_order
      detail: 'Not a plugin parameter -- read from the Potts <NeighborOrder>. This plugin REQUIRES it
        to

        be 1 or 2 (and a 2D square lattice); outside that regime its local connectivity check is

        undefined. An implicit external precondition, silently assumed, not validated by the spec.

        '
  state_io:
    reads: "- the cell-id lattice (site -> cellId field) in the Moore neighbourhood of the proposed\n\
      \  target pixel, for the cell(s) whose connectivity the copy could change\n- Potts <NeighborOrder>\
      \ (must be 1 or 2) and a 2D square lattice (implicit preconditions)\n"
    writes: "- none. This is a Potts ENERGY plugin: its changeEnergy returns a scalar dE and mutates no\n\
      \  state. It changes only the probability that the proposed pixel copy is accepted.\n"
  surprises:
  - 'The Python spec exposes NO parameter at all: ConnectivityPlugin() takes no args and its xml

    emits only <Plugin Name="Connectivity"/>. A reimplementer reading the Python declaration

    would conclude the mechanism is parameter-free -- but CC3DML (and BOTH twedit generators)

    support a global <Penalty> whose default is 10000000. Via the Python spec you silently get

    that default and cannot change it.

    '
  - 'The default penalty (1e7) is ~5-6 orders of magnitude larger than a typical Potts

    temperature (5-100). So this nominally SOFT energy term behaves as a HARD topological

    constraint: connectivity-breaking flips are essentially never accepted. Reimplementing it

    with a modest penalty gives a qualitatively different, leaky constraint.

    '
  - 'Silent applicability restriction: works ONLY in 2D, ONLY on a square lattice, and ONLY with

    NeighborOrder 1 or 2. None of this is enforced by the Python spec. For 3D / non-square

    lattices use ConnectivityGlobal (BFS-based, per-type Penalty); for per-cell strength use

    ConnectivityLocalFlex. The three are easy to conflate.

    '
  - '"Penalty specified globally for each cell" means ONE scalar for ALL cells, not per-type as

    with Contact/Volume/Surface. Contrast the siblings: ConnectivityGlobal is per-type, and

    ConnectivityLocalFlex is per-individual-cell. Easy to wrongly assume per-type granularity.

    '
  - 'The plain plugin is NOT SWIG-exposed: cc3d.cpp.CompuCell defines ConnectivityGlobalPlugin

    and ConnectivityLocalFlexPlugin but no plain ConnectivityPlugin. It is a compiled Potts

    energy plugin registered internally (Potts3D.registerConnectivityConstraint /

    getConnectivityConstraint). Its changeEnergy cannot be inspected or overridden from Python,

    and the exact local-connectivity formula is not readable in this install.

    '
  - 'The quantity read is cell TOPOLOGY -- the connected-component structure of a set of lattice

    sites -- not a continuous cell property. There is no differentiable field; the "energy" is a

    combinatorial indicator over the lattice neighbourhood. Any representation without an

    explicit lattice / site-set (e.g. a point-with-radius cell) cannot compute this at all.

    '
  verdict: new
  of: null
  implementation_of: stay_connected
  why: "NEW against the frozen baseline: no PROMOTED contract computes, or acts on, the\nconnected-component\
    \ TOPOLOGY of a set of lattice sites. The whole registered vocabulary treats\na cell as a point (position,\
    \ velocity, radius, polarity, type) and its operators return\ncontinuous deltas over those quantities;\
    \ nothing reads \"is this cell's site-set one connected\nblob\" and penalises a change that would\
    \ split it.\n\nBUT this is a second implementation of a contract THIS atlas already introduced, not\
    \ a new\ncontract -- so implementation_of: stay_connected. The connectivity family is three\ninterchangeable\
    \ implementations of one biology (\"keep a cell a single connected object\"):\n  - Connectivity (this\
    \ entry, order 9): legacy, one GLOBAL scalar Penalty for all cells, a\n    LOCAL neighbourhood check,\
    \ 2D / square-lattice / NeighborOrder<=2 only, zero tunable params.\n  - ConnectivityGlobal (order\
    \ 8, which introduced stay_connected in this atlas): per-type\n    opt-in, whole-cell flood fill (or\
    \ fast-local), any lattice.\n  - ConnectivityLocalFlex: a soft per-cell variant with tunable connectivityStrength.\n\
    Same typed signature -- reads a cell's site-set topology, writes nothing, returns an energy\nveto\
    \ on fragmenting copies. The ledger must count stay_connected ONCE across the three, or the\nsaturation\
    \ curve measures how many CC3D connectivity plugins ship, not how many contracts the\nlanguage is\
    \ missing. This legacy implementation's distinguishing traits (global scalar, local\ncheck, 2D-only,\
    \ un-tunable) are recorded in params/surprises, not a reason to re-count.\n\nClosest PROMOTED contract,\
    \ and why widening it does violence to its biology: cohesion\n(lateral/interaction) is the nearest\
    \ by intent -- it keeps material together -- but cohesion is\na pairwise ATTRACTIVE FORCE between\
    \ distinct agent centres returning an integrable gradient\ndelta; stay_connected returns no force,\
    \ is inert until a copy would fragment ONE cell's\nsite-set, then vetoes it combinatorially. Aliasing\
    \ to cohesion would require cohesion to widen\nfrom \"pairwise force between positioned points\" to\
    \ \"connected-components indicator over a\nsite-set\", a refinement that breaks every current cohesion\
    \ user -- not a free alias.\nradius_graph (rewire/topology) is the only other topology-family contract,\
    \ but it BUILDS a\nneighbour graph from centre distances and writes edges; it neither reads a site-set\
    \ nor\nenforces connectedness.\n\nThe campaign-flagged shape stands: this is a Potts ENERGY term,\
    \ not a state update. It returns\na scalar dE and mutates nothing; it changes only the acceptance\
    \ probability of a proposed\nlattice copy. No registered operator's output is \"an energy contribution\
    \ to a Metropolis\naccept/reject\", and whether the algebra can express a set-topology energy penalty\
    \ at all (no\ncontinuous field, needs an explicit site-set, output gates acceptance rather than integrating)\n\
    is the open question stay_connected leaves standing.\n"
  contract:
    name: stay_connected
    kind: lateral
    family: topology
    set: cell
    inputs:
    - site (the affected cell's owned lattice sites, each carrying its cell id, for the cell whose connectedness
      the proposed single-pixel copy at target t would change)
    - connectivity_on (whether the constraint is active on the cell; in THIS legacy implementation it
      is ON for EVERY cell unconditionally -- one global scalar, no per-type or per-cell opt-in, unlike
      the ConnectivityGlobal sibling that first defined this contract)
    - strength (the veto magnitude; here a single GLOBAL Penalty shared by all cells, CC3DML / twedit-generator
      default 10000000, not exposed by the Python spec and un-tunable through it)
    outputs:
    - dE (a positive energy penalty added to the Metropolis total when the copy would fragment the cell
      into more than one connected component within the Moore neighbourhood of t; 0 otherwise -- NOT an
      integrated state delta)
    reads:
    - site.cell_id (the cell's set of lattice sites and their adjacency in the Moore neighbourhood of
      the proposed target pixel, scanned LOCALLY -- this legacy variant does no whole-cell flood fill
      -- to test connectedness after the proposed copy)
    - lattice adjacency / Potts NeighborOrder (defines which sites count as connected; must be 1 or 2
      on a 2D square lattice, an implicit external precondition -- a Potts param, not a plugin param)
    writes:
    - none (a Potts effective-energy term that returns a scalar dE and mutates no state; it changes only
      the acceptance probability of the proposed pixel copy, integrating no delta)
    maps:
    - none
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
  disputed:
    by: skeptic
    was: new
    claimed: alias
