- id: contact
  order: 12
  raw_name: Contact
  raw_kind: Plugin (ContactPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L3141
  paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366, 'Multi-Scale Modeling of Tissues Using
    CompuCell3D'
  summary: Contact Plugin
  equations: 'E_contact = sum over adjacent site pairs (i,j) with sigma_i != sigma_j of J(tau(sigma_i),
    tau(sigma_j))

    J is a symmetric matrix over cell TYPES, Medium included. Differential adhesion is J_heterotypic >
    J_homotypic.'
  params:
    neighbor_order: adjacency_range
    energy: adhesion_matrix
  state_io: 'reads: the type of each site''s owner; writes: nothing (an energy term)'
  surprises:
  - Adhesion is an energy per adjacent SITE PAIR, so it scales with shared boundary length, not with a
    pair distance. There is no cutoff and no pair potential.
  - 'Measured ablation: heterotypic boundary 290 -> 167 with differential adhesion, 290 -> 388 with equal
    energies. The sign of the effect reverses.'
