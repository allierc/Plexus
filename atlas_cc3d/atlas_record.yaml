mechanisms:
- id: adhesionflex
  order: 1
  raw_name: AdhesionFlex
  raw_kind: Plugin (AdhesionFlexPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L3525
  paper_section: 'CC3D Reference Manual guide heading ''AdhesionFlex Plugin''

    (compucell3dreferencemanual.readthedocs.io/en/latest/adhesion_flex_plugin.html); energy

    formula transcribed from the library''s own descriptor

    cc3d/twedit5/Plugins/CC3DProject/adhesion_descr.py:get_adhesion_flex_description_html().

    No specific Swat et al. (2012) page was read for this plugin.

    '
  summary: 'A flexible generalisation of the Contact adhesion energy. Instead of a fixed J(type,type'')

    matrix, every cell AND Medium carries its own vector of adhesion-molecule densities, and the

    contact energy across a cell boundary is a double sum over molecule pairs of a binding

    parameter k_mn times a formula (default min) of the two cells'' densities. Like Contact it

    writes nothing to the lattice -- it only returns a dE that biases which pixel-copy attempts are

    accepted -- but unlike Contact it OWNS mutable per-cell state (the density vector), which a

    steppable can change at runtime and which mitosis must copy to daughters.

    '
  equations: "E_adhesion = sum over neighbouring site pairs (i,j), owners differ, of\n   [ - sum over\
    \ molecule pairs (m,n) of  k_mn * AdhesionFunc( N_m(sigma_i), N_n(sigma_j) ) ]\n   * (1 - delta(sigma_i,\
    \ sigma_j))\n\ni, j       : neighbouring lattice sites, within NeighborOrder shells\nsigma_i    :\
    \ the cell (id) owning site i; the (1 - delta) factor keeps only cross-boundary\n             site\
    \ pairs (cell-cell or cell-Medium)\nm, n       : adhesion-molecule labels\nN_m(sigma) : density of\
    \ molecule m carried by cell sigma -- PER-CELL state, seeded from the\n             per-TYPE AdhesionMoleculeDensity\
    \ declaration, then mutable/steerable\nk_mn       : binding parameter between molecules m and n (the\
    \ AdhesionInteractionMatrix;\n             user-supplied, symmetric in intent, may be negative)\n\
    AdhesionFunc: the BindingFormula -- a muParser expression in variables Molecule1, Molecule2;\n   \
    \          default \"min(Molecule1,Molecule2)\". Evaluated per site pair\n             (compiled entry\
    \ point adhesionFlexEnergyCustom).\n\nNote the explicit LEADING MINUS: a larger positive k_mn LOWERS\
    \ energy (is adhesive), the\nopposite sign sense from the plain Contact J matrix where larger J is\
    \ repulsive.\n\nSource-vs-convention discrepancy: the library HTML writes the restriction as a delta\
    \ over\n\"cell types at i and j\", but the standard CPM contact term and the plugin's changeEnergy\n\
    operate on cell id sigma, so two neighbouring cells of the SAME type still contribute. Left\nas a\
    \ discrepancy I could not resolve without running the compiled core.\n"
  params:
    neighbor_order: 'adjacency_range -- the ONLY constructor argument (default 1). Number of neighbour
      shells of

      lattice sites summed in the contact-energy sum; larger order counts more distant boundary

      site-pairs. Guard check_dict rejects neighbor_order < 1 (message says "must be positive").

      '
    density: 'adhesion_molecule_concentration -- NOT a constructor param; declared per (molecule,

      cell TYPE) via density_new / AdhesionMoleculeDensity in XML, guarded non-negative. Seeds

      each cell''s density vector at init, after which it is mutable per-cell state.

      '
    binding_parameter: 'pairwise_binding_affinity -- NOT a constructor param; entry k_mn of the

      AdhesionInteractionMatrix, set via a BindingFormula (formula_new / param_set). May be

      negative.

      '
    formula: 'binding_kernel -- NOT a constructor param; the muParser expression string that combines
      two

      densities (AdhesionFunc). Default "min(Molecule1,Molecule2)". The energy kernel itself is

      user data, chosen at runtime.

      '
  state_io: "reads: for each attempted pixel copy, the cell id and type at the two sites across the\n\
    \  boundary, and both owner cells' adhesion-molecule-density vectors.\nwrites: nothing to the lattice\
    \ -- returns a dE via changeEnergy; a Potts energy term, not an\n  update.\nowns: a MUTABLE per-cell\
    \ (and per-Medium) density vector, initialised from the per-type\n  AdhesionMoleculeDensity, changed\
    \ at runtime by steppables (setAdhesionMoleculeDensity /\n  ...ByIndex / ...Vector), and inherited\
    \ across mitosis (assignNewAdhesionMoleculeDensityVector,\n  which skips the size check precisely\
    \ so a daughter cell can be seeded). This per-cell\n  continuous state is what plain Contact does\
    \ not have.\n"
  surprises:
  - 'Unlike plain Contact (a static J(type,type'') lookup with NO per-cell state), AdhesionFlex

    attaches a mutable density VECTOR to every cell and to Medium. That per-cell continuous field

    is the whole point: a steppable can retune a single cell''s adhesion mid-run, and mitosis must

    copy the vector to daughters. A reimplementer who models it as just another type-matrix loses

    the per-cell state entirely.

    '
  - 'Sign convention is inverted relative to Contact. The energy has an explicit leading minus

    (E = sum of -sum k*f), so a POSITIVE binding parameter is ADHESIVE (energy-lowering). The

    shipped example matrix even uses negative k''s (NCad-NCad = -1.0, NCad-NCam = -10.0).

    '
  - 'The binding kernel AdhesionFunc is an arbitrary muParser expression string (variables

    Molecule1, Molecule2), default min(Molecule1,Molecule2). The combining function is DATA, not

    a fixed operation -- adhesionFlexEnergyCustom evaluates it per site pair.

    '
  - 'The (1 - delta) restriction is written in the library HTML as delta over "cell types", but

    the CPM contact term and changeEnergy operate on cell id sigma; same-type neighbouring cells

    still contribute. I have now READ the descriptor source (twedit5 CC3DProject adhesion_descr.py,

    get_adhesion_flex_description_html) and confirmed the "cell types at i and j" wording is verbatim

    there, and that the same descriptor keys the density N on "cell type of pixel where it is located"

    -- so the type-language is the descriptor author''s consistent framing, not a transcription slip.

    The compiled changeEnergy (cc3d deliberately not importable here) is the only side I could not

    inspect, so which of type or id the core actually enforces stays the one open discrepancy.

    '
  - 'Densities are DECLARED per cell TYPE in XML but STORED per cell -- the type value only seeds

    each cell''s vector at initialisation; Medium gets a vector too. Molecules are indexed in XML

    listing order, and the by-name and by-index accessors must agree on that order.

    '
  verdict: new
  of: null
  implementation_of: adhere
  why: 'VERDICT: `new` against the FROZEN 42 (no registered contract covers molecule-mediated

    cell-cell adhesion), with `implementation_of: adhere` -- a SECOND SIGHTING of `adhere`,

    the contract minted by the jax-morph atlas (Morse/SoftSphere/Hertzian/Harmonic/LennardJones,

    still unpromoted, so not in the frozen 42/52). Setting implementation_of lets the ledger

    count `adhere` ONCE across the two repositories; without it the saturation curve double-counts

    the same biology and measures our naming habits, not the language.


    WHAT IT IS. AdhesionFlex is the differential-adhesion energy of the Cellular Potts model.

    Across every cross-boundary lattice-site pair it adds a contact energy that is a double sum

    over the two owners'' carried adhesion-molecule densities times a user binding matrix k_mn

    (explicit leading minus, so a positive k is ADHESIVE). That is cadherin-style surface-molecule

    adhesion driving cell sorting -- the textbook differential-adhesion hypothesis, and exactly

    `adhere`''s biological content. It owns a mutable per-cell (and per-Medium) density VECTOR

    seeded from a per-type declaration, retunable by a steppable mid-run and copied to daughters

    at mitosis: the CPM analogue of a per-cell cadherin concentration setting a pair''s binding

    strength, which is the same per-cell adhesion coupling jax-morph''s `adhere` carries as its

    per-cell epsilon.


    ANSWERING THE SKEPTIC (the internal-consistency charge). The skeptic is right about the facts

    and I withdraw the sloppy framing it caught. jax-morph''s `adhere` is a Lateral FORCE law:

    set=cell-as-point, reads [pos, radius, alive, epsilon], EMIT=velocity/force, writes [pos]

    (jax_morph_soft_sphere.yaml:143-160). AdhesionFlex is a Potts ENERGY term: set=cell-as-site-set,

    reads [cell_id, cell_type, molecule densities, binding matrix, kernel], writes NOTHING, emits a

    scalar dE that only biases Metropolis acceptance (rule 8). Those two signatures share almost no

    field -- the output-type/writes gap between them is LARGER than the gap I used against cohesion.

    So I do NOT (and the entry must not) rest the `adhere` match on a shared signature, and I do NOT

    reject cohesion on the output-type gap alone. The reject and the merge run on DIFFERENT axes,

    spelled out below; conflating them was the error.


    WHY the merge is BIOLOGICAL, not signature-based. `adhere` is a BIOLOGICAL name (rule 1): the

    contract is the RELATION -- surface-molecule / physical cell-cell adhesion whose strength is set

    per cell and whose differential across types drives sorting. Both atlases realize THAT relation:

    jax-morph as an autodiff force with a size-consistent contact distance sigma=r_i+r_j, CompuCell3D

    as a boundary-site energy with a per-cell molecule vector and binding matrix. Same biology, and

    it is the biology the contract names.


    WHY the reject of registered contracts is BIOLOGICAL, not the output-type gap. The two closest

    registered lateral/interaction laws are behavioural/pattern-forming particle models, not

    adhesion: `cohesion` is Reynolds boids centre-of-mass steering (REQUIRES_TYPE_PROPS=["cohesion"],

    a behavioural weight; cohesion.py:14-21) and `attraction_repulsion` is the D''Orsogna

    self-propelled-particle law (fixed global width sigma, per-TYPE [pull,pull_range,push,push_range];

    attraction_repulsion.py:28-33). Neither carries a surface-adhesion-molecule density, a physical

    cell radius, or a size-consistent contact -- widening one to host molecular differential adhesion

    would delete the flocking / pattern-forming model that IS that contract. That rejection stands on

    BIOLOGY and survives regardless of the energy-vs-force axis. (It is NOT `attraction_repulsion` the

    way jax-morph''s Morse was argued to be, either: Morse carries BOTH a repulsive core and an adhesive

    tail; AdhesionFlex carries ONLY adhesion -- excluded volume is CompuCell3D''s separate Volume

    constraint -- so it maps to the pure-adhesion contract `adhere`, not the attraction+repulsion one.)


    WHY NOT mint a distinct new contract on the signature gap (the skeptic''s proposed resolution).

    Because the gap is a FRAMEWORK-PARADIGM gap, not a biology gap. CompuCell3D is Cellular Potts:

    almost every mechanism is an energy term whose changeEnergy returns a dE and writes nothing, where

    jax-morph mechanisms emit forces that write position (rule 8). That same energy-vs-update divide

    will recur for EVERY CPM energy term this campaign normalizes (Contact, Volume, Surface, ...). If

    we mint a new contract each time a KNOWN biology reappears in the energy paradigm, the saturation

    curve counts the PARADIGM, not the vocabulary -- precisely the inflation the campaign exists to

    avoid. So the paradigm divergence is recorded as a cross-cutting AXIS on this entry, not folded

    into a new contract name. This IS the measurement: `adhere` is the first contract confirmed to

    appear in two computationally INCOMPATIBLE signatures across the two atlases (force->position vs

    energy->nothing), and that is a finding worth more than a second tick on the `new` count.


    SCOPE / OPEN. (1) Whether the FROZEN algebra can host `adhere` as ONE paradigm-polymorphic contract

    (one biology, two signature realizations) or whether the Potts energy-term paradigm needs its own

    contract/output type is a PROMOTION/analysis-phase decision, flagged here, not made in this entry.

    (2) The muParser binding kernel (AdhesionFunc, default min) makes the combining function DATA, an

    implementation freedom below the contract. (3) The (1-delta) restriction is written over cell TYPES

    in the twedit5 descriptor HTML (verified verbatim; the descriptor also keys density on the pixel''s

    cell type, so it is internally type-consistent) while the standard CPM contact term operates over

    cell IDs; only the compiled changeEnergy -- deliberately not importable here -- could settle which

    the core enforces, so it stays the one unresolved source discrepancy, not folded into the signature.

    No oracle/ablation run exists yet.

    '
  contract:
    name: adhere
    kind: lateral
    family: interaction
    set: cell
    inputs:
    - cell
    outputs:
    - contact_energy (a scalar dE contribution to the Metropolis acceptance of a proposed pixel copy;
      NOT a cell state and NOT a force -- this operator writes nothing back to the lattice)
    reads:
    - cell_id (sigma at each of two neighbouring lattice sites, to keep only cross-boundary pairs via
      1-delta)
    - cell_type (seeds the per-cell density vector at init)
    - adhesion_molecule_density (the per-cell/per-Medium mutable density VECTOR N_m(sigma); the adhesion
      coupling)
    - binding_matrix (k_mn pairwise binding affinities; may be negative)
    - binding_kernel (the muParser combining formula AdhesionFunc over the two densities; default min)
    - neighbour shells (site pairs within neighbor_order adjacency)
    writes:
    - nothing to the lattice (energy term). Side channel only -- the plugin maintains its own per-cell
      density vector, which steppables set at runtime and mitosis copies to daughters.
    maps:
    - a cell is a SET of lattice sites sharing an id; adhesion energy is summed over neighbouring cross-boundary
      site pairs (owners differ), so contact area emerges from boundary site counts
    - per boundary pair, energy = -sum over molecule pairs (m,n) of k_mn * AdhesionFunc(N_m(sigma_i),
      N_n(sigma_j)); positive k lowers energy (adhesive), opposite sign sense to the plain Contact J matrix
    - differential adhesion / cell sorting emerges from type- and molecule-dependent binding, with the
      per-cell density vector making adhesion individually steerable and heritable across division
