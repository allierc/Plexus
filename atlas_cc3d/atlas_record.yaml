  raw_name: SteadyStateDiffusionSolver
  raw_kind: Steppable (SteadyStateDiffusionSolver)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L7223
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366 -- PDE-solver / chemical-field-diffusion

    section (exact page NOT verifiable: no paper text was extracted for this target). Primary

    evidence is the source at PyCoreSpecs.py:L7223 and the in-tree guide string in

    cc3d/twedit5/Plugins/CC3DProject/diffusion_solvers_descr.py:23-24 (heading at :23

    "SteadyStateDiffusionSolver", body at :24 "Solves Diffusion equation at the steady state i.e. at

    time= infinity ... Technically this solver solves Helmholtz Equation"), plus the reference

    manual page steady_state_diffusion_solver.html linked from that guide string. (The

    Secretion-Plugin restriction is separately anchored at

    cc3d/twedit5/Plugins/CC3DMLGenerator/CC3DMLGeneratorBase.py:2456.)

    '
  summary: 'A PDE-solver Steppable that, given the current cell configuration and per-cell-type secretion

    sources, computes the STEADY-STATE (t = infinity) concentration field by solving an elliptic

    boundary-value problem and OVERWRITES the whole concentration field with that equilibrium

    solution. Unlike DiffusionSolverFE it does not take a forward-Euler time step -- there is no

    dt; each invocation is a single global implicit solve of the Helmholtz equation.

    '
  equations: "Steady state of the reaction-diffusion equation  dc/dt = D grad^2 c - k c + S(x)\nis obtained\
    \ by setting dc/dt = 0:\n\n    D grad^2 c  -  k c  +  S(x)  =  0\n\nequivalently the modified-Helmholtz\
    \ / screened-Poisson form the guide names explicitly:\n\n    grad^2 c  -  (k/D) c  =  - S(x)/D\n\n\
    Symbols:\n  c(x)  concentration field over lattice sites (the thing written)\n  D     diff_global,\
    \ global diffusion coefficient (spatially UNIFORM here)\n  k     decay_global, global decay rate;\
    \ sets screening length  L = sqrt(D/k)\n  S(x)  secretion source: per-cell-type rate, deposited at\
    \ the sites of cells of that type\nSolved as a global linear BVP subject to the declared boundary\
    \ conditions (Dirichlet value /\nNeumann flux / periodic per face). The actual linear-solver method\
    \ is compiled in\nlibCC3DPDESolvers.so and is NOT readable from the Python layer. No time step, no\
    \ dt.\n"
  params:
    three_d:
      role: spatial_dimension_selector -- flag choosing the 2D vs 3D compiled solver; default False registers
        core name "SteadyStateDiffusionSolver2D", True registers "SteadyStateDiffusionSolver". Must be
        declared by the user; from_xml flips it if the guessed dimensionality is wrong.
    diff_global:
      role: diffusion_coefficient D (global, spatially uniform; per-cell-type diff_types are NOT exposed
        by this solver's DiffusionData, unlike DiffusionSolverFE)
    decay_global:
      role: decay_rate k -- with D sets the screening length sqrt(D/k); also acts as the well-posedness
        regularizer of the elliptic operator (template default 0.00001, non-zero)
    init_expression:
      role: initial_field_guess as a coordinate expression (e.g. "x*y"); seeds the field / iterative solver.
        For a converged implicit steady-state solve its effect on the answer is expected to be negligible
        except through solver convergence -- NOT verified against the compiled solver.
    init_filename:
      role: initial_field_source -- path to a file of initial concentrations (alternative to init_expression)
    secretion_value_per_type:
      role: source_rate S -- per-cell-type constant secretion rate (SecretionParameters(cell_type, value));
        the ONLY channel through which cell geometry/type enters the solve. constant=True (ConstantConcentration
        clamp) and contact_type (SecretionOnContact) are REJECTED for this solver (PyCoreSpecs.py:L7204-L7207).
    boundary_conditions:
      role: boundary_condition_type_and_value per face (x/y/z, min/max) -- one of ConstantValue (Dirichlet,
        default 0.0), ConstantDerivative (Neumann/flux), or Periodic. For an elliptic BVP at least one
        Dirichlet face is needed for a unique solution.
  state_io:
    reads: "- the cell lattice (which cell id / cell type occupies each site) -- used ONLY to place the\n\
      \  per-type secretion source S(x); the diffusion medium itself is homogeneous (global D, k)\n- per-cell-type\
      \ secretion rates (SecretionData on the field)\n- global diffusion constant D and decay constant\
      \ k\n- boundary conditions on each domain face\n- optionally an initial concentration field (init_expression\
      \ / init_filename) as a guess\nNOTE: this is a Steppable / PDE solver, not a Potts energy-term plugin\
      \ -- it returns a field,\nnot an acceptance bias. And unlike DiffusionSolverFE it does not read\
      \ the previous field to\nadvance it one dt: the previous field is at most an initial guess for a\
      \ global solve.\n"
    writes: "- the concentration field c over ALL lattice sites: OVERWRITTEN in place with the steady-state\n\
      \  (equilibrium) solution of the Helmholtz BVP. This is a whole-field REPLACE from a global\n  implicit\
      \ solve, not a local finite-difference delta the engine integrates.\n"
  surprises:
  - 'It is an ELLIPTIC (boundary-value) solve, not a time integrator. There is no dt and no per-MCS

    stability limit; it returns the t=infinity field directly. The guide (diffusion_solvers_descr.py:24)

    warns it is "not a direct substitution for Diffusion Solver FE and you have to check the

    quality of the approximation" -- a reimplementer who models it as "many FE steps" gets the

    transient, not what this solver returns.

    '
  - 'Secretion MUST be declared inside the solver''s own SecretionData; the general Secretion Plugin

    does NOT work with this solver (guide twedit5/Plugins/CC3DMLGenerator/CC3DMLGeneratorBase.py:2456,

    the addComment "Secretion has to be defined inside SteadyStateDiffusion solver"). And ConstantConcentration

    and SecretionOnContact are actively rejected (PyCoreSpecs.py:L7204-L7207) -- so the rich

    "three secretion semantics" of DiffusionSolverFE collapse here to a single per-type additive

    source term.

    '
  - 'Only GLOBAL D and k are exposed (diff_global, decay_global). The base DiffusionData carries

    per-cell-type diff_types/decay_types, but this solver''s DiffusionData class surfaces neither

    -- the medium is homogeneous and cell type enters only through the secretion source. A

    reimplementer copying DiffusionSolverFE''s heterogeneous-D stencil would be wrong here.

    '
  - 'Default DecayConstant in the template is 0.00001, deliberately non-zero. With k = 0 the

    modified-Helmholtz operator degenerates to Poisson (grad^2 c = -S/D), which under all-Neumann

    (flux) boundaries is singular / ill-posed. The tiny decay is (I believe) a regularizer that

    keeps the linear system solvable; I did NOT confirm the solver''s behaviour at exactly k = 0.

    '
  - 'Dimensionality is user-declared via three_d (default 2D -> registered name

    "SteadyStateDiffusionSolver2D"), not auto-detected from the lattice. from_xml (L7281-L7285)

    catches a mismatched guess by flipping the flag and retrying. Pick the wrong flag at build

    time and the core registration silently changes.

    '
  - 'Default boundary condition is ConstantValue 0.0 on every face (Dirichlet sink), inherited from

    PDEBoundaryConditions (L824-L829) -- same silent absorbing default noted for DiffusionSolverFE,

    but here it is also what makes the elliptic problem well-posed rather than merely "leaky".

    '
  - 'A per-field pymanage flag (ManageSecretionInPython) short-circuits the source declaration: when

    set, the field xml EMITS a bare <ManageSecretionInPython/> element and DROPS the whole SecretionData

    block (SteadyStateDiffusionSolverField.xml, L7156-L7159). So S(x) is then supplied by a user Python

    steppable each MCS rather than by the declared per-type rates -- a reimplementer reading only the

    SecretionData path would miss that the source term can be externally driven.

    '
  verdict: new
  of: null
  implementation_of: morphogen
  why: 'WHAT IT IS, BIOLOGICALLY. Strip the plumbing and this solver computes ONE thing: the

    quasi-static equilibrium concentration of a secreted, diffusible, degradable signal --

    the developmental MORPHOGEN gradient. Its equation is the modified-Helmholtz / screened-

    diffusion steady state D grad^2 c - k c + S = 0 (dc/dt = 0), and its screening length

    L = sqrt(D/k) IS the classic synthesis-diffusion-degradation (SDD) morphogen decay length.

    Given per-cell-type sources it overwrites the whole field with its t=infinity solution in a

    single global implicit solve -- a CONSTRAINT solve, not a time step.


    A SECOND SIGHTING OF `morphogen`, FIRST PROPOSED FROM jax-morph. The earlier jax-morph atlas

    already isolated exactly this operator as the `morphogen` contract (candidate

    jax_morph_free_screened_diffusion.py:102, "the steady-state morphogen field", solving the

    SAME D grad^2 c - K c + S = 0). That candidate''s own docstring notes TWO jax-morph numerical

    methods for it -- a free-space Green''s-function superposition (the code it runs) and the

    paper''s graph-Laplacian inverse c = (K I - D L)^{-1} S. CC3D''s SteadyStateDiffusionSolver is

    a THIRD sibling implementation of the identical biological verb: the same screened-Helmholtz

    equilibrium, but discretised on the CPM PIXEL LATTICE and solved as a grid boundary-value

    problem (Dirichlet/Neumann/periodic per face) by the compiled libCC3DPDESolvers.so, rather

    than as a cell-to-cell kernel. Same contract, different substrate and boundary treatment --

    exactly the multi-implementation shape Plexus expects. So `implementation_of: morphogen`, and

    the verdict against the FROZEN baseline is `new` only because `morphogen` is not among the 52

    promoted contracts yet; the ledger must count it ONCE across the two atlases, not twice.


    CLOSEST REGISTERED CONTRACT, AND WHY WIDENING IT DOES VIOLENCE. The nearest promoted contract

    is `diffuse` (field->field, one explicit Laplacian step; its sibling DiffusionSolverFE in this

    atlas is correctly a refinement/implementation_of diffuse). But `diffuse` cannot be widened to

    admit this without breaking what it IS. `diffuse` is a TRANSIENT operator: it returns one

    local finite-difference/heat-kernel step of dc/dt = D grad^2 c that the engine INTEGRATES over

    time; the transient IS its meaning, and DiffusionSolverFE decomposes cleanly into the sequential

    composite diffuse -> decay -> deposit because those explicit updates commute step-to-step. The

    steady-state solver is the OPPOSITE temporal semantics: no dt, no per-step delta, no integration

    -- it returns the t=infinity FIXED POINT in one global implicit solve, and the three terms

    (transport, decay, source) are solved SIMULTANEOUSLY as one coupled elliptic system, not applied

    in sequence. You cannot express "solve the coupled Helmholtz BVP for its equilibrium" as

    diffuse-then-decay-then-deposit; running diffuse to convergence would give the transient

    approach, and the guide (diffusion_solvers_descr.py:24) explicitly warns it is "not a direct

    substitution for Diffusion Solver FE". Forcing a "solve-to-steady-state" mode into `diffuse`

    would overload a per-step transport verb with a global equilibration verb -- two different

    biological idealisations (finite-rate transport vs. quasi-static gradient). `morphogen` is the

    right home precisely because it names the equilibrium-field idealisation directly.

    '
  contract:
    name: morphogen
    kind: exchange
    family: fields
    set: cell
    inputs:
    - cell
    - field
    outputs:
    - field
    reads:
    - per-cell-type secretion rate S (the SecretionData source term -- the only channel through which
      cell geometry/type enters the solve)
    - the CPM cell-id / cell-type lattice, used ONLY to place S(x) at the pixels of secreting cells
    - global diffusion coefficient D (diff_global) and global decay/degradation rate k (decay_global);
      the medium is homogeneous (no per-type D_i/k_i here, unlike DiffusionSolverFE)
    - per-face boundary conditions (Dirichlet value / Neumann flux / periodic) and an optional initial-field
      guess (init_expression / init_filename)
    writes:
    - the concentration field c over ALL lattice sites, OVERWRITTEN in place with the t=infinity equilibrium
      solution of D grad^2 c - k c + S = 0 (a whole-field REPLACE, not an integrable delta)
    maps:
    - grid_bvp
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
  disputed:
    by: skeptic
    was: new
    claimed: null
    evidence: null
    what_would_settle_it: null
- id: surface
  order: 27
  raw_name: Surface
  raw_kind: Plugin (SurfacePlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L2225
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366 -- the GGH/CPM effective-energy (Hamiltonian)

    discussion, where the surface constraint is one term of E, the standard partner of the volume

    term. NOTE: no paper text was available in this environment, so this anchor is the chapter''s

    known home for the term, NOT a page I have read. The equation below is reconstructed from the

    CC3D source declaration (SurfaceEnergyParameter / SurfacePlugin) plus standard CPM convention;

    the compiled changeEnergy was not read.

    '
  summary: 'A per-cell-type (or, in bare mode, per-cell) quadratic penalty on the deviation of a cell''s

    BOUNDARY count -- its perimeter (2D) / surface (3D) -- from a target. It writes no state: on

    every proposed pixel copy it returns a dE that makes copies pushing a cell''s perimeter away from

    its target energetically costly, so the Metropolis rule rejects most of them. Where the Volume

    term sets a cell''s SIZE (0th geometric moment, a site count), the Surface term sets its MEMBRANE

    AREA / roughness (the 1st-order boundary count): below target it favours ruffling out, above

    target it favours smoothing in -- an effective surface / cortical tension. Volume + Surface

    together are the two terms that give a set-of-sites a rounded, incompressible cell shape.

    '
  equations: "Effective-energy surface term, summed over all real cells sigma (Medium, id 0, is exempt):\n\
    \n  E_surf = sum_{sigma>0} lambda_S(sigma) * ( S(sigma) - S_target(sigma) )^2\n\nwhere\n  S(sigma)\
    \        = the cell's surface: the number of adjacent site-pairs, counted out to\n               \
    \     NeighborOrder, where the id changes across the pair (a boundary / perimeter\n              \
    \      COUNT), so it grows with both spread AND membrane roughness. It is a COUNT,\n             \
    \       not a physical area.\n  S_target(sigma) = the cell's rest / target boundary count.\n  lambda_S(sigma)\
    \ = quadratic stiffness (energy per (site-pair)^2); lambda_S = 0 removes the term.\n\nThe plugin never\
    \ integrates this. On each attempted pixel copy (a source site's id is proposed to\noverwrite a neighbour\
    \ site) it returns dE = E_surf(after) - E_surf(before). A single copy is a\nTWO-cell event -- the\
    \ gaining cell and the losing cell each change their boundary count (either may\nbe Medium, which\
    \ contributes 0) -- so dE couples both quadratics and is NOT symmetric. The\nMetropolis rule accepts\
    \ with P = 1 if the TOTAL dE (this term + all others) <= 0, else\nexp(-dE / T), where T = the Potts\
    \ fluctuation_amplitude. Standard CPM convention has no leading\n1/2 on the quadratic. Measured reference\
    \ ablation (log/atlas_cc3d/surface_constraint, target 16,\nlambda_S 2.0, seed 42): mean perimeter\
    \ 20 -> 19.33 constrained vs 20 -> 22.8 unconstrained\n(lambda_S = 0) -- the penalty rounds and compacts\
    \ cells toward target, the ablation lets them\nspread/ruffle.\n"
  params:
    target_surface: 'target_perimeter -- the boundary count a cell of this type relaxes toward

      (SurfaceEnergyParameter.target_surface; CC3DML attribute TargetSurface). Guarded >= 0

      (check_dict, PyCoreSpecs.py:L2170).

      '
    lambda_surface: 'perimeter_stiffness / constraint_stiffness -- the quadratic energy penalty per (site-pair)^2
      of

      deviation from target (CC3DML attribute LambdaSurface). NOT guarded on the parameter: lambda_S =
      0

      is legal and is exactly the ablation that unconstrains the perimeter.

      '
    neighbor_order: 'plugin-level int (SurfacePlugin.__init__, PyCoreSpecs.py:L2248), guarded >= 1

      (check_dict L2244). Sets how far out the id-change pairs are counted, i.e. WHAT COUNTS AS the

      boundary -- so it changes the numeric meaning of S, not just its precision. Optional; if a

      SurfaceTracker with its own order is present, that order overrides this (per the docstring L2253).

      '
    scale_surface: 'plugin-level float (PyCoreSpecs.py:L2249), guarded >= 0 (check_dict L2245). A surface
      scaling

      coefficient applied to the measured S (a lattice-geometry normalization); does not change the

      quadratic FORM.

      '
    _params: '(plugin constructor, SurfacePlugin(neighbor_order, scale_surface, *_params),

      PyCoreSpecs.py:L2247) zero or more SurfaceEnergyParameter, one per cell type. Zero param args =

      "bare" mode: target_surface / lambda_surface are then read PER-CELL from cell.targetSurface /

      cell.lambdaSurface instead of per-type (the same per-type-silences-per-cell split as Volume).

      '
  state_io: "reads: S(sigma), the per-cell boundary count -- maintained incrementally by a SEPARATE plugin,\n\
    \  SurfaceTrackerPlugin (see the surfacetracker sibling entry), NOT recomputed by this plugin; and,\n\
    \  per cell, its targetSurface + lambdaSurface, taken EITHER from per-type SurfaceEnergyParameters\n\
    \  OR, in bare mode, from the per-cell cell.targetSurface / cell.lambdaSurface attributes. Also\n\
    \  reads neighbor_order (which id-change pairs constitute the boundary) and scale_surface.\nwrites:\
    \ nothing. It is an energy term -- it only changes the acceptance probability of a proposed\n  pixel\
    \ copy, never moves or writes state directly. (This is the campaign-flagged shape: a Potts\n  plugin\
    \ returns a scalar dE and mutates no cell field; it does not fit read/write update language.)\n"
  surprises:
  - '`cell.surface` silently reads 0 unless SurfaceTrackerPlugin is enabled -- a flat zero line that

    looks like a valid measurement. The COUNT and the ENERGY are two different plugins: SurfacePlugin

    only reads S(sigma); SurfaceTracker keeps it up to date on each accepted copy. A reimplementer who

    folds "recount the boundary" into the energy term, or forgets the tracker, gets a plugin reading a

    stale or zero surface and a silently inert constraint.

    '
  - 'Measured ablation (log/atlas_cc3d/surface_constraint): perimeter 20 -> 19.3 constrained (target 16,

    lambda_S 2.0) vs 20 -> 22.8 unconstrained (lambda_S 0). The effect is real but far milder than the

    Volume ablation -- unconstraining surface lets cells spread/ruffle, it does NOT dissolve them

    (Volume still holds their size). Surface shapes the membrane; Volume anchors the object.

    '
  - 'S is a boundary-PAIR count, and neighbor_order decides which pairs count. So the SAME cell has a

    different S at different neighbor orders, and target_surface is only meaningful relative to the

    order used to measure it -- a target tuned for order 1 is wrong for order 2. neighbor_order is part

    of the constraint''s definition, not a free knob.

    '
  - 'A single pixel copy is a TWO-cell event: both the gaining and the losing cell change their boundary

    count, and because the term is quadratic the two contributions do not cancel -- dE depends on how

    far each cell already is from its own target. Treating perimeter relaxation as an independent

    per-cell update misses this coupling. Medium (id 0) has no surface constraint and contributes 0.

    '
  - 'Only target_surface is guarded (>= 0). lambda_surface on the parameter is unchecked, so the zero

    that unconstrains the perimeter passes validation silently. As with Volume, the constraint''s

    strength is inseparable from the Potts temperature T (fluctuation_amplitude), which is a Potts

    param, not a Surface param: a large lambda_S with fixed T can freeze the boundary short of target.

    '
  verdict: new
  of: null
  implementation_of: null
  why: "NEW against the frozen baseline: no PROMOTED contract reads a cell's own BOUNDARY / perimeter\n\
    count and returns a restoring energy that grows with its deviation from a rest value. This is a\n\
    quadratic (Hookean) spring, lambda_S*(S - S_target)^2, on the 1st-order geometric descriptor of a\n\
    set of sites -- an effective membrane / cortical tension homeostasis -- evaluated as a Potts\nENERGY\
    \ term (returns dE for a proposed pixel copy, writes nothing). I name the missing contract\n`membrane_tension`.\n\
    \nCLOSEST PROMOTED contract = cell_grow (structural/growth): the nearest because it, too, is a\nper-cell,\
    \ target-driven geometric homeostasis. But widening cell_grow to admit this does violence\non three\
    \ counts:\n  1. QUANTITY. cell_grow targets the 0th moment -- SIZE (rest volume / site count), isotropic\
    \ and\n     area-like. membrane_tension targets the boundary count -- membrane AREA / roughness, which\
    \ is\n     independent of size: at fixed volume a cell can raise its perimeter by ruffling and lower\
    \ it\n     by rounding (the ablation shows exactly this, 20 -> 22.8 with volume held by the Volume\
    \ term).\n     Size homeostasis and membrane-area homeostasis are different biology.\n  2. MECHANISM.\
    \ cell_grow is a STATE UPDATE -- the engine integrates a rest-volume delta and the\n     cell physically\
    \ grows. membrane_tension is a Potts ENERGY term: changeEnergy returns a scalar\n     dE and mutates\
    \ NOTHING; it only re-weights the acceptance probability of a proposed pixel\n     copy. Forcing an\
    \ integrated growth update to also mean \"return a dE that gates a Metropolis\n     accept\" changes\
    \ cell_grow's output contract and breaks every current user.\n  3. DEPENDENCY. membrane_tension's\
    \ S is maintained by a separate tracker (SurfaceTracker) and is\n     read, not owned; cell_grow reads\
    \ a scalar target it owns.\n\nNOT an alias/refinement of the interaction family (attraction_repulsion,\
    \ cohesion, separation,\nsquared_law, stillinger_weber, ...): those are pairwise and metric over neighbours;\
    \ this reads a\nSINGLE cell's own boundary, no partner. It is filed lateral/mechanics with gravity\
    \ as the\nprecedent for a single-body mechanics energy, but gravity is a uniform body force, not a\n\
    restoring shape spring.\n\nRELATIONSHIP TO ITS SIBLINGS (Volume, order 30; LengthConstraint, order\
    \ 18 = `elongate`),\nrecorded honestly: all three are the same functional object -- a quadratic Hookean\
    \ spring on a\nper-cell geometric moment, contributing dE to the Metropolis accept -- differing only\
    \ in WHICH\ndescriptor they read (Volume the 0th moment / site count, Surface the 1st-order boundary\
    \ count,\nLength the 2nd moment / inertia-axis). One could lump them as a single\n`constrain_moment(cell,\
    \ order, target, lambda)` contract of which each is an implementation (see\nthe note's counter-argument,\
    \ and the same argument raised in the elongate sibling). I keep them\nDISTINCT because the descriptors\
    \ carry distinct biology and distinct homes in the language: size\nhomeostasis (Volume) maps onto\
    \ cell_grow's rest-volume machinery; anisotropy (Length) has no home\n(`elongate`); and membrane-area\
    \ / cortical-tension homeostasis (Surface) likewise has no home.\nCollapsing \"any quadratic on any\
    \ moment\" into one contract would erase those distinctions -- the\nnaming DEflation this campaign\
    \ must equally avoid. Since `elongate` is only PROPOSED this phase\nand is NOT in the frozen baseline,\
    \ and since perimeter (an isoperimetric boundary count) is a\nDIFFERENT descriptor from the inertia-tensor\
    \ major axis, this is NOT a second sighting of\n`elongate`: distinct contract, implementation_of:\
    \ null.\n\nNOT a second sighting of any jax-morph-proposed contract (adhere, agitate, apoptose,\n\
    mechanosense, morphogen, regulate, relax, reorient): none is a surface-area / membrane-tension\nenergy.\
    \ `adhere` is a pairwise interfacial energy between two cells (CC3D's Contact term), not a\nsingle\
    \ cell's self-boundary spring; `relax` (meaning unread) is not evidenced to be an\nisoperimetric membrane\
    \ spring, so I do not claim it.\n"
  contract:
    name: membrane_tension
    kind: lateral
    family: mechanics
    set: cell
    inputs: "- one cell's boundary count S(sigma) -- the number of id-change site-pairs out to\n  neighbor_order\
      \ (supplied/maintained by the SurfaceTracker plugin, read not recomputed);\n  grows with both spread\
      \ and membrane roughness, independent of the cell's volume.\n- the proposed single-pixel copy (source/target\
      \ site, the two involved cells), used to obtain\n  the incremental change in each cell's boundary\
      \ count for the two cells the copy touches.\n- the target and stiffness: target_surface S_target,\
      \ lambda_surface -- taken from the per-cell\n  cell.targetSurface / cell.lambdaSurface in bare mode,\
      \ else the per-cell-type\n  SurfaceEnergyParameter default.\n- neighbor_order (which id-change pairs\
      \ constitute the boundary; part of S's definition) and\n  scale_surface (a lattice-geometry normalization\
      \ on S).\n"
    outputs: "- a scalar energy contribution dE added to the Potts total, NOT an integrated state delta:\n\
      \  dE = E_after - E_before, with E(cell) = lambda_S*(S - S_target)^2, summed over the two cells\n\
      \  the candidate copy changes (Medium contributes 0). The delta only re-weights the Metropolis\n\
      \  acceptance probability (P=1 if total dE<=0 else exp(-dE/T)); the operator writes no cell\n  property.\n"
    reads: "- the cell's boundary count S(sigma) (maintained by SurfaceTracker; reads 0 / inert without\
      \ it)\n  and neighbor_order + scale_surface that define it.\n- per-cell cell.targetSurface / cell.lambdaSurface\
      \ (bare mode) OR the per-type\n  SurfaceEnergyParameter default.\n- the candidate pixel copy and\
      \ the two involved cells, for the incremental boundary-count change.\n"
    writes: "- NONE. changeEnergy returns dE (an energy term) and mutates no cell field; it changes only\
      \ the\n  acceptance probability of the proposed pixel copy.\n- (out of band, not part of this contract)\
      \ a host steppable may set the per-cell targetSurface /\n  lambdaSurface; that is host-driven state-setting,\
      \ not the energy evaluation.\n"
    maps: "- cell pixel set -> boundary count S = number of id-change site-pairs out to neighbor_order,\n\
      \  scaled by scale_surface (the tracker's job; read here, not computed).\n- surface deviation (S\
      \ - S_target) -> quadratic Hookean energy lambda_S*(dev)^2 per cell ->\n  summed over the two cells\
      \ a candidate copy touches -> dE that gates the Metropolis accept.\n  At target -> low energy; over-spread/ruffled\
      \ or over-compact -> higher energy (a two-sided\n  restoring membrane / surface tension).\n"
  status: inspected
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
