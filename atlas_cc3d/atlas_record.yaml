  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5270
  paper_section: 'No dedicated paper section -- Swat et al. (2012) Methods Cell Biol 110:325-366 does
    not

    document the pixel trackers separately. Checkable source anchors instead: PyCoreSpecs.py:L5270

    (the Python spec class BoundaryPixelTrackerPlugin) and the C++ code-ref guide heading

    cc3d/doc/code_ref/user/build/cpp/CompuCell/plugins/BoundaryPixelTrackerPlugin.rst

    (autoclass CompuCell.BoundaryPixelTrackerData / BoundaryPixelTrackerPlugin).

    '
  summary: 'A per-cell BOOKKEEPING plugin, not an energy term and not a state update. For every cell it

    maintains the SET of that cell''s boundary lattice sites -- sites the cell owns that also have at

    least one neighbour (out to neighbor_order) belonging to a different cell or to the medium -- and

    keeps that set current as pixel copies are accepted. It changes no energy, no cell-id lattice and

    no field; its only product is an auxiliary index (pixelSet / pixelSetMap) that OTHER mechanisms

    query, e.g. Curvature, FocalPointPlasticity, or the steppable helper get_cell_boundary_pixel_list.

    '
  equations: "No update law and no energy term. The plugin maintains, per cell c, a set of boundary pixels\n\
    \  B_k(c) = { x in c : there exists y in N_k(x) with cellId(y) != cellId(x) }\nwhere\n  x, y    :\
    \ lattice sites (Point3D)\n  c       : a cell = the set of sites sharing one cell id\n  N_k(x)  :\
    \ the k-th-order lattice neighbourhood of site x\n  k       : neighbor_order (>= 1); the medium (null\
    \ cell) counts as a different id.\nThe C++ core stores this per cell as pixelSet (the default-order\
    \ set) and pixelSetMap\n(order k -> set), each element a BoundaryPixelTrackerData whose `pixel` is\
    \ one coordinate.\nOn each ACCEPTED pixel copy the plugin updates B_k for the site(s) that changed\
    \ owner and for\ntheir neighbours (add / remove / re-test membership) so the sets stay exact without\
    \ a full\nrescan. That incremental re-test is compiled C++ (libCC3DBoundaryPixelTracker.so) and was\
    \ NOT\nread directly here; the watcher / incremental-update model is inferred from the per-cell\n\
    pixelSetMap + BoundaryPixelTrackerAccessor structure and CC3D's CellGChangeWatcher architecture.\n"
  params:
    neighbor_order: 'boundary_detection_range -- the lattice neighbour-shell order k used to decide whether
      a cell

      site is a boundary site, and which orders are tracked and therefore queryable. Integer >= 1

      (check_dict rejects x < 1 as "Neighbor order must be positive"); default 1. The <NeighborOrder>

      CC3DML element is emitted only when k > 1.

      '
  state_io:
    reads: 'The cell-id lattice in the neighbourhood of each changed site (which cell owns each neighbouring

      site, medium included). It reads no PDE field and no energy.

      '
    writes: 'A per-cell auxiliary index ONLY: pixelSet / pixelSetMap (neighbour order -> set of boundary-pixel

      coordinates), attached to each cell through BoundaryPixelTrackerAccessor. It writes NOTHING to the

      cell-id lattice, to any field, or to the Hamiltonian -- a simulation with this plugin loaded is

      bit-identical to one without it. The plugin exists solely so other mechanisms can read a cell''s

      boundary sites cheaply.

      '
  surprises:
  - 'Pure index / monitor: it returns no energy delta and performs no field write, so unlike a Plexus

    operator it changes no simulated state at all. Modelling it as a state update makes it look like a

    phantom no-op (record.py R7 exists precisely because three such no-ops shipped undetected). The

    honest statement is that this "mechanism" is auxiliary state that other mechanisms consume.

    '
  - 'Boundary pixels != all pixels. This is the sibling of PixelTracker, which keeps EVERY site of a

    cell; BoundaryPixelTracker keeps only sites adjacent to a different owner. Reimplementing it as

    "track all pixels" is the obvious wrong turn and silently changes what downstream queries see.

    '
  - 'neighbor_order is 1-based and must be >= 1; the <NeighborOrder> XML element is written ONLY when

    > 1 (the default 1 stays implicit). Emitting it at order 1 yields different CC3DML than the

    reference even though it is semantically equivalent.

    '
  - 'The declared neighbor_order bounds what is queryable: asking the plugin for a boundary set at an

    order it was not told to track returns a null set and the Python iterator raises LookupError

    (getPixelSetForNeighborOrderPtr). So the parameter is a declaration of which neighbour shells to

    maintain, not merely a detection radius applied at query time.

    '
  - 'Medium (cell id 0 / the null cell) counts as a "different cell" for boundary membership, so a cell

    touching only medium still has a full boundary set.

    '
  - 'What I could NOT establish from the readable sources (the update lives in the compiled .so):

    whether the medium itself is given a tracked boundary set (BoundaryPixelTracker has no track_medium

    flag, unlike PixelTracker, suggesting not), the exact neighbour re-test ordering per accepted copy,

    and how 2nd+-order sets in pixelSetMap relate to the default-order pixelSet.

    '
  verdict: out_of_scope
  of: null
  implementation_of: null
  why: 'Pure acceleration structure, no biological content. The plugin returns no energy delta,

    writes no cell-id lattice site and no field, and touches no term of the Hamiltonian -- a

    simulation with it loaded is bit-identical to one without (confirmed at source: PyCoreSpecs.py

    L5270-5308 is a spec whose only effect is emitting an optional <NeighborOrder> element; the

    incremental update lives in the compiled tracker and only maintains the index). Its sole

    product is a per-cell cache of which of that cell''s own lattice sites lie on its surface, so

    that OTHER mechanisms (Curvature, FocalPointPlasticity, contact/surface queries) can avoid

    rescanning every pixel of every cell. That is a spatial index -- the cellular-Potts analog of a

    neighbour-list / cell-list -- not a process.


    The closest registered contract is `radius_graph` (also rewire/topology, also index-only,

    also emits no integrable delta -- src/plexus/operators/graph.py). But radius_graph earns its

    place by building the RELATION over the elements of a set (who-interacts-with-whom), which is

    the substrate every lateral message-passing operator runs on. BoundaryPixelTracker builds no

    relation among cells; it classifies a single cell''s OWN sub-elements (boundary pixel vs

    interior pixel), a distinction that exists only because a CC3D cell IS a set of lattice sites.

    Plexus cells are points/particles with a derived radius and have no per-cell pixel set, so

    there is nothing here to alias, refine, or promote -- the concept collapses to nothing in the

    promoted representation. It is representation-specific plumbing, hence out_of_scope. (Not

    aliased to radius_graph precisely because calling it that would let acceleration caches count

    toward the language''s vocabulary.)

    '
  contract:
    name: boundary_index
    kind: rewire
    family: topology
    set: cell
    inputs: []
    outputs:
    - boundary_pixel_set
    reads:
    - cell_id_lattice
    writes:
    - cell.boundary_pixels
    maps: []
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: boxwatcher
  order: 4
  raw_name: BoxWatcher
  raw_kind: Steppable (BoxWatcherSteppable)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5490
  paper_section: 'Not covered by Swat et al. (2012) Methods Cell Biol 110:325-366. BoxWatcher is a

    computational-optimization steppable, absent from the modeling-methods text; the only

    source anchor is the CC3DML generator docstring "Module tracing boundaries of the minimal

    box enclosing all the cells. May speed up calculations. May have no effect for parallel

    version" (twedit5 CC3DMLGenerator/CC3DMLGeneratorBase.py:L1288-1290, echoed at

    CC3DProject/CC3DXMLGenerator.py:L1071). No paper page/figure has been read for this entry.

    '
  summary: 'A bookkeeping / performance steppable, NOT a physics term. Each step it traces the minimal

    axis-aligned bounding box enclosing all non-medium cells, pads it per-axis by fixed margins,

    and hands that box to the Potts solver so the Metropolis pixel-copy sweep samples only sites

    inside it. It touches no cell state and no energy: it scopes WHERE flips are attempted, to

    avoid sweeping empty lattice on domains much larger than the occupied region.

    '
  equations: "There is no energy term and no state update. The per-step bookkeeping (reconstructed from\n\
    the docstring + margin semantics; the compiled core was not read) is, for each axis d in {x,y,z}:\n\
    \n  lo_d = min over all lattice sites s belonging to any non-medium cell of s_d\n  hi_d = max over\
    \ all lattice sites s belonging to any non-medium cell of s_d\n  BoxMin_d = clamp(lo_d - Margin_d,\
    \ 0, Dim_d)\n  BoxMax_d = clamp(hi_d + Margin_d, 0, Dim_d)\n\nwhere Margin_d is XMargin/YMargin/ZMargin\
    \ and Dim_d the lattice dimension. The Potts sweep\nthen draws candidate source pixels uniformly from\
    \ [BoxMin, BoxMax] instead of the whole\nlattice. No dE is returned; no cell field is written. The\
    \ clamp form and recompute cadence\nare inferred, not verified byte-for-byte.\n"
  params:
    XMargin: sweep_padding_x -- lattice sites of buffer added around the tight occupied box in x; default
      7 (set only by the twedit generators, see surprises)
    YMargin: sweep_padding_y -- same, y axis; default 7
    ZMargin: sweep_padding_z -- same, z axis; default 7
  state_io: 'reads: the occupied lattice-site extents of every non-medium cell -- a global reduction over

    the whole cell set to one axis-aligned bounding box. writes: a GLOBAL BoxMin/BoxMax on the

    Potts simulator that scopes the flip-attempt sampler''s spatial support. It writes NO cell

    state and NO field, and returns NO energy delta -- it is neither an energy term nor a

    per-cell update, but a modifier of the sampler''s domain.

    '
  surprises:
  - 'It is neither of the two categories this campaign expects (energy term / state update). It

    writes the SAMPLER''s spatial support -- a global box -- not any cell, field, or dE. In Plexus

    terms nothing returns a delta the engine integrates; it is a domain-scoping / control

    construct with no obvious operator analogue.

    '
  - 'The PyCoreSpecs wrapper is parameterless and LOSSY. `xml` emits only

    `<Steppable Type="BoxWatcher"/>` via generate_header (no children); `from_xml` (L5509) calls

    find_xml_by_attr then returns a bare `cls()`, so any XMargin/YMargin/ZMargin present in loaded

    CC3DML is SILENTLY DROPPED on round-trip. Meanwhile the twedit5 snippet/project generators DO

    emit XMargin=YMargin=ZMargin=7. Source-vs-source discrepancy on whether margins exist at all.

    '
  - 'The docstring warns it "may have no effect for parallel version": the optimization is bypassed

    under the parallel/multithreaded Potts sweep, so the mechanism''s realized effect is

    implementation/threading-dependent rather than a property of the model.

    '
  - 'Intended as a pure speedup, but restricting the sweep''s support changes which sites the sampler

    visits, so a fixed-seed serial run WITH vs WITHOUT BoxWatcher is not obviously bit-identical

    (the RNG/attempt sequence differs). Whether the core guarantees identical dynamics I could not

    verify -- flagged as inference, not fact.

    '
  - 'The margin default of 7 is a magic constant living ONLY in the twedit generators. A

    reimplementer following PyCoreSpecs (which sets nothing) would inherit whatever the compiled

    default is -- unknown from this environment -- not 7.

    '
  verdict: out_of_scope
  of: null
  implementation_of: null
  why: 'BoxWatcher carries NO biological content: it recomputes the axis-aligned bounding box of all non-medium
    cells (plus fixed per-axis margins) each step and hands it to the Potts solver so pixel-copy attempts
    are drawn only from the occupied region -- the docstring''s own justification is "May speed up calculations".
    It writes the Metropolis SAMPLER''s spatial support, not any cell, field, or energy delta, and is
    meant to be dynamics-preserving. The closest registered contract is `aggregate` (both reduce the whole
    cell set to one global quantity) and the TYPED SHAPE here genuinely is a set-to-global reduction;
    but the reduced quantity is a solver control parameter with no biological referent (a hierarchy `aggregate`
    produces a parent tissue node, not a sampling window). Admitting it as a biological operator -- `new`
    or an `aggregate` alias -- would inflate the yield with framework mechanics and corrupt the saturation
    measurement, so it is out_of_scope. The contract below is recorded only to document the reduction
    shape; its `family: hierarchy` is a forced fit, not a claim that BoxWatcher builds a hierarchy.

    '
  contract:
    name: sweep_scope
    kind: aggregate
    family: hierarchy
    set: cell
    inputs:
    - XMargin
    - YMargin
    - ZMargin
    outputs:
    - box_min
    - box_max
    reads:
    - cell.lattice_site_extents
    writes:
    - potts.sweep_bounds
    maps: []
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: celltype
  order: 5
  raw_name: CellType
  raw_kind: Plugin (CellTypePlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L1793
  paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366, 'Multi-Scale Modeling of Tissues Using
    CompuCell3D'
  summary: CellType Plugin specs
  equations: 'A labelling: each cell id sigma carries a type tau(sigma). Medium is type 0 and is not a
    cell.'
  params:
    cell_types: 'the enumerated PALETTE of cell-type names paired with integer ids -- the closed vocabulary

      of tau values a simulation may use. Medium is always (Medium, 0) and cannot be renumbered.

      NOT a per-cell assignment: this lists the valid types, it does not say which cell is which.

      '
    frozen: 'per-type boolean (emitted as the <Freeze/> attribute); a frozen type''s cells are excluded

      from the Metropolis pixel-copy sweep, i.e. an immovable boundary condition / obstacle.

      (Inferred CC3D semantics; the Python spec only writes the flag, the effect is compiled-core.)

      '
  state_io: 'Writes nothing dynamical. CellTypePlugin DECLARES a registry: the (name, id, frozen) triples

    for the type palette, plus the fixed (Medium, 0, False) entry. It contributes no term to the

    Hamiltonian and returns no delta. The actual per-cell tau(sigma) assignment is performed

    elsewhere (BlobInitializer / UniformInitializer draw a type per created cell -- see the

    blobinitializer entry''s "SEED-DEPENDENT random type draw" surprise); this plugin only fixes

    the set of legal values those draws select from. Almost every other plugin (contact/adhesion,

    chemotaxis-by-type, volume/surface targets keyed by type) READS this registry to resolve a

    type-name string to the id it keys its per-type parameters on.

    '
  surprises:
  - 'Medium being a TYPE rather than the absence of a cell is load-bearing: contact energies with Medium
    are what set a tissue''s surface tension against empty space.'
  - 'CellTypePlugin does NOT assign types to cells -- it only enumerates the legal types. A reader

    expecting an operator that sets tau(sigma) finds instead a pure schema declaration; the

    assignment lives in the initializers and is seed-dependent and random. So the "mechanism" is a

    vocabulary table, not a process, and it is bit-for-bit dynamics-neutral on its own.

    '
  - 'Type ids auto-increment from max(existing)+1 when omitted (PyCoreSpecs.py:L1902-1903), so the

    numeric tau of a type depends on DECLARATION ORDER unless every id is given explicitly. Two

    models that list the same type names in a different order can key their per-type contact matrix

    on different integers -- a silent reproducibility trap when parameters are indexed by id.

    '
  - 'The per-type Freeze flag (PyCoreSpecs.py:L1825-1826) smuggles a genuine dynamical effect into

    what is otherwise a declaration: freezing a type turns its cells into fixed obstacles the Potts

    sweep never updates. That effect is a boundary condition, not a property of "being typed" --

    further evidence the plugin bundles schema with an unrelated mechanic.

    '
  verdict: out_of_scope
  of: null
  implementation_of: null
  why: 'CellTypePlugin carries no dynamical, integrable content: it declares the PALETTE of legal cell

    types -- (name, id, frozen) triples, with (Medium, 0) fixed -- and nothing more. It returns no

    energy delta, touches no term of the Hamiltonian, and does not even perform the per-cell type

    assignment (the initializers do that, randomly and seed-dependently -- see blobinitializer). A

    simulation''s dynamics are unchanged by WHICH names label the types; only downstream plugins that

    read the registry to resolve type-keyed parameters (contact energy, per-type chemotaxis, volume

    targets) give the labels their effect. So this is the type SCHEMA -- the closed vocabulary of

    tau values -- which the promoted Plexus algebra already presupposes as a first-class per-agent

    attribute: selectors like `agent[type=a]` read `type` directly, and no registered operator

    creates, changes, or declares it. There is therefore nothing to alias (no operator types cells)

    and nothing to widen (a schema is not a per-step operator). Counting a framework''s type-registry

    declaration as a contract would measure how CC3D names its cell classes, not whether the

    dynamical vocabulary is converging.


    The genuinely biological concept adjacent to this is DIFFERENTIATION -- a cell acquiring or

    changing its fate/type over time. The closest thing the language has to that is the jax-morph

    proposal `regulate` (gene/fate-state update), not any registered contract. But CellTypePlugin

    implements no such dynamic: it never changes a cell''s type, it only enumerates the legal ones.

    Aliasing it to a (still-unpromoted) `regulate`, or minting a `new` `differentiate`, would put a

    contract behind a verb this mechanism does not perform -- the opposite error from missing a real

    operator. If and when a CC3D mechanism that MUTATES tau(sigma) at runtime appears, THAT is where

    `differentiate`/`regulate` should be earned; this static declaration is not it.


    The contract below is recorded only to document the honest typed shape IF one insisted the type

    labelling belonged inside the algebra -- a structural partition of the cell set into typed

    subpopulations. Its `kind: structural` / `family: hierarchy` is a forced fit (and the reason it

    is exempt from the writes-nothing no-op rule), not a claim that CellType is an operator.

    '
  contract:
    name: differentiate
    kind: structural
    family: hierarchy
    set: cell
    inputs:
    - type_palette (list of (name, id) with Medium=0 fixed)
    - frozen_flags (per-type immovability)
    outputs:
    - typed_partition_of_the_cell_set
    reads:
    - cell_id_field (the set of cells to be labelled)
    writes:
    - cell.type (the per-cell tau label -- the attribute every type-keyed operator selects on)
    maps: '(a set of cells, a closed palette of type names/ids) -> a labelling that assigns each cell
      id

      exactly one tau in the palette, partitioning the set into typed subpopulations, with tau=0

      (Medium) reserved for empty lattice. A one-shot declaration/labelling, not a per-step delta;

      downstream operators read cell.type but this contract never updates it once set.

      '
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: centerofmass
  order: 6
  raw_name: CenterOfMass
  raw_kind: Plugin (CenterOfMassPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L3056
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366. NO dedicated section: CenterOfMass
    is

    plumbing, not a named mechanism in the chapter; the paper only invokes a cell''s centre of

    mass indirectly, via COM-based chemotaxis and the "CenterOfMassBased" external-potential

    algorithm. We have no extracted paper text for this target, so the only anchors I could

    actually check are in the source: the class docstring at PyCoreSpecs.py:3056 and the

    autoclass stub at doc/code_ref/user/build/core/PyCoreSpecs.rst:169.

    '
  summary: 'A per-cell lattice monitor (a CellGChangeWatcher), NOT an energy term. It maintains each

    cell''s centre of mass. It has no dynamics of its own and contributes nothing to the Potts

    Hamiltonian: it never changes the probability that a proposed pixel copy is accepted. On

    every accepted spin-flip it updates, for the gaining and losing cell, the accumulated first

    moment of the cell''s lattice sites and divides by the live site count (volume) to store the

    centre of mass on the CellG struct. Its whole purpose is to publish derived state that OTHER

    mechanisms read (COM-based chemotaxis, CenterOfMassBased external potential, mitosis split

    orientation, connectivity).

    '
  equations: "A cell is a set S of lattice sites r = (x, y, z) sharing one cell id; volume V = |S| is\
    \ the\nsite count. The plugin maintains two distinct fields per cell (both live on CellG):\n\n  first\
    \ moment (raw coordinate sum):   xCM = sum over r in S of x   (likewise yCM, zCM)\n  centre of mass\
    \ (normalized):         xCOM = xCM / V               (likewise yCOM, zCOM)\n\nThese are updated INCREMENTALLY,\
    \ not recomputed. When an accepted copy adds site r to a cell\nand removes it from its neighbour,\
    \ the watcher does, per affected cell:\n\n  add a site r:     xCM += x ;  V += 1 ;  then  xCOM = xCM\
    \ / V\n  remove a site r:  xCM -= x ;  V -= 1 ;  then  xCOM = xCM / V   (guard V == 0)\n\nA third\
    \ field, xCOMPrev/yCOMPrev/zCOMPrev, holds the centre of mass from the previous update\nso that consumers\
    \ can form a per-MCS cell displacement d = COM - COMPrev (cell velocity).\n\nSymbols: xCM = code field\
    \ CellG.xCM (first moment); xCOM = code field CellG.xCOM (= moment /\nvolume). The two names are NOT\
    \ interchangeable.\n\nPeriodic-boundary caveat: for a cell straddling a wrap seam the naive coordinate\
    \ sum is\nwrong; the core unwraps coordinates against the BoundaryStrategy before accumulating, then\n\
    re-wraps xCOM back into [0, L). That correction lives in the compiled C++ core (see\nsurprises); I\
    \ could NOT read its exact form, so the formulae above are the ordinary\n(non-periodic) case as the\
    \ data model implies it, not a transcription of the wrap arithmetic.\n"
  params: {}
  state_io:
    reads: '- the location r = (x, y, z) of the pixel whose id changed on the accepted copy

      - the affected cells'' current volume V (site count) and current xCM/yCM/zCM

      (No CC3DML parameters: the plugin is parameterless. It emits only

      <Plugin Name="CenterOfMass"/> with no child elements or attributes.)

      '
    writes: '- CellG.xCM, yCM, zCM  -- first moments (accumulated coordinate sums)

      - CellG.xCOM, yCOM, zCOM  -- centre of mass ( = moment / volume )

      - CellG.xCOMPrev, yCOMPrev, zCOMPrev  -- previous-update centre of mass (for displacement)

      Writes NO energy / acceptance delta -- it is a pure state-derivation monitor.

      Does NOT write the inertia tensor iXX..iZZ; that is the separate MomentOfInertia plugin

      (PyCoreSpecs.py:5350). From Python these COM fields are READ-ONLY: the SWIG setters

      (CompuCell.py:595-628) raise AttributeError on assignment.

      '
  surprises:
  - 'Not a Hamiltonian term. Almost every CC3D plugin in this inventory is an energy contribution

    that only tilts the acceptance probability. CenterOfMass returns no delta-E and never

    influences which pixel copies are accepted; it is a CellGChangeWatcher that only derives

    per-cell bookkeeping. A reimplementer expecting an energy contract will find none -- in the

    Plexus algebra this reads more like a REDUCE over a set (moment, then divide) that publishes

    a derived field, not an operator that returns a force/energy delta.

    '
  - 'Two different fields, easy to conflate: xCM (raw first moment = coordinate sum) versus xCOM

    (= xCM / volume). The moment must be carried incrementally; dividing a stored sum by a stale

    volume gives the wrong COM. xCOM is derived and read-only.

    '
  - 'Periodic-boundary correction. For a cell that straddles a periodic seam a plain coordinate

    sum places the COM in the middle of the lattice instead of at the cell. CC3D unwraps

    coordinates against the BoundaryStrategy before summing and re-wraps xCOM into the lattice.

    This is the single subtlety most likely to be gotten wrong, and it lives in the unshipped

    compiled core -- I could not read the exact arithmetic, only infer that it happens.

    '
  - 'Unguarded prerequisite. The Python spec makes CenterOfMass depend only on

    [PottsCore, CellTypePlugin] (the base depends_on, PyCoreSpecs.py:305) and NOTHING in the

    spec framework declares a depends_on CenterOfMass. Yet COM-based Chemotaxis and the

    "CenterOfMassBased" ExternalPotential algorithm (PyCoreSpecs.py:2939) silently READ xCOM.

    Omitting this plugin passes spec validation but yields zero/stale COM at runtime.

    '
  - 'xCOMPrev means the tracker also underwrites cell velocity: displacement per MCS is

    COM - COMPrev. There is no separate "velocity" mechanism; that state is a side effect of

    this plugin keeping a one-step history.

    '
  - 'Division-by-zero guard: when a cell loses its final pixel V hits 0 and the cell is slated

    for removal; the xCOM = xCM / V step must be guarded or skipped for that cell.

    '
  verdict: alias
  of: aggregate
  implementation_of: aggregate
  why: 'CenterOfMass IS the `aggregate` centroid reduction, applied per cell. In the Plexus

    registry `aggregate` (aggregate.py) reduces a contained child set onto its parent by the

    occupancy-weighted mean of the children''s positions -- "a cell''s position = the centroid of

    its particles" -- and writes that mean back as the parent''s derived `pos`, returning no

    integrable delta (MAY_MUTATE_INTEGRATED_STATE, returns {}). CC3D''s CenterOfMass does exactly

    this with the Cellular-Potts identification child=lattice site, parent=cell: it accumulates

    the coordinate sum over a cell''s sites and divides by the site count (volume) to publish

    xCOM on the CellG struct, writing no energy / acceptance delta. Same typed shape

    (children -> parent along the containment map), same reads (child positions + occupancy as

    the weight), same write (parent position as a read-only derived readout), same kind/family

    (aggregate / hierarchy). Every site carries occupancy 1, so the occupancy-weighted mean of

    the aggregate contract degenerates to the plain coordinate mean CC3D computes -- no signature

    field has to widen, so this is an alias, not a refinement.


    It is a genuinely distinct IMPLEMENTATION of that one contract, hence implementation_of:

    aggregate. Two implementation differences, neither of which touches the typed signature:

    (1) CC3D maintains the moment INCREMENTALLY on each accepted spin-flip (xCM += x; V += 1;

    xCOM = xCM/V) rather than recomputing the full index_add each forward pass -- an efficiency

    choice, identical result. (2) CC3D unwraps coordinates against the BoundaryStrategy so a cell

    straddling a periodic seam gets a COM at the cell and not at the lattice centre; the Plexus

    centroid does a plain weighted mean with no periodic-topology awareness. That periodic

    correction is a property of the reduction''s domain, not a change to its inputs/outputs/reads/

    writes/maps, so it is an implementation obligation of the aggregate contract on a wrapped

    lattice, not a new or widened contract. Likewise the raw first moment xCM is just the

    un-normalized intermediate of the same reduction, and xCOMPrev (one-step COM history, from

    which consumers form a per-MCS displacement = cell velocity) is a side bookkeeping field; a

    velocity readout is a separate concern and does not oblige the centroid contract to grow a

    history slot. The closest OTHER contract is `momentofinertia` (the sibling second-moment

    reduction), but that reduces to a tensor about the COM and is a different aggregate output,

    not this one.

    '
  contract:
    name: aggregate
    kind: aggregate
    family: hierarchy
    set: cell
    inputs:
    - site (the contained lattice-site child set; each site carries occupancy 1)
    outputs:
    - cell (the parent whose derived position is published)
    reads:
    - site.pos (the (x, y, z) coordinate of each lattice site the cell owns)
    - site.occupancy / cell.volume (the site count, the reduction weight and the divisor)
    writes:
    - cell.pos (centre of mass = coordinate sum / volume; a read-only derived readout, no energy / acceptance
      delta)
    maps:
    - parent
  status: normalized
