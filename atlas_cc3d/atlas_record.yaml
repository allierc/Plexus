    per <DiffusionField> (CC3DMLGeneratorBase.py:1990-1991). A reimplementer following twedit would scope

    autoscaling per field; following PyCoreSpecs, globally.

    '
  - 'from_xml can IMPORT a CC3DML this spec can never re-emit -- reader and writer disagree about

    whether Dirichlet clamps exist. from_xml (L7016-7019) explicitly parses <ConstantConcentration>

    elements and forwards each to field.secretion_data_new(..., constant=True); but that very method

    (L6892-6893) RAISES SpecValueError "does not support constant concentrations" on the "constant"

    kwarg. So round-tripping a legacy ReactionDiffusion CC3DML that pinned a source via

    ConstantConcentration crashes on the IMPORT read, not on write -- a self-contradiction inside one
    class.

    '
  - 'I did NOT read the compiled core, so the exact FE integration of the reaction term (DeltaT scaling,

    pre- vs post-diffusion evaluation order, and whether AutoscaleDiffusion also rescales the reaction)

    is inferred, not verified. The named-field coupling and the continuous form are established from the

    spec xml and the FitzHugh-Nagumo example; the discretisation of R is not.

    '
  status: normalized
  verdict: new
  of: null
  implementation_of: react
  why: 'WHAT THIS ENTRY IS ABOUT. Strip ReactionDiffusionSolverFE down and it is the SAME

    diffuse-decay-secrete forward-Euler solver as DiffusionSolverFE (order 14) plus ONE extra

    emitted element, <AdditionalTerm> (L6772-6773). The sibling DiffusionSolverFE entry already

    resolved the diffusion/decay/secretion substrate: the FTCS Laplacian is a third

    implementation of `diffuse`, the -lambda*c term is `decay`, the secretion source is

    `deposit`, and the per-cell-type coefficient heterogeneity is a costed refinement of

    diffuse/decay. I do NOT re-litigate that here. The ONLY marginal content of this mechanism

    over its sibling is the reaction term, so the verdict is about the reaction term. As a whole

    the mechanism is diffuse + decay + deposit + REACT; `react` is the sole verb the sibling

    composite does not already contain.


    WHAT REACT IS. AdditionalTerm is a per-field muParser expression added to that field''s update

    each step; crucially it may reference the OTHER fields BY NAME (and the cell type at the site).

    That is the classic "reaction" half of a reaction-diffusion system: an arbitrary, in general

    NONLINEAR, kinetics law that couples M concentration fields, producing and consuming species

    as a function of the local field values. The FitzHugh-Nagumo example is exactly this -- field

    F''s term "F-F*F*F/3+0.3-H" reads H, H''s term "0.08*F-0.064*H+0.056" reads F: an

    activator-inhibitor pair whose cross-coupling IS the reaction. It is a genuine field->field

    write (adds R_f*dt into the grid in place), kind=field / family=fields / set=field, the same

    typing as diffuse and decay.


    WHY NEW AND NOT A WIDENING OF decay. The closest REGISTERED contract is `decay`

    (field/fields/field): c <- c - lambda*dt*c. decay is exactly ONE degenerate instance of a

    reaction term -- a single-field, linear, sign-fixed (monotone-down) sink with no production

    and no coupling. `react` is the general case: multi-field, nonlinear, either sign (a reaction

    can grow a field -- indeed a BLANK AdditionalTerm defaults to R = c, exponential growth, not

    R = 0, per the surprises), and cross-coupled. To widen `decay` to admit AdditionalTerm you

    would have to let its coefficient become an arbitrary nonlinear function of every other field

    -- at which point "decay" no longer decays: it is a general kinetics operator wearing decay''s

    name. That does violence to decay''s biology (guaranteed turnover of one species), so this is

    `new`, not a refinement of decay. No other registered contract is a candidate: diffuse is

    transport, deposit is a set->field source, `sense`/`chemotax` couple fields to MOTION not to

    each other''s chemistry, `pacemaker`/`activation_pulse`/`playback` are prescribed single-field

    drivers with no inter-field coupling.


    RELATION TO THE jax-morph PROPOSAL `regulate` (the anti-inflation call). jax-morph already

    proposed `regulate` for reaction kinetics: dg/dt = f(g, drivers), an arbitrary user/learned

    law integrated per step. Mathematically react and regulate share the reaction-network shape

    dx/dt = f(x_1..x_n). I therefore RECORD the kinship explicitly so the ledger does not treat

    them as unrelated. But I do NOT collapse this into `regulate`, and here is why they are

    distinct typed contracts rather than one: `regulate` is set=cell / kind=exchange -- an

    INTERNAL per-cell gene-regulatory network, the genotype->phenotype decision function reading a

    cell''s own gene state and sensed drivers and writing its gene state. `react` here is

    set=field / kind=field -- EXTRACELLULAR chemistry over the pixel lattice, with no cell, no

    gene state, no heritability; the cell field enters only as an optional type label inside the

    expression. Unifying them would force `regulate` to widen BOTH its set (cell->field) and its

    kind (exchange->field), which strips out precisely what makes regulate regulate (an internal

    cell decision). Plexus types by set -- diffuse-on-a-field and a would-be spread-among-cells

    are separate contracts even sharing math -- so a field reaction and a cell gene network are

    correctly two sibling contracts in family=fields, not one. I set implementation_of: react

    (this FTCS + muParser scheme is ONE implementation of the react contract, as GeneNetwork*/

    NeuralODE are implementations of regulate), NOT implementation_of: regulate, so the ledger

    counts a genuinely new field-substrate reaction verb once -- while this paragraph flags that a

    future pass electing a single set-polymorphic reaction-kinetics contract would merge react

    and regulate. That is a call for the ledger-keeper to make deliberately, not one to bury by

    silently forcing the merge now.


    AND NOT A SECOND SIGHTING OF jax-morph `morphogen`. The OTHER standing jax-morph proposal in

    family=fields is `morphogen` (kind=exchange, set=cell, reads secretion_rate/pos/radius/alive,

    writes chemical, maps: pairwise): it MANUFACTURES a concentration field FROM CELL SOURCES by a

    dense all-pairs distance-kernel superposition -- the cells are the sources, the field is the

    product. That is exactly the CC3D SECRETION source term S_f, which the sibling DiffusionSolverFE

    entry already resolved to `deposit`; it is NOT the reaction term this entry is about. `react`

    has no cell sources, no pairwise map, and no set gather at all -- it is a purely local, on-lattice

    field->field kinetics law that reads the co-located values of the OTHER GRID fields at the same

    pixel. So react is neither `morphogen` (cell->field source manufacture) nor `regulate` (internal

    cell gene network): it is the third, field-substrate member of family=fields, separated from BOTH

    jax-morph proposals by set (field, not cell) and by what it reads (co-located grid-field values,

    not cell sources or a cell''s own gene state). This closes the anti-inflation check against BOTH

    standing fields-family proposals, not just regulate.


    CAVEAT CARRIED FROM INSPECTION. The continuous coupled form and the named-field coupling are

    established from the spec xml and the FitzHugh-Nagumo test; the exact DISCRETISATION of R

    (DeltaT scaling, pre- vs post-diffusion evaluation order, whether AutoscaleDiffusion rescales

    it) lives in the compiled core, which was not read. This does not change the verdict -- the

    contract is about WHICH quantities R reads and writes and that it is an arbitrary coupled

    reaction law, all of which are source-established -- but the numeric ordering of react vs the

    diffuse step is inferred.

    '
  contract:
    name: react
    kind: field
    family: fields
    set: field
    inputs:
    - field
    outputs: []
    reads:
    - the value at each pixel of EVERY declared concentration field (a field's reaction term reads the
      OTHER fields at the same site -- the cross-field read is the coupling that makes M diffusants into
      one reaction-diffusion system; this is the read `diffuse`/`decay` lack)
    - 'OPTIONAL: the CPM cell-type occupying the pixel, when the AdditionalTerm expression references
      cell type (a set-lattice read that keeps the operator field-kind: type enters only as a scalar label
      in the local reaction law, not as a gather over the set)'
    writes:
    - each concentration field, in place -- adds the evaluated reaction R_f (dt-scaled) to the field's
      forward-Euler update each step (a real field write, not an energy delta)
    maps: []
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: secretion
  order: 25
  raw_name: Secretion
  raw_kind: Plugin (SecretionPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L4306
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366 -- the chemical-fields / PDE-solver
    material (Secretion is a source term for diffusing fields). NO extracted paper text is available for
    this target, so I cannot cite a page/figure I have read: the SOURCE (PyCoreSpecs.py + the amoebae_2D
    test XML) is the only evidence anchoring this entry.'
  summary: 'A per-Monte-Carlo-step SOURCE/CLAMP term for a chemical concentration field. Each step it

    walks the lattice sites owned by cells of a named type and writes to the co-registered

    scalar field at those sites: plain Secretion ADDS a fixed rate (field[x] += rate);

    ConstantConcentration OVERWRITES (field[x] = const, a Dirichlet clamp); SecretionOnContact

    ADDS a rate only at a cell''s boundary sites that touch a cell of a specified other type.

    It does NOT move or diffuse the chemical -- transport is a separate PDE solver; Secretion

    only injects (or pins) mass at cell-occupied pixels. It writes the field, not cell state.

    '
  equations: "Let sigma(x) be the cell id at lattice site x, tau(c) the type of cell c, and phi the\n\
    scalar concentration field named by field_name. Per secretion call (repeated\nExtraTimesPerMC times\
    \ per MCS), for every cell c and every site x in c:\n\n  plain Secretion (type tau(c)=T has rate s_T):\n\
    \      phi(x) <- phi(x) + s_T                       for all x in c\n\n  ConstantConcentration (type\
    \ T pinned to level k_T):\n      phi(x) <- k_T                                for all x in c   (overwrite,\
    \ not +=)\n\n  SecretionOnContact (type T secretes r_{T,U} where it touches type U):\n      phi(x)\
    \ <- phi(x) + r_{T,U}                   for x in boundary(c) with a\n                            \
    \                       neighbour site y, sigma(y)=c', tau(c')=U\n\n`value` (_val) is the single per-type\
    \ magnitude: it is a RATE (added) for Secretion and\nSecretionOnContact, but an absolute CONCENTRATION\
    \ (assigned) for ConstantConcentration --\nsame field, different physical meaning by mode. The compiled\
    \ FieldSecretor also exposes\n...TotalCount / ...TotalAmount variants returning the summed mass injected\
    \ (tot_amount) for\nbookkeeping; the XML-driven plugin path uses the non-counting forms.\n"
  params:
    pixel_tracker:
      role: 'enable/disable the PixelTracker dependency = the per-cell interior-pixel index the

        inside-cell secretion iterates over. Disabling removes the source of "which sites does

        this cell own", so plain/constant secretion has no pixels to write.

        '
    boundary_pixel_tracker:
      role: 'enable/disable the BoundaryPixelTracker dependency = the per-cell BOUNDARY-pixel index.

        Required for SecretionOnContact (which acts only on contact/boundary sites); disabling

        it removes on-contact capability.

        '
    field_specs (SecretionField, one per chemical field):
      field_name:
        role: field_identifier -- names the concentration field (owned by a PDE solver) to write.
      frequency:
        role: 'secretion_repeat_count (XML ExtraTimesPerMC) -- how many extra times per MCS the

          secretion is applied; effective per-step rate is multiplied by this. Must be >= 1

          (check_dict fails when frequency < 1).

          '
      param_specs (SecretionParameters, one per cell type):
        cell_type:
          role: source_cell_type -- which type's sites secrete/pin.
        value:
          role: secretion_rate_or_pinned_concentration (rate if additive, level if constant).
        constant:
          role: mode_flag -- if true, OVERWRITE mode (Dirichlet ConstantConcentration) instead of additive;
            mutually exclusive with contact_type.
        contact_type:
          role: 'heterotypic_contact_target -- if set, restrict secretion to boundary sites touching

            this other type (SecretionOnContact); mutually exclusive with constant.

            '
  state_io:
    reads:
    - cell field sigma(x) -- lattice site -> cell id -> cell type (to select which sites secrete)
    - PixelTracker / BoundaryPixelTracker pixel-membership indices (interior and boundary sites of each
      cell)
    - the concentration field phi (read-modify-write for additive/on-contact modes)
    - site neighbourhood (for on-contact: the types of neighbouring sites)
    writes:
    - 'the concentration field phi at cell-occupied sites (+= rate, or = constant). This is a genuine
      field WRITE -- unlike most CC3D plugins, Secretion is NOT an energy term: it mutates the PDE field
      directly, once per MCS, rather than returning an accept/reject energy delta. (The Python scripting
      counterpart SecretionBasePy sets runBeforeMCS=1, i.e. secretion is applied before the pixel-copy
      sweep; the compiled SecretionPlugin lives in libCC3DSecretion.so and I could not read its intra-MCS
      ordering relative to the diffusion solve from Python -- see surprises.)'
  surprises:
  - 'Secretion does NOT diffuse or transport anything. It is only a source (or clamp) term;

    the actual spatial spread is done by a separate PDE/diffusion solver on the same

    field_name. A reimplementer who folds "secretion" and "diffusion" into one op is wrong.

    '
  - '`value` overloads meaning by mode: it is a per-step RATE for Secretion/SecretionOnContact

    (additive) but an absolute CONCENTRATION for ConstantConcentration (overwrite). The same

    number does different things depending on the `constant` flag.

    '
  - 'ConstantConcentration is a Dirichlet clamp: it OVERWRITES phi at the cell''s sites every

    step, so it also acts as a sink/ceiling, not just a source. constant and contact_type are

    mutually exclusive -- constructing with both raises SpecValueError.

    '
  - 'ExtraTimesPerMC (frequency) silently multiplies the effective rate: frequency=3 applies

    the write three extra times per MCS. Easy to miss; not a schedule of distinct events.

    '
  - 'Depends on PixelTracker (interior sites) and BoundaryPixelTracker (boundary sites);

    on-contact secretion is impossible without the boundary tracker. Disabling a tracker is

    allowed but quietly removes the pixel set the write iterates over.

    '
  - 'The same physics can be declared TWO ways with identical effect: as this standalone

    Secretion Plugin, or inline as <SecretionData> inside a DiffusionField block of the PDE

    solver (see the amoebae_2D test XML). Two spec surfaces, one mechanism.

    '
  - 'A duplicate SecretionParameters for the same cell_type with no contact_type raises

    (params_append guard) -- one additive rate per (field, type), but multiple distinct

    contact_type entries for a type are allowed.

    '
  - 'The declarative XML plugin is a STRICT SUBSET of the compiled FieldSecretor API. from_xml (PyCoreSpecs.py:L4435-L4451)
    maps only three element names -- Secretion, ConstantConcentration, SecretionOnContact -- onto the
    three INSIDE-cell secretion variants. But FieldSecretor (cpp/CompuCell.py:L9082) also exposes: UPTAKE
    variants (uptakeInsideCell*, a SINK that subtracts, with absolute/relative-to-max forms), OUTSIDE-cell
    secretion at the boundary (secreteOutsideCellAtBoundary, writing the MEDIUM sites just outside the
    cell), and COM-only secretion (secreteInsideCellAtCOM, a single point source at the centre of mass).
    None of these are reachable from the Secretion plugin/XML -- they are Python-scripting-only. A reimplementer
    treating this plugin as the whole of CC3D "secretion" would miss the sink, the exterior source, and
    the point source.'
  - Intra-MCS ordering of the compiled plugin is NOT establishable from the Python layer. The physics
    is in libCC3DSecretion.so; whether the write lands before or after the diffusion solver steps the
    field within a single MCS, and whether it reads/writes the old or new field buffer, is invisible here.
    The Python steppable SecretionBasePy uses runBeforeMCS=1 (before the pixel-copy sweep) but that is
    a different code path and is only a hint, not proof, for the plugin. No evidence run exists for this
    mechanism, so additive-vs-overwrite, rate-vs-level, and the neighbour-iteration order for on-contact
    are inferred from method names + the amoebae_2D test XML, not verified by measurement.
  - 'Zero is a no-op guard, not a clamp-to-zero. The GPU secrete kernels wrap every mode in

    if (value) { ... } (DiffusionKernel.cl:L216,L262,L314), so an EXACT 0.0 is SKIPPED --

    constant-mode value=0 does NOT pin the field to zero, it does nothing that step. Verified

    in the OpenCL path; assumed (not disassembled) to mirror the standalone plugin.

    '
  - 'Volumetric source, not per-cell. Plain/constant modes write EVERY lattice site the cell owns,

    so total injected (or clamped) mass scales with cell VOLUME -- a large cell secretes

    proportionally more, coupling secretion output to the volume/growth machinery implicitly. It

    is a per-site term, not one deposit per cell.

    '
  verdict: refinement
  of: deposit
  implementation_of: deposit
  why: "WHAT IT IS. Strip the plumbing and Secretion is the registered `deposit` contract: a\nset->field\
    \ scatter in which a cell adds to a scalar concentration field at the lattice\nsites it owns (plain\
    \ Secretion: phi(x) += s_T for x in cell). deposit's own biology is\nstigmergy -- an ant depositing\
    \ pheromone into the field at its position (deposit.py\nREFERENCE = Grasse 1959); a cell secreting\
    \ a chemical into a co-registered field at its\npixels is the same verb. The transport/spread is NOT\
    \ part of this mechanism (that is the\nseparate `diffuse` solver on the same field), so there is no\
    \ composite here as there was\nin the sibling DiffusionSolverFE entry -- the standalone Secretion\
    \ plugin is deposit and\nonly deposit, in its plain mode.\n\nWHY REFINEMENT AND NOT ALIAS. Plain additive\
    \ Secretion alone would be a clean alias\n(implementation) of deposit. But the plugin is ONE mechanism\
    \ with THREE modes, and two of\nthem cannot be routed through `deposit` as registered:\n(1) ConstantConcentration\
    \ OVERWRITES: phi(x) := k_T, a Dirichlet clamp re-pinned every\n    step. deposit only ADDS -- its\
    \ forward() does fld.grid.index_add_(...) then\n    clamp_(max=1.0); it has no set/overwrite path\
    \ and no way to pin a value (it would also\n    wrongly cap at 1.0). Admitting ConstantConcentration\
    \ requires widening deposit with a\n    param `mode: add|set` (default add). What this BREAKS for\
    \ existing users: the WRITES\n    obligation grows -- an implementation can no longer be a bare index_add_\
    \ scatter; it\n    must branch on mode and, in set-mode, assign (clamp being inappropriate for an\
    \ absolute\n    pin). The stigmergy min(1, c+amt) clamp is specific to add-mode and cannot apply to\
    \ a\n    set-mode pin.\n(2) SecretionOnContact restricts the write to a cell's BOUNDARY sites that\
    \ touch a named\n    OTHER cell type: phi(x) += r_{T,U} only for x in boundary(c) with a neighbour\
    \ of type U.\n    deposit writes unconditionally at every agent pixel; it reads only `pos`. Admitting\n\
    \    on-contact requires deposit to gain (a) an optional write-domain restriction to\n    boundary\
    \ sites, and (b) a neighbour-TYPE predicate -- so its `reads` must widen to\n    include the boundary-pixel\
    \ index and the neighbouring sites' cell types (the set-\n    membership lattice). This BREAKS the\
    \ \"reads: [pos]\" minimal signature and the \"one\n    pixel per point-agent\" assumption baked into\
    \ deposit's shader.\nBoth widenings are the same shape: deposit's write, currently an unconditional\
    \ additive\nscatter at a point-agent's single pixel, must become a mode-selectable (add|set), optionally\n\
    domain-restricted (interior | boundary-on-heterotypic-contact) write over a cell's pixel\nSET. I elect\
    \ the mode/domain widening as the primary refinement; I do NOT split the entry.\n\nA REPRESENTATION\
    \ NOTE (not itself a widening). deposit's `set: cell` already permits a cell,\nbut its implementation\
    \ treats an agent as a POINT (writes at `pos`, one pixel). CC3D cells\nare pixel-SETS, so plain/constant\
    \ Secretion writes EVERY owned site and total injected mass\nscales with cell VOLUME. This is the\
    \ set-vs-point primitive gap this campaign keeps meeting,\nnot a new contract field: deposit's `set`\
    \ primitive would carry the pixel membership; the\ncontract signature is unchanged by it. I record\
    \ it because a reimplementer folding CC3D\nsecretion into a point-source deposit would lose the volume\
    \ coupling.\n\nCLOSEST-CONTRACT / not-new argument. This is emphatically not `new`: deposit covers\
    \ the\nsource biology exactly, needing only the mode/domain widening. Calling it `new` would\ndouble-count\
    \ a verb the language already has. Nor is it a fresh sighting of a jax-morph\nproposal: jax-morph's\
    \ `morphogen` may name a secrete-and-diffuse bundle, but the registered\n`deposit` is the tighter,\
    \ source-only anchor and is what this plugin actually is, so\nimplementation_of points at deposit,\
    \ not morphogen. (The uptake/outside-cell/COM-source\nFieldSecretor variants noted in surprises are\
    \ NOT reachable from this XML plugin; a SINK\nwould be `deposit` with a negative amount or a distinct\
    \ uptake verb, but it is out of scope\nfor the declarative Secretion surface inspected here.)\n"
  contract:
    name: deposit
    kind: exchange
    family: fields
    set: cell
    inputs:
    - cell
    outputs: []
    reads:
    - the cell-id / cell-type lattice sigma(x), to select which sites (owned by a named type) secrete
    - the per-cell interior pixel-membership index (PixelTracker) -- the sites a cell owns and writes
      at; volumetric, not a single point
    - the scalar concentration field phi (read-modify-write in additive and on-contact modes)
    - 'REFINEMENT (for SecretionOnContact only): the per-cell BOUNDARY pixel index (BoundaryPixelTracker)
      and the cell types of neighbouring sites -- deposit as registered reads only pos and never a neighbour-type
      predicate'
    writes:
    - the concentration field phi at the cell's owned sites -- += rate (plain / on-contact) or := level
      (ConstantConcentration, a Dirichlet clamp). A genuine field write, not an energy delta; deposit
      returns {} (no integrable set-state output)
    maps:
    - field
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
