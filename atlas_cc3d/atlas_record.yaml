- id: contactinternal
  order: 10
  raw_name: ContactInternal
  raw_kind: Plugin (ContactInternalPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L3350
  paper_section: 'CC3D Reference Manual, "Compartmentalized Cells (ContactInternal Plugin)"

    (compucell3dreferencemanual.readthedocs.io/en/latest/compartments.html), the checkable

    anchor I actually read; underlying adhesion Hamiltonian in Swat et al. (2012) Methods Cell

    Biol 110:325-366. NO extracted paper text is available for this target, so the

    ContactInternal-specific behavior below is anchored to the source + reference manual, NOT to

    a paper page number.

    '
  summary: 'A Cellular-Potts adhesion ENERGY TERM (an EnergyFunction), not a state update, for

    compartmentalized cells. At every lattice boundary between two DIFFERENT sub-cells that share

    the SAME cluster id (i.e. two compartments of one composite cell), it contributes a contact

    energy J_int(type_i, type_j). It is the intra-cluster complement of the ordinary Contact

    plugin, and is typically run alongside it. It writes no state: the engine calls

    changeEnergy() for a proposed pixel copy and gets back a scalar delta-E that only biases the

    Metropolis acceptance probability. In the source it is a one-line subclass

    (ContactInternalPlugin -> ContactLocalFlexPlugin -> ContactPlugin) whose only addition over

    the base Contact energy is the same-cluster restriction; all tunables are inherited unchanged.

    '
  equations: "ContactInternal is a Potts EnergyFunction (an additive term of the effective Hamiltonian),\n\
    not an update that writes state. Conceptually it adds an intra-cluster adhesion energy:\n\n  E_internal\
    \ = SUM over neighbor-pixel pairs (i,j) of\n                 J_int( tau(sigma_i), tau(sigma_j) )\n\
    \                 * [ 1 - delta(sigma_i, sigma_j) ]          # different cells only\n            \
    \     * [ clusterId(sigma_i) == clusterId(sigma_j) ]   # same cluster only\n                 * w(d_ij)\
    \                                   # optional distance weight\n\nSymbols: sigma_k = id of the cell\
    \ owning pixel k; tau(sigma) = cell type of that cell;\nclusterId(sigma) = compartment/cluster id\
    \ of that cell; delta = Kronecker delta (=1 iff the\ntwo pixels belong to the SAME cell, so a cell's\
    \ own interior boundary contributes 0);\nJ_int = the symmetric per-type-pair internal contact-energy\
    \ matrix (the <Energy Type1 Type2>\nentries); w(d_ij) = 1 normally, or 1/d_ij when WeightEnergyByDistance\
    \ is set. Medium (null\ncell / clusterId 0) never satisfies the same-cluster test, so it contributes\
    \ 0.\n\nWhat the code actually computes (confirmed by the .so symbols changeEnergy(Point3D, CellG*,\n\
    CellG*), internalEnergy(CellG*, CellG*), setContactInternalEnergy(str,str,double),\ngetMaxNeighborIndexFromNeighborOrder\
    \ / getMaxNeighborIndexFromDepth, Potts3D::getCellFieldG)\nis the DELTA for a proposed pixel copy\
    \ at point pt from oldCell to newCell:\n\n  delta_E = SUM over n in neighbors(pt) within range of\n\
    \              internalEnergy(newCell, cell_n) - internalEnergy(oldCell, cell_n)\n\nwhere internalEnergy(a,\
    \ b) = J_int(tau_a, tau_b) if a != b AND clusterId(a)==clusterId(b)\nAND neither is Medium, else 0.\
    \ delta_E enters the Metropolis rule: accept with prob 1 if\ndelta_E <= 0, else exp(-delta_E / T).\
    \ Nothing on the lattice or on any cell is written.\n\nInteraction range = neighbor shells up to NeighborOrder,\
    \ OR a Euclidean radius Depth when\nDepth is given (Depth overrides NeighborOrder).\n\nNOTE ON EVIDENCE:\
    \ the .cpp (build path CompuCell3D/plugins/ContactInternal/\nContactInternalPlugin.cpp) is NOT on\
    \ disk -- only the compiled .so. The same-cluster guard\nand the delta form above are read from the\
    \ Python class chain in code_path, the .so symbol\ntable, the .so's own embedded description string\
    \ (\"Handles internal adhesion energy between\nmembers of the same cluster (i.e. between compartments)\"\
    ), the reference manual, and the\nexample XML -- not from a line-by-line reading of the C++ energy\
    \ loop.\n"
  params:
    neighbor_order: 'interaction_range, in lattice neighbor shells (int, default 1). Sets how many rings
      of

      neighbor pixels around the change point are summed. Superseded by depth when depth is set.

      '
    depth: 'interaction_range, as a Euclidean radius (float, default null/None). When set it overrides

      neighbor_order; the range comes from getMaxNeighborIndexFromDepth.

      '
    weight_energy_by_distance: 'distance_weighting_flag (bool, default False). When True, each neighbor
      pair''s energy is

      divided by the inter-pixel distance, down-weighting farther shells. Inherited from Contact.

      '
    energy: 'adhesion_energy coefficient J_int for one unordered cell-type pair, supplied per pair via

      ContactEnergyParameter(type_1, type_2, energy). Units of Potts energy; negative = adhesion

      (lower boundary cost), positive = repulsion. Only one triangle of the matrix is stored, so

      lookup must be symmetrized (see surprises).

      '
    type_1: 'identity label (not a tunable): first cell-type name of the pair the energy applies to.

      '
    type_2: 'identity label (not a tunable): second cell-type name of the pair the energy applies to.

      '
  state_io:
    reads:
    - cell.type (tau) of the source pixel's cell and of each neighbor cell -- indexes J_int
    - cell.id (sigma) of both cells, to evaluate the different-cell guard delta(sigma_i,sigma_j)
    - cell.clusterId of both cells -- the same-cluster guard; the defining read of this plugin
    - the lattice cell field (Potts3D::getCellFieldG) and neighbor geometry (BoundaryStrategy)
    - the proposed flip at the change point -- newCell (candidate) and oldCell (current)
    - the internal-energy matrix J_int (a plugin parameter, not lattice state)
    writes:
    - NONE. ContactInternal is a Potts EnergyFunction; changeEnergy() returns a scalar delta-E
    - that only biases Metropolis acceptance. It mutates no cell attribute and no field.
    - (Per loop rule 8, this is an energy term, not an update -- forcing it into write language
    - would misrepresent it.)
  surprises:
  - 'Writes nothing. A reimplementer expecting a read/modify/write step will build the wrong

    thing: this returns a delta-E that only changes the ACCEPTANCE PROBABILITY of a proposed

    pixel copy. It has no effect except through the Metropolis rule with temperature T.

    '
  - 'The energy fires ONLY between DIFFERENT cells in the SAME cluster. It is silently zero for

    same-cell interior boundaries, for cross-cluster boundaries, and for any pair touching

    Medium. This same-cluster restriction is the entire difference from the ordinary Contact

    plugin -- the Python class adds literally nothing else (just name/registered_name).

    '
  - 'ContactInternal is ADDITIVE with, not a replacement for, the Contact plugin: real decks run

    both (see the example XML with a <Contact> and a <ContactInternal> block). Contact keys off

    cell id only and does not check clusterId, so an intra-cluster boundary is scored by BOTH

    terms (J_contact + J_int). A reimplementer who assumes ContactInternal supersedes Contact

    inside a cluster will double-remove or mis-total the intra-cluster adhesion. (I did not read

    Contact''s C++ changeEnergy line-by-line to confirm it ignores clusterId -- verify before

    relying on the additive claim.)

    '
  - 'The J matrix is symmetric and order-independent, but only ONE triangle is stored:

    param_append raises if (t1,t2) OR (t2,t1) is already present (types_specified checks both

    directions). Lookup must be symmetrized; iterating the stored dict alone misses the mirror

    entries.

    '
  - 'Depth (a Euclidean radius, float) SILENTLY OVERRIDES NeighborOrder (integer shells) when

    both are provided -- confirmed at source in the inherited ContactPlugin.xml (PyCoreSpecs.py

    L3217-3220): it emits <Depth> if depth is not None and only ELSE emits <NeighborOrder>, so a

    set depth silently drops the neighbor_order. Two different notions of "range" with an

    undocumented precedence.

    '
  - 'WeightEnergyByDistance changes the effective magnitude of every J_int by dividing each pair

    by its inter-pixel distance, so the same numeric energy means different physics at different

    neighbor orders. Off by default.

    '
  - 'The plugin does nothing without the compartment machinery: sub-cells must be given matching

    clusterId values via Python steppables ("Cluster Id" / "Cluster Id Reassignment"). With no

    clusters assigned, every same-cluster test is trivially satisfied only within a single cell

    (which is excluded anyway), so E_internal is identically 0. The energy matrix alone is inert.

    '
  - 'Its immediate parent is NOT the plain Contact plugin but ContactLocalFlexPlugin

    (PyCoreSpecs.py L3339-3347: `class ContactLocalFlexPlugin(ContactPlugin, _PyCoreSteerableInterface)`,

    docstring "A steerable version of ContactPlugin"). So ContactInternal silently inherits

    STEERABILITY: the J_int matrix can be rewritten at runtime by a Python steppable, not only

    fixed at setup. A reimplementer treating J_int as a static per-run constant (as the base

    Contact energy would suggest) misses that the coefficients this energy reads may change

    between Monte-Carlo steps -- confirmed at source by the class chain, not by exercising a steer.'
  status: normalized
  module: null
  test: null
  verdict: new
  of: null
  implementation_of: adhere
  why: "A FOURTH sighting of `adhere`, first proposed from the jax-morph atlas (2nd here from\nAdhesionFlex,\
    \ 3rd from its parent ContactLocalFlex); it is NOT among the 52 promoted\ncontracts, so measured against\
    \ the FROZEN baseline the verdict is `new`.\nimplementation_of is set to `adhere` so the ledger counts\
    \ the contract ONCE across\nrepositories rather than re-introducing it here.\n\nContactInternal is\
    \ a differential-adhesion energy: the biology is \"cells of given types\npay a type-pair-specific\
    \ boundary cost where they touch\", which is exactly what an\nadhesion contract expresses. Its one\
    \ distinguishing feature over the base Contact energy\nis a same-clusterId gate, so it scores only\
    \ boundaries BETWEEN COMPARTMENTS of one\ncomposite cell -- intra-cluster differential adhesion. That\
    \ is a restriction on WHICH\nboundaries the same `adhere` term sums over, not a new biological verb,\
    \ so it is an\nimplementation of `adhere`, not a distinct contract.\n\nClosest REGISTERED contracts\
    \ and why none is widened here:\n- cohesion / attraction_repulsion / separation / stillinger_weber\
    \ / squared_law are\n  pair potentials over POINT particles separated by a distance r; they output\
    \ a force\n  from a smooth radial law. ContactInternal has no r-dependence in the core term (a flat\n\
    \  per-type-pair J at a lattice contact), operates on cells-as-site-sets not points, and\n  outputs\
    \ an energy delta that biases Metropolis acceptance rather than a force the\n  engine integrates.\
    \ Widening any of them to admit a surface-contact adhesion matrix\n  over compartmentalized Potts\
    \ cells would do violence to their point-particle,\n  force-returning biology -- it would no longer\
    \ be one recognizable law.\n- `adhere` (jax-morph, unpromoted) is the honest home: it already names\
    \ the differential\n  boundary-adhesion verb without committing to the point-particle radial form.\n\
    \nCAVEAT: this maps a Potts ENERGY TERM (returns delta-E, writes nothing) onto a contract\nwhose Plexus\
    \ implementations return an integrable force -- the very gap loop rule 8\nflags. Whether `adhere`\
    \ can honestly host BOTH a force-returning and an\nenergy-term implementation, or must itself widen,\
    \ is a real open question this sighting\nraises; recorded here rather than papered over. This is not\
    \ unique to ContactInternal:\nit is the SAME return-type gap every Potts adhesion energy in this atlas\
    \ (Contact,\nContactLocalFlex, AdhesionFlex) surfaces, so it is a property of the Cellular-Potts\n\
    target, not of this one plugin.\n"
  contract:
    name: adhere
    kind: lateral
    family: interaction
    set: cell
    inputs:
    - cell
    outputs:
    - contact_energy (a scalar dE contribution to the Metropolis acceptance of a proposed pixel copy;
      NOT a cell state and NOT a force -- this operator writes nothing back to the lattice)
    reads:
    - cell_id (sigma at each of two neighbouring lattice sites, to keep only cross-boundary pairs via
      1-delta)
    - cell_type (tau of each owner; indexes the per-type-pair internal-adhesion matrix J_int)
    - cluster_id (the same-cluster guard; the DEFINING read -- energy fires only when the two owners share
      a clusterId, i.e. are compartments of the same composite cell)
    - internal_adhesion_matrix (J_int, the per-type-pair energy coefficients; symmetric, one triangle
      stored, lookup symmetrized)
    - neighbour shells (site pairs within neighbor_order adjacency, or a Euclidean depth radius that overrides
      it)
    writes:
    - nothing to the lattice (energy term). changeEnergy() returns a scalar dE that only biases Metropolis
      acceptance; no cell attribute and no field is mutated.
    maps:
    - a cell is a SET of lattice sites sharing an id; internal adhesion energy is summed over neighbouring
      cross-boundary site pairs whose owners DIFFER but share a clusterId
    - per boundary pair, energy = J_int(tau_i, tau_j) gated by different-cell AND same-clusterId AND non-Medium;
      negative J is adhesive (lowers boundary cost), positive is repulsive
    - additive with the plain Contact term (both score an intra-cluster boundary), so this realises intra-compartment
      differential adhesion / compartment sorting within one cell
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: contactlocalflex
  order: 11
  raw_name: ContactLocalFlex
  raw_kind: Plugin (ContactLocalFlexPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L3339
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366, contact/adhesion energy term

    (the boundary-energy sum J(tau,tau'')(1-delta)). NOTE: no paper text is available in

    this environment, so no page/eq number is verified. Checkable source anchors:

    PyCoreSpecs.py:L3339 (class docstring "A steerable version of ContactPlugin");

    parent ContactPlugin at L3141; C++ doc cpp/CompuCell/plugins/ContactLocalFlexPlugin.rst;

    compiled classes in cpp/CompuCell.py L6379-6591.

    '
  summary: 'A steerable, per-cell variant of the Contact adhesion plugin. It contributes the

    standard Potts boundary/adhesion energy to the Metropolis acceptance of a proposed

    pixel copy, but the pairwise contact energy J is not read from a static cell-TYPE

    matrix -- it is stored on EACH CELL as an attribute (a ContactLocalFlexDataContainer

    holding per-neighbour J values plus a local default-energy table). The type-pair

    energies given in the spec seed those per-cell defaults; setContactEnergy() can then

    override J for an individual cell (or cell-cell pair) at runtime, so adhesion is

    locally adjustable/"flexible" and steerable while the simulation runs. Writes no

    lattice state; as a change-watcher it maintains the per-cell contact data as pixels flip.

    '
  equations: "Contact (boundary) energy, summed over neighbouring lattice-site pairs within the\ninteraction\
    \ range:\n\n    E_contact = sum over neighbour pairs (i,j) of  J(sigma_i, sigma_j) * (1 - delta(sigma_i,\
    \ sigma_j))\n\nwhere\n  sigma_i        = cell id occupying site i,\n  delta(a,b)     = Kronecker delta\
    \ (1 if same cell id, else 0) -- so only pairs\n                   straddling a cell boundary contribute,\n\
    \  neighbour pairs = sites j within neighbor_order (adjacency shell) or, if depth is\n           \
    \        set, within Euclidean distance depth of site i,\n  J(sigma_i,sigma_j) = contact energy for\
    \ that specific pair.\n\nDifference from plain Contact (this is the whole point of \"LocalFlex\"):\n\
    \  plain Contact:  J = J_matrix[type(sigma_i)][type(sigma_j)]   (global TYPE-pair table)\n  ContactLocalFlex:\
    \ J = contactEnergy(sigma_i, sigma_j), looked up from cell sigma_i's\n                    per-cell\
    \ ContactLocalFlexDataContainer -- its per-neighbour map,\n                    falling back to that\
    \ cell's localDefaultContactEnergies (seeded from\n                    the spec's type-pair energies).\
    \ Modifiable per cell at runtime.\n\nIf weight_energy_by_distance is set, each pair term is divided\
    \ by the site-site\ndistance d(i,j) so more distant neighbours in higher-order shells contribute less.\n\
    \nchangeEnergy() returns the delta:  dE = E_contact(after copy) - E_contact(before copy).\nThe proposed\
    \ copy is accepted with probability 1 if dE <= 0, else exp(-dE / T).\n"
  params:
    neighbor_order:
      role: interaction_range (integer adjacency shell; how many rings of lattice neighbours the boundary-energy
        sum reaches over; 1 = nearest neighbours)
    depth:
      role: interaction_range (continuous alternative -- max Euclidean neighbour distance; when set it
        overrides neighbor_order in the emitted CC3DML)
    weight_energy_by_distance:
      role: distance_weighting flag (divide each neighbour-pair energy by site-site distance so farther
        neighbours contribute less)
    ContactEnergyParameter(type_1, type_2, energy):
      role: adhesion_energy per cell-type pair -- these values SEED the per-cell default contact-energy
        table (localDefaultContactEnergies) that the local per-cell J's start from; higher J = weaker
        adhesion / higher boundary cost
  state_io:
    reads: "- the cell-id lattice sigma (to identify each site's owning cell and evaluate delta)\n- each\
      \ cell's ContactLocalFlexDataContainer extra-attribute: contactDataContainer\n  (per-neighbour-cell\
      \ J values) and localDefaultContactEnergies (per-type default J),\n  accessed via the contactlocalflex\
      \ container accessor\n- neighbour lattice sites within neighbor_order / depth\n- Potts temperature\
      \ T (for the acceptance function, applied by the engine)\n"
    writes: "- NO lattice/cell state. This is an ENERGY TERM: changeEnergy() returns a scalar dE\n  that\
      \ only changes the probability the engine accepts a proposed pixel copy.\n- side channel: as a CellGChangeWatcher\
      \ it maintains its own per-cell contact-data\n  bookkeeping when pixels flip; setContactEnergy()/steering\
      \ writes per-cell (or\n  per-pair) J into that container -- state internal to the plugin, not a\
      \ field others read.\n"
  surprises:
  - 'It is NOT a new mechanism: the energy functional is identical to plain Contact. The

    only difference is WHERE J lives -- a per-cell attribute instead of a global

    type-pair matrix -- which makes adhesion individually settable and runtime-steerable.

    A reimplementer who copies Contact will get the same equation but miss the per-cell

    storage and the setContactEnergy() runtime override that is the entire purpose.

    '
  - 'The Python spec (PyCoreSpecs.py) is a bare subclass of ContactPlugin with ZERO extra

    fields -- same __init__, same xml, same ContactEnergyParameter entries. The type-pair

    energies you pass are therefore only INITIAL DEFAULTS; nothing in the Python API sets

    a per-cell J. The local override lives entirely in the C++ core (setContactEnergy)

    and must be driven from a steppable, so the "flex" is invisible if you read only the spec.

    Even _PyCoreSteerableInterface is redundant here: ContactPlugin (L3141) already

    inherits it, so at the Python-spec level ONLY name/registered_name

    ("contact_local_flex"/"ContactLocalFlex") distinguish this from plain Contact; the

    registered_name is what binds it to the different C++ plugin that stores per-cell J.

    '
  - 'ContactInternal (PyCoreSpecs.py:L3350) subclasses ContactLocalFlexPlugin (L3339), NOT

    ContactPlugin -- so it INHERITS the per-cell-J storage and steerability verbatim and

    changes ONLY registered_name. It applies the identical per-cell contact energy but

    between COMPARTMENTS of a single cluster cell rather than between whole cells; i.e.

    ContactInternal is LocalFlex restricted to intra-cluster boundaries, not a Contact variant.

    '
  - 'delta(sigma_i, sigma_j) uses cell IDS, not types: two adjacent cells of the same type

    still incur boundary energy (they are different ids). Only sites inside one cell cancel.

    '
  - 'weight_energy_by_distance only matters for neighbor_order > 1 / depth > 1; at nearest-

    neighbour range every pair is at the same distance and the flag is a no-op.

    '
  - 'The base class in the compiled core is CellGChangeWatcher (cpp/CompuCell.py:L6543),

    not a plain energy function -- ordering matters: the per-cell contact-data container

    must be kept in sync as pixels flip, so this plugin both watches changes AND scores

    energy. No standalone ablation run exists for it (contact_adhesion evidence covers the

    plain Contact energy; the LocalFlex per-cell behaviour is unmeasured here).

    '
  status: normalized
  module: null
  test: null
  verdict: new
  of: null
  implementation_of: adhere
  why: '`new` against the FROZEN baseline (no registered contract covers cell-cell contact/adhesion

    energy in a Cellular Potts model), and `implementation_of: adhere` -- a THIRD SIGHTING of

    `adhere`, the pure-adhesion contract first PROPOSED by the jax-morph atlas (still unpromoted,

    so not in the frozen 42/52) and already logged in this CC3D atlas from AdhesionFlex. Setting

    implementation_of lets the ledger count `adhere` ONCE across repositories; without it the

    saturation curve double-counts and measures our naming habits, not the language.


    WHAT IT IS. ContactLocalFlex contributes the standard Cellular Potts boundary/adhesion energy

    E = sum over cross-boundary site pairs of J(sigma_i, sigma_j)(1 - delta) -- the SAME functional

    as plain Contact, which is the canonical `adhere` implementation (a static J(type,type'') table).

    Biologically that boundary-energy term IS differential adhesion: higher J = higher boundary cost

    = weaker adhesion, and type-dependent J drives cell sorting. That is `adhere`''s content exactly.


    WHAT MAKES IT ITS OWN IMPLEMENTATION, NOT A DUPLICATE OF Contact. The single difference is WHERE

    J lives: not a global type-pair matrix but a per-cell attribute (a ContactLocalFlexDataContainer

    holding per-neighbour J values plus a localDefaultContactEnergies table, seeded from the spec''s

    type-pair energies). setContactEnergy() can override an individual cell''s (or pair''s) J at

    runtime, so adhesion is locally steerable. This is the SAME per-cell-state generalisation move as

    AdhesionFlex -- but ContactLocalFlex keeps the plain scalar-J energy (one J per pair) rather than

    AdhesionFlex''s molecule-density double sum. All three (Contact, ContactLocalFlex, AdhesionFlex)

    are interchangeable implementations of `adhere`; that Plexus''s registry hosts several

    implementations per contract is the expected shape, not a disappointment.


    WHY NOT alias/refinement of a REGISTERED contract. The closest registered contracts are the

    lateral/interaction pair rules `cohesion` and `attraction_repulsion`. Both EMIT a force

    (`acceleration`) on a point particle and WRITE `position` after the engine integrates it.

    ContactLocalFlex writes NOTHING: changeEnergy() returns a scalar dE that only biases which

    proposed pixel-copy the Metropolis engine accepts (rule 8). Its `set` is a cell that IS a set of

    lattice sites, its interaction is counted over shared BOUNDARY site-pairs (not centre distance),

    and it has no repulsive core (excluded volume is CompuCell3D''s separate Volume constraint). To

    host it, cohesion/attraction_repulsion would have to swap output type (energy bias, not force),

    set representation (site-set, boundary counting), and drop position writes -- replacing the

    contract''s semantics, i.e. violence, not a costed widening. And unlike Morse (which maps to

    `attraction_repulsion` because it carries BOTH an excluded-volume core and an adhesive tail),

    this term carries ONLY adhesion, so it maps to the pure-adhesion contract `adhere`.


    SCOPE / OPEN. The per-cell steerable J and the setContactEnergy() runtime override are an

    implementation freedom below the contract, not a new contract -- the same freedom AdhesionFlex

    exercises with density vectors. weight_energy_by_distance (divide each pair term by site-site

    distance) and neighbor_order/depth (interaction range) are likewise implementation parameters of

    the same energy. The (1-delta) restriction is over cell IDs, so same-type neighbouring cells

    still contribute. No standalone oracle/ablation run exists for the per-cell LocalFlex behaviour

    (the contact_adhesion evidence covers the plain-Contact energy only).

    '
  contract:
    name: adhere
    kind: lateral
    family: interaction
    set: cell
    inputs:
    - cell
    outputs:
    - contact_energy (a scalar dE contribution to the Metropolis acceptance of a proposed pixel copy;
      NOT a cell state and NOT a force -- this operator writes nothing back to the lattice)
    reads:
    - cell_id (sigma at each of two neighbouring lattice sites, to keep only cross-boundary pairs via
      1-delta)
    - cell_type (seeds each cell's localDefaultContactEnergies table at init)
    - per_cell_contact_J (the per-cell/per-pair adhesion energy attribute -- ContactLocalFlexDataContainer,
      distinct from the output dE; the pairwise J(sigma_i, sigma_j) looked up from cell sigma_i's own
      table rather than a global type matrix, higher J = weaker adhesion, steerable at runtime via setContactEnergy.
      This per-cell J store is exactly what plain Contact lacks and is the sole difference from the canonical
      `adhere` implementation)
    - neighbour shells (site pairs within neighbor_order adjacency, or Euclidean depth if set)
    - distance_weighting (optional -- divide each pair term by site-site distance so farther neighbours
      count less)
    writes:
    - nothing to the lattice (energy term). Side channel only -- the plugin maintains its own per-cell
      contact-data container, into which steppables write per-cell/per-pair J at runtime.
    maps:
    - a cell is a SET of lattice sites sharing an id; adhesion energy is summed over neighbouring cross-boundary
      site pairs (owners differ), so contact area emerges from boundary site counts
    - per boundary pair, energy = J(sigma_i, sigma_j) * (1 - delta(sigma_i, sigma_j)); the SAME functional
      as plain Contact, but J is read from cell sigma_i's per-cell attribute rather than a global type-pair
      matrix, so adhesion is individually settable and runtime-steerable
    - differential adhesion / cell sorting emerges from type- and cell-dependent J; the per-cell J storage
      makes adhesion locally flexible while the simulation runs
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: contact
  order: 12
  raw_name: Contact
  raw_kind: Plugin (ContactPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L3141
  paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366, 'Multi-Scale Modeling of Tissues Using
    CompuCell3D'
  summary: Contact Plugin
  equations: 'E_contact = sum over adjacent site pairs (i,j) with sigma_i != sigma_j of J(tau(sigma_i),
