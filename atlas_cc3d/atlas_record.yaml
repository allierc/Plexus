- id: diffusionsolverfe
  order: 14
  raw_name: DiffusionSolverFE
  raw_kind: Steppable (DiffusionSolverFE)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L6242
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366, sec. "PDE Solvers" (DiffusionSolverFE).

    Checkable in-tree anchor for the algorithm: cc3d/twedit5/Plugins/CC3DProject/diffusion_solvers_descr.py:7

    ("Uses Forward Euler method and handles moving boundary conditions. May be slow for large

    diffusion constants."); FTCS stability limits at CC3DXMLGenerator.py:884.

    '
  summary: 'A steppable that advances one or more scalar concentration FIELDS defined over the CPM

    pixel lattice by one explicit forward-Euler (FTCS) step per Monte Carlo Step: reaction-

    diffusion-decay with a secretion source, cell-type-dependent coefficients, and per-face

    boundary conditions. It is a genuine field->field WRITE (unlike the energy-term plugins in

    this atlas): it overwrites the concentration grid c in place. The physics lives in the

    compiled core; PyCoreSpecs.py only declares the CC3DML the solver reads.

    '
  equations: "Per site i and field, one step (transcribed from the OpenCL uniDiff kernel L954-L1054;\n\
    DeltaX = DeltaT = 1 by default). NN(i) is the diffusion neighbourhood (N sites, set by the\nfield\
    \ NeighborOrder); D_i, lambda_i are the coefficients of the cell type occupying i.\n\n  isoSum_i \
    \ = D_i * ( SUM_{j in NN(i)} c_j^t  -  N * c_i^t ) / 2\n  varSum_i  = ( SUM_{j in NN(i)} D_j * ( c_j^t\
    \ - c_i^t ) ) / 2\n  c_i^{t+1} = (dt / dx^2) * ( isoSum_i + varSum_i )  +  ( 1 - dt*lambda_i ) * c_i^t\
    \   + S_i\n\nThe TWO half-sums (centre-cell D_i, plus each neighbour's own D_j, each /2) are a symmetric\n\
    average of the face flux -- the variable-diffusion scheme, needed when D differs across a\nface. For\
    \ UNIFORM D they recombine exactly to the plain discrete Laplacian:\n  isoSum + varSum = D * ( SUM_j\
    \ c_j - N c_i )\nso  c_i^{t+1} = c_i + (dt/dx^2) D grad^2_discrete c - dt*lambda*c + S = explicit\
    \ FE for\ndc/dt = D grad^2 c - lambda c + S.\n\nSymbols:\n  c_i        concentration at pixel i (a\
    \ field value, not cell state)\n  NN(i)/N    diffusion-neighbour pixels and their count (von Neumann-style;\
    \ 1st shell = 4 in 2D,\n             6 in 3D; widened by the field NeighborOrder)\n  D_i        diffusion\
    \ coefficient at i = diff_types[type(cell at i)] if set, else diff_global\n  lambda_i   decay coefficient\
    \ at i    = decay_types[type(cell at i)] if set, else decay_global\n  S_i        secretion (SEPARATE\
    \ sweep, order-dependent): for a cell of type t occupying i, add\n             value (mode Secretion,\
    \ optional relative/max uptake sink), or CLAMP c_i := value\n             (mode ConstantConcentration\
    \ / Dirichlet, re-pinned each step), or add only when a\n             neighbour site holds a different\
    \ cell id of a named type (SecretionOnContact)\nThis is the SOURCE's method (\"Forward Euler\", FE);\
    \ the continuous PDE is the paper's, the\nper-cell-type D_i/lambda_i, the two-half-sum symmetrisation\
    \ and moving-boundary coupling are\nthe code's realisation.\n"
  params:
    fluc_comp:
      role: mass_conservation_flag -- enable FluctuationCompensator, corrects c when a pixel changes cell
        id so cell moves conserve total field mass
    gpu:
      role: backend_selector -- swaps the registered solver to DiffusionSolverFE_OpenCL; numerics-only,
        no physics change
    diff_global:
      role: diffusion_coefficient (global default D; validated >= 0)
    decay_global:
      role: decay_rate (global default lambda; validated >= 0)
    diff_types:
      role: diffusion_coefficient_by_cell_type -- per-cell-type override D_t, keyed to the CPM cell occupying
        the pixel
    decay_types:
      role: decay_rate_by_cell_type -- per-cell-type override lambda_t
    init_expression:
      role: initial_condition -- muParser math expression evaluated per site at t=0
    init_filename:
      role: initial_condition -- file to load the t=0 field from
    secretion (SecretionParameters cell_type/value/constant/contact_type):
      role: 'source_term -- per-cell-type source: additive rate, Dirichlet-clamp (constant), or on-contact'
    boundary_conditions (x/y/z _min/_max _type + _val):
      role: 'boundary_condition -- per face: Value=Dirichlet (default 0.0, absorbing sink), Flux=Neumann/ConstantDerivative,
        Periodic'
    additional_term:
      role: 'UNKNOWN: reaction_term expression is present in the base spec_dict (line 580) but DiffusionSolverFEDiffusionData.xml
        (L6086) never emits it -- so via THIS python spec it is dead; only the ReactionDiffusion variant
        writes AdditionalTerm (L6773)'
    DeltaX / DeltaT / ExtraTimesPerMCS:
      role: 'UNKNOWN via this API: timestep / grid spacing / sub-cycling count exist in the core CC3DML
        (CC3DXMLGenerator.py:950,991) and set FTCS stability, but DiffusionSolverFE''s python spec exposes
        NO setter -- a tuner using PyCoreSpecs cannot change them; they fall back to core defaults 1.0/1.0/0'
  state_io:
    reads: "- the concentration field c (the grid it advances)\n- the CPM cell-id / cell-type lattice\
      \ at every pixel, to pick D_i and lambda_i and to\n  locate secreting cell interiors -- this is\
      \ the coupling to the Potts, not a field of its own\n- boundary values / initial-condition expression\
      \ or file\n"
    writes: "- the concentration field c, IN PLACE (overwrites the grid each MCS). This is an actual\n\
      \  field write, not an energy delta -- contrast the Potts plugins in this atlas that return\n  nothing\
      \ and only bias pixel-copy acceptance.\n"
  surprises:
  - 'Forward Euler is only conditionally stable: the guide (CC3DXMLGenerator.py:884) flags D > 0.16 (3D)
    or D > 0.25 (2D) at DeltaX=DeltaT=1 as unstable. The core auto/manually sub-cycles via ExtraTimesPerMCS,
    but the DiffusionSolverFE python spec exposes NO way to set it -- so a reimplementer driving from
    PyCoreSpecs gets silent blow-up at high D with no knob to fix it. These thresholds are magic constants.'
  - 'D and lambda are SPATIALLY HETEROGENEOUS, keyed to the moving CPM cell field: diff_types/decay_types
    override the global value per cell type at each pixel. Plexus `diffuse`/`decay` carry a single scalar
    rate -- they have no cell-type-indexed coefficient nor any coupling to a set-membership lattice.'
  - 'Secretion has three DISTINCT semantics under one name: Secretion ADDS a rate, ConstantConcentration
    OVERWRITES (Dirichlet clamp on the cell interior -- a set, not an add), SecretionOnContact adds only
    on heterotypic contact. A reimplementer treating ConstantConcentration as a source would be wrong
    -- it pins the value.'
  - Default boundary condition is Value 0.0 on every face = an ABSORBING sink (Dirichlet), not no-flux.
    Silence here means the field leaks out the walls; Neumann/no-flux must be requested explicitly (Flux
    type).
  - '''Handles moving boundary conditions'' + FluctuationCompensator: because cells move on the CPM lattice
    under the field, a pixel changing cell id would spuriously dilute/concentrate c; the compensator (off
    by default) rescales to conserve mass. Off-by-default means naive runs are NOT mass-conserving under
    motion.'
  - 'The diffusion stencil is written as TWO half-sums (isoSum with the CENTRE cell''s D_i, plus varSum
    with each NEIGHBOUR''s own D_j, each /2), NOT one D*Laplacian. That split is the variable-diffusion
    scheme: it symmetrises the flux across a cell-type interface and only collapses to the familiar D*(SUM
    - N c) when D is spatially uniform. A reimplementer using a single central-D Laplacian gets heterotypic
    diffusion -- the whole point of per-type coefficients -- wrong.'
  - 'I read the OpenCL (GPU) kernel (DiffusionKernel.cl, uniDiff L821-L1057) for the exact arithmetic:
    neighbour loop, the two-half-sum D average, the (1 - dt*lambda) decay factor, and the ghost-cell boundary
    handling. The compiled CPU solver (the gpu=False default) is a .so I could NOT read; the kernel''s
    own comments cross-reference the CPU code and the CC3DML is shared, so I believe the update is identical,
    but I did not verify the CPU path byte-for-byte (cc3d is deliberately not importable here). Note also
    DeltaX/DeltaT are unreachable via PyCoreSpecs, so dt/dx^2 defaults are fixed there.'
  - The class at L6242 is a thin CC3DML EMITTER; every physical parameter lives on the child DiffusionData
    / SecretionData / BoundaryConditions specs (L6070, L6160, L820), and the integrator itself is compiled.
    No update logic is in this file.
  status: normalized
  verdict: refinement
  of: diffuse
  implementation_of: diffuse
  why: 'WHAT IT IS. Strip the plumbing and DiffusionSolverFE is one explicit forward-Euler (FTCS)

    step of dc/dt = D grad^2 c - lambda c + S on a scalar concentration field. The pure

    diffusion core is EXACTLY the registered `diffuse` contract (field->field, one Laplacian

    step, writes the grid in place; diffuse already carries two implementations,

    finite_difference and spectral -- this is a THIRD, the FTCS/forward-Euler scheme on the

    CPM lattice, hence implementation_of: diffuse). The linear -lambda*c term is the registered

    `decay` contract verbatim (c <- c - lambda*dt*c, field->field). The secretion source S is

    the registered `deposit` contract (a set->field scatter: a cell of type t adds a rate into

    the field at its own pixels). So as a whole this mechanism is a COMPOSITE of three existing

    contracts -- in Plexus you would express it as diffuse then decay then deposit on the same

    field. That composability is itself a positive saturation result: CC3D''s flagship PDE

    solver introduces no new biological verb.


    WHY REFINEMENT AND NOT ALIAS. It is not a clean alias because CC3D''s DEFINING capability

    cannot be expressed by `diffuse` as currently registered. `diffuse` binds `rate` to a single

    scalar (self.rate = float(params.get("rate"))) and both its implementations apply a spatially

    UNIFORM coefficient. DiffusionSolverFE''s D_i and lambda_i are SPATIALLY HETEROGENEOUS, read

    per pixel from the moving CPM cell-type lattice (diff_types/decay_types). This is not an

    incidental knob -- the whole two-half-sum "variable diffusion" stencil (isoSum with the

    centre cell''s D_i + varSum with each neighbour''s own D_j, each /2) exists precisely to

    symmetrise flux across a cell-type interface, and it only collapses to diffuse''s central-D

    Laplacian D*(SUM_j c_j - N c_i) when D is uniform. To admit CC3D, `diffuse` must WIDEN its

    `rate` param from scalar to scalar|coefficient-field (PARAM_ROLES rate: diffusion_rate ->

    diffusion_rate_field), and its `reads` gains that coefficient field. What this BREAKS for

    existing users: (a) the numerics obligation -- an implementation given a field-valued rate

    can no longer use a single central-D box-blur; it must use the symmetric face-average

    stencil or it computes heterotypic diffusion wrong, so the finite_difference/spectral

    implementations do not transparently generalise; (b) the spectral implementation cannot

    support a spatially-varying D at all (exp(-D k^2 dt) assumes constant D), so a field-valued

    rate silently narrows the set of valid implementations. `decay` needs the identical widening

    for lambda_i (scalar -> coefficient-field keyed to the cell-type set). Both are the same

    refinement: a field->field operator''s coefficient becoming a set-coupled field.


    A SECOND, SMALLER REFINEMENT the record should note but that I am NOT electing as the primary

    verdict (one contract per entry): per-face BOUNDARY CONDITIONS (Dirichlet Value / Neumann

    Flux / Periodic, per x/y/z min/max) are a field-level concept that neither diffuse nor decay

    currently expresses -- Plexus fields carry only a single `periodic` flag. And the secretion

    ConstantConcentration mode is a genuine gap in `deposit`: deposit ADDS (min(1, c+amt)),

    whereas ConstantConcentration OVERWRITES/CLAMPS c := value on the cell interior (a Dirichlet

    pin, re-applied each step). A reimplementer routing ConstantConcentration through `deposit`

    would be wrong; deposit would need a `mode: add|set` widening to cover it. I flag these here

    rather than splitting the entry.


    CLOSEST-CONTRACT / not-new argument. This is emphatically not `new`: `diffuse` plus `decay`

    plus `deposit` cover the biology (transport, turnover, source) with only the coefficient-

    heterogeneity widening missing. Calling it `new` would double-count a verb the language

    already has. See the sibling ReactionDiffusionSolverFE for the case where the AdditionalTerm

    reaction expression genuinely exceeds this composite.

    '
  contract:
    name: diffuse
    kind: field
    family: fields
    set: field
    inputs:
    - field
    outputs: []
    reads:
    - the scalar concentration field c (the grid advanced in place)
    - 'REFINEMENT: a per-site diffusion coefficient field D_i (and, for the composed decay term, a per-site
      lambda_i), sourced by indexing diff_types/decay_types with the cell type occupying each pixel --
      i.e. the CPM cell-type set lattice, which base diffuse never reads'
    - per-face boundary values and the t=0 initial condition (expression or file)
    writes:
    - the concentration field c, in place (a real field write, not an energy delta)
    maps: []
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: externalpotential
  order: 15
  raw_name: ExternalPotential
  raw_kind: Plugin (ExternalPotentialPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L2874
  paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366, 'Multi-Scale Modeling of Tissues Using
    CompuCell3D'
  summary: 'A constant external body force. Each cell type carries a lambda vector (lambda_x, lambda_y,

    lambda_z); a global lambda (applied to all types) is the fallback. Per attempted pixel copy the

    plugin contributes an energy dE = -lambda . (x_new - x_old), which biases the Metropolis

    acceptance so cells drift along lambda. It writes nothing to the lattice -- a Potts energy term.

    With com_based=False (default) the force is applied per candidate pixel; with com_based=True it

    is evaluated against the cell''s centre of mass, so the whole cell is translated as a rigid drift.

    '
  equations: "dE_ext = -lambda . (x_new - x_old)\n\nlambda        : a constant force vector, either global\
    \ (lambda_x, lambda_y, lambda_z) or per\n                cell type (ExternalPotentialParameter accessed\
    \ by spec.cell_type[name]).\nx_new, x_old  : the pixel gained vs lost by the attempted copy (com_based=False),\
    \ i.e. Delta x\n                is the copy direction; OR the change in the cell's centre of mass\
    \ (com_based=True).\nThe term lowers energy for copies that move a cell down the potential gradient\
    \ (along lambda),\nso a constant lambda produces a persistent directed drift. It returns a scalar\
    \ dE only -- the\nMetropolis engine turns that bias into motion; the plugin writes no cell state.\n"
  params:
    lambda_x: force_x -- global x-component of the external-potential lambda vector (constructor arg).
    lambda_y: force_y -- global y-component of the external-potential lambda vector (constructor arg).
    lambda_z: force_z -- global z-component of the external-potential lambda vector (constructor arg).
    cell_type: 'per-type lambda -- NOT a constructor arg; an ExternalPotentialParameter(cell_type, x,
      y, z)

      appended via param_new / cell_type accessor. Lets each cell type carry its OWN constant force

      vector, so different types drift in different directions -- the differential-force mode.

      '
    com_based: 'algorithm flag (default False). False = apply the force per attempted pixel copy (can
      spread /

      reshape a cell along lambda, not only translate it); True = evaluate against the cell centre of

      mass, translating the whole cell as a rigid drift.

      '
  state_io: "reads: for each attempted pixel copy, the copy direction Delta x = x_new - x_old (or the\
    \ cell\n  centre of mass when com_based), and the lambda vector for the owning cell's type.\nwrites:\
    \ nothing to the lattice -- changeEnergy returns a scalar dE that only biases which\n  proposed pixel\
    \ copy the Metropolis engine accepts (rule 8). A constant body force, not an update.\n"
  surprises:
  - 'Measured ablation: with a driving lambda the population mean x moves 32 -> 57.6, versus 32 -> 32.2

    undriven -- a constant lambda produces a persistent directed drift of the cell centres, exactly a

    body force / sedimentation, not a diffusive wander.

    '
  - 'The force is per-CELL-TYPE: each type carries its own lambda vector (ExternalPotentialParameter),

    so two types can be driven in OPPOSITE directions from one plugin. That differential mode is the

    substance -- a global-only reading (lambda_x/y/z alone) misses that this is the CPM''s native way

    to impose a per-type directed drift.

    '
  - 'com_based toggles WHAT the force acts on: the default (False) biases every candidate pixel, so a

    strong field can spread or reshape a cell as well as move it; True acts on the centre of mass and

    translates the cell rigidly. Plexus''s sediment only ever translates -- the per-pixel spreading of

    the default mode is a shape effect the drift contract does not carry.

    '
  verdict: alias
  of: sediment
  implementation_of: null
  why: '`alias` of the REGISTERED contract `sediment` (lateral/motion): a per-type constant directional

    body force. ExternalPotential''s biology IS sediment''s -- attach a constant force vector to a cell

    type and it drifts persistently along that vector; give two types opposite vectors and they

    settle to opposite poles (the differential-sedimentation / oriented-drift use). sediment''s own

    docstring frames itself as exactly this: "a per-agent constant directional drift ... the

    type-selectable sibling of gravity", instantiated per type via `at: ''agent[type=a]'' gy: -0.1`.

    ExternalPotential''s per-type ExternalPotentialParameter(cell_type, x, y, z) is the same construct;

    its global lambda_x/y/z mode is the degenerate all-types-equal case, which is the REGISTERED

    contract `gravity` (a type-blind uniform body force). So this one CC3D plugin spans the pair that

    Plexus splits into sediment (per-type) and gravity (uniform); I alias it to sediment because

    per-type configurability is the plugin''s defining, non-degenerate capability, and sediment

    subsumes the uniform case as equal params.


    WHAT DIFFERS BETWEEN THE IMPLEMENTATIONS. sediment returns a velocity delta {agent: v} that the

    engine integrates into position; ExternalPotential returns NOTHING -- it is a Potts energy term,

    dE = -lambda . (x_new - x_old), that only biases which proposed pixel copy the Metropolis engine

    accepts (rule 8). Same directed-drift semantics, different mechanics (velocity delta vs

    acceptance-probability bias). Two secondary differences, neither of which changes the contract:

    (1) the lambda vector is 3D and sediment ships gx/gy with SUPPORTED_DIMS [2,3], so 3D is already

    in-signature; (2) com_based=False applies the force PER PIXEL, so a strong field can spread or

    reshape a cell, whereas sediment (and com_based=True) only translate the centre of mass. That

    per-pixel shape effect is an artefact of the CPM''s site-set representation, not a distinct

    biological contract -- the mechanism''s intent and its measured effect (mean-x drift of the cell

    centres) are pure directed body force.


    WHY NOT `new` or `refinement`. Nothing here needs a contract the registered vocabulary lacks: a

    constant per-type directional force is precisely sediment, and its uniform special case is

    gravity -- both already promoted. Refinement is unwarranted because no signature field of sediment

    has to widen to admit this: direction is already a free vector, per-type selection is already the

    intended usage, and 2D/3D is already supported. The only feature outside sediment''s reach is the

    default per-pixel (non-COM) shape spreading, and that is CPM plumbing, not a costed widening of

    the drift contract.

    '
  contract:
    name: sediment
    kind: lateral
    family: motion
    set: cell
    inputs:
    - cell (selected by type, so each type may carry its own lambda vector)
    outputs:
    - directed_drift (a constant directional body force along lambda; realised in CC3D as a scalar dE
      contribution to Metropolis acceptance, NOT a written cell state and NOT engine-integrated here)
    reads:
    - copy_direction (Delta x = x_new - x_old of the attempted pixel copy; or the cell centre of mass
      when com_based=True)
    - cell_type (selects which lambda vector applies)
    - lambda (the constant force vector, global or per type; may point any direction in 2D/3D)
    writes:
    - nothing to the lattice (energy term); the directed drift emerges from biased pixel-copy acceptance
    maps:
    - a cell is a SET of lattice sites sharing an id; a constant lambda lowers the energy of copies that
      advance the cell along lambda, so the cell centre of mass drifts persistently in that direction
    - per-type lambda vectors give DIFFERENTIAL drift -- two types driven oppositely settle to opposite
      poles, the CPM analogue of differential sedimentation / an oriented symmetry break
    - the global lambda_x/y/z mode (one vector for all types) is the type-blind degenerate case, which
      is the sibling contract `gravity`; sediment recovers it as equal per-type params
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: focalpointplasticity
  order: 16
  raw_name: FocalPointPlasticity
  raw_kind: Plugin (FocalPointPlasticityPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L4680
  paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366, sec. 'Focal Point Plasticity' (energy
    term of the form lambda*(d-L_target)^2 over dynamically formed cell-cell junctions)
  summary: 'Maintains a set of dynamically formed pairwise "junctions" (focal-point links) between cells
    of

    two named types, and adds, per link, a spring energy on the distance between the two linked cells''

    centers of mass. It is an energy term that ALSO mutates persistent auxiliary state: links form when

    two eligible cells come into contact (each below its max-junction count), pay an ActivationEnergy

    bias at formation, and are deleted once their CoM distance exceeds MaxDistance. The rest length,

    stiffness and break length of individual links can be steered from Python at runtime (plasticity);

    ActivationEnergy cannot (XML-only).

    '
  equations: "Per existing link between linked cells i, j (default LinkConstituentLaw):\n  E_link = lambda_fpp\
    \ * (d_ij - target_distance)^2\nwhere d_ij = || CoM_i - CoM_j ||  (Euclidean distance between the\
    \ two cells' centers of mass).\nA cell may carry up to max_junctions such links for the given type\
    \ pair.\n\nContribution to the Metropolis acceptance test for an attempted pixel copy is the change\
    \ dE this\ncopy induces:\n  dE = sum_over_affected_links [ E_link(d_after) - E_link(d_before) ]\n\
    \       + activation_energy   (added ONCE, only on the copy that CREATES a new junction)\nLink lifecycle\
    \ (not an energy, a state mutation):\n  - form:  when a copy brings two eligible cells (types type1/type2)\
    \ into contact within\n           neighbor_order AND both have < max_junctions links -> a junction\
    \ is created.\n  - break: when d_ij > max_distance -> the junction is deleted (no energy, removal\
    \ only).\nThe LinkConstituentLaw `law` (optional) replaces the default quadratic with a user formula\
    \ over\nthe variables Lambda, Length (=d_ij), TargetLength (=target_distance), e.g.\n\"LambdaExtra*Lambda*(Length-TargetLength)^2\"\
    . The quadratic above is the default when law is None.\nNOTE: the exact functional form is read from\
    \ the LinkConstituentLaw default and the Swat et al.\ndescription; the compiled FPP core itself is\
    \ not readable in this environment (see surprises).\n"
  params:
    neighbor_order (Plugin): contact_range -- global default lattice-neighbor order used to detect candidate
      link partners when scanning for new junctions.
    type1 (Parameters): link_type_selector -- first cell-type name the link law applies to.
    type2 (Parameters): link_type_selector -- second cell-type name of the (ordered) pair.
    lambda_fpp (Parameters): link_stiffness -- spring constant on (d - target_distance)^2.
    activation_energy (Parameters): link_formation_bias -- energy added once when a NEW junction is created
      (negative promotes link formation); NOT steerable at runtime, XML-only.
    target_distance (Parameters): link_rest_length -- preferred CoM-CoM distance L_target.
    max_distance (Parameters): link_break_length -- CoM distance above which the junction is deleted.
    max_junctions (Parameters): coordination_number -- max simultaneous links per cell for this pair.
    neighbor_order (Parameters): contact_range -- per-pair override of the contact neighbor order for
      detecting candidate partners.
    internal (Parameters): link_scope -- flag selecting intra-cluster links (InternalParameters, links
      between compartments of one compartmental cell) vs inter-cluster links (Parameters).
    law (Parameters): link_energy_law -- optional LinkConstituentLaw formula replacing the default quadratic;
      UNKNOWN in detail -- which variables beyond Lambda/Length/TargetLength are bindable, and how the
      compiled core parses the formula, I could not determine from the Python layer.
  state_io: "reads: centers of mass of each pair of linked cells (to compute d_ij), each cell's type,\
    \ and the\n  per-cell junction registry (how many links it already holds).\nwrites: nothing to the\
    \ CPM pixel lattice -- it returns an energy delta to the Metropolis\n  acceptance test (like other\
    \ Potts plugins). BUT unlike a pure energy term it also mutates a\n  persistent auxiliary structure:\
    \ it CREATES junction records on link formation and DELETES them\n  on break. So it carries pairwise\
    \ state between steps, it is not stateless.\n"
  surprises:
  - The exact energy form is inferred from the default LinkConstituentLaw formula ("...*(Length-TargetLength)^2")
    and the Swat et al. description; the compiled FocalPointPlasticity core is not readable in this env,
    so lambda*(d-target)^2 is the best-evidenced form, not one I read line-by-line.
  - ActivationEnergy is applied ONCE, only on the copy that creates a link -- it is a formation threshold,
    not a per-step energy. The twedit generator explicitly warns (CC3DMLGeneratorBase.py L882-884) that
    lambdaDistance/targetDistance/maxDistance are Python-steerable but ActivationEnergy must still be
    set from XML. A reimplementer who makes activation_energy runtime-tunable is wrong.
  - d is the distance between CENTERS OF MASS of whole cells, not a pixel-boundary distance; it can and
    does exceed the cells' own radii. The twedit default template (CC3DMLGeneratorBase.py L894-898) ships
    Lambda 10, ActivationEnergy -50, TargetDistance 7, MaxDistance 20, MaxNumberOfJunctions 1 -- on cells
    whose Volume plugin target is 25 (radius ~2.8), so target_distance 7 already exceeds a cell radius
    and max_distance 20 spans several cell widths. This is a long-range term coupling non-adjacent cell
    centroids. (NB -- the volume-25 value and the 7/20 link values come from two different co-named files,
    the Volume test XML and the twedit generator template respectively.)
  - Two channels: Parameters (inter-cluster) vs InternalParameters (intra-cluster, for compartmental cells).
      Same energy, different link scope selected by the `internal` flag.
  - max_junctions is a per-cell coordination cap enforced at formation time, not an energy penalty --
    a hard combinatorial guard on how many links a cell may hold.
  - The Plugin carries a global neighbor_order AND each Parameters block carries its own; the per-pair
    one (via the MaxNumberOfJunctions NeighborOrder attribute) overrides for that pair.
  - A junction, once formed, persists across MCS until its CoM distance exceeds max_distance -- it is
    NOT re-evaluated for contact each step, so links can stretch far beyond neighbor_order before breaking.
    Purely-contact reasoning would get the dynamics wrong.
  verdict: new
  of: null
  implementation_of: null
  why: '`new` against the FROZEN baseline (all 42 registered contracts). The genuinely-new content is
    a

    PERSISTENT, PLASTIC, LOAD-RUPTURED cell-cell LINK NETWORK: junctions self-assemble on contact

    (only while both cells are under a per-cell coordination cap, paying a one-time formation energy),

    persist as identified per-pair state across MCS, and rupture when their CoM-CoM distance exceeds a

    break length. I name the contract `bond` -- a load-bearing cell-cell junction (focal adhesion /

    adherens-junction / slip-bond biology). It is NOT proposed by the jax-morph atlas either (that

    list is adhere/agitate/apoptose/mechanosense/morphogen/regulate/relax/reorient), so

    implementation_of is null.


    WHY NOT `adhere`. `adhere` (jax-morph, unpromoted; the CC3D Contact/AdhesionFlex mechanisms are its

    sightings) is CONTINUUM DIFFERENTIAL ADHESION: a boundary-contact energy summed over shared

    cross-boundary lattice-site pairs, driving cell sorting by surface energy. FPP is a DISCRETE LINK

    set on cell CENTROIDS (CoM-CoM distance, target 7 / break 20 on volume-25 cells -- far beyond the

    contact boundary), with persistent per-link identity, a coordination cap, and load-dependent

    rupture. Mapping FPP onto `adhere` would conflate a continuum surface-energy field with a discrete

    plastic link graph -- different biology, different `set` semantics (boundary site-pairs vs an

    identified centroid-pair link). So this is a distinct contract, not a second sighting of `adhere`.


    WHY NOT a refinement/alias of the closest REGISTERED contract, `radius_graph` (rewire/topology).

    radius_graph rebuilds `edge_index` from scratch each tick by a single symmetric proximity

    threshold and keeps NO per-edge memory (its docstring: "rebuilds the live configuration ... emits

    no delta"). `bond` needs exactly what radius_graph deliberately refuses: (a) HYSTERESIS -- a link

    forms only within neighbor_order contact (~1-2 sites) but breaks only past max_distance (~20), an

    order of magnitude larger, so a formed junction stretches far beyond any range that could have

    formed it; (b) persistent per-link IDENTITY and per-link constitutive attributes; (c) a per-node

    COORDINATION CAP (max_junctions) enforced at formation; (d) a once-paid ActivationEnergy at

    formation. Widening radius_graph to admit these turns a stateless neighbour-search into a stateful

    load-bearing junction model -- that is replacing its biology (who-is-near) with a different one

    (which bonds have latched and not yet ruptured), i.e. violence, not a costed field widening.


    THE ALGEBRA-FIT TENSION, stated plainly (rule 8). FPP bundles two things Plexus deliberately keeps

    apart -- "who interacts" (rewire) and "how they interact" (a lateral energy). The RESTORING ENERGY

    itself, lambda*(d - target_distance)^2, is NOT new: it is a quadratic pair spring already

    expressible by the registered `squared_law` (or `attraction_repulsion`) read over `bond`''s edges.

    The measurement-honest decomposition of the whole plugin is therefore `bond` (new: the plastic

    hysteretic topology + formation energy + coordination cap) COMPOSED WITH an existing pairwise

    spring on the links it maintains. What resists that clean split is that the rupture criterion

    (max_distance) is a strain threshold on the SAME link the spring loads, so the topology remodeling

    is mechanically coupled -- which is precisely why `bond` is a rewire that, unlike radius_graph,

    also carries a formation-energy delta rather than emitting a pure `{}`. That coupling is the new

    contract''s whole content, and it is what the Plexus separation-of-concerns cannot currently name.


    SCOPE / CAVEATS. Only ONE new contract is credited (the plastic link topology), not two -- the

    spring is charged to `squared_law`. The compiled FPP core is unreadable here, so the quadratic form

    and the exact form/break scan cadence are inferred from the default LinkConstituentLaw + Swat et

    al., not read line-by-line; a user LinkConstituentLaw can replace the quadratic with an arbitrary

    formula (implementation freedom below the contract). No oracle/ablation run exists yet.

    '
  contract:
    name: bond
    kind: rewire
    family: topology
    set: cell
    inputs:
    - cell
    outputs:
    - a PERSISTENT link set E over eligible cell pairs -- the operator's primary product is this stateful,
      identified edge set (created on contact, deleted on rupture), NOT an integrable delta
    - a scalar dE contribution to the Metropolis acceptance test -- the ActivationEnergy formation bias,
      paid ONCE only on the pixel copy that CREATES a junction (negative promotes formation). The link
      RESTORING energy lambda*(d-target)^2 is charged separately to a pairwise spring (squared_law) read
      over these edges; see why.
    reads:
    - cell CoM (link length d_ij = ||CoM_i - CoM_j||, used to test rupture d_ij > max_distance)
    - cell_type (the ordered type1/type2 pair selects which cells are eligible to link)
    - the persistent per-link registry (which pairs are already linked; per-link rest/stiffness/break
      attrs)
    - per-cell link count (coordination; tested against max_junctions at formation time)
    - neighbour shells within neighbor_order (contact test for candidate NEW links only, not for existing
      ones)
    writes:
    - the persistent link set only -- CREATE a junction when two eligible cells contact while BOTH are
      under the coordination cap; DELETE it when d_ij exceeds max_distance. Nothing is written to the
      CPM pixel lattice.
    maps:
    - HYSTERESIS -- a link FORMS only within neighbor_order contact but BREAKS only past max_distance
      (>> contact range), so a formed junction persists and stretches far beyond the range that could
      form it; memoryless symmetric-threshold proximity (radius_graph) cannot express this, which is why
      `bond` is a distinct contract
    - per type-pair (type1,type2) -> (lambda_fpp stiffness, target_distance rest length, max_distance
      rupture length, activation_energy one-time formation bias, max_junctions per-cell coordination cap,
      neighbor_order contact range); the `internal` flag selects inter-cluster vs intra-cluster (compartment)
      link scope
    - plastic cell junctions / focal adhesions -- load-bearing links that self-assemble on contact, resist
      stretch as springs, and rupture under load; distinct from continuum surface adhesion (`adhere`,
      the CC3D Contact/AdhesionFlex mechanisms), which sums a boundary-site contact energy rather than
      an identified link
  status: normalized
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: kerneldiffusionsolver
  order: 17
  raw_name: KernelDiffusionSolver
  raw_kind: Steppable (KernelDiffusionSolver)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L6642
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366, sec. "PDE Solvers" (diffusion solvers).

    No page verified -- no extracted paper text for this target. Checkable in-tree anchors:

    cc3d/twedit5/Plugins/CC3DProject/diffusion_solvers_descr.py:36 ("Legacy Solver that provides an

    approximate solution to Diffusion Equations for large diffusion constants ... significantly

    faster than Diffusion Solver FE ... does not provide the same level of flexibility"); the

    periodic-only constraint at PyCoreSpecs.py:6477-6505; Kernel/CoarseGrainFactor emitted at

    PyCoreSpecs.py:6568-6571.

    '
  summary: 'A steppable diffusion solver that advances one or more scalar concentration FIELDS on the
    CPM

    pixel lattice by CONVOLUTION with a precomputed diffusion kernel (the Green''s function of the

    diffusion equation) rather than by a local finite-difference stencil. It is a genuine field->

    field WRITE like the other PDE solvers -- it overwrites the concentration grid c each step --

    but the update is GLOBAL (a convolution), not a per-site neighbour sum. It only supports

    periodic boundary conditions and a single spatially-uniform diffusion constant, is fast for

    LARGE diffusion constants (where the forward-Euler solver is slow/unstable), and is marked a

    legacy/approximate solver. The physics lives in the compiled core; PyCoreSpecs.py only declares

    the CC3DML the solver reads.

    '
  equations: "Continuous PDE (the paper's): dc/dt = D grad^2 c - lambda c + S.\n\nThis solver's METHOD\
    \ (the code's): instead of the FTCS stencil, it advances the field by\nconvolution with the diffusion\
    \ kernel. For the pure diffusion equation the Green's function is\na Gaussian, so one step is\n\n\
    \  c(x, t+DeltaT) = ( K_{D,DeltaT} * c(., t) )(x)          [periodic convolution over the torus]\n\
    \nwhere K is the diffusion kernel with spatial variance ~ 2*D*DeltaT, tiled periodically. Decay\n\
    is a multiplicative factor exp(-lambda*DeltaT) and secretion S is added as a source per step.\n\n\
    Symbols:\n  c(x,t)     concentration at pixel x (a field value, not cell state)\n  D          global\
    \ diffusion coefficient (diff_global); sets the kernel width. UNIFORM in space.\n  lambda     global\
    \ decay rate (decay_global)\n  S          secretion source from secreting cells (see params)\n  K_{D,DeltaT}\
    \   the (periodic) diffusion kernel; `kernel` truncates its expansion, `cgfactor`\n              \
    \   coarsens the lattice used for the convolution -- see surprises, meaning is\n                 INFERRED\
    \ from method, not stated in source.\nThe convolution/kernel is the SOURCE's realisation; the continuous\
    \ PDE is the paper's. The\nintegrator itself is compiled -- this file only emits CC3DML.\n"
  params:
    diff_global:
      role: diffusion_coefficient (global default D; sets the diffusion-kernel width ~sqrt(2*D*DeltaT);
        validated >= 0). UNIFORM -- no per-cell-type override is emitted (see surprises).
    decay_global:
      role: decay_rate (global lambda; validated >= 0). Also global-only.
    init_expression:
      role: initial_condition -- muParser math expression evaluated per site at t=0 (emitted as InitialConcentrationExpression)
    init_filename:
      role: initial_condition -- file to load the t=0 field from (ConcentrationFileName)
    kernel:
      role: kernel_truncation / interaction_length -- integer >= 1 ('Kernal must be positive', L6538);
        emitted as <Kernel> only when > 1 (L6568). Docstring says only 'kernel of diffusion solver'; INFERRED
        to be the number of terms/periodic images retained in the diffusion-kernel expansion. Precise
        semantics are in the compiled core, not read.
    cgfactor:
      role: coarse_grain_factor -- integer >= 1 ('Coarse grain factor must be positive', L6539); emitted
        as <CoarseGrainFactor> only when > 1 (L6570). Downsamples the lattice used for the convolution
        (speed vs accuracy trade-off). Meaning INFERRED; core does the coarsening.
    secretion (SecretionParameters cell_type/value/constant/contact_type):
      role: 'source_term -- per-cell-type source: additive rate (Secretion), Dirichlet-clamp of the cell
        interior (ConstantConcentration), or additive only on contact with a named type (SecretionOnContact)'
    boundary_conditions (x/y/z _min/_max _type):
      role: 'boundary_condition -- CONSTRAINED to PERIODIC on every face (read-only, L6477-6530; all six
        *_type set to BOUNDARYTYPESPDE[2] in __init__ and check_dict rejects any non-periodic value).
        Not a tunable knob here: the convolution assumes a torus; Dirichlet/Neumann are rejected.'
    fluc_comp:
      role: 'UNKNOWN: inherited from the _PDESolverSpecs base spec_dict (L1159, mass-conservation flag
        for FluctuationCompensator); this solver''s xml (L6657-6666) never emits it, so via THIS python
        spec it is dead.'
  state_io:
    reads: "- the concentration field c (the grid it convolves forward)\n- the CPM cell-id / cell-type\
      \ lattice, to locate secreting cell interiors for the source S --\n  this is the coupling to the\
      \ Potts, not a field of its own\n- the global diffusion constant D and decay lambda, initial-condition\
      \ expression or file\n- (implicitly) that boundaries are periodic -- required, not optional\n"
    writes: "- the concentration field c, replaced each MCS by the convolution result. An actual field\n\
      \  write, not an energy delta -- but a GLOBAL convolution, not the local per-site stencil of\n \
      \ DiffusionSolverFE, so it cannot be expressed as a nearest-neighbour sum.\n"
  surprises:
  - 'PERIODIC-ONLY: unlike DiffusionSolverFE, KernelDiffusionSolver hard-constrains every boundary face
    to Periodic (KernelDiffusionSolverBoundaryConditions, L6477-6505, all six *_type are read-only and
    set to BOUNDARYTYPESPDE[2]). The convolution assumes a torus. A reimplementer offering Dirichlet/Neumann/absorbing
    walls would be wrong -- they are rejected at validation.'
  - 'SPATIALLY UNIFORM D and lambda: KernelDiffusionSolverDiffusionData.xml (L6416-6431) emits ONLY GlobalDiffusionConstant
    / GlobalDecayConstant. The diff_types / decay_types dicts present in the base _PDEDiffusionDataSpecs
    (L578-579) are NEVER written here -- so per-cell-type diffusion/decay is IMPOSSIBLE with this solver,
    necessarily so because a single convolution kernel has one width. This is the opposite of DiffusionSolverFE,
    which does support per-type coefficients.'
  - 'OPPOSITE PERFORMANCE REGIME to the FE solver: this is the tool for LARGE diffusion constants (where
    FTCS is slow/unstable and would need heavy sub-cycling); the guide (diffusion_solvers_descr.py:36)
    calls it ''significantly faster than Diffusion Solver FE'' for that regime. A reimplementer must not
    treat it as interchangeable with the FE stencil solver -- it trades flexibility for speed at high
    D.'
  - 'LEGACY and APPROXIMATE: the same guide line marks it a ''Legacy Solver that provides an APPROXIMATE
    solution''. It is not the exact diffusion solution; approximation quality depends on kernel and cgfactor.
    Silence about accuracy means a naive run may be visibly wrong at small kernel / large cgfactor.'
  - kernel and cgfactor are the ONLY parameters distinguishing this solver's declaration from the other
    PDE solvers, yet the source documents them only as 'kernel of diffusion solver' and 'coarse grain
    factor'. Their precise effect on the convolution (how many expansion terms / how much lattice coarsening)
    is in the compiled core -- I did NOT read the .so. The roles above are INFERRED from the kernel/convolution
    method, not verified.
  - kernel and cgfactor are emitted at the SOLVER-FIELD level and only when > 1 (L6568-6571, `if self.kernel
    > 1` / `if self.cgfactor > 1`), while D and decay sit on the child DiffusionData spec. Defaults kernel=1,
    cgfactor=1 emit no XML at all, so the core defaults are what actually run in a default setup -- a
    tuner who never sets them gets unstated core behaviour.
  - 'Like DiffusionSolverFE (L6242) this class is a thin CC3DML EMITTER: __init__ (L6652) only sets steer=None
    (not steerable), and xml (L6657-6666) just walks child field specs. Every physical parameter lives
    on child DiffusionData / SecretionData / BoundaryConditions specs, and the convolution integrator
    itself is compiled. No update logic is in this file.'
  status: normalized
  verdict: alias
  of: diffuse
  implementation_of: diffuse
  why: 'WHAT IT IS. Strip the plumbing and KernelDiffusionSolver is one step of dc/dt = D grad^2 c

    - lambda c + S on a scalar concentration field, exactly like DiffusionSolverFE -- but it

    realises the transport term by CONVOLUTION with a precomputed diffusion kernel (the Green''s

    function of the diffusion equation) over a periodic torus, instead of a local FTCS stencil.

    That transport core is EXACTLY the registered `diffuse` contract (field->field, advances the

    grid in place). `diffuse` already carries a `spectral` implementation whose kernel is

    exp(-D k^2 dt) -- and by the convolution theorem a Fourier multiply by exp(-D k^2 dt) IS a

    real-space convolution with a Gaussian on the torus, which is precisely what this solver

    does. So KernelDiffusionSolver is the same mathematical operation as diffuse''s spectral

    implementation, done in real space with a truncated kernel (the `kernel` knob) and optional

    lattice coarsening (`cgfactor`); at most it is a fourth numerical implementation of the SAME

    contract. As a whole the mechanism is a COMPOSITE of three existing contracts -- `diffuse`

    (transport), `decay` (the multiplicative exp(-lambda*dt) turnover), and `deposit` (the

    per-cell-type secretion source S) -- exactly as its FE sibling. It introduces no new

    biological verb.


    WHY ALIAS AND NOT REFINEMENT. This is the key contrast with DiffusionSolverFE, which I made

    a `refinement` of `diffuse` because its D_i / lambda_i are SPATIALLY HETEROGENEOUS (read per

    pixel from the moving CPM cell-type lattice), forcing `diffuse`''s scalar `rate` to widen to a

    coefficient-field. KernelDiffusionSolver has NO such demand: it emits ONLY GlobalDiffusionConstant

    / GlobalDecayConstant (L6416-6431); diff_types / decay_types are never written and are in fact

    IMPOSSIBLE here, because a single convolution kernel has exactly one width. A spatially UNIFORM

    scalar D is precisely what `diffuse` already binds (self.rate = float(...)), so the contract

    admits this solver with no field-widening at all. Its other hard constraint -- PERIODIC-ONLY

    boundaries -- is not a widening either: the existing `spectral` implementation of `diffuse`

    already assumes a periodic domain (exp(-D k^2 dt) is a torus operation), and Plexus fields

    already carry a `periodic` flag, so periodic-only is a NARROWING that selects the spectral-family

    implementation, not a new signature. Hence the signature is unchanged: same set (field), same

    inputs/outputs/reads/writes as base `diffuse`. Nothing breaks for existing users; nothing must

    widen. That is an alias, not a refinement.


    WHAT THE TWO IMPLEMENTATIONS DO DIFFERENTLY (the alias detail R-rule asks for). diffuse''s

    finite_difference / DiffusionSolverFE''s FTCS advance the field by a LOCAL nearest-neighbour

    stencil (stable only at small D, moving/mixed boundaries allowed, per-type D possible).

    KernelDiffusionSolver advances it by a GLOBAL periodic convolution with a truncated diffusion

    kernel: fast and stable for LARGE D where FTCS chokes, but restricted to uniform D and a torus,

    and APPROXIMATE (legacy; accuracy degrades at small `kernel` / large `cgfactor`). Same contract,

    opposite numerical regime -- which is exactly the shape a mature framework should show: several

    interchangeable implementations behind one biological verb, so implementation_of: diffuse and

    the ledger counts `diffuse` once more, not a new contract.


    CLOSEST-CONTRACT / not-new. Emphatically not `new`: diffuse + decay + deposit already cover

    transport, turnover, and source, and unlike the FE solver this one needs not even the

    coefficient-heterogeneity widening. The kernel / cgfactor knobs are numeric truncation /

    coarse-graining accuracy dials with no biological content -- they do not change inputs,

    outputs, reads, or writes -- so they justify neither a refinement nor a new contract.

    '
  contract:
    name: diffuse
    kind: field
    family: fields
    set: field
    inputs:
    - field
    outputs: []
    reads:
    - the scalar concentration field c (the grid advanced in place)
    - the single global diffusion coefficient D and decay rate lambda (spatially UNIFORM -- no per-cell-type
      coefficient field, unlike the FE solver; this solver cannot express one)
    - the CPM cell-type set lattice, only to locate secreting cell interiors for the composed deposit
      source S (not for a per-site coefficient)
    - the t=0 initial condition (expression or file); boundaries are required PERIODIC, not read as a
      tunable
    writes:
    - the concentration field c, in place -- replaced each MCS by the periodic convolution result (a real
      field write, not an energy delta)
    maps: []
  module: null
  test: null
  evidence:
    oracle_run: null
    diff_metric: null
    threshold: null
    passed: null
- id: lengthconstraint
  order: 18
  raw_name: LengthConstraint
  raw_kind: Plugin (LengthConstraintPlugin)
  code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L3924
  paper_section: 'Swat et al. (2012) Methods Cell Biol 110:325-366, sec. "Cell Length / Elongation

    constraint". No extracted paper text available; the checkable anchors are the compiled

    plugin''s symbol table (libCC3DLengthConstraint.so) and the CC3DML-generator description at

    twedit5/Plugins/CC3DMLGenerator/CC3DMLGeneratorBase.py:L340-346.

    '
  summary: 'An energy term (Cellular-Potts plugin), not a state update. It penalises the deviation of
    a

    cell''s ELONGATION (the length of its equivalent-ellipse major axis, derived from the cell''s

    moments of inertia about its centre of mass) from a per-cell-type target length, so that a

    proposed pixel copy that stretches a cell toward its target length is favoured and one that

    over/under-stretches it is opposed. In 3D (or when MinorTargetLength is set) the minor axis is

    independently constrained to a second target. Combined with a Volume constraint it drives cells

    into elongated / rod shapes. The plugin returns a delta energy for the acceptance test; it

    writes no cell field.

    '
  equations: "Metropolis acceptance (Potts core, unchanged by this plugin):\n  P(accept copy) = 1 if dE\
    \ <= 0 else exp(-dE / T)\nThis plugin contributes to dE only. For a cell whose current major-axis\
    \ length is L and target\nL0, with stiffness lambda_L (symbol spring_energy(d,d,d) in the .so; toString/getTargetLength/\n\
    getLambdaLength accessors), the length-constraint energy is a quadratic (Hookean) spring:\n  E_length(cell)\
    \ = lambda_L * (L - L0)^2\nand, when a minor target l0 is set (3D):\n  E_length(cell) = lambda_L *\
    \ (L - L0)^2  +  lambda_L * (l - l0)^2\nwhere L (and l) is the length of the semi-major (semi-minor)\
    \ axis of the ellipse/ellipsoid with\nthe SAME moments of inertia as the cell's pixel set about its\
    \ centre of mass. The plugin\ncomputes dE = E_after - E_before over the two cells touched by the candidate\
    \ pixel copy, using\nthe incremental change in the inertia tensor from adding/removing that one pixel.\n\
    CAVEAT: the exact eigenvalue->length conversion (how L is read off the inertia-tensor\neigenvalues)\
    \ lives in the compiled core; no C++/paper source was available here, so the\nquadratic FORM above\
    \ is confirmed (spring_energy symbol + generator text) but the length\nformula itself is inferred,\
    \ not read.\n"
  params:
    cell_type:
      role: 'target_selector: name of the cell type this constraint applies to (validated against CellTypePlugin)'
    target_length:
      role: 'target_length: rest length L0 of the cell''s MAJOR axis (equivalent-ellipse), in lattice
        units'
    lambda_length:
      role: 'constraint_stiffness: coefficient lambda_L of the quadratic length-deviation penalty (spring
        constant)'
    minor_target_length:
      role: 'target_length_minor: rest length l0 of the MINOR axis; Optional. Per the CC3DML generator
        this is intended for/emitted only in 3D simulations (CC3DMLGeneratorBase.py:L376-377); None =>
        minor axis unconstrained'
  state_io:
    reads:
    - cell pixel set (volume) and its moments of inertia about the centre of mass (requires the CenterOfMass
      plugin; present in every LengthConstraint test XML)
    - the candidate pixel copy (source/target Point3D and the two involved Cell*), to compute the incremental
      inertia-tensor change
    - per-cell LengthConstraintData extra member (targetLength, lambdaLength, minorTargetLength) OR the
      per-cell-type defaults; local-flex values can be set at runtime via setLengthConstraintData(cell,
      lambda, target[, minor])
    - lattice dimensionality/orientation, to dispatch changeEnergy_xy / _xz / _yz / _3D
    writes:
    - 'none from changeEnergy: this is an energy term, it only returns dE and changes the acceptance probability,
      it does not write any cell field'
    - (out of band) a steppable may WRITE the per-cell LengthConstraintData via setLengthConstraintData;
      that is host-driven state, not part of the energy evaluation
  surprises:
  - 'This is an ENERGY term, not an update: changeEnergy returns a delta and mutates nothing. Forcing
    it into read/write update language misrepresents it.'
  - It depends on the CenterOfMass plugin (moments of inertia). Length is a DERIVED quantity from the
    inertia tensor, not a stored field; without CenterOfMass the length is undefined.
  - 'The .so exports _get_non_nan_energy(double): there is an explicit NaN guard on the energy. Degenerate
    cells (single pixel, zero/undefined inertia) give a NaN length; a naive reimplementation that skips
    this guard will inject NaN into dE and corrupt the acceptance test.'
  - 'Dispatch by lattice geometry: separate changeEnergy_xy / changeEnergy_xz / changeEnergy_yz / changeEnergy_3D
    functions are selected by which plane a 2D lattice lies in (or 3D). A reimplementer assuming a single
    formula misses that the length is measured in the active plane.'
  - MinorTargetLength is documented as a 3D (minor-axis) parameter (generator emits it only when sim_3d_flag),
    but the Python spec and the C++ setter accept it in 2D too. The Python API is more permissive than
    the intended physics.
  - 'Fragmentation guard is external, not built in: the CC3DML generator warns ''to prevent cell fragmentation
    for large elongations you need to also use connectivity constraint'' (CC3DMLGeneratorBase.py:L345).
    LengthConstraint alone can tear a cell apart; correctness depends on co-running Connectivity/ConnectivityGlobal
    (present in the elongationFlex test XML).'
  - 'Two parameter scopes: values can be per-cell-type (LengthEnergyParameters via the plugin) OR per-cell
    (LengthConstraintData extra member set from Python). setLengthConstraintData signature is (cell, lambdaLength,
    targetLength[, minor]) -- lambda FIRST, target SECOND, which is the reverse of the constructor''s
    (target_length, lambda_length) order (see PyCoreSpecs.py:L3853 vs the steppable call in elongationFlexSteppables.py:L12).
    Easy to transpose.'
  verdict: new
  of: null
  implementation_of: null
  why: "NEW against the frozen baseline: no PROMOTED contract constrains a cell's SHAPE. This is a\nquadratic\
    \ restoring spring on a cell's ELONGATION -- the length of the semi-major axis of the\nequivalent\
    \ ellipse (read off the eigenvalues of the cell's inertia tensor about its COM) --\ntoward a per-type\
    \ or per-cell target. Nothing in the 42 registered contracts reads a\nsecond-moment shape descriptor\
    \ of a set and returns an energy that grows with its deviation\nfrom a rest value. I name the missing\
    \ contract `elongate`.\n\nCLOSEST PROMOTED contract = cell_grow (structural/growth). It is the nearest\
    \ because it, too,\nis a per-cell, target-driven geometric homeostasis. But widening cell_grow to\
    \ admit this does\nviolence on three independent counts:\n  1. QUANTITY. cell_grow targets the 0th\
    \ moment -- SIZE (rest volume / site count), isotropic.\n     elongate targets the 2nd moment -- the\
    \ ANISOTROPY / aspect (major-axis extent), which is\n     independent of area: a cell can hit its\
    \ target length by thinning to a filament at fixed\n     volume (indeed the reference sim must add\
    \ Volume + Connectivity to stop exactly that).\n     Size homeostasis and shape homeostasis are different\
    \ biology.\n  2. MECHANISM. cell_grow is a STATE UPDATE: the engine integrates a rest-volume delta\
    \ and the\n     cell physically grows. elongate is a Potts ENERGY term -- changeEnergy returns a scalar\
    \ dE\n     and mutates NOTHING; it only re-weights the acceptance probability of a proposed pixel\n\
    \     copy. Forcing an integrated growth update to also mean \"return a dE that gates a Metropolis\n\
    \     accept\" changes cell_grow's output contract and breaks every current user.\n  3. DEPENDENCY.\
    \ elongate's length is a DERIVED quantity requiring the inertia tensor (the\n     CenterOfMass plugin);\
    \ it has no stored field. cell_grow reads a scalar target it owns.\n\nNOT an alias/refinement of anything\
    \ else in the baseline. The interaction family\n(attraction_repulsion, cohesion, separation, squared_law,\
    \ stillinger_weber, ...) is pairwise\nand metric over neighbours; elongate reads a SINGLE cell's own\
    \ pixel set, no partner. gravity\n(lateral/mechanics) is the precedent for a single-body mechanics\
    \ energy, which is why the\ncontract is filed lateral/mechanics, but gravity is a uniform body force,\
    \ not a shape spring.\n\nRELATIONSHIP TO THE VOLUME CONSTRAINT (its normalized-later sibling) recorded\
    \ honestly: both\nare quadratic springs on a per-cell geometric moment -- Volume on the 0th, Length\
    \ on the 2nd.\nOne could lump them as a single \"geometric target spring\" contract parameterised\
    \ by moment\norder (see the note's counter-argument). I keep them distinct: the Volume constraint's\
    \ biology\n(size homeostasis) maps onto the existing cell_grow rest-volume target, whereas shape/elongation\n\
    has no home in the language at all. Collapsing \"any quadratic on any moment\" into one contract\n\
    would erase that distinction -- the naming inflation this campaign exists to avoid, in reverse.\n\n\
    NOT a second sighting of any jax-morph-proposed contract (adhere, agitate, apoptose,\nmechanosense,\
    \ morphogen, regulate, relax, reorient): none is a shape/elongation energy.\n`reorient` concerns polarity\
    \ DIRECTION, not shape magnitude; `relax` (meaning unread) is not\nevidenced to be an inertia-tensor\
    \ shape spring, so I do not claim it. implementation_of: null.\n\nThe campaign-flagged shape stands:\
    \ this is a Potts ENERGY term, not a state update. Whether the\nPlexus algebra can express a restoring\
    \ energy over a set's emergent second-moment shape\ndescriptor whose output gates a Metropolis accept\
    \ rather than integrating is the open question\n`elongate` leaves standing.\n"
  contract:
    name: elongate
    kind: lateral
    family: mechanics
    set: cell
    inputs: "- one cell's pixel set and its moments of inertia about the centre of mass (supplied by the\n\
      \  CenterOfMass plugin); the semi-major axis length L is read off the inertia-tensor\n  eigenvalues,\
      \ and the semi-minor axis length l when a minor target is set (3D / plane).\n- the proposed single-pixel\
      \ copy (source/target Point3D, the two involved cells), used to\n  recompute the inertia tensor\
      \ incrementally at +/-1 volume for the two cells it touches.\n- the target(s) and stiffness: target_length\
      \ L0, optional minor_target_length l0,\n  lambda_length -- taken from the per-cell LengthConstraintData\
      \ extra member if present, else\n  the per-cell-type default.\n- the lattice dimensionality / active\
      \ plane, selecting changeEnergy_xy/_xz/_yz/_3D.\n"
    outputs: "- a scalar energy contribution dE added to the Potts total, NOT an integrated state delta:\n\
      \  dE = E_after - E_before, with E(cell) = lambda_L*(L - L0)^2 (+ lambda_L*(l - l0)^2 when a\n \
      \ minor target is set), summed over the two cells the candidate copy changes. A NaN-guarded\n  length\
      \ is used so degenerate (single-pixel / undefined-inertia) cells do not corrupt dE.\n  The delta\
      \ only re-weights the Metropolis acceptance probability; the operator writes no\n  cell property.\n"
    reads: "- the cell's pixel set / volume and its inertia tensor about the COM (xCM/yCM/zCM); length\
      \ is\n  derived from this, not stored.\n- per-cell LengthConstraintData (targetLength, lambdaLength,\
      \ minorTargetLength) OR the per-type\n  LengthEnergyParameters default.\n- the candidate pixel copy\
      \ and the involved cells, for the incremental inertia-tensor change.\n- lattice dimensionality /\
      \ active plane.\n"
    writes: "- NONE. changeEnergy returns dE (an energy term) and mutates no cell field; it changes only\n\
      \  the acceptance probability of the proposed pixel copy.\n- (out of band, not part of this contract)\
      \ a host steppable may WRITE per-cell\n  LengthConstraintData via setLengthConstraintData(cell,\
      \ lambda, target[, minor]) -- note\n  lambda-first, target-second, the reverse of the CC3DML attribute\
      \ order. That is host-driven\n  state-setting, not the energy evaluation.\n"
    maps: "- cell inertia tensor about COM -> eigenvalues -> semi-major axis length L (and semi-minor\
      \ l);\n  the exact eigenvalue->length scale factor lives in compiled core and is unread (form\n\
      \  confirmed, constant inferred).\n- shape deviation (L - L0) [and (l - l0)] -> quadratic Hookean\
      \ energy lambda_L*(dev)^2 per\n  cell -> summed over the two cells a candidate copy touches -> dE\
      \ that gates the Metropolis\n  accept. Straight-to-target -> low energy; over/under-stretched ->\
      \ higher energy.\n"
