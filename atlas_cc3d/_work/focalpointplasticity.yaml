id: focalpointplasticity
order: 16
raw_name: FocalPointPlasticity
raw_kind: Plugin (FocalPointPlasticityPlugin)
code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L4680
paper_section: Swat et al. (2012) Methods Cell Biol 110:325-366, sec. 'Focal Point Plasticity' (energy
  term of the form lambda*(d-L_target)^2 over dynamically formed cell-cell junctions)
summary: 'Maintains a set of dynamically formed pairwise "junctions" (focal-point links) between cells
  of

  two named types, and adds, per link, a spring energy on the distance between the two linked cells''

  centers of mass. It is an energy term that ALSO mutates persistent auxiliary state: links form when

  two eligible cells come into contact (each below its max-junction count), pay an ActivationEnergy

  bias at formation, and are deleted once their CoM distance exceeds MaxDistance. The rest length,

  stiffness and break length of individual links can be steered from Python at runtime (plasticity);

  ActivationEnergy cannot (XML-only).

  '
equations: "Per existing link between linked cells i, j (default LinkConstituentLaw):\n  E_link = lambda_fpp\
  \ * (d_ij - target_distance)^2\nwhere d_ij = || CoM_i - CoM_j ||  (Euclidean distance between the two\
  \ cells' centers of mass).\nA cell may carry up to max_junctions such links for the given type pair.\n\
  \nContribution to the Metropolis acceptance test for an attempted pixel copy is the change dE this\n\
  copy induces:\n  dE = sum_over_affected_links [ E_link(d_after) - E_link(d_before) ]\n       + activation_energy\
  \   (added ONCE, only on the copy that CREATES a new junction)\nLink lifecycle (not an energy, a state\
  \ mutation):\n  - form:  when a copy brings two eligible cells (types type1/type2) into contact within\n\
  \           neighbor_order AND both have < max_junctions links -> a junction is created.\n  - break:\
  \ when d_ij > max_distance -> the junction is deleted (no energy, removal only).\nThe LinkConstituentLaw\
  \ `law` (optional) replaces the default quadratic with a user formula over\nthe variables Lambda, Length\
  \ (=d_ij), TargetLength (=target_distance), e.g.\n\"LambdaExtra*Lambda*(Length-TargetLength)^2\". The\
  \ quadratic above is the default when law is None.\nNOTE: the exact functional form is read from the\
  \ LinkConstituentLaw default and the Swat et al.\ndescription; the compiled FPP core itself is not readable\
  \ in this environment (see surprises).\n"
params:
  neighbor_order (Plugin): contact_range -- global default lattice-neighbor order used to detect candidate
    link partners when scanning for new junctions.
  type1 (Parameters): link_type_selector -- first cell-type name the link law applies to.
  type2 (Parameters): link_type_selector -- second cell-type name of the (ordered) pair.
  lambda_fpp (Parameters): link_stiffness -- spring constant on (d - target_distance)^2.
  activation_energy (Parameters): link_formation_bias -- energy added once when a NEW junction is created
    (negative promotes link formation); NOT steerable at runtime, XML-only.
  target_distance (Parameters): link_rest_length -- preferred CoM-CoM distance L_target.
  max_distance (Parameters): link_break_length -- CoM distance above which the junction is deleted.
  max_junctions (Parameters): coordination_number -- max simultaneous links per cell for this pair.
  neighbor_order (Parameters): contact_range -- per-pair override of the contact neighbor order for detecting
    candidate partners.
  internal (Parameters): link_scope -- flag selecting intra-cluster links (InternalParameters, links between
    compartments of one compartmental cell) vs inter-cluster links (Parameters).
  law (Parameters): link_energy_law -- optional LinkConstituentLaw formula replacing the default quadratic;
    UNKNOWN in detail -- which variables beyond Lambda/Length/TargetLength are bindable, and how the compiled
    core parses the formula, I could not determine from the Python layer.
state_io: "reads: centers of mass of each pair of linked cells (to compute d_ij), each cell's type, and\
  \ the\n  per-cell junction registry (how many links it already holds).\nwrites: nothing to the CPM pixel\
  \ lattice -- it returns an energy delta to the Metropolis\n  acceptance test (like other Potts plugins).\
  \ BUT unlike a pure energy term it also mutates a\n  persistent auxiliary structure: it CREATES junction\
  \ records on link formation and DELETES them\n  on break. So it carries pairwise state between steps,\
  \ it is not stateless.\n"
surprises:
- The exact energy form is inferred from the default LinkConstituentLaw formula ("...*(Length-TargetLength)^2")
  and the Swat et al. description; the compiled FocalPointPlasticity core is not readable in this env,
  so lambda*(d-target)^2 is the best-evidenced form, not one I read line-by-line.
- ActivationEnergy is applied ONCE, only on the copy that creates a link -- it is a formation threshold,
  not a per-step energy. The twedit generator explicitly warns (CC3DMLGeneratorBase.py L882-884) that
  lambdaDistance/targetDistance/maxDistance are Python-steerable but ActivationEnergy must still be set
  from XML. A reimplementer who makes activation_energy runtime-tunable is wrong.
- d is the distance between CENTERS OF MASS of whole cells, not a pixel-boundary distance; it can and
  does exceed the cells' own radii. The twedit default template (CC3DMLGeneratorBase.py L894-898) ships
  Lambda 10, ActivationEnergy -50, TargetDistance 7, MaxDistance 20, MaxNumberOfJunctions 1 -- on cells
  whose Volume plugin target is 25 (radius ~2.8), so target_distance 7 already exceeds a cell radius and
  max_distance 20 spans several cell widths. This is a long-range term coupling non-adjacent cell centroids.
  (NB -- the volume-25 value and the 7/20 link values come from two different co-named files, the Volume
  test XML and the twedit generator template respectively.)
- Two channels: Parameters (inter-cluster) vs InternalParameters (intra-cluster, for compartmental cells).
    Same energy, different link scope selected by the `internal` flag.
- max_junctions is a per-cell coordination cap enforced at formation time, not an energy penalty -- a
  hard combinatorial guard on how many links a cell may hold.
- The Plugin carries a global neighbor_order AND each Parameters block carries its own; the per-pair one
  (via the MaxNumberOfJunctions NeighborOrder attribute) overrides for that pair.
- A junction, once formed, persists across MCS until its CoM distance exceeds max_distance -- it is NOT
  re-evaluated for contact each step, so links can stretch far beyond neighbor_order before breaking.
  Purely-contact reasoning would get the dynamics wrong.
verdict: new
of: null
implementation_of: null
why: |
  `new` against the FROZEN baseline (all 42 registered contracts). The genuinely-new content is a
  PERSISTENT, PLASTIC, LOAD-RUPTURED cell-cell LINK NETWORK: junctions self-assemble on contact
  (only while both cells are under a per-cell coordination cap, paying a one-time formation energy),
  persist as identified per-pair state across MCS, and rupture when their CoM-CoM distance exceeds a
  break length. I name the contract `bond` -- a load-bearing cell-cell junction (focal adhesion /
  adherens-junction / slip-bond biology). It is NOT proposed by the jax-morph atlas either (that
  list is adhere/agitate/apoptose/mechanosense/morphogen/regulate/relax/reorient), so
  implementation_of is null.

  WHY NOT `adhere`. `adhere` (jax-morph, unpromoted; the CC3D Contact/AdhesionFlex mechanisms are its
  sightings) is CONTINUUM DIFFERENTIAL ADHESION: a boundary-contact energy summed over shared
  cross-boundary lattice-site pairs, driving cell sorting by surface energy. FPP is a DISCRETE LINK
  set on cell CENTROIDS (CoM-CoM distance, target 7 / break 20 on volume-25 cells -- far beyond the
  contact boundary), with persistent per-link identity, a coordination cap, and load-dependent
  rupture. Mapping FPP onto `adhere` would conflate a continuum surface-energy field with a discrete
  plastic link graph -- different biology, different `set` semantics (boundary site-pairs vs an
  identified centroid-pair link). So this is a distinct contract, not a second sighting of `adhere`.

  WHY NOT a refinement/alias of the closest REGISTERED contract, `radius_graph` (rewire/topology).
  radius_graph rebuilds `edge_index` from scratch each tick by a single symmetric proximity
  threshold and keeps NO per-edge memory (its docstring: "rebuilds the live configuration ... emits
  no delta"). `bond` needs exactly what radius_graph deliberately refuses: (a) HYSTERESIS -- a link
  forms only within neighbor_order contact (~1-2 sites) but breaks only past max_distance (~20), an
  order of magnitude larger, so a formed junction stretches far beyond any range that could have
  formed it; (b) persistent per-link IDENTITY and per-link constitutive attributes; (c) a per-node
  COORDINATION CAP (max_junctions) enforced at formation; (d) a once-paid ActivationEnergy at
  formation. Widening radius_graph to admit these turns a stateless neighbour-search into a stateful
  load-bearing junction model -- that is replacing its biology (who-is-near) with a different one
  (which bonds have latched and not yet ruptured), i.e. violence, not a costed field widening.

  THE ALGEBRA-FIT TENSION, stated plainly (rule 8). FPP bundles two things Plexus deliberately keeps
  apart -- "who interacts" (rewire) and "how they interact" (a lateral energy). The RESTORING ENERGY
  itself, lambda*(d - target_distance)^2, is NOT new: it is a quadratic pair spring already
  expressible by the registered `squared_law` (or `attraction_repulsion`) read over `bond`'s edges.
  The measurement-honest decomposition of the whole plugin is therefore `bond` (new: the plastic
  hysteretic topology + formation energy + coordination cap) COMPOSED WITH an existing pairwise
  spring on the links it maintains. What resists that clean split is that the rupture criterion
  (max_distance) is a strain threshold on the SAME link the spring loads, so the topology remodeling
  is mechanically coupled -- which is precisely why `bond` is a rewire that, unlike radius_graph,
  also carries a formation-energy delta rather than emitting a pure `{}`. That coupling is the new
  contract's whole content, and it is what the Plexus separation-of-concerns cannot currently name.

  SCOPE / CAVEATS. Only ONE new contract is credited (the plastic link topology), not two -- the
  spring is charged to `squared_law`. The compiled FPP core is unreadable here, so the quadratic form
  and the exact form/break scan cadence are inferred from the default LinkConstituentLaw + Swat et
  al., not read line-by-line; a user LinkConstituentLaw can replace the quadratic with an arbitrary
  formula (implementation freedom below the contract). No oracle/ablation run exists yet.
contract:
  name: bond
  kind: rewire
  family: topology
  set: cell
  inputs:
  - cell
  outputs:
  - a PERSISTENT link set E over eligible cell pairs -- the operator's primary product is this stateful,
    identified edge set (created on contact, deleted on rupture), NOT an integrable delta
  - a scalar dE contribution to the Metropolis acceptance test -- the ActivationEnergy formation bias,
    paid ONCE only on the pixel copy that CREATES a junction (negative promotes formation). The link
    RESTORING energy lambda*(d-target)^2 is charged separately to a pairwise spring (squared_law) read
    over these edges; see why.
  reads:
  - cell CoM (link length d_ij = ||CoM_i - CoM_j||, used to test rupture d_ij > max_distance)
  - cell_type (the ordered type1/type2 pair selects which cells are eligible to link)
  - the persistent per-link registry (which pairs are already linked; per-link rest/stiffness/break attrs)
  - per-cell link count (coordination; tested against max_junctions at formation time)
  - neighbour shells within neighbor_order (contact test for candidate NEW links only, not for existing ones)
  writes:
  - the persistent link set only -- CREATE a junction when two eligible cells contact while BOTH are under
    the coordination cap; DELETE it when d_ij exceeds max_distance. Nothing is written to the CPM pixel lattice.
  maps:
  - HYSTERESIS -- a link FORMS only within neighbor_order contact but BREAKS only past max_distance (>> contact
    range), so a formed junction persists and stretches far beyond the range that could form it; memoryless
    symmetric-threshold proximity (radius_graph) cannot express this, which is why `bond` is a distinct contract
  - per type-pair (type1,type2) -> (lambda_fpp stiffness, target_distance rest length, max_distance rupture
    length, activation_energy one-time formation bias, max_junctions per-cell coordination cap, neighbor_order
    contact range); the `internal` flag selects inter-cluster vs intra-cluster (compartment) link scope
  - plastic cell junctions / focal adhesions -- load-bearing links that self-assemble on contact, resist stretch
    as springs, and rupture under load; distinct from continuum surface adhesion (`adhere`, the CC3D
    Contact/AdhesionFlex mechanisms), which sums a boundary-site contact energy rather than an identified link
