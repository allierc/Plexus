implementation_of: adhere
why: |
  `new` against the FROZEN baseline (no registered contract covers molecule-mediated cell-cell
  adhesion), and `implementation_of: adhere` -- this is a SECOND SIGHTING of `adhere`, a contract
  first PROPOSED by the jax-morph atlas (still unpromoted, so not in the frozen 42/52). Setting
  implementation_of lets the ledger count `adhere` ONCE across the two repositories instead of
  re-minting it here; without it the saturation curve would double-count and measure our naming
  habits, not the language.

  WHAT IT IS. AdhesionFlex is the pure differential-adhesion energy of the Cellular Potts model.
  Across every cross-boundary lattice-site pair it adds a contact energy that is a double sum over
  the two owners' carried adhesion-molecule densities times a user binding matrix k_mn (with an
  explicit leading minus, so a positive k is ADHESIVE). Biologically that is cadherin-style
  surface-molecule adhesion driving cell sorting -- exactly `adhere`'s content. It owns a mutable
  per-cell (and per-Medium) density VECTOR seeded from a per-type declaration, retunable by a
  steppable mid-run and copied to daughters at mitosis; that per-cell coupling is the `adhere`
  read, the CPM analogue of a per-cell cadherin concentration feeding a pair's well depth.

  WHY NOT alias/refinement of a REGISTERED contract. The closest registered contracts are the
  lateral/interaction pair rules `cohesion` and `attraction_repulsion`. Both EMIT a force
  (`acceleration`) on a point particle and WRITE `position` after the engine integrates it.
  AdhesionFlex writes NOTHING: it is a Potts energy term whose changeEnergy() returns a scalar dE
  that only biases which proposed pixel-copy the Metropolis engine accepts (rule 8). Its `set` is a
  cell that IS a set of lattice sites, its interaction is counted over shared BOUNDARY site-pairs
  (not centre distance), and there is no repulsive core at all (excluded volume is CompuCell3D's
  separate Volume constraint). To host it, cohesion/attraction_repulsion would not merely widen a
  field -- they would have to swap their output type (energy bias, not force), their set
  representation (site-set, boundary counting), and drop position writes: that is replacing the
  contract's semantics, i.e. violence, not a costed widening.

  WHY NOT alias attraction_repulsion the way jax-morph's Morse was. Morse maps to
  `attraction_repulsion` because it carries BOTH a repulsive core (excluded volume) and an adhesive
  tail. AdhesionFlex carries ONLY the adhesion, so it maps to the pure-adhesion contract `adhere`.
  Plain Contact is the canonical `adhere` implementation (a static J(type,type') table);
  AdhesionFlex is the per-cell-state, data-kernel generalisation of that same contract, so it is
  `implementation_of: adhere`, not a distinct contract.

  SCOPE / OPEN. The muParser binding kernel (AdhesionFunc, default min) makes the combining
  function DATA rather than a fixed op -- an implementation freedom below the contract, not a new
  contract. The (1-delta) restriction is written over cell TYPES in the library HTML but over cell
  IDs in changeEnergy; I could not run the compiled core to settle it, so it is recorded as an
  unresolved source discrepancy, not folded into the signature. No oracle/ablation run exists yet.
contract:
  name: adhere
  kind: lateral
  family: interaction
  set: cell
  inputs:
  - cell
  outputs:
  - contact_energy (a scalar dE contribution to the Metropolis acceptance of a proposed pixel copy;
    NOT a cell state and NOT a force -- this operator writes nothing back to the lattice)
  reads:
  - cell_id (sigma at each of two neighbouring lattice sites, to keep only cross-boundary pairs via 1-delta)
  - cell_type (seeds the per-cell density vector at init)
  - adhesion_molecule_density (the per-cell/per-Medium mutable density VECTOR N_m(sigma); the adhesion coupling)
  - binding_matrix (k_mn pairwise binding affinities; may be negative)
  - binding_kernel (the muParser combining formula AdhesionFunc over the two densities; default min)
  - neighbour shells (site pairs within neighbor_order adjacency)
  writes:
  - nothing to the lattice (energy term). Side channel only -- the plugin maintains its own per-cell
    density vector, which steppables set at runtime and mitosis copies to daughters.
  maps:
  - a cell is a SET of lattice sites sharing an id; adhesion energy is summed over neighbouring
    cross-boundary site pairs (owners differ), so contact area emerges from boundary site counts
  - per boundary pair, energy = -sum over molecule pairs (m,n) of k_mn * AdhesionFunc(N_m(sigma_i), N_n(sigma_j));
    positive k lowers energy (adhesive), opposite sign sense to the plain Contact J matrix
  - differential adhesion / cell sorting emerges from type- and molecule-dependent binding, with the
    per-cell density vector making adhesion individually steerable and heritable across division
