disputed:
  by: skeptic
  was: new
  claimed: new
  evidence: 'The record picks `implementation_of: adhere` on the premise adhere is the ''pure-adhesion
    contract'' — but adhere was MINTED by pure-repulsion SoftSphere as a radius-based FORCE law: reads
    [position,radius,epsilon], EMIT=velocity, writes [position] (jax_morph_soft_sphere.py:62-71,125-128;
    phase2b.log:62). AdhesionFlex reads no radius and writes NOTHING (energy bias). The record wields
    exactly this output-type gap to reject cohesion as ''violence'' (why:), yet ignores it when merging
    into the force-emitting adhere — so by its own standard AdhesionFlex is a distinct new contract, not
    an implementation_of adhere.'
  what_would_settle_it: 'Diff the two `adhere` signatures: jax adhere writes [position]/reads [radius]
    and emits a force; AdhesionFlex writes [] and reads no radius. If output-type/writes is contract-defining
    (as the entry asserts against cohesion), the two cannot be one contract — strip implementation_of
    or justify why force→position and energy→nothing share a signature.'
