id: boxwatcher
order: 4
raw_name: BoxWatcher
raw_kind: Steppable (BoxWatcherSteppable)
code_path: /workspace/.conda_envs/cc3d-oracle/lib/python3.12/site-packages/cc3d/core/PyCoreSpecs.py:L5490
paper_section: 'Not covered by Swat et al. (2012) Methods Cell Biol 110:325-366. BoxWatcher is a

  computational-optimization steppable, absent from the modeling-methods text; the only

  source anchor is the CC3DML generator docstring "Module tracing boundaries of the minimal

  box enclosing all the cells. May speed up calculations. May have no effect for parallel

  version" (twedit5 CC3DMLGenerator/CC3DMLGeneratorBase.py:L1288-1290, echoed at

  CC3DProject/CC3DXMLGenerator.py:L1071). No paper page/figure has been read for this entry.

  '
summary: 'A bookkeeping / performance steppable, NOT a physics term. Each step it traces the minimal

  axis-aligned bounding box enclosing all non-medium cells, pads it per-axis by fixed margins,

  and hands that box to the Potts solver so the Metropolis pixel-copy sweep samples only sites

  inside it. It touches no cell state and no energy: it scopes WHERE flips are attempted, to

  avoid sweeping empty lattice on domains much larger than the occupied region.

  '
equations: "There is no energy term and no state update. The per-step bookkeeping (reconstructed from\n\
  the docstring + margin semantics; the compiled core was not read) is, for each axis d in {x,y,z}:\n\n\
  \  lo_d = min over all lattice sites s belonging to any non-medium cell of s_d\n  hi_d = max over all\
  \ lattice sites s belonging to any non-medium cell of s_d\n  BoxMin_d = clamp(lo_d - Margin_d, 0, Dim_d)\n\
  \  BoxMax_d = clamp(hi_d + Margin_d, 0, Dim_d)\n\nwhere Margin_d is XMargin/YMargin/ZMargin and Dim_d\
  \ the lattice dimension. The Potts sweep\nthen draws candidate source pixels uniformly from [BoxMin,\
  \ BoxMax] instead of the whole\nlattice. No dE is returned; no cell field is written. The clamp form\
  \ and recompute cadence\nare inferred, not verified byte-for-byte.\n"
params:
  XMargin: sweep_padding_x -- lattice sites of buffer added around the tight occupied box in x; default
    7 (set only by the twedit generators, see surprises)
  YMargin: sweep_padding_y -- same, y axis; default 7
  ZMargin: sweep_padding_z -- same, z axis; default 7
state_io: 'reads: the occupied lattice-site extents of every non-medium cell -- a global reduction over

  the whole cell set to one axis-aligned bounding box. writes: a GLOBAL BoxMin/BoxMax on the

  Potts simulator that scopes the flip-attempt sampler''s spatial support. It writes NO cell

  state and NO field, and returns NO energy delta -- it is neither an energy term nor a

  per-cell update, but a modifier of the sampler''s domain.

  '
surprises:
- 'It is neither of the two categories this campaign expects (energy term / state update). It

  writes the SAMPLER''s spatial support -- a global box -- not any cell, field, or dE. In Plexus

  terms nothing returns a delta the engine integrates; it is a domain-scoping / control

  construct with no obvious operator analogue.

  '
- 'The PyCoreSpecs wrapper is parameterless and LOSSY. `xml` emits only

  `<Steppable Type="BoxWatcher"/>` via generate_header (no children); `from_xml` (L5509) calls

  find_xml_by_attr then returns a bare `cls()`, so any XMargin/YMargin/ZMargin present in loaded

  CC3DML is SILENTLY DROPPED on round-trip. Meanwhile the twedit5 snippet/project generators DO

  emit XMargin=YMargin=ZMargin=7. Source-vs-source discrepancy on whether margins exist at all.

  '
- 'The docstring warns it "may have no effect for parallel version": the optimization is bypassed

  under the parallel/multithreaded Potts sweep, so the mechanism''s realized effect is

  implementation/threading-dependent rather than a property of the model.

  '
- 'Intended as a pure speedup, but restricting the sweep''s support changes which sites the sampler

  visits, so a fixed-seed serial run WITH vs WITHOUT BoxWatcher is not obviously bit-identical

  (the RNG/attempt sequence differs). Whether the core guarantees identical dynamics I could not

  verify -- flagged as inference, not fact.

  '
- 'The margin default of 7 is a magic constant living ONLY in the twedit generators. A

  reimplementer following PyCoreSpecs (which sets nothing) would inherit whatever the compiled

  default is -- unknown from this environment -- not 7.

  '
verdict: out_of_scope
of: null
implementation_of: null
why: "BoxWatcher carries NO biological content: it recomputes the axis-aligned bounding box of\
  \ all non-medium cells (plus fixed per-axis margins) each step and hands it to the Potts\
  \ solver so pixel-copy attempts are drawn only from the occupied region -- the docstring's own\
  \ justification is \"May speed up calculations\". It writes the Metropolis SAMPLER's spatial\
  \ support, not any cell, field, or energy delta, and is meant to be dynamics-preserving. The\
  \ closest registered contract is `aggregate` (both reduce the whole cell set to one global\
  \ quantity) and the TYPED SHAPE here genuinely is a set-to-global reduction; but the reduced\
  \ quantity is a solver control parameter with no biological referent (a hierarchy `aggregate`\
  \ produces a parent tissue node, not a sampling window). Admitting it as a biological operator\
  \ -- `new` or an `aggregate` alias -- would inflate the yield with framework mechanics and\
  \ corrupt the saturation measurement, so it is out_of_scope. The contract below is recorded\
  \ only to document the reduction shape; its `family: hierarchy` is a forced fit, not a claim\
  \ that BoxWatcher builds a hierarchy.\n"
contract:
  name: sweep_scope
  kind: aggregate
  family: hierarchy
  set: cell
  inputs:
  - XMargin
  - YMargin
  - ZMargin
  outputs:
  - box_min
  - box_max
  reads:
  - cell.lattice_site_extents
  writes:
  - potts.sweep_bounds
  maps: []
