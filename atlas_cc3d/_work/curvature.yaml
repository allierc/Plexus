why: "NEW against the frozen baseline: no PROMOTED contract is a BENDING STIFFNESS -- an angular\nenergy\
  \ over an ORDERED chain of cells that penalises curvature and drives a linked filament\ntoward straight.\
  \ The registered interaction family (attraction_repulsion, cohesion,\nseparation, squared_law, signal,\
  \ velocity_align) is pairwise and metric; none reads a triple\nof consecutive bonded cells and returns\
  \ an energy that grows with how much the chain bends.\n\nCLOSEST PROMOTED contract = stillinger_weber\
  \ (lateral/interaction), the ONLY registered\nthree-body angular term. It is genuinely close: SW penalises\
  \ deviation of a bond angle from a\npreferred cosine, (cos_jik - cos0)^2, and with cos0 = -1 (theta0\
  \ = 180 deg) that IS a\nstraightness/bending penalty. So the raw functional idea -- \"angular energy\
  \ with a preferred\nangle\" -- overlaps. But widening stillinger_weber to admit Curvature does violence\
  \ to its\nbiology and its signature on two independent counts:\n  1. TOPOLOGY. SW builds its OWN isotropic\
  \ min-image neighbour list each tick and sums over\n     ALL geometric triples i-j-k within a cutoff\
  \ -- it has no notion of an ordered backbone.\n     Bending stiffness of a FILAMENT requires selecting\
  \ only the CONSECUTIVE triples along a\n     maintained, ordered 1D bond graph (left/mid/right, up to\
  \ 3 hops each side). Applied to a\n     blob, SW-with-cos0=-1 would penalise every bent geometric triple\
  \ everywhere, not\n     straighten a defined chain. To cover Curvature, SW's signature must change from\
  \ \"reads\n     pos, builds own neighbours\" to \"reads an EXTERNAL ordered bond graph it does not\n\
  \     maintain\" -- a new required input that breaks every current SW user (mW water, silicon).\n  2.\
  \ FORM + OUTPUT. Curvature's per-triple energy is the Menger curvature\n     kappa = 2 sin(theta)/|chord|\
  \ = 1/R_circ (LINEAR in curvature), not SW's squared cosine;\n     and it is a Potts changeEnergy (a\
  \ Metropolis accept/reject contribution) rather than an\n     autograd Newtonian force. The form difference\
  \ alone would be \"just an implementation,\"\n     but combined with the maintained-chain requirement\
  \ it is a different contract.\nSo this is not an interchangeable implementation of stillinger_weber;\
  \ implementation_of is\nleft null. The biology SW captures is a tetrahedral-network directional bond\
  \ angle over\ngeometric neighbours; the biology here is the flexural rigidity of a semiflexible chain\
  \ over\na defined backbone -- a distinct, missing contract I name `stiffen`.\n\nNOT a second sighting\
  \ of any jax-morph-proposed contract (adhere, agitate, apoptose,\nmechanosense, morphogen, regulate,\
  \ relax, reorient): none is an angular/bending stiffness.\n\nHYBRID CAVEAT recorded honestly: this ONE\
  \ plugin fuses TWO mechanisms. The primary one, and\nthe one this contract captures, is the bending\
  \ stiffness. The SECOND is a stateful junction\nGROWER -- a topology REWIRE that biases a bond-forming\
  \ move by activation_energy and commits\nthe bond in the accepted-move watcher (within-cluster, listed\
  \ types, under max_junctions, no\nexisting bond, within neighbor_order). That half resembles radius_graph\
  \ (rewire/topology) but\nis energy-biased and cluster-gated; it is the machinery that BUILDS the chain\
  \ the stiffness\nacts on, not the stiffness itself, so it is noted in writes:/maps: and surprises rather\
  \ than\ndriving the verdict. A faithful port needs both halves, but the new CONTRACT the language is\n\
  missing is `stiffen`.\n\nThe campaign-flagged shape stands: changeEnergy is a Potts ENERGY term, not\
  \ a state update --\nit returns a scalar dE (recomputing affected COMs at +/-1 volume) and mutates no\
  \ cell\nproperty; only the accepted-move watcher mutates topology. Whether the algebra can express a\n\
  bending energy over a maintained ordered chain whose output gates a Metropolis accept rather\nthan integrating\
  \ is the open question `stiffen` leaves standing.\n"
contract:
  name: stiffen
  kind: lateral
  family: interaction
  set: cell
  inputs: "- a triple of three CONSECUTIVE junction-linked cells of a chain (COMs L, M, R) with their\n\
    \  volumes, drawn from the cell's maintained bond graph (up to 3 hops each side of a change)\n- the\
    \ proposed single-pixel copy at target site t (gaining cell volume+1, losing cell\n  volume-1; affected\
    \ COMs recomputed via precalculateCentroid)\n- for a bond-forming move: the cell-id lattice around\
    \ t and the partner cell's type,\n  clusterId and current junction count\n"
  outputs: "- a scalar energy contribution dE added to the Potts total, NOT an integrated state delta:\n\
    \  dE = sum over affected triples of lambda * (kappa_after - kappa_before), where\n  kappa = 2 sin(theta_M)/|R-L|\
    \ is the Menger curvature of the triple (0 for a straight\n  chain). lambda = per-type-pair curvature\
    \ modulus, looked up by the triple's FIRST pair.\n- ALTERNATIVELY, for a move that would create a\
    \ new within-cluster junction, a fixed offset\n  dE = activation_energy (typically negative, favouring\
    \ bond formation) in place of the\n  curvature delta.\n"
  reads: "- center of mass (xCM/yCM/zCM) and volume of the changed cell and of its junction neighbours\n\
    \  up to 3 hops each side along the chain\n- each cell's junction set (CurvatureTracker.internalCurvatureNeighbors,\
    \ extra attributes)\n- cell type and clusterId\n- the cell-id lattice around pt (getNeighborDirect\
    \ up to neighbor_order) when scouting a\n  new junction partner\n"
  writes: "- the bending-energy contract itself writes NO cell state; changeEnergy returns dE (an\n  energy\
    \ term), changing only the acceptance probability of the proposed pixel copy.\n- the plugin's accepted-move\
    \ watcher (field3DChange) DOES mutate TOPOLOGY as a side effect\n  distinct from this contract: it\
    \ inserts a new junction into both cells'\n  internalCurvatureNeighbors sets on an accepted bond-forming\
    \ move, and erases all bonds of\n  a cell whose volume reached 0. This is a rewire aspect (near radius_graph),\
    \ not part of\n  the stiffness signature.\n"
  maps: "- chain angle theta_M at the middle cell -> Menger curvature kappa = 2 sin(theta_M)/|chord|\n\
    \  -> per-triple energy lambda * kappa (straight -> 0, more bent -> larger); the whole-chain\n  bending\
    \ energy is the sum over consecutive triples, and the move delta is the sum over the\n  up-to-5 affected\
    \ triples spanning 3 hops each side of the change.\n- junction-partner candidacy (same clusterId,\
    \ both types listed, both under max_junctions,\n  no existing bond, partner within neighbor_order\
    \ lattice shells) -> a fixed activation_energy\n  bias on the bond-forming move.\n"
