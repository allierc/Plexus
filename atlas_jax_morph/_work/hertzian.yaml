status: validated
module: src/plexus/operators/candidates/jax_morph_hertzian.py
test: tests/test_jax_morph_hertzian.py
evidence:
  oracle_run: diff_hertzian
  diff_metric: |
    force_field_rel_err (PRIMARY, one scalar) = max over the 7 live cells i and both spatial
    components c of the per-component force discrepancy |F_plx(i,c) - F_ref(i,c)|, divided by
    max_{i,c} |F_ref(i,c)| (= 0.8651). UNITS: dimensionless, a fraction of the peak reference
    force. Computed on a SINGLE forward() call (no integration, no compounding) on ONE fixed
    HETEROGENEOUS 7-cell overlapping cluster -- per-cell radius 0.40..0.70 (so the contact
    distance sigma = r_i + r_j VARIES per pair) and per-cell epsilon 1.0..3.0 (so the coupling is
    the per-pair arithmetic-mean mix) -- the two combining rules that distinguish `adhere` from
    `attraction_repulsion`. F_ref is jax-morph Hertzian(epsilon).forces(state) (autodiff of
    E = 0.5*sum_{i!=j alive} (2/5) eps (1-r/sigma)^(5/2)); F_plx is the Plexus adhere:hertzian
    operator's emitted velocity at mobility=1 (= its autodiff force) on a BYTE-IDENTICAL IC (the
    same POS7 translated by +[20,20], radius/epsilon registered as per-cell buffers), diffed over
    the 7 live cells only (dead padding masked). A SECONDARY scalar guards the engine composition:
    traj_pos_max_abs = max over all 41 frames (t = 0..40) and all 7 live cells of the centroid-
    aligned per-cell position discrepancy |x_plx(t,i) - x_ref(t,i)| (world units), where x_ref is
    the reference BrownianDynamics(Hertzian(epsilon=2.0), gamma=1, kT=0) overdamped-Euler
    trajectory (uniform radius 0.5, dt=0.1) and x_plx is the same spec run through plexus.engine
    (adhere gated after_frame:1 so recorded frame 0 is the pristine shared IC and frame t is the
    IC after t overdamped steps). Computed by atlas_jax_morph/diff_hertzian.py into
    log/atlas/hertzian/diff.json. evidence.value is the PRIMARY.
  threshold: 0.0001
  threshold_why: |
    Two thresholds, BOTH PRE-REGISTERED in the scorer before any diff was computed
    (diff_hertzian.py:38-39): THRESHOLD_FORCE = 1.0e-4 on the primary relative force error,
    THRESHOLD_TRAJ = 1.0e-3 (world units) on the secondary trajectory; passed = (force <= 1e-4)
    AND (traj <= 1e-3). The 1e-4 force bar is chosen to sit in the gap between the numeric floor
    and the nearest WRONG implementation. The nearest neighbour -- SoftSphere (exponent 2 instead
    of Hertzian's 5/2), the wrong-exponent defect the verdict hinges on -- is measured by the two
    negative controls at 0.52 (reference SoftSphere.forces vs Hertzian.forces) and 0.37 (Plexus F
    vs the SoftSphere reference), i.e. ~5000x the bar; dropping the 2/5 prefactor or using
    sigma = mean instead of sum would diverge by a comparable O(1) fraction. So no
    wrong-exponent / wrong-prefactor / wrong-sigma-rule reimplementation can slip under 1e-4. Yet
    the two independent autodiff stacks (jax reverse-mode vs torch autograd, float32) agree to
    1.9e-6 -- ~50x UNDER the bar -- so 1e-4 is not so tight that only bit-identical arithmetic
    passes. The 1e-3 trajectory bar sits ~1000x under the real dynamics it must resolve (the
    cluster relaxes: max cell move 0.70 world units, gyration 0.799 -> 0.984, nn-distance
    0.668 -> 0.977) and ~150x above the float32 accumulation floor (traj error 6.3e-6 over 40
    steps). Looser on either bar would admit a materially wrong force law as "agreement";
    tighter would fail on float32 reassociation alone.
  value: 1.894631743528317e-06
  passed: true
  plexus_run: log/atlas/hertzian/
  scorer: atlas_jax_morph/diff_hertzian.py
  acted_ledger: |
    adhere: calls 40 / acted 40, moved 0.69977516 (max live-cell displacement, == the oracle's own
    relaxation: gyration 0.799 -> 0.984 on both sides); inert_operators []; unverifiable_operators
    []; valid_evidence true. The one scheduled operator moved cells every frame -- this is a run,
    not a still life. (The PRIMARY force-field metric is a direct forward() call, not gated by the
    schedule; the ledger validates the SECONDARY trajectory run.)
  corroborators: |
    All from log/atlas/hertzian/diff.json unless noted. (1) Peak force magnitudes agree
    independently of the rel-err normalization: |F_ref|_max 0.86514318 vs |F_plx|_max 0.86514449
    (~1.3e-6). (2) Newton's third law holds on BOTH sides -- the summed internal force is ~0
    (ref 6.7e-8, plexus 3.7e-8): a momentum-conserving pair force, no phantom net drift. (3) The
    NEGATIVE CONTROLS FIRE: the neighbouring SoftSphere (exponent 2) misses Hertzian by 0.52
    (reference-internal) and the Plexus force differs from the SoftSphere reference by 0.37 --
    ~5000x the 1e-4 bar -- so PASS is discriminating, not a trivially-satisfiable bound. (4)
    SECONDARY trajectory: traj_pos_max_abs 6.26e-6 over 40 overdamped steps that genuinely moved
    0.70 world units; frame-0 IC residual 8.9e-7 (the shared IC is real) and final-frame residual
    6.26e-6 == the max (no runaway amplification -- a contractive gradient flow). (5) ORACLE
    SELF-CHECK (diff_hertzian/summary.json): the reference is the real Hertzian law, not a
    mis-configured oracle -- the 2-cell radial scan matches the analytic
    f(r) = (eps/sigma)(1-r/sigma)^1.5 to 8.8e-8, BrownianDynamics(kT=0) is deterministic across
    two PRNG keys (0.0), and its first Euler step equals dt*forces to 2.5e-8. Oracle provenance:
    real jax-morph 0.4.0 / jax 0.11.0 in the isolated venv (git ace08b8).
  scope: |
    STRONGER than the soft_sphere twin on the disputed axis. The PRIMARY (H) scenario uses
    HETEROGENEOUS radius (0.40..0.70) so sigma = r_i + r_j varies per pair, AND per-cell epsilon
    (1.0..3.0) combined by the per-pair arithmetic-mean mix -- exactly the two combining rules
    (additive sigma, mean epsilon, per-cell coupling) that distinguish `adhere` from
    attraction_repulsion's fixed GLOBAL sigma and per-TYPE params. So unlike soft_sphere's
    uniform-radius test, this differential DOES exercise the size-consistency and per-cell coupling
    the verdict turns on. What it does NOT touch: (a) an adhesive tail -- Hertzian has none by
    construction (purely repulsive), so this is a property of the member, not a gap in the test;
    (b) the per-cell VIRIAL pressure the base derives from the same energy -- out of scope, a
    separate VirialStress mechanism. This validates the IMPLEMENTATION reproduces the reference
    force and its overdamped dynamics; it does not by itself decide the verdict/dispute (new ->
    adhere), which rests on the signature argument in `why`.
disputed:
  by: skeptic
  was: alias
  claimed: new
  evidence: attraction_repulsion.py:28-64 EMITs a VELOCITY from a hand-coded two-Gaussian over an edge-graph,
    fixed global sigma, per-TYPE params, noise — never reads radius, no energy/virial. Hertzian (potentials.py:367-372)
    reads radius (sigma=r_i+r_j), is energy-defined, per-cell, deterministic. Alias drops radius-read
    + per-cell coupling; identical twin SoftSphere landed new/adhere. Language keeps 4 distinct interaction
    contracts.
  what_would_settle_it: 'Try to configure attraction_repulsion for a size-consistent contact: its API
    (REQUIRES_PARAMS=[''sigma''], REQUIRES_TYPE_PROPS=[''p''], no state.radius read in forward()) cannot
    express sigma=r_i+r_j nor a per-cell epsilon — so it cannot reproduce Hertzian without deleting its
    fixed-width per-type D''Orsogna contract; reconcile with soft_sphere''s new/adhere twin verdict.'
