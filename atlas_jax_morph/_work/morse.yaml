id: morse
order: 14
raw_name: Morse
raw_kind: potential (PairwisePotential)
code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L269
paper_section: p. 9 (Methods, 'Mechanical interactions', eq. V_ij(r), lines 514-520); restated p. 14 (SI,
  'Mechanical Interactions'); fig. 1d (repulsive core = volume exclusion, attractive tail = cell-cell
  adhesion)
summary: An interaction ENERGY, not a state-writing step. It evaluates a Morse pair potential over every
  live, non-self pair -- a repulsive core plus an adhesive tail with its minimum -epsilon at the contact
  distance sigma = r_i + r_j -- and sums it into the scalar total interaction energy; the base class turns
  that into per-cell forces (autodiff of the energy) and per-cell virial pressure. Morse itself writes
  NOTHING to state; a wrapping step (MechanicalRelaxation, BrownianDynamics, VirialStress) consumes total_energy
  / forces / virial_pressure and moves positions or records stress. The code multiplies the well by a
  sigma-relative smooth cutoff on [1.5*sigma, 2.5*sigma] that the paper's written formula does not have.
equations: "Indices: i, j range over state-array slots (0..capacity-1); r_ij = |displacement(pos_i, pos_j)|.\n\
  \nPer-pair parameters (Morse.pair_params):\n    sigma_ij = radius_i + radius_j          # contact distance\
  \ = well minimum (ADDITIVE rule)\n    eps_ij   = coupling(epsilon)            # scalar -> broadcast\
  \ (N,N); StateFieldSpec -> mix()\n    alpha_ij = coupling(alpha)              # scalar -> broadcast\
  \ (N,N); StateFieldSpec -> mix()\n    mix(v)_ij = 0.5*(v_i + v_j)             # arithmetic mean for\
  \ a per-cell coupling (NOT for sigma)\n\nElementwise Morse energy with cutoff (Morse.pair_energy):\n\
  \    e_ij    = 1 - exp(-alpha_ij * (r_ij - sigma_ij))\n    U_ij    = eps_ij * (e_ij^2 - 1)         #\
  \ = eps*(1 - exp(-alpha(r-sigma)))^2 - eps\n    Ucut_ij = U_ij * S(r_ij; r_on = 1.5*sigma_ij, r_off\
  \ = 2.5*sigma_ij)   # <-- cutoff NOT in paper\n    U(sigma) = -eps (well minimum);  U(r -> inf) -> 0\
  \ already (e -> 1), the cutoff truncates the tail.\n\njax-md multiplicative_isotropic_cutoff S (helper\
  \ _smooth_cutoff, C1 in value and 1st derivative):\n    S(r) = 1                                   \
  \                             for r <= r_on\n         = (r_off^2 - r^2)^2 (r_off^2 + 2 r^2 - 3 r_on^2)\
  \ / (r_off^2 - r_on^2)^3   for r_on < r < r_off\n         = 0                                      \
  \                          for r >= r_off\n\nReductions inherited from PairwisePotential:\n    E(positions,\
  \ state) = 0.5 * sum_i sum_{j!=i, alive} Ucut_ij      # 0.5 counts each pair once\n    forces(state)\
  \       = -grad_positions E                          # autodiff, shape (N, dim)\n    p_i (virial)  \
  \      = -(1/(2 d V_i)) * sum_{j!=i,alive} r_ij (dU/dr)(r_ij)   # V_i = d-ball volume(radius_i)\n\n\
  Paper form (p. 9 / p. 14), IDENTICAL to U_ij but with NO cutoff factor:\n    V_ij(r) = eps_ij [1 - exp(-alpha_ij\
  \ (r_ij - sigma_ij))]^2 - eps_ij\nThe CODE is authoritative: it adds the [1.5*sigma, 2.5*sigma] smooth\
  \ cutoff the paper omits.\n"
params:
  epsilon: well depth (energy scale) -- how deep the adhesive well / how strong the interaction; at contact
    V = -epsilon. Shared scalar (default 3.0) or a per-cell StateFieldSpec combined per pair by the arithmetic-mean
    mix(). This is the knob the paper's adhesion example learns (epsilon_ij set by regulated cadherin
    concentration).
  alpha: well steepness / inverse interaction range -- larger alpha narrows the well (steeper, shorter-range
    interaction), smaller alpha widens the attractive tail. Shared scalar (default 2.8) or per-cell StateFieldSpec,
    mixed by arithmetic mean.
  r_onset_frac: interaction-range onset, as a multiple of the contact distance sigma. Below r_onset_frac*sigma
    the energy is untouched (S=1). Default 1.5. Pure numeric field (never per-cell).
  r_cutoff_frac: interaction-range end, as a multiple of sigma. Beyond r_cutoff_frac*sigma the energy
    is exactly 0 (S=0). Default 2.5. Construction requires r_onset_frac < r_cutoff_frac (_check_config).
state_io:
  reads: 'position (the (N,dim) positions the energy is evaluated at, passed by the wrapping step); radius
    (sigma_ij = r_i + r_j, per pair, and the d-ball volume for virial); alive (self/dead-pair mask via
    neighbor_sum); displacement (the space metric, i.e. free vs periodic, for pairwise separations); n_space_dim
    (virial_pressure only, for the d-ball volume). Plus any per-cell field named by an epsilon/alpha StateFieldSpec
    -- state_reads() returns exactly those specs (default: none, since the defaults are scalars).'
  writes: 'NONE. Morse is a Potential, not a SimulationStep: it returns an energy (scalar), a force array,
    or a virial vector, never a state or a state delta. All persistent state changes are made by the wrapping
    step that consumes these (relaxation/Brownian write position; VirialStress writes a stress field).'
surprises:
- 'PAPER-vs-CODE gap (the point of this entry): the paper''s written Morse energy (p. 9 eq. and p. 14
  SI, both V_ij(r) = eps[1-exp(-alpha(r-sigma))]^2 - eps) is UNTRUNCATED. The code multiplies it by a
  jax-md-style smooth multiplicative cutoff on [1.5*sigma, 2.5*sigma]. A reimplementer following only
  the paper''s formula gets a different force in the 1.5-2.5*sigma window and a non-compact interaction.
  The SOURCE wins; the cutoff, its window fractions, and its C1 (not C-infinity) form are code-only decisions.'
- The bare Morse well ALREADY decays to 0 as r -> inf (e -> 1 so U -> eps*(1-1) = 0); the "-epsilon" shift
  sets V(inf)=0 and V(sigma)=-epsilon. So the cutoff is NOT needed to bound or zero the energy -- it only
  truncates the residual exponential tail exactly and keeps the force continuous. Easy to assume the cutoff
  is load-bearing when the potential is already asymptotically zero.
- 'TWO different pair-combining rules live in one potential: sigma uses an ADDITIVE rule (r_i + r_j),
  while a per-cell epsilon/alpha uses the arithmetic-MEAN mix() = 0.5*(v_i+v_j). A reimplementer who averages
  radii too (or sums the couplings) is wrong. mix is arithmetic (no sqrt) on purpose so the gradient stays
  finite at zeros / dead cells under jax_debug_nans -- a geometric (Lorentz-Berthelot) mean would NaN.'
- 'epsilon/alpha accept ONLY a shared scalar or a per-cell SCALAR StateFieldSpec -- __check_init__ rejects
  any N-vector or N x N array. The paper''s differential-adhesion example (Fig. S1) needs a full per-PAIR,
  type-dependent well-depth matrix: homotypic vs heterotypic cadherin SUM, sigmoid- scaled to [0.8, 3.8].
  That per-pair, sum-based, type-aware rule is NOT expressible through this class''s arithmetic-mean coupling
  API; the model must supply epsilon by another route or override mix(). I could NOT determine from potentials.py
  alone how the pattern example wires this -- flagged as an open uncertainty.'
- Default magic constants epsilon=3.0, alpha=2.8, r_onset_frac=1.5, r_cutoff_frac=2.5 appear NOWHERE in
  the paper (which gives no numeric alpha, epsilon, or cutoff). They cannot be recovered from the paper
  and a reimplementer must copy them from the source.
- 'NaN guards are load-bearing under the suite''s always-on jax_debug_nans: dead-dead padded pairs have
  sigma = 0 -> r_on = r_off = 0, so S''s denominator (r_off^2 - r_on^2)^3 is 0/0; safe_divide returns
  0 there. safe_norm gives the r=0 self-diagonal a zero value AND zero gradient. Reimplement without these
  and a masked pair NaNs the whole energy/force (test_morse_padded_dead_cells_do_not_nan).'
- The 0.5 in total_energy (0.5 * sum(neighbor_sum(U, alive))) counts each pair once; neighbor_sum already
  masks self (i!=j) and dead pairs. Dropping the 0.5 doubles the energy and every force.
verdict: alias
of: attraction_repulsion
implementation_of: attraction_repulsion
why: 'ALIAS of `attraction_repulsion` (implementation_of: attraction_repulsion). Morse is the pairwise

  cell-cell interaction the paper ACTUALLY uses (p. 9 / p. 14 / Fig. 1d): a repulsive core = excluded

  volume, plus an adhesive tail = cell-cell adhesion, with its minimum -epsilon at the contact

  distance sigma = r_i + r_j. That is exactly attraction_repulsion''s biology -- its "long-range pull

  minus short-range push". The Morse well eps[(1-exp(-alpha(r-sigma)))^2 - 1] and

  attraction_repulsion''s two-Gaussian f(r)*(pos_j-pos_i) are two functional SHAPES of the one

  conservative radial pair force (attraction_repulsion''s force is itself the gradient of a radial

  potential); one hand-codes the force, the other writes the energy and autodiffs it. Of the whole

  PairwisePotential family Morse is the CANONICAL member -- the only sibling carrying BOTH terms

  (SoftSphere / Hertzian are purely repulsive), so it maps onto attraction_repulsion most exactly.


  THE PARENT IS ALREADY NORMALIZED. PairwisePotential (order 13) landed alias -> attraction_repulsion,

  and its why names the subclasses verbatim: "Morse, SoftSphere, Hertzian, Harmonic and LennardJones

  are interchangeable force-law SHAPES over this one contract ... each concrete subclass is

  implementation_of: attraction_repulsion." Morse is that Morse. The NoForce normalizer likewise

  named "attraction_repulsion ... the home the paper''s Morse potential ... will normalize to". This

  is the several-implementations-per-contract pattern the registry exists to hold; finding it is the

  GOOD result, not a missed contract.


  NOT `refinement`: no field of attraction_repulsion''s signature is FORCED to change, and every Morse

  difference lives below the signature. (1) The code''s smooth cutoff on [1.5*sigma, 2.5*sigma] (which

  the paper omits -- SOURCE wins) is a range / pair-topology implementation option, the same axis on

  which squared_law already carries BOTH all-pairs and a neighbour graph, and on which

  attraction_repulsion already truncates via its radius_graph map. (2) energy -> autodiff-force vs a

  hand-coded force is an implementation strategy, not a contract: stillinger_weber is itself an

  energy-defined interaction in this same lateral/interaction family, so "write an energy and

  differentiate it" does not, by itself, mint a contract. (3) The coupling reads (per-cell scalar

  epsilon / alpha symmetrised by the arithmetic-mean mix; additive sigma = r_i + r_j) are

  default-compatible, break no existing user, and so are not a costed widening.


  NOT `new`: attraction_repulsion already IS the pairwise attraction-repulsion contract; minting a

  second for a different well SHAPE inflates exactly the yield this ledger measures. NOT

  `out_of_scope`: unlike NoForce (the identity element, absence of interaction) Morse is a real

  forward interaction with a pair map, separation reads, and a force output.


  SCOPE / SOURCE notes. The per-cell VIRIAL PRESSURE the base also derives from this energy is NOT an

  output of this interaction contract; it is the separate VirialStress entry''s mechanism (it writes a

  `stress` field), so I keep it out of scope here. The coupling restriction -- shared scalar OR

  per-cell scalar field only, per-pair / type matrices rejected at __check_init__ -- is a real

  EXPRESSIVENESS limit of THIS implementation against the paper''s type x type cadherin adhesion matrix

  (Fig. S1); it is an implementation weakness recorded in surprises, not a contract change (an

  override of mix() or an external epsilon route would supply it). The default magic constants

  (epsilon 3.0, alpha 2.8, cutoff 1.5 / 2.5) are code-only numerics absent from the paper.

  '
contract:
  name: attraction_repulsion
  kind: lateral
  family: interaction
  set: cell
  inputs:
  - cell
  outputs:
  - cell
  reads:
  - position
  - radius
  - alive
  - coupling field (shared scalar OR per-cell scalar field, e.g. epsilon / alpha), symmetrised per pair
    by the arithmetic-mean mix rule
  writes:
  - position
  maps:
  - pairwise radial interaction over live non-self pairs (dense N x N, half-summed so each unordered pair
    counts once); force on each cell = -grad of the conservative Morse pair energy by autodiff
  - contact distance sigma = r_i + r_j (additive, size-consistent as cells grow); repulsive core (excluded
    volume) + adhesive tail (cell-cell adhesion); a radial pair force integrated overdamped or minimised
