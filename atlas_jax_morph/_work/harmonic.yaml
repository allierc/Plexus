  evidence: 'Sibling SoftSphere (_work/soft_sphere.yaml:90-113) landed new -> `adhere`, explicitly rejecting

    attraction_repulsion for lacking ''a cell''s physical radius, size-consistent contact distance,

    energy/virial, per-cell coupling''. Harmonic (potentials.py:407-416, base 228-266) reads

    radius->sigma=r_i+r_j, per-cell mix k, energy/virial -- same adhesive family as Morse. Alias

    silently loses these; entry never addresses adhere.

    '
  what_would_settle_it: 'Reconcile the family''s conflicting record verdicts (Morse alias->attraction_repulsion
    vs

    SoftSphere new->adhere): confirm attraction_repulsion.py:28-64 has no `radius` read and a fixed

    global sigma + per-type p; if so, Harmonic''s size-consistent per-pair contact and per-cell

    coupling force it under `adhere`, matching Morse''s true sibling home, not attraction_repulsion.

    '
