id: harmonic
order: 17
raw_name: Harmonic
raw_kind: potential (PairwisePotential)
code_path: papers/jax-morph/jax_morph/physics/mechanics/potentials.py:L375
paper_section: 'p. 9 (Methods, "Mechanical interactions", eq. Vij); p. 14 (SI, "Mechanical Interactions")
  --

  both define ONLY the Morse potential. Harmonic itself is absent from the paper (library-only

  pair potential); see surprises.

  '
summary: 'A pairwise energy over live cell pairs: a finite-range harmonic spring whose parabola is

  shifted down so it vanishes at a sigma-relative cutoff. Minimum sits at the contact distance

  sigma=r_i+r_j, so the interaction is repulsive when cells are compressed (r<sigma) and adhesive

  when stretched (sigma<r<r_c). It writes no state directly: it supplies total_energy, and

  forces = -grad(energy) are consumed by the wrapping dynamics/relaxation step, which moves

  positions.

  '
equations: "CODE (this class, potentials.py:412-416):\n  sigma = r_i + r_j                           \
  \       # contact distance = sum of the two radii\n  r_c   = r_cutoff_frac * sigma                 \
  \     # cutoff distance (default 2.5 * sigma)\n  U(r)  = 0.5 * k * [ (r - sigma)^2 - (r_c - sigma)^2\
  \ ]   for r < r_c\n  U(r)  = 0                                               for r >= r_c   (jnp.where\
  \ hard truncation)\n  # well depth at contact:  U(sigma) = -0.5*k*(r_c - sigma)^2 = -0.5*k*sigma^2*(r_cutoff_frac-1)^2\n\
  \  # radial force:  F(r) = -dU/dr = -k*(r - sigma)  for r < r_c, 0 beyond\n  #   -> jumps by k*(r_c\
  \ - sigma) at r_c (energy is C0 there, force is discontinuous)\n\nReductions (inherited from PairwisePotential,\
  \ potentials.py:228-240):\n  total_energy = 0.5 * sum over {i,j alive, i != j} U(r_ij)   # neighbor_sum\
  \ masks self+dead pairs;\n                                                              # 0.5 counts\
  \ each unordered pair once\n  forces       = -grad_position(total_energy)                 # jax.grad\
  \ (autodiff, no analytic force)\n  k_ij         = 0.5 * (k_i + k_j)                            # arithmetic-mean\
  \ mix, only when k is a\n                                                              # per-cell StateFieldSpec;\
  \ scalar broadcasts\n\nPAPER (the only mechanical potential the paper defines, eq. Vij, p. 9 / p. 14)\
  \ -- NOT this class:\n  V_ij(r) = eps_ij * [ (1 - exp(-alpha_ij*(r - sigma_ij)))^2 - 1 ]\n  # Morse\
  \ well; harmonic is a code-side alternative with the same sigma=r_i+r_j contact convention.\n"
params:
  k: 'interaction_stiffness -- spring constant; sets BOTH the repulsion slope and the adhesion (well)

    depth simultaneously (they are not independently tunable). Shared scalar (default 1.0) or a

    per-cell StateFieldSpec combined per pair by arithmetic-mean mix.

    '
  r_cutoff_frac: 'interaction_range -- cutoff distance as a multiple of the contact distance sigma=r_i+r_j

    (default 2.5); energy is shifted to 0 and truncated at r_c=r_cutoff_frac*sigma, force vanishes

    beyond. Constructor requires r_cutoff_frac > 1 (clamp must sit beyond contact).

    '
state_io:
  reads:
  - position
  - radius
  - alive
  writes: []
surprises:
- 'NOT IN THE PAPER. The paper (Methods p. 9 and SI p. 14) defines a single mechanical potential,

  the Morse well. Harmonic -- and SoftSphere, Hertzian, LennardJones -- are library-only pair

  potentials added by this implementation. A reimplementer working from the paper alone would

  implement only Morse and never encounter this class.

  '
- 'The down-shift is the whole point, and easy to drop. A naive "harmonic spring" 0.5*k*(r-sigma)^2

  has its minimum value 0 at contact and grows without bound (purely repulsive, infinite range).

  Subtracting (r_c-sigma)^2 makes the well minimum NEGATIVE (=-well depth) at contact and lets the

  energy hit 0 exactly at r_c, which is what turns it into a finite-range ADHESIVE well (attractive

  for sigma<r<r_c). Forget the shift and you lose both adhesion and the truncation.

  '
- 'C0-only cutoff: unlike Morse/LJ (C1 _smooth_cutoff) and SoftSphere/Hertzian (compact C1 tail),

  Harmonic hard-truncates with a bare jnp.where, so the FORCE is discontinuous at r_c -- it jumps

  from -k*(r_c-sigma) to 0. The docstring calls this harmless because r_c (2.5*sigma) sits well

  beyond the resting contact distance; a reimplementer who "fixes" it with a smoothing changes the

  force law.

  '
- 'sigma-relative range. r_cutoff_frac multiplies sigma = r_i + r_j (the per-pair sum of radii),

  NOT an absolute distance, so the interaction range scales with cell size and stays

  size-consistent as cells grow. Two combining rules coexist in one potential: sigma uses an

  ADDITIVE rule (r_i+r_j), while the coupling k uses an arithmetic-MEAN mix (0.5*(k_i+k_j),

  deliberately not the Lorentz-Berthelot geometric mean -- no sqrt, so the gradient stays finite

  at zeros/dead cells).

  '
- 'Self and dead-pair terms ARE computed then masked. pair_energy at the r=0 self-diagonal returns

  a nonzero value (0.5*k*(sigma^2-(r_c-sigma)^2)); correctness depends entirely on neighbor_sum

  masking self-pairs and dead cells, and on the leading 0.5 in total_energy that avoids

  double-counting the symmetric (N,N) matrix. Skip either and the energy is wrong without crashing.

  '
- 'Forces are autodiff, not analytic: forces = -jax.grad(total_energy). There is no hand-written

  force; the jnp.where truncation is differentiated directly (fine because U is a plain polynomial

  inside the cutoff, so no double-where NaN guard is needed as in the _compact_repulsion helpers).

  '
verdict: new
of: null
implementation_of: adhere
why: "VERDICT: `new`, contract `adhere` (implementation_of: adhere). Harmonic is one force-law SHAPE\n\
  of a pairwise cell-cell MECHANICAL-INTERACTION contract the frozen 42 do not carry -- the same\ncontract\
  \ its sibling SoftSphere (order 15) already named `adhere`. This RETRACTS the earlier\nalias -> attraction_repulsion\
  \ on this entry, and it resolves the skeptic's dispute in the\nskeptic's favour, on the SOURCE (rule\
  \ 5).\n\nTHE SOURCE SETTLES THE DISPUTE. The skeptic asked whether `attraction_repulsion` actually reads\n\
  a per-cell `radius` and builds a per-pair contact distance, or uses a fixed global sigma with\nper-type\
  \ params. Read at source, attraction_repulsion.py is unambiguous:\n  - REQUIRES_PARAMS = [\"sigma\"\
  ]; self.sigma = float(params[\"sigma\"]) -- ONE global scalar width,\n    never r_i + r_j (lines 32,\
  \ 43, 62).\n  - REQUIRES_TYPE_PROPS = [\"p\"] -- a PER-TYPE vector p=[pull, pull_range, push, push_range]\n\
  \    keyed by node_type (lines 33, 61), not a per-cell coupling.\n  - it reads pos / edge_index / node_type\
  \ / type_params over a rewired neighbour graph and NEVER\n    reads `radius`; set = \"particle\".\n\
  \  - EMIT = \"velocity\": a hand-coded two-Gaussian dpos_i = sum_j f(r_ij)*(pos_j - pos_i)\n    (lines\
  \ 30, 63-68). No energy, no autodiff force, no virial.\nThat is the D'Orsogna self-propelled-particle\
  \ law. Harmonic instead READS the physical `radius`\nto form a per-pair, size-consistent contact distance\
  \ sigma = r_i + r_j (its excluded volume and\nadhesion range TRACK cell growth and division -- load-bearing\
  \ for a morphogenesis model whose\ncells grow and divide), takes a per-CELL stiffness k symmetrised\
  \ by the arithmetic-mean mix, and\nis ENERGY-defined (force = -grad(total_energy) by autodiff, plus\
  \ a virial pressure). Both force\nPROFILES read \"long pull, short push\", but the typed SIGNATURES\
  \ -- what is read, how sigma is\nset, per-cell vs per-type coupling, velocity-law vs energy -- are different\
  \ contracts. The\nforce-shape similarity that motivated the earlier alias does not survive the signature.\n\
  \nNOT `refinement` of attraction_repulsion. To host Harmonic, attraction_repulsion would have to\nstart\
  \ reading `radius`, replace its fixed global sigma with a per-pair r_i + r_j, swap its\nper-type p for\
  \ a per-cell coupling, become an energy that emits a force + virial instead of a\nvelocity, and change\
  \ set particle -> cell. That is not a widening that leaves existing callers\nintact -- it DELETES the\
  \ fixed-width, per-type, velocity-emitting pattern-forming particle model\nthat IS the contract, breaking\
  \ every current attraction_repulsion user. A refinement no existing\nuser could pay for is a breaking\
  \ change, not a refinement.\n\nWHY `new`, and why `adhere` is named only via implementation_of. No frozen\
  \ contract carries the\nsize-consistent, energy-based, per-cell pairwise CELL-mechanics signature:\n\
  \  - attraction_repulsion (closest by force shape) -- global sigma, per-type p, velocity, no\n    radius,\
  \ set particle (above).\n  - separation / cohesion -- boids steering: a per-type weight times a mean\
  \ neighbour offset\n    (separation adds a 1/|d|^2 divergence), emitting an acceleration; no radius,\
  \ no contact\n    distance, no energy, and each covers only one half of the interaction. Turning either\
  \ into a\n    size-dependent soft-matter potential converts a heuristic steering rule into hard mechanics\n\
  \    -- different biology.\n  - squared_law -- inverse-square with no soft core, no cell size, no adhesion.\n\
  \  - stillinger_weber -- IS energy-defined, but its contract is a THREE-BODY angular (tetrahedral)\n\
  \    penalty over a global sigma length scale; it is many-body coordination, not a radius-derived\n\
  \    isotropic pairwise excluded-volume + adhesion. So \"energy-defined\" ALONE does not mint or\n \
  \   locate this contract; the physical-radius read + per-pair contact + per-cell coupling do.\nBecause\
  \ the fitting contract `adhere` is absent from the frozen 42 and R4 forbids a\nnon-registered `of:`\
  \ target, the verdict can only be `new`, with `adhere` named as the shared\nimplementation_of.\n\nFAMILY\
  \ CONSISTENCY (matches SoftSphere; corrects the parent/Morse/Hertzian majority). All five\nPairwisePotential\
  \ shapes -- Morse, SoftSphere, Hertzian, Harmonic, LennardJones -- share ONE\ntyped signature and differ\
  \ ONLY in the pair-energy law U(r); by the record's collapse rule they\nare ONE contract with several\
  \ implementations. Harmonic is a second CORE+TAIL member alongside\nMorse and LennardJones (adhesion\
  \ ON); SoftSphere and Hertzian are the SAME contract with\nadhesion OFF (purely repulsive). So implementation_of:\
  \ adhere for all five. I DEPART from the\nparent PairwisePotential / Morse / Hertzian entries that landed\
  \ alias -> attraction_repulsion:\nthose rest on the factual claim that attraction_repulsion carries\
  \ the pairwise-cell-mechanics\nsignature, which the source refutes. SoftSphere (order 15) confronted\
  \ the actual signature and\ngot it right; I follow it. This is NOT yield inflation -- the whole family\
  \ collapses to ONE new\ncontract, not five, which is exactly the several-implementations-per-contract\
  \ shape the ledger\nwants, under the CORRECT home. Finding a single genuinely-new mechanical-interaction\
  \ contract\n(size-consistent, energy-based, per-cell pairwise cell mechanics) is the honest measurement.\n\
  \nSCOPE / SOURCE notes. NOT IN THE PAPER (rule 5, SOURCE wins): the paper (Methods p. 9, SI p. 14)\n\
  defines only the Morse potential; Harmonic is a library-only alternative shape with the same\nsigma\
  \ = r_i + r_j contact convention -- a reimplementer from the paper alone would never\nencounter it,\
  \ but the SOURCE carries it and it normalizes to the same contract Morse's true home\nis. The per-cell\
  \ VIRIAL PRESSURE the base derives from this energy is NOT an output of this\ninteraction contract;\
  \ it is the separate VirialStress entry's mechanism (it writes a `stress`\nfield), kept out of scope\
  \ here. Default magic constants (k = 1.0, r_cutoff_frac = 2.5,\nr_cutoff_frac > 1 enforced at construction)\
  \ are code-only numerics absent from the paper.\nHarmonic's single k sets BOTH the repulsion slope AND\
  \ the adhesion depth (a NARROWER knob set\nthan Morse's independent epsilon/alpha), and its C0 hard\
  \ truncation makes the force discontinuous\nat r_c -- implementation properties recorded in surprises,\
  \ below the contract signature.\n"
